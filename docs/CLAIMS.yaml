  - id: run-evidence
    claim: A saved run's detail traces one stored result point through the analysis, capture, calibration as applied, run, definition version, build and Studio provenance the record stores, and lists a reproducibility checklist whose items are recorded, partial or not recorded, each with its reason; nothing is inferred, a missing field reads "not recorded", no item is recorded without its field, and there is no score
    source: .ai/repo/adrs/0044-evidence-on-a-run-lineage-and-reproducibility-checklist.md
