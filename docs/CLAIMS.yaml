# Claims matrix: what OSCILLA does today, and what it is planned to do, one sentence each,
# with the file that defines the behaviour, the file that implements it and the test that
# proves it. The product features under .ai/repo/features/ and the use cases under
# .ai/repo/use-cases/ name these claims by id; `majordomus knowledge edges` resolves every
# path below to a tracked node (specified_by, implemented_by, tested_by) and fails on a path
# the repository does not contain.
#
# fields (claim/v1):
#   claim           one sentence, present tense for guaranteed, plain future for planned
#   source          the file that defines the behaviour (an ADR, a rule, a specification)
#   implementation  the file that implements it, or "-" when nothing does
#   test            the test that proves it, or "-" when none does
#   status          one of the statuses below
#
# Every guaranteed claim names a test that a release-gate script runs (`npm test`,
# `npm run test:engine`, `npm run test:measure` or `npm run test:browser`), and CI blocks a
# merge on its failure.
# Majordomus's evidence ledger records only its own runners (test/run.sh, cargo test), so
# `majordomus-cli evidence show` reports these claims `unrunnable`: the proof is the CI run,
# not the ledger. That is a limit of the tool, stated here rather than hidden.
version: 1

statuses:
  - id: guaranteed
    meaning: Implemented, and a test in the release gate proves it; CI blocks a merge when it fails.
  - id: planned
    meaning: Specified and not implemented on the branch that carries the claim. Named so the omission is visible.

claims:
  # ---- V2, shipped
  - id: tone-plays-and-releases
    claim: Holding play sounds the tone at the set relative gain, and releasing it leaves no audio node running
    source: .ai/repo/adrs/0015-native-web-audio-engine-extended-in-place.md
    implementation: src/js/audio/audio-engine.js
    test: tests/browser/app.cjs
    status: guaranteed
    note: Check hold-plays-release-zero-nodes, in Chromium, Firefox and WebKit, from file:// and from a /oscilla/ sub-path.

  - id: patterns-match-v1
    claim: Every V1 signal pattern plans exactly the automation the frozen V1 file planned
    source: .ai/repo/adrs/0014-v1-behaviour-frozen-by-golden-vectors.md
    implementation: src/js/audio/patterns.js
    test: tests/unit/freeze.test.mjs
    status: guaranteed
    note: Golden vectors from index.html@a7b7a23 (tests/freeze/golden-a7b7a23.json) replayed against the V2 modules.

  - id: sweep-rises-through-range
    claim: A sweep pattern plays a frequency that rises through the requested range, and stopping it leaves no audio node running
    source: .ai/repo/adrs/0004-continuous-repeat-schedule-window.md
    implementation: src/js/audio/scheduler.js
    test: tests/browser/app.cjs
    status: guaranteed
    note: Check pattern-select-plays-sweep (200 Hz to 4 kHz in 2 s, so the run stays short); the default sweep is 20 Hz to 20 kHz log over 10 s.

  - id: dual-oscillator-beats
    claim: Two oscillators at 440 Hz and 442 Hz mixed to mono produce a level envelope beating at 2 Hz, and the stereo split puts one on each channel
    source: .ai/repo/adrs/0015-native-web-audio-engine-extended-in-place.md
    implementation: src/js/audio/modulation.js
    test: tests/browser/engine-v1port.cjs
    status: guaranteed

  - id: spectrum-peak-accuracy
    claim: The spectrum reads a bin-centred full-scale sine at 0 dB relative to full scale and interpolates the peak frequency between bins
    source: .ai/repo/adrs/0017-relative-levels-spl-only-when-calibrated.md
    implementation: src/js/analysis/peak-detector.js
    test: tests/unit/analysis-peak.test.mjs
    status: guaranteed

  - id: spectrogram-mapping
    claim: The spectrogram maps relative level to colour through a monotone lookup table on a log or linear frequency axis
    source: .ai/repo/adrs/0016-renderer-split.md
    implementation: src/js/analysis/spectrogram.js
    test: tests/unit/analysis-spectrogram.test.mjs
    status: guaranteed

  - id: microphone-analysis-only
    claim: Starting the microphone requests audio with echo cancellation, noise suppression and automatic gain control off, feeds it to an analyser and never to the output, and stopping it ends every track
    source: .ai/repo/rules/project/no-fake-science.v1.md
    implementation: src/js/audio/microphone.js
    test: tests/unit/engine.test.mjs
    status: guaranteed

  - id: generator-mic-compare
    claim: The generator-versus-microphone comparison reports the frequency difference in hertz and cents and flags a match, a harmonic, a mismatch or no signal
    source: .ai/repo/rules/project/no-fake-science.v1.md
    implementation: src/js/analysis/compare.js
    test: tests/unit/analysis-misc.test.mjs
    status: guaranteed
    note: Uncalibrated by design; the level is a relative analyser level.

  - id: sequencer-safe-automation
    claim: The sequencer compiles a block timeline into sorted Web Audio automation whose gain never reaches zero and whose frequencies stay inside 20 Hz and the safe maximum
    source: .ai/repo/rules/project/audio-engine-discipline.v2.md
    implementation: src/js/sequencer/compiler.js
    test: tests/unit/sequencer-compiler.test.mjs
    status: guaranteed

  - id: lowpass-attenuates
    claim: An enabled 500 Hz low-pass attenuates a 5 kHz tone below a fifth of its level, and bypassing it restores the level
    source: .ai/repo/adrs/0015-native-web-audio-engine-extended-in-place.md
    implementation: src/js/audio/filters.js
    test: tests/browser/app.cjs
    status: guaranteed
    note: Check labs-basic; the filter response curve is also compared with getFrequencyResponse in tests/browser/labs.cjs, not yet in the gate.

  - id: adsr-envelope-semantics
    claim: The ADSR envelope schedules attack, decay, sustain and release with Web Audio set, linear and exponential semantics, and a release mid-segment continues from the current value
    source: .ai/repo/adrs/0015-native-web-audio-engine-extended-in-place.md
    implementation: src/js/audio/envelope.js
    test: tests/unit/audio-envelope.test.mjs
    status: guaranteed

  - id: additive-coefficients-play
    claim: Additive synthesis plays a PeriodicWave whose harmonic coefficients are exactly the ones the harmonic bars draw
    source: .ai/repo/adrs/0015-native-web-audio-engine-extended-in-place.md
    implementation: src/js/audio/additive.js
    test: tests/unit/audio-synthesis.test.mjs
    status: guaranteed

  - id: phase-and-lissajous-model
    claim: The phase view and the Lissajous figure are computed from the two frequencies and phases, one period for near-unison pairs
    source: .ai/repo/adrs/0016-renderer-split.md
    implementation: src/js/charts/phase-model.js
    test: tests/unit/charts.test.mjs
    status: guaranteed

  - id: stereo-correlation-meter
    claim: The stereo correlation meter reads +1 in phase, -1 inverted and about 0 in quadrature, and resets on silence
    source: .ai/repo/adrs/0015-native-web-audio-engine-extended-in-place.md
    implementation: src/js/analysis/correlation.js
    test: tests/unit/analysis-misc.test.mjs
    status: guaranteed

  - id: bioacoustics-cited
    claim: Every hearing range and call band shown comes from a cited publication, carries its criterion, and is shown with a disclaimer
    source: .ai/repo/rules/project/no-fake-science.v1.md
    implementation: src/js/data/bioacoustics.js
    test: tests/unit/bioacoustics.test.mjs
    status: guaranteed

  - id: link-restores-configuration
    claim: A copied link restores the instrument configuration through the validated path, with the gain capped
    source: .ai/repo/adrs/0023-schema-versions-independent-of-product-version.md
    implementation: src/js/core/url-state.js
    test: tests/unit/core.test.mjs
    status: guaranteed
    note: The browser round trip is check url-copy-round-trip in tests/browser/app.cjs.

  - id: presets-save-and-load
    claim: A saved preset is stored locally and loading it restores the same configuration; blocked storage never throws
    source: .ai/repo/adrs/0023-schema-versions-independent-of-product-version.md
    implementation: src/js/core/storage.js
    test: tests/browser/app.cjs
    status: guaranteed
    note: Check presets-save-load; storage migration and blocked storage in tests/unit/core.test.mjs.

  - id: wav-export-valid
    claim: WAV export writes a valid RIFF/WAVE file (16-bit PCM or 32-bit float) of the current signal that parses back to the same samples
    source: .ai/repo/adrs/0015-native-web-audio-engine-extended-in-place.md
    implementation: src/js/audio/wav.js
    test: tests/unit/audio-wav.test.mjs
    status: guaranteed
    note: The exported file from the running app is checked by wav-export-valid in tests/browser/app.cjs (format 1, 16 bits, 2 channels).

  - id: config-file-round-trip
    claim: An exported configuration file carries every specified key and no runtime objects, and importing it restores the configuration through the validated path
    source: .ai/repo/adrs/0023-schema-versions-independent-of-product-version.md
    implementation: src/js/ui/config-file.js
    test: tests/unit/integration-ui.test.mjs
    status: guaranteed
    note: The browser round trip is check config-export-import-round-trip in tests/browser/app.cjs.

  - id: single-file-build
    claim: The build packs the modular source into one dist/index.html deterministically, inlining styles, vendor scripts and the application as classic scripts
    source: .ai/repo/adrs/0011-modular-source-one-committed-dist.md
    implementation: scripts/pack-single-file.mjs
    test: tests/unit/pack-single-file.test.mjs
    status: guaranteed

  - id: dist-self-contained
    claim: The committed dist/index.html loads nothing at runtime; module scripts, import maps, external scripts and runtime fetches are refused
    source: .ai/repo/rules/project/single-file-deliverable.v2.md
    implementation: scripts/verify-dist.mjs
    test: tests/unit/verify-dist.test.mjs
    status: guaranteed

  - id: opens-from-file-and-subpath
    claim: The built page boots without console errors and plays in Chromium, Firefox and WebKit, both from file:// and from a /oscilla/ sub-path as GitHub Pages serves it
    source: .ai/repo/adrs/0012-self-contained-runtime.md
    implementation: src/index.html
    test: tests/browser/app.cjs
    status: guaranteed

  - id: about-is-last-workspace
    claim: About is the last primary navigation item; it opens a full-width view that explains OSCILLA, with exact source, Majordomus and contact links, laid out without overflow from 320 to 1536 px
    source: .ai/repo/project/issues/V248.yaml
    implementation: src/index.html
    test: tests/browser/app.cjs
    status: guaranteed
    note: Check about-page, in Chromium, Firefox and WebKit, from file:// and from a /oscilla/ sub-path; tests/browser/layout.cjs keeps the view's content inside its box.

  - id: about-provenance-matches-git
    claim: The development times the About view states are the commit times of the commits it names
    source: .ai/repo/project/issues/V248.yaml
    implementation: src/index.html
    test: tests/unit/about.test.mjs
    status: guaranteed
    note: Checked against git history where it is complete; a shallow clone skips the comparison and still checks the stated duration against the stated times.

  # ---- V3 MEASURE (milestones M012-M020), on feature/v3. `npm test` runs tests/unit/v3-*.test.mjs;
  # `npm run test:measure` runs tests/browser/v3-measure.cjs and tests/browser/v3-ui.cjs; both
  # are in the release gate. Every browser check runs on a TEST CONTEXT digital loopback or a
  # fake microphone: no automated test proves how a physical speaker, room or microphone behaves.
  - id: measurement-workbench
    claim: The Measure workspace, separate from the Playground, takes a measurement through setup check, noise check, sweep, analysis and review to a saved experiment, and the instrument cannot play while a measurement owns the output
    source: docs/specs/oscilla-v3-measure.md
    implementation: src/js/ui/measure.js
    test: tests/browser/v3-ui.cjs
    status: guaranteed
    note: Checks loopback-workflow and output-exclusive, in Chromium, Firefox and WebKit, from file:// and from a /oscilla/ sub-path; the state machine and the engine flow are in tests/unit/v3-measurement-core.test.mjs and tests/unit/v3-engine.test.mjs.

  - id: measurement-abort-releases-everything
    claim: Aborting a measurement in preflight, noise check, armed, measuring or analysing, by Escape, STOP, page hide or leaving the workspace, ends it ABORTED with no audio node, source, capture, worklet port or input track left
    source: .ai/repo/rules/project/audio-engine-discipline.v2.md
    implementation: src/js/measurement/capture.js
    test: tests/browser/v3-ui.cjs
    status: guaranteed
    note: Check abort-stages; tests/browser/v3-measure.cjs counts nodes and unended sources independently after an abort mid-sweep, and tests/unit/v3-engine.test.mjs aborts from every active state on a fake io.

  - id: measure-from-file-and-subpath
    claim: The Measure and Experiments workspaces of the built page run in Chromium, Firefox and WebKit from file:// and from a /oscilla/ sub-path, with the capture worklet loaded from a data URL and no console errors
    source: .ai/repo/adrs/0012-self-contained-runtime.md
    implementation: src/js/measurement/capture.js
    test: tests/browser/v3-ui.cjs
    status: guaranteed
    note: Every v3-ui.cjs check runs per browser and origin and ends with no-console-errors; tests/browser/v3-measure.cjs loads the worklet from a data URL (or the documented ScriptProcessor fallback) on both origins.

  - id: calibration-profiles
    claim: A frequency-response calibration profile is imported from CSV, TXT or JSON with line-numbered errors, identified by the SHA-256 of its normalised points, interpolated linearly in dB over log frequency and never extrapolated by the application; uncovered frequencies stay uncorrected and marked
    source: .ai/repo/adrs/0020-calibration-semantics.md
    implementation: src/js/calibration/interpolate.js
    test: tests/unit/v3-calibration.test.mjs
    status: guaranteed
    note: Parsing is src/js/calibration/parse.js, identity src/js/calibration/profile.js; the import through the UI is check calibration in tests/browser/v3-ui.cjs. Profiles are kept in page memory only.

  - id: spl-only-with-level-calibration
    claim: No level is labelled dB SPL unless a valid absolute level calibration with an explicit external reference applies; otherwise every level is dB relative (dBFS-like) and marked UNCALIBRATED
    source: .ai/repo/adrs/0017-relative-levels-spl-only-when-calibrated.md
    implementation: src/js/calibration/level.js
    test: tests/unit/v3-calibration.test.mjs
    status: guaranteed
    note: The rendered workspaces are searched for SPL by check no-spl in tests/browser/v3-ui.cjs; views, CSV and quality reasons in tests/unit/v3-views.test.mjs, tests/unit/v3-gaps.test.mjs (G19) and tests/unit/v3-quality.test.mjs.

  - id: transfer-function
    claim: The transfer function of the playback and capture chain is recovered from a captured log sweep, a known flat gain within 0.1 dB and known filters within 0.5 dB of their analytic magnitude, with phase only under a robust alignment and a valid range that ends where the signal is less than 10 dB above the noise
    source: .ai/repo/adrs/0021-sweep-deconvolution-method.md
    implementation: src/js/measurement/transfer.js
    test: tests/unit/v3-transfer-ir.test.mjs
    status: guaranteed
    note: Synthetic systems with mathematically known answers; the real-browser loopback through a BiquadFilterNode is tests/browser/v3-measure.cjs.

  - id: impulse-response
    claim: The impulse response is derived by regularised spectral deconvolution of the captured sweep, an identity system giving one peak at the pre-roll within one sample and a 0.5 echo reading -6.02 dB within 0.5 dB, and windowing and normalisation return new objects that never alter the original
    source: .ai/repo/adrs/0021-sweep-deconvolution-method.md
    implementation: src/js/measurement/impulse-response.js
    test: tests/unit/v3-transfer-ir.test.mjs
    status: guaranteed
    note: The Farina inverse filter (oscilla.ir.farina-inverse.v1) is the test oracle and agrees on peak index and in-band scale.

  - id: rta-bands
    claim: Octave and one-third-octave band levels integrate power between the base-10 band edges below 0.95 of Nyquist, and the band averager in fast and slow mode reaches 63.2 percent of a step after one time constant whatever the frame rate
    source: docs/specs/oscilla-v3-measure.md
    implementation: src/js/measurement/rta.js
    test: tests/unit/v3-rta-aggregate.test.mjs
    status: guaranteed
    note: No IEC 61260-1 class is claimed. The RTA view (bars over band edges, peak hold, freeze, relative unless calibrated) is tested in tests/unit/v3-views.test.mjs.

  - id: reproducible-experiments
    claim: Every saved measurement is an experiment that records its recipe, output level, input device and constraints, calibration, sample rate, runs, quality, algorithm IDs, product version and build, with a configuration hash and a result hash
    source: .ai/repo/adrs/0019-recipe-versus-experiment.md
    implementation: src/js/experiments/schema.js
    test: tests/unit/v3-experiments.test.mjs
    status: guaranteed
    note: The experiment the UI builds from a measurement is checked in tests/unit/v3-ui.test.mjs; repeating it creates a new experiment with repeatOf (check loopback-workflow in tests/browser/v3-ui.cjs).

  - id: experiment-round-trip
    claim: An experiment survives create, encode, JSON and validate identically, its typed arrays written as explicit little-endian base64 that decodes bit for bit
    source: .ai/repo/adrs/0023-schema-versions-independent-of-product-version.md
    implementation: src/js/experiments/encode.js
    test: tests/unit/v3-experiments.test.mjs
    status: guaranteed
    note: The pipeline from a sweep to a validated experiment is in tests/unit/v3-pipeline.test.mjs, with repeated runs in tests/unit/v3-storage.test.mjs; the exported file re-validates in check experiments of tests/browser/v3-ui.cjs.

  - id: experiment-import-validated
    claim: An imported experiment is untrusted input; oversized files, length mismatches, wrong types, non-finite numbers, unknown algorithm IDs, prototype keys, a future schema version or a result hash mismatch are refused with a reason and nothing is stored
    source: .ai/repo/adrs/0022-experiment-persistence.md
    implementation: src/js/experiments/validate.js
    test: tests/unit/v3-experiments.test.mjs
    status: guaranteed
    note: The result-hash check is in tests/unit/v3-integration.test.mjs (G13); import through the UI, and the refused re-import of an existing ID, is check experiments in tests/browser/v3-ui.cjs.

  - id: experiment-persistence
    claim: Experiments persist in the browser IndexedDB database oscilla-experiments, survive reopening, are deleted only explicitly, and fall back to an in-memory store that says so when IndexedDB is unavailable
    source: .ai/repo/adrs/0022-experiment-persistence.md
    implementation: src/js/experiments/store.js
    test: tests/unit/v3-experiments.test.mjs
    status: guaranteed
    note: Proven on an in-process IndexedDB fake (open, upgrade, CRUD, reopen, quota, open failure, memory fallback); the UI path (list, rename, duplicate, delete with confirmation) is check experiments in tests/browser/v3-ui.cjs. No test reloads a real browser page and reads the record back.

  - id: algorithm-ids-on-results
    claim: Every stored result names the algorithm that produced it by a versioned ID, an unknown ID is refused on import, and every known ID reproduces its golden output
    source: .ai/repo/adrs/0024-versioned-algorithm-ids.md
    implementation: src/js/measurement/algorithms.js
    test: tests/unit/v3-golden.test.mjs
    status: guaranteed
    note: Fixtures under tests/unit/fixtures/v3/; the IDs stamped on real results are pinned in tests/unit/v3-integration.test.mjs (G6, G7, G9) and unknown IDs refused in tests/unit/v3-experiments.test.mjs.

  - id: measurement-comparison
    claim: Comparing experiments flags differences in calibration, sample rate, stimulus and algorithm, and shows A minus B only over the overlapping valid range of equivalent experiments, never normalised
    source: .ai/repo/adrs/0019-recipe-versus-experiment.md
    implementation: src/js/experiments/compare.js
    test: tests/unit/v3-experiments.test.mjs
    status: guaranteed
    note: The compare view is in tests/unit/v3-views.test.mjs; check experiments in tests/browser/v3-ui.cjs compares an equivalent pair (delta shown) and a non-equivalent pair (refused with the reason).

  - id: aggregate-primary-response
    claim: A measurement of two or more runs stores the aggregate (centre, dispersion and repeatability) as its primary response; the stored transfer is the aggregate centre marked as derived, never one run, and comparison uses the aggregate
    source: .ai/repo/adrs/0019-recipe-versus-experiment.md
    implementation: src/js/measurement/aggregate.js
    test: tests/unit/v3-storage.test.mjs
    status: guaranteed
    note: Gap G20 of docs/v3/algorithms.md, enforced by src/js/experiments/schema.js and validate.js. The engine runs repeats without overlapping captures (tests/unit/v3-engine.test.mjs, three runs); the recipe allows 1 to 10.

  - id: measurement-quality
    claim: Every measurement is rated GOOD, USABLE, POOR or INVALID by the versioned rule set oscilla.confidence.v2 from named metrics (signal-to-noise, clipping, dropouts, discontinuities, coverage, repeatability, calibration), always with its reasons
    source: .ai/repo/adrs/0025-data-driven-quality-with-reasons.md
    implementation: src/js/measurement/quality.js
    test: tests/unit/v3-quality.test.mjs
    status: guaranteed
    note: oscilla.confidence.v1 is retained and selectable (tests/unit/v3-gaps.test.mjs, G15); the quality panel never relies on colour alone (tests/unit/v3-views.test.mjs).

  - id: analysis-off-main-thread
    claim: OSCILLA runs the offline measurement analysis in a Worker loaded from a data URL when the platform has Worker, so that no analysis step blocks the main thread, with results bit-identical to the inline fallback
    source: .ai/repo/adrs/0026-audioworklet-and-worker-by-spike.md
    implementation: src/js/measurement/analysis-runner.js
    test: tests/browser/analysis-worker.cjs
    status: guaranteed
    note: Gap G21 of docs/v3/algorithms.md, resolved in M10. Without Worker the engine falls back to analyzeInline, which yields between steps; tests/unit/v3-analysis-task.test.mjs runs the real bundle in a worker thread.
