  - id: no-fake-science-in-shipped-copy
    claim: No text the page or its modules can show claims a medical, therapeutic, wellness, cognitive, pseudoscientific or animal-specific effect, inaudibility, the safety of a frequency, ultrasound below 20 kHz or certification, except in a sentence that negates it
    source: .ai/repo/rules/project/no-fake-science.v2.md
    implementation: src/index.html
    test: tests/unit/no-fake-science.test.mjs
    status: guaranteed
    responsibility: product
    note: Scans src/index.html without comments and the string literals of every module under src/js/, normalised (entities, tags as clause boundaries, collapsed whitespace, concatenated literals); a negation excuses a phrase only where it governs it (its own clause, a negated list of claim nouns, a negation right after it); the matcher is proven on claims, disclaimers and legitimate look-alike copy. Whether dB SPL is shown only under a level calibration is claim spl-only-with-level-calibration.

  # ---- V3 MEASURE (milestones M012-M020), on feature/v3. `npm test` runs tests/unit/v3-*.test.mjs;
  # `npm run test:measure` runs tests/browser/v3-measure.cjs and tests/browser/v3-ui.cjs; both
  # are in the release gate. Every browser check runs on a TEST CONTEXT digital loopback or a
  # fake microphone: no automated test proves how a physical speaker, room or microphone behaves.
  - id: measurement-workbench
    claim: The Measure workspace, separate from the Playground, takes a measurement through setup check, noise check, sweep, analysis and review to a saved experiment, and the instrument cannot play while a measurement owns the output
    source: docs/specs/oscilla-v3-measure.md
    implementation: src/js/ui/measure.js
    test: tests/browser/v3-ui.cjs
    status: guaranteed
    responsibility: product
    note: Checks loopback-workflow and output-exclusive, in Chromium, Firefox and WebKit, from file:// and from a /oscilla/ sub-path; the state machine and the engine flow are in tests/unit/v3-measurement-core.test.mjs and tests/unit/v3-engine.test.mjs.

  - id: measurement-abort-releases-everything
    claim: Aborting a measurement in preflight, noise check, armed, measuring or analysing, by Escape, STOP, page hide or leaving the workspace, ends it ABORTED with no audio node, source, capture, worklet port or input track left
    source: .ai/repo/rules/project/audio-engine-discipline.v2.md
    implementation: src/js/measurement/capture.js
    test: tests/browser/v3-ui.cjs
    status: guaranteed
    responsibility: product
    note: Check abort-stages; tests/browser/v3-measure.cjs counts nodes and unended sources independently after an abort mid-sweep, and tests/unit/v3-engine.test.mjs aborts from every active state on a fake io.

  - id: measure-from-file-and-subpath
    claim: The Measure and Experiments workspaces of the built page run in Chromium, Firefox and WebKit from file:// and from a /oscilla/ sub-path, with the capture worklet loaded from a data URL and no console errors
    source: .ai/repo/adrs/0012-self-contained-runtime.md
    implementation: src/js/measurement/capture.js
    test: tests/browser/v3-ui.cjs
    status: guaranteed
    responsibility: product
    note: Every v3-ui.cjs check runs per browser and origin and ends with no-console-errors; tests/browser/v3-measure.cjs loads the worklet from a data URL (or the documented ScriptProcessor fallback) on both origins.

  - id: calibration-profiles
    claim: A frequency-response calibration profile is imported from CSV, TXT or JSON with line-numbered errors, identified by the SHA-256 of its normalised points, interpolated linearly in dB over log frequency and never extrapolated by the application; uncovered frequencies stay uncorrected and marked
    source: .ai/repo/adrs/0020-calibration-semantics.md
    implementation: src/js/calibration/interpolate.js
    test: tests/unit/v3-calibration.test.mjs
    status: guaranteed
    responsibility: product
    note: Parsing is src/js/calibration/parse.js, identity src/js/calibration/profile.js; the import through the UI is check calibration in tests/browser/v3-ui.cjs. Profiles are kept in page memory only.

  - id: spl-only-with-level-calibration
    claim: No level is labelled dB SPL unless a valid absolute level calibration with an explicit external reference applies; otherwise every level is dB relative (dBFS-like) and marked UNCALIBRATED
    source: .ai/repo/adrs/0017-relative-levels-spl-only-when-calibrated.md
    implementation: src/js/calibration/level.js
    test: tests/unit/v3-calibration.test.mjs
    status: guaranteed
    responsibility: product
    note: The rendered workspaces are searched for SPL by check no-spl in tests/browser/v3-ui.cjs; views, CSV and quality reasons in tests/unit/v3-views.test.mjs, tests/unit/v3-gaps.test.mjs (G19) and tests/unit/v3-quality.test.mjs.

  - id: transfer-function
    claim: The transfer function of the playback and capture chain is recovered from a captured log sweep, a known flat gain within 0.1 dB and known filters within 0.5 dB of their analytic magnitude, with phase only under a robust alignment and a valid range that ends where the signal is less than 10 dB above the noise
    source: .ai/repo/adrs/0021-sweep-deconvolution-method.md
    implementation: src/js/measurement/transfer.js
    test: tests/unit/v3-transfer-ir.test.mjs
    status: guaranteed
    responsibility: product
    note: Synthetic systems with mathematically known answers; the real-browser loopback through a BiquadFilterNode is tests/browser/v3-measure.cjs.

  - id: impulse-response
    claim: The impulse response is derived by regularised spectral deconvolution of the captured sweep, an identity system giving one peak at the pre-roll within one sample and a 0.5 echo reading -6.02 dB within 0.5 dB, and windowing and normalisation return new objects that never alter the original
    source: .ai/repo/adrs/0021-sweep-deconvolution-method.md
    implementation: src/js/measurement/impulse-response.js
    test: tests/unit/v3-transfer-ir.test.mjs
    status: guaranteed
    responsibility: product
    note: The Farina inverse filter (oscilla.ir.farina-inverse.v3, the current method) is the test oracle and agrees on peak index and in-band scale.

  - id: rta-bands
    claim: Octave and one-third-octave band levels integrate power between the base-10 band edges below 0.95 of Nyquist, and the band averager in fast and slow mode reaches 63.2 percent of a step after one time constant whatever the frame rate
    source: docs/specs/oscilla-v3-measure.md
    implementation: src/js/measurement/rta.js
    test: tests/unit/v3-rta-aggregate.test.mjs
    status: guaranteed
    responsibility: product
    note: No IEC 61260-1 class is claimed. The RTA view (bars over band edges, peak hold, freeze, relative unless calibrated) is tested in tests/unit/v3-views.test.mjs.

  - id: level-calibration-bound-to-input
    claim: A level calibration is stored only with the input it was taken with and applies only to a measurement captured from that input, as the measurement engine checks against the input it captures from; a reading typed before any input is known is refused with the reason, a calibration without a binding (an earlier record) never applies to a known input, a record whose calibration is bound to another input than its own is a finding, and records say when a calibration is not bound to an input
    source: .ai/repo/adrs/0017-relative-levels-spl-only-when-calibrated.md
    implementation: src/js/calibration/level.js
    test: tests/unit/v4-measurement-truth.test.mjs
    status: guaranteed
    responsibility: product
    note: Ledger C1 (ADR 0017 resolution 2026-10-06, with the review of #139). The engine check, the record finding at calibration.level.input, the PENDING INPUT CHECK indicator and the devicechange reset are tests/unit/v4-review-139.test.mjs; the MEASURE adapter refusal and the binding are tested in Node through src/js/ui/measure.js; check calibration in tests/browser/v3-ui.cjs refuses a typed reading before the setup check, stores it bound after it, voids it for another input and shows the pending state, and check level-wrong-input runs a measurement on another input than the binding's and finds no dB SPL, in three browsers over file:// and /oscilla/. A browser that exposes no device id binds the sample rate and processing flags only, said as "as far as the browser reports it"; gain and microphone position are never bound.

  - id: measurable-stimulus-only
    claim: A record whose stimulus this build's engine cannot measure (anything but a log sweep) is kept on import with a finding that says so, and Repeat and "Run this definition" refuse it rather than run a log sweep in its place; records the application saves are log sweeps only
    source: .ai/repo/adrs/0043-runs-executed-from-versioned-experiment-definitions.md
    implementation: src/js/experiments/validate.js
    test: tests/unit/v4-measurement-truth.test.mjs
    status: guaranteed
    responsibility: product
    note: Ledger D4 (ADR 0043 resolution 2026-10-06). The one list of what the engine measures is src/js/measurement/engine.js MEASURABLE_STIMULUS_KINDS; MEASURE's measureLoadRecipe refuses such a recipe for every caller. Check unmeasurable-stimulus in tests/browser/v3-ui.cjs imports a white-noise record, shows the finding and refuses Repeat in three browsers over file:// and /oscilla/.

  - id: reproducible-experiments
    claim: Every saved measurement is an experiment that records its recipe, output level, input device and constraints, calibration, sample rate, runs, quality, algorithm IDs, product version and build, with a configuration hash and a result hash
    source: .ai/repo/adrs/0019-recipe-versus-experiment.md
    implementation: src/js/experiments/schema.js
    test: tests/unit/v3-experiments.test.mjs
    status: guaranteed
    responsibility: product
    note: The experiment the UI builds from a measurement is checked in tests/unit/v3-ui.test.mjs; repeating it creates a new experiment with repeatOf (check loopback-workflow in tests/browser/v3-ui.cjs).

  - id: experiment-calibration-as-measured
    claim: A saved experiment records the calibration the measurement engine applied and the notes as they were when the measurement started, never a frequency profile or level calibration loaded or created after the run; a stored or imported experiment whose named calibration its own results contradict stays readable, is marked with that finding and is presented and compared as uncalibrated, never as dB SPL
    source: .ai/repo/adrs/0040-completed-experiment-run-immutable-metadata-separate.md
    implementation: src/js/ui/measure-experiment.js
    test: tests/unit/v3-evidence-at-completion.test.mjs
    status: guaranteed
    note: Through the real UI, checks evidence-at-completion (profile A measured, profile B and a level calibration made after COMPLETE, notes edited, then Save) and older-claim (a file as an earlier version saved it) in tests/browser/v3-ui.cjs. The cross-check is src/js/experiments/validate.js calibrationClaimFindings (code calibration-claim-contradicted; strict for new MEASURE and Studio saves, while Duplicate and import keep a record as it is, finding included). It checks presence, not identity, since a record keeps a profile's id and name but not its points.

  - id: experiment-round-trip
    claim: An experiment survives create, encode, JSON and validate identically, its typed arrays written as explicit little-endian base64 that decodes bit for bit
    source: .ai/repo/adrs/0023-schema-versions-independent-of-product-version.md
