# Claims matrix: what OSCILLA does today, and what it is planned to do, one sentence each,
# with the file that defines the behaviour, the file that implements it and the test that
# proves it. The product features under .ai/repo/features/ and the use cases under
# .ai/repo/use-cases/ name these claims by id; `majordomus knowledge edges` resolves every
# path below to a tracked node (specified_by, implemented_by, tested_by) and fails on a path
# the repository does not contain.
#
# fields (claim/v1):
#   claim           one sentence, present tense for guaranteed, plain future for planned
#   source          the file that defines the behaviour (an ADR, a rule, a specification)
#   implementation  the file that implements it, or "-" when nothing does
#   test            the test that proves it, or "-" when none does
#   status          one of the statuses below
#   responsibility  `product` on every guaranteed claim: it makes the claim a target of
#                   `majordomus usecase coverage` (policy use_cases.coverage.claims)
#   note            where else the claim is proven, and what is not
#
# Every guaranteed claim names a test that a release-gate script runs (`npm test`,
# `npm run test:engine`, `npm run test:measure`, `npm run test:studio` or
# `npm run test:browser`), and CI blocks a merge on its failure.
# tests/unit/knowledge-integrity.test.mjs (in `npm test`) checks that: every path a claim
# names exists, and its test is run by a script .github/workflows/ci.yml runs.
# Majordomus's evidence ledger records only its own runners (test/run.sh, cargo test), so
# `majordomus-cli evidence show` reports these claims `unrunnable`: the proof is the CI run,
# not the ledger. That is a limit of the tool, stated here rather than hidden.
version: 1

statuses:
  - id: guaranteed
    meaning: Implemented, and a test in the release gate proves it; CI blocks a merge when it fails.
  - id: planned
    meaning: Specified and not implemented on the branch that carries the claim. Named so the omission is visible.

