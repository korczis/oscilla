  - id: studio-experiment-provenance
    claim: 'An experiment run from Studio records the Studio schema version, the studioHash and the topology it ran, through the V3 measurement engine.'
    source: docs/specs/oscilla-v3.1-studio.md
    implementation: '-'
    test: '-'
    status: planned
    note: 'Specification sections 106-110; issues V424, V425; ADR 0038.'

  - id: studio-non-drag-operation
    claim: 'Every Studio operation, connecting ports and moving nodes and clips included, can be done from the keyboard without pointer dragging.'
    source: docs/specs/oscilla-v3.1-studio.md
    implementation: '-'
    test: '-'
    status: planned
    note: 'Specification sections 138-144 and 206; issue V428.'

  - id: studio-file-protocol
    claim: 'Studio opens and runs from file:// inside the single dist/index.html, with no network access.'
    source: docs/specs/oscilla-v3.1-studio.md
    implementation: '-'
    test: '-'
    status: planned
    note: 'Specification sections 215-219; issue V430; rule project.single-file-deliverable v2.'
