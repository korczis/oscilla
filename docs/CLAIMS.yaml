  - id: experiment-definitions
    claim: A run records the version of the experiment definition it was executed from, only when it ran exactly that version's recipe; a definition's hash covers its recipe, declared conditions and acceptance criterion but not its name or notes, an edit of those fields appends a version that earlier runs never move to, and a run without an authored definition carries one derived from its own recipe and marked as derived
    source: .ai/repo/adrs/0043-runs-executed-from-versioned-experiment-definitions.md
