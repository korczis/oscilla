<title id="t">OSCILLA signal path: generate, observe, measure, trust</title>
<desc id="d">An illustration, not a measurement. A generated signal on the left passes through a chain of three Signal Path nodes (oscillator, envelope, filter), then splits into a waveform view and a spectrum view, and ends in an evidence card that names what a real OSCILLA result carries: its valid range, its quality reasons and whether its level is calibrated.</desc>
