# The CI model of OSCILLA: which validation gates exist, which job of
# .github/workflows/ci.yml runs each, and which changed paths select them. Majordomus reads it
# (Majordomus 0.29: `check` and `finish` plan and judge a task's gates from it,
# `evidence --gate <id> --exit <status>` records a run, `gates.completion` is the judgement
# every surface reads). ci.yml stays the workflow; this file describes it and
# tests/unit/ci-gates-model.test.mjs fails when the two disagree on the job set, the commands,
# the path selection or the aggregate's needs.
#
# What ci.yml does, and therefore what this model says:
#   - one gate per CI job, and one per browser leg of a job with a browser matrix, named
#     `<job>-<browser>`: a leg is its own runner, its own verdict and its own log;
#   - `runs` is the command a worker runs locally to reproduce the job: the same npm scripts
#     and repository programs as the job's steps, a leg narrowed with OSC_BROWSERS as the
#     job's env narrows it. Setup (npm ci, browser and PulseAudio installs, artifact upload)
#     is not part of a gate;
#   - ci.yml starts on every pull request, and again on its merge-queue entry (merge_group,
#     ADR 0083: the same jobs on main plus the queued pull requests ahead), and filters no
#     path. Its only job conditions are the aggregate's `if: always()`, the flake ledger's
#     (E010: it runs after every job the aggregate judges, on a re-run only, and is skipped on
#     a first attempt; it is never path gated) and (E026) the path-gated jobs'
#     `needs.changes.outputs.runtime != 'false'`: in CI, the base branch's
#     .github/scripts/ci-changes.mjs skips the browser legs (leg-1, leg-2, leg-3) and the
#     visual job for a pull request into main whose every changed path is under
#     .ai/repo/project/, .ai/repo/reviews/, .ai/repo/releases/, docs/ or a top-level *.md (on
#     merge_group the paths of HEAD^1..HEAD, the queued pull request's merge). A local task
#     keeps them: the model does not encode that allowlist (a path class cannot say "every
#     path outside these"), so it over-selects rather than skip a gate the classifier would
#     run. Every gate is `always: true`: every plan selects it, and any changed file can make a
#     recorded run of it stale. The one path class covers the whole tree and names no gate, so
#     a plan reads "affected" with every gate selected as always, never "a changed path is in
#     no class";
#   - `gate` is the aggregate that branch protection requires; it `requires` every gate of
#     the jobs it `needs`, so a failing one leaves it blocked rather than queued. It needs
#     flake-ledger as it needs every job, and its verdict (ci.yml's env VERDICT) drops that
#     job's entry first and only then applies E026's rule, so the ledger reports and never
#     decides the aggregate and its skip is never read as a path-gated one. `runs` lists
#     commands, not the conditions ci.yml runs them under.
#
# Not modelled: .github/workflows/pages.yml (a push to main deploys and verifies Pages, after
# the change has landed; no gate of a task measures it), main-checks.yml (a push to main runs
# the unit, knowledge and browser jobs of ci.yml again on the merge commit, E044; it gates no
# task and its jobs are ci.yml's, held equal by tests/unit/main-checks.test.mjs) and
# cadence.yml (the release lag of main, rule project.deploy-often). No gate is `at-finish` or
# `on-demand`.
#
# Patterns: `**` crosses directories, `*` does not, a pattern without a wildcard names one
# path. Paths are repository-relative, as `git diff --name-only` prints them.
version: 1

gates:
  - id: unit
    job: unit
    always: true
    runs: npm test && npm run version:check && npm run build:check && npm run verify-dist && node scripts/size-report.mjs --base-branch origin/main
    summary: the unit and freeze suites, one product version everywhere, the committed dist equal to a clean rebuild, the artifact rules (single file, no runtime fetch, licence notices, budget), and the size report of dist against the budget and the merge base (a report, never a failure on a size)

  # E026: the classifier is the base branch's copy, extracted with `git cat-file blob`; <event>
  # is pull_request or merge_group, the one command line both events use.
  - id: changes
    job: changes
    always: true
    runs: node .github/scripts/ci-changes.mjs --repo . --event <event> --head HEAD --base-branch origin/<base>
    summary: whether the pull request (on pull_request) or the queued pull request (on merge_group, ADR 0083; its queue merge commit's HEAD^1..HEAD, and only when HEAD has two parents) changes a runtime path (anything outside .ai/repo/project, .ai/repo/reviews, .ai/repo/releases, docs and top-level *.md); runtime=false skips the four path-gated jobs (leg-1, leg-2, leg-3, visual), anything else runs them

  - id: leg-1-chromium
    job: leg-1
    always: true
    runs: OSC_LEG=1 OSC_SUITE_JOBS=2 OSC_BROWSERS=chromium npm run test:leg
    summary: leg 1 of the release gate's browser suites in Chromium (V1 engine, DSP, labs, sequencer, measurement, Studio, synth line, browser gate, control census; file:// and /oscilla/), as tests/browser/lib/shards.cjs deals them over the browser's legs by their measured seconds

  - id: leg-1-firefox
    job: leg-1
    always: true
    runs: OSC_LEG=1 OSC_SUITE_JOBS=2 OSC_BROWSERS=firefox npm run test:leg
    summary: leg 1 of the release gate's browser suites in Firefox (a PulseAudio null sink on the runner) (V1 engine, DSP, labs, sequencer, measurement, Studio, synth line, browser gate, control census; file:// and /oscilla/), as tests/browser/lib/shards.cjs deals them over the browser's legs by their measured seconds

  - id: leg-1-webkit
    job: leg-1
    always: true
    runs: OSC_LEG=1 OSC_SUITE_JOBS=2 OSC_BROWSERS=webkit npm run test:leg
    summary: leg 1 of the release gate's browser suites in WebKit (V1 engine, DSP, labs, sequencer, measurement, Studio, synth line, browser gate, control census; file:// and /oscilla/), as tests/browser/lib/shards.cjs deals them over the browser's legs by their measured seconds

  - id: leg-2-chromium
    job: leg-2
    always: true
    runs: OSC_LEG=2 OSC_SUITE_JOBS=2 OSC_BROWSERS=chromium npm run test:leg
    summary: leg 2 of the release gate's browser suites in Chromium (V1 engine, DSP, labs, sequencer, measurement, Studio, synth line, browser gate, control census; file:// and /oscilla/), as tests/browser/lib/shards.cjs deals them over the browser's legs by their measured seconds

  - id: leg-2-firefox
    job: leg-2
    always: true
    runs: OSC_LEG=2 OSC_SUITE_JOBS=2 OSC_BROWSERS=firefox npm run test:leg
    summary: leg 2 of the release gate's browser suites in Firefox (a PulseAudio null sink on the runner) (V1 engine, DSP, labs, sequencer, measurement, Studio, synth line, browser gate, control census; file:// and /oscilla/), as tests/browser/lib/shards.cjs deals them over the browser's legs by their measured seconds

  - id: leg-2-webkit
    job: leg-2
    always: true
    runs: OSC_LEG=2 OSC_SUITE_JOBS=2 OSC_BROWSERS=webkit npm run test:leg
    summary: leg 2 of the release gate's browser suites in WebKit (V1 engine, DSP, labs, sequencer, measurement, Studio, synth line, browser gate, control census; file:// and /oscilla/), as tests/browser/lib/shards.cjs deals them over the browser's legs by their measured seconds

  - id: leg-3-firefox
    job: leg-3
    always: true
    runs: OSC_LEG=3 OSC_SUITE_JOBS=2 OSC_BROWSERS=firefox npm run test:leg
    summary: leg 3 of the release gate's browser suites in Firefox (a PulseAudio null sink on the runner) (V1 engine, DSP, labs, sequencer, measurement, Studio, synth line, browser gate, control census; file:// and /oscilla/), as tests/browser/lib/shards.cjs deals them over the browser's legs by their measured seconds

  - id: leg-3-webkit
    job: leg-3
    always: true
    runs: OSC_LEG=3 OSC_SUITE_JOBS=2 OSC_BROWSERS=webkit npm run test:leg
    summary: leg 3 of the release gate's browser suites in WebKit (V1 engine, DSP, labs, sequencer, measurement, Studio, synth line, browser gate, control census; file:// and /oscilla/), as tests/browser/lib/shards.cjs deals them over the browser's legs by their measured seconds

  - id: visual
    job: visual
    always: true
    runs: npm run test:visual
    summary: the 1536x1024 --play scene and the MEASURE and STUDIO references against the accepted baselines

  - id: knowledge
    job: knowledge
    always: true
    runs: majordomus doctor --json > doctor.jsonl; jq -e -s -f .github/doctor-verdict.jq doctor.jsonl
    summary: the .ai layer by majordomus doctor at the pinned release; every FAIL fails but the git-hook wiring of policy enforcement, and an output without an OK layout line fails

  # The two process rules judge a pull request, and the program that judges is the base
  # branch's copy (.github/scripts/base-rule.sh); <base>, <pr.json>, <head> and <pr> are the
  # pull request's, and <diff-base> is origin/<base> on pull_request and on merge_group the sha
  # of HEAD^1, which queued-pr.sh checks is the base the queue ref names. Both read the pull
  # request with gh pr view (headRefOid included), and --check-head holds the queue's HEAD^2 to
  # it (a no-op on pull_request, where QUEUED_HEAD is empty).
  # The assignment before the eval fails on queued-pr.sh's exit 2, which eval "$(...)" would not.
  - id: fail-first
    job: fail-first
    always: true
    runs: vars="$(PR=<pr> GITHUB_BASE_REF=<base> .github/scripts/queued-pr.sh)" && eval "$vars" && gh pr view "$PR" --json title,body,headRefName,headRefOid > <pr.json> && .github/scripts/queued-pr.sh --check-head "$QUEUED_HEAD" <pr.json> && .github/scripts/base-rule.sh origin/<base> scripts/fail-first.mjs --pr-json <pr.json> --head <head> --base-branch origin/<base>
    summary: a feat or fix pull request's added or changed unit tests fail on the merge base and pass on the head, or its body says fail-first n/a with a reason (project.fail-first)

  - id: review-verdict
    job: review-verdict
    always: true
    runs: vars="$(PR=<pr> GITHUB_BASE_REF=<base> .github/scripts/queued-pr.sh)" && eval "$vars" && gh pr view "$PR" --json title,body,headRefName,headRefOid > <pr.json> && .github/scripts/queued-pr.sh --check-head "$QUEUED_HEAD" <pr.json> && PR_JSON=<pr.json> .github/scripts/base-rule.sh origin/<base> scripts/review-verdict.mjs --pr <pr> --head HEAD --base-branch <diff-base>
    summary: a pull request that changes a guarded path carries a reviewer's verdict for the content it changes (project.review-verdict)

  - id: gate
    job: gate
    always: true
    requires:
      - unit
      - knowledge
      - fail-first
      - review-verdict
      - changes
      - leg-1-chromium
      - leg-1-firefox
      - leg-1-webkit
      - leg-2-chromium
      - leg-2-firefox
      - leg-2-webkit
      - leg-3-firefox
      - leg-3-webkit
      - visual
      - flake-ledger
    runs: echo "$RESULTS" | jq -e "$VERDICT"
    summary: the required check of branch protection; with flake-ledger's entry dropped first, every job it needs succeeded, or is a path-gated job skipped while changes succeeded with runtime=false (E026); the ledger's result, a skip included, never counts

  - id: flake-ledger
    job: flake-ledger
    always: true
    runs: node scripts/flake-ledger.mjs --repo <owner/name> --run <run> --attempt <attempt> --out flake-ledger.json
    summary: on a re-run only (github.run_attempt above 1; skipped on a first attempt, and never path gated), after every job the aggregate judges, records every job whose last earlier run failed and which passed on this attempt (E010); it reports and decides nothing, and the aggregate drops its result before judging

classes:
  # ci.yml filters no path: a change anywhere runs every job, which `always` already says.
  - id: repository
    paths: ["**"]
    gates: []
