# Review verdict for pull request #255, R022: every pull request names its plan record, judged by
# the base branch (branch feat/r022-pr-metadata-judge). Ninth round (re-review of a merge).
# Reviewed head ef368d75, merge base origin/main 94192a19 (main's tip is 45621450). Round 7
# reviewed 152cacea and requested changes (3efeddbd); between rounds the reviewer and the author
# agreed that install-time code is PR code like a test, so the lockfile guard is not the boundary:
# install-guard is removed, and the one capability install-time code had over a test (npm ci in the
# checkout before the judge's own git archive | tar) is closed by order. This round reviews
# ef368d75: every judge git call of fail-first before any child, through judgeGit (replace objects
# and system/global config off, inherited GIT_* dropped, fsmonitor, hooks and pager off, no external
# diff or textconv); the trees from ls-tree -z and cat-file --batch with links, odd modes and .git
# forms refused; npm ci --ignore-scripts in the extracted head tree with its own HOME; R45;
# persist-credentials: false on the three judge checkouts. Another builder wrote it (oscilla-b0).
#
# The digest: the base branch's scripts/review-verdict.mjs, run from `git archive origin/main
# scripts` with --repo on this worktree: b15190bf...2778 over the 10 guarded paths it names.
#
# How it was reviewed: three independent lenses (order and capability parity, the tree builder and
# judgeGit, regressions and completeness), read-only, with real git 2.55 and npm 10.9.3 fixtures;
# every finding handed to a separate skeptic (19 agents; one finding refuted).
#
# What holds: after the first child the judge only spawns children, removes its tmp dirs and checks
# its copy against the in-memory manifest digest, so no state a child can write is read back except
# as a refusal; the verdict is exit statuses only, and printed TAP names cannot start a workflow
# command; install-time and test-time code have the same env, HOME, uid, network and the same
# reachable state before the judge's next action; writeTree creates with O_EXCL and refuses
# duplicates and malformed entries; the step shell is -eo pipefail with the judge last, and no step
# follows it. Unit tests pass offline; install-guard is gone from code, rules, docs and tests.
#
# Verdict: merge. No P0 or P1 is open. Open and worth doing next, in this PR or a follow-up:
# - R47 (P2): the with and without runs share one HOME, /tmp and node_modules, and run with first,
#   so an ordinary non-idempotent test (a scratch file opened wx) yields "proven" for a PR that
#   changes no source (reproduced). Give each child its own HOME and TMPDIR, and run without first.
# - R48 (P2): a symbolic link anywhere in the head or merge-base tree refuses every feat/fix PR; main
#   has none today. Write links outside tests/ as inert data, or refuse only links that matter, or
#   lint main against them.
# - R49 (P2): a workspace or file: dependency resolves to the head's code in the without tree, so
#   such a PR reads "not proven" where it used to get a clear refusal. Install per tree or refuse
#   link entries with a reason.
# Round 9 (re-review of a merge): head b740b201 merges origin/main, which now carries #252's train
# detection, into the head round 8 accepted (bd2f2a74); the merge base is e2720e07. Main's program
# gives b15190bf...2778 -> 7db72a32...6c49 over the same 10 guarded paths. Reviewed from git (the
# diff bd2f2a74..b740b201 and --remerge-diff), in two lenses with a skeptic each (5 agents; one
# documentation finding refuted).
#
# What holds: git-ref.mjs, judge-isolation.mjs, ci-workflow-rules.mjs, shell-words.mjs and
# base-rule.sh are byte-identical to bd2f2a74; ci.yml keeps #255's form of the pr.json fetch (under
# env -i, before base-rule.sh; GH_TOKEN where R50 found it, no wider); persist-credentials: false is
# on all three judge checkouts and #252 adds no judge job. In fail-first.mjs the train check comes
# after the ptrace probe and the manifest check and returns before the first git call and before
# any child; judgeTrain and trainMembers are pure functions of the PR JSON's body. A feat or fix
# title is tested before the train patterns, so no branch name or title moves a feat or fix PR onto
# the train path; on any other title the train path can only keep "not applicable" or make it
# stricter. Members are body text, as #252 states and as before this merge. Every test of both sides
# is kept; fail-first.test.mjs 31/31 and the whole unit suite pass.
#
# Verdict: merge. One P3 is new (R58).
#
