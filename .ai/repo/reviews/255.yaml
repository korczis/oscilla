# Review verdict for pull request #255, R022: every pull request names its plan record, judged by
# the base branch (branch feat/r022-pr-metadata-judge). Reviewed head
# da28149d9e91ccad2db9d557c563a25a93c8f877, merge base origin/main 94192a19 (main's tip). Another
# builder wrote all of it (oscilla-b0), not me.
#
# The digest: the base branch's scripts/review-verdict.mjs judges this pull request. I ran it from
# `git archive origin/main scripts` with --repo on this worktree, `--content --list --base-branch
# origin/main`: 0cab9798...e3b7 over the 8 guarded paths the base list names (base-rule.sh,
# ci.yml, metadata.yml, ci-workflow-rules.mjs, review-verdict.mjs and three tests). The head's
# own list adds scripts/pr-metadata.mjs, .ai/repo/ci/pr-meta.yaml and their test (R1).
#
# How it was reviewed: five independent lenses, each read-only against this head, and every
# finding handed to a separate skeptic told to refute it unless it reproduced (20 agents):
# - review-verdict.mjs against origin/main, line by line, with fixture repositories;
# - base-vs-head confusion in .github/scripts/base-rule.sh and its three callers;
# - workflow security of ci.yml and metadata.yml (injection, pull_request_target, token scope,
#   masked failures);
# - scripts/pr-metadata.mjs against rule pr-names-its-plan.v1 and pr-meta.yaml;
# - mutation survival in the guarded tests and in pr-metadata.test.mjs.
#
# Verdict: changes-requested, for one open P1 (R2). base-rule.sh resolves the unqualified name
# "origin/$GITHUB_BASE_REF", and every caller checks out with fetch-depth 0, which fetches tags.
# Git looks a short name up in refs/tags/ before refs/remotes/, so a tag named origin/main
# shadows the base branch: the PR's own program then judges, which disables fail-first,
# review-verdict and pr-metadata together, for every later PR. Reproduced in a fixture repo
# ("scripts/review-verdict.mjs of origin/main (<the PR's commit>) judges ... accepted", exit 0).
# No such tag exists on korczis/oscilla today (git ls-remote --tags: 0 shaped like a branch). The
# unqualified rev-parse is already on main, so the defect predates this PR, but this PR adds a
# third caller through it (metadata.yml:66) and touches base-rule.sh, so it is fixed here:
# resolve refs/remotes/origin/$GITHUB_BASE_REF (or github.event.pull_request.base.sha), pass the
# same qualified ref as --base/--base-branch, and refuse a ref that is ambiguous or resolves
# outside refs/remotes/.
#
# Four claims were refuted: that base-rule.sh itself runs from the head (it does, but a change to
# it is a guarded change this verdict binds); that the fallback opens for any base lacking the
# program; that a plan: n/a waiver is refused for a title holding a term like "EBU R128"; and
# that the model check accepts a line that repoints origin/<base>.
