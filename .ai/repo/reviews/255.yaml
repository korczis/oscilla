# Review verdict for pull request #255, R022: every pull request names its plan record, judged by
# the base branch (branch feat/r022-pr-metadata-judge). Second round (re-review).
# Reviewed head dfb5641b6e08, merge base origin/main 94192a19 (main's tip: main has not moved).
# Round 1 reviewed da28149d and requested changes (d267cb2a). This round reviews what changed
# since: the R2 test (6abba178) and the fix (dfb5641b). Another builder wrote them (oscilla-b0),
# not me.
#
# The digest: the base branch's scripts/review-verdict.mjs judges this pull request. I ran it from
# `git archive origin/main scripts` with --repo on this worktree, `--content --list --base-branch
# origin/main`: e50e8d9d...85b2 over the 10 guarded paths the base list names.
#
# How it was reviewed: five independent lenses, read-only against this head, and every finding
# handed to a separate skeptic told to refute it unless it reproduced (13 agents):
# - attempts to defeat the R2 fix in fixture repositories (a tag origin/main, a tag
#   refs/remotes/origin/main, a same-named branch, pushed remote refs, sha forms, a hostile
#   GITHUB_BASE_REF): none defeated it, so R2 is closed;
# - scripts/git-ref.mjs commitOf and its three callers;
# - every workflow caller and the size-report exception;
# - R4-R11 checked by mutation: reintroduce each defect, see whether a test goes red;
# - regressions for a normal PR, a train, the PR that introduces a program, a non-main base, a fork.
#
# Verdict: changes-requested, for one new open P1 (R12). In the fail-first job (ci.yml:392) `npm ci`
# runs on the PR's checkout before the step that calls .github/scripts/base-rule.sh, so the PR's
# own package.json postinstall runs first. A PR that touches no guarded path (package.json,
# package-lock.json and helpers are not guarded) can overwrite base-rule.sh, or write
# NODE_OPTIONS to $GITHUB_ENV or a fake node or git to $GITHUB_PATH, so that the PR's own program
# judges. Reproduced in a fixture: review-verdict says no verdict is needed; base-rule.sh with
# fail-first refuses before npm ci, and after it prints the PR's "fail-first: proven", exit 0.
# The review-verdict job installs nothing and is not affected. Like R2 this predates the pull
# request, but this pull request reworks that job's callers and claims the base branch judges,
# so it is fixed here: `npm ci --ignore-scripts`, or extract the judge from the base commit before
# any PR code runs, and keep PR-written $GITHUB_ENV and $GITHUB_PATH away from the judge step.
