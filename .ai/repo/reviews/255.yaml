# Review verdict for pull request #255, R022: every pull request names its plan record, judged by
# the base branch (branch feat/r022-pr-metadata-judge). Seventh round (re-review).
# Reviewed head 152cacea, merge base origin/main 94192a19 (main's tip is 45621450). Round 6
# reviewed 2c85a146 and requested changes for R34 and R35 (2de6ca5b). This round reviews 152cacea:
# a bundled entry needs its holder's list, a sha512 holder chain and an exact version with no
# source field (R34, R36); every spec is classified by the runner npm's own npm-package-arg (R35);
# the two fixtures pinned (R37); the judge log count (R38). Another builder wrote it (oscilla-b0).
#
# The digest: the base branch's scripts/review-verdict.mjs, run from `git archive origin/main
# scripts` with --repo on this worktree: 06b44ed1...54f6 over the 10 guarded paths it names.
#
# How it was reviewed: four independent lenses (bundled acceptance, npm-package-arg and how npm is
# found, regressions against real lockfiles, the strict-or-edge decision), read-only, with real
# offline npm 10.9.3 fixtures; every finding handed to a separate skeptic (13 agents; none refuted).
#
# R35 holds: no spec npm reads as non-registry was found accepted, and the PR cannot choose the
# node or the npm (recorded by readlink -f before checkout, run under env -i). Unit tests 3235/3235.
#
# The decision asked of the reviewer (strict list or npm's edge rule): the edge rule. The holder's
# bundleDependencies is lock text the PR writes, so membership is not a boundary (a forged list is
# accepted either way); what bounds an accepted bundled entry is (b) and (c): npm then either uses
# the holder tarball's bytes, installs nothing, or fetches name@exact-version from the registry
# (reify.js:759-764). Follow arborist's getBundler exactly: transitive edges from an accepted bundled
# entry (dependencies, optionalDependencies, peerDependencies, resolved by walking up node_modules
# inside the holder's subtree) and its pBundler clause (a child of an accepted bundled entry is
# bundled). State the name@exact-version registry fallback as the residual.
#
# Verdict: changes-requested, for two open P1 bypasses and two P1 over-refusals:
# - R39: a bundled entry at a non-canonical key (`.../node_modules/evil/.`, `evil/`, `./evil`) with a
#   matching name passes; arborist path.resolves the key to `evil`, finds it unlisted, installs it
#   from `evil/.@1.0.0`, which npm-package-arg reads as a checkout directory, and its prepare runs
#   under --ignore-scripts (reproduced twice). Refuse any lock key that is not path.posix.normalize'd,
#   ends in `/`, or has a segment after node_modules/ that validate-npm-package-name (the runner
#   npm's) rejects; require entry.name, when present, to be a valid name too.
# - R40: hasShrinkwrap / _hasShrinkwrap on a lock entry is not refused; npm ci then reads the
#   tarball's own npm-shrinkwrap.json and installs its file:/git: entries outside the guard; a git
#   dependency's prepare runs under --ignore-scripts (reproduced twice). Anyone can publish such a
#   tarball to the registry, so sha512 does not help. Refuse both fields on every entry.
# - R43, R44: the guard refuses lockfiles npm writes for common packages (a registry entry carrying
#   `workspaces`: jest 30, recharts 3, vitefu, eslint 10; unlisted transitive bundled deps:
#   aws-cdk-lib, semantic-release's npm).
