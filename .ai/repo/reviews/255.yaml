# Review verdict for pull request #255, R022: every pull request names its plan record, judged by
# the base branch (branch feat/r022-pr-metadata-judge). Fifth round (re-review).
# Reviewed head 1bc7fa8e, merge base origin/main 94192a19 (main's tip is 20583503). Round 4
# reviewed e9be0c40 and requested changes (f8fa5fb0). This round reviews 1bc7fa8e: no PR code
# before the judge; a `judge` step that extracts the base's copy, writes a manifest and makes it
# read-only; fail-first driving the guard, `npm ci --ignore-scripts` and the PR's tests as
# isolated children with a cleared environment; the verdict as the exit code alone. Another
# builder wrote it (oscilla-b0), not me.
#
# The digest: the base branch's scripts/review-verdict.mjs, run from `git archive origin/main
# scripts` with --repo on this worktree: 3b1ed742...d5a9 over the 10 guarded paths it names.
#
# How it was reviewed: five independent lenses (escape from the isolated children, the guard,
# the manifest, the resolutions by mutation, runnability), read-only, with real offline npm and
# bash fixtures; every finding handed to a separate skeptic (17 agents). Two claims were refuted,
# among them a P1 that sibling with/without test trees could forge a proven verdict.
#
# Verdict: changes-requested, for one open P1 that is about availability, not a bypass (R29).
# No route for a PR's own program to judge was found this round: R12, R17, R18, R22 are closed by
# the judge-driven install and the fixed guard, and R19 is closed by making judge-first advisory.
# R29: install-guard refuses every lock entry with bundled dependencies. Tailwind 4, which the
# accepted ADR 0061 brings back for the Flowbite Pro migration, carries them
# (@tailwindcss/oxide-wasm32-wasi bundles six packages with no resolved/integrity), so the first
# PR that adds it, and every feat/fix PR after it, would fail the required fail-first gate.
# Reproduced with the real lockfile plus @tailwindcss/cli 4.1.14's closure: 19 refusals, exit 1.
# The safe rule: accept an inBundle entry whose bundling parent is a registry.npmjs.org tarball
# with sha512 integrity (its files arrive inside the checked tarball), and refuse it otherwise.
#
# Threat model, for the record: GitHub's hosted Linux runners give the runner user passwordless
# sudo, so neither the ptrace probe nor any isolation keeps a PR's own tests (which fail-first
# runs) from reaching the judge (R31). That is the residual risk the builder states; this
# verdict accepts it as stated, and the pull request body should say sudo, not only ptrace_scope.
