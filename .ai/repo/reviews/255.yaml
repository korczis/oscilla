# Review verdict for pull request #255, R022: every pull request names its plan record, judged by
# the base branch (branch feat/r022-pr-metadata-judge). Third round (re-review).
# Reviewed head a8d72253, merge base origin/main 94192a19 (main's tip is 893cc420; the base the
# verdict program resolves is the merge base). Round 2 reviewed dfb5641b and requested changes
# (76105700). This round reviews a8d72253: `npm ci --ignore-scripts` in fail-first, the new
# judge-first rule in ci-workflow-rules.mjs, the step replay in base-rule.test.mjs, and the
# R5/R7/R8/R13-R16 fixes. Another builder wrote them (oscilla-b0), not me.
#
# The digest: the base branch's scripts/review-verdict.mjs, run from `git archive origin/main
# scripts` with --repo on this worktree: 369b339e...cda2 over the 10 guarded paths it names.
#
# How it was reviewed: four independent lenses, read-only against this head, and every finding
# handed to a separate skeptic told to refute it unless it reproduced (16 agents; none refuted).
# The builder's stated residual risk (fail-first runs the PR's own tests inside the judge step)
# is not reported.
#
# Verdict: changes-requested. R12 is not closed, and the round shows why a list of forbidden
# commands keeps losing: npm runs PR content without any lifecycle script.
# - R17 (P1): `npm ci --ignore-scripts` still runs the `prepare` script of a git dependency. A PR
#   adds `github:<owner>/<repo>#<sha>` to package.json and the lockfile (neither is guarded); the
#   prepare rewrites .github/scripts/base-rule.sh and writes NODE_OPTIONS to $GITHUB_ENV and a
#   directory to $GITHUB_PATH. Reproduced with node 22.20.0 / npm 10.9.3 (setup-node 22).
# - R18 (P1): a PR .npmrc `git=./evil.sh` makes `npm ci --ignore-scripts` spawn a PR file for
#   `ls-remote` and `clone`; the install still succeeds. --ignore-scripts turns off lifecycle
#   scripts, not npm's configurable helper programs.
# - R19 (P1): judge-first (ci-workflow-rules.mjs:393-411) accepts installs that do run scripts:
#   npm behind a wrapper or shell keyword, named through a substitution or a variable, or with a
#   later --no-ignore-scripts / --ignore-scripts=false (npm honours the last flag).
# What closes the class rather than one route: before anything of the PR runs in a judge job,
# extract base-rule.sh and the judging programs from the base commit into $RUNNER_TEMP and
# record an absolute node; the judge step calls that copy with that node and a cleared
# NODE_OPTIONS/PATH, so nothing written to the workspace, $GITHUB_ENV or $GITHUB_PATH reaches
# it. In addition, refuse non-registry `resolved` entries (git, file, http tarballs) in the
# lockfile before installing, and refuse a project .npmrc that sets helper programs. The lint can
# stay as a second line, not the guarantee.
