# Review verdict for pull request #255, R022: every pull request names its plan record, judged by
# the base branch (branch feat/r022-pr-metadata-judge). Sixth round (re-review).
# Reviewed head 2c85a146, merge base origin/main 94192a19 (main's tip is 45621450). Round 5
# reviewed 1bc7fa8e and requested changes for R29 (1a1a959f). This round reviews 2c85a146:
# bundled entries accepted under a sha512 registry parent (R29), the copy and manifest from git
# ls-tree with odd names skipped by warning (R30), sudo stated (R31), specs (R32), the body (R33),
# step and container env: read (R23), and the R5/R27 tests. Another builder wrote it (oscilla-b0).
#
# The digest: the base branch's scripts/review-verdict.mjs, run from `git archive origin/main
# scripts` with --repo on this worktree: 338c3e79...42a1 over the 10 guarded paths it names.
#
# How it was reviewed: four independent lenses (bundled acceptance, the manifest and the skip, the
# spec grammar against npm-package-arg, regressions and the unguarded fixtures), read-only, with
# real offline npm 10.9.3 fixtures; every finding handed to a separate skeptic (10 agents; none
# refuted).
#
# The R30 deviation (an odd name or symlink in the base is skipped with a warning rather than
# failing the step) is accepted: it was checked that a judge program or import that is skipped
# fails closed (ERR_MODULE_NOT_FOUND inside the copy, or base-rule.sh exit 2), never falls back to
# the checkout, and that the warning cannot inject a workflow command.
#
# Verdict: changes-requested, for two open P1s in the guard:
# - R34: an inBundle entry with no resolved and no integrity is accepted without its `version`
#   being read (install-guard.mjs:198). When the sha512-checked parent tarball does not in fact
#   bundle it, npm installs it from the entry's own version: a `file:<dir>` version runs that
#   directory's prepare under --ignore-scripts (reproduced, exit 0, marker written), a `file:x.tgz`
#   installs an unhashed tarball, and a plain version is fetched by name with no integrity. The
#   parent's sha512 does not cover what the parent does not contain. Accept a bundled entry only
#   when its name is in the bundling parent's lockfile `bundleDependencies`, and its version is an
#   exact semver with no other source-bearing field.
# - R35: three spec forms npm-package-arg 12.0.2 reads as checkout directories pass the guard
#   (install-guard.mjs:82,95): `@scope/name@<range>` outside npm:, a bare drive letter (`D:evil`),
#   and a dot-led name (`.evil`, `..x`); npm ci then links a PR directory into node_modules.
#   Hand-written grammar keeps drifting from npm's: classify each spec with the npm-package-arg
#   that ships inside the runner's own npm, loaded by absolute path from the recorded node, and
#   refuse any type other than version, range, tag and alias-of-those.
