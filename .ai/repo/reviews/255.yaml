# Review verdict for pull request #255, R022: every pull request names its plan record, judged by
# the base branch (branch feat/r022-pr-metadata-judge). Fourth round (re-review).
# Reviewed head e9be0c40, merge base origin/main 94192a19 (main's tip is 893cc420). Round 3
# reviewed a8d72253 and requested changes (678ada52). This round reviews e9be0c40: the judge
# extracted from the base into $RUNNER_TEMP/judge, setup-node before checkout, the env -i judge
# step, install-guard.mjs, shell-words.mjs behind judge-first, and the R5/R7/R13/R15/R21 fixes.
# Another builder wrote them (oscilla-b0), not me.
#
# The digest: the base branch's scripts/review-verdict.mjs, run from `git archive origin/main
# scripts` with --repo on this worktree: 2ba62ded...be38 over the 10 guarded paths it names.
#
# How it was reviewed: five independent lenses, read-only against this head, with real offline
# npm 10.9.3 / node 22.20.0 fixtures and real bash 5.3; every finding handed to a separate
# skeptic told to refute it unless it reproduced (25 agents; none refuted). The builder's stated
# non-coverage counted only where shown reachable with the guard in place.
#
# Verdict: changes-requested. The structure is the right direction, but PR code still runs before
# the judge on a guard-clean tree, and it can rewrite the extracted judge:
# - R17 (P1, still open): install-guard checks each lock entry's resolved/integrity but not the
#   dependency maps inside it (dependencies, optionalDependencies, peerDependencies, and the root
#   entry), so a registry entry whose nested `dependencies` names a git spec makes npm ci clone it
#   and run its prepare under --ignore-scripts (exit 0, "added 2 packages").
# - R18 (P1, still open): install-guard splits .npmrc on \r?\n, npm's ini on [\r\n]+, so a key after
#   a lone CR (git=, registry=, node-options=, ...) passes the allowlist and npm uses it.
# - R22 (P1): combined (a lone-CR git=./evil.sh and an optional nested git spec), npm ci spawns the
#   PR's evil.sh with RUNNER_TEMP and GITHUB_ENV in its environment; it overwrote
#   $RUNNER_TEMP/judge/.github/scripts/base-rule.sh and the judge step printed a forged pass,
#   exit 0. The extracted copy is writable by anything that runs before the judge.
# - R19 (P1, still open) and R23 (P1): judge-first is still evadable (keyword-led compounds,
#   substitutions inside $(( )) and ${...}, wrapper options, comment preprocessing, eval-like forms)
#   and never reads workflow/job/step env: or a pre-judge step's shell: (BASH_ENV, NODE_OPTIONS).
#   Those routes edit .github/, which is guarded, so review-verdict is their backstop; the finding is
#   that the rule claims more than the lint can decide.
# What closes the class: no step before the judge runs anything of the PR. Let the judge drive the
# install. The base program, extracted and already loaded, runs `npm ci --ignore-scripts` itself as
# a child with a cleared environment, after the guard (fixed for R17/R18), and only then the PR's
# tests; a child's writes to files, $GITHUB_ENV or $GITHUB_PATH reach only later steps, never the
# already-running judge. Make judge-first advisory in the rule's text rather than a guarantee.
