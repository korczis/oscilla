#
# The digest: the base branch's scripts/review-verdict.mjs, run from `git archive origin/main
# scripts .github/scripts` with --repo on this worktree: de3b34e1...2f7e over the 4 guarded paths
# (impulse-response.js, stimulus.js, views/ir-chart.js, ui/measure.js).
#
# What holds:
# - Measured values are unchanged. fullOverlapFloorDb was only split (fullOverlapTail shares the
#   span); same first/last/count, same summation order. Probes against the base's module (delta,
#   noisy, clipped at 0.1, all-zero capture, post-rolls 4.5 ms to 0.5 s) gave bit-identical
#   samples, peakIndex, noiseFloorDb, noiseFloorMethod and algorithm. No algorithm ID, IrResult
#   field or stored experiment field changes; the stimulus length comes from the adapter.
# - The stated window is the one averaged: irNoiseFloorWindow uses the same fullEnd
#   (length - stimulus frames) as irFromDeconvolution; recomputing the mean power over it gives
#   noiseFloorDb exactly for spectral and farina-inverse, and for a capped IR (fullLength,
#   startIndex). The engine's result.stimulus.frames is stimulus.samples.length, the array the
#   analysis deconvolved. Units: ms after the direct peak, the x origin of the IR chart.
# - Rounding: Math.ceil is toward +infinity for every sign, so for dB re peak (negative) the
#   stated figure is the higher, conservative one (-66.5 -> "<= -66"); -0 is printed as 0. The
#   summary "tail level <= X" is therefore always true of the level read.
# - Fail-first: the base's scripts/fail-first.mjs proves the new test fails on 682a45e4
#   (assertion, 6 of 7 tests) and passes on the head. Negative cases (null floor, farina label,
#   v1 wording, stored keys) are asserted.
# - No markup, class or style added (ui-uses-flowbite-pro); no audio path touched.
#
# Tests run here: node --test tests/unit/**/*.test.mjs 3318 tests, 3317 pass, 1 skipped, 0 fail;
# build:check up to date; verify-dist PASS; v3-ui.cjs --browsers chromium --origins file
# --only loopback-workflow (OSC_LOAD_MAX=40) PASS 2/2, the live note reading "444.54 ms to
# 493.90 ms after the peak" and "tail level <= -88 dB re peak (noise or unfinished decay)".
#
# R1 (P2): the note says "so the level is an upper bound", but it bounds the noise only in
# expectation. The estimate scatters run to run (docs/v3/algorithms.md:804: each seed within
# 1.5 dB). Probe: 30 Gaussian-noise seeds, 8 kHz, 1 s sweep, delta system, 50 ms window: sd
# 1.44 dB, lowest run 4.2 dB below the power mean, and ceil(X) still below the power mean in 5 of
# 30 runs. Suggested copy: "a decay still running there counts as noise, so the noise lies at or
# below this level (within the estimate's own scatter)". Not blocking: the summary's claim about
# the tail level read is exact.
#
# Verdict: merge. No P0 or P1.
