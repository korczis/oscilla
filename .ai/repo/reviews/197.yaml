findings:
  - { id: R-1, severity: P1, status: open, title: "regression from A7. compiler.js computeBases lowers a static detune that exceeds the frequency's headroom (`clamped`), and runtime.baseOffset counts the lowered amount as an edge offset. So a detune LANE, which overrides the static value, is shifted down by the clamp. Oscillator 12 kHz, static detune +1200 ct, detune lane: at 48 kHz, lane values 0/500/-600 ct play -88.8/411.2/-688.8 ct; at 44.1 kHz, -235.5/264.5/-835.5 ct. Each is within its own ceiling (1111.2 / 964.5 ct). limitedLanes is empty, so nothing reports it. On origin/main the same lanes play exactly 0/500/-600. Fix: the static clamp must not reach baseOffset (offset = the edges' constant part only; the lane is bounded by detuneCeiling in paramFor). Add this case as a test" }
  - { id: R-2, severity: P2, status: open, title: "B2's keep policy keeps a pending measurement item without re-deriving its recipe. An edit in the armed window (lookahead 1 s minus HANDOFF_LEAD_S 0.25 s) is silently left out of the measurement, and A5's level refusal is bypassed. Example: with the hand-off pending, Sweep end goes 20000 to 10000 and Master Output 0.08 to 0.04 (outputLevel 0.08). The run still gets the old model (end 20000, level 0.08) and saves 'done'. The record matches what ran, so the provenance is not false, but the Studio shows another graph and says nothing. Fix: re-derive on an admitted edit while pending, and abort or re-arm when the recipe changes" }
  - { id: R-3, severity: P2, status: open, title: "reviewer independence is at agent level: this reviewer, reviewers A-D, the nine builders and the integrator are agents of one orchestrating session (e4a1ac78). The rule says a reviewer who did not build the change, and the README says a session other than the builder's; the owner decides whether that satisfies it (as V-1 of #174 and #179)" }
  - { id: R-4, severity: P3, status: open, title: "I2's wiring (workspace outputLevel: cmp.gainLevel) has no browser check (the builders' named follow-up). The units and the restore were read here; that the refusal reaches the user in the page rests on that follow-up" }
  - { id: R-5, severity: P3, status: open, title: "a clocked Random or Step Modulator holds step 0 from PLAY, and its first trigger (k = 0) sets step 0 again, so the first trigger changes nothing audible and step 1 arrives with the second. This is consistent with the header ('the k-th trigger sets step k'), but the user guide should say it, or step 0 should wait for the first trigger" }
  - { id: R-6, severity: P3, status: open, title: "this reviewer ran browser suites only in chromium (v31-studio-transport, v31-studio-graph) on a shared, loaded machine (load about 55). The firefox and webkit legs, the other Studio suites and the linux-x64 visual references rest on CI run 39116161418, which was still pending when this was written" }
