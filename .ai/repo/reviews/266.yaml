#
# Lenses:
# - (a) Playback count. stageAccounting() (audio-engine.js:907-929) tracks/untracks over a
#   per-accounting Set; the engine deletes only its own voice's nodes (:679-683). main.js:121
#   makes one accounting, passed by the panel (sequencer-panel.js:164). Each _schedulePass
#   releases its owned set on natural end, on stop after the fade, on dispose, on the
#   closed-context and suspended-context paths, in the catch of a throwing build and on an
#   empty pass. Double STOP is a no-op; double untrack is idempotent. Never negative or stuck.
# - (b) Tempo. Beats to ms is 60000/bpm, clamped to 20-300 BPM and per-type bounds; a
#   mid-loop change applies from the next pass with gap 0 (2.25 s -> 4.5 s). New blocks
#   default to defaultBeats(type) (the default ms at 120 BPM); the reference is tempo-locked
#   and equals the design durations at 120 BPM. Stored ms sequences round-trip byte-identically.
# - (c) Keyboard. Bound only on the #osc-seq-timeline listbox (aria-activedescendant);
#   INPUT/TEXTAREA/SELECT/contenteditable refused; the window instrument handler ignores Space
#   for role=listbox (dialogs.js:13); auto-repeat ignored, modified Space not claimed. History
#   bounded at 100 undo + redo in total; no-op edits dropped; field edits on 'change'; load()
