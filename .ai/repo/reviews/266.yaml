findings:
  - { id: R-1, severity: P3, status: open, title: "A play() whose pass build throws leaves editor.playing stuck true with no voice: play() sets this.playing = true (src/js/sequencer/editor.js:523) and calls _schedulePass (:524) with no catch; the K001 catch (:447-450) releases the count and rethrows, so the transport shows Stop and the next Space/toggle is spent on stop(). The count stays exact at 0. The test 'K001: a pass whose build throws part-way leaves nothing counted' (tests/unit/sequencer-editor.test.mjs:310) asserts only engine counts. Fix: in play(), catch around _schedulePass, reset this.playing = false and rethrow; assert ed.playing === false in the test." }
  - { id: R-2, severity: P3, status: open, title: "The failed-build release (src/js/sequencer/editor.js:448) untracks nodes that compileSequence never disposes: a throw after addSource's node.start (src/js/sequencer/compiler.js:677) and out.connect(destination) (:825) leaves a started, connected source sounding while the engine count says 0 (reproduced on the fake context with a throwing FakeSource.stop). No realistic throw site is known at this head (values are normalized upstream). Fix: a try/catch inside compileSequence that stops started sources and disposes the graph before rethrowing, so release() is truthful." }
  - { id: R-3, severity: P3, status: open, title: "setTempo (src/js/sequencer/model.js:768-781) clamps durationMs to the type's bounds and re-derives beats from the clamped value, so a tempo excursion to a bound loses the stored beats permanently (chirp 4 beats: 2000 ms at 120 -> 5000 ms at 20 -> 833.334 ms, 1.666667 beats back at 120). Pre-existing and unchanged by this PR; K002 (addBlock defaulting to beats, :649) widens exposure. Defaults never clamp in 20-300 BPM; undo recovers. Follow-up: keep the stored beats and clamp only the derived duration." }
  - { id: R-4, severity: P3, status: open, title: "No test pins HISTORY_LIMIT (src/js/sequencer/editor.js:69, shift at :209); nothing under tests/ references it (the Measure and Studio limits are different constants). The composed-page census in tests/browser/app.cjs (:1680, :1704) requires only nodes > 0 and seqNodes > 0, never nodes === seqNodes, though read() (:1659-1667) has both; exact equality is proven only on the fake context. Fix: a unit test of >100 edits asserting 100 undo and 100 redo steps, and assert nodes === seqNodes in app.cjs." }
