findings:
  - { id: R-1, severity: P2, status: open, title: "engine-sync-7 is left behind for the continuous ping-pong sweep. scheduler.js:86-89 gives a continuous ramps plan with envelope 'whole' (patterns.js:320, pingpong + repeat continuous) only setValueAtTime(GAIN_FLOOR, t0) and a linear ramp to 1, and _scheduleCycles tops it up with no envelope, so it never calls v.stepEnv or the open ADSR envelope. With the Envelope on (s 0.1) it sounds at 1.0 while every other sweep holds 0.1, yet voice.adsr is set and labVizInputs (main.js:199) shows the ADSR; the WAV render goes through the same scheduler. README.md:89 and .ai/repo/features/adsr-envelope.md:26, changed by this PR, say the ADSR 'shapes every note'. Fix: give the whole-envelope continuous sweep the ADSR attack/decay/sustain (the open envelope fn with len Infinity), or exclude it from the claim and the views." }
  - { id: R-2, severity: P2, status: open, title: "The Envelope lab has no live path to a sounding voice. main.js:449-450: labs.envelope.onChange only runs syncLabFlags and vizLabsChanged, nothing reaches engine.voice. Switching the Envelope off, or editing sustain/release, during a held tone or a long finite/steps note leaves the voice on the ADSR it started with (voice.adsr, v.release), while labVizInputs shows the new state at once; the change sounds only at the next restart or note. Additive (main.js:437-447), Filter (live config, crossfaded bypass) and Phase (setDualPhase) all have live paths; labs/envelope.js:3-4 says the engine subscribes with lab.onChange to follow edits, which nothing does. restart-follows-labs (tests/browser/app.cjs) switches the lab off and calls setPattern in one evaluate, so it never sees this. Pre-existing on main, but it contradicts the PR title ('the current lab state always wins'). Fix: on an Envelope change restart (or re-envelope) the sounding voice click-free, as setDualPhase does, or state the note-on semantics in the views." }
  - { id: R-3, severity: P3, status: open, title: "The one real integration point, the spread order of the main.js:216 wrapper ({ ...o, ...v2PlayOptions(...) }), has no unit test: tests/unit/lab-play-options.test.mjs:83 wrap() re-implements it, and no unit test imports main.js. Reversing the spread passes every unit test; only the browser check restart-follows-labs would catch it (it passes on head and fails on main's dist per the first pass)." }
  - { id: R-4, severity: P3, status: open, title: "The PR body's fail-first line for lab-play-options.test.mjs is module-not-found, which does not by itself show the behaviour fails on main. The first pass shimmed main's v2PlayOptions (keys omitted when a lab is off) behind the new API: with the key-presence asserts stripped, 7/8 still fail on behaviour (stale wave, stale adsr, level 1), so the test is real; the body should say so or show it." }
  - { id: R-5, severity: P3, status: open, title: "The Sequencer lab and Studio do not consume labPlayOptions: the sequencer plays through compileSequence (compiler.js:590) with its own block envelopes, renderSequenceToWav (main.js:283-286) passes only level and waveform, and Studio has its own runtime, so Envelope/Filter/Additive never reach them. Pre-existing and outside C007, but README.md:89's 'each step of a programmed pattern' can be read as the Pattern sequencer panel (labs/sequencer-panel.js:1). Fix: name the instrument's patterns in the README, or route the labs into the sequencer." }
  - { id: R-6, severity: P3, status: open, title: "The instrument's own play options still ride stale through _restart, the engine-sync-1 mechanism that labPlayOptions fixes only for lab keys: audio-engine.js:774 copies { ...v.opts }, so attackS, releaseS and durationS of a restarted voice are the ones of the first play. Probe: hold with releaseS 0.03, then updateLive to a sweep -> 'restarted', v.release 0.03, v.attack 0.01, whatever the Attack/Release fields now say (instrument.js:1065 passes only the plan; vizInputs show the new values). Pre-existing and with the Envelope off only (adsr.a/r win when it is on). Fix: have the wrapper (or updateLive's caller) pass the current instrument options on a restart, keeping until." }
