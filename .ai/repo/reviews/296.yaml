  - id: R-7
    severity: P2
    status: open
    title: >-
      New, introduced by the R-2 fix. The Envelope's sliders notify on every 'input'
      (labs/envelope.js:64, :73) and its graph on every pointermove (charts/envelope-graph.js:180
      -> set), and each notification reaches setAdsr, which restarts the held voice for any
      change of a, d or s. A drag is therefore a train of note-ons: probe (freeze mock, head
      src) Sustain 0.6 -> 0.1 in 20 input events gives 20 restarts and 21 voices; at one event
      per 50-100 ms each new voice re-attacks to 1.000 (+4 dB over 0.6, +20 dB over the target
      0.1) and the output dips to 0.000-0.002 between them; at 16 ms it chops with dips to
      0.013. Attack and decay drags on a note already at its sustain restart it for a change
      that does not alter the held level. setDualPhase, the precedent the fix cites, restarts
      only on the phase field's 'change' (labs/phase-stereo.js:188). envelope-follows-held types
      into the fields ('change') and never drags, so no check sees it. Fix: coalesce (restart
      on the slider's 'change' and the graph's pointerup, or a trailing debounce), keep the
      in-place release, or scope the drag explicitly as a follow-up (C008 #310's sustain glide
      covers s only).
  - id: R-8
    severity: P3
    status: open
    title: >-
      New, test coverage of setAdsr. Three branches survive mutation of the head: comparing
      decay (N9) and attack (N10) can be dropped, so an attack or decay edit would be taken
      "live" and never reach the held voice, and the v.releasing guard can be dropped (N14), so
      an edit during a release tail would restart, i.e. resurrect, a note the user let go; no
      unit or browser check fails. The head's code is right on all three; add an attack and a
      decay edit to the R-2 unit test and one setAdsr on a releasing voice expecting false.
