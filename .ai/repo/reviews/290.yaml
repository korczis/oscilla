findings:
  - id: F1
    severity: P2
    status: closed
    title: >-
      A Playground, status-bar Play or Pattern Sequencer voice started over a playing Studio
      sounded its first ~70 ms at the Studio's Master level. Fixed in 6624639c:
      claimMasterLevel (src/js/core/instrument.js:459) is called in play() after the plan check
      (:440) and from the sequencer's onStart (src/js/labs/sequencer-panel.js:150 via
      main.js:121 claimOutput). Probe: master.gain starts its tau-20-ms glide at the click
      (0.0448 at 10.7 ms) instead of holding 0.02 to 43-53 ms; _masterHeldUntil null after the
      Studio stops. N1, N5, N10 killed by unit tests, N6 by sequencer-over-studio.
  - id: F2
    severity: P2
    status: closed
    title: >-
      resetDefaults was an unconditional second writer and left the status bar on
      'Master <Studio dB>' when the gain was already at its default. Fixed in 6624639c
      (src/js/core/instrument.js:932): it claims only when gainLevel did not change, clearing
      cmp.studio.masterLevel; a changed gain is written by the main.js $watch alone. Probe and
      reset-over-studio: readout 'Gain -21.9 dB' with the Studio still playing; N2, N3, N4
      killed.
  - id: F3
    severity: P3
    status: closed
    title: >-
      tests/README.md said every C012 test fails before its fix. Fixed: it now excepts the
      status-bar no-write guard (test 5, which passes at cdda563c), and test 3 asserts the PLAY
      event exists, so it fails at cdda563c by assertion, not TypeError.
  - id: F4
    severity: P3
    status: open
    title: >-
      Not addressed by 6624639c, unchanged in substance: the workspace 'master' mirror
      (src/js/ui/studio/workspace.js:761-768) and the main.js clear (src/js/main.js:596) have no
      unit coverage, and dropping `void this.gainLevel` (src/js/ui/workbench.js:102, M8)
      survives the unit file and the chromium app checks. Now that every writer clears
      masterLevel itself the line is a redundant safety net; either test it or drop it with a
      comment.
  - id: F5
    severity: P3
    status: open
    title: >-
      CI run 41003287882 is red on V3.1 Studio UI (webkit): the transport check 'the Tone ->
      Sweep boundary is at baseTime + 1 s' (dip at 1.0160 s) and the quietest-window check, on
      the fixture engine path, which this diff does not touch. Local webkit full transport run
      at 6624639c: 44/44 twice, dip at 1.0000 s. The earlier V3 measurement and UI (chromium)
      red is green now. Rerun CI before merge.
  - id: F6
    severity: P3
    status: open
    title: >-
      The 'a refused start claims nothing' guarantees are tested only on the earliest refusal:
      N7 (play() claims before the plan check, so a refused configuration would take the level
      from a playing Studio) and N8b (the sequencer claims in resume(), before _schedulePass
      can refuse at src/js/sequencer/editor.js:391) survive. The code is correct; add a refused
      currentPlan case and a scheduled-pass refusal case.
  - id: F7
    severity: P2
    status: open
    title: >-
      The PR as merged with main fails the unit job: main's C020 control-drive ratchet (469e958b,
      tests/unit/control-drive-baseline.test.mjs) lists settings.reset as undriven
      (tests/unit/control-drive-baseline.json:99), and this PR's reset-over-studio check now
