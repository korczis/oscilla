# Review verdict for pull request #290, plan item C012: the Studio master level has one writer;
# the status bar shows what the Studio plays (branch fix/c012-studio-master-level-one-writer).
# Reviewed head 41d2034fe666 (== origin at fetch; merge base cdda563c, origin/main fde49bd1,
# which adds only #284 docs; git merge-tree with it is clean).
# Built by the builder's session; reviewed by dev-68. This is a second, independent pass over a
# first review; every finding below was re-derived from the code and kept only where it held.
#
# The digest: the branch's scripts/review-verdict.mjs, identical to origin/main's (diff empty),
# `--content --list --base origin/main` in the PR worktree, over the one guarded path the pull
# request changes, src/js/studio/runtime.js: 37a33a98...42df2, which matches the PR body.
#
# Lenses: (a) a control that does not reach the sound (PACK03, owner-flagged): every writer of
# engine.setMasterGain / holdMasterGain (main.js gainLevel $watch, instrument.js ensureAudio and
# resetDefaults, engine-hooks via the runtime gate) and every way the output is claimed from a
# playing Studio (the playing / seqPlaying $watch, stopPlayback for MEASURE, the Studio
# measurement run, Escape, visibilitychange / pagehide, a closed context via dropAll);
# (b) audio-engine discipline: no new automation, master.gain still built at gainLevel, level
# changes stay setTargetAtTime glides (tau 20 ms); (c) fail-first; (d) PR body and docs vs code;
# (e) tests and mutation coverage.
#
# Runs:
# - The PR worktree held no Claude session at review time (only `majordomus serve`, PID 89667,
#   which logs to .ai/local); it was used for read-only git commands, the digest and this file.
#   Code was read in a fresh detached worktree of origin/fix/c012-studio-master-level-one-writer.
# - Fail-first: git archive cdda563c (src, the fake-audio helper) plus the PR's
#   tests/unit/c012-studio-master-level.test.mjs: tests 1, 2 and 4 fail by assertion, test 3 by
#   TypeError, test 5 passes (F3). At HEAD 5/5 pass.
# - CI run 40960482032: everything passes except V3 measurement and UI (chromium), one check
#   findings-delete-focus that this diff does not touch (F5), and review-verdict / gate, which
#   wait for this file.
# - Not re-run here (disk at the floor, nothing installed): the first pass's chromium probes on
#   the built dist (F1 master.gain trace, F2 status bar after resetDefaults) and its 8 mutants.
#   F1 and F2 were confirmed by reading the code paths they name; the numbers are the first
#   pass's.
#
# Checked and found correct: ensureAudio writes only when it builds or rebuilds a context, before
# init() builds master.gain from it; restoreMaster emits 'master' null on every way out (stop,
# refused start, dropAll, setOptions 'ignore', dispose via stop), so no exit leaves the status
# bar on Master; the Master Output adapter writes only on engage and a changed level; MEASURE
# and the Studio measurement go through stopStudio; nothing else writes the master level
# (src/js grep: main.js:591, instrument.js:386 and :912, engine-hooks only); engine objects stay
# out of Alpine state (the mirror is two numbers).
# Lens (a), what the first pass did not name: no further writer bypasses the fix. The F1 gap is
# wider than the Playground trigger: it is every claim that relies on the async playing /
# seqPlaying $watch (the status-bar Play button, Space / Enter triggers, the Pattern Sequencer's
# PLAY), since none of them writes cmp.gainLevel any more and the Studio's held restore is the
# only thing that brings the level back.
# F2 is kept at P2 for its readout half: Reset instrument re-setting the Playground gain while
# the Studio plays is defensible under the documented rule (a Playground gain set while the
# Studio plays takes over), but when gainLevel is already the default no reactive dependency
# changes, so the status bar keeps showing `Master <Studio dB>` for a level no longer in effect:
# the dup-stale-4 defect this PR closes, on a path its own workbench.js comment names.
#
# Open: F1 and F2 (P2), F3 to F5 (P3). Verdict: changes.
