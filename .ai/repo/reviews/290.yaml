findings:
  - { id: F1, severity: P2, status: open, title: "A Playground, status-bar Play or Pattern Sequencer voice started over a playing Studio sounds its first ~70 ms at the Studio's Master level, then glides to the Playground gain (src/js/core/instrument.js:386). `if (first)` also removed the write on the play() path (instrument.js:432 -> ensureAudio), so the newcomer's level now arrives only via the playing / seqPlaying $watch (src/js/ui/studio/workspace.js:1158-1159) -> runtime.stop -> restoreMaster(t + S) (src/js/studio/runtime.js:981) -> engine.holdMasterGain(saved, t + S). First pass, chromium on dist, Studio Master 0.02, Playground 0.08: master.gain 0.02 to 64 ms, 0.0543 at 96 ms, 0.08 at 229 ms (base: 0.0448 at 10.7 ms). The onset is 12 dB low (or high, if the Studio Master is above the Playground gain): the Playground gain does not reach the start of the sound it governs. Click-free (setTargetAtTime). Untested: the unit test counts ensureAudio writes and no browser check starts the Playground over the Studio. Fix: write cmp.gainLevel when the instrument or sequencer claims the output (the play path, not the unlock listener), or make that hand-off restore at once, and add the browser check." }
  - { id: F2, severity: P2, status: open, title: "resetDefaults (src/js/core/instrument.js:912) is still an unconditional second writer: with gainLevel already at the default, the main.js gainLevel $watch (src/js/main.js:590-595) does not fire, cmp.studio.masterLevel is not cleared, and the workbench getter's only reactive hook on engine writes is `void this.gainLevel` (src/js/ui/workbench.js:102), which did not change, so statusGainText is never re-evaluated. First pass, chromium, Studio Master 0.02, Playground 0.08, Reset instrument (src/index.html:3006, also presets.reset at :2258): engine and master.gain 0.08, Studio still PLAYING, status bar 'Master -34.0 dB': the readout shows a level not in effect (dup-stale-4). The unit test's 'resetDefaults supersedes it' (tests/unit/c012-studio-master-level.test.mjs:148-150) bumps masterWrites on a plain object and never exercises Alpine reactivity. Fix: write in resetDefaults only when gainLevel did not change and then clear cmp.studio.masterLevel (or mirror engine.masterWrites into a reactive counter), with a browser check." }
  - { id: F3, severity: P3, status: open, title: "tests/README.md:140 says every C012 test fails before its fix; against merge base cdda563c test 5 ('the status bar never writes the Studio level into the Playground gain') passes and test 3 fails by TypeError (events.at(-1) undefined), not by assertion. The PR body's fail-first block (4 failures) is accurate. Fix: say which four fail first, and make test 3 assert the event exists." }
  - { id: F4, severity: P3, status: open, title: "The workspace 'master' mirror (src/js/ui/studio/workspace.js:761-768) and the main.js clear (src/js/main.js:594) have no unit coverage, and dropping `void this.gainLevel` (src/js/ui/workbench.js:102) survives the unit test (first pass, mutant M8; 7 of 8 mutants killed). The main.js clear and the getter's masterWrites check cover each other, so either can go without any check failing; F2 shows that this reactive path is the weak one." }
  - { id: F5, severity: P3, status: open, title: "CI run 40960482032 is red on V3 measurement and UI (chromium), one check v3-ui findings-delete-focus (dialog keyboard race) in code this diff does not touch; the first pass reran it locally on the HEAD dist, PASS 2/2. Rerun CI before merge." }
