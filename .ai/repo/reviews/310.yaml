  - id: R-3
    severity: P3
    status: closed
    title: >-
      Closed on 18dec055 under the ownership split (#301 C009 owns the release path, #310 the
      sustain and power switch): a sustain edit now changes only v.opts.adsr.s and keeps a
      release #301 writes there (test 19, killed mutant), the Signal Path no longer marks a
      release edit 'next note' (test 20), and the comments and docs no longer say release
      applies from the next note. What the path draws for the release is R-10; the textual
      merge with #301 is R-12.
  - id: R-9
    severity: P2
    status: open
    title: >-
      New. The deferral guard reads clock.js renderedTimeAtLeast, which is not a lower bound of
      what has rendered: it extrapolates clock readings by real time (its own doc: a stalled
      clock makes it late, never early, up to 50 ms plus the time since the newest reading),
      while Chromium's currentTime is the rendered position and advances in callback bursts.
      Between bursts the estimate runs ahead, so an edit is applied while the last quanta of
      the decay or glide it follows have not rendered: the V249 race window #310 claims closed
      (audio-engine.js:886-889, 905-912; docs/v31/signal-path.md:126 'a sounding ramp is never
      edited'). Burst-clock probe, Sustain drag: 286 of 351 applied edits early at 512-frame
      bursts (worst 5.3 ms), 0 at 128 (narrowed from 94cfe255's 13-40 ms, not closed). This
      follows dev-68's own R-1 suggestion, which was wrong on this point. Test 15 ('reads the
      rendered clock, not a stale currentTime') asserts the unsafe direction: it applies an
      edit while currentTime is 10 ms before the decay end. Fix: compare with ctx.currentTime
      (never ahead of rendering in any browser; a stale Firefox value only delays the edit to
      the next timer task, and V249 is Chromium's race); the probe gives 0 early edits at every
      burst size. Flip test 15 and add a bursty-clock case. P2: blocks unless scoped as a
      follow-up.
