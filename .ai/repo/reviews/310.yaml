findings:
  - id: R-1
    severity: P1
    status: closed
    title: >-
      Closed on 18dec055. _retargetSustain no longer compares the ramp end with the scheduling
      time _soon: it defers until the rendered estimate reaches the end of the render quantum
      holding the last attack, decay or glide end, and schedules at _soon only then. The new
      cases (an edit 19, 10, 3 and 0.1 ms before the decay end; a drag's edits 16 and 32 ms
      into a 20 ms glide) defer and leave the log and the param untouched; the old guard as a
      mutant fails tests 13 and 14. The clock the guard reads is R-9.
  - id: R-2
    severity: P2
    status: closed
    title: >-
      Closed on 18dec055. scheduledRelease recognises a finite note's release held at the floor
      (the last event a 'set' at the floor before releaseEnd, tail 1). Finite note at s 0
      raised to 0.5: 'applied', the level 0.5, released from it at the same deadline, no step
      at the glide or the release, the engine log equal to the real schedule. Removing the
      branch or `<= floor` -> `< floor` fails tests 16-18.
  - id: R-8
    severity: P2
    status: closed
    title: >-
