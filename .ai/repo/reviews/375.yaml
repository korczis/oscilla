# Review verdict for pull request #375, K066 + K020 + K102: synth quick presets, node presets in
# the Inspector, one patch library across instruments (branch feat/k066-k102-synth-presets-library).
# Reviewed head 2fa630f1, base branch feat/k097-xy-performance-pad (#372) at 61c0863b, which is
# the merge base. Another session built it; this reviewer built none of it, nor #372, #329, #332
# or the train #367.
#
# The digest: the base program (`git archive origin/main scripts`), `--content --list --repo
# <this worktree> --base-branch origin/feat/k097-xy-performance-pad`: f964a04b...b2aa over
# src/js/studio/actions.js, library.js, live-notes.js, node-presets.js, patch-catalog.js,
# patches.js, registry.js, schema.js and validate.js. That matches the builder's statement.
#
# How it was reviewed:
# - Read the PR's diff on the nine guarded paths against 61c0863b, and the synth/ callers that
#   reduce through them (presets.js, link.js, xy.js, picker.js, dock.js).
# - Probed the store directly, on head and on a base worktree at 61c0863b.
# - Mutated the guarded code 9 times and ran the new unit files with synth-*, xy-*, *patch*,
#   *preset* and v31-studio-*. 7 mutants were killed: route not cleared on node removal,
#   validator check dropped, normalize or structure dropping noteTarget, route ignored, type
#   check dropped, edge props not applied. 2 survived and are equivalent: the reducer's
#   playsNotes check is backstopped by validate.js with the same sentence, and importPatch
#   already fills every parameter, so merge-versus-replace makes no difference.
# - npm test on the head: 3963 tests, 3952 pass, 9 fail, 2 skipped. The same failures appear
#   on a 61c0863b worktree: control-drive-baseline x3, surface-census x2, ui-flowbite-pro-record
#   x2, and visual-gate-bound x1. The ninth, ui-flowbite-pro-record "(a) the tree holds exactly
#   the record", fails only when run in parallel and passes alone, on head and on base.
# - Fail-first: the CI job passed. Separately, the four new or changed unit files fail on the
#   base tree (missing modules; synth-presets expects PATCH_REPLACE). They are pure, with no
#   timer, sleep or sample-rate assumption. tests/browser/synth.cjs adds no fixed sleep, and
#   timing-baseline.json is unchanged.
# - Browser suites were not run locally: the 1-minute load was 13 to 30, above the limit of 12.
# - gh pr checks 375: the gate is red. The jobs that fail on #372's head (61c0863b) fail here
#   too. Studio UI (firefox) newly fails: s-dock and s-relink (see R2).
#
# What holds:
# - PATCH_REPLACE { onto } goes through patchParams. It sets only the parameters of mapped
#   existing nodes and the props of matching existing edges. It never adds, removes or moves a
#   node or edge, and a patch edge without a match is reported in `skipped`.
# - A node of another type is refused with a sentence. The result passes checked()
#   (validateStudioModel) and the store's validateStudioCommit, and typed ports are untouched
#   because no edge endpoint changes.
# - It is one history entry, and undo restores the exact serialized model.
# - PATCH_INSERT { route } is one reduce. An unknown route is refused, the routed node must play
#   notes, undo is exact, and the whole result is validated.
# - metadata.noteTarget is presentation state. Probes show studioHash unchanged,
#   isSemanticallyEqual false (dirty), undo and redo exact, and serialize/import round trip
#   exact.
# - It is cleared by withoutNodes, which covers NODE_REMOVE and Replace graph. The validator and
#   the import pipeline refuse a missing or non-note target, and a document without it loads as
#   before.
# - Only picker.js and dock.js read noteTarget. No compile path does, so keeping it outside
#   studioHash and executionState is right.
# - live-notes' playsNotes is unchanged in effect: Keys declares notes.
# - patch-catalog adds no store. The diff carries no indexedDB, localStorage or objectStore
#   line, saved patches come from library.patches() over the existing PATCH_KIND records, and
#   storage-inventory passes.
#
# Verdict: merge. No P0 or P1. Two P2 and six P3, all open.
