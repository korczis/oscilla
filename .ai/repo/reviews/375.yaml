findings:
  - { id: R1, severity: P2, status: open, title: "synth/presets.js:107 with studio/patches.js:477: a quick preset now resets an amount cable's polarity and mapping, not only its depth. The patch edge carries the normal's whole props and patchParams merges them onto the model edge. Repro on the panel fixture: EDGE_UPDATE the lpf-eg2 edge to { polarity: bipolar, mapping: linear }, then dispatch presetAction(model, PANEL, 'init'). Head gives unipolar/log; base 61c0863b (BATCH of EDGE_UPDATE { depth }) keeps bipolar/linear. The PR body says 'parameters and amount depths only'. Either put only { depth } on the preset's edges or state and test the reset." }
  - { id: R2, severity: P2, status: open, title: "tests/browser/synth.cjs:525: the PR's own s-dock check fails in CI. Studio UI (firefox), run 41262192547 job 124717542559, reports 'Enter routes the keys to the FM engine: not reached within 5000 ms'; s-relink fails in the same job. #372's firefox job passed synth 18/18. The ArrowDown loop neither waits until focus is inside the menu (the menu focuses its first item in $nextTick) nor asserts that it reached the FM item before Enter, so it can route the keys to another item. Not reproduced locally (load 29). Poll the focus with until() and assert the item before Enter, then re-run the job." }
  - { id: R3, severity: P3, status: open, title: "studio/patches.js:495: patchParams returns a new model object even when changed.nodes and changed.edges are empty. Re-applying the same preset therefore reports changed: true and records an empty undo entry. Repro: dispatch presetAction(model, PANEL, 'init') twice; the second adds 1 to undoDepth. Base 61c0863b gives changed: false and adds no entry. Return the input model when nothing changed." }
  - { id: R4, severity: P3, status: open, title: "studio/validate.js:848: metadata.noteTarget is bounded by NAME_MAX_CHARS (64), but node ids may be up to 128 characters (ID_PATTERN). Repro: import a Studio with a 93-character engine id, then METADATA_SET { noteTarget: that id }. It is refused with 'A saved Studio would not load again: metadata.noteTarget longer than 64 characters'. Check it with the node-id rule (128, ID_PATTERN)." }
  - { id: R5, severity: P3, status: open, title: "studio/registry.js:294: playsNotes accepts capabilities.hits, which no node definition declares and the registry's CAPABILITIES list does not validate. The branch is dead and untested, and the refusal sentences in actions.js and validate.js point the user to a 'hits capability' that no node has. Drop it until K073 declares it, or declare and validate it." }
  - { id: R6, severity: P3, status: open, title: "studio/validate.js:845: metadata.noteTarget is a new key with no STUDIO_SCHEMA_VERSION bump and no migration. Builds before this one, v3.14.1 or a revert of this PR, reject unknown keys, so a saved project or Studio file that routes the keys will not open there. K066's 'Rollback: revert the pull request; no saved state depends on it' therefore does not hold. State that in K066, or make the old reader tolerant first." }
  - { id: R7, severity: P3, status: open, title: "src/js/data/presets.js with core/constants.js:47 (localStorage oscilla.presets): the Playground/labs V1 voice presets remain a second preset store with a flat record shape. This is acceptable here as a named follow-up, not a P2. K102's scope lists the Studio-model instruments (panels, kits, engines, XY), and moving the Playground voice onto patches needs a Studio graph for it. No plan issue names it yet: file one under M069 so the duplication is tracked." }
  - { id: R8, severity: P3, status: open, title: "studio/patches.js:463: patchParams accepts an `onto` that maps two patch nodes to one model node, and the one later in the patch silently wins. Repro: PATCH_REPLACE with presetPatch(PANEL, 'init', { all: true }) and onto { lpf: L, hpf: L } returns ok: true. The hpf entry is dropped without a word. No UI path produces this (patchTargets is injective), so refuse a non-injective map with a sentence." }
