#
# What holds:
#   - One registry and one adapter table. xy-pad adds a type and changes no existing
#     definition, so pinned studioHash values stay as they are.
#   - Ports are declared and typed: X, Y and Pitch are CONTROL, Gate is TRIGGER. Every cable is
#     a patchCable/canConnect step of a store BATCH, and each edit is one undo entry.
#   - The pad's position is performance state (the kind's model and xy-tab's `pos`), never the
#     model. The runtime offsets move only through transport.live, as the Keys path does.
#   - The adapter makes its three ConstantSources through acct.track/acct.source and stops
#     them. The census is 0 after stop at 44.1 and 48 kHz. X and Y glide with tau 15 ms. The
#     pitch is clipped to KEYS_PITCH_RANGE: the widest setting, B5 with a span of 4, is +5.17
#     oct. The VCO's existing pitch clip holds 0.95 x Nyquist.
#   - The gate fans out through the same gateTargets as Keys. The arm's closed envelopes and
#     the armed model include the pad. allOff and Escape release it.
#   - The patch envelope's new category and scale are optional, strictly validated (pattern,
#     SCALE_MODES, NOTE_NAMES, no extra keys) and round-trip. A registry without the type
#     refuses the document by name.
#   - Input: the surface is reachable by pointer, keyboard (Tab, arrows, Shift, PageUp/PageDown,
#     Home/End, Enter held, Escape) and touch (touch-action none on the pad only). Each axis is
#     a role=slider with aria-valuetext. The disabled state says why.
#   - The labels claim nothing beyond requested pitch and equal temperament. The browser suite
#     waits through until() and bounded() with named deadlines, and assumes no sample rate.
#
# Verdict: merge. No P0 or P1. One P2 on the browser suite's skip accounting, and four P3s.
