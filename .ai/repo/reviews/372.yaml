  - { id: V4, severity: P3, status: open, title: "view/xy-tab.js:99 the readout and aria-valuetext name the pad's pitch step, not the sounding note: the XY bass preset (VCO 1 at 16', pad octave 2, D Dorian) reads 'D2 · degree 1 of D Dorian' while VCO 1 sounds 220 x 2^((38 - 69) / 12) = 36.7 Hz, D1; XY bell (VCO 1 at 4') sounds an octave above its readout. This is the keyboard's footage convention and not a false claim, but the readout could say 'pitch D2' or name the footage so it does not read as the sounding frequency" }
  - { id: V5, severity: P3, status: open, title: "ui/kinds/xy-pad.js:165 aria-pressed is set on the role=application surface; WAI-ARIA defines aria-pressed for buttons only, so assistive technology ignores the gate state there; announce the gate through the description or a live region (the readout p could be aria-live=polite). Note, not a defect: synth/xy.js:85 afterSteps hand-reduces four BATCH step types outside the store to build a preset's patch; it never commits, and probe (1) shows it equals the store's reduction for all four recipes, but no test pins that equality" }
