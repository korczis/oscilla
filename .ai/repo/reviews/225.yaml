findings:
  - { id: R-1, severity: P3, status: open, title: "joinFlowLines does not know block scalars. A line inside a `|` or `>` scalar that looks like `key: [` with no closing bracket opens a 'flow collection', and every later line is folded into it. Example: front matter `notes: |\\n  a: [b\\n  c\\nstatus: accepted\\ntags: [rc-exemption]` is valid YAML, and yaml-subset reads it right on its own (status accepted, tags kept). After joinFlowLines it reads as notes only: no status, no tags, no error. It fails closed (the ADR lifts nothing) and no ADR front matter in the repository has a block scalar today. Skipping the lines of a block scalar, plus a test, would close it" }
  - { id: R-2, severity: P3, status: open, title: "ADR 0012's front matter is now refused as not YAML (an unquoted ': ' in its title, also invalid in real YAML). adrStatus('0012') used to give status accepted with its tags, and now gives status null and an error. It was never an RC exemption, so no release outcome changes. The PR body says this. Quoting the title in a follow-up would make every ADR readable again" }
  - { id: R-3, severity: P3, status: open, title: "the merge of main (cfcac1a, docs and E023.yaml only) landed after the local npm test run, which was at 4169b5d. No guarded or test path changed, so the result carries over, but CI on cfcac1a is the run of record" }
