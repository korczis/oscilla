findings:
  - { id: R-1, severity: P2, status: open, title: "A modulated Macro leaves its declared 0..1 output range, so the 0.95 x Nyquist headroom of a downstream frequency is overrun: Macro value is modulatable (nodes/modulation.js:174) and routed onto cs.offset (adapters/modulation.js:259) while outputRange stays UNIPOLAR (:258); computeBases sizes edges from hi = 1. Probe: 100 Hz osc, Macro 1 -> frequency (depth 50000), LFO -> Macro value (depth 1) peaks at 41795/45500/91100 Hz against caps 20947.5/22800/45600 at 44.1/48/96 kHz, reported only as `exceeds` on macro.value; at the default modDepth 0.25 a 20 kHz edge peaks at 25.1 kHz with limitedEdges empty. Fix: hold the Macro output to [0,1] (automatable, not modulatable, or clamp the offset) or size edges from the source's real peak; test at 44.1, 48 and 96 kHz." }
  - { id: R-2, severity: P2, status: open, title: "The Drive adapter clamps the trim base with the edge offsets included (trimOf = clamp 0..1 on b.trim.value, adapters/processing.js:238, 248), so a unipolar source on the default bipolar edge plays at the wrong level: trim 0.1 with a Macro/Envelope edge (depth 0.25) writes 0 instead of -0.15, giving 0/0.25/0.5 instead of -0.15/0.1/0.35 (+8 dB at the midpoint, +3.1 dB at 1); trim 1 with a unipolar edge from an LFO sits 0.125 low. Output stays bounded by the clip. Mutation trimOf -> identity passes all tests. Fix: write b.trim.value unclamped (the clip bounds the output) or clamp only the static param; add a unit test with a unipolar source on a bipolar edge." }
  - { id: R-5, severity: P2, status: open, title: "An LFO rate automation lane spans only softRange 0.01-100 Hz (automation.js:374-377, LFO_SLIDER_RANGE nodes/modulation.js:34), so audio rates cannot be drawn, a typed 2000 Hz point is pinned at the top, and a keyboard nudge rewrites it: Up gives 100 Hz, Down about 91.2 Hz (automation-view.js:204, automation.js:504). Fix: give lanes the full log range up to the Nyquist cap, or a separate lane range distinct from the slider's softRange." }
  - { id: R-4, severity: P3, status: open, title: "Click-free Drive changes and the LFO adapter's Nyquist clamp are untested: the drive gain glide (drive.js:105) and trim glide (drive.js:107, reachable only via stage.update({ trim })) replaced by steps, and hooks.clampFrequency -> Math.max(0.01, v) (adapters/modulation.js:36), each pass the suite. The adapter clamp is the last bound when a lane initial overrides the computeBases base (runtime.js:657). Fix: assert ramp 'target' with tau GLIDE_TAU_S on stage.update for drive and trim, and test the adapter clamp directly." }
  - { id: R-6, severity: P3, status: open, title: "The PR body says the largest adapter file is sources.js at 10 635 B; at HEAD it is modulation.js at 10 970 B (still under the 40 000 B cap). Commit c78c9b45's body says the Drive 'peaks below its trim', withdrawn by d2e325bf, and its subject reads K010-K013 without 'partial'. Fix: update the body to 10 970 B (modulation.js) and use the PR body as the squash message." }
