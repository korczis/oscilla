# Review verdict for pull request #299, plan item K026: an on-screen and a QWERTY keyboard on the
# V502 note voices (branch feat/k026-qwerty-piano, stacked on #261). Reviewed head 9647fa73
# (== origin at fetch); base origin/feat/v502-midi-notes-sound. Built by oscilla-b0's agents;
# reviewed by dev-68.
#
# The digest: main's scripts/review-verdict.mjs (git archive origin/main scripts into a
# scratchpad), `--repo . --head HEAD --content --list --base-branch
# origin/feat/v502-midi-notes-sound` (the stacked base, not main), over the one guarded path the
# pull request changes, src/js/audio/audio-engine.js: f87602f6...ff11, which matches the
# builder's.
#
# Lenses:
# - The held note (audio-engine.js:919-923). `held` makes len Infinity, so the note is neither
#   limited nor extended; revokeContinuous (only `extended`) leaves it, as ADR 0062 D1 says. The
#   peak is still level / NOTE_POLYPHONY through the same master, limiter and ceiling (D2).
#   Voice stealing (endTime > t0) still finds Infinity voices and fades the oldest, so a ninth
#   key steals rather than stacking. Every held note is released on: its own key up or pointer
#   up (keyboard.js:163; keyboard-ui.js:291, unconditional, not gated on armed); window blur,
#   pagehide and visibilitychange to hidden, and Escape (keyboard-ui.js:122, 136-139 for the
#   keys; midi/ui.js:97-102 for every note, which also releases the keys); a workspace change;
#   the sequencer starting and Measure or Studio taking the output (the V502 paths through
#   notes.silence / engine.notesOff); a lost input. The keyboard's notes pass the same ownedBy
#   refusals as MIDI (notes.js noteOn). No path leaves a voice sounding once nothing holds it.
# - ADR 0062 amends ADR 0005 D3 honestly: the exemption is only while held, the ceiling and gain
#   law are kept, forced release replaces V502's "blur does not stop MIDI notes" on the safe
#   side, and every other signal keeps ADR 0005. It also covers hardware MIDI notes, which now
#   always pass held: true (notes.js); a controller with a stuck key is stopped by blur, hide
#   or Escape, which the ADR names as the remedy.
# - Input guards: no Ctrl/Meta/Alt, never Space (keyboard.js:75-77, ADR 0050); not in a text
#   field, select, contenteditable, ARIA text role or open dialog (keyboard-ui.js:34-48, 124);
#   event.repeat never retriggers (keyboard.js:155). isComposing is not checked, but IME
#   composition only happens in a text target, which takesText already refuses.
# - Chrome: the controls are unclassed native buttons and the keys a canvas, so the Flowbite
#   ratchet is kept (tests/unit/ui-flowbite-pro.test.mjs 29/29), the interim the repo's F-line
#   uses while F001 has not landed. keyboard-ui.js:217-218 sets the box's grid order and
#   column from JS: layout placement, not component styling, outside what the class ratchet
#   sees; acceptable as the stated interim (R-6).
#
# Runs: node --test keyboard-held-notes, tests/unit/midi/*, navigation, v4-shortcuts,
# v4-connections: 119/119. Mutations in a scratch copy (git archive, node_modules linked):
# the engine ignoring held (v.held = false) fails 5; notes.js passing held: false fails 4; blur
# release removed from both keyboard-ui.js and midi/ui.js fails 2. Each restored; the PR
# worktree untouched. Browser checks not run (disk near the floor, nothing installed).
#
# Open: P3 only. No P0, P1 or P2 is open.
