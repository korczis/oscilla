findings:
  - { id: R-1, severity: P3, status: open, title: "The plan record disagrees with what lands. .ai/repo/project/issues/K026.yaml (main) says the on-screen keyboard is a Pro card in the Playground that waits on F001-F003, and that 'the Studio gets no keyboard here'. This pull request ships the keys now as a canvas with unclassed controls, in the Playground and the Studio (armed on its own), on the owner's direction as the PR body quotes it. Nothing in the branch amends K026.yaml or records that direction as a decision. Fix (follow-up, a chore(plan) on main before K026 is marked done): amend K026's objective and acceptance to the shipped scope, citing the owner's direction, or record it with majordomus decision." }
  - { id: R-2, severity: P3, status: open, title: "More than 8 keys held: every key stays lit while only 8 sound (the 9th steals the oldest voice, keyboard.js light/start do not learn of the steal); releasing a stolen key calls noteOff on a voice already fading (returns false). Cosmetic, never a stuck or extra sound." }
  - { id: R-3, severity: P3, status: open, title: "kbd=0 in a link disarms the view (keyboard-ui.js:153) without releasing held notes. Not a stuck note: keyUp and pointerup release unconditionally (keyboard.js:163, keyboard-ui.js:291), and the workspace watcher releases on a view change. Call kbdRelease() there for symmetry with kbdToggle (keyboard-ui.js:179)." }
  - { id: R-4, severity: P3, status: open, title: "Blur, pagehide, visibilitychange and Escape release the keyboard twice: keyboard-ui.js:122, 136-139 and midi/ui.js:97-102 (whose silence() also calls kbdReleaseAll). Idempotent and harmless; removing either set alone survives the suite, so only both together are pinned." }
  - { id: R-5, severity: P3, status: open, title: "Style: src/js/ui/shortcuts.js:150 is 106 characters, and its `if (KEYBOARD_VIEWS...) rows.push(...); else if (workspace === 'measure')` puts two branches on one line; src/js/midi/keyboard-view.js:25 is 103. The repo's limit is 100." }
  - { id: R-6, severity: P3, status: open, title: "keyboard-ui.js:217-218 sets box.style.order = '14' and gridColumn from JS: interim layout until the keyboard moves into its Pro card (F001-F003). A follow-up should replace it with the Pro card's own grid placement and drop the inline styles." }
  - { id: R-7, severity: P3, status: open, title: "Velocity steps of 20 from 100 clamp at 127 and 1 (100, 120, 127, 107, 87 ...), so the default 100 is not reachable again without a reload. Clamp to the step grid or add a reset." }
