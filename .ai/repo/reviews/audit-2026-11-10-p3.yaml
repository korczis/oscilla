# Method: the open findings were re-extracted from the verdict files at the base b8bfd3b6 with
# scripts/yaml-subset.mjs (613 findings, 381 open, 318 open P3, as the first audit counted), the
# 31 sampled removed. Six read-only reviewer agents of oscilla-ce, each in its own detached
# worktree at a7102358 (~/dev/oscilla-wt/audit-p3-1..6; unit runs and mutations only, every
# mutation reverted, no browser suite; removed clean afterwards), classified a batch each by PR.
# A commit message never decided a class. oscilla-ce then checked every row: each cited sha
# exists and is an ancestor of a7102358, each fixed row's sha subject and file:line reference
# resolve and the commit touches the file cited, the reviewer-independence rows are uniform
# across batches, and every open row that matters was re-read (four re-run) before filing.
#
# matters (open rows): true for a defect a user or the gate would hit (wrong sound, measurement or
# data, a misleading view, a check that passes while what it guards is broken); every such row
# names the plan issue that tracks it, existing or filed here. Superseded rows whose evidence
# starts "No defect (record only)" are review notes, not defects. The ten reviewer-independence
# rows (e4a1ac78's agents) name Q108, decided by the owner on origin/chore/review-findings-audit
# (#519) and not yet on main, so they stay open here.
