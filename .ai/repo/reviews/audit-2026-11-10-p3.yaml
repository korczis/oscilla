# audit-2026-11-10.yaml left unclassified (its p3.by_class.unclassified), each classified against
# main a7102358 as fixed (the commit that fixed it, seen in the code and, where a unit test holds
# it, a mutation that the test kills), superseded (what replaced it) or open (file:line on main).
# It completes that audit and replaces nothing in it: its 31 p3_sample rows stand as written, and
# the summary below is the total over all 318 open P3s (theirs plus these). The historical
# verdict files are not edited. Ordered by oscilla-43 (integrator); format agreed with oscilla-c3.
