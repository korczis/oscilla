findings:
  - { id: L1, severity: P3, status: closed, title: "release-record's gh release download --output is retried after a transient failure without --clobber, so a first attempt that left a partial file can turn the retry into an 'already exists' refusal; delete the file before a retry or pass --clobber (the temporary directory is new per call)" }
  - { id: L2, severity: P3, status: closed, title: "gh run watch is restarted after a non-timeout transient failure, so the total wait can exceed --pages-timeout by up to two further attempts; the stated bound is per attempt, not for the watch as a whole" }
  - { id: L3, severity: P2, status: closed, title: "pre-existing on main: publish() never removes its mkdtemp oscilla-release-* (notes and a 2.7 MB dist copy), and the release-publish and release-record tests leave their fixture repositories in the temporary directory, so every npm run verify leaks them; remove each in a finally / t.after" }
  - { id: L4, severity: P3, status: open, title: "release-ci-receipt.mjs ghJson already tries each read twice; through boundedRunner each attempt is itself retried up to NET_ATTEMPTS times, so one unreadable GitHub read can take up to 6 attempts of 60 s before the receipt refuses; bounded, but drop one of the two retry layers" }
