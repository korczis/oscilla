findings:
  - { id: R-1, severity: P2, status: open, title: "A stop whose time precedes a late voice's join leaves the join ramp scheduled, so the voice rises to full gain after STOP and is cut there (src/js/sequencer/compiler.js:776 with :906-909). stop() inserts hold+fade (joinValueAt(t) = GAIN_FLOOR for t <= joinAt) but never cancels the pending setValueAtTime(GAIN_FLOOR, joinAt) + linearRamp(1, joinAt + EDGE_S). When t + STOP_RAMP_S <= joinAt + EDGE_S and the sources' stopAt = t + STOP_RAMP_S + STOP_PAD_S > joinAt + EDGE_S, i.e. t in (joinAt - 19 ms, joinAt - 9 ms), the gain ramps to 1 after the fade and the sources stop at full gain: ~7 ms of full-level sound after STOP ending in a hard cut, against audio-engine-discipline ('stop() ramps down, cancels future automation'; 'gain never hard-switches from nonzero to zero'). Reachable: the transport's STOP time is stopTime(ctx.currentTime) (timeline-compiler.js:159) while joinAt is rounded from max(currentTime, renderedTimeAtLeast) (compiler.js:905), which runs ahead of currentTime by up to the output latency (clock.js, bounded to ~50-200 ms); edits' release/retime times come from safeHorizon(currentTime) the same way. A STOP or edit within that window after a late join hits it. Fix: in stop(), when joinAt !== null and t < joinAt, cancel the join (out.gain.cancelScheduledValues(t) is safe there: the out gain is a constant GAIN_FLOOR before joinAt, so the Chromium freeze the header describes cannot step it) and fade from the floor, or start the stop no earlier than joinAt + EDGE_S; add a test with stop(at) before joinAt asserting no event raises the gain after the fade." }
  - { id: R-2, severity: P3, status: open, title: "No test covers a stop before the join (tests/unit/sequencer-compiler.test.mjs, keepGrid test): the stop is exercised only inside the join edge (at = join + EDGE_S/2), which is why R-1 passes the suite." }
