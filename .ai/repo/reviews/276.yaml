# Review verdict for pull request #276: the WebKit Tone→Sweep boundary failure is a transport
# race, fixed by a late voice keeping its grid (branch test/studio-tone-sweep-boundary-webkit).
# Reviewed head 4e64468f93d6 (== origin at fetch); merge base origin/main b67d1e580e0f. Built by
# oscilla-b0's session; reviewed by dev-68.
#
# The digest: the base branch's scripts/review-verdict.mjs (git archive origin/main scripts into a
# temporary directory), `--content --base-branch origin/main` and `--repo . --head HEAD --content
# --list --base-branch origin/main`, over the one guarded path the pull request changes,
# src/js/studio/transport.js: 228618e7...6fe, which matches the builder's.
#
# Lenses:
# (a) The join is click-free on its own: the out gain of a late voice (keepGrid) is set to
#     GAIN_FLOOR (never 0) at the grid start, held at GAIN_FLOOR at joinAt and ramped linearly to 1
#     over EDGE_S (3 ms); no setTargetAtTime anywhere on that path. joinAt is computed after
#     scheduling from max(currentTime, renderedTimeAtLeast) + max(STOP_LEAD_S, 2 quanta), on a
#     quantum boundary, so it is never in the past when it is scheduled. A stop inside the join
#     edge holds the edge's value (joinValueAt) and fades from there: tested. A stop BEFORE the
#     join is not handled: R-1.
# (b) Every other compileSequence caller is unchanged: sequencer/editor.js:317, compiler.js:948
#     (preview) and the offline renderer pass no keepGrid; keepGrid is opt-in (=== true), realtime
#     only, and only when the grid start is already past, so for those callers start, initAt and
#     every schedule are byte-identical to base (initAt = min(now, start) = now when start >= now).
# (c) Events in the past on a late voice: AudioParam timelines are evaluated at the render
#     position by spec (a past setValue/ramp gives the value the timeline has there) in all three
#     engines, and the out gain holds GAIN_FLOOR until joinAt, so whatever an engine does with
#     the past part is silent. What remains: oscillators started in the past start at once with
#     a phase other than an on-time start's, which is inaudible for a single voice.
# (d) The 'joined-late' record (transport.js:664) is accurate (from = the clip's grid start,
#     to = the scheduled joinAt, at = currentTime) and bounded: one per compiled late voice, in
#     the decision log that record() caps at 500 (transport.js:262).
# (e) The fixture is not loosened: the boundary and end checks are unchanged; only the onset
#     prediction multiplies by the join edge taken from the transport's own record, and the
#     detection window grows by the join. (It trusts the scheduled joinAt, which (d) shows is
#     what was scheduled.)
# (f) Runs (scratch git-archive copy, existing node_modules, nothing installed):
#     sequencer-compiler + v31-studio-transport 63/63. Mutations, each restored: keepGrid off in
#     the transport fails 1; no floor hold (out gain set to 1 at the grid start) fails 1; the
#     join a step instead of the EDGE_S ramp fails 2. The full unit suite in the scratch copy
#     reports 11 failures, all artifacts of a copy without .git (tracked-file, README and
#     version-literal checks) and one timing budget under load ~70; the builder's npm test is
#     3279/0. No browser run here (disk near the floor, load ~70).
# (g) Out of scope, noted: the Firefox Studio onset leg's 2/8 failures under load ~70 (the join
#     path is not taken there per the builder) and the pre-existing "cutoff automation 8th
#     harmonic" failure when the graph start renders > 100 ms late (LFO phase), which is on main
#     too and wants its own issue.
#
# R-1 was reproduced with the PR's own fake context (compileRef, keepGrid, a frozen performance
# clock): currentTime 1.023800, joinAt 1.045333, stop(at = 1.033333), i.e. at 12 ms before the
# join. The out gain's timeline becomes floor@1.010104, floor@1.033333 (the hold),
# floor@1.045333 (the fade's end AND the join's hold), ramp to 1 by 1.048333, and nothing after;
# the sources stop at 1.055333. So after STOP the voice rises to full gain for about 7 ms and is
# then cut at full gain.
#
# Open: R-1 (P2). Verdict changes.
