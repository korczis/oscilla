findings:
  - { id: R-1, severity: P2, status: closed, title: "[fixed in b54e9eb4: a stop before the join cancels it, the gain stays at the floor; a stop inside the edge starts at its end] A stop whose time precedes a late voice's join leaves the join ramp scheduled, so the voice rises to full gain after STOP and is cut there (src/js/sequencer/compiler.js:776 with :906-909). stop() inserts hold+fade (joinValueAt(t) = GAIN_FLOOR for t <= joinAt) but never cancels the pending setValueAtTime(GAIN_FLOOR, joinAt) + linearRamp(1, joinAt + EDGE_S). When t + STOP_RAMP_S <= joinAt + EDGE_S and the sources' stopAt = t + STOP_RAMP_S + STOP_PAD_S > joinAt + EDGE_S, i.e. t in (joinAt - 19 ms, joinAt - 9 ms), the gain ramps to 1 after the fade and the sources stop at full gain: ~7 ms of full-level sound after STOP ending in a hard cut, against audio-engine-discipline ('stop() ramps down, cancels future automation'; 'gain never hard-switches from nonzero to zero'). Reachable: the transport's STOP time is stopTime(ctx.currentTime) (timeline-compiler.js:159) while joinAt is rounded from max(currentTime, renderedTimeAtLeast) (compiler.js:905), which runs ahead of currentTime by up to the output latency (clock.js, bounded to ~50-200 ms); edits' release/retime times come from safeHorizon(currentTime) the same way. A STOP or edit within that window after a late join hits it. Fix: in stop(), when joinAt !== null and t < joinAt, cancel the join (out.gain.cancelScheduledValues(t) is safe there: the out gain is a constant GAIN_FLOOR before joinAt, so the Chromium freeze the header describes cannot step it) and fade from the floor, or start the stop no earlier than joinAt + EDGE_S; add a test with stop(at) before joinAt asserting no event raises the gain after the fade." }
  - { id: R-2, severity: P3, status: closed, title: "[fixed in b54e9eb4: the review repro and stops at the join, mid-edge and before the edge end are tested; both fail on 912b9273] No test covers a stop before the join (tests/unit/sequencer-compiler.test.mjs, keepGrid test): the stop is exercised only inside the join edge (at = join + EDGE_S/2), which is why R-1 passes the suite." }
  - { id: R-3, severity: P3, status: open, title: "A STOP exactly at joinAt takes the edge branch (t >= joinAt), so the voice rises from the floor to 1 over EDGE_S and then fades over STOP_RAMP_S: about 15 ms of sound after a STOP issued before the voice was ever heard (src/js/sequencer/compiler.js:771, 781; the new edge test pins at = joinAt to the edge end). t == joinAt is reachable: stop()'s default and the transport's stopTime use the join's own formula (a render-quantum ceiling of the rendered time plus the lead), so a STOP inside the quantum the join was read in lands on it. It is click-free, ramps only. Fix if wanted: cancel for t <= joinAt, which is just as exact, since the floor set at joinAt equals the floor before it." }
  - { id: R-4, severity: P3, status: open, title: "The compiler header still says a stop inside a late voice's join edge is 'the one exception' to the out gain never being edited mid-ramp (src/js/sequencer/compiler.js:37-38); since b54e9eb4 no stop edits the edge. docs/v31/timeline.md is correct." }
