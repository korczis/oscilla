# Review verdict for pull request #277, E026: CI path gating (branch feat/ci-path-gating).
# Reviewed head 1119a58c, merge base origin/main b67d1e58. Another builder wrote it (oscilla-b0).
#
# The digest: the base branch's scripts/review-verdict.mjs, run from `git archive origin/main
# scripts` with --repo on this worktree: da784e59...7259 over the 3 guarded paths it names.
#
# How it was reviewed: three independent lenses (the classifier and its allowlist, the workflow
# wiring and the gate, tests and mutants), read-only, with real git fixtures; every finding handed
# to a separate skeptic (20 agents; 3 refuted).
#
# What holds:
# - No gated leg (engine, suites, measure, studio, browser, visual) reads docs/**, a top-level *.md
#   or .ai/repo/{project,reviews,releases}/** today, and any build input change moves dist, which
#   the always-run build:check holds.
# - unit, knowledge, fail-first and review-verdict run on every pull request.
# - The -z parsing is structural. Symlinks, gitlinks, T/U/X, odd names and an empty diff all read
#   as runtime, and an overflow throws.
# - The classifier is the base's blob, run from RUNNER_TEMP, under the full ref
#   refs/remotes/origin/<base>, which a pull request cannot write. Only the exact name main is
#   gated.
# - The gate accepts a skipped leg only for the six names, with changes.result success and runtime
#   exactly "false"; cancelled, failed, skipped or mis-cased answers fail it.
# - Main's protection is strict with merge commits only, so a gate-green docs-only head can merge
#   only when its tree is main plus docs.
#
# Verdict: merge. No P0 or P1. One P2 worth fixing in this PR or the next:
# - R1: no real-git test covers a type change, a symbolic link or a submodule, so a change to
#   changedRecords' git flags (e.g. dropping --raw or -z) that hides one passes every test; add
#   fixture commits for 120000, 160000 and a T status under docs/.
