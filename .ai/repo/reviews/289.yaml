findings:
  - id: F1
    severity: P2
    status: closed
    title: >-
      No test pinned the release order in releaseNodes() (src/js/labs/mic-analyzer.js:204-212).
      Closed at 7f9f04da: the fake adapter's detachMicrophone() emits {reason 'user', analyser}
      inside the call, as audio-engine.js:900-908 does, and test 7 asserts error '' and the
      MIC_OFF readout after stop() and after a button click; app.cjs stopAfterRestart asserts
      the same. Mutation M3 (attached cleared after detachMicrophone()) now fails unit test 7
      (actual 'The audio engine disconnected the microphone; it was stopped.') and the browser
      check in chromium and webkit (stopAfterRestart false); the head passes both.
  - id: F2
    severity: P3
    status: closed
    title: >-
      The 'replaced' exclusion in onEngineDetached said the lab's own start() causes the event,
      which it cannot. Closed at 7f9f04da: the clause is gone (mic-analyzer.js:219-225), the
      comments say a 'replaced' naming the lab's analyser comes from another caller, and test 6
      pins the stop with MIC_ENGINE_DETACHED and the other graph kept; restoring the clause
      fails test 6. Probe replace.cjs in chromium confirms it on the real engine.
  - id: F3
    severity: P3
    status: open
    title: >-
      Scope note, unchanged: the V1 instrument mic indicator (src/js/core/instrument.js:545-549)
      goes off when _discardContext calls stopMic('closed') but notifies only on 'ended', so a
      closed context turns it off with no reason given. Honest, not stale; C015 leaves it.
      Studio drops its mic source on 'context' closed (src/js/studio/runtime.js:388-390).
  - id: F4
    severity: P3
    status: open
    title: >-
      Lens (a) residual, not caused by this PR, re-probed at 7f9f04da: a context suspended or
      interrupted from outside still bypasses the lab. The engine detaches only on 'closed', so
      the button stays on 'Stop microphone' and measure() reads a frozen analyser buffer (the
      time-domain sum identical across reads). Follow-up: forward 'context' state to the lab and
      pause the readout with a stated reason (or stop) while the context is not running, as
      src/js/measurement/capture.js:385 already treats 'suspended'/'interrupted'.
  - id: F5
    severity: P3
    status: open
    title: >-
      The branch conflicts with origin/main 88b936cb in tests/README.md (the browser/app.cjs
      row: main appended C020 text after 'ledger W7b', the branch the C015 clause); GitHub
      reports CONFLICTING and no checks ran on 7f9f04da. Not a code defect and main touched no
      guarded file, so a merge resolved as main's row plus the C015 clause keeps this verdict;
      done so in a scratch copy, it passes unit (3297) and mic-detach-on-close in all engines.
      Fix: merge origin/main with that resolution and rerun CI.
