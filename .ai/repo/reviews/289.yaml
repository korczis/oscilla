findings:
  - { id: F1, severity: P2, status: open, title: "No test pins the release order in releaseNodes() (src/js/labs/mic-analyzer.js:203-212). The real engine emits micAttachment {reason 'user', analyser} synchronously inside detachMicrophone() (audio-engine.js:906). If `attached` were cleared after that call (mutation M3, the pre-PR order), onEngineDetached would take the user's own Stop for an engine loss: readout 'The audio engine disconnected the microphone; it was stopped.' on every normal stop, a false reason. The fake adapter's detachMicrophone() (tests/unit/mic-detach-on-close.test.mjs:93) does not emit, and test 6 emits 'user' only after lab.stop() returns, so M3 passes 6/6 here, and per the earlier pass it also passes app.cjs mic-detach-on-close. The PR body and tests/README.md:120 ('does not take its own stop for a loss', a GATE row) claim coverage that is not there. Fix: have the fake detachMicrophone() emit {reason 'user', analyser: last attached} synchronously, as the engine does, and assert st.error === '' (and the MIC_OFF readout) in stopAfterRestart (tests/browser/app.cjs:2189)." }
  - { id: F2, severity: P3, status: open, title: "The 'replaced' exclusion in onEngineDetached (src/js/labs/mic-analyzer.js:218), with its comments at 216-217 and 24-25, says the lab's own start() causes the event. It cannot: `attached` is null whenever start() calls attachMicrophone, so the identity check already ignores it. The clause only takes effect when another caller replaces the lab's live graph. Then engine.detachMicrophone('replaced') stops the lab's tracks (closeMicrophone, no 'ended') and the lab stays on 'Stop microphone' over a dead analyser: the C015 defect. No second writer exists in the shipped app (only the lab calls adapter.attachMicrophone), so nothing is broken today. Fix: drop the clause and its test line, or justify it correctly." }
  - { id: F3, severity: P3, status: open, title: "Scope note: the V1 instrument mic indicator (src/js/core/instrument.js:545-549) goes off when _discardContext calls stopMic('closed') but notifies only on 'ended', so a closed context turns it off with no reason given. It is honest, not stale, and C015 leaves it unchanged. Studio drops its mic source on 'context' closed (src/js/studio/runtime.js:388-390). Informational." }
  - { id: F4, severity: P3, status: open, title: "Lens (a) residual, not caused by this PR: a context suspended or interrupted from outside still bypasses the lab. The engine emits 'context' but detaches only on 'closed', and the lab hears only micAttachment, so the button stays on 'Stop microphone' and measure() (src/js/labs/mic-analyzer.js:300) presents a frequency estimated from a frozen analyser buffer as live. Probe at b211d3e0: '398 Hz ± 3 Hz', with an identical time-domain sum across reads; origin/main behaves the same. Measurement capture already treats 'suspended'/'interrupted' as an interruption (src/js/measurement/capture.js:385). Fix (follow-up): forward 'context' state to the lab and pause the readout with a stated reason (or stop) while the context is not running." }
