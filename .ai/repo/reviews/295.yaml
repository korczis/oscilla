findings:
  - { id: R-1, severity: P2, status: open, title: "Nothing tests that Stop keeps the stage chain open until the fading passes have ended. closeChain's guard `if (priv.voices.size) return;` (src/js/sequencer/editor.js:115) is correct at this head, but deleting it (M7) makes stop() (editor.js:475) dispose the chain at once while 3 passes still fade: chain.dispose() disconnects the filter stage and every pass node under a live signal, a hard cut on every Stop, and tests/unit/sequencer-stage-chain.test.mjs stays 8/8 (test 2 reads `disposed` only after advance(0.5); the browser leg's click checks use the fixture, not this chain). Fix: after ed.stop(), assert !opened[0].disposed while ed.stats().voices > 0 and the census is above 0, then disposed and census 0 after the fade." }
  - { id: R-2, severity: P3, status: open, title: "Nothing tests the per-pass untrack (release() in the pass onEnded hook, src/js/sequencer/editor.js:367). Without it (M8) the engine census grows by 32 per pass for the whole loop (21 steady on head; 49,81,113,145,177 over 20 s) and 8/8 still pass, because test 3 runs 4 passes and asserts only activeNodeCount > 0, and stop or natural end releases everything through chain.dispose(). Fix: assert activeNodeCount after N loop passes equals it after one." }
  - { id: R-3, severity: P3, status: open, title: "C003.yaml acceptance criterion 3 asks for a unit test of the offline sequence render that attenuates the 4 kHz block by more than 20 dB; tests/unit/sequencer-stage-chain.test.mjs:153 checks only that the carrier reaches the destination through a 200 Hz low-pass biquad (the fake context does no DSP). The dB figure is measured only by the browser leg (WAV -24.9 -> -77.4 dBFS); docs/CLAIMS.yaml's note says so, the PR body does not list it as a deviation. Fix: state the deviation in the body (or measure the offline render with a DSP-capable context)." }
  - { id: R-4, severity: P3, status: open, title: "No unit test covers main.js's wiring of the Filter Lab into the sequence (openSequencerStage / sequenceInserts, src/js/main.js:121,194): with `if (live) return [];` (M9) the live sequence gets no filter and 8/8 pass, because the unit test injects its own createFilterStage factory instead of labs.filter.createInsert. The browser leg does catch it (34/39 on origin/main's dist), so the gap is unit-level only." }
  - { id: R-5, severity: P3, status: open, title: "The 'instrument only' notes (src/index.html:965,1025) sit in panels whose data-osc-modes is 'synthesis', so at 1536 and 390 px they are not displayed in the Sequencer workspace at all (only the 768-1279 px layout shows every panel); they show while the sequence plays in the Synthesis workspace. Nothing misleads, but criterion 4 and the PR body's 'in the Sequencer workspace' hold only at tablet width. Their title attributes span two source lines, so the tooltip carries a literal newline and indentation, and both <h2> lines are 110 and 113 characters." }
  - { id: R-6, severity: P3, status: open, title: "Pre-existing, limits the PR body's 'so the exported WAV is what plays' to the filter: the live sequence plays model.waveform (and the new status bar names it), while renderWav passes waveform: cmp.waveform (src/js/main.js:297), which compileSequence uses to override it. The Alpine effect (main.js:683-686) copies cmp.waveform into the editor only when cmp.waveform changes, so a loaded sequence with another waveform plays one waveform and exports another." }
  - { id: R-7, severity: P3, status: open, title: "If opening the stage chain throws, play() leaves playing true with no error text: sessionChain() runs at the top of _schedulePass outside its try, after play() set this.playing = true (src/js/sequencer/editor.js:450), and the panel's click handler (sequencer-panel.js:484) does not catch. The new try/catch around compileSequence only cleans up and rethrows, so a compile throw also leaves playing true (that part predates the PR). Unlikely with createFilterStage. Fix: reset playing and set error in play() on a throw." }
  - { id: R-8, severity: P3, status: open, title: "Informational, pre-existing, C002/C001: openSequencerStage (src/js/main.js:121) does not check app.measureOwnsOutput() as the engine.play wrapper does (main.js:219-226), and Escape and stopPlayback stop the sequencer only when the cmp.seqPlaying mirror is set (main.js:235, 552). C003 depends on C002, which has not landed; neither path is changed or regressed here." }
  - { id: R-9, severity: P3, status: open, title: "Re-check, lens (a), pre-existing: the stage chain is now engine-owned and counted, but the engine's own stop paths do not reach it: engine.stopAll() (Escape), revokeContinuous() and _releaseAll iterate this.voices only (src/js/audio/audio-engine.js:645-668). Every stop of the sequence goes through main.js's stopSequencer, gated on cmp.seqPlaying, which a 150 ms interval mirrors from editor.playing (main.js:479-485); the pagehide/visibilitychange hide() (main.js:567-575) has the same gate as Escape. So for up to 150 ms after Play, Escape or hiding the tab leaves a looping sequence sounding. Belongs with C001 (stop paths read live state): read labs.sequencer.editor.playing, or let stopAll close open stage chains' sessions." }
