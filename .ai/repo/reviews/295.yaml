# Review verdict for pull request #295, plan item C003 (M090, PACK 03 'One Instrument, One
# Coherent State'): the V2 pattern sequencer plays through the engine's counted Filter stage, and
# the Envelope and Additive labs say they shape the instrument only (branch
# fix/c003-sequencer-filter-stage). Reviewed head a8e4908d6afb (== origin and ls-remote at fetch;
# merge base origin/main cdda563c1982). Built by the builder's session; reviewed by dev-68 in two
# passes (a first review, then an independent re-check that tried to refute each finding against
# the code and re-ran the decisive mutations and probes in its own copy).
#
# The digest: scripts/review-verdict.mjs --content --list --base origin/main, run in the PR
# worktree. The branch's scripts/ is byte-identical to origin/main's (git diff origin/main HEAD --
# scripts is empty), so the base branch's copy gives the same value: ca675152...0e2f over
# src/js/audio/audio-engine.js and src/js/audio/stage-chain.js, which matches the PR body.
#
# Lenses: (a) reach: every control path that should shape the sequence (Filter type, cutoff, Q,
# gain, enable, chart drag, project load) and every stop path; (b) click-free: no sounding param
# stepped, no stage cut under a live signal; (c) fail-first and mutation; (d) PR body and docs vs
# code and C003.yaml's acceptance criteria; (e) the unit, build and browser runs.
#
# Runs (the PR worktree was used read-only for code: its only occupant was a majordomus-cli
# 'serve --repo <worktree>' daemon, pid 58088, not a Claude session; git status clean before and
# after, apart from this file; every test and mutation ran in git-archive copies in the
# session scratchpad with the worktree's node_modules symlinked; nothing was installed):
# - Fail-first: tests/unit/sequencer-stage-chain.test.mjs on an archive of origin/main fails 8/8
#   by assertion; on the head archive it passes 8/8.
# - Mutations (head copy, one at a time). Killed: M1 pass into getDest instead of chain.input,
#   M2 closeChain never disposes, M3 a chain per pass, M4 offline render ignores inserts, M5
#   stageChain does not add to engine.nodes, M6 _discardContext keeps chains, M10 track/source
#   hooks dropped. Survived (re-run in the re-check, 8/8 pass each): M7 closeChain ignores fading
#   voices (R-1), M8 no per-pass untrack (R-2), M9 main.js gives the live sequence no filter
#   (R-4). Redundant but harmless: M11/M12 (dispose/stop without closeChain; _voiceEnded closes).
# - Fake-context probes: head, right after stop() the chain is open (disposed false, 3 passes,
#   21 nodes fading) and disposed with census 0 one second later; under M7 the chain is disposed
#   at stop() while the 3 passes still fade (census 0 at once: their nodes disconnected under a
#   live signal). A 20 s loop holds census 21,21,21,21,21 on head and 49,81,113,145,177 under M8.
#   30 restarts reuse one chain at a steady census.
# - Unit: the engine, freeze, sequencer and v31 studio-sequence suites 1300/1300. Full
#   node --test tests/unit: 3286 tests, 3266 pass, 10 skipped, 10 fail: 9 are git ls-files in a
#   non-git archive (plan-yaml-strict, repo-hygiene, version-authority pass 26/26 read-only in the
#   worktree), 1 is the load-dependent v31-studio-performance budget the PR body also reports.
#   npm run build:check: dist/index.html up to date.
# - Browser (cached Playwright Chromium, OSC_LOAD_MAX=200): tests/browser/sequencer.cjs on head
#   39/39; seq-filter-reaches-sequence measured live -52.5 dB, cutoff 12 kHz -2.3 dB / 200 Hz
#   -51.0 dB, engine nodes 17 and sources 2 while sounding, census 0 after Stop and Escape, WAV
#   -24.9 -> -77.4 dBFS. The same leg with --dist on origin/main's build: 34/39, the 5 failures
#   the PR body reports. Firefox and WebKit were not run here.
#
# Checked and found correct: one counted chain per session, opened by the first pass and
# disposed only after the last pass's fade (natural end, Stop, Escape, dispose, closed context);
# a restart during a fade reuses it, so the biquad state never resets at a loop boundary; the
# Filter Lab's set() is the only writer of the stage config and updates every tracked stage
# (instrument and sequence) through createInsert, project load goes through update -> set, and
# engine.updateInserts is not used by the filter; every node compileSequence creates goes through
# the track/source hooks; stage-chain.js adds no automation and the filter stage starts from
# setValueAtTime(t0), so no sounding param is stepped; the offline export builds the same chain
# from filter.config on the offline context; the Signal Path animates only for the instrument's
# voice (st.live.voice) and reads 'idle' while only the sequence plays, so it does not claim the
# Envelope or Additive lab for the sequence; Studio pattern clips compile their own graph
# (transport.js:642), outside the Filter Lab by design.
#
# Open: R-1 (P2) and R-2 to R-9 (P3). R-1 is kept at P2: the guard it names is what keeps every
# sequencer Stop click-free (project.audio-engine-discipline: never clicks), the claim
# sequencer-through-filter-stage is marked guaranteed on this unit test, and nothing in the unit
# or browser gates fails when the guard goes. The behaviour at this head is correct; the fix is
# a test, not code.
