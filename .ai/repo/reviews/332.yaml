# Review verdict for pull request #332, the synth engines (K090 and the K-line engines; branch
# feat/synth-engines, stacked on feat/synth-panel = #329). Reviewed head 5afc08a4 against base
# origin/feat/synth-panel. Another session built it (oscilla-b0); this reviewer built none of the
# synth code. prismatic-majordomus-f3 reviewed the DSP lens earlier (its three P1s verified fixed by
# measurement, and the FM-bass DC-block P2 that 5afc08a4 fixes); this review is the voices-and-tests
# lens oscilla-b0 asked for, plus the #329 slow-arming leak.
#
# The digest is scripts/review-verdict.mjs (git archive origin/main scripts) run --content over
# the 9 guarded paths it names against origin/feat/synth-panel: src/js/audio/additive.js and
# src/js/studio/{adapters/engines,adapters/nodes,adapters/voices,live-notes,nodes/engines,offline,
# registry,transport}.js.
#
# How it was reviewed, three lenses in detached worktrees at the head, a skeptic per P1-P2:
# - Mutations, one revert per claimed fix (14 mutants, synth-engines.cjs --only rows one browser
#   at a time with OSC_LOAD_MAX=40, and the round-2/round-3 unit files): 12 killed. Clap gate-off,
#   plain linear FM through the stack (375.6 cents), round-2's 0.1x high-pass (123.5 cents, caught
#   by o-pitch's drive part only), swapped phase tables, Level/4, steal before the fade, morph
#   headroom and level factor, silent-note steal, ring without modulator, legato off and legato from
#   the floor are all killed. Survivors: V1 and V2 below.
# - Voice repros live in chromium at 48 kHz on the committed dist: none of f3's three reproduces.
#   A sourceless note steals nothing (16 voices before and after, noteOn stolen:false); a retrigger
#   on the formant pad dips 0.06 dB (was 28-33 dB); percussion allOff silences the open hat.
#   synth-engines.cjs desktop and synth.cjs pass.
# - The slow-arming leak: reproduced in 1 of 5 natural runs per engine (chromium, webkit) at -42 dB
#   RMS for 107 ms, and 6 of 6 when the Arm transaction is stalled past t0 + attack, at -31 dB RMS
#   (a held C4 sustains at -31.5 dB) for 117-128 ms. The cause is #329's transport (V4).
#
# Verdict: merge. No P0 or P1. V4 is #329's code and is open there as well; it should be fixed in
# #329 before the synth chain is released, but it does not block this pull request's merge.
