# Review-findings audit of 2026-11-10: every finding still marked open at P0-P2 in
# .ai/repo/reviews/<n>.yaml on main, classified against main as fixed (the commit that fixed it,
# verified by reading the code and, where a test holds it, a mutation that the test kills),
# superseded (why) or open (the plan issue that now tracks it). The historical verdict files
# are not edited: their `status: open` stays as written, and this record says what is true now.
# Ordered by oscilla-43 (integrator), scoped with oscilla-c1 (rev-seat), 2026-11-10.
#
# Method: the open findings were extracted from the 96 verdict files at the base with
# scripts/yaml-subset.mjs (613 findings, 381 open: 2 P1, 61 P2, 318 P3). The P1s and #367 F1
# were judged by oscilla-c3; the other P2s by four read-only reviewer agents of oscilla-c3, each in
# its own detached worktree at the base (mutations run and reverted, no browser suite), and
# re-checked by oscilla-c3 where an agent rated a finding above P2 (252 R1, 304 R1 reproduced).
# No finding is re-rated: severities stay the reviewers' (oscilla-43 kept 252 R1 at P2 and asked
# for it to be fixed first, as E061).
#
# P3s: a commit-message cross-reference (a fix, test or feat commit on main naming the finding;
# a chore(plan) commit naming it; nothing) proved unreliable on a 31-finding sample verified
# against main: of 15 "named by a fix commit" 8 were fixed and 7 still open (a train commit that
# lists the PR, the PR's own merge, a same id from another round); of 8 "named by a plan commit"
# 1 fixed, 4 superseded, 3 open; of 8 named nowhere 0 fixed, 1 superseded, 7 open. So only the
# sample is classified below and the rest stays unclassified; the cheap counts are recorded as
# signals, not classes.
