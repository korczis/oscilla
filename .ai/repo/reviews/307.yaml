# run --content over the 2 guarded paths it names: src/js/measurement/engine.js and
# src/js/measurement/views/quality-bar.js.
#
# How it was reviewed: three independent lenses (correctness at every boundary; tests and fail-first;
# truth of the copy against project.no-fake-science), each in a detached worktree at the head, with
# a scratch boundary probe of reduceQualityBar and checkCapture. Two skeptics per P0-P2 finding.
#
# What holds:
# - runClipping uses peak >= CLIP_THRESHOLD on the same max|x| that checkCapture computes and that
#   quality.js judges for CLIPPING_NOT_EXCLUDED, so the bar and the assessment agree at 0.98,
#   at Float32(0.98) and one ULP or one 16-bit LSB below; a -0.98 rail sample gives AT RAIL.
# - The bar can no longer say NONE for a run whose peak reached the rail, and cannot say AT RAIL
#   below it; NaN, Infinity, undefined, an empty capture or NON_FINITE samples give NOT CHECKED.
# - NONE truncates rather than rounds up (0.97996 shows 0.979); AT RAIL, NOT CHECKED and DETECTED
#   are kept across later clean runs; live chunks no longer downgrade them; the reducer stays pure.
# - No regression for the other bar items or the GOOD/USABLE/POOR/INVALID assessment; the copy
#   says "not excluded" / "unknown" and names the threshold and the analog blind spot.
# - readout-states-quality-bar.test.mjs passes 11/11 at the head and fails on the merge base
#   (fail-first holds).
#
# Verdict: merge. One P2 test gap (R1) is open and should be closed in this PR or the next; it
# does not block. The rest are P3 follow-ups, two of them on pre-existing lines.
