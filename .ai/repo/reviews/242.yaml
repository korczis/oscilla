# Review verdict for pull request #242, plan issue R021: release:publish resumes a publish
# interrupted after its tag reached origin (scripts/release-publish.mjs). Branch
# fix/r021-resumable-publish. Reviewed head cca0d3a185d6 (delta fd636daa..cca0d3a1 over the
# first review at f2f08a245e23: d7b58b9 tests, 649d93b fix, cca0d3a rule; 54f7867 is a clean
# merge of main 4562145 and was not reviewed as part of the delta); merge base 4562145. Built
# by oscilla-b0's agents; reviewed by dev-68, which built none of it.
#
# The digest: the base branch's scripts/review-verdict.mjs (git archive origin/main scripts),
# `--repo . --head HEAD --content --list --base-branch origin/main`, now over
# scripts/release-analyze.mjs, scripts/release-publish.mjs and
# tests/unit/release-publish.test.mjs: 2f984c9e...8d3f74f7, which matches the builder's. The
# head's own script gives the same digest.
#
# First review (f2f08a245e23, digest 1c1ac51b...2560b531): verdict changes for R-1 (P1).
#
# Delta review (cca0d3a185d6), four lenses:
# - Correctness, R-1: lastReleaseTag(run, { exclude }) drops exactly the tag name being
#   published (`t !== exclude` over `git tag --merged HEAD --list v*`, whose names are exact).
#   publish passes `tag` (v<now.version>); the version is read from the receipt, never from
#   lastReleaseTag, so the excluded tag cannot feed back into the version. previousTag is taken
#   before the dry-run/live split, so both paths get it. On a fresh publish the tag is not yet
#   in the list, so the exclude changes nothing; release-analyze and release-cadence call it
#   without exclude, as they should.
# - Safety, R-3: a tag local at HEAD and absent on origin now refuses on its own line, naming
#   `git push origin refs/tags/<tag>` (then re-run to resume) and the undo `git tag -d <tag>`.
#   Both are printed, never run; nothing deletes or forces. A local tag at another commit keeps
#   the plain refusal. The local tag is read peeled (`refs/tags/<tag>^{commit}`), so an
#   annotated tag compares as its commit.
# - Rule, R-4: release-flow-complete's statement and Failure behaviour now describe the resume,
#   its notes and its three refusals, matching the code (main must still stand at the tagged
#   commit: the HEAD == origin/main precondition holds on resume).
# - Tests: node --test tests/unit/release-publish.test.mjs 34/34; release-analyze,
#   release-cadence and release-cli-args 40/40. Mutations, each restored:
#   - dropping the exclude in lastReleaseTag: caught (1 fails: "the notes run from the
#     previous release");
#   - dropping the local-tag clause of resumable(): caught (1 fails: "a local tag at another
#     commit refuses although origin has it at HEAD"), so R-2's survivor is killed;
#   - dropping the R-3 refusal: the suite hung instead of failing, so it was stopped. See R-6.
#
# What the first review checked:
# - Peeling. remoteTagCommit prefers the `^{}` line, then the tag's own line. Against a real
#   bare remote, `git ls-remote --tags origin refs/tags/<t> 'refs/tags/<t>^{}'` prints the tag
#   object and the peeled commit for an annotated tag, and one line for a lightweight tag,
#   under protocol v0 and v2 alike. So both kinds resolve to the commit.
# - Refusal. A remote tag at another commit refuses and names that commit. An existing GitHub
#   Release refuses on resume. Neither path runs a mutating call. Nothing pushes with force or
#   deletes; the undo line is only printed. Every git and gh call is spawnSync with an
#   argument vector, so there is no shell to inject into.
# - Resume order. The tag, the push and the wait for the merge's run are skipped. The redeploy
#   is skipped when the live page already says tagged for HEAD, and an unread page redeploys.
#   A waiting dispatched run of HEAD is adopted rather than dispatched again. verify-deploy and
#   the tagged reads then gate the Release, as on the first run.
# - Runs: node --test tests/unit/release-publish.test.mjs, 31/31. `npm test` was not run
#   here: this worktree has no node_modules, so suites that import uplot and similar fail on
#   import, for a reason unrelated to this change. CI runs it.
# - Mutations of scripts/release-publish.mjs, each run against the test file and then
#   restored:
#   - caught: resuming at any remote commit (2 fail), dropping the existing-Release refusal
#     (1 fail), never adopting a waiting run (1 fail);
#   - survived: dropping the local-tag clause of resumable() (31/31 pass). See R-2.
# - Probe of R-1: a copy of the test file whose fake reports the local tag v40.0.0 at HEAD,
#   which is what the interrupted run leaves in its own checkout. The resumed --yes run exits 0
#   and logs `previous tag: v40.0.0`. In a real repository, `git tag --merged HEAD --list 'v*'`
#   with v1.1.0 at HEAD lists v1.1.0, so readCommits(v1.1.0..HEAD) is empty.
