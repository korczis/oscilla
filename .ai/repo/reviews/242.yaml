findings:
  - { id: R-1, severity: P1, status: closed, title: "a resumed publish names its own tag as the previous release. scripts/release-publish.mjs:373 takes previousTag from lastReleaseTag (scripts/release-analyze.mjs:164, `git tag --merged HEAD --list v*`). In the checkout of the interrupted run the local tag v<version> is at HEAD, so that list includes it and previousTag is the release's own tag. readCommits(tag..HEAD) is then empty, and the Release is created with no changes and a compare link from vX to vX. This is the R021 incident's own case: the owner's checkout tagged and pushed. Fix: leave `tag` out when choosing the previous tag, and assert the notes in a resume test with the local tag at HEAD" }
  - { id: R-2, severity: P2, status: closed, title: "no fixture has a local tag: the fake answers every `git rev-parse` with status 1 (tests/unit/release-publish.test.mjs:72) and every tag list with v39.0.0. Dropping `&& (!f.tagLocal || f.tagLocalCommit === f.head)` from resumable() (scripts/release-publish.mjs:233) passes all 31 tests, and the same gap hides R-1. Add a resume case with the local tag at HEAD, one with it at another commit (it must refuse), and one with the tag local only" }
  - { id: R-3, severity: P3, status: closed, title: "a tag created locally at HEAD whose push failed is refused as `already exists locally at f187f66, not HEAD f187f66` (scripts/release-publish.mjs:249), which contradicts itself. Say that the tag was never pushed, and name `git push origin refs/tags/<tag>` (then re-run to resume) or the undo `git tag -d <tag>`" }
  - { id: R-4, severity: P3, status: closed, title: "project.release-flow-complete, under Failure behaviour (.ai/repo/rules/project/release-flow-complete.v1.md:262-265), still says release:publish refuses an existing tag and prescribes a Release made by hand. R021 replaces that path, and R021's own `why` says the by-hand path skips the gates. The rule is outside this PR's scope list, so this is a follow-up" }
  - { id: R-5, severity: P3, status: open, title: "an unreadable remote is reported as an absent one: tagRemote is `remoteTag.status === 0 && stdout !== ''` (scripts/release-publish.mjs:369), so when `git ls-remote` fails, a tag local at HEAD gets the new line `was never pushed to origin ... or undo it with git tag -d` (scripts/release-publish.mjs:250-254), a claim nothing read. The run still refuses (origin/main is then unread too), so nothing is published; only the advice is wrong. Fix: keep the remote read's status in the facts and say the remote could not be read" }
  - { id: R-6, severity: P3, status: open, title: "a mutant of the R-3 refusal (scripts/release-publish.mjs:250, `if (false)`) makes tests/unit/release-publish.test.mjs hang rather than fail: without the refusal the --yes run goes on into the live path, and the R021 test at :851 has no timeout, so node --test waits forever. Give the R021 cases a `{ timeout }` so a regression fails CI instead of stalling it" }
