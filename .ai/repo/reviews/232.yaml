# redeploys Pages and requires the live page to say release `tagged` before the GitHub Release
# (scripts/release-publish.mjs). Branch fix/e025-release-publish-redeploys-pages-after-tag.
# Reviewed head 8ba0e3d1b483a1a7097acf31e00f6ff1e6e9420c (a9e60fc fix, 8ba0e3d plan evidence).
# Merge base origin/main b5c373d, and main has not moved. Another builder wrote all of it.
#
# The digest: the base branch's scripts/review-verdict.mjs judges this pull request. I ran it
# from `git archive origin/main scripts` with --repo on this worktree, `--content --list
# --base-branch origin/main`. It gave 09275ff7...c044e6f over scripts/release-publish.mjs and
# tests/unit/release-publish.test.mjs, the two guarded paths, which matches the builder's claim.
#
# What was checked:
# - Acceptance criteria (majordomus plan show E025):
#   - After the tag and the watched push run, the script lists the workflow_dispatch runs of
#     HEAD and runs `gh workflow run pages.yml --ref main`. It then polls `gh run list --event
#     workflow_dispatch --commit <HEAD>` for a run it had not listed before, bounded by
#     --pages-timeout and never handed to gh run watch. Next it runs verify-deploy --commit
#     HEAD and reads the live metadata region (3 reads, 10 s apart, cache-busting query)
#     until it says release `tagged` for HEAD. Only then does it run gh release create.
#     tests/unit/release-publish.test.mjs pins that order.
#   - A dispatched run still queued, in_progress or waiting at the bound fails with its id
#     and state. So do a run that never appears, a run completed without success and an
#     unreadable list before the dispatch. In each case no GitHub Release is created, no
#     verify-deploy runs, and the undo line for the tag is printed.
#   - The dry run prints the dispatch, the poll and the tagged check after the tag push, and
#     runs no gh workflow run.
#   - pages.yml declares workflow_dispatch and checks out with fetch-depth 0, so the
#     dispatched run sees the pushed tag and stamps `tagged`. The `pages` concurrency group
#     does not cancel in progress. A redeploy cancelled by a later push ends `cancelled`,
#     which the script fails on, never takes for success.
#   - project.release-flow-complete: its statement still holds and its test files pass. Its
#     prose still describes the flow without the redeploy (R-2).
# - Fail-first. In a scratch copy I put the head's tests over `git archive origin/main
#   scripts`. The file fails to import (taggedPageProblem is not exported). With that import
#   removed, 4 fail and 21 pass: the dry-run case, the full --yes sequence, the
#   dispatch/wait/tagged case and the not-finished case. This matches the PR body. At the
#   head all 25 pass.
# - Mutations of scripts/release-publish.mjs, run in a scratch copy against the test file.
#   These were caught: dropping the dispatch; accepting any conclusion; accepting any status;
#   breaking out of the poll on any status; taggedPageProblem accepting untagged; ignoring
#   the commit of the live region; a single tagged read; ignoring an unreadable list before
#   the dispatch. One survives: taking any listed dispatch run instead of one not listed
#   before the dispatch (R-1).
# - Ran in this worktree, no tracked file changed:
#   - node --test tests/unit/release-publish.test.mjs: 25/25.
#   - npm test, first run at load 80 on a shared Mac: 3154/3155. The failure was the timing
#     budget of v31-studio-performance (build 1044.85 ms against a 1000 ms budget), a file
