findings:
  - { id: F1, severity: P1, status: open, title: "In the app default (continuous off, 2 s hard limit) a release edited upward while a note is held makes letting go do nothing: release() (audio-engine.js:650) passes v.noteOff to _releaseVoice, which refuses any fade with stopAt >= v.endTime (:615), so the note stays at full level until the limit and ends with the old play-time tail; the UI stays at PLAYING (no release event). Base fades over 30 ms. With the 2000 ms edit of dead-controls-8 no let-go can fit a 2 s limit. The same refusal hits releaseHold on window blur and pagehide. tests/unit/engine.test.mjs:976-990 asserts the refusal as intended. Fix: when the noteOff fade does not fit, clamp it to end by v.endTime (e.g. min(noteOff, v.endTime - t - 0.011)) or fall back to v.release, so letting go always starts a fade; flip the unit test." }
  - { id: F7, severity: P2, status: open, title: "The same refusal reaches past the hard limit: any voice with a finite endTime, i.e. a held or latched programmed pattern (sweep repeat once, steps, ramps: up to 30 s), refuses the let-go or latch-off stop whenever the edited release does not fit before its own end, with continuous ON too. Probe: held 3 s sweep, edit 30 ms -> 2 s, let go at 1.5 -> refused, plays to 3.03 at full level (base fades at 1.52). The browser check escapes the limit with continuous on and a tone, which never has a finite end. The F1 fix (clamp to v.endTime) covers this; add a unit case for a programmed pattern." }
  - { id: F2, severity: P2, status: open, title: "The PR body's evidence skips the default path: tests/browser/app.cjs:1172 turns continuous on 'an unlimited hold: no hard-limit end to refuse the fade', and the body lists '_releaseVoice still refuses a fade past a limited voice's endTime' as preserved safety without saying that in the app's default configuration the user's let-go is then ignored (F1). Fix: state the limited and programmed-end cases and measure them once F1 is fixed." }
  - { id: F3, severity: P2, status: open, title: "The Settings help text (src/index.html:2976-2979) says release 'also applies to a held note', but a held note that reaches the hard limit, a programmed pattern's own end and a Trigger note's natural end still fade over the play-time release (scheduled at play by v1OpenEnvelope / makeAdsrEnvelope; setNoteOffRelease writes no param by design), and with F1 the edited release is not used at all when it does not fit. Fix: scope the text to 'when you let go' and correct it together with F1." }
  - { id: F4, severity: P3, status: open, title: "The main.js wiring that carries the edit to the sound, syncNoteOffRelease (main.js:379-385) and its Alpine.effect (:582-583), has no unit test; only engine.test.mjs calls setNoteOffRelease. Removing the effect, or passing the Settings value while the Envelope lab is on, passes every unit test and is caught only by tests/browser/app.cjs release-edit-while-held." }
  - { id: F5, severity: P3, status: open, title: "The PR body explains the npm test failure (v31-studio-performance 145-147, Studio build over budget at load 90-148) as load-related without a re-run and without labelling it 'explained but not re-run' with head SHA and load, as shared-machine-discipline rule 3 asks. CI's unit job is green; this is about the record only." }
  - { id: F6, severity: P3, status: open, title: "Informational: CI review-verdict and gate fail until a merge verdict with this content is recorded, and mergeStateStatus is BEHIND (origin/main fde49bd1, docs only). git merge-tree with origin/main is clean, and main's docs-derived, browser-suite-contract and engine tests pass on the merged tree (83/83)." }
