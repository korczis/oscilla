# Review verdict for pull request #330, F002: the Flowbite Pro admin shell (navbar, sidebar drawer,
# page header) replaces the header and the tab bar (branch feat/f002-pro-shell, stacked on
# feat/f001-tailwind-build, #253). Reviewed head bbdeac8d in a detached worktree of its own; base
# origin/feat/f001-tailwind-build cb5f5f74, which the head contains. Another session built it
# (oscilla-b0); this reviewer did not build or edit any of it.
#
# The digest: the base branch's scripts/review-verdict.mjs, run from `git archive
# origin/feat/f001-tailwind-build scripts` with --repo on this worktree, gives 2694abbc...72f0 over
# the one guarded path it names, scripts/build-config.mjs. That change is a comment only (the
# F002 size figures); BUDGET is unchanged, and dist/index.html at the head is 2 935 499 B raw,
# within 3.5 MB / 1 MB.
#
# How it was reviewed: read src/js/ui/shell.js whole, the shell markup of src/index.html, the
# wiring in app.js, shortcuts.js and navigation.js, against project.ui-uses-flowbite-pro (ADR 0061)
# and project.visual-identity-lock; ran ui-flowbite-pro-shell, ui-flowbite-pro-build, navigation,
# no-inert-surfaces, v3-ui and docs-derived with the branch's own node_modules (pass); ran the three
# app.cjs checks CI fails, in chromium on darwin (4/4 pass, see F1 and F2); read CI run
# 41011340141 of this head and run 40969046038 of the base head cb5f5f74 (Browser gate and V3.1
# Studio UI green in all three browsers there); looked at the re-accepted references.
#
# What holds: WORKSPACE_REGISTRY is the one navigation source (app.js MODES, the router ids,
# shortcuts.js names, the sidebar x-for, groups and search all import it; no second list in
# src/js; every i-ws-* symbol exists). The phone drawer contains the keyboard as claimed:
# #osc-main-content is inert while drawerOpen and it encloses the main, the debug panel and the
# status bar (it closes after the footer), the backdrop and the dialogs sit outside it, and the
# navbar stays live so its menu button can close the drawer. Escape closes the drawer and returns
# focus to the menu button, and a nav group to its button; the arrows, Home and End walk the shown
# entries. The list is a navigation landmark again (<nav aria-label="Workspaces">). No flowbite
# data-* toggle and nothing of the Pro sidebar.js. The dark references read as the cockpit.
#
# What fails: CI on this head is red in every browser, on checks the base passes, so the
# failures are this pull request's. The PR body's "test:browser passes in chromium, firefox and
# webkit" holds on darwin only: the three app.cjs checks below pass locally on macOS fonts and fail
# on the Linux runner in all three engines. And test:browser chains its suites with &&, so in CI
# layout, qa-regressions, navigation and ui-flowbite-pro (the deep-link inventory, shell-phone,
# shell-a11y) never ran; the deep-link and drawer claims have no Linux run yet.
#
# On the review-only questions: hide the wordmark below the width where it collides (F2) and keep
# the mark; the dark greys read as the cockpit; the light theme was not judged (no light capture).
#
# Verdict: changes-requested. Two open P1s (F1, F2) refuse the merge.
#
# Re-review of round 2 (head 769d0c51; base origin/feat/f001-tailwind-build e7e12423, refreshed
# with main 27ce813e v3.14.0). The digest, from the base branch's script, is e1a5c2b1...d769
# over the three guarded paths it now names: ci.yml (the browser job 45 -> 55 min and its suite
# step 15 -> 25 min, because every suite now runs), build-config.mjs (DARK_THEME_SELECTOR is every
# theme but light, plus the size comment) and build.mjs (a comment). No CI run has reported on
# this head yet, so the Linux judgement below is the reviewer's own: the head and the base
# exported under $HOME and run in mcr.microsoft.com/playwright:v1.63.0-noble, the image the PR's
# own baselines were taken in.
#
# F1: closed. The fine-step row wraps beside the sidebar; in the container frequency-slider-and-
#   fine-steps passes in chromium and webkit, and in firefox +1 oct is pressed (app 2517.85 ->
#   5035.7). Its one remaining firefox failure (the engine stays at 440 Hz, FFT peak 5 Hz) is the
#   container's audio: the base branch fails it identically there, and CI passes it on the base.
# F2: closed. a11y-header-no-overlap-narrow and a11y-phone-bars-every-state pass at 320-414 px in
#   chromium, firefox (with a PulseAudio null sink, as CI installs one) and webkit; the wordmark
#   hides below 375 px and the mark stays.
# F3: closed. v31-studio-timeline passes 15/15 in chromium and in firefox; dark is every theme but
#   light, matching tokens.css and ui/theme.js. The webkit controls-labelled race is closed by the
#   audit holding the render before it starts (not re-run here).
# F4: closed. nav-groups-keyboard passes in all three engines; the heading takes focus in a
#   microtask of the press's task, and the $nextTick path only retries.
# F5: closed. test:browser runs every suite through tests/browser/lib/run-suites.cjs and fails if
#   any failed; browser-run-suites.test.mjs proves it; the job's timeouts grow to hold all six.
# F6: closed. The aside is the landmark "Sidebar", its list "Workspaces".
# The related unit tests (ci-workflows, ui-flowbite-pro-shell, browser-run-suites,
# ui-flowbite-pro-build) pass, 62 of 62.
#
# New in this round:
# F7 (P2): #337 (E044, verdict merge from this reviewer) copies ci.yml's browser job into
#   main-checks.yml with the old timeouts (45 and 15), and its test fails when the copy differs.
#   Whichever of #330 and #337 lands second makes npm test red on main unless it carries the
#   other's numbers: land #337 with 55 and 25, or refresh it after #330.
# F8 (P3): the dark: variant is :not(:where([data-theme="light"])...) and adds no specificity, but
#   the flowbite plugin's .dark rules are rewritten to :root:not([data-theme="light"]), which adds
#   two classes' worth; in the dark theme a flowbite rule can outweigh an explicit dark: utility
#   on the same element.
#
# Verdict: merge. F1-F6 are closed; F7 is a landing-order note for the two pull requests, not a
# defect of this head; F8 is P3.
