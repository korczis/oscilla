findings:
  - { id: R-1, severity: P3, status: open, title: "The sequence-start release is neither 'within 8 ms' nor at most ESCAPE_RELEASE_S: notesOff(true) anchors the fade at _soon(ctx) (SCHEDULE_LEAD_S 0.02 == START_OFFSET_S, rendered >= currentTime), so the notes stay at full level until at or after the sequence's first sample and overlap it by ESCAPE_RELEASE_S plus up to one render quantum plus clock lag (measured 9.33-9.41 ms on the fake clock). ADR 0058:327 and docs/midi.md:112 mis-state the bound; tests/browser/midi.cjs:812 accepts any endTime < currentTime + 0.5 s and the unit coverage is a wiring regex. Fix: start the sequence at t0 >= the notes' latest endTime, or state the true bound; add a fake-clock unit test of fade end minus sequence t0." }
  - { id: R-2, severity: P3, status: open, title: "The voice-stealing loop in noteOn (src/js/audio/audio-engine.js:897) has no iteration bound; it ends only through the side effect `if (!v.ended) t0 = Math.max(t0, v.endTime)` in fadeOut (~:891) or _cleanup. It terminates as written, but removing that line (mutation M7) hangs the unit suite, and in a browser would freeze the tab on a Note On. Fix: cap the loop at voices.size (or NOTE_POLYPHONY + 1) iterations, refusing the note with reason 'polyphony' if still full." }
  - { id: R-3, severity: P3, status: open, title: "playAfterMidi (src/js/main.js:474) calls app.midiAllOff() before editor.play's own refusals, so PLAY on an empty sequence or with audio unavailable cuts every held MIDI note although nothing starts; docs/midi.md says notes stop 'when the sequencer starts'. Safe direction. Fix: release only when the sequence will schedule (blocks and context present), or document it." }
  - { id: R-4, severity: P3, status: open, title: "The PR body's acceptance 1 says node --test 'tests/unit/midi/*.test.mjs' 51/51; at c8e0b697 (and cc46ac15) it runs 54 tests, all passing. Fix: update the body to 54/54." }
  - { id: R-5, severity: P3, status: open, title: "Hiding the page silences held notes (src/js/midi/ui.js:77), but ownedBy() never looks at doc.hidden, so a Note On arriving while the tab is hidden still sounds (MIDI is the only way a hidden page can start sound). Nothing leaks or sticks: finite notes stop on the audio clock and continuous ones on their Note Off. Fix: refuse notes while doc.hidden (one notice), or say in docs/midi.md that hidden pages still play." }
  - { id: R-6, severity: P3, status: open, title: "glideStart covers setMasterGain only. Other at-now gain glides (src/js/audio/stereo.js:111, src/js/audio/noise.js:182, src/js/studio/adapters/nodes.js:87, src/js/studio/transport.js:1251) would meet the same Gecko start-from-default 1 if one were issued before the first render quantum; none is shown to be at this head (they run on a playing graph) and all sit before the limiter and ceiling. Not reproduced: a hardening note, e.g. route them through glideStart." }
  - { id: R-7, severity: P3, status: open, title: "No browser check pins the Gecko case itself on every platform: the fix is held by the mock start-time test (tests/unit/engine.test.mjs) and by the CI linux leg of tests/browser/midi.cjs, whose first-note margin on darwin Firefox is 0.0099999 vs 0.01. A firefox check that reads a fresh context's master level 20 ms into the first sound (0.418 without the fix, 0.08 with it, per the commit) would hold it directly." }
