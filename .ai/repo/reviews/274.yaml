findings:
  - { id: R-1, severity: P3, status: open, title: "release:prepare has no signal handler (scripts/release-prepare.mjs:443-457): a Ctrl-C reaches the whole foreground process group, so the parent dies with the child and the restore never runs, leaving package.json, the lock, dist and now src/data/roadmap.json modified. This predates #274 for the other three paths; #274 adds the roadmap to what is left. The tree was required clean, so `git checkout HEAD --` repairs it. Fix (follow-up): restore on SIGINT/SIGTERM, or say so in the loud message." }
  - { id: R-2, severity: P3, status: open, title: "scripts/roadmap.mjs:155 lets planRoadmap's error escape main(), so a missing or failing majordomus prints a stack trace rather than a one-line `roadmap: ...` message. It fails closed (exit 1, file untouched), so this is presentation only. Fix: catch in main and return 1 with the message." }
  - { id: R-3, severity: P3, status: open, title: "The gate refreshes the roadmap and the next release commit must carry it, but nothing between releases says the committed roadmap is stale: the plan check runs only under OSC_ROADMAP_CHECK=1. That is the design (a pull request is not held to the plan), and About can show a roadmap one release old. Fine if intended; the PR body could say it." }
  - { id: R-4, severity: P3, status: open, title: "`.osc-about-block > ul` (src/styles/about.css:323, 331) styles every direct ul child of any About block, including one a later card adds, and the class ratchet cannot see it (it counts classes; the stylesheet's selector count still moves). Fix when F001 lands: move both lists to Flowbite list markup and drop the descendant selectors." }
