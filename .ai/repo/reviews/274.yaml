# Review verdict for pull request #274, plan item U002: About tells the project as it stands and
# what comes next (branch feat/u002-about-current). Reviewed head 7077e98da3 (== origin at fetch);
# merge base origin/main c7e041698d. Built by oscilla-b0's session; reviewed by dev-68.
#
# The digest: the base branch's scripts/review-verdict.mjs (git archive origin/main scripts into
# a scratch dir), `--content --base-branch origin/main` and `--repo . --head HEAD --content --list
# --base-branch origin/main`, over the one guarded path the pull request changes,
# scripts/release-prepare.mjs: 80fc4ade...73ee9, which matches the builder's.
#
# Lenses:
# - release:prepare (guarded): RESTORE_PATHS now holds src/data/roadmap.json, and GATE_COMMANDS
#   runs node scripts/roadmap.mjs before npm run build. Every gate command runs through sh(); a
#   non-zero exit, a spawn error and a child killed by a signal (status null) all give ok false,
#   and the loop then restores all four paths from HEAD in one git checkout. The tree was required
#   clean, so that restore is byte-exact. roadmap.mjs computes the plan before it writes, so a
#   failing plan leaves the file untouched, and the write is one writeFileSync of the whole
#   serialization. OSC_ROADMAP_CHECK=1 rides in gateEnv for every gate command, the build
#   included, but only tests/unit/about-current.test.mjs reads it (grep over scripts, src, tests
#   and .github), so its reaching the build is harmless.
# - A plan-only commit leaves dist unchanged: the bundle imports src/data/roadmap.json (about.js:5)
#   and nothing reads .ai/ or fetches. Shown in a scratch copy: build.mjs --check is up to date at
#   HEAD (source 48efc4fc31fe) and still up to date, with the same source digest, after a change
#   to .ai/repo/project/issues/D001.yaml alone.
# - roadmap.mjs: majordomus missing (ENOENT) and majordomus exiting non-zero both throw a named
#   error and exit 1, with the file untouched (checked with PATH stripped and outside a repository).
#   --check compares shape, membership, closed status, title, done/required and order; each of
#   those is held by a test (below).
# - About: the owner's 2026-10-28 override of Q005's headline is named in about-origin.test.mjs
#   (lines 16, 95, 132, 189). The workspace list is checked against the navigation's own
#   data-osc="nav.<id>" links in nav order (about-current workspaceProblems), so it cannot drift.
# - Flowbite ratchet: F001 has not landed, so no Flowbite classes are available yet. The two new
#   lists take no class; `.osc-about-block > ul` and `> ul > li` join the existing rules-list
#   selectors, and four dead classes (night-head, stamp, stamp time, stamp-sep) go. Debt goes 3910
#   to 3901, and about.css 90 to 89 selectors. That is the right call while F001 is out: it adds no
#   class and lowers the debt. See R-4 for the selector's reach.
#
# Runs (existing node_modules, nothing installed):
# - node --test about-current, about-origin and about: 21 pass and 1 skip (the plan check, by
#   design without OSC_ROADMAP_CHECK). With OSC_ROADMAP_CHECK=1, about-current passes 9/9 against
#   the live plan.
# - Mutations in a scratch git-archive copy, each failing about-current (7/8): roadmap dropped
#   from RESTORE_PATHS; --check ignoring progress; --check ignoring order; gateEnv without
#   OSC_ROADMAP_CHECK; closed milestones kept; the refresh moved after the build.
# - build.mjs --check before and after a plan-only change: up to date both times.
#
# Open: R-1 to R-4, all P3. No P0, P1 or P2 is open.
