findings:
  - { id: R-1, severity: P1, status: closed, title: "[fixed in 12a119d (test ab6ff8c): content scans exactly the five components; every run-time class verified compiled (37/37 by hand, 87 Tailwind classes, no modal/datepicker leakage)] Content globs leave out flowbite's component JS, so the classes the bundled components add at runtime are purged (tailwind.config.cjs:35). Fix: Add exactly the five bundled component files to content, e.g. './node_modules/flowbite/lib/esm/components/{drawer,dropdown,collapse,tooltip,tabs}/index.js'. Keep it that narrow so modal/datepicker classes stay out. package-lock already pins these files, so the source digest stays sound. Drop or correct the v1 `bg-opacity-*` safelist entries. Add a test that reads each component's Default class strings (backdropClasses, activeClasses, inactiveClasses, the placement classes, opacity-0/100, overflow-hidden) and asserts every one is a class in the Tai..." }
