  - { id: R-7, severity: P3, status: closed, title: "[fixed in c57cf77 (test 2718604): decodeCssEscapes() per CSS Syntax 3 runs before the scan] CSS escapes get past the url(), @import and image-set() checks, so the 'every url() is examined' claim is not quite true (scripts/verify-dist.mjs:105). Fix: Before scanning, decode CSS escapes in the text the scanner looks for: hex `\\[0-9a-f]{1,6}\\s?` and `\\<char>`. One option is to normalize a copy of the CSS and use it only for the url(/image-set(/@import matching. The other is to report any backslash escape inside an ident followed by `(`, or inside an at-keyword, as a problem. Add verify-dist.test cases for `\\75 rl(`, `@\\69mport` and `\\69mage-set(`. Or state the limit in tests/README.md and the comment, saying the gate relies on esbuild's normalization." }
  - { id: R-8, severity: P3, status: closed, title: "[fixed] The unparsable-url( case uses an assertion that a different failure would also satisfy (tests/unit/verify-dist.test.mjs:93). Fix: Match the specific message, e.g. /CSS url\\( the scan cannot parse/. Also assert that cssReferences(...).unparsed === 1 for that input." }
  - { id: R-9, severity: P3, status: open, title: "Older gaps outside the CSS scanner, not introduced by this PR: entity-encoded style attributes, SVG presentation url() attributes, and data: stylesheets (scripts/verify-dist.mjs:224). Fix: Decode entities in attribute values before checking them. Run cssProblems on SVG presentation attributes that take url(). For a data:text/css link href, decode the payload and scan it with cssProblems, or reject it. These can go in a separate issue, since the PR does not touch these paths." }
  - { id: R-10, severity: P3, status: open, title: "new with this PR, R-7 class: a quote inside a CSS comment hides an image-set() string from scripts/verify-dist.mjs:140-160, e.g. image-set(/*'#*/\"https://evil.example/x.png\" 1x/*'*/) reports 0 problems though a browser drops the comments and fetches the URL; the real dist is unaffected (esbuild strips comments). Fix: drop comments outside strings before the image-set walk and count an unterminated string as unparsed, or narrow the claim to comment-free CSS" }
  - { id: R-11, severity: P3, status: open, title: "pre-existing (also on origin/main): isInert (scripts/verify-dist.mjs:85) trims with String.prototype.trim, which strips U+FEFF/U+00A0/U+3000 that the URL parser keeps, so url(\"\\ufeffdata:,x\") passes but resolves as a relative path. Fix: trim only C0 control or space; join the R-9 follow-up" }
