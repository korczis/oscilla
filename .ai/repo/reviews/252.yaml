# main has not moved. Another builder wrote all of it (oscilla-b0), not me.
#
# The digest: the base branch's scripts/review-verdict.mjs judges this pull request. I ran it
# from `git archive origin/main scripts` with --repo on this worktree,
# `--content --list --base-branch origin/main`: 106c70d9...e7ee over .github/workflows/ci.yml,
# scripts/fail-first.mjs, tests/unit/ci-workflows.test.mjs and tests/unit/fail-first.test.mjs,
# the only guarded paths.
#
# How it was reviewed: four independent lenses, each read-only against this head, each finding
# then given to a separate skeptic told to refute it unless it reproduced (13 agents):
# - fail-first.mjs behaviour, with hand-built fixture repositories in mktemp dirs;
# - the ci.yml changes (events, fetch depth, conditions, hidden failures, injection);
# - whether each assertion of the two guarded tests can fail, by mutating the code under test;
# - every claim the rules, ADR 0055 and the merge-train skill make about what is enforced,
#   against the guarded code.
#
# Result: no P0 and no P1. Seven P2 findings reproduced and stay open as follow-ups; two claims
# were refuted (a feat/fix title behind an emoji or "WIP:" prefix; and a P1 claim that a train
# titled feat or fix keeps the train-wide waiver, which the code does not grant). None of the
# open findings lets broken code merge: R1 lets one malformed member row go unjudged, R2 can
# count one flaky base failure as evidence, R3 refuses a valid fix (a false refusal), and R4-R7
# are mutations the suite does not catch.
