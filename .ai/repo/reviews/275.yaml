# Review verdict for pull request #275, plan item K024: the analytic signal of the audio buffer
# by an FFT Hilbert transform (branch feat/k024-analytic-signal). Reviewed head f46e0aa077
# (== origin at fetch); merge base origin/main b67d1e58. Built by the builder's session;
# reviewed by dev-68.
#
# The digest: the base branch's scripts/review-verdict.mjs (git archive origin/main scripts into
# a scratchpad), `--content --base-branch origin/main` and `--repo . --head HEAD --content --list
# --base-branch origin/main`, over the one guarded path the pull request changes,
# src/js/analysis/analytic.js: b943ba22...f442, which matches the builder's.
#
# Lenses, each read against src/js/analysis/analytic.js and measured with a node script run
# against the module itself (not a copy of its arithmetic):
# - Maths. The one-sided spectrum keeps X[0] and X[N/2], doubles X[1..N/2-1] and zeroes
#   X[N/2+1..N-1] (:127-137); the inverse by conjugation is conj(FFT(conj X))/N, scaled by 1/N
#   (:126-144). Odd buffer lengths are zero-padded to the next power of two, so the transform
#   is always even. instantaneousFrequency is arg(z[n+1] conj z[n]) fs/2pi, length N-1 (:179-193).
#   unwrapPhase wraps each step by round(step/2pi), the standard threshold of pi (:163-173).
# - Taper and the bounds. The raised cosine covers taperFraction (5 %) at each end; the interior
#   on which ANALYTIC_BOUNDS is stated excludes edgeFraction (10 %), so the tapered samples are
#   never inside the claim. Measured on in-band signals (every component inside trustedBand():
#   pure tones at exactly low and high, AM with carrier low+fm / high-fm, FM with deviation 20 Hz
#   and three sidebands of margin), at 44.1 and 48 kHz on 0.1, 0.2 and 0.5 s buffers:
#
#     region                         envelope rel.  phase rad   frequency Hz
#     interior (stated bound)        3.6e-5         3.4e-5      0.036     (bound 1e-3, 1e-3, 0.25)
#     5-10 % (taper end .. interior) 7.8e-4         7.8e-4      0.69      (outside the claim)
#     taper (0-5 %)                  ~1             ~1.6        ~1e3-4e4  (outside the claim)
#
#   A linear chirp from band.high/4 to band.high, and AM/FM in mid-band, stay at or below these.
#   So the bounds hold on the whole interior at both edges of trustedBand(), in time and in
#   frequency, with headroom of about 28x (envelope), 29x (phase) and 7x (frequency); the 5-10 %
#   zone does not meet the frequency bound and is honestly excluded. trustedBand() itself is
#   honest: low = high margin = taperPeriods / taper seconds = 100 / T Hz. A signal whose
#   sidebands cross Nyquist (AM at high with fm = fc/50) breaks every bound, as the conditions
#   ("every component of the signal lies inside trustedBand()") say it may.
# - Mutations (scratch git-archive copy, node_modules linked, nothing installed; the PR worktree
#   was not touched): 1/N scaled as 2/N fails 6; positive bins not doubled fails 6; negative
#   bins kept fails 8; unwrapPhase with trunc for round fails 1; trustedBand margin halved
#   fails 1. Two survive: the taper as a linear ramp (R-1) and the Nyquist bin doubled (R-3).
#
# Runs: node --test tests/unit/analysis-analytic.test.mjs 14/14 at f46e0aa0. The measurement
# scripts are kept in the reviewer's scratchpad (r275/measure.mjs, r275/edges.mjs).
