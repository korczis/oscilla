findings:
  - { id: R-1, severity: P2, status: closed, title: "[fixed in a22dc644: a taper-shape assert |re[i] - x[i]w(i)| <= 1e-9 at both ends and AM/FM edge cases at fm = low/10; the linear-ramp mutant fails 2] The taper's shape carries the stated frequency bound, and no test holds it (src/js/analysis/analytic.js:120; tests/unit/analysis-analytic.test.mjs:153). With the raised cosine made a linear ramp (w = i / taper) all 14 tests pass, yet the interior frequency error of in-band AM at both edges of trustedBand() on 0.1 s buffers rises to 0.40-0.43 Hz (bound 0.25 Hz; FM 0.31-0.33 Hz), measured at 44.1 and 48 kHz with fm = 100 Hz (carrier low+fm / high-fm). The edge test uses fm = 20 Hz and does not reach it. At the reviewed head the same signals measure 0.0085-0.020 Hz. Fix: add an in-band case with faster modulation at the band edges (fm = low/10, still 1/11 of the carrier), which kills the ramp mutant through the bound itself; asserting re[i] == x[i]·w(i) inside the taper pins the shape too." }
  - { id: R-2, severity: P3, status: closed, title: "[fixed in a22dc644: the margin from taperLength(); null for an empty taper or band, 420 samples the first band; RangeError kept for a bad rate] trustedBand(length, rate) for length < 20 returns low > high: taperSeconds is length·0.05/rate while the taper actually applied is floor(length·0.05) = 0 samples, e.g. trustedBand(19, 48000) = {low: 252632, high: -228632} (src/js/analysis/analytic.js:61-67). Outside the stated 0.1 s condition, but analyse() hands this band to K025's consumers unflagged. Fix: compute the margin from taperLength() and throw a RangeError (or return null) when the taper is empty, so no caller can show an inverted band." }
  - { id: R-3, severity: P3, status: open, title: "Doubling the Nyquist bin (src/js/analysis/analytic.js:129) is an equivalent mutant for in-band signals: their energy at N/2 is nil, so no test can tell the two apart. Correct as written; noted so the next reader does not take the survivor for a gap." }
