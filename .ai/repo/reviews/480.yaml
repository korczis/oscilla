# The change. readCommits asks git for %P and counts the parents (an output without the field reads
# as 1). parseCommit carries merge = parents >= 2. commitLevel keeps its order: breaking (the "!"
# or a BREAKING CHANGE footer) still wins on a merge; a conventional feat/fix/perf/revert or a
# none-type keeps its own level, so a pull request's merge commit (OSCILLA lands by merge commit)
# counts by its title as before; only a non-conventional merge ("Merge branch ...") or a merge of
# an unknown type ("merge(main): ...") becomes none, "a merge: its members are counted". A
# single-parent non-conventional commit stays a patch. The members are in the same since..HEAD
# walk, so nothing they carry is dropped. release-publish.test.mjs follows the new --format only.
#
# b1087da3 adds to the analyze header that a change made by hand inside a merge (beyond rebuilding
