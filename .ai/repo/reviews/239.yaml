findings:
  - { id: R-1, severity: P2, status: open, title: "The ledger steps can fail the required gate check, against 'it reports and never fails the gate' (.github/workflows/ci.yml:457-477). Steps default to if: success() whatever the job's if: always(), so when checkout, setup-node, the ledger (shell bash runs -eo pipefail, so a non-Refusal error such as a 200 with an unexpected body, or a failed write, exits 1 through tee) or the upload fails on a re-run, 'Every release-gate job passed' is skipped and gate is red although every job it needs passed. The test's comment 'the verdict always runs' (tests/unit/flake-ledger.test.mjs:236) asserts only that the verdict has no if, which means success(). Fix: continue-on-error: true on the four ledger steps (or if: always() on the verdict step), and a test that asserts it." }
  - { id: R-2, severity: P2, status: open, title: "No test holds the commonest case of a re-run: a job that passed on both attempts is no entry (tests/unit/flake-ledger.test.mjs:53-104). Every fixture's earlier attempt fails, so mutating flake-ledger.mjs:78 to count any earlier run leaves 12/12 green, while on the real run 40829386951 (a re-run of all 21 jobs) it lists all 21 as flaky. The code is right today; nothing keeps it right. Fix: add a job that succeeds on attempts 1 and 2 (run_attempt 2) to the FAILED_FIRST fixture, or its own test, and assert no entry for it." }
  - { id: R-3, severity: P3, status: open, title: "A job is recorded again on a later re-run although it already passed (scripts/flake-ledger.mjs:76-79). Attempt 1 fails, attempt 2 (re-run failed jobs) passes and is recorded; a re-run of all jobs as attempt 3 passes again and is recorded again as '1: failure, 3: success', because any earlier failure counts, not the job's previous run. Fix: compare with the last attempt before current in which the job ran (run_attempt equal to that attempt), and record only when that one failed or timed out; a test with attempts fail, pass, pass." }
  - { id: R-4, severity: P3, status: open, title: "unverified: the artifact name is the same on every attempt (.github/workflows/ci.yml:475). upload-artifact v4 and later keep artifacts immutable per run; if a second re-run's upload of 'flake-ledger' conflicts with the first, the step fails and, through R-1, so does gate. Fix: name: flake-ledger-${{ github.run_attempt }} (each attempt's ledger stays addressable), or overwrite: true; the test pins the name and needs the same change." }
  - { id: R-5, severity: P3, status: open, title: "The gate's runs in .ai/repo/ci/gates.yaml:184 chains the ledger with && and without the attempt guard, so the model says a ledger failure fails the gate and that it runs on every attempt, against the summary beside it and ci.yml. Fix: write the ledger as conditional and non-failing in runs (for example a leading '[ attempt > 1 ] && node scripts/flake-ledger.mjs ...;' before the jq verdict), or say in the summary that runs lists the commands, not their conditions." }
