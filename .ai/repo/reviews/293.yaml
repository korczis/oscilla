findings:
  - { id: F1, severity: P2, status: open, title: "GATE check pan-live-dual (tests/browser/app.cjs:1726-1731) compares the RMS of two different voices with A = B and the default Δφ 45°. 'centred' is a fresh voice started at currentTime + START_OFFSET_S (audio-engine.js:441); 'back' is the setDualRouter restart started at _soon + FAST_RELEASE_S. When one of them loses B's start delay, the levels differ by 0.69 dB, which is over the 0.5 dB tolerance. The first review measured 7 of 27 Firefox file:// runs failing at load 30-70 (centred -29.90 / -31.03 / -33.96 / -46.44 dB vs back -30.63), with 0 failures with phaseDeg forced to 0. CI runs app.cjs in Firefox, and the PR body's Firefox PASS does not hold. Fix: set phaseDeg 0 for the check and restore it, or compare against a level that does not depend on phase." }
  - { id: F2, severity: P3, status: open, title: "Pre-existing: a fresh voice starts at ctx.currentTime + START_OFFSET_S (audio-engine.js:441), not the render-aware _soon() a replacement uses. In Firefox under load, t0 can pass before the audio thread sees the graph, and A and B start together, so the Δφ B the lab shows does not reach the sound. Every pan-engaging or setDualPhase restart rolls it again. This is the PACK03 class; worth its own issue." }
  - { id: F3, severity: P3, status: open, title: "The unit fail-first (tests/unit/dual-router-live.test.mjs on main) fails only with TypeError 'eng.setDualRouter is not a function', and its lab()/want() copies main.js rather than testing it. No unit test holds the main.js wiring (main.js:454-464). The browser check pan-live-dual does: reverting onChange to main's refresh, or dropping '|| liveRouter' (main.js:197), fails it." }
  - { id: F4, severity: P3, status: open, title: "liveRouter (main.js:95) is global, and dispose clears it only for its own router (main.js:150). After a centred retrigger while a routed voice releases, labVizInputs (main.js:197), adapter.getStereoRouter and the correlation meter describe the fading voice until it ends. Pre-existing and related: a router-less centred mono voice switched to Stereo glides its StereoPanners with no router, while the signal path shows one. Both are view mismatches, not wrong sound." }
  - { id: F5, severity: P3, status: open, title: "The comment at phase-stereo.js:184-186 says setSlider leaves a control the user is dragging alone, but dom.js setSlider (38-44) writes input.value whenever it differs, with no focus check (only setField checks document.activeElement). Nit: offsetText rounds to two decimals, so an imported -0.001° (stored 359.999) shows '360', outside the stated [0, 360)." }
  - { id: F6, severity: P3, status: open, title: "The Pan disable rule (src/index.html:1128, source !== 'dual' || dual.stereo) ignores the sequencer. With the source set to dual and only the sequencer sounding (sequencer/compiler.js builds its own oscillators, with no router or dual path), the slider is enabled with no reason shown but moves nothing audible." }
