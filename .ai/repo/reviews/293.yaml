# (node_modules symlinked read-only from the builder's worktree, nothing installed).
#
# The digest: origin/main's scripts/review-verdict.mjs, run from `git archive origin/main
# scripts` with --repo on the detached worktree and --base-branch origin/main: 94610552...f0c over
# the one guarded path, src/js/audio/audio-engine.js. It matches the one oscilla-b0 handed over.
# The branch is behind origin/main (f303e786, v3.14.1); git merge-tree against it conflicts only in
# dist/index.html and tests/README.md, and audio-engine.js merges cleanly (main's one change to
# it, a8e4908d C003, touches no start time), so a plain merge of main does not move the guarded
# content.
#
# The delta, read against each earlier finding:
# - F1 (P2) closed. pan-live-dual sets Δφ 0 before B's frequency (the order matters: the lab
#   learns the dual's frequencies in a later Alpine effect, and a lab change emitted before that
#   would write its stale B back) and restores it first in finally. With A = B the level of a pair
#   is 20 log10 |cos(Δφ/2)| of one tone, so at 0° it no longer depends on whether B's start delay
#   reached the sound: the mechanism of the 0.69 dB gap is removed by construction, not by a
#   wider tolerance (still 0.5 dB). `lab.set` is setCfg (phase-stereo.js:249), synchronous, so
#   `phase0` (deg0 === 0) asserts what the voice plays: main.js:178 reads the lab's phaseDeg at
#   play. The reference level is now steady (three reads of one voice within 0.1 dB, polled every
#   50 ms by until()); `back` is not steadiness-gated but is retried until it is within 0.5 dB,
#   so an attack read there only delays it. The failure message now carries both levels.
# - F2 (P3) fixed. A fresh voice starts at _rendered(ctx) + START_OFFSET_S
#   (audio-engine.js:449-451): clock.js renderedTimeAtLeast with outputTimestamp false, the same
#   readings _soon() uses. It is bounded: play() takes a reading first (audio-engine.js:436), so
#   the newest reading is now and the gain over currentTime is at most CLOCK_LAG_SLACK_S (50 ms);
#   readings are forgotten on a suspend or start (audio-engine.js:281), so a context that has
#   just started is V1's currentTime + 20 ms exactly; without a performance clock it is
#   currentTime. Other readers of t0 (:624 stopAt, :828 planFreqAt with max(0, ...), :999
#   snapshot) accept a later t0. The sequencer editor keeps its own currentTime + START_OFFSET_S
#   (editor.js:355, 391), as docs/v31/timeline.md:208 says.
# - F5 (P3) partly closed: the comment at phase-stereo.js:184-186 now says what dom.js setSlider
#   (labs/dom.js:38-44) does, and it is true for a drag: setCfg stores clamp(Number(input.value)),
#   whose String is the value the range input already holds. The offsetText nit stays.
# - F3, F4, F6 (P3) are untouched by the delta and stay open.
#
# Runs (darwin-arm64, 18 cores, load 5-9 from other sessions; OSC_LOAD_MAX=300):
# - node --test tests/unit/engine.test.mjs tests/unit/dual-router-live.test.mjs: 37/37 pass.
# - Fail-first of F2: the new test 'C010 F2: a fresh voice starts after the audio already
#   rendered' against 86bddef8's audio-engine.js fails ('t0 0.52, expected 0.55'), passes at head.
# - node tests/browser/app.cjs --browsers firefox --origins file --only pan-live-dual: 10/10 PASS.
#   Control: 86bddef8's app.cjs on the same dist also passed 10/10 at this load, so these runs do
#   not discriminate; F1 is closed by the reading above, not by a rate. The rate dev-68 and the
#   first review measured (7 of 27 at load 30-70) was not re-measured under load.
# - --browsers chromium|firefox|webkit, both origins, --only pan-live-dual: 3 runs each, 18/18 PASS.
# - node scripts/build.mjs --check: dist up to date (source da8c59fbb441).
# - npm test: 3287 tests, 3285 pass, 1 skipped, 1 fail: about.test.mjs:207 'release line 3.14
#   (v3.14.0) has a station on the About timeline'. It reads the published tags, and v3.14.0 was
#   released on main after this branch forked; merging origin/main brings its timeline station.
#   Not this change.
#
# Verdict: merge. No P0 or P1; the P2 is closed. P3s stay open for follow-ups. Before landing,
