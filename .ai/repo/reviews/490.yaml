findings:
  - { id: F-1, severity: P3, status: open, title: "the public curl leg has --connect-timeout 20 and --retry 5 but no --max-time, so a slow 504 (11 s measured) times six attempts eats most of the step's 5-minute bound before the fallback starts; add --max-time 30 (or fewer retries) so the API leg always keeps its three 60 s attempts" }
