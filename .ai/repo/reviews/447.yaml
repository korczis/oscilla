#
# What was read and run:
# - The glide (adapters/instrument.js createPitchSchedule), the WATCH item. A ramp cut by a new
#   note: cancelScheduledValues(t) drops the ramp's end, and linearRampToValueAtTime(from, t)
#   re-ends it at its own value at t, so the start event keeps its course and nothing jumps back
#   to the ramp's start (Firefox has no cancelAndHoldAtTime). Probed against a recording param:
#   (a) a glide 0->1 over [1, 2] cut at 1.5 by a glide to 2 over 0.5: from 0.5, events
#   cancel@1.5, ramp(0.5)@1.5, set(0.5)@1.5, ramp(2)@2.0; valueAt(1.75) 1.25, valueAt(2) 2;
#   (b) a glide after a step starts at the step's value; (c) t earlier than the last event:
#   the later segment is dropped and the value at t is the one before it.
# - The note router (live-notes.js): 'note-range' for a note outside 0-127 on every node that
#   plays notes, 'key-range' for a note on outside Key low..Key high on a Keys node, each with
#   its sentence (LIVE_NOTES_TEXT); the Synth and Studio sinks say it assertively; no clamp to a
#   neighbour. gateAt records the gate for debugInfo().notes.
# - The timeline (clip-targets.js EVENT_GATES, transport.js): a gate event clip on a Keys node
#   adds one gate record per Envelope its unmuted Gate edges reach (key `${item}>${env}`),
#   looked up by itemKey everywhere (gatesOf, removal, rebuild); those Envelopes are already in
#   gatedEnvelopes through keysGatedEnvelopes, so the timeline owns their gates at PLAY.
# - The panel (synth/panel.js `studio`): Key low / Key high are validated as params of the
#   node and left off the Synth face (Q031), so the 16 SYN references do not move.
# - Fail-first: tests/unit/synth-keys.test.mjs and v4-clip-target-policy.test.mjs on the merge
#   base e51b169d: 16 pass, 9 fail; at 39b73126: synth-keys, v4-clip-target-policy and
#   synth-panel 29 pass, 0 fail.
# - Browser, this Mac (load ~13, OSC_LOAD_MAX=30): studio-keys.cjs chromium/file 5/5;
#   instrument-dsp.cjs chromium ALL PASS. firefox and webkit are judged by CI.
# - runtime.js is 57 998 bytes under its 58 000 cap (WATCH): the next change to it needs a
#   raises entry; noted, not a finding of this change.
#
# Findings:
# - F1 (P2, open): Key low above Key high is accepted. Both are independent integerParams (0-127)
#   and nothing refuses keyLow > keyHigh, so such a Keys node refuses every note ("outside this
#   Keys node's key range 100 to 50") and its card reads "keys E7-D3". The reason is spoken, so
#   it is not silent, and the defaults (0, 127) are unaffected; a validate diagnostic or a swap
#   on edit belongs with K116, which makes the range editable from the piano's zones.
# - F2 (P3, open): two notes at exactly the same t, the second legato with Glide > 0, glide from
#   the first note's value (which never sounded) rather than the pitch before t: to(1, 1, 0)
#   then to(1, 2, 0.5) gives from 1 where the pitch before t was 0.
# - F3 (P3, open): the schedule keeps its last 8 segments; valueAt(t) for t before the oldest
#   kept one returns that segment's value (12 steps, valueAt(2.5) is 5, not 2). Only debugInfo
#   reads the past (at currentTime), so nothing audible depends on it.
#
# Verdict: merge. F1-F3 are open for K116 (F1) and a later glide touch (F2, F3); none changes
# what an existing document plays.
