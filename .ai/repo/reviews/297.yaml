findings:
  - { id: R-1, severity: P2, status: open, title: "The quality bar still calls the reading the background: reduceQualityBar's 'preflight' case (src/js/measurement/views/quality-bar.js:138-142) builds the Noise item from facts.inputLevel alone and ignores facts.output.otherAudio, so with the sequencer or Studio sounding and rmsDb -20 the Live checks bar shows 'Noise HIGH' titled 'Preflight background -20.0 dB relative (dBFS-like); the noise check measures it.' (src/index.html:1495) while the NOISE_HIGH reason on the same screen says it is not the background level. The coupling-5 no-fake-science claim survives on a second surface, and the browser leg checks only the flow-step reason text. Fix: when facts.output.otherAudio (or audibleVoices > 0) the detail names the app's own output, with a views test." }
  - { id: R-2, severity: P2, status: open, title: "On the Measure path the new texts are false: runMeasure (src/js/ui/measure.js:1452) stops the instrument, then measure() runs a fresh preflight in the same task whose io reads audibleVoiceCount (capture.js:789) while the stopped voice is still in its 8 ms fade (counted for about 28 ms), so ownOutput is true. OTHER_AUDIO then says 'this check leaves them playing and its input reading includes them', and in a noisy room NOISE_HIGH says the reading 'includes the app's own output, which is playing ... it is not the background level: stop it and check again', although Measure has just stopped it and the 0.3 s level window that follows is the room. That attributes the room's noise to the app (the inverse of coupling-5), it lands in result.preflight of the saved experiment, and before this PR the same path said, correctly, 'they will be stopped'. Fix: the measure() preflight passes the caller's fact (false after stopPlayback) and the io takes voices that are not releasing, or the voices are sampled at the level read (see R-5); add a unit case for measure() after a stop." }
  - { id: R-3, severity: P3, status: open, title: "The unit tests check the capture io OR and the measure.js wiring by source regex only (tests/unit/output-owners.test.mjs:105-114): M1 (capture.js sets facts.output.otherAudio = voices > 0 after the literal) and M4 (otherAudioNow returns false &&...) pass every unit test. The browser app leg in CI kills both through its sequencer and Studio cases, so this is test strength, not missing coverage (lowered from P2). Fix: a capture io test with a fake engine that asserts output.otherAudio from opts, and a measure-UI test with a fake svc.outputBusy." }
  - { id: R-4, severity: P3, status: open, title: "Escape, pagehide and the status-bar play key still read the 150 ms seqPlaying copy: stopSequencer (src/js/main.js:551-553) and workbench.js:254 statusPlay gate on cmp.seqPlaying, so Escape or hiding the page within 150 ms of editor.play() leaves the sequencer playing. Predates the PR, but these are readers of the sequencer owner outside the OUTPUT_OWNERS table the PR presents as the one list. Fix: read the table's sequencer busy() there too." }
  - { id: R-5, severity: P3, status: open, title: "otherAudio is sampled once before the check, the input level seconds later: otherAudioNow(cmp) runs when me.preflight() is called (src/js/ui/measure.js:1426-1427) and capture.js:789 reads audibleVoiceCount before ensureContext, queryMicPermission, ensureRecorderMode and ensureInput (which can include a permission prompt). A non-looping sequence or finite tone that ends during the check still gets OTHER_AUDIO and 'the reading includes the app's own output'; a source started during it is missed. Fix: sample at the level read, or OR a second sample taken then." }
  - { id: R-6, severity: P3, status: open, title: "The PR body overstates two things: 'runMeasure already stopped every source, so the measured run was never contaminated' is too strong, because on the merge base stopPlayback gated the sequencer on the 150 ms seqPlaying copy and a sequence started under 150 ms before Measure kept playing (this PR closes that); and 'npm test: 3282/3285 pass. The 2 failures ...' names only 2 of the 3 tests that did not pass (the third, probably a skip, is not named). The fail-first block is accurate (reproduced)." }
  - { id: R-7, severity: P3, status: open, title: "The table covers stop and busy but not the refusal side: the instrument refuses while a measurement owns the output (engine.play wrapper, src/js/main.js:206) and so does the Studio (onClaimOutput, src/js/ui/studio/workspace.js:787), but the sequencer's editor.play() (src/js/labs/sequencer-panel.js:483/487) has no measureOwnsOutput check. Not reachable through the UI at this head (MEASURE hides .osc-workspace and leaving the workspace aborts the measurement, main.js:626), so a hardening note: add a claim/refuse column to OUTPUT_OWNERS when C002's claimOutput lands." }
