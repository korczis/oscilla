# - node scripts/build.mjs --check: dist/index.html is up to date.
# - 15 mutants in git-archive copies of the head, against 11 unit files (1301 tests):
#   M1 (drop the caller's fact from the OR) and M4 (otherAudioNow returns false), the round-1
