  - id: R-8
    severity: P3
    status: open
    title: >-
      The second half of the R-5 fix is untested: dropping the sample after the window
      (capture.js:859, M13), keeping the last sample instead of the maximum (M22), or letting a
      throwing probe fail the check (M23) passes the whole unit suite. So 'a source started during
      the reading is counted' and 'the caller's probe never fails the check' hold by reading only.
      Fix: an io case whose probe or voice turns on during the window (onaudioprocess), one whose
      voice ends during it, and one whose probe throws.
  - id: R-9
    severity: P3
    status: open
    title: >-
      The branch does not merge cleanly with origin/main 88b936cb: GitHub reports CONFLICTING and
