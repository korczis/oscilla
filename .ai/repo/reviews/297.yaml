findings:
  - id: R-1
    severity: P2
    status: closed
    title: >-
      The quality bar's Noise item called a reading with the app's own output the background. Fixed:
      reduceQualityBar (quality-bar.js:141-148) reads facts.output and, with otherAudio or
      audibleVoices > 0, says 'Preflight input ... includes the app's own output ... not the
      background level'. Confirmed by the R-1 views case; mutants M16 and M17 are killed.
  - id: R-2
    severity: P2
    status: closed
    title: >-
      On the Measure path the stopped voice, still fading, raised OTHER_AUDIO and blamed the room's
      NOISE_HIGH on the app. Fixed: the io samples AudioEngine#audibleVoiceCountAt(start / sr) at
      the level window's start (capture.js:857) and again after it, and runPreflight on the
      measure() path passes false. The fade ends at most about 0.03 s after _soon, the window opens
      0.1 s after a fresh currentTime, both in audio time. Confirmed by the real-engine case, the io
      case and the report case; M11, M12, M15, M21 are killed.
  - id: R-3
    severity: P3
    status: closed
    title: >-
      The io OR and the measure.js wiring were checked by source regex only (M1, M4 survived the
      unit tests). Fixed: tests/unit/preflight-own-output.test.mjs drives a capture io on a fake
      context with AudioEngine's own accounting and createMeasureUi with a fake svc.outputBusy; the
      capture.js regex is gone. Re-applied on the head, M1 and M4 are killed by the unit tests.
  - id: R-4
    severity: P3
    status: closed
    title: >-
      Escape, pagehide and the status-bar play key read the 150 ms seqPlaying copy. Fixed: main.js
      stopSequencer(cmp) goes through the sequencer's OUTPUT_OWNERS row (read live), Escape and
      pagehide call it, and statusPlay reads editor.playing. M18, M19 and M20 are killed.
  - id: R-5
    severity: P3
    status: closed
    title: >-
      otherAudio was sampled once before the awaits. Fixed: the caller's fact may be a probe, read
      with the voices when the level window is scheduled and after it; MEASURE passes () =>
      otherAudioNow(cmp). The R-5 case (a source that ends or starts while the input opens) kills
      M12 and M14. The sample after the window is untested: R-8.
  - id: R-6
    severity: P3
    status: closed
    title: >-
      The PR body overstated the merge base's contamination and named 2 of 3 tests that did not
      pass. Fixed in the body: it now says the sequencer gated on the 150 ms copy kept playing into
      the run, and '3282 of 3285 pass, 1 skipped, 2 failed'. Its round-2 claims (fail-first 9 of 16,
