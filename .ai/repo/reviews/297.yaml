# Review verdict for pull request #297, plan record C016 (PACK 03, finding coupling-5): MEASURE's
# setup check counts every output owner as other audio (branch fix/c016-preflight-other-audio).
# Reviewed head c11cea228bdd (== origin after git fetch; merge base cdda563c1982; origin/main
# fde49bd1 is docs-only drift over none of the touched files and merges cleanly).
# Built by the builder's session; reviewed by dev-68, which re-checked a first review pass
# finding by finding against the code and kept only what held.
#
# The digest: scripts/ on the branch is identical to origin/main's (git diff origin/main --
# scripts is empty), so the branch's copy was used in the worktree:
# `node scripts/review-verdict.mjs --content --list --base origin/main` gives 5801e324...0143
# over src/js/measurement/capture.js, src/js/measurement/engine.js, src/js/ui/measure.js.
#
# Lenses: (a) every control path that sounds into engine.master is owned, reported and stopped;
# (b) click-free stops, no param writes; (c) fail-first and test strength; (d) the PR body.
#
# Runs (first pass, re-read here; nothing was rerun that the code reading did not need):
# - Fail-first in a git-archive copy of the merge base with the head's tests/: output-owners
#   5/5 fail, v3-engine tests 22 and 23 fail (ERR_ASSERTION); on the head 33/33 pass.
# - 10 mutations in git-archive copies of the head against output-owners + v3-engine: 8 killed;
#   M1 (capture overwrites otherAudio with voices > 0) and M4 (otherAudioNow returns false)
#   survive the unit tests (R-3). Both are killed by the sequencer and Studio cases of the
#   browser app leg in tests/browser/v3-measure.cjs, which ci.yml runs (it always calls runApp).
# - 12 relevant unit files on the head: 1310 tests, 1309 pass, 1 skip. build.mjs --check: dist
#   up to date. The browser leg was not run (load 86-161, OSC_LOAD_MAX left at its default).
# - This pass: the worktree was used read-only (only the majordomus serve daemon, PID 79695, had
#   its cwd there); reading quality-bar.js, audio-engine.js (_soon, _releaseVoice,
#   audibleVoiceCount), capture.js preflight, engine.js measure(), measure.js runMeasure,
#   main.js, workbench.js, sequencer-panel.js and studio/workspace.js.
#
# Checked and found correct: OUTPUT_OWNERS covers the writers into engine.master outside the
# measurement stimulus (engine voices via the engine.play wrapper, the sequencer via the adapter's
# getDestination, the Studio bus via engine-hooks masterInput); no added line writes a param or
# connects a node, the stops are the existing click-free editor.stop(), stopNow(), studioStop()
# in the previous order; the Studio claims the output before transport.playing turns true, so
# its own onClaimOutput stopPlayback does not stop itself; MIDI notes (#261) are not on main.
#
# R-2 is the lens (a) path the first pass missed: Measure without a reusable READY report runs
# stopPlayback and then, in the same task, measure() -> runPreflight(s, recipe, calibration)
# (engine.js:1225, otherAudio defaults to false) -> io.preflight, which reads
# engine.audibleVoiceCount synchronously (capture.js:789). stopNow -> stopAll releases the voice
# at stopAt >= _soon(ctx) + 0.008 + 0.01 >= currentTime + 0.038 (audio-engine.js:606-625), and
# audibleVoiceCount counts it until endTime - 0.01, so a playing instrument always reads as one
# voice there; the 0.3 s input-level window starts after the context/permission/input awaits
# and freshClock, at currentTime + SCHEDULE_LEAD_S, when that fade has ended.
#
# Open: R-1 and R-2 (P2), R-3 to R-7 (P3). The verdict is changes-requested.
