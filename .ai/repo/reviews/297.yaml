#   rendered <= currentTime + 0.2 and tracking the audio clock; the window starts at
#   ceilFrame(currentTime + 0.1) after freshClock's nextTask. Both are audio times, so the
#   comparison is right even when the audio clock lags: a voice is counted exactly when its
#   fade overlaps the window start. Under a running clock the margin is about 70 ms.
