name: debugging
description: reproduce, isolate, fix, and prove a defect fixed
capability: strong
effort: high
effort_escalation:
  after_blocked_attempts: 2
  to: xhigh
verbosity: concise
presentation: engineering
context:
  task: true
  current_state: true
  decisions: true
  relevant_files: true
  failing_output: true
  recent_history_depth: 50
  architecture_notes: false
verification:
  verify_command_required: true
  regression_test_required: true
  decision_record_required: false
checkpoint_interval: 15m
output_contract: [outcome, changes, verification, blockers, next_action]
