non_goals:
- "A command palette: search covers node types and nodes only (intent studio-completion's non-goal stands)"
- "A second Studio state, a solo stored in the model, or a graph the engine does not run"
- Feedback delay or chorus before project.no-silent-feedback v2 (D8)
- "The visual identity of any other patcher, DAW or flow-editor library"
