id: product-direction
title: "OSCILLA states one chosen positioning sentence wherever it describes itself at length, tells its origin and pace as decided against the record, and has a recorded decision that it stays a free MIT laboratory with nothing commercial built before v4.0"
statement: "The owner asked whether OSCILLA can be productized and what is missing to make money from it (ChatGPT project conversation 6abf3077, 2026-10-02T04:18:12Z and 04:30:50Z), and the conversations proposed about a dozen positioning sentences (knowledge record positioning-candidates), while the product describes itself three ways: README says 'an interactive sound and frequency laboratory', the About lede 'a browser-based interactive sound, frequency and measurement laboratory', and the Open Graph description 'A browser acoustic laboratory'. One sentence is chosen (Q002) and README, the About lede, the page's description, Open Graph and Twitter descriptions and package.json say it alike, while the title surfaces keep the name within their length; the product path is decided (Q003): no commercial path now, OSCILLA stays free under the MIT licence, which is not reopened, and no buyer, offer or pilot is chosen before v4.0 is released, after which the question returns as a new intent; the decision is an ADR (P004); and the public origin and pace say what Q005 decided against the record (P005). Under the owner's delegation of 2026-10-18, a decision of this intent may be taken by a coordinating session that records the delegation, its reasoning and that the owner may override it."
invariants:
  - "Nothing commercial is built: no checkout, account, backend, analytics or pricing page (README \"Privacy\"), and no buyer, offer or pilot is planned before a v4.0.0 release exists and a new intent reopens the question"
  - "A positioning sentence makes no claim the product cannot support (project.no-fake-science), and the decision that chose it states what backs each of its claims"
  - "No worker chooses the sentence, the buyer or the offer: the owner does, or a coordinating session under an owner delegation it quotes with its date (Q002, Q003)"
milestones:
  - "M051"
  - "M052"
satisfaction:
  - id: "positioning-chosen"
    criterion: "The choice of one positioning sentence, and of whether the tagline stays, is recorded on Q002"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^Q002 +DONE '"
  - id: "positioning-consistent"
    criterion: "README's opening line, the About lede, the page's meta description, the og:description and twitter:description generated from scripts/social-assets.mjs, and package.json's description contain the chosen sentence verbatim and stay within 200 characters; the title, og:title, twitter:title and the brand label keep the name within 70 characters; and a unit test fails when any of them differs or a surface is added that the test neither checks nor exempts with a reason"
    evidence: claim
    ref: "positioning-sentence-consistent"
  - id: "product-path-decided"
    criterion: "Q003's decision (no commercial path before v4.0, the MIT licence not reopened, revisited as a new intent after v4.0) is recorded as an ADR with status proposed"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^P004 +DONE '"
  - id: "public-story-sourced"
    criterion: "The origin and the pace About states are the ones Q005 decided against the recorded history, and a unit test fails when the copy differs from that decision"
    evidence: claim
    ref: "about-origin-sourced"
  - id: "collaborator-brief-current"
    criterion: "The instructions of the owner's ChatGPT project describe OSCILLA's stack, scope and authority order as the repository does; because that is an act in the owner's account that no repository command can see, the evidence is the record on Q006 of who changed them, when and to what"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^Q006 +DONE '"
governance:
  - "rule:project.no-fake-science"
  - "rule:project.about-names-current-release"
  - "adr:adr-0051"
  - "file:.ai/repo/knowledge/curated/positioning-candidates.md"
  - "file:.ai/repo/knowledge/curated/oscilla-origin-in-the-transcripts.md"
  - "file:.ai/repo/knowledge/curated/built-in-one-night-is-wall-clock.md"
  - "file:LICENSE"
non_goals:
  - "Subscriptions, accounts, a cloud backend or a payment gateway (conversation 6abf3077, 2026-10-02T04:31:55Z), and any buyer, offer, pilot or pricing before v4.0 (Q003)"
  - "Selling OSCILLA as calibrated measurement software or as a paid tone generator (project.no-fake-science)"
  - "Changing the licence: MIT is the decision of record (LICENSE), and Q003 recorded that it is not reopened"
  - "Renaming the product: 'OSCILLA · Interactive Sound & Frequency Lab' stays the name the title surfaces carry"
created_at: 2026-10-18
updated_at: 2026-10-18
