id: perception-lessons
title: "Learn teaches the three perception phenomena the adopted V1 specification sections 89-90 name, with playable demonstrations: the missing fundamental, the Shepard tone and equal loudness, as teaching and never as a hearing test"
statement: "The multi-page V1 specification lists a 'Shepard tone educational demo', a 'missing fundamental demo' and an 'equal-loudness educational explanation' among its optional extensions (section 89) and future experiments (section 90; docs/specs/oscilla-v1-sections-64-95.md), and ChatGPT's V2 roadmap placed psychoacoustics experiments in Learn (ChatGPT project conversation 6abec18d, 2026-10-01T21:08:07Z, item 9); neither is an owner decision, and whether M005 adopts sections 64-95 is the owner's question Q001. No lesson starts before Q001 is answered: if Q001 adopts sections 89-90, the lessons L001, L002 and L005 are the implementation of their three demonstrations and S089 and S090 do not repeat them; masking (L003) and critical bands (L004), which those sections do not name, are built only if the answer to Q001 names them. Q001's decision of 2026-10-18 (option (a), taken by the coordinating Claude session under the owner's delegation of 2026-10-18, which the owner may override) adopts the sections and names L001, L002 and L005 only, so L003 and L004 are cancelled with that reason. Each lesson pairs an explanation with a demonstration the user plays through the existing engine and a takeaway, in the form of the existing Learn topics. The plan states what each demonstration plays, never what the listener hears: harmonics 2 to N of a stated fundamental with no component at the fundamental; octave-spaced partials under a fixed spectral envelope stepping so that the state repeats after one octave; and published equal-loudness contours drawn as data with their source. The copy says what listeners commonly report under controlled listening, with a citation, and names what an unknown playback chain changes (a small speaker cannot reproduce a low fundamental, and distortion in the chain can create energy at the fundamental). No lesson measures, scores or describes the listener's hearing. Under ADR 0051 (measurement is the wedge; fewer new nouns) the lessons are breadth, so they are priority p3 and come after the measurement work."
invariants:
  - "No lesson measures, scores or diagnoses hearing, and none claims what this listener hears: copy reports what listeners commonly report, cited, and names the playback-chain caveats (project.no-fake-science); levels are relative and the speaker output is unknown"
  - "Whether a sentence still implies a perceptual effect is decided by the reviewer: the no-fake-science scan has no perceptual-claim phrases, and each L issue's pull request says so"
  - "Every demonstration sounds through the AudioEngine within its safety limits (project.audio-engine-discipline), and engine changes keep the V1 golden vectors green (ADR 0014, tests/unit/freeze.test.mjs)"
  - "Published data (equal-loudness contours) is cited with its source and embedded only under a licence that permits redistribution with an MIT build"
  - "No lesson starts before Q001 is answered, and none is built that the answer does not adopt"
milestones:
  - "M049"
satisfaction:
  - id: "missing-fundamental"
    criterion: "The missing-fundamental demonstration's partial set and schedule hold harmonics 2 to N of a stated fundamental and no component at the fundamental (the digital signal; the copy names the playback-chain caveats), which a unit test of the schedule confirms"
    evidence: "command"
    ref: "node --test tests/unit/learn-missing-fundamental.test.mjs"
  - id: "shepard-tone"
    criterion: "The Shepard demonstration's schedule plays octave-spaced partials under a fixed spectral envelope as twelve semitone steps whose partial set after one octave equals the initial one, within the default session safety limit; a continuous glide plays only under the session's continuous permission"
    evidence: "command"
    ref: "node --test tests/unit/learn-shepard-tone.test.mjs"
  - id: "equal-loudness"
    criterion: "The equal-loudness lesson draws published contours from a source whose redistribution licence is recorded, checked at three points against it, and nothing in it computes or reports the listener's hearing"
    evidence: "command"
    ref: "node --test tests/unit/learn-equal-loudness.test.mjs"
governance:
  - "rule:project.no-fake-science"
  - "rule:project.audio-engine-discipline"
  - "rule:project.visual-identity-lock"
  - "adr:adr-0005"
  - "adr:adr-0014"
  - "adr:adr-0051"
  - "file:src/js/data/learn.js"
  - "file:docs/specs/oscilla-v1-sections-64-95.md"
non_goals:
  - "Audiometry, hearing tests, a hearing profile or any score of the listener"
  - "Sound therapy, focus or relaxation content of any kind"
  - "Any lesson before Q001 is answered, or one its answer does not adopt"
  - "Masking and critical-band lessons (L003, L004, cancelled 2026-10-18): Q001 does not adopt them; they return only as new criteria the owner asks for"
created_at: 2026-10-18
updated_at: 2026-10-18
