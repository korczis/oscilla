non_goals:
- "A GL library (three.js, regl, twgl) or any new vendor block"
- "A second spectrogram, spectrum or correlation analysis on the GPU: the GPU composes data the CPU holds"
- "A GL spectrum line replacing uPlot, unless Y001's measurement shows a saving"
- "Lighting, glow, bloom or any effect that is not data"
- "WebGPU, until a gate browser leg measures it (Y001 records it as not probed)"
- Cumulative spectral decay (waterfall) plots of room acoustics (intent measurement-extensions)
