id: gl-live-views
title: "OSCILLA's dense live views draw on WebGL where it measurably pays, with a Canvas 2D twin that draws the same data everywhere else, honest axes, one frame loop and nothing allocated per frame"
statement: "On 2026-10-29 the owner asked, in Czech, for p5.js, WebGL and interactivity, deployed: WebGL renderers for the scrolling spectrogram with a 3D option, a phosphor XY scope and a live spectrum, falling back to canvas or p5 where WebGL is unavailable, under one frame loop with no per-frame allocation, inside the single file and its gzip budget, with axes and units from the analysis. This intent takes that order on top of the charts line M062 (#269): GL is a view of data the CPU already holds, never a second analysis; Canvas 2D stays the reference and the fallback; and every GL path is measured against it."
invariants:
- "A GL view draws only data the analysis already holds on the CPU (the K033 level history, the analyser buffers the chart already read); it computes no new analysis and its loss loses no data (project.studio-model-is-canonical in spirit; ADR 0016)"
- "Every GL view has a Canvas 2D twin drawing the same data, chosen by capability, cost and the user's setting, and says which backend it is on (project.no-inert-surfaces)"
- "One frame loop: every GL view is a subscriber of src/js/charts/frame-loop.js with its host, allocates nothing per tick and draws nothing while hidden (playable-instrument#chart-cost)"
- "Axes, ticks and units come from the analysis descriptor, levels are dB relative unless calibrated, height, brightness and persistence say what they encode, and the 3D view is never called a waterfall (project.no-fake-science v2, D7)"
- "No new dependency: shaders are string literals in the one file, nothing is fetched, and the line stays within its gzip cap (project.single-file-deliverable, ADR 0012, ADR 0013)"
- "The chrome around the views is Flowbite Pro and the ratchet only falls; the views keep OSCILLA's own visual language (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061)"
- "The AudioEngine is untouched: views read existing analysers and create no audio node (project.audio-engine-discipline v2)"
milestones:
- M096
satisfaction:
- id: backend-honest
  criterion: "Every GL host picks WebGL 2, WebGL 1 or its Canvas 2D twin from a capability probe and the view's declared needs (a major performance caveat refused unless ?gl=sw), states its backend and reason in its summary and through OSCILLA.charts.renderers(), switches to its twin on a lost context within a named deadline keeping its data, never holds more live contexts than the measured budget, and ?gl=0 or Settings 'Canvas 2D only' mounts no context"
  evidence: command
  ref: "node --test tests/unit/gl-caps.test.mjs tests/unit/gl-renderer-setting.test.mjs && node tests/browser/gl-renderers.cjs"
- id: gl-parity
  criterion: "On a synthetic level ring the GL spectrogram and the 3D view's top preset sample to the same LUT colour as the Canvas 2D path within 1 per channel at named cells in both themes, and the phosphor and density layers match their CPU references within their stated quantization; every leg that cannot draw GL says so and runs the check on the twin"
  evidence: command
  ref: node tests/browser/gl-parity.cjs
- id: gl-cost
  criterion: "Every GL view is a frame-loop subscriber with its host, allocates nothing per tick, draws nothing while hidden or paused, and has its main-thread time per frame recorded beside its Canvas 2D twin's; GL is the automatic backend only where it is not slower; the line stays within the component line's cap Q037 records"
  evidence: command
  ref: node tests/browser/chart-cost.cjs --require-complete
- id: views-honest
  criterion: "The 3D spectrogram, the phosphor XY view and the density layer state what height, brightness and colour mean, draw axes and units from axesOf() of the analysis and never from constants, label persistence as display persistence with its time constant and estimated sample counts as estimates, keep levels dB relative unless calibrated, and never display the word waterfall"
  evidence: command
  ref: node --test tests/unit/gl-views-wording.test.mjs tests/unit/charts-readout-wording.test.mjs
- id: views-interactive
  criterion: "Every GL host is a done entry of the chart-host census with the kit's cursor, readout, keyboard and touch paths on both backends; the 3D view picks cells and zooms its camera within stated bounds, the XY view zooms its amplitude scale, and a marker pinned on one view appears on every view of its quantity"
  evidence: command
  ref: "node scripts/chart-census.mjs --require-complete && node tests/browser/charts-interaction.cjs && node tests/browser/gl-markers.cjs"
- id: hackable
  criterion: "docs/renderers.md states the renderer contract, the ?gl= values, the context budget and how to test both backends, a fixture view written from it passes the contract test, and every route and setting the line adds is in the docs and reachable from its menu"
  evidence: command
  ref: "node --test tests/unit/gl-view-contract.test.mjs && node tests/browser/navigation.cjs"
