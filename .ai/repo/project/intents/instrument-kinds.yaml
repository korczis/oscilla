non_goals:
- "A second level model, scope readout, key map, transport or compatibility table: each kind wraps the one that exists"
- "A UI framework or a component library beside Flowbite Pro: kinds are declarations, pure models and one mount function each"
- "The knob, the slider and control panels (the params-controls part) and the WebGL renderers (the render-gl part)"
- "Placing the kinds in the Synth or DAW workspaces: the synth slices do that"
