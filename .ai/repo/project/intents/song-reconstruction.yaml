milestones: []
satisfaction: []
non_goals:
  - "Audio tracks, audio clips, the sample store, notes clips, the piano roll, the mixer, the tempo and meter map, the arrangement, MIDI files, stems and the project round trip: connected-instrument (M069, M071, M072) and instrument-kinds own them (K074, K099, K105-K120, W011, W014)"
  - "A component registry, explain panel or link graph of its own: component-system owns them (G001-G019, J001-J008)"
  - "Recording a jam as an editable event track: midi-jam-companion owns it (M045, V505)"
  - "Running a model, loading weights, fetching anything or talking to a server from the page"
  - "Downloading, ripping or intercepting audio from a web address"
  - "Third-party recordings, transcriptions of copyrighted songs, samples or presets in the repository (owner, Q073; K144's originals-only stance; the connected-instrument non-goal)"
  - "Claiming exact recovery of a proprietary patch or of the source mix"
  - "Inverse synthesis and regeneration, until the owner answers Q076"
