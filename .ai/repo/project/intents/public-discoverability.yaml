id: public-discoverability
title: "A visitor to the repository or the site understands in seconds what OSCILLA is and reaches a real workspace, and nothing they see claims more than the product does"
statement: "The owner handed over a prompt pack on 2026-10-29 (00_MASTER_PROMPT.md and 01_PROMPT_PACK.md, held outside the repository): make the public face of OSCILLA irresistible without compromising its truth. That means a README that works as a GitHub product front page (the positioning sentence and tagline, original artwork, a native Mermaid diagram, deep links that route), GitHub's own About, topics, homepage and social preview consistent with it, an entry inside the application that leads to Measure, the instrument and the Studio without changing the first screen the owner chose in Q004, and a measured decision on the visualization libraries the owner named (Mermaid, Chart.js, Cytoscape.js, Apache ECharts) against the incumbents uPlot and p5. The pack is a proposal; the repository and its recorded decisions are the authority."
invariants:
  - "README's opening paragraph contains the positioning sentence Q002 records (tests/unit/positioning-consistency.test.mjs), and the tagline 'See sound. Shape frequency.' follows it (tests/unit/readme-landing-art.test.mjs)"
  - "The first screen stays what the owner chose in Q004 until a new, attributable owner decision supersedes it in this plan; a wish for a landing page is not that decision"
  - "Artwork is original, drawn only in colours of src/styles/tokens.css (tests/unit/readme-landing-art.test.mjs), labelled as an illustration wherever it could be read as a measurement, and carries no Flowbite Pro asset, script, external reference or version literal"
  - "No popularity figure, badge, certification or measurement is shown that the repository cannot prove; no analytics, tracking, sign-up or runtime network request is added (project.single-file-deliverable, project.no-fake-science)"
  - "A visualization library enters dist only with a measured gzip delta inside the budget, one adapter, an accessible host and a real consumer; otherwise its non-adoption is recorded with the numbers"
milestones:
  - "M098"
  - "M099"
satisfaction:
  - id: "readme-front-page"
    criterion: "README carries the tagline after the sentence, an original docs/assets illustration labelled not a measurement with alt text, a native mermaid flowchart whose edges end on declared nodes, and landing deep links that route"
    evidence: "command"
    ref: "node --test tests/unit/readme-landing-art.test.mjs tests/unit/extending-guide.test.mjs"
  - id: "github-shell-consistent"
    criterion: "The repository's About description contains the Q002 sentence, its homepage is the Pages site, and a custom social preview generated by npm run social is set; the topics are listed with the code each names in P007's evidence"
    evidence: "command"
    ref: "gh repo view korczis/oscilla --json description,homepageUrl,usesCustomOpenGraphImage -q 'select(.usesCustomOpenGraphImage and .homepageUrl == \"https://korczis.github.io/oscilla/\") | .description' | grep -qF 'A zero-install, scientifically honest acoustic laboratory'"
  - id: "in-app-entry"
    criterion: "The parts Q004 placed on the first screen (the Guided measurement row and the compact Studio) each lead to their full workspace through the hash dispatcher, with the targets read from the one entry-path inventory, starting no audio and asking for no microphone until pressed, in Chromium, Firefox and WebKit, from file:// and the sub-path"
    evidence: "command"
    ref: "node tests/browser/public-entry.cjs"
  - id: "libraries-decided"
    criterion: "Each library the owner named (Mermaid as a runtime, Chart.js, Cytoscape.js, Apache ECharts) is measured against uPlot and p5 and decided by the owner (Q070), any adoption carrying an ADR"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^Q070 +DONE '"
  - id: "live-and-accessible"
    criterion: "On the deployed Pages site the README's landing deep links open their workspaces, and the in-app entries are reachable by keyboard with visible focus in dark and light themes"
    evidence: "command"
    ref: "node tests/browser/public-entry.cjs --live"
governance:
  - "rule:project.single-file-deliverable"
  - "rule:project.no-fake-science"
  - "rule:project.visual-identity-lock"
  - "rule:project.ui-uses-flowbite-pro"
  - "rule:project.no-inert-surfaces"
  - "rule:project.audio-engine-discipline"
  - "rule:project.fail-first"
  - "rule:project.review-verdict"
  - "adr:adr-0012"
  - "adr:adr-0013"
  - "adr:adr-0045"
  - "adr:adr-0051"
  - "adr:adr-0061"
non_goals:
  - "A second hosted website, a marketing page outside the application, a backend, analytics, accounts or a sales funnel"
  - "A generic dashboard or a wall of feature counts"
  - "Changing the default route or the first screen's layout without a new owner decision superseding Q004"
  - "Bundling a visualization engine because it was named, or a second mutable Studio graph"
  - "Rewriting the positioning sentence or the tagline (Q002)"
created_at: 2026-10-30
updated_at: 2026-10-30
