id: one-instrument
title: "OSCILLA is one instrument: a few places, one persistent instrument strip that names what sounds, an observed probe over every place and a palette that reaches everything"
statement: "The owner ordered on 2026-11-24 (prompt pack 'OSCILLA — Complete product experience reconstruction', Claude Code session 40c3f589-de0d-4e90-ba18-aee761b5273a) that the application be reconstructed as one coherent instrument rather than a collection of workspaces sharing a navigation bar, and chose its model in Q114 (model E with ADR 0089). The audit on main c3b15610 (docs/reconstruction/01 to 05) found six of thirteen workspaces to be crops of one panel grid decided by seven mechanisms, a derived sounding owner nothing shows, chrome that leaves the Studio and Synth about 40 % of a desktop screen and a phone's first screen no instrument, keys with several meanings and accessibility gaps. ui-current made every workspace current and connected; ui-flowbite-pro moved it onto Pro; component-system unifies the controls; this intent changes the product's shape above them."
invariants:
  - "One AudioEngine and one AudioContext; the StudioModel stays canonical; the composition layer holds no audio, document, parameter, sequence, measurement, experiment or selection state of its own (project.studio-model-is-canonical, project.audio-engine-discipline)"
  - "No view presents a computed curve as the sound that plays (project.no-fake-science, ADR 0063 decision 2)"
  - "Every inventoried deep link keeps opening what it opens (ADR 0045, Q089); the V1 URL codec stays frozen (ADR 0014)"
  - "One static dist/index.html that runs from file:// and the /oscilla/ sub-path (project.single-file-deliverable); Flowbite Pro only, its ratchet only falls (project.ui-uses-flowbite-pro); the app speaks Czech (project.czech-prose)"
  - "Nothing is retired before its replacement is live, reachable and sounding in Chromium, Firefox and WebKit (Q090)"
milestones:
  - "M124"
satisfaction:
  - id: "owner-chose-the-model"
    criterion: "The owner's choice of the product model is recorded verbatim (Q114 done)"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^Q114 +DONE '"
  - id: "see-what-sounds"
    criterion: "From every place the user sees what sounds without leaving it: Sonda names the sounding owner and shows only observed views of the output, and the sound survives a place change except a running measurement (U126, U133)"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^U126 +DONE ' && majordomus plan list | grep -Eq '^U133 +DONE '"
  - id: "keys-mean-one-thing"
    criterion: "Space, Escape, the strip's Play and the letter keys each have one meaning per place, declared once and shown in the help dialog (U123, U124, U127, U134)"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^U127 +DONE ' && majordomus plan list | grep -Eq '^U134 +DONE '"
  - id: "registry-owns-composition"
    criterion: "The registry is the one owner of which panels a place shows; a census refuses a second mechanism (U128, U129)"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^U129 +DONE '"
  - id: "chrome-budget"
    criterion: "At 1536x1024 a place's own content gets at least 75 % of the height with the keys collapsed; at 390x844 its primary surface at least 50 % of the first screen (U131, U135)"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^U131 +DONE ' && majordomus plan list | grep -Eq '^U135 +DONE '"
  - id: "one-instrument-places"
    criterion: "Navigation is the places of ADR 0089 with every old route aliased (U132)"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^U132 +DONE '"
  - id: "everything-reachable"
    criterion: "Every catalog component, template, preset and Learn topic is reachable from the palette (U130)"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^U130 +DONE '"
  - id: "accessible-places"
    criterion: "Every place passes axe without critical or serious findings in both themes and has an h1, an announced switch and a skip link to its primary control (U125, U136)"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^U136 +DONE '"
  - id: "nothing-obsolete"
    criterion: "No superseded composition path remains without a documented exception (U137)"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^U137 +DONE '"
governance:
  - "rule:project.visual-identity-lock"
  - "rule:project.ui-uses-flowbite-pro"
  - "rule:project.no-fake-science"
  - "rule:project.single-file-deliverable"
  - "rule:project.czech-prose"
  - "rule:project.a-phone-sounds"
  - "adr:0089"
  - "file:docs/reconstruction/07-target-architecture.md"
non_goals:
  - "Unifying the synthesis engines or the sequencing models: the output bus and master chain already unify the output; the Sequencer fold waits for M065 (Q090 D7)"
  - "A layout engine, user docking or a second component registry"
  - "Re-deciding Q089's landing or Q090's folds; this intent consumes them"
created_at: '2026-11-24'
updated_at: '2026-11-24'
