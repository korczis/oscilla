id: musical-practice
title: "A learner practises on OSCILLA's own instrument: an exercise that references real content is heard, tried and graded only by the documented criteria its input source supports, and every result shows what happened"
statement: "An optional, user-directed practice layer lets a learner follow the owner's loop 'understand → hear or observe → try → receive truthful feedback → repeat or continue' on OSCILLA's own instrument. A small, explicit, versioned exercise contract refers by identity to existing OSCILLA content (a pattern, notes clip, sequence, patch or signal) and declares the learning objective and prerequisite, the expected events, the input sources it supports, the transport settings (tempo, count-in, loop), the grading criteria and tolerances, the feedback and completion conditions, and the provenance and limitations of any derived value; the visual guidance, the playback, the input validation, the grading and the feedback all derive from that one declaration. An attempt records the learner's events from a source the exercise declares and grades them against the expected events by documented criteria: the onset error in milliseconds and the pitch error in cents, measured from the event's own note and timestamp for the on-screen keyboard, the computer keyboard and MIDI, and from the existing analysis's estimate, with its confidence and uncertainty shown, for the microphone; never a decorative score, and missed, extra, partial and uncertain events stay visible. Feedback views show what was expected beside what was played on the real instrument surfaces (notes, timing, the waveform or spectrum, the active patch or parameter) where each is real and relevant, and the practice flow moves from demonstration to try, repeat and the next exercise, with real route handoffs to the referenced workspace that keep the exercise and the learner's edits. Source: the owner's proposal 'Interactive learning and musical practice' (2026-11-03, marked 'Status: PROPOSAL'): 'This is a proposed OSCILLA capability until current source, plan, and owner decisions confirm otherwise.' Guitar Hero and Simply Piano are 'references for clarity, pacing, and feedback only. Do not copy their visual design, interface, branding, lesson content, or game structure.' The intent names no milestone and no criterion, so its stage is derived as declared (Majordomus ADR 0144), and nothing marks it accepted. Its owner questions are open under M121: the timing window in milliseconds and the pitch tolerance in cents (Q085), whether practice progress is stored, locally only or not at all (Q086), whether any game element is wanted at all (Q087) and which content comes first, the riffs, the patches or the scales (Q088). Riffs and the music library, keys and MIDI, the transport and the notes clip, and the Learn workspace belong to other plans (see non_goals); this intent holds only what nothing else owns: the versioned exercise contract, the attempt and its evidence-based grading, the feedback views and the practice flow."
invariants:
  - "Learning belongs to the instrument: 'The learning layer must use real OSCILLA notes, patterns, sequences, instruments, parameters, and playback.' 'Do not create a parallel lesson-only audio engine, note model, sequence format, parameter schema, clock, or hidden game state.' An exercise refers to Studio content by identity and is not a second Studio state (owner, 2026-11-03; project.studio-model-is-canonical)"
  - "One declaration: 'The exercise, visual guidance, playback, input validation, scoring, and feedback must derive from the same declared exercise data.' The exercise contract is versioned and small: 'Do not invent a universal schema that absorbs unrelated OSCILLA models; use explicit references and adapters to canonical owners' (owner, 2026-11-03)"
  - "Optional and user-directed: 'It must not hijack the default laboratory or instrument workflow, obscure advanced controls, or turn the whole product into a casual game' (owner, 2026-11-03)"
  - "Grading is evidence-based: 'Every score or result must be derived from explicit, documented criteria, such as the expected event, timing window, tolerance, and input source.' 'Do not fabricate success, hide missed events, or use opaque grading.' A result names its criterion, its tolerance and its source, and the onset and pitch errors it measured; no score exists apart from them (owner, 2026-11-03; project.no-fake-science)"
  - "Input sources are graded only to what they support: keyboard and MIDI give explicit note and timing events; for the microphone, 'Grade only criteria that the existing analysis can support, show uncertainty, and never imply calibrated or exact note detection when the evidence does not justify it.' On main at c73d27b4 the existing estimator (createPitchDetector and estimateFrequency in src/js/analysis/peak-detector.js) reports a frequency with its confidence and uncertaintyHz and src/js/analysis has no onset detector, so no microphone timing criterion is graded until a plan-backed decision adds one; a source that cannot support an exercise's criteria is unavailable for it, with the reason shown (owner, 2026-11-03; project.no-fake-science)"
  - "Onset error is measured on one clock: keyboard and MIDI events carry event.timeStamp and MIDIMessageEvent.timeStamp on the performance clock and playback runs on the AudioContext clock, so an onset error converts the event time to context time (AudioContext.getOutputTimestamp) before it compares; the output latency the browser reports (outputLatency, baseLatency) is shown with the result and never silently subtracted, so a keyboard grade is not biased by it unseen (af critique, 2026-11-03; project.no-fake-science)"
  - "No new input path: 'Do not introduce microphone capture or another input path simply to imitate a reference product.' A gap is documented and proposed as 'the smallest plan-backed decision' (owner, 2026-11-03)"
  - "One transport and one audio owner: 'A demonstration, count-in, loop, or practice playback must not create a second clock or conflicting audio owner'; the stop, abort, hidden-page, output-ownership, click-free and cleanup rules hold, and audio starts only inside the gesture unlock (project.audio-engine-discipline, project.no-silent-feedback, project.a-phone-sounds)"
  - "Authored, derived and personal data stay apart: 'Keep authored lesson content distinguishable from calculated runtime feedback and user progress', and 'Any value described as derived or inferred must have a reproducible source and rule' (owner, 2026-11-03)"
  - "No game layer: 'Do not add generic points, badges, streaks, hearts, leaderboards, or celebratory UI unless an accepted product decision defines their purpose and real data model' (owner, 2026-11-03); the owner answered Q087 'None': a result shows only measured values (timing and pitch errors, missed and extra notes) and the progression to the next exercise"
  - "Local only: 'Do not add accounts, servers, analytics transmission, or runtime network dependencies'; the single file runs from file:// and the Pages sub-path, and progress is kept only in this browser's existing local storage, never sent anywhere, and the learner can clear it (owner, Q086 'Locally, clearable'; project.single-file-deliverable)"
  - "Real handoffs: 'Any handoff must be a real route or shared-model transition, not a screenshot, copied display value, or UI-only link', and a learner moves between a lesson and the workspace 'without losing the referenced exercise or the user's edits' (owner, 2026-11-03)"
  - "Configurable only where the model supports it: tempo, difficulty and tolerances are configurable only when the exercise and its grading support them, and 'every such parameter's type, unit, default, range, validation, persistence, and update behavior' is explicit (owner, 2026-11-03; parameter-controls)"
  - "OSCILLA's look: 'Use OSCILLA's existing visual grammar: dark technical cockpit, compact readable data, visible instrument state, and existing components'; new surfaces are Flowbite Pro (project.ui-uses-flowbite-pro, ADR 0061, project.visual-identity-lock)"
  - "Each exercise type lands with fail-first tests for its data validation and references, supported and unsupported sources, timing and grading boundaries and uncertain cases, truthful feedback and provenance, playback through the canonical transport and AudioEngine, navigation between Learn and the workspace, save and restore where accepted, and keyboard, touch, focus and accessibility (owner, 2026-11-03; project.fail-first, project.suite-harness, project.bounded-test-timing)"
  - "'Treat learning/gameplay as a separate product capability to plan, not as permission to expand every page.' 'Do not invent plan IDs or mark an unresolved design choice as accepted' (owner, 2026-11-03)"
