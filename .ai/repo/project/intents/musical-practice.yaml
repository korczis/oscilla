non_goals:
  - "Riffs and the music library: the riffs, their audition and insertion as Studio clips, their schema, facets, rights and growth are K149 and M120's (the dev-53 and af sessions); an exercise refers to an entry and adds no content model of its own"
  - "Keys and MIDI: the one key registry and dispatcher are K153's, and MIDI input, its support state, its shown notes and jam recording are midi-jam-companion's (M045); an exercise consumes their events and adds no input path"
  - "The one transport and clock and the notes clip: ADR 0084 (the Studio timeline carries notes clips, instrument tracks and a session grid) and ADR 0086 (one notes array, the step grid is a projection of the notes clip), both on PR #400, and K099 (notes clips and the piano roll, M069) own them; practice playback, count-in and loop run on that transport and read that notes array"
  - "Learn: the workspace, its lessons and their place in the shell are lane A of the mobile-first overhaul and ui-current's, and perception-lessons owns its three phenomena; the practice flow enters Learn through their routes and does not redesign it"
  - "Points, badges, streaks, hearts, leaderboards and celebratory UI (the owner answered Q087 'None')"
  - "Accounts, servers, analytics transmission and runtime network dependencies"
  - "The reference products' visual design, interface, branding, lesson content or game structure"
  - "New microphone capture, an onset detector or any other input path added to imitate a reference product, and any claim of calibrated or exact note detection"
