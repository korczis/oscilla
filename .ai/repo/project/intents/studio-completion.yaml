id: studio-completion
title: "The Studio gains what V3.1 specified and left unbuilt: node groups, a minimap, timeline pinch zoom, autosave with crash recovery, and the Playground voice opened as an editable Studio graph"
statement: "The V3.1 Studio specification asked for node groups and subgraphs (sections 116-117), a minimap, autosave and crash recovery (sections 153, 155, 157), pinch zoom on a phone, and a Signal Path that becomes an interaction rather than a picture (ChatGPT project conversation 6abec18d, 2026-10-02T03:22:47Z and 03:27:31Z); the feature record lists all of them as not built. A group collapses selected nodes behind exposed ports and is entered and left without changing the sound; the graph shows a minimap that navigates by pointer and by keyboard; the timeline zooms by pinch and by keyboard to the same positions; the working draft is saved as it changes and offered back after a reload or a crash without ever overwriting a saved project; and the Playground voice that Signal Path draws opens as a Studio project that sounds the same."
invariants:
  - "The StudioModel is the only Studio state; every new surface is a projection of it and every edit is one undoable action (project.studio-model-is-canonical)"
  - "Typed ports and feedback rejection hold across a group boundary (project.typed-ports, project.no-silent-feedback)"
  - "Every pointer gesture has a keyboard path (use case studio-operate-without-dragging)"
  - "New surfaces extend the existing tokens and components (project.visual-identity-lock)"
milestones:
  - "M048"
satisfaction:
  - id: "node-groups"
    criterion: "Grouping, entering, leaving and ungrouping nodes are undoable, round-trip through save and load, and leave the compiled topology and the offline render unchanged"
    evidence: "command"
    ref: "npm run test:studio"
  - id: "minimap"
    criterion: "The minimap shows the viewport over the whole graph and moves it by pointer and by keyboard"
    evidence: "command"
    ref: "npm run test:studio"
  - id: "timeline-pinch-zoom"
    criterion: "A two-pointer pinch on the timeline and the keyboard zoom reach the same zoom level and anchor"
    evidence: "command"
    ref: "npm run test:studio"
  - id: "draft-recovery"
    criterion: "After a reload or a crash the last working draft is offered back with its time, a saved project is never overwritten by it, and without IndexedDB the Studio says that no draft is kept"
    evidence: "command"
    ref: "npm run test:studio"
  - id: "voice-opens-in-studio"
    criterion: "The Playground voice opens from Signal Path as an editable Studio project whose offline render matches the Playground's within a stated tolerance"
    evidence: "command"
    ref: "npm run test:studio"
governance:
  - "rule:project.studio-model-is-canonical"
  - "rule:project.typed-ports"
  - "rule:project.no-silent-feedback"
  - "rule:project.visual-identity-lock"
  - "adr:adr-0030"
  - "adr:adr-0031"
  - "adr:adr-0034"
  - "file:docs/specs/oscilla-v3.1-studio.md"
non_goals:
  - "A command palette, dragging several clips at once and the browser Fullscreen API beyond what ADR 0034 records"
  - "A second store, a DOM snapshot as history, or a group that hides a separate model"
created_at: 2026-10-18
