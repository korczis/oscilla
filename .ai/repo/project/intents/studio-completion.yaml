id: studio-completion
title: "The Studio gains what V3.1 specified as optional and left unbuilt: node groups, a minimap, timeline pinch zoom, autosave with crash recovery, and the Playground voice opened as an editable Studio graph"
statement: "The V3.1 Studio specification described node groups and subgraphs (sections 116-117: 'optional for 3.1', 'Future/optional'), a minimap (section 153: 'Optional, only after pan, zoom, frame all and frame selection are excellent'), autosave and crash recovery (sections 155 and 157: 'If added', 'Optional last working draft'), pinch zoom on a phone, and a Signal Path that becomes an interaction rather than a picture (ChatGPT project conversation 6abec18d, 2026-10-02T03:22:47Z and 03:27:31Z); the feature record lists all of them as not built. A group collapses selected nodes behind exposed ports and is entered and left without changing the sound; the graph shows a minimap that navigates by pointer and by keyboard; the timeline zooms by pinch and by keyboard to the same positions; the working draft is saved as it changes and offered back after a reload or a crash without ever overwriting a saved project; and the Playground voice that Signal Path draws opens as a Studio project that sounds the same for every Playground configuration the Studio can represent, and refuses the others with the reason. None of it starts before the V272 final review (#197, plan issue V431) has landed, because that review changes the Studio files every one of them edits."
invariants:
  - "The StudioModel is the only Studio state; every new surface is a projection of it and every edit is one undoable action (project.studio-model-is-canonical)"
  - "Typed ports and feedback rejection hold across a group boundary (project.typed-ports, project.no-silent-feedback)"
  - "Every pointer gesture has a keyboard path (use case studio-operate-without-dragging)"
  - "New surfaces extend the existing tokens and components (project.visual-identity-lock)"
  - "Every M048 pull request touches guarded paths (src/js/studio, and for V604 src/js/experiments/store.js) and therefore carries a reviewer's verdict and, as a feat change, fail-first (project.review-verdict, project.fail-first)"
milestones:
  - "M048"
satisfaction:
  - id: "node-groups"
    criterion: "Grouping, entering, leaving and ungrouping nodes are undoable, round-trip through save and load under a bumped Studio schema with a migration, and leave the compiled topology and the offline render unchanged"
    evidence: "command"
    ref: "node --test tests/unit/studio-node-groups.test.mjs"
  - id: "minimap"
    criterion: "The minimap shows the viewport over the whole graph and moves it by pointer and by keyboard"
    evidence: "command"
    ref: "node --test tests/unit/studio-minimap.test.mjs"
  - id: "timeline-pinch-zoom"
    criterion: "A two-pointer pinch on the timeline, synthesized as PointerEvents, and the keyboard zoom reach the same zoom level and anchor through the pinch geometry the graph already uses"
    evidence: "command"
    ref: "node --test tests/unit/studio-timeline-pinch.test.mjs"
  - id: "draft-recovery"
    criterion: "After a reload or a closed page the last working draft is offered back with its time, a saved project is never overwritten by it, the unsaved-work guard still arms while a draft exists, and without IndexedDB the Studio says that no draft is kept"
    evidence: "command"
    ref: "node --test tests/unit/studio-draft-recovery.test.mjs"
  - id: "voice-opens-in-studio"
    criterion: "The Playground voice opens from Signal Path as an editable Studio project whose offline render matches the Playground's with a residual at least 60 dB below the Playground render's RMS for each listed configuration, and a configuration the Studio schema cannot represent is refused with the reason"
    evidence: "command"
    ref: "node --test tests/unit/playground-voice-in-studio.test.mjs"
governance:
  - "rule:project.studio-model-is-canonical"
  - "rule:project.typed-ports"
  - "rule:project.no-silent-feedback"
  - "rule:project.visual-identity-lock"
  - "rule:project.review-verdict"
  - "rule:project.fail-first"
  - "adr:adr-0023"
  - "adr:adr-0030"
  - "adr:adr-0031"
  - "adr:adr-0034"
  - "adr:adr-0045"
  - "file:docs/specs/oscilla-v3.1-studio.md"
non_goals:
  - "A command palette, dragging several clips at once and the browser Fullscreen API beyond what ADR 0034 records"
  - "A second store, a DOM snapshot as history, or a group that hides a separate model"
  - "A second IndexedDB database for drafts (specification section 154: 'no second DB layer')"
created_at: 2026-10-18
