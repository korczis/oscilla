non_goals:
  - "Specification sections 64-95 (milestone M005): the single-file prompt this intent implements ended at section 63, and the text of sections 64-95 that exists is the numbered multi-page variant (docs/specs/oscilla-v1-sections-64-95.md), which no decision has adopted; no intent states a requirement for them, and M005 stays unnamed until the owner decides (Q001)"
  - "The V2 laboratory, the V3 measurement workbench and Studio: each is its own intent"
  - "Changing V1 behaviour: it is frozen by golden vectors (ADR 0014), and a change to it is a V2 or later decision"
