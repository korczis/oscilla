- "rule:project.single-file-deliverable"
- "rule:project.typed-ports"
- "rule:project.suite-harness"
- "rule:project.bounded-test-timing"
- "rule:project.review-verdict"
- "rule:project.fail-first"
- "adr:adr-0050"
- "adr:adr-0058"
- "adr:adr-0061"
non_goals:
- "A UI framework or binding layer: the controls hold no value, resolve no state path, subscribe to no store and evaluate no condition"
- "Knobs in labs, MEASURE or settings forms: D11 keeps them on Pro range and number inputs; the Inspector follows Q020"
- "A second census beside PACK 03's, or a second declaration beside the catalogue's"
- Reading a modulated value from AudioParam.value
