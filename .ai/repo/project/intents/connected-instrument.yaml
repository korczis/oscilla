satisfaction:
  - id: "parameter-contract"
    criterion: "Every registry parameter declares its unit, range, default, mapping, whether it is automatable and modulatable (or why not) and its deep-link address, and every instrument and mixer control is bound to exactly one declared parameter shown on its box face"
    evidence: "command"
    ref: "node --test tests/unit/parameter-contract.test.mjs && node tests/browser/synth-panel.cjs"
  - id: "deep-links"
    criterion: "Every element (node, parameter, edge, track, clip, lane, pattern step) has an address in the one hash dispatcher and a context menu of its related views, each a walked row of the integration map"
    evidence: "command"
    ref: "node --test tests/unit/deep-links.test.mjs && node tests/browser/integration-map.cjs"
  - id: "daw-mixer"
    criterion: "Channel and bus nodes with gain, pan, mute, solo-in-place and sends render their stated figures offline, inserts are ordered processing nodes, and a mixer view shows every strip with the shared level-meter model and the master's safety chain"
    evidence: "command"
    ref: "node --test tests/unit/mixer-channel.test.mjs tests/unit/mixer-view.test.mjs && node tests/browser/mixer.cjs && node tests/browser/instrument-dsp.cjs"
  - id: "daw-tracks"
    criterion: "Instrument, audio and CV/automation tracks with arm, mute and solo; audio clips from recordings and files stored by hash; input monitoring only under the rule version Q024 records, with its latency stated"
    evidence: "command"
    ref: "node --test tests/unit/audio-track.test.mjs tests/unit/input-monitoring.test.mjs && node tests/browser/arrange.cjs"
  - id: "daw-arrangement"
    criterion: "An arrangement over the Studio timeline with track headers, clips, loop and markers, a tempo and meter map, and recording of notes, automation and session takes into it"
    evidence: "command"
    ref: "node --test tests/unit/arrange-view.test.mjs tests/unit/tempo-map.test.mjs tests/unit/arrange-record.test.mjs tests/unit/automate-knob.test.mjs && node tests/browser/arrange.cjs"
  - id: "daw-files"
    criterion: "WAV stems and mixdown rendered offline, Standard MIDI File export and import through the strict import pipeline, and one project of every instrument that round-trips through persistence and files with its measurement provenance"
    evidence: "command"
    ref: "node --test tests/unit/export-stems.test.mjs tests/unit/smf-codec.test.mjs tests/unit/project-roundtrip.test.mjs && node tests/browser/arrange.cjs && node tests/browser/session.cjs"
  - id: "integration-map"
    criterion: "tests/browser/integration-map.cjs walks every row of tests/browser/integration-map.json in Chromium, Firefox and WebKit: each link's control works by pointer and keyboard, its target shows the same Studio revision with focus on its heading, and Back, Forward and reload keep the state; a link producer in src/js without a row, or a row without a working link, fails"
    evidence: "command"
    ref: "node --test tests/unit/integration-map.test.mjs tests/unit/synth-workspace.test.mjs tests/unit/patch-browser.test.mjs tests/unit/deep-links.test.mjs && node tests/browser/integration-map.cjs && node tests/browser/synth-panel.cjs"
  - id: "knob-control"
    criterion: "Every continuous instrument parameter is a knob (D11) that always shows value and unit, turns by vertical drag with Shift fine, arrows, PageUp/PageDown, Home/End and typed entry, resets on double-click, is role=slider with aria-valuetext stating the unit, works by touch, never tweens a value and commits one history entry per gesture"
    evidence: "command"
    ref: "node --test tests/unit/knob.test.mjs tests/unit/inspector-knobs.test.mjs && node tests/browser/knob.cjs && node tests/browser/v31-studio-graph.cjs"
  - id: "synth-panel"
    criterion: "The semi-modular voice of the Synth workspace is a projection of Studio nodes on the one store: with no cable it sounds through its normalled path; a cable into a normalled input replaces that normal and removing it restores it, each one history entry; its pitch CV plays A4 at 440 Hz and A5 at 880 Hz within 0.1 cent; every approximation (pulse by two saws, no self-oscillation of the biquad, seeded sample and hold, follower latency) is labelled"
    evidence: "command"
    ref: "node --test tests/unit/synth-vco-contour.test.mjs tests/unit/instrument-wording.test.mjs tests/unit/synth-keys.test.mjs tests/unit/studio-trigger-fanout.test.mjs tests/unit/synth-panel-normals.test.mjs tests/unit/synth-workspace.test.mjs tests/unit/synth-follower.test.mjs tests/unit/synth-mod-gen.test.mjs tests/unit/instrument-worklet.test.mjs tests/unit/synth-sync-vcf.test.mjs && node tests/browser/synth-nodes.cjs && node tests/browser/instrument-dsp.cjs && node tests/browser/synth-panel.cjs && node tests/browser/synth-modulation.cjs && node tests/browser/engines.cjs"
  - id: "patch-cables"
    criterion: "Cables are dragged from typed jacks with a live sagging cable; compatible jacks highlight and incompatible ones refuse with canConnect's sentence; a drop is one batch; one output feeds many inputs; a cable is selected by click or tap and removed by Delete or a drag-off; colour comes from the source module and pattern from the type; a focused jack offers its targets as a list; touch has tap-connect; undo and redo are the Studio history; a feedback cable is refused; hovering a cable shows its signal"
    evidence: "command"
    ref: "node --test tests/unit/synth-patch-bay.test.mjs tests/unit/synth-probe.test.mjs tests/unit/drum-kit.test.mjs && node tests/browser/synth-patch-bay.cjs && node tests/browser/drums.cjs && node tests/browser/instrument-dsp.cjs"
  - id: "piano-keyboard"
    criterion: "One piano component plays the Keys node in the Synth workspace and the Studio and the V502 voices in the Playground, by pointer glissando, multi-touch, the two-row computer keys with octave and velocity keys, and MIDI; keys light for every source including the sequencer; sustain is CC64 or a toggle and never Space; a held note is released on blur, hide and Escape (D3); an instrument picker and waveform select beside it are views of the store"
    evidence: "command"
    ref: "node --test tests/unit/synth-keys.test.mjs tests/unit/studio-armed-monitoring.test.mjs tests/unit/piano-keyboard.test.mjs tests/unit/synth-picker.test.mjs tests/unit/synth-record.test.mjs tests/unit/piano-88.test.mjs tests/unit/piano-zones.test.mjs && node tests/browser/synth-nodes.cjs && node tests/browser/instrument-dsp.cjs && node tests/browser/synth-panel.cjs && node tests/browser/piano.cjs && node tests/browser/midi.cjs && node tests/browser/steps.cjs"
  - id: "step-sequencer"
    criterion: "A steps clip of 1-64 steps per track with note, gate, velocity, accent, slide, ratchet and seeded probability, swing and tempo plays every onset within one frame of its computed time on the one transport, live and offline alike; the grid is fully keyboard-operable with the playing step highlighted from the audio clock; record, transpose, randomise and quantise in a scale, parameter locks, CV lanes, polymeter, conditional trigs and chaining exist"
    evidence: "command"
    ref: "node --test tests/unit/studio-steps-clip.test.mjs tests/unit/studio-steps-playback.test.mjs tests/unit/synth-step-grid.test.mjs tests/unit/synth-record.test.mjs tests/unit/studio-steps-locks.test.mjs tests/unit/synth-bank-chain.test.mjs && node tests/browser/v31-studio-timeline.cjs && node tests/browser/steps.cjs && node tests/browser/instrument-dsp.cjs && node tests/browser/midi.cjs"
  - id: "drum-machine"
    criterion: "Kick, snare, hats, clap, toms and perc voices render their stated pitch and decay figures offline; a kit's grid plays accents, flam and choke groups on the same transport as the synth; each voice's out is a patch-bay jack; a sample slot plays a user recording or file stored by hash with no bundled third-party sample"
    evidence: "command"
    ref: "node --test tests/unit/drum-voices.test.mjs tests/unit/drum-voices-2.test.mjs tests/unit/drum-kit.test.mjs tests/unit/drum-sample.test.mjs tests/unit/engine-modal.test.mjs && node tests/browser/drums.cjs && node tests/browser/instrument-dsp.cjs && node tests/browser/engines.cjs"
  - id: "engines"
    criterion: "FM, additive, wavetable, granular, plucked-string and modal engines are Studio nodes playable from the piano and the sequencer, each with figures checked offline, peak at or below the ceiling and a node census of 0 after stop; what needs an AudioWorklet runs on one worklet host from embedded source and states a degraded status where it is absent"
    evidence: "command"
    ref: "node --test tests/unit/instrument-worklet.test.mjs tests/unit/synth-sync-vcf.test.mjs tests/unit/engine-fm.test.mjs tests/unit/engine-additive.test.mjs tests/unit/engine-wavetable.test.mjs tests/unit/engine-granular.test.mjs tests/unit/engine-modal.test.mjs tests/unit/engine-pluck.test.mjs && node tests/browser/engines.cjs && node tests/browser/instrument-dsp.cjs"
  - id: "performance-pad"
    criterion: "The XY pad maps one axis to pitch in a chosen scale and key and the other to a timbre parameter, has presets of sound and scale, records loops that overdub in sync with the transport, and arpeggiates its gate at a tempo division"
    evidence: "command"
    ref: "node --test tests/unit/xy-pad.test.mjs tests/unit/xy-loop.test.mjs && node tests/browser/xy-pad.cjs"
  - id: "session-and-midi"
    criterion: "Notes clips with a piano roll, MIDI recorded into clips, MIDI output where the browser allows it with its timing stated, a session grid of tracks by scenes launched on the bar, and one patch browser across instruments"
    evidence: "command"
    ref: "node --test tests/unit/studio-notes-clip.test.mjs tests/unit/midi-record-out.test.mjs tests/unit/studio-session.test.mjs tests/unit/patch-browser.test.mjs tests/unit/arrange-record.test.mjs tests/unit/piano-roll-cc.test.mjs tests/unit/smf-codec.test.mjs && node tests/browser/session.cjs && node tests/browser/midi.cjs && node tests/browser/synth-panel.cjs && node tests/browser/arrange.cjs"
  - id: "modulation-everywhere"
    criterion: "Any knob of any instrument is a modulation destination from the knob's menu or a drag, from LFO, modulation generator, envelopes, random, step modulator, macro, sequencer CV lanes, XY axes, MIDI CC and the follower, each route one canConnect-checked edge listed in the mod matrix"
    evidence: "command"
    ref: "node --test tests/unit/synth-modulate.test.mjs tests/unit/midi-cc-source.test.mjs tests/unit/studio-steps-locks.test.mjs tests/unit/synth-follower.test.mjs tests/unit/synth-mod-gen.test.mjs tests/unit/automate-knob.test.mjs && node tests/browser/synth-modulation.cjs && node tests/browser/midi.cjs && node tests/browser/steps.cjs && node tests/browser/instrument-dsp.cjs && node tests/browser/synth-panel.cjs && node tests/browser/arrange.cjs"
  - id: "labs-linked"
    criterion: "The Filter Lab shows the panel's high-pass and low-pass response computed from the actual nodes (or labelled as computed from the parameters), the Envelope Lab edits the panel's envelope two-way, a lab's settings are sent to an instrument in one action, and a lesson plays the real instrument"
    evidence: "command"
    ref: "node --test tests/unit/labs-instrument-link.test.mjs tests/unit/lesson-instrument.test.mjs && node tests/browser/labs.cjs && node tests/browser/navigation.cjs"
  - id: "probes-and-views"
    criterion: "A cable's hover mini-scope, a pinned probe card and a jack probe into a Studio scope, spectrum, spectrogram, meter or Lissajous view each show the probed signal live; step onsets sit on the scrolling spectrogram's time axis; keyboard and sequencer notes show beside the spectrum; every continuous draw is one frame-loop subscriber with no per-frame allocation"
    evidence: "command"
    ref: "node --test tests/unit/synth-probe.test.mjs tests/unit/spectrogram-step-ticks.test.mjs tests/unit/note-view-sources.test.mjs tests/unit/synth-probe-studio.test.mjs && node tests/browser/synth-patch-bay.cjs && node tests/browser/charts-interaction.cjs && node tests/browser/midi.cjs"
  - id: "measure-a-patch"
    criterion: "A patch's processing chain is measured digitally (transfer and RTA, distortion after V393) labelled as a digital patch measurement, and the run is saved as an experiment whose provenance is the patch's studioHash"
    evidence: "command"
    ref: "node --test tests/unit/synth-measure-patch.test.mjs tests/unit/project-roundtrip.test.mjs && node tests/browser/v3-ui.cjs && node tests/browser/arrange.cjs"
  - id: "honest-instrument"
    criterion: "tests/unit/instrument-wording.test.mjs refuses every product, brand or model name and every analog-modelling claim in the instrument modules' shipped strings, and each approximation the instruments make is labelled where it is shown (project.no-fake-science)"
    evidence: "command"
    ref: "node --test tests/unit/synth-vco-contour.test.mjs tests/unit/instrument-wording.test.mjs tests/unit/synth-follower.test.mjs tests/unit/drum-sample.test.mjs tests/unit/synth-sync-vcf.test.mjs tests/unit/engine-fm.test.mjs tests/unit/engine-additive.test.mjs tests/unit/engine-wavetable.test.mjs tests/unit/engine-granular.test.mjs tests/unit/engine-pluck.test.mjs tests/unit/input-monitoring.test.mjs && node tests/browser/synth-nodes.cjs && node tests/browser/instrument-dsp.cjs && node tests/browser/synth-modulation.cjs && node tests/browser/drums.cjs && node tests/browser/engines.cjs && node tests/browser/arrange.cjs"
  - id: "one-transport"
    criterion: "The synth, the drums, the engines, the XY pad and the clips play on the one Studio transport, clock and tempo with one undo history; their onsets for one tempo fall on the same frames"
    evidence: "command"
    ref: "node --test tests/unit/synth-keys.test.mjs tests/unit/studio-trigger-fanout.test.mjs tests/unit/studio-armed-monitoring.test.mjs tests/unit/synth-workspace.test.mjs tests/unit/piano-keyboard.test.mjs tests/unit/studio-steps-playback.test.mjs tests/unit/drum-kit.test.mjs tests/unit/xy-loop.test.mjs tests/unit/studio-session.test.mjs tests/unit/mixer-channel.test.mjs tests/unit/arrange-view.test.mjs && node tests/browser/synth-nodes.cjs && node tests/browser/instrument-dsp.cjs && node tests/browser/synth-panel.cjs && node tests/browser/piano.cjs && node tests/browser/midi.cjs && node tests/browser/steps.cjs && node tests/browser/drums.cjs && node tests/browser/xy-pad.cjs && node tests/browser/session.cjs && node tests/browser/mixer.cjs && node tests/browser/arrange.cjs"
