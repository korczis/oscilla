id: connected-instrument
title: "One connected instrument system on the Studio model: a semi-modular synth with patch cables and knobs, a proper step sequencer, a drum machine, synthesis engines, an XY pad, a piano keyboard and clip-based MIDI, linked to the modulation, the labs, the visualizations and MEASURE"
statement: "OSCILLA gets one connected instrument system (owner direction of 2026-10-29, relayed by the coordinator from the owner's Czech): a proper sequencer; a semi-modular monosynth of the genre the owner named, with everything; dragging patch cables, maximally friendly; every kind of synthesis needed, a beat machine, an XY performance pad and clip-based MIDI arrangement of the genres the owner named, never a copy of any product; a piano played by pointer, touch, computer keys and MIDI with an instrument picker; all of it connected to the LFO and modulation, the labs, the visualizations and MEASURE; linked, real-time, interactive and covered by tests. Decided by the owner through AskUserQuestion (Q018): D11, continuous instrument parameters are rotary knobs that always show value and unit (drag with Shift fine, arrows and PageUp/PageDown, double-click reset, typed value), replacing D5 of intent playable-instrument and amending ADR 0058; and a new Synth workspace, a front panel with a patch bay on the Studio model in which every cable is a typed Studio connection and the sequencer plays it directly. Every instrument is a Studio node kind on the one StudioModel, compiled into the one AudioEngine, played by the one Studio transport with one tempo and one undo history. This intent takes over from playable-instrument's unissued Wave 3 the instrument view (the Synth workspace), the Keys node as the one note source (K060), note clips (K099), the tagged patch browser (K102) and the polyphony question for engines (Q021); D3, D4 and D8 of that intent hold here. Wave 1 (M064-M066) is the playable core: integration map, knob, panel, cables, piano, step sequencer and drums; Wave 2 (M067) the integration; Wave 3 (M068, M069) the engines, the XY pad and the session; Wave 4 (M071, M072) the full DAW the owner asked for on 2026-10-29 at about 22:00 ('full DAW, full sequencer, full piano, everything interlinked, everything clickable, everything parameterized, joined'): tracks, mixer, arrangement, tempo map, recording, a full piano, files, a parameter contract and deep links, on the same architecture. Owner decisions are Q018-Q024 under M070. The design is synth-design.md of the plan change that introduced this intent."
invariants:
  - "The StudioModel is the only instrument state: panels, the piano, the picker, the step grid, the mod matrix, the drum grid, the XY pad and the session are projections of the one store the Studio workspace creates, and every edit is one undoable dispatch (project.studio-model-is-canonical)"
  - "Every cable is a Studio edge through canConnect and full-model validation; a normal is a derived edge, never a stored flag; a refused cable or a cycle leaves model, history and runtime unchanged with the validator's sentence (project.typed-ports, project.no-silent-feedback)"
  - "The AudioEngine is the only audio lifecycle owner; all timing is on the audio clock through the Studio transport's scheduler; the node census is 0 after stop (project.audio-engine-discipline v2)"
  - "New node types, ports, capabilities, enum options and clip kinds leave every pinned studioHash unchanged; a new parameter on an existing type waits for an epoch (D2)"
  - "No product, brand or model name and no analog-modelling claim ships; every approximation is labelled where it is shown; levels are relative (project.no-fake-science)"
  - "Every slice's browser check proves it linked, real-time and interactive, within named deadlines and without assumed sample rates (project.bounded-test-timing, project.suite-harness), and every link is a row of the integration map"
  - "The interface is Flowbite Pro; continuous instrument parameters are the D11 knob (project.ui-uses-flowbite-pro, ADR 0061)"
  - "One file, from file:// and the Pages sub-path, within the 1.2 MB gzip budget and the line's cap (project.single-file-deliverable, Q023)"
  - "Every instrument is fully playable without MIDI: the piano, the computer keys, the step grid and the pad reach every voice, and MIDI only adds an input (ADR 0058 decision 2)"
  - "OSCILLA stays an instrument and a laboratory: every new readout has a row in the scientific-truth table of the design and says whether it is a setpoint, a derived value, an observation or an estimate; the dark technical cockpit identity holds (project.visual-identity-lock v2)"
