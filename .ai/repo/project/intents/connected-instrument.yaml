non_goals:
  - "A copy of any commercial instrument or application: its name, branding, artwork, panel layout or trade dress, or a claim of analog modelling (ADR 0058, D1)"
  - "Turning the V2 block sequencer into a note sequencer: the steps and notes clips are Studio timeline data (ADR 0058's rejected alternative stands)"
  - "Bundled third-party samples or wavetables"
  - "Microphone audio reaching the output through an instrument (live-input-to-output); the microphone gives the follower's CV and gate"
  - "Feedback delay and chorus before their own no-silent-feedback version (D8)"
  - "Polyphony of the semi-modular panel before node groups and a polyphony ADR (D4)"
  - "Skeuomorphic chrome: the knob is flat (project.visual-identity-lock v2)"
  - "A copy of any DAW's name, branding, layout or trade dress, and a feature-count contest: the full DAW the owner asked for is built on the Studio model in small slices after the playable core, each tied to a tested workflow"
  - "A wholesale visual redesign"
