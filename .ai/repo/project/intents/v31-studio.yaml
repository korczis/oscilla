id: v31-studio
title: "OSCILLA Studio makes the signal path an editable, executable model that drives the real audio and measurement engines"
statement: "OSCILLA Studio turns the Signal Path from passive visualization into an editable executable model: one versioned StudioModel with a node-type registry, typed ports, pure validation and an undoable action layer, holding no runtime object, is the only Studio state; the editable HTML/SVG graph, the multi-track timeline migrated from the sequencer, the automation lanes, the Inspector, the compact Studio widget and the maximizable Studio workspace are projections of it; it compiles into the existing AudioEngine with incremental, transactional, click-free patching, so the screen never shows a topology the runtime does not have; measurement nodes and clips drive the canonical V3 measurement workflow and the Studio definition enters experiment provenance; patches and projects save, export and import with strict validation and migrations; every operation has a non-drag path and phones get a GRAPH, TIMELINE and INSPECTOR flow; the Studio suites run in the release gate; and OSCILLA 3.1.x is released through the single-source version and Pages workflow and publicly smoke-tested."
invariants:
  - "Studio has exactly one canonical state, the StudioModel; every view only reads it and it holds no AudioContext, AudioNode, MediaStream, DOM or worker reference (project.studio-model-is-canonical, ADR 0030)"
  - "The AudioEngine stays the authoritative audio lifecycle owner and the V3 measurement architecture stays authoritative for measurement; Studio orchestrates them and duplicates neither (specification section 2, ADR 0035, ADR 0038)"
  - "An edge reaches the runtime only after the model accepts it; ports are typed with roles and compatibility is model logic (project.typed-ports, ADR 0032)"
  - "Instantaneous audio feedback and control or analysis cycles are rejected with the cycle and a reason (project.no-silent-feedback, ADR 0033)"
  - "New surfaces extend the existing OSCILLA tokens and visual language (project.visual-identity-lock); the graph editor is custom HTML nodes over SVG cables, without React or a flow-editor framework (ADR 0034)"
