satisfaction:
  - id: model-plain-data
    criterion: "A StudioModel is plain serializable data; runtime values are rejected before it is stored or serialized"
    evidence: claim
    ref: "studio-model-plain-data"
  - id: deterministic-hash
    criterion: "A normalized StudioModel serializes deterministically and its hash covers execution state only"
    evidence: claim
    ref: "studio-deterministic-hash"
  - id: schema-version
    criterion: "The Studio schema version is its own integer, changed only through registered stepwise migrations"
    evidence: claim
    ref: "studio-schema-version"
  - id: registry-reuses-engine
    criterion: "Every node type names the existing engine export it compiles to and holds no audio object"
    evidence: claim
    ref: "studio-registry-reuses-engine"
  - id: typed-connections
    criterion: "Only compatible typed ports connect, and a rejection carries a readable reason and changes nothing"
    evidence: claim
    ref: "studio-typed-connections"
  - id: feedback-rejected
    criterion: "Audio feedback, control cycles and analysis cycles are rejected before anything reaches Web Audio"
    evidence: claim
    ref: "studio-feedback-rejected"
  - id: exact-undo-redo
    criterion: "Undo and redo restore exact semantic state, and a continuous drag is one history entry"
    evidence: claim
    ref: "studio-exact-undo-redo"
  - id: subgraph-paste
    criterion: "Pasting a subgraph creates fresh ids, keeps only internal edges and is one undoable step"
    evidence: claim
    ref: "studio-subgraph-paste"
  - id: one-store-projections
    criterion: "The graph editor, Inspector, timeline and compact widget render one StudioModel through one store"
    evidence: claim
    ref: "studio-one-store-projections"
  - id: compiled-topology
    criterion: "The running Web Audio topology is compiled from the StudioModel through the existing AudioEngine"
    evidence: claim
    ref: "studio-compiled-topology"
  - id: click-free-live-edit
    criterion: "Editing while playing patches the running graph in crossfaded transactions and leaves nothing behind after stop"
    evidence: claim
    ref: "studio-click-free-live-edit"
  - id: timeline-model
    criterion: "Timeline clips sit in absolute seconds with sequencer block payloads, and timeline edits validate and undo exactly"
    evidence: claim
    ref: "studio-timeline-model"
  - id: transport-audio-clock
    criterion: "Transport, clips, loop and automation are scheduled on AudioContext time"
    evidence: claim
    ref: "studio-transport-audio-clock"
  - id: automation-model
    criterion: "Automation lanes accept only automatable parameters, one lane each, with sorted points"
    evidence: claim
    ref: "studio-automation-model"
  - id: measurement-topology
    criterion: "A Studio measurement topology is typed analysis routing whose reference and capture ports cannot be swapped"
    evidence: claim
    ref: "studio-measurement-topology"
  - id: experiment-provenance
    criterion: "A measurement run from Studio goes through the V3 engine and the saved experiment records the Studio schema version and hash"
    evidence: claim
    ref: "studio-experiment-provenance"
  - id: patch-round-trip
    criterion: "A saved project loads back to the exact model, and a patch inserts only on explicit user intent"
    evidence: claim
    ref: "studio-patch-round-trip"
  - id: untrusted-import
    criterion: "Studio files are imported as untrusted data, checked before use, and a newer schema is refused"
    evidence: claim
    ref: "studio-untrusted-import"
  - id: non-drag-operation
    criterion: "Every pointer-drag operation has a keyboard path dispatching the same store actions"
    evidence: claim
    ref: "studio-non-drag-operation"
  - id: file-protocol
    criterion: "The Studio workspace runs in Chromium, Firefox and WebKit from file:// and the /oscilla/ sub-path inside the single file"
    evidence: claim
    ref: "studio-file-protocol"
  - id: offline-render
    criterion: "The Studio suites, offline rendering of Studio sequences included, pass"
    evidence: command
    ref: "npm run test:studio"
  - id: self-knowledge
    criterion: "The Studio ADRs, features, use cases, rules and knowledge validate in the .ai layer"
    evidence: command
    ref: "majordomus doctor"
  - id: public-release-verified
    criterion: "The public page serves the 3.1.x release with its version and commit, and the public Studio smoke passes"
    evidence: command
    ref: "npm run test:live"
