non_goals:
  - "Graph grouping and subgraphs with exposed ports: architected for, optional for 3.1 (specification section 116)"
  - "A command palette and crash recovery of the last working draft: optional, and must not delay 3.1 (sections 126 and 157)"
  - "React or a flow-editor framework (section 54, ADR 0034)"
  - "An audio-file editor: the timeline is an event and control timeline (section 81)"
  - "A second audio engine or a second measurement orchestration (sections 2 and 42)"
