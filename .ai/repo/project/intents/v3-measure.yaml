id: v3-measure
title: "OSCILLA V3 MEASURE is a browser acoustic measurement workbench whose results say how far they can be trusted"
statement: "OSCILLA V3 is primarily a browser acoustic measurement workbench, not a larger synthesizer: stimulus, capture, offline analysis and result layers are pure tested modules behind an explicit measurement state machine with versioned algorithm IDs; frequency-response and absolute-level calibration are separate, validated, interpolated in log frequency and hashed, and SPL appears only with valid absolute calibration; a guided log-sweep measurement yields a magnitude response with raw, calibrated, normalized and smoothed views and reliability masks, and its deconvolution recovers the impulse response with metadata and non-destructive windowing; an FFT, octave and third-octave RTA integrates band power with documented averaging, peak hold and freeze; versioned experiments carry provenance, persist locally with graceful degradation under file://, import strictly, export CSV, repeat and compare; a data-driven GOOD/USABLE/POOR/INVALID assessment states its reasons; a MEASURE workspace in the OSCILLA design language offers guided and expert modes, a live quality bar, safe abort and accessible summaries; and OSCILLA 3.0.0 is deployed to Pages from the gated release workflow with V1/V2 regressions and V3 suites green and its public version and commit verified."
invariants:
  - "Measurement results come from captured PCM through deterministic offline DSP; the live analyser is feedback only (ADR 0018)"
  - "Levels are relative (dBFS-like) and labelled dB SPL only under a valid absolute-level calibration (ADR 0017, project.no-fake-science)"
  - "Every stored result names the algorithm that produced it by a stable versioned ID; a material change mints a new ID (ADR 0024)"
  - "A recipe says what to do and an experiment records what was done; repeating a recipe creates a new experiment (ADR 0019)"
  - "V1 and V2 behaviour is not weakened (specification section 183)"
  - "No medical, hearing-diagnosis or certification claim (specification sections 188-189)"
