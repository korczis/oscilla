satisfaction:
  - id: algorithm-ids
    criterion: "Every stored result names its algorithm by a versioned ID, an unknown ID is refused on import, and every known ID reproduces its golden output"
    evidence: claim
    ref: "algorithm-ids-on-results"
  - id: analysis-off-main-thread
    criterion: "The offline analysis runs in a Worker when the platform has one, bit-identical to the inline fallback"
    evidence: claim
    ref: "analysis-off-main-thread"
  - id: calibration-profiles
    criterion: "A frequency-response profile imports with line-numbered errors, is identified by a SHA-256 and is interpolated in log frequency without extrapolation"
    evidence: claim
    ref: "calibration-profiles"
  - id: spl-only-with-calibration
    criterion: "No level is labelled dB SPL unless a valid absolute level calibration with an explicit reference applies"
    evidence: claim
    ref: "spl-only-with-level-calibration"
  - id: transfer-function
    criterion: "The transfer function is recovered from a captured log sweep within the stated tolerances of known systems"
    evidence: claim
    ref: "transfer-function"
  - id: impulse-response
    criterion: "The impulse response is derived by regularised deconvolution of the captured sweep within the stated tolerances"
    evidence: claim
    ref: "impulse-response"
  - id: rta-bands
    criterion: "Octave and third-octave bands integrate power between base-10 edges, and the fast and slow averager meets its time constant"
    evidence: claim
    ref: "rta-bands"
  - id: experiment-round-trip
    criterion: "An experiment survives create, encode, JSON and validate identically"
    evidence: claim
    ref: "experiment-round-trip"
  - id: reproducible-experiments
    criterion: "Every saved measurement records its recipe, devices, calibration, sample rate, runs, quality, algorithm IDs, version and build with hashes"
    evidence: claim
    ref: "reproducible-experiments"
  - id: experiment-persistence
    criterion: "Experiments persist in IndexedDB and fall back to an in-memory store that says so"
    evidence: claim
    ref: "experiment-persistence"
  - id: experiment-import-validated
    criterion: "An imported experiment is untrusted input and every malformed shape is refused with a reason"
    evidence: claim
    ref: "experiment-import-validated"
  - id: measurement-comparison
    criterion: "Comparing experiments flags differing conditions and shows A minus B only over the overlapping valid range"
    evidence: claim
    ref: "measurement-comparison"
  - id: measurement-quality
    criterion: "Every measurement is rated GOOD, USABLE, POOR or INVALID from named metrics, always with its reasons"
    evidence: claim
    ref: "measurement-quality"
  - id: aggregate-primary-response
    criterion: "A measurement of two or more runs stores the aggregate with dispersion and repeatability as its primary response"
    evidence: claim
    ref: "aggregate-primary-response"
  - id: measurement-workbench
    criterion: "The Measure workspace takes a measurement through setup, noise check, sweep, analysis and review to a saved experiment"
    evidence: claim
    ref: "measurement-workbench"
  - id: abort-releases-everything
    criterion: "Aborting a measurement in any active state leaves no audio node, source, capture, worklet port or input track"
    evidence: claim
    ref: "measurement-abort-releases-everything"
  - id: measure-from-file-and-subpath
    criterion: "The Measure and Experiments workspaces run in Chromium, Firefox and WebKit from file:// and from the /oscilla/ sub-path"
    evidence: claim
    ref: "measure-from-file-and-subpath"
  - id: no-fake-science
    criterion: "No shipped text makes a medical, pseudoscientific or certification claim"
    evidence: claim
    ref: "no-fake-science-in-shipped-copy"
  - id: product-graph
    criterion: "The V3 features, use cases, ADRs and knowledge validate in the .ai layer"
    evidence: command
    ref: "majordomus doctor"
  - id: public-release-verified
    criterion: "The public page serves the 3.x release with its version and commit, and the MEASURE and Playground smoke passes"
    evidence: command
    ref: "npm run test:live -- --expect-commit origin/main"
