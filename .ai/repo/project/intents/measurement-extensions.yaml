id: measurement-extensions
title: "OSCILLA derives room-decay, clarity, distortion, latency, phase and coherence figures from its own captured measurements, each with a stated validity, a versioned algorithm ID and a proof on known systems"
statement: "The V3 MEASURE specification deferred room acoustics, distortion, latency and phase to \"V3.1\" (sections 4, 90-92); the V3.1 number went to the Studio, and since then no milestone has carried them (ChatGPT project conversation 6abec18d, 2026-10-02T03:15:06Z and 03:18:10Z). OSCILLA computes, from the captured PCM of its own measurements and never from the live analyser: Schroeder decay, EDT, T20 and T30 per octave band with their dynamic-range validity; C50, C80 and D50; THD and THD+N at a stated fundamental beside the chain's own floor; the round-trip latency of the measured chain; unwrapped phase and group delay where alignment and reliability allow; and the coherence of repeated runs. Each figure carries a versioned algorithm ID, is stored, exported and compared like the existing results, and is proven on synthetic systems with known answers; a figure the data cannot support is refused with its reason rather than shown. The response chart can show optional context overlays (hearing range, speech, notes, species) that never change data, and a characterized playback and capture chain can be kept as a named chain profile that is never a calibration."
invariants:
  - "Every figure comes from captured PCM through deterministic offline DSP; the live analyser is feedback only (ADR 0018)"
  - "Every stored figure names its algorithm by a stable versioned ID (ADR 0024)"
  - "A figure is shown only with the validity its data supports, and otherwise refused with the reason (ADR 0025, project.no-fake-science)"
  - "No figure is called conformant to ISO 3382, IEC 60268 or any standard, and an observed response is the chain's, never the speaker's (project.no-fake-science)"
  - "Levels stay relative unless a valid absolute level calibration applies (ADR 0017)"
milestones:
  - "M047"
satisfaction:
  - id: "room-decay"
    criterion: "EDT, T20 and T30 per octave band are recovered from synthetic exponential decays with known reverberation times within 5 %, and a decay whose range is too short for a figure yields no figure and says why"
    evidence: "command"
    ref: "npm test"
  - id: "clarity"
    criterion: "C50, C80 and D50 are recovered from synthetic impulse responses with an analytically known energy split within 0.1 dB (C) and 0.5 percentage points (D)"
    evidence: "command"
    ref: "npm test"
  - id: "distortion"
    criterion: "THD and THD+N are recovered from synthetic signals with known harmonic and noise content within 0.02 percentage points, beside the floor of the same chain"
    evidence: "command"
    ref: "npm test"
  - id: "round-trip-latency"
    criterion: "The round-trip delay of a captured chirp is recovered from synthetic delays to the sample, and an uncorrelated capture yields no delay"
    evidence: "command"
    ref: "npm test"
  - id: "phase-group-delay"
    criterion: "Unwrapped phase and group delay are recovered from synthetic delays and all-pass systems within 1 %, and are masked where the response is unreliable or alignment is not robust"
    evidence: "command"
    ref: "npm test"
  - id: "run-coherence"
    criterion: "The coherence of repeated runs is 1 for identical runs and follows SNR/(1+SNR) within 0.05 for runs with independent noise of known SNR"
    evidence: "command"
    ref: "npm test"
  - id: "context-overlays"
    criterion: "Turning a context overlay on or off leaves the result hash, the CSV export and the stored record byte-identical, and each overlay names its source"
    evidence: "command"
    ref: "npm run test:measure"
  - id: "chain-profile"
    criterion: "A characterized chain is saved as a named chain profile, labelled as the observed chain response under its setup, never applied as a calibration"
    evidence: "command"
    ref: "npm run test:measure"
  - id: "extensions-from-file-and-subpath"
    criterion: "The new figures render in Chromium, Firefox and WebKit from file:// and from the /oscilla/ sub-path"
    evidence: "command"
    ref: "npm run test:measure"
governance:
  - "rule:project.no-fake-science"
  - "rule:project.single-file-deliverable"
  - "rule:project.visual-identity-lock"
  - "adr:adr-0017"
  - "adr:adr-0018"
  - "adr:adr-0021"
  - "adr:adr-0024"
  - "adr:adr-0025"
  - "file:docs/specs/oscilla-v3-measure.md"
non_goals:
  - "Conformance to ISO 3382, IEC 60268 or any measurement class: figures are estimates"
  - "Waterfall plots, early-reflection identification and MLS excitation: not planned"
  - "A generic ELN or LIMS (workflow engine, approvals, teams, remote stores): definitions stay measurement-specific (knowledge record deferred-ideas-from-the-chatgpt-project)"
  - "Executable experiment steps, parameter sweeps or an experiment DSL: deferred, no owner request"
created_at: 2026-10-18
