id: measurement-extensions
title: "OSCILLA derives room-decay, clarity, distortion, chain-delay, phase and run-consistency figures from its own captured measurements, each stating what it estimates, where, by which method and how uncertain it is, with a versioned algorithm ID and a proof on known systems"
statement: "The V3 MEASURE specification deferred room acoustics, distortion, latency and phase to \"V3.1\" (sections 4, 90-92); the V3.1 number went to the Studio, and since then no milestone has carried them (ChatGPT project conversation 6abec18d, 2026-10-02T03:15:06Z and 03:18:10Z). OSCILLA computes, from the captured PCM of its own measurements and never from the live analyser: Schroeder decay, EDT, T20 and T30 per octave band through its own filter bank, with their dynamic-range, bandwidth-time and span validity; C50, C80 and D50; THD and THD+N at a stated fundamental, in a stated bandwidth and with a stated notch, beside the chain's own floor; the delay of the measured chain, called a round-trip latency only once the clock relationship of capture and playback is established; unwrapped phase relative to the removed alignment and group delay per run; and a run-to-run consistency of repeated runs with a stated estimator. Every figure follows one contract: it states the estimate, the source and receiver setup it is an estimate for (one position of one chain, never the room or the speaker as such), the condition under which it is valid, the method it follows without a conformance claim, and its spread or uncertainty, or says that none can be given. Each figure carries a versioned algorithm ID, is stored, exported and compared like the existing results, and is proven on synthetic systems with known answers; a figure the data cannot support is refused with its reason rather than shown. The response chart can show optional context overlays on its frequency axis (hearing range, speech, notes, species) that never change data, and a characterized playback and capture chain can be kept as a named chain profile that is never a calibration."
invariants:
  - "Every figure comes from captured PCM through deterministic offline DSP; the live analyser is feedback only (ADR 0018)"
  - "Every stored figure names its algorithm by a stable versioned ID (ADR 0024)"
  - "A figure is shown only with the validity its data supports, and otherwise refused with the reason (ADR 0025, project.no-fake-science)"
  - "Every stored figure carries the contract of the figure-contract criterion: estimate, setup and position, validity condition, method reference without a conformance claim, and spread or uncertainty or the statement that none can be given"
  - "No figure is called conformant to ISO 3382, IEC 60268, IEC 61260 or any standard, and an observed response is the chain's, never the speaker's or the room's as such (project.no-fake-science)"
  - "Levels stay relative unless a valid absolute level calibration applies (ADR 0017); no overlay draws in the level dimension of an uncalibrated chart"
  - "Each V39x pull request touches guarded paths (src/js/experiments, and after #197 src/js/measurement and src/js/ui/measure.js) and therefore carries a reviewer's verdict and, as a feat change, fail-first (project.review-verdict, project.fail-first)"
milestones:
  - "M047"
satisfaction:
  - id: "figure-contract"
    criterion: "Every figure kind the measurement engine registers stores its estimate, its setup and position label, its validity condition, its method reference with no conformance claim, and its spread or uncertainty or the reason none can be given, and a unit test fails for a registered figure kind that lacks one of them"
    evidence: "command"
    ref: "node --test tests/unit/measurement-figure-contract.test.mjs"
  - id: "room-decay"
    criterion: "A broadband synthetic impulse response built from per-band exponential decays of known reverberation time (generated with band masks independent of the product's filter bank) and a known noise floor, passed through the product's own octave filter bank, yields EDT, T20 and T30 within 5 % in each band the result names as evaluated; a band whose bandwidth-time product B x T is below 16, whose decay range above the noise floor does not cover its evaluation range plus margin, or whose evaluation range does not fit in the full-overlap span of the deconvolution (the post-roll minus the latency) yields no figure and says which of these holds"
    evidence: "command"
    ref: "node --test tests/unit/room-decay.test.mjs"
  - id: "clarity"
    criterion: "C50, C80 and D50 are recovered from synthetic impulse responses with an analytically known energy split within 0.1 dB (C) and 0.5 percentage points (D), with the onset rule stated, and an impulse response without a detectable onset yields no figure and the reason"
    evidence: "command"
    ref: "node --test tests/unit/clarity-definition.test.mjs"
  - id: "distortion"
    criterion: "THD and THD+N in the stated measurement bandwidth and with the stated notch are recovered from synthetic signals with known harmonic and noise content within 0.02 percentage points, beside the floor of the same chain measured with the stimulus silent"
    evidence: "command"
    ref: "node --test tests/unit/distortion-thd.test.mjs"
  - id: "round-trip-latency"
    criterion: "The delay of a captured chirp is recovered from synthetic delays to the sample and an uncorrelated capture yields no delay; the figure is called a round-trip latency only where the recorded clock relationship of capture and playback supports it, and is otherwise named the capture offset of the measured chain"
    evidence: "command"
    ref: "node --test tests/unit/chain-delay.test.mjs"
  - id: "phase-group-delay"
    criterion: "Unwrapped phase, relative to the removed alignment lag, and the group delay of a single run are recovered from synthetic delays and all-pass systems within 1 %; they are masked where the response is unreliable or alignment is not robust, and refused for the aggregate of repeated runs with that reason"
    evidence: "command"
    ref: "node --test tests/unit/phase-group-delay.test.mjs"
  - id: "run-coherence"
    criterion: "The run-to-run consistency of N repeated runs, gamma^2 = |sum H_i|^2 / (N sum |H_i|^2), is 1 for identical runs and is within 0.05 of its expected value (SNR + 1/N) / (SNR + 1) for runs with independent noise of known SNR at N = 3, 5 and 10; it is never called input-output coherence"
    evidence: "command"
    ref: "node --test tests/unit/run-consistency.test.mjs"
  - id: "context-overlays"
    criterion: "Turning a context overlay on or off leaves the result hash, the CSV export and the stored record byte-identical; each overlay names its source, draws on the frequency axis only unless a valid level calibration applies, and the hearing-range overlay says that 20 Hz-20 kHz is a nominal convention"
    evidence: "command"
    ref: "node --test tests/unit/response-context-overlays.test.mjs"
  - id: "chain-profile"
    criterion: "A characterized chain is saved as a named chain profile, labelled as the observed chain response under its setup, stored with the hashed device id rather than device labels, never applied as a calibration"
    evidence: "command"
    ref: "node --test tests/unit/chain-profile.test.mjs"
  - id: "extensions-from-file-and-subpath"
    criterion: "Each new figure, overlay and the chain profile view is shown, or refused with its reason, in Chromium, Firefox and WebKit, from file:// and from the /oscilla/ sub-path"
    evidence: "command"
    ref: "node tests/browser/v3-measure-extensions.cjs"
governance:
