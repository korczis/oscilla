  - "rule:project.single-file-deliverable"
  - "rule:project.visual-identity-lock"
  - "rule:project.review-verdict"
  - "rule:project.fail-first"
  - "adr:adr-0017"
  - "adr:adr-0018"
  - "adr:adr-0021"
  - "adr:adr-0023"
  - "adr:adr-0024"
  - "adr:adr-0025"
  - "file:docs/specs/oscilla-v3-measure.md"
  - "file:.ai/repo/features/impulse-response.md"
non_goals:
  - "Conformance to ISO 3382, IEC 60268, IEC 61260 or any measurement class: figures are single-position estimates"
  - "Averaging over several source and receiver positions into a room figure: not planned"
  - "Waterfall plots, early-reflection identification and MLS excitation: not planned"
  - "A generic ELN or LIMS (workflow engine, approvals, teams, remote stores): definitions stay measurement-specific (knowledge record deferred-ideas-from-the-chatgpt-project)"
  - "Executable experiment steps, parameter sweeps or an experiment DSL: deferred, no owner request"
