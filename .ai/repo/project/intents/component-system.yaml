satisfaction:
- id: contract-and-registry
  criterion: "Every data-osc hook is covered by one declaration with docs, a resolvable state path, resolvable links and a test that names it, and the allowance of undeclared hooks is empty"
  evidence: command
  ref: node --test tests/unit/ui-catalog.test.mjs
- id: proven-duplicates
  criterion: "Units, the parameter model, the clip face, the counts, parameter fields, lab switches, single choices, empty states and open-versus-fullscreen each have one implementation, and parameter fields, switches and choices render from their declarations"
  evidence: command
  ref: node --test tests/unit/units.test.mjs tests/unit/param-model.test.mjs tests/unit/studio-a11y-text.test.mjs tests/unit/ui-catalog-render.test.mjs
- id: embedded-cockpit
  criterion: "The embedded Studio is the full Studio's renderer at compact density on the one store, with the Studio's transport strip and timeline miniature, port-anchored typed cables, readable cards with category and state, a mini level and scope, and Open in Studio and Back that keep the selection, in every gate browser at desktop and phone sizes"
  evidence: command
  ref: "node --test tests/unit/studio-compact-density.test.mjs tests/unit/studio-cockpit.test.mjs && node tests/browser/studio-cockpit.cjs"
- id: sequence-pipeline
  criterion: "A sequencer pattern opens in the Studio and plays end to end in the cockpit, with level, scope and playhead moving and the node census 0 after stop"
  evidence: command
  ref: "node --test tests/unit/studio-open-sequence.test.mjs && node tests/browser/studio-cockpit.cjs --only song-pipeline"
- id: generated-docs
  criterion: docs/ui-catalog.md is generated from the declarations and current
  evidence: command
  ref: node scripts/ui-catalog.mjs --check
- id: in-app-explain
  criterion: Every catalogued component explains itself in the app and opens its related views from that panel
  evidence: command
  ref: node tests/browser/ui-catalog-explain.cjs
- id: interlinked
  criterion: "Every component has an address, and every related view is at most two in-content steps away or carries an exemption with a reason, walked by pointer, keyboard and touch"
  evidence: command
  ref: "node --test tests/unit/url-state-catalog.test.mjs tests/unit/ui-link-graph.test.mjs && node tests/browser/ui-link-graph.cjs"
- id: traceable
  criterion: "Every component names its source, plan, tests and ADRs, each checked, and the capability to source to test to ADR chain is generated and current"
  evidence: command
  ref: "node --test tests/unit/ui-catalog-trace.test.mjs && node scripts/ui-catalog.mjs --trace --check"
- id: majordomus-served
  criterion: "Every declared kind, component, node type and parameter names its plan and its rule or ADR ids in its trace and every id resolves; Majordomus serves each from a current generated knowledge record (knowledge validate reports nothing under .ai/repo/knowledge/components/, context resolve on its source module returns the component contract); and the allowance of untraced declarations is empty"
  evidence: command
  ref: "node --test tests/unit/component-trace.test.mjs tests/unit/component-links.test.mjs tests/unit/component-kb.test.mjs && node scripts/ui-catalog.mjs --check"
