non_goals:
- "A UI framework, a virtual DOM or a component library beside Flowbite Pro: the catalogue is declarations, one render function per proven-duplicate kind and generated documents, with no binding layer, condition language or directive of its own"
- "Rendering every component from a template: only proven duplicates get one"
- "A second Studio state, a second planner, or a knowledge database"
- "Choosing the first screen's layout: Q004 chose option A and P002 builds it"
- "Changing what the domain views (Signal Path, graph, timeline, charts) mean"
