id: component-system
title: "Every UI component of OSCILLA is declared once, renders from that declaration where its duplication is proven, explains itself, is reachable by address and from its related views, and traces to its source, tests and decisions"
statement: "On 2026-10-29 the owner said, in Czech, that the embedded Studio is ugly, that components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked, that everything must be interlinked with everything, and that the main page and the first experience improve and deploy often. The inventory of the same day (origin/main b67d1e58, v3.13.0) found the interface built four ways (Alpine markup, labs wired by id, a Studio built in JavaScript with two DOM helper modules, a hand-built sequencer), 576 data-osc hooks with no declaration, 14 semantics implemented several ways that already disagree (D1-D14) and an embedded Studio that is unseen, mostly empty, set in 10 px uppercase, without category or state and with cables that lose their meaning (U1-U15). This intent extends what exists, not a framework: the section 79 parameter descriptor and defineNode registry become the model of a catalogue under src/js/ui/catalog that every component is declared in, with its state path, links, docs, tests and source; the proven duplicates render from one declaration as Flowbite Pro markup (intent ui-flowbite-pro, ADR 0061); the docs, the in-app explanation, the link graph and the traceability chain are generated from the same declarations; and the embedded Studio becomes a compact cockpit drawn by the full Studio's own renderer on the one store."
invariants:
- "A component never owns state: its declaration names a canonical state path as documentation and for the tests, the catalogue holds, resolves, writes and subscribes to no value at run time, and the surface that owns a value passes it and commits it; the StudioModel stays the only Studio state and a compact view writes no layout position or viewport into it (project.studio-model-is-canonical)"
- Only kinds with proven duplication render from a template; everything else is declared as metadata and keeps its markup until its F issue (prompt pack P02 step 3)
- "Templates are adapted Flowbite Pro markup with Tailwind classes only; the catalogue holds no CSS and no input path of the build has a components, widgets, ui-kit or design-system segment; the Flowbite Pro ratchet only falls (project.ui-uses-flowbite-pro, ADR 0061)"
- Generated documents are byte-stable projections of the declarations and registries; what a component means stays authored (prompt pack P06)
- "Edges keep their meaning in every view: one style per signal type, ending at their ports (project.typed-ports; prompt pack P04 item 6)"
- "The single file opens from file:// and the sub-path with nothing fetched (project.single-file-deliverable)"
- "Every control has a pointer, keyboard and touch path, and a disabled control states why (project.no-inert-surfaces)"
