id: first-run-experience
title: "The first screen a visitor sees reflects what OSCILLA is now, in the form the owner chooses from an analysis of the current layout"
statement: "The owner felt the whole first screen should be redone to reflect the latest direction and features, since generating one signal need not take so much space, and asked first for an analysis of the layout and of the recent changes, ADRs and commits, then for a proposal (ChatGPT project conversation 6ac1beb8, 2026-10-05T19:17:26Z); the conversation ends before any proposal. OSCILLA opens today on the Playground generator. A worker analyses the current first screen and proposes layouts traced to the features and decisions they serve; the owner chooses what the first screen must show; the chosen layout is built without breaking deep links, file://, the sub-path or the instrument's direct path."
invariants:
  - "No layout is built before the owner chooses it (Q004)"
  - "Every existing deep link, the file:// and /oscilla/ sub-path paths and the direct path to the instrument keep working (project.single-file-deliverable)"
  - "The first screen uses the existing tokens and visual language (project.visual-identity-lock) and makes no claim the product cannot support (project.no-fake-science)"
milestones:
  - "M050"
  - "M052"
satisfaction:
  - id: "layout-analysed"
    criterion: "The analysis of the current first screen and the layout options are recorded with the share of the viewport each part takes at 1536x1024 and 390x844"
    evidence: "command"
    ref: "majordomus plan show P001"
  - id: "first-screen-chosen"
    criterion: "The owner's choice of what the first screen shows is recorded"
    evidence: "command"
    ref: "majordomus plan show Q004"
  - id: "first-screen-built"
    criterion: "The first screen shows what the owner chose, in Chromium, Firefox and WebKit, from file:// and from the sub-path, with every earlier deep link resolving as before"
    evidence: "command"
    ref: "npm run test:browser"
governance:
  - "rule:project.visual-identity-lock"
  - "rule:project.single-file-deliverable"
  - "rule:project.no-fake-science"
  - "adr:adr-0045"
non_goals:
  - "A marketing landing page outside the application, analytics, sign-up or a newsletter"
  - "Making About the default view (rejected in the About brief, conversation 6abf2a8d, 2026-10-02T04:13:38Z)"
created_at: 2026-10-18
