non_goals:
  - "The measurement workbench (calibration, transfer function, impulse response, RTA, experiments): V3 MEASURE, its own intent"
  - "Absolute sound pressure levels: V2 levels are relative to digital full scale (ADR 0017)"
  - "Release engineering and provenance (one version authority, fatal deployment verification): its own intent over M011"
