non_goals:
  - "Imposing the action-to-artifact diagram on components whose ownership or lifecycle legitimately differs (the Studio transport, MEASURE runs, the Learn demos)"
  - "Re-planning the sequencer, Studio, chart or Flowbite work of open plans (K001-K057, F001-F012); where they overlap, the issue that lands second records the shared criterion as met"
  - "Persisting configuration silently: lab settings are kept by explicit save paths, not by the unsaved-work guard or a background draft (ADR 0045)"
  - "Changing the Studio transport loop or the V1 hash format"
