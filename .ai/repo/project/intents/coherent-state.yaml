id: coherent-state
title: "One instrument, one coherent state: every control reaches its subsystem and every view that reflects it, and every saved artifact restores what it claims"
statement: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): audit and strengthen the integration between the generator, the AudioEngine, the analysis, the views, the Studio, configuration and export along the flow user action -> validated parameter -> canonical configuration -> AudioEngine -> signal processing -> analysis -> visualization -> saved or exported artifact, without imposing that diagram where ownership or lifecycle legitimately differs, and implementing only evidenced improvements. The owner clarified the honest-refusal journey: 'seems like filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested', so every control must provably reach its subsystem and every view that reflects it and be covered by a test, and the journey and control-census suites cover filters, the sequencer, BPM and every other control. An audit of main b67d1e58 (v3.13.0), each finding reproduced by an independent skeptic on a fresh export, found 35 defects in eight classes; M090 fixes them in small issues and holds the result with six user journeys and a control-drive ratchet."
invariants:
  - "The AudioEngine is the only audio authority: every node any workspace plays is counted, every output stays at or below the output ceiling, and the node census is 0 after stop (project.audio-engine-discipline v2)"
  - "Web Audio lifecycle discipline: live changes are click-free ramps on the engine's tracked params, no sounding envelope param is edited outside src/js/audio/envelope.js, and a closed context leaves no surface claiming it is live"
  - "The StudioModel is the only Studio state; status and views mirror plain values, never engine objects or a second copy of the model (project.studio-model-is-canonical)"
  - "Typed ports and explicit validation: a refused input or transition leaves the model unchanged and says why; nothing is silently repaired or clamped without being named (project.typed-ports)"
  - "No silent feedback path is added (project.no-silent-feedback)"
  - "No view, readout or report presents a signal, level or history that was not measured (project.no-fake-science v2), and no surface is inert or mislabelled (project.no-inert-surfaces)"
  - "No new server and no runtime network; one file that works offline from file:// and the Pages sub-path (project.single-file-deliverable v2)"
  - "V1 behaviour with the labs off is unchanged, as the freeze golden vectors pin it (ADR 0014)"
milestones:
  - "M090"
satisfaction:
  - id: "stops-are-immediate"
    criterion: "Escape, page hide, the status-bar stop key and a MEASURE or Studio claim stop the sequencer and the instrument from their live state in the same event, with no 150 ms window, and a key labelled as a stop starts nothing"
    evidence: "command"
    ref: "node tests/browser/app.cjs"
  - id: "one-output-owner"
    criterion: "Exactly one of the instrument, the sequencer and the Studio owns the output at a time, the newest action wins, the sequencer is refused with a stated reason while a measurement owns the output, and MEASURE's setup check names every owner that sounds as other audio"
    evidence: "command"
    ref: "node --test tests/unit/sequencer-editor.test.mjs && node tests/browser/v3-measure.cjs"
  - id: "sequencer-through-engine"
    criterion: "The sequencer plays through the engine's Filter stage, live and in its WAV export, its nodes are counted by the engine with a census of 0 after stop, and the labs that do not apply to it say so"
    evidence: "command"
    ref: "node tests/browser/sequencer.cjs"
  - id: "sequence-state-one-owner"
    criterion: "The sequence waveform has one owner on every path (playback, WAV, status, import and export), the status duration follows every edit, and the playhead marks the block that sounds after an edit during playback"
    evidence: "command"
    ref: "node --test tests/unit/sequencer-editor.test.mjs tests/unit/qa-regressions.test.mjs"
  - id: "current-lab-state-wins"
    criterion: "Every voice, including a restarted one and an offline render, is built from the current lab state through one option merge; a lab switched off stays off, Additive never reaches one oscillator of a dual voice, and the Envelope shapes programmed and finite voices as the views say"
    evidence: "command"
    ref: "node --test tests/unit/engine.test.mjs tests/unit/freeze.test.mjs"
  - id: "live-edits-reach-the-voice"
    criterion: "Envelope sustain and power, a release time, the Phase & Stereo pan and a lower hard limit changed while a note sounds reach that note's output within a stated glide, or the control says that it applies from the next note; a loop stops at the programmed cap without the continuous permission"
    evidence: "command"
    ref: "node tests/browser/app.cjs && node tests/browser/engine-v1port.cjs"
  - id: "views-describe-what-sounds"
    criterion: "The status bar, the scope, the Spectrum marker, the spectrogram, the Signal Path and the mic lab describe the signal that actually sounds and its owner, write nothing for an interval they did not observe, and never show a closed graph as live"
    evidence: "command"
    ref: "node tests/browser/app.cjs && node tests/browser/v31-studio-transport.cjs"
  - id: "saved-state-is-honest"
    criterion: "Config import names every value it limited or rejected, Reset refreshes every field it restores, presets, History and the link restore the lab settings they claim, and an unsaved sequence arms the unsaved-work guard"
    evidence: "command"
    ref: "node tests/browser/navigation.cjs"
  - id: "every-control-reaches-its-subsystem"
    criterion: "Every control in src/index.html is driven by a browser test that asserts its effect at its subsystem and at a view that reflects it, held by a ratchet whose baseline only shrinks and ends empty; no control is drawn as something it is not or cannot be clicked"
    evidence: "command"
    ref: "node --test tests/unit/control-drive-baseline.test.mjs"
  - id: "user-journeys-hold"
    criterion: "The six user journeys (start, live change, synchronized views, repeated stop and restart, save-restore-compare, honest refusals) pass in Chromium, Firefox and WebKit through the suite harness with no fixed sleep"
    evidence: "command"
    ref: "node tests/browser/journeys.cjs"
