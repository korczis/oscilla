id: ui-flowbite-pro
title: "The whole interface of OSCILLA is built on the owner's Flowbite Pro, compiled at build time into the single file"
statement: "On 2026-10-28 the owner ordered, for every one of their projects, in Czech: 'vsechny me projekty musi mit flowbite pro, musi byt enforced, always used; dokumentuj, enforcuj, backpropaguj, overuj' (all my projects must have Flowbite Pro, enforced and always used; document, enforce, backpropagate, verify), and added the section 'UI: Flowbite Pro (mandatory)' to their global instructions with the skill flowbite-pro (SKILL.md, reference.md) that condenses their licensed Pro set (~/dev/poppyhead/assets/vendor/flowbite/: the Admin Dashboard HTML 1.1.1 shell, the Pro dashboards and blocks). OSCILLA is the opposite today: ADR 0012 dropped the V1 Tailwind Play CDN and Flowbite for plain token-based CSS (src/styles, about 182 KB of source) because a CDN cannot be inlined, and project.visual-identity-lock binds every surface to those tokens. ADR 0061 and rule project.ui-uses-flowbite-pro (pull request #250, the same day) record the decision, revise project.visual-identity-lock to v2 and hold the pre-Pro interface as a ratchet debt that only shrinks (tests/unit/ui-flowbite-pro.test.mjs and its record tests/unit/ui-flowbite-pro-baseline.json, measure 2 since the review of #250: the surfaces off Pro, every osc-* class token of src/index.html and src/js, and the selectors of the legacy stylesheets, debt 4252 at commit ee70253 as the record's measured block states; the record's debt field is the current value). That rule and ADR 0061 belong in the governance below, and land with #250: until #250 is on main this repository holds neither, and naming them fails intent validate (unresolved_governance), so F001, which starts only once #250 is on main, adds both. This intent is the migration that pays that debt without giving up what ADR 0012 protects: Tailwind 3 and the public MIT flowbite package are compiled at build time, with the flowbite plugin and the Pro theme of reference.md section 0, into the one dist/index.html, which keeps opening from file:// and from the /oscilla/ sub-path with nothing fetched. The Pro admin shell (fixed navbar, sidebar drawer collapsible to icons, page header with breadcrumb and actions) replaces the header and tab bar; every workspace is rebuilt from the matching Pro components (cards, buttons, forms, tabs, tables, badges, modals, empty states); the domain visuals that are OSCILLA's own (Signal Path, the Studio graph and timeline, the charts and canvases) keep their meaning and palette inside Pro cards. OSCILLA is a public MIT repository with a public Pages site, so the licence the owner states applies literally: adapted markup only, never a Pro source file, asset or bundle."
invariants:
  - "The deliverable stays one self-contained dist/index.html that opens from file:// and from the /oscilla/ sub-path with zero console errors; nothing is fetched, imported or loaded from a path at runtime; Tailwind and Flowbite are build-time inputs (project.single-file-deliverable, ADR 0012)"
  - "dist stays within scripts/build-config.mjs BUDGET (1 000 000 B gzip, 3 500 000 B raw); the budget is raised only by an owner decision recorded there"
  - "Every entry of the deep-link inventory (the #m=<workspace> routes, the V1 'm' mode ids, ?mock=1, the Studio links, the instrument's direct path) resolves as before, and the default workspace does not change (its layout is the owner's choice on Q004)"
  - "No Pro source file, illustration, asset, bundle or verbatim block enters the repository or dist; markup is adapted from the Pro templates onto the public MIT flowbite and tailwindcss packages (owner's licence statement, 2026-10-28)"
  - "Tests address elements through data-osc hooks and ids, never through presentation classes, so a restyle moves no behaviour check"
  - "OSCILLA's two-state theme (dark, the default and the reference, and light; key oscilla.theme; data-theme on <html>; resolveTheme in src/js/ui/app.js, which reads no prefers-color-scheme) stays the theme mechanism, and the Tailwind dark variant follows it; a system state is not added by this intent (non-goals)"
  - "The domain visuals (Signal Path, Studio nodes, cables and lanes, the charts and canvases) keep their meaning and the signal palette; no surface claims what the product cannot support (project.no-fake-science) and no control is inert (project.no-inert-surfaces)"
milestones:
  - "M055"
satisfaction:
  - id: "pro-build"
    criterion: "The build compiles Tailwind 3 with the flowbite plugin and the Pro theme at build time and inlines the CSS and flowbite's JavaScript into dist/index.html; build:check is reproducible, verify-dist passes (no runtime fetch, no remote font, no root-relative asset) and the measured size is within BUDGET"
    evidence: "command"
    ref: "node --test tests/unit/ui-flowbite-pro-build.test.mjs"
  - id: "pro-shell"
    criterion: "Every workspace opens in the Pro shell (fixed navbar, sidebar drawer collapsible to icons, page header with breadcrumb and actions) at 1536x1024 and 390x844 in Chromium, Firefox and WebKit, from file:// and from the sub-path, with every deep-link inventory entry resolving as before"
    evidence: "command"
    ref: "node tests/browser/ui-flowbite-pro.cjs"
  - id: "no-legacy-chrome"
    criterion: "The ratchet debt of tests/unit/ui-flowbite-pro-baseline.json reaches 0, so no surface is off Pro, no osc-* class token (osc-panel, osc-btn, osc-dialog, osc-tab and the rest) is left in src/index.html or src/js, no selector of the recorded legacy stylesheets remains, and the ratchet refuses any regression; and tests/browser/ui-flowbite-pro.cjs asserts, in the rendered page, that every UI surface carries the Flowbite Pro structure of its kind: the shell's navbar, sidebar, page header and footer, and for each of the twelve workspaces and each of the 22 dialogs the Pro cards, form controls, tables and modal markup its F issue names, in every gate browser and origin. Debt 0 alone is not the evidence: the ratchet's measure 2 counts legacy class tokens, legacy selectors and pending surfaces, not Pro structure, so a change can lower it without any Pro adoption, for example by renaming a legacy class to a token already in the frozen vocabulary or by leaving new markup classless under legacy descendant selectors (re-review of pull request #250, N7 and N1; measure 2 closed the renames, dropped ids and premature Pro classes of finding P1-1)"
    evidence: "command"
    ref: "node --test tests/unit/ui-flowbite-pro.test.mjs && node -e \"process.exit(require('./tests/unit/ui-flowbite-pro-baseline.json').debt===0?0:1)\" && node tests/browser/ui-flowbite-pro.cjs"
  - id: "pro-accessible"
    criterion: "On the Pro shell every interactive element is reachable by keyboard with a visible focus ring, the drawer and menus open and close by keyboard with Escape returning focus, the native dialogs keep their focus trap, and text contrast is at least 4.5:1 in both themes"
    evidence: "command"
    ref: "node tests/browser/ui-flowbite-pro.cjs"
  - id: "visual-references-pro"
    criterion: "The visual gate's references are regenerated from the Pro shell with the reason recorded, every workspace has an accepted reference in both themes, and the live smoke checks the Pro shell on the deployed page"
    evidence: "command"
    ref: "npm run test:visual"
  - id: "licence-clean"
    criterion: "No file of the owner's licensed Pro set is in the repository or dist: no tracked file matches a fingerprint of tests/unit/flowbite-pro-fingerprints.json or carries a Pro package marker, and the shell's behaviour that the Pro dashboard implements in its own scripts (sidebar.js, dark-mode.js) is OSCILLA's own code"
    evidence: "command"
    ref: "node --test tests/unit/ui-flowbite-pro.test.mjs"
governance:
  - "rule:project.single-file-deliverable"
  - "rule:project.visual-identity-lock"
  - "rule:project.no-inert-surfaces"
  - "rule:project.no-fake-science"
  - "rule:project.review-verdict"
  - "rule:project.suite-harness"
  - "rule:project.bounded-test-timing"
  - "adr:adr-0012"
  - "adr:adr-0029"
  - "adr:adr-0045"
non_goals:
  - "Replacing p5 (ADR 0013) or any other domain library; the Pro migration does not touch drawing or audio code"
  - "Changing what the Studio graph, timeline, Signal Path or the charts show; they are restyled only as far as their containers, controls and typography"
  - "Choosing the first screen's layout (Q004, M050); F003 rebuilds today's Playground arrangement on Pro components and P002 later builds the chosen one on the same shell"
  - "Flowbite React or Next.js: OSCILLA is Alpine.js on plain HTML, so the HTML Admin Dashboard is the source template"
  - "Re-planning the content work of ui-current (M054): its issues keep their objectives and are built on the Pro shell"
  - "A system theme state (following prefers-color-scheme): OSCILLA's theme is two-state today (resolveTheme returns light or dark) and the Pro migration keeps it; adding a third state is a separate owner decision"
