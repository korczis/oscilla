id: ui-flowbite-pro
title: "The whole interface of OSCILLA is built on the owner's Flowbite Pro, compiled at build time into the single file"
statement: "On 2026-10-28 the owner ordered, for every one of their projects, in Czech: 'vsechny me projekty musi mit flowbite pro, musi byt enforced, always used; dokumentuj, enforcuj, backpropaguj, overuj' (all my projects must have Flowbite Pro, enforced and always used; document, enforce, backpropagate, verify), and added the section 'UI: Flowbite Pro (mandatory)' to their global instructions with the skill flowbite-pro (SKILL.md, reference.md) that condenses their licensed Pro set (~/dev/poppyhead/assets/vendor/flowbite/: the Admin Dashboard HTML 1.1.1 shell, the Pro dashboards and blocks). OSCILLA is the opposite today: ADR 0012 dropped the V1 Tailwind Play CDN and Flowbite for plain token-based CSS (src/styles, about 182 KB of source) because a CDN cannot be inlined, and project.visual-identity-lock binds every surface to those tokens. ADR 0061 and rule project.ui-uses-flowbite-pro (pull request #250, written the same day and landed on main as 20583503 on 2026-10-29) record the decision, revise project.visual-identity-lock to v2 and hold the pre-Pro interface as a ratchet debt that only shrinks (tests/unit/ui-flowbite-pro.test.mjs and its record tests/unit/ui-flowbite-pro-baseline.json: the surfaces off Pro, the osc-* class tokens, the uses of the other legacy class names and the selectors of the legacy stylesheets, over every file the build bundles, as the test's header defines them; the measure, the starting debt and the commit they were measured at are the record's measured block, and its debt field is the current value). That rule and ADR 0061 are in the governance below: until #250 was on main this repository held neither and naming them failed intent validate (unresolved_governance), so the plan's pull request (#251) added both once the merge of main brought #250 in. This intent is the migration that pays that debt without giving up what ADR 0012 protects: Tailwind 3 and the public MIT flowbite package are compiled at build time, with the flowbite plugin and the Pro theme of reference.md section 0, into the one dist/index.html, which keeps opening from file:// and from the /oscilla/ sub-path with nothing fetched. The Pro admin shell (fixed navbar, sidebar drawer collapsible to icons, page header with breadcrumb and actions) replaces the header and tab bar; every workspace is rebuilt from the matching Pro components (cards, buttons, forms, tabs, tables, badges, modals, empty states); the domain visuals that are OSCILLA's own (Signal Path, the Studio graph and timeline, the charts and canvases) keep their meaning and palette inside Pro cards. OSCILLA is a public MIT repository with a public Pages site, so the licence the owner states applies literally: adapted markup only, never a Pro source file, asset or bundle."
invariants:
  - "The deliverable stays one self-contained dist/index.html that opens from file:// and from the /oscilla/ sub-path with zero console errors; nothing is fetched, imported or loaded from a path at runtime; Tailwind and Flowbite are build-time inputs (project.single-file-deliverable, ADR 0012)"
  - "dist stays within scripts/build-config.mjs BUDGET (1 000 000 B gzip, 3 500 000 B raw); the budget is raised only by an owner decision recorded there"
  - "Every entry of the deep-link inventory (the #m=<workspace> routes, the V1 'm' mode ids, ?mock=1, the Studio links, the instrument's direct path) resolves as before, and the default workspace does not change (its layout is the owner's choice on Q004)"
  - "No Pro source file, illustration, asset, bundle or verbatim block enters the repository or dist; markup is adapted from the Pro templates onto the public MIT flowbite and tailwindcss packages (owner's licence statement, 2026-10-28)"
  - "Tests address elements through data-osc hooks and ids, never through presentation classes, so a restyle moves no behaviour check"
  - "OSCILLA's two-state theme (dark, the default and the reference, and light; key oscilla.theme; data-theme on <html>; resolveTheme in src/js/ui/app.js, which reads no prefers-color-scheme) stays the theme mechanism, and the Tailwind dark variant follows it; a system state is not added by this intent (non-goals)"
  - "The domain visuals (Signal Path, Studio nodes, cables and lanes, the charts and canvases) keep their meaning and the signal palette; no surface claims what the product cannot support (project.no-fake-science) and no control is inert (project.no-inert-surfaces)"
milestones:
  - "M055"
satisfaction:
  - id: "pro-build"
    criterion: "The build compiles Tailwind 3 with the flowbite plugin and the Pro theme at build time and inlines the CSS and flowbite's JavaScript into dist/index.html; build:check is reproducible, verify-dist passes (no runtime fetch, no remote font, no root-relative asset) and the measured size is within BUDGET"
    evidence: "command"
    ref: "node --test tests/unit/ui-flowbite-pro-build.test.mjs"
  - id: "pro-shell"
    criterion: "Every workspace opens in the Pro shell (fixed navbar, sidebar drawer collapsible to icons, page header with breadcrumb and actions) at 1536x1024 and 390x844 in Chromium, Firefox and WebKit, from file:// and from the sub-path, with every deep-link inventory entry resolving as before"
    evidence: "command"
    ref: "node tests/browser/ui-flowbite-pro.cjs"
  - id: "no-legacy-chrome"
    criterion: "The ratchet debt of tests/unit/ui-flowbite-pro-baseline.json falls to the domain views' own residual and nothing else: no surface is pending, no legacy stylesheet but the domain views' own (src/styles/studio.css, studio-timeline.css and charts.css, and the custom properties of src/styles/tokens.css that they read) keeps a selector, every osc-* class token still in src/index.html or src/js is one that a selector of those stylesheets names (#250's cssShape: comments and declaration values do not count), under a domain-view prefix (the Studio graph osc-sg, the compact Studio widget osc-sc, the Studio timeline osc-stl and osc-stc, the charts osc-h, osc-chart, osc-seq-ruler and osc-chip-readout) and never a shell primitive (osc-btn*, osc-icon-btn*, osc-seg*, osc-tab*, osc-dialog*, osc-panel*, osc-select, osc-label, osc-toggle, osc-slider, osc-number), and every other legacy class name is one those selectors name, so the shell's and the workspaces' primitives are gone even where a domain-view stylesheet still styles them; and the ratchet refuses any regression. The domain views' selectors and classes are excluded from debt 0 because ADR 0061 decision 3 keeps the charts, the Signal Path and the Studio graph and timeline in their own rendering as the content of Pro cards, and #250's rule project.ui-uses-flowbite-pro leaves to an owner decision whether a domain view's own classes leave the record (measure 4 of #250 already records their selectors and tokens.css's in the record's domainViews, outside the debt, as the round-3 re-review of #250 asked); they keep their ratchet, so they can shrink and never grow. Shell CSS that sits in those stylesheets is not part of the residual: the Studio's chrome selectors in studio.css and studio-timeline.css (toolbar, transport, library and patches panels, inspector, subview switch, the eight Studio dialogs; osc-st-, osc-si-, osc-sl- and osc-sp- are therefore not domain-view prefixes, and the chrome under osc-stl- and osc-sc-, such as osc-stl-toolbar, is decided by F008's structure check, not by the prefix) are F008's to remove, chrome rules in charts.css (the chart cards' frames and controls around the plots) F006's, and the custom properties of tokens.css that only chrome reads F012's, as are the class tokens kept only as hooks that no stylesheet names (osc-stl-hrow--track and the other legacy selectors tests/browser/live-smoke.cjs reads, once F011 has moved the smoke to data-osc hooks). tests/browser/ui-flowbite-pro.cjs asserts, in the rendered page, that every UI surface carries the Flowbite Pro structure of its kind: the shell's navbar, sidebar, page header and footer, and for each of the twelve workspaces and each of the 22 dialogs the Pro cards, form controls, tables and modal markup its F issue names, in every gate browser and origin. The residual alone is not the evidence: the ratchet counts legacy class uses, legacy selectors and pending surfaces, not Pro structure, so new markup left classless under legacy descendant selectors adds nothing to it (re-review of pull request #250, N1, still unseen by the ratchet and listed in its rule); measure 2 closed the renames, dropped ids and premature Pro classes of finding P1-1, and measure 3 the rename of a legacy class to a token of the frozen vocabulary (N7)"
    evidence: "command"
    ref: "node --test tests/unit/ui-flowbite-pro.test.mjs && node --input-type=module -e \"import fs from 'fs';import {cssShape} from './scripts/ui-flowbite-pro-measure.mjs';const r=JSON.parse(fs.readFileSync('tests/unit/ui-flowbite-pro-baseline.json','utf8'));const D=['studio.css','studio-timeline.css','charts.css','tokens.css'].map(f=>'src/styles/'+f);const n=new Set(D.flatMap(f=>[...cssShape(fs.readFileSync(f,'utf8')).names]));const VIEW=['osc-sg','osc-sc','osc-stl','osc-stc','osc-h','osc-chart','osc-seq-ruler','osc-chip-readout'];const view=c=>VIEW.some(p=>c===p||c.startsWith(p+'-'));const shell=c=>['osc-btn','osc-icon-btn','osc-seg','osc-tab','osc-dialog','osc-panel'].some(p=>c.startsWith(p))||['osc-select','osc-label','osc-toggle','osc-slider','osc-number'].includes(c);const bad=[...r.surfaces.pending.map(s=>'pending '+s),...Object.keys(r.stylesheets).filter(f=>r.stylesheets[f].selectors>0&&!D.includes(f)).map(f=>'stylesheet '+f),...Object.keys(r.classes).filter(c=>shell(c)||!view(c)||!n.has(c)).map(c=>'class '+c),...Object.keys(r.vocabulary).filter(c=>!n.has(c)).map(c=>'vocabulary '+c)];if(bad.length){console.error(bad.length+' not domain-view residual: '+bad.join(', '));process.exit(1)}\" && node tests/browser/ui-flowbite-pro.cjs"
  - id: "pro-accessible"
    criterion: "On the Pro shell every interactive element is reachable by keyboard with a visible focus ring, the drawer and menus open and close by keyboard with Escape returning focus, the native dialogs keep their focus trap, and text contrast is at least 4.5:1 in both themes"
    evidence: "command"
    ref: "node tests/browser/ui-flowbite-pro.cjs"
  - id: "visual-references-pro"
    criterion: "The visual gate's references are regenerated from the Pro shell with the reason recorded, every workspace has an accepted reference in both themes, and the live smoke checks the Pro shell on the deployed page"
    evidence: "command"
    ref: "npm run test:visual"
  - id: "licence-clean"
    criterion: "No file of the owner's licensed Pro set is in the repository or dist: no tracked file matches a fingerprint of tests/unit/flowbite-pro-fingerprints.json or carries a Pro package marker, and the shell's behaviour that the Pro dashboard implements in its own scripts (sidebar.js, dark-mode.js) is OSCILLA's own code"
    evidence: "command"
    ref: "node --test tests/unit/ui-flowbite-pro.test.mjs"
governance:
  - "rule:project.single-file-deliverable"
  - "rule:project.visual-identity-lock"
  - "rule:project.no-inert-surfaces"
  - "rule:project.no-fake-science"
  - "rule:project.review-verdict"
  - "rule:project.suite-harness"
  - "rule:project.bounded-test-timing"
  - "rule:project.ui-uses-flowbite-pro"
  - "adr:adr-0012"
  - "adr:adr-0029"
  - "adr:adr-0045"
  - "adr:adr-0061"
non_goals:
  - "Replacing p5 (ADR 0013) or any other domain library; the Pro migration does not touch drawing or audio code"
  - "Changing what the Studio graph, timeline, Signal Path or the charts show; they are restyled only as far as their containers, controls and typography"
  - "Choosing the first screen's layout (Q004, M050); F003 rebuilds today's Playground arrangement on Pro components and P002 later builds the chosen one on the same shell"
  - "Flowbite React or Next.js: OSCILLA is Alpine.js on plain HTML, so the HTML Admin Dashboard is the source template"
  - "Re-planning the content work of ui-current (M054): its issues keep their objectives and are built on the Pro shell"
  - "A system theme state (following prefers-color-scheme): OSCILLA's theme is two-state today (resolveTheme returns light or dark) and the Pro migration keeps it; adding a third state is a separate owner decision"
