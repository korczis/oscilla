non_goals:
  - "A clone of any commercial product, its names or trade dress, or a claim of analog modelling (ADR 0058, D1); the step sequencer, session grid and piano roll of intent connected-instrument are of their genres, never a copy"
  - "Turning the block sequencer into a MIDI sequencer (ADR 0058)"
  - "Skeuomorphic chrome: the knob of D11 is flat, and other controls are Pro range sliders with number inputs"
  - "Feedback delay and chorus before a project.no-silent-feedback v2 (D8)"
  - "Studio polyphony before groups and a polyphony ADR (D4)"
  - "RF reception, SDR hardware and device I/Q: the signal-lab line is intent audio-band-signal-lab (D6)"
