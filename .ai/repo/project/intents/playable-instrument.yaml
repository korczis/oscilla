id: playable-instrument
title: "OSCILLA's Studio becomes a playable, patchable instrument: quick patching, a synth voice shaped from one panel, an audible sequencer, live analysis on every node and workspaces that hand their material to each other"
statement: "OSCILLA's Studio becomes a playable, patchable instrument and signal lab (owner direction of 2026-10-29, session oscilla-b0). The box system is quick to patch: each patching gesture is one undo step through canConnect and a refusal gives the validator's sentence. The synth has the voice nodes, macros, a mod matrix and presets that make a sound shapeable from one panel. The sequencer has audible tempo and real editing, and the Studio a clock. Every analysis node shows what it measures, live. Every workspace hands its material to the others, and the on-screen keyboard, QWERTY and MIDI feed one note source. Everything stays one StudioModel, one AudioEngine and one validation path, in a single file under 1 MB gzip, on Flowbite Pro. Owner decisions of 2026-10-29, answered by the owner through AskUserQuestion in session oscilla-b0: D1 and D5, \"Arturia-like\" means front-panel ergonomics (macros, a mod matrix, presets, a browser, a keyboard and an instrument view projected from the Studio graph) with no product names, trade dress or analog-modelling claims; controls are Flowbite Pro range sliders with number inputs and no custom rotary knob; ADR 0058 stays unchanged. Superseded on 2026-10-29 by D11, answered by the owner through AskUserQuestion (Q018): continuous instrument parameters are rotary knobs that always show value and unit, recorded as a resolution note of ADR 0058; other inputs stay Pro range and number inputs. D2, every new parameter on an existing node type lands in one hash epoch (K022) that bumps STUDIO_HASH_VERSION with a migration, and a document or experiment saved before it reloads stating \"saved under hash v1, migrated\" with its original hash kept in provenance. D3, a held key or MIDI note is a user-held gesture exempt from the playback limit while it is held (ADR 0005 sets that limit at 0.5-5 s, default 2 s; the owner's answer named the 2 s default); the output ceiling is kept and release is forced on blur, hide and Escape; this amends ADR 0005 through its own ADR in Wave 2 (K026). Taken by session oscilla-b0 as the plan's recommendation without asking the owner, who may override them: D4, V502 keeps 8 notes at 1/8 gain for the Playground and the Studio Keys node stays monophonic until groups exist, with the Studio polyphony ADR in Wave 3; D8, feedback delay and chorus wait for a project.no-silent-feedback v2 and a convolver reverb comes first; D9, Wave 1 (K001-K015) runs in parallel with F001-F003 because it adds no chrome; D10, restated after the review of pull request #265 because its first wording rested on a wrong premise: V605 gains a dependency on K010, since its AM and FM configurations (a modulator above the LFO's 100 Hz maximum, src/js/studio/playground-voice.js) cannot validate before it; its dependency on V604 is a scope chain that M048 narrows only once E003 has named its modules, so K010 does not remove it. D6 and D7 are recorded on intent audio-band-signal-lab. Wave 3 (an instrument view sv=instrument projected from the graph, one tagged browser inserting through PATCH_INSERT, a Keys node as the one note source, schema 2 groups after V601, the V605 voice, a convolver reverb, the polyphony ADR and voice pool, note clips after V505) is planned after D3, D4, D8, E003 and E004; it is not yet issued, and its criteria (the instrument view, the one note source and the tagged browser) are added to this intent with the issues that serve them. On 2026-10-29 intent connected-instrument took over the instrument view (its Synth workspace), the Keys node as the one note source (K060), note clips (K099), the tagged browser (K102) and the engines' polyphony question (Q021); groups after V601, the V605 voice and the convolver reverb stay here. Every chart that draws data reads out what it shows to the pointer, the keyboard and a screen reader, is validated and referenced in light and dark, and costs nothing while hidden (owner order of 2026-10-29: make the charts modern and interactive; M062, with its owner decisions Q008-Q017 under M063)."
invariants:
  - "The StudioModel is the only Studio state; the instrument panel, the mod matrix, presets and the browser are projections of it, and every edit is one undoable action through one command table and one validation path with no silent repair (project.studio-model-is-canonical)"
  - "Every connection goes through canConnect: typed ports hold, and a refused type or cycle leaves the model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback); feedback delay and chorus wait for no-silent-feedback v2 (D8)"
  - "The AudioEngine stays the only audio lifecycle owner: every node a workspace plays is counted, every output stays at or below the output ceiling and the node census is 0 after stop (project.audio-engine-discipline v2)"
  - "A held note is exempt from the configured playback limit (ADR 0005) only while a key or MIDI note is held, and is released on blur, hide and Escape (D3, amending ADR 0005 by its own ADR)"
  - "A new parameter on an existing node type changes every saved studioHash, so all of them land in the one hash epoch K022; a new node type, port, enum option or a wider range leaves every pinned hash unchanged (D2)"
  - "No figure, label or help text claims more than the signal shows (project.no-fake-science v2), and no surface is inert (project.no-inert-surfaces)"
  - "The UI is Flowbite Pro and the ratchet of non-Pro markup only falls; controls are Pro range sliders with number inputs, and continuous instrument parameters the knob of D11 (project.ui-uses-flowbite-pro, ADR 0061, D5 as superseded by D11)"
  - "One file, from file:// and the Pages sub-path, under the 1 000 000 B gzip budget of scripts/build-config.mjs (project.single-file-deliverable)"
