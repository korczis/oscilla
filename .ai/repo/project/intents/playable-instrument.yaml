id: playable-instrument
title: "OSCILLA's Studio becomes a playable, patchable instrument: quick patching, a synth voice shaped from one panel, an audible sequencer, live analysis on every node and workspaces that hand their material to each other"
statement: "OSCILLA's Studio becomes a playable, patchable instrument and signal lab (owner direction of 2026-10-29, session oscilla-b0). The box system is quick to patch: each patching gesture is one undo step through canConnect and a refusal gives the validator's sentence. The synth has the voice nodes, macros, a mod matrix and presets that make a sound shapeable from one panel. The sequencer has audible tempo and real editing, and the Studio a clock. Every analysis node shows what it measures, live. Every workspace hands its material to the others, and the on-screen keyboard, QWERTY and MIDI feed one note source. Everything stays one StudioModel, one AudioEngine and one validation path, in a single file under 1 MB gzip, on Flowbite Pro. Owner decisions of 2026-10-29, answered by the owner through AskUserQuestion in session oscilla-b0: D1 and D5, \"Arturia-like\" means front-panel ergonomics (macros, a mod matrix, presets, a browser, a keyboard and an instrument view projected from the Studio graph) with no product names, trade dress or analog-modelling claims; controls are Flowbite Pro range sliders with number inputs and no custom rotary knob; ADR 0058 stays unchanged. D2, every new parameter on an existing node type lands in one hash epoch (K022) that bumps STUDIO_HASH_VERSION with a migration, and a document or experiment saved before it reloads stating \"saved under hash v1, migrated\" with its original hash kept in provenance. D3, a held key or MIDI note is a user-held gesture exempt from the playback limit while it is held (ADR 0005 sets that limit at 0.5-5 s, default 2 s; the owner's answer named the 2 s default); the output ceiling is kept and release is forced on blur, hide and Escape; this amends ADR 0005 through its own ADR in Wave 2 (K026). Taken by session oscilla-b0 as the plan's recommendation without asking the owner, who may override them: D4, V502 keeps 8 notes at 1/8 gain for the Playground and the Studio Keys node stays monophonic until groups exist, with the Studio polyphony ADR in Wave 3; D8, feedback delay and chorus wait for a project.no-silent-feedback v2 and a convolver reverb comes first; D9, Wave 1 (K001-K015) runs in parallel with F001-F003 because it adds no chrome; D10, restated after the review of pull request #265 because its first wording rested on a wrong premise: V605 gains a dependency on K010, since its AM and FM configurations (a modulator above the LFO's 100 Hz maximum, src/js/studio/playground-voice.js) cannot validate before it; its dependency on V604 is a scope chain that M048 narrows only once E003 has named its modules, so K010 does not remove it. D6 and D7 are recorded on intent audio-band-signal-lab. Wave 3 (an instrument view sv=instrument projected from the graph, one tagged browser inserting through PATCH_INSERT, a Keys node as the one note source, schema 2 groups after V601, the V605 voice, a convolver reverb, the polyphony ADR and voice pool, note clips after V505) is planned after D3, D4, D8, E003 and E004; it is not yet issued, and its criteria (the instrument view, the one note source and the tagged browser) are added to this intent with the issues that serve them."
invariants:
  - "The StudioModel is the only Studio state; the instrument panel, the mod matrix, presets and the browser are projections of it, and every edit is one undoable action through one command table and one validation path with no silent repair (project.studio-model-is-canonical)"
  - "Every connection goes through canConnect: typed ports hold, and a refused type or cycle leaves the model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback); feedback delay and chorus wait for no-silent-feedback v2 (D8)"
  - "The AudioEngine stays the only audio lifecycle owner: every node a workspace plays is counted, every output stays at or below the output ceiling and the node census is 0 after stop (project.audio-engine-discipline v2)"
  - "A held note is exempt from the configured playback limit (ADR 0005) only while a key or MIDI note is held, and is released on blur, hide and Escape (D3, amending ADR 0005 by its own ADR)"
  - "A new parameter on an existing node type changes every saved studioHash, so all of them land in the one hash epoch K022; a new node type, port, enum option or a wider range leaves every pinned hash unchanged (D2)"
  - "No figure, label or help text claims more than the signal shows (project.no-fake-science v2), and no surface is inert (project.no-inert-surfaces)"
  - "The UI is Flowbite Pro and the ratchet of non-Pro markup only falls; controls are Pro range sliders with number inputs (project.ui-uses-flowbite-pro, ADR 0061, D5)"
  - "One file, from file:// and the Pages sub-path, under the 1 000 000 B gzip budget of scripts/build-config.mjs (project.single-file-deliverable)"
milestones:
  - "M057"
  - "M058"
  - "M059"
  - "M061"
satisfaction:
  - id: "patching-gestures"
    criterion: "Replace on an occupied input, dragging a cable end to re-route it or onto empty canvas to delete it, delete-and-bridge, tidy and edge mute are each one history entry, and every connection they make goes through canConnect; a refused gesture leaves model, history and runtime unchanged and shows the validator's sentence; a wheel or two-finger scroll pans the view and Ctrl/Cmd + wheel zooms it at the pointer, as view state outside history; the shortcut list is generated from STUDIO_SHORTCUTS"
    evidence: "command"
    ref: "node --test tests/unit/studio-graph-wheel.test.mjs tests/unit/studio-graph-rewire.test.mjs tests/unit/studio-graph-keys.test.mjs tests/unit/studio-graph-commands.test.mjs"
  - id: "editor-headroom"
    criterion: "src/js/ui/studio/graph-editor.js and src/js/studio/adapters/nodes.js, and each file split from them, have at least 10 000 B of room under their caps in tests/unit/source-size-baseline.json, read from the files by a headroom test, with every template studioHash unchanged"
    evidence: "command"
    ref: "node --test tests/unit/studio-adapters-headroom.test.mjs tests/unit/studio-graph-editor-headroom.test.mjs"
  - id: "voice-nodes"
    criterion: "An audio-rate LFO (clamped at 0.95 x Nyquist and stated), the Drive and Macro nodes, lowshelf, highshelf and allpass filters and brown noise render offline with their stated figures (an LFO at 440 Hz on a linear frequency edge, the mapping the Playground FM voice uses, gives lines at fc +- n x 440 Hz whose first sideband matches J1/J0 of the stated modulation index within 1 dB; shelf gain within 0.5 dB, with Q stated as unused on a shelf; allpass flat within 0.1 dB; brown noise -6 dB/octave within 1.5 dB), peak at or below the output ceiling, leave a node census of 0 after stop and change no pinned studioHash"
    evidence: "command"
    ref: "node --test tests/unit/k010-k013-studio-voice-nodes.test.mjs"
  - id: "template-pack"
    criterion: "The filter-envelope synth, FM bell, ring-mod, drive lead, macro pad and step-modulator bass templates each validate, carry a pinned studioHash, render non-silent offline with peak at or below the cap, and open through the Templates dialog and #m=studio&st=<id>"
    evidence: "command"
    ref: "node --test tests/unit/studio-template-pack.test.mjs"
  - id: "front-panel"
    criterion: "Node presets apply parameters only and keep edges; the mod matrix lists the CONTROL edges, edits them through EDGE_UPDATE and shows canConnect's sentence when a route is refused; both are projections of the StudioModel built from Pro components"
    evidence: "command"
    ref: "node --test tests/unit/studio-node-presets.test.mjs tests/unit/studio-mod-matrix.test.mjs"
  - id: "hash-epoch"
    criterion: "Unison and spread, filter slope 12/24, sync on LFO, Step and Random, Step quantize and a generic bypass land in one STUDIO_HASH_VERSION bump with a migration; every re-pinned template is listed; a document saved under the earlier version reloads stating \"saved under hash v1, migrated\" with its original hash in provenance"
    evidence: "command"
    ref: "node --test tests/unit/studio-hash-epoch.test.mjs"
  - id: "sequencer-audible"
    criterion: "A tempo change changes the offline render length of the default V2 sequence, stored ms sequences render unchanged, and V2 playback is counted by the engine with a node census of 0 after stop"
    evidence: "command"
    ref: "node --test tests/unit/sequencer-editor.test.mjs tests/unit/sequencer-model.test.mjs && node tests/browser/sequencer.cjs"
  - id: "sequencer-editing"
    criterion: "The V2 sequencer has Space play/stop (ADR 0050), undo and redo that restore the exact serialized model, copy and paste of blocks, and numeric BPM, ms/beats and note-name entry as block parameters, not a piano roll (ADR 0058)"
    evidence: "command"
    ref: "node --test tests/unit/sequencer-editor.test.mjs tests/unit/sequencer-chrome.test.mjs"
  - id: "studio-clock"
    criterion: "A Clock node emits TRIGGER at 1/1 to 1/32 of transport.tempo, Step quantizes to it with a trigger out, and trigger event clips drive Step, Random and Envelope, scheduled on the audio clock"
    evidence: "command"
    ref: "node --test tests/unit/studio-clock.test.mjs"
  - id: "step-editing"
    criterion: "The Studio Step node's values are edited as bars in an Inspector card: the keyboard reaches and changes every step, and a drag across several bars is one NODE_PARAM_SET history entry"
    evidence: "command"
    ref: "node --test tests/unit/studio-step-bars.test.mjs"
  - id: "live-analysis-views"
    criterion: "Scope, Spectrum, Spectrogram, Meter and RTA nodes paint live from their reader in an Inspector card and on the node card, in one rAF loop over visible nodes only, and say \"No signal\" or \"Live only\" where that is the truth"
    evidence: "command"
    ref: "node --test tests/unit/studio-live-views.test.mjs"
  - id: "workspaces-exchange"
    criterion: "Studio Import opens a V2 sequence or config file as pattern clips on one track; a track exports as a sequence from the StudioModel alone, so that after a save and reload the export deep-equals the imported reference sequence, or the test lists each field the model does not carry with the default the export writes, and no copy of the imported file is kept outside the model; Open in Studio, Send track to Sequencer and Export track as sequence carry the studioWhatWouldBeLost guard"
    evidence: "command"
    ref: "node --test tests/unit/v31-studio-sequence-file.test.mjs tests/unit/studio-sequencer-bridge.test.mjs && node tests/browser/v31-studio-links.cjs"
  - id: "held-notes-safe"
    criterion: "The on-screen and QWERTY keyboard play the V502 note voices, are armed per view, never take Space, keep a held note past the configured playback limit (ADR 0005) only while it is held, under the output ceiling, and release every note on blur, hide and Escape"
    evidence: "command"
    ref: "node --test tests/unit/keyboard-held-notes.test.mjs"
