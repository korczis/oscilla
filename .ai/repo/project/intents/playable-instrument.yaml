satisfaction:
  - id: "patching-gestures"
    criterion: "Replace on an occupied input, dragging a cable end to re-route it or onto empty canvas to delete it, delete-and-bridge, tidy and edge mute are each one history entry, and every connection they make goes through canConnect; a refused gesture leaves model, history and runtime unchanged and shows the validator's sentence; a wheel or two-finger scroll pans the view and Ctrl/Cmd + wheel zooms it at the pointer, as view state outside history; the shortcut list is generated from STUDIO_SHORTCUTS"
    evidence: "command"
    ref: "node --test tests/unit/studio-graph-wheel.test.mjs tests/unit/studio-graph-rewire.test.mjs tests/unit/studio-graph-keys.test.mjs tests/unit/studio-graph-commands.test.mjs"
  - id: "editor-headroom"
    criterion: "src/js/ui/studio/graph-editor.js and src/js/studio/adapters/nodes.js, and each file split from them, have at least 10 000 B of room under their caps in tests/unit/source-size-baseline.json, read from the files by a headroom test, with every template studioHash unchanged"
    evidence: "command"
    ref: "node --test tests/unit/studio-adapters-headroom.test.mjs tests/unit/studio-graph-editor-headroom.test.mjs"
  - id: "voice-nodes"
    criterion: "An audio-rate LFO (clamped at 0.95 x Nyquist and stated), the Drive and Macro nodes, lowshelf, highshelf and allpass filters and brown noise render offline with their stated figures (an LFO at 440 Hz on a linear frequency edge, the mapping the Playground FM voice uses, gives lines at fc +- n x 440 Hz whose first sideband matches J1/J0 of the stated modulation index within 1 dB; shelf gain within 0.5 dB, with Q stated as unused on a shelf; allpass flat within 0.1 dB; brown noise -6 dB/octave within 1.5 dB), peak at or below the output ceiling, leave a node census of 0 after stop and change no pinned studioHash"
    evidence: "command"
    ref: "node --test tests/unit/k010-k013-studio-voice-nodes.test.mjs"
  - id: "template-pack"
    criterion: "The filter-envelope synth, FM bell, ring-mod, drive lead, macro pad and step-modulator bass templates each validate, carry a pinned studioHash, render non-silent offline with peak at or below the cap, and open through the Templates dialog and #m=studio&st=<id>"
    evidence: "command"
    ref: "node --test tests/unit/studio-template-pack.test.mjs"
  - id: "front-panel"
    criterion: "Node presets apply parameters only and keep edges; the mod matrix lists the CONTROL edges, edits them through EDGE_UPDATE and shows canConnect's sentence when a route is refused; both are projections of the StudioModel built from Pro components"
    evidence: "command"
    ref: "node --test tests/unit/studio-node-presets.test.mjs tests/unit/studio-mod-matrix.test.mjs"
  - id: "hash-epoch"
    criterion: "Unison and spread, filter slope 12/24, sync on LFO, Step and Random, Step quantize and a generic bypass land in one STUDIO_HASH_VERSION bump with a migration; every re-pinned template is listed; a document saved under the earlier version reloads stating \"saved under hash v1, migrated\" with its original hash in provenance"
    evidence: "command"
    ref: "node --test tests/unit/studio-hash-epoch.test.mjs"
  - id: "sequencer-audible"
    criterion: "A tempo change changes the offline render length of the default V2 sequence, stored ms sequences render unchanged, and V2 playback is counted by the engine with a node census of 0 after stop"
    evidence: "command"
    ref: "node --test tests/unit/sequencer-editor.test.mjs tests/unit/sequencer-model.test.mjs && node tests/browser/sequencer.cjs"
  - id: "sequencer-editing"
    criterion: "The V2 sequencer has Space play/stop (ADR 0050), undo and redo that restore the exact serialized model, copy and paste of blocks, and numeric BPM, ms/beats and note-name entry as block parameters, not a piano roll (ADR 0058)"
    evidence: "command"
    ref: "node --test tests/unit/sequencer-editor.test.mjs tests/unit/sequencer-chrome.test.mjs"
  - id: "studio-clock"
    criterion: "A Clock node emits TRIGGER at 1/1 to 1/32 of transport.tempo, Step quantizes to it with a trigger out, and trigger event clips drive Step, Random and Envelope, scheduled on the audio clock"
    evidence: "command"
    ref: "node --test tests/unit/studio-clock.test.mjs"
  - id: "step-editing"
    criterion: "The Studio Step node's values are edited as bars in an Inspector card: the keyboard reaches and changes every step, and a drag across several bars is one NODE_PARAM_SET history entry"
    evidence: "command"
    ref: "node --test tests/unit/studio-step-bars.test.mjs"
  - id: "live-analysis-views"
    criterion: "Scope, Spectrum, Spectrogram, Meter and RTA nodes paint live from their reader in an Inspector card and on the node card, in one rAF loop over visible nodes only, and say \"No signal\" or \"Live only\" where that is the truth"
    evidence: "command"
    ref: "node --test tests/unit/studio-live-views.test.mjs"
  - id: "workspaces-exchange"
    criterion: "Studio Import opens a V2 sequence or config file as pattern clips on one track; a track exports as a sequence from the StudioModel alone, so that after a save and reload the export deep-equals the imported reference sequence, or the test lists each field the model does not carry with the default the export writes, and no copy of the imported file is kept outside the model; Open in Studio, Send track to Sequencer and Export track as sequence carry the studioWhatWouldBeLost guard"
    evidence: "command"
    ref: "node --test tests/unit/v31-studio-sequence-file.test.mjs tests/unit/studio-sequencer-bridge.test.mjs && node tests/browser/v31-studio-links.cjs"
  - id: "held-notes-safe"
    criterion: "The on-screen and QWERTY keyboard play the V502 note voices, are armed per view, never take Space, keep a held note past the configured playback limit (ADR 0005) only while it is held, under the output ceiling, and release every note on blur, hide and Escape"
    evidence: "command"
    ref: "node --test tests/unit/keyboard-held-notes.test.mjs"
  - id: "chart-palette"
    criterion: "Every role set of src/js/charts/palette.js's registry is validated in both themes: marks at least 3:1 and text at least 4.5:1 on the plot surfaces, faded marks at their drawn alpha included, and a mark exempted as inactive (WCAG 1.4.11) or kept by owner decision Q009 listed by name; adjacent categorical colours at least CIEDE2000 8 apart after the Machado 2009 simulation, in linear RGB at severity 1.0, for deuteranopia, protanopia and tritanopia (6-8 only for a set declared direct-labelled); each theme's spectrogram LUT strictly monotonic in CIE L*; each legend swatch and its mark share one source; and no hex literal remains in src/js/charts, src/js/visualization, src/js/ui/p5-views.js, src/js/ui/studio, src/js/labs, src/js/sequencer or src/js/measurement/views"
    evidence: "command"
    ref: "node --test tests/unit/chart-palette.test.mjs"
  - id: "chart-interaction"
    criterion: "Every chart host in tests/unit/chart-host-census.json is done and none is pending, where the census is checked against a static scan of every chart mount call site in src/js and a runtime inventory of every workspace, Studio template and p5 view, and a host that is not a data chart is exempt only with a stated reason: a plot, bar or row host has a crosshair and a readout stating unit, resolution and aggregation, on a live host rewritten at most 4 times a second under a still pointer with a live or held marker; a keyboard cursor (arrows, PageUp and PageDown, Home and End) on a role=application plot surface that NVDA and JAWS pass keys to, announced once through one polite live region after the keys settle; Escape clears it and still reaches the page's stop and the MEASURE abort, and Space keeps its workspace meaning; the host is role=group, never role=img, with an aria-describedby summary and a snapshot data table of at most 512 rows that states any aggregation; on touch a tap pins the cursor; a tooltip that stays inside its host and is re-hit-tested on scroll and resize; zoom, where a chart has it, has keyboard (+, -, 0, Shift + arrows) and button paths, zooms by wheel only with Ctrl or Cmd or a pinch, is clamped to the data and shows no detail below bin or grid resolution; a meter host states its value as aria-valuetext, a scatter host its summary and table, a timeline host announces its selection, and a thumbnail is an aria-hidden preview of a done host"
    evidence: "command"
    ref: "node scripts/chart-census.mjs --require-complete && node --test tests/unit/chart-interaction.test.mjs tests/unit/charts-zoom-math.test.mjs tests/unit/chart-host-census.test.mjs && node tests/browser/charts-interaction.cjs"
  - id: "chart-states-honest"
    criterion: "A blank chart names its reason (audio not started, no signal, paused, frozen, history cleared by a scale, span or range change, model); levels say dB relative (dBFS-like) unless a valid LevelCalibration applies; smoothing, averaging, ballistics and estimates are stated, and a meter marks as a lower bound only what accumulates across reads with gaps; no data value is tweened; and the wording table of every census host refuses dB SPL without calibration, audible, inaudible, true peak, VU and LUFS, a string quoted from a cited source being a sourced entry that names its reference"
    evidence: "command"
    ref: "node scripts/chart-census.mjs --require-complete && node --test tests/unit/charts-readout-wording.test.mjs tests/unit/chart-interaction.test.mjs"
  - id: "chart-cost"
    criterion: "Every continuous per-frame loop (chart draws, the p5 visualizer and the Studio transport tick) is a subscriber of src/js/charts/frame-loop.js, so at most one rAF chain is armed at any time, also while the Studio transport plays (one-shot rAFs that coalesce an edit are listed by name and are not loops); Pause animation stops every non-essential subscriber and never a transport clock or playhead; a tick allocates nothing in the frame loop and at most 60 KB in all while a tone plays (Chromium heap sampling); the p5 visualizer keeps its 30 fps idle and 60 fps playing cap at any display rate; a chart whose host is hidden (display none or an inactive tab) reads no analyser and draws nothing, the live RTA included; the scope, phase and Lissajous views make no p5 vertex call; under prefers-reduced-motion decorative motion stops and the phase model is static; no chart creates an audio node"
    evidence: "command"
    ref: "node --test tests/unit/frame-loop.test.mjs tests/unit/motion-policy.test.mjs && node tests/browser/chart-cost.cjs --require-complete"
  - id: "chart-light-designed"
    criterion: "Every chart host in the census has a host-clipped reference in light and in dark for darwin-arm64 and linux-x64, captured from a frozen scene within its measured variance, beside the full-page references of F011; the light mark colours sampled from full-coverage pixels equal frozen expected values within CIEDE2000 1, so a role that drifts in its palette source fails; and the owner's acceptance of the light per-host references is bound to the owner's act: tests/visual/charts/accepted-light.json lists every current light reference with its hash and names a completed M063 question (Q017, or the question a later change opened to re-accept) whose owner_decision evidence quotes the same digest"
    evidence: "command"
    ref: "node --test tests/unit/chart-light-references.test.mjs && node scripts/visual-charts.mjs && node scripts/visual-charts.mjs --check-accepted"
