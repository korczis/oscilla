id: engineering-integrity
title: "OSCILLA's code base stays decomposable and checked as it grows: orchestration files shrink under a budget, imports have no cycle, no control is inert, and the plan is strict YAML"
statement: "The owner asked for no hard-coding, mockups or placeholders, for every part to be connected, interactive and covered by tests, and for orchestration entropy to come down (ChatGPT project conversation 6ac1beb8, 2026-10-04T03:01:41Z). OSCILLA keeps its single file and its frameworks as they are and makes its structure measurable: every source file under src/js and src/index.html stays under a recorded size cap that only falls; the MEASURE workspace adapter, the Studio workspace and the Studio inspector are split by responsibility into modules under that cap with no behaviour change; src/index.html is assembled from partials into a byte-identical dist; the ES-module graph of src/js is acyclic; the owner's ban on placeholders, mockup data and inert controls is a project rule whose enforcement is mutation-proven; every automatable Studio parameter's transform is checked by one table; CI reports the size change of every pull request and keeps a ledger of checks that passed only on retry; the cost of the .ai layer and of p5 is measured for the owner; and a screen-reader pass of the main flows is recorded."
invariants:
  - "No refactor of this intent changes behaviour: the browser suites and the visual gate pass unchanged before and after it (project.single-file-deliverable)"
  - "No framework, state manager or graph library is introduced (ADR 0015, ADR 0034)"
  - "A size cap only falls; raising one is a change the pull request states and a reviewer accepts, never a silent edit"
  - "A rule is written with its enforcement in the same change (project.rules-name-their-enforcement)"
  - "Measuring the cost of p5 or of the .ai layer decides nothing: the owner decides (ADR 0013)"
  - "Every tracked YAML file of the project model stays strict YAML named by its identity (tests/unit/plan-yaml-strict.test.mjs, landed 2026-10-18)"
milestones:
  - "M046"
satisfaction:
  - id: "source-size-budget"
    criterion: "No file under src/js and not src/index.html exceeds its recorded byte cap, a file over 40 000 bytes without a cap fails, and a cap more than 5 % above its file's size fails until it is lowered"
    evidence: "command"
    ref: "node --test tests/unit/source-size-budget.test.mjs"
  - id: "measure-adapter-split"
    criterion: "src/js/ui/measure.js is split by responsibility into modules each under 40 000 bytes, with npm run test:measure and the MEASURE visual references passing unchanged"
    evidence: "command"
    ref: "npm run test:measure"
  - id: "studio-workspace-split"
    criterion: "src/js/ui/studio/workspace.js is split by responsibility into modules each under 40 000 bytes, with npm run test:studio and the Studio visual references passing unchanged"
    evidence: "command"
    ref: "npm run test:studio"
  - id: "studio-inspector-split"
    criterion: "src/js/ui/studio/inspector.js is split by responsibility into modules each under 40 000 bytes, with npm run test:studio and the Studio visual references passing unchanged"
    evidence: "command"
    ref: "npm run test:studio"
  - id: "shell-partials"
    criterion: "src/index.html is assembled at build time from partials and the built dist/index.html is byte-identical to the build before the split"
    evidence: "command"
    ref: "npm run build:check"
  - id: "acyclic-imports"
    criterion: "The static ES-module import graph of src/js has no cycle"
    evidence: "command"
    ref: "node --test tests/unit/src-imports-acyclic.test.mjs"
  - id: "no-inert-surfaces"
    criterion: "A project rule in force bans placeholder copy, mockup data shown as data and controls without an effect or a stated reason, and each of its checks has a mutation test"
    evidence: "command"
    ref: "node --test tests/unit/no-inert-surfaces.test.mjs"
  - id: "automation-transforms"
    criterion: "One table-driven test covers the transform, unit, scale and limits of every automatable Studio parameter the registry declares"
    evidence: "command"
    ref: "node --test tests/unit/studio-automation-transforms.test.mjs"
  - id: "size-delta-reported"
    criterion: "Every pull request's CI run prints the raw and gzip size of dist/index.html, the budget headroom and the change from its merge base"
    evidence: "command"
    ref: "node --test tests/unit/size-report.test.mjs"
  - id: "flake-ledger"
    criterion: "A CI check that failed and then passed on a retry is recorded with the check, the browser and the cause class, so a rerun never erases a failure"
    evidence: "command"
    ref: "node --test tests/unit/flake-ledger.test.mjs"
  - id: "layer-cost-measured"
    criterion: "The .ai layer's share of tracked files and of the commits since the last release is computed by a script CI runs"
    evidence: "command"
    ref: "node --test tests/unit/ai-layer-cost.test.mjs"
  - id: "p5-cost-measured"
    criterion: "The size, visual parity and runtime cost of replacing p5 with a Canvas2D adapter for the primitives in use are measured and recorded for the owner"
    evidence: "command"
    ref: "majordomus plan show E012"
  - id: "screen-reader-pass"
    criterion: "A screen-reader pass over the main flows (VoiceOver with Safari on macOS) is recorded with its findings"
    evidence: "command"
    ref: "majordomus plan show E013"
governance:
  - "rule:project.single-file-deliverable"
  - "rule:project.rules-name-their-enforcement"
  - "rule:project.visual-identity-lock"
  - "rule:project.studio-model-is-canonical"
  - "adr:adr-0013"
  - "adr:adr-0015"
  - "adr:adr-0034"
  - "file:docs/v4/completion-ledger.md"
non_goals:
  - "Replacing p5, or changing the size budget of scripts/build-config.mjs: decisions the owner deferred (ADR 0013, #114); this intent measures, it does not decide"
  - "Refactoring the frozen V1 instrument or the audio engine for their length (ADR 0014)"
  - "A test that a split improved anything beyond size and passing suites: the split is mechanical, and a design change is its own issue"
created_at: 2026-10-18
