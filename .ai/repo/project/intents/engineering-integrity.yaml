id: engineering-integrity
title: "OSCILLA's code base stays decomposable and checked as it grows: orchestration files shrink under a budget, imports have no cycle, no control is inert, and the plan is strict YAML"
statement: "The owner asked for no hard-coding, mockups or placeholders, for every part to be connected, interactive and covered by tests, and for orchestration entropy to come down (ChatGPT project conversation 6ac1beb8, 2026-10-04T03:01:41Z). OSCILLA keeps its single file and its frameworks as they are and makes its structure measurable: every source file under src/js, and src/index.html, stays under a recorded byte cap with a stated headroom (10 % over the file's size, rounded up to the next 1 000 bytes), and a cap only falls, which a check over the git history of the baseline enforces unless a raise is declared with its pull request and reason; the budget bounds how code is distributed between files, not its total, which the dist budget of scripts/build-config.mjs bounds; the MEASURE workspace adapter, the Studio workspace and the Studio inspector are split by responsibility into modules under 40 000 bytes with no behaviour change; src/index.html is assembled from partials into a byte-identical dist; the ES-module graph of src/js is acyclic; the owner's ban on placeholders, mockup data and inert controls is a project rule whose decidable checks are mutation-proven; every automatable Studio parameter's transform is checked by one table against independently computed values; CI reports the size change of every pull request and keeps a ledger of checks that passed only on a re-run; the cost of the .ai layer and of p5 is measured for the owner; and a screen-reader pass of the main flows is recorded by a person using one. The work starts after the V272 final review (#197, plan issue V431) has landed (merged as d4bd97f) and V431 is DONE, because that review grows the Studio files this intent caps and splits."
invariants:
  - "No refactor of this intent changes behaviour: the browser suites and the visual gate pass unchanged before and after it (project.single-file-deliverable)"
  - "No framework, state manager or graph library is introduced (ADR 0015, ADR 0034)"
  - "A size cap only falls: tests/unit/source-size-budget.test.mjs compares every cap with its value in the most recent earlier commit of the baseline, and a raise passes only when the baseline's raises ledger names the file, the new cap, the pull request and the reason, so a raise is stated in the diff a reviewer accepts and never a silent edit"
  - "A feature that must grow a capped file past its cap either splits the file first or declares the raise in the same pull request; it never edits a cap without a raises entry"
  - "A rule is written with its enforcement in the same change (project.rules-name-their-enforcement)"
  - "Measuring the cost of p5 or of the .ai layer decides nothing: the owner decides (ADR 0013)"
  - "Every tracked YAML file of the project model stays strict YAML named by its identity (tests/unit/plan-yaml-strict.test.mjs, landed 2026-10-18)"
milestones:
  - "M046"
  - "M056"
satisfaction:
  - id: "source-size-budget"
    criterion: "No file under src/js, nor src/index.html, exceeds its recorded byte cap; a file over 40 000 bytes without a cap fails; a cap above its file's headroom ceiling (the size plus 10 %, rounded up to the next 1 000 bytes) fails until it is lowered; a cap entry for a file of 40 000 bytes or less fails; and a cap above its value in the most recent earlier commit of the baseline (an uncapped file counting as capped at 40 000 bytes) fails unless the baseline's raises ledger declares it"
    evidence: "command"
    ref: "node --test tests/unit/source-size-budget.test.mjs"
  - id: "measure-adapter-split"
    criterion: "src/js/ui/measure.js is split by responsibility into modules each under 40 000 bytes, with npm run test:measure and the MEASURE visual references passing unchanged"
    evidence: "command"
    ref: "npm run test:measure"
  - id: "studio-workspace-split"
    criterion: "src/js/ui/studio/workspace.js is split by responsibility into modules each under 40 000 bytes, with npm run test:studio and the Studio visual references passing unchanged"
    evidence: "command"
    ref: "npm run test:studio"
  - id: "studio-inspector-split"
    criterion: "src/js/ui/studio/inspector.js is split by responsibility into modules each under 40 000 bytes, with npm run test:studio and the Studio visual references passing unchanged"
    evidence: "command"
    ref: "npm run test:studio"
  - id: "shell-partials"
    criterion: "src/index.html is assembled at build time from the partials under src/partials, every scanner reads the assembled shell through one shared reader, and the built dist/index.html is byte-identical to the build before the split"
    evidence: "command"
    ref: "node --test tests/unit/shell-partials.test.mjs"
  - id: "acyclic-imports"
    criterion: "The static ES-module import graph of src/js has no cycle"
    evidence: "command"
    ref: "node --test tests/unit/src-imports-acyclic.test.mjs"
  - id: "no-inert-surfaces"
    criterion: "A project rule in force bans placeholder copy, mockup data shown as data and controls without an effect or a stated reason; each check a mechanism can decide has a mutation test, its allowance only shrinks by the git history of the allowance, and the rule names what stays with the reviewer"
    evidence: "command"
    ref: "node --test tests/unit/no-inert-surfaces.test.mjs"
  - id: "automation-transforms"
    criterion: "One table-driven test covers the transform, unit, scale and limits of every automatable Studio parameter the registry declares, each row checked against values computed independently of the compiler"
    evidence: "command"
    ref: "node --test tests/unit/studio-automation-transforms.test.mjs"
  - id: "size-delta-reported"
    criterion: "Every pull request's CI run prints the raw and gzip size of dist/index.html, the budget headroom and the change from its merge base"
    evidence: "command"
    ref: "node --test tests/unit/size-report.test.mjs"
  - id: "flake-ledger"
    criterion: "A CI check that failed on one run attempt and passed on a re-run of the same commit is recorded with the check, the browser, both attempts and the cause class, so a re-run never erases a failure"
    evidence: "command"
    ref: "node --test tests/unit/flake-ledger.test.mjs"
  - id: "layer-cost-measured"
    criterion: "The .ai layer's share of tracked files and lines and of the commits since the last release is computed by a script CI runs"
    evidence: "command"
    ref: "node --test tests/unit/ai-layer-cost.test.mjs"
  - id: "p5-cost-measured"
    criterion: "The size, visual parity and runtime cost of replacing p5 with a Canvas2D adapter for the primitives in use are measured on a spike branch and recorded for the owner as a resolution note on ADR 0013"
    evidence: "command"
    ref: "grep -q 'what replacing p5 would cost' .ai/repo/adrs/0013-p5-unmodified-separable-block.md"
  - id: "screen-reader-pass"
    criterion: "A screen-reader pass over the main flows (VoiceOver with Safari on macOS), performed by a person using VoiceOver, is recorded with its findings"
    evidence: "command"
    ref: "majordomus plan list | grep -Eq '^E013 +DONE '"
  - id: "done-after-evidence"
    criterion: "An issue recorded done whose criteria require a review verdict or a validation carries evidence naming that verdict file and that validation, recorded no earlier than the verdict's first commit"
    evidence: "command"
    ref: "node --test tests/unit/plan-done-evidence.test.mjs"
  - id: "automation-edges-hold"
    criterion: "An overridden detune releases its share of the frequency headroom, and a released automated parameter holds its value before it glides to the static one"
    evidence: "command"
    ref: "node --test tests/unit/studio-automation-edges.test.mjs"
  - id: "measurement-level-refused-in-browser"
    criterion: "In a browser, a Studio measurement whose Master Output level is not the level the run plays at is refused with its reason and leaves the output to the Studio"
    evidence: "command"
    ref: "grep -q 'Master Output level' tests/browser/v31-studio-workflows.cjs"
  - id: "adr-index-complete"
    criterion: "The ADR index names every accepted ADR and marks each accepted one whose decision text still opens with 'Proposed'"
    evidence: "command"
    ref: "node --test tests/unit/adr-accepted-list.test.mjs"
  - id: "release-cli-consistent"
    criterion: "Every release script parses its flags with one parser, reads ADR front matter as YAML and leaves no test fixture behind"
    evidence: "command"
    ref: "node --test tests/unit/release-cli-args.test.mjs"
  - id: "docs-locate-the-code"
    criterion: "The V3 architecture and algorithms documents place the recipe code where it lives after the import-cycle split (src/js/experiments/recipe.js)"
    evidence: "command"
    ref: "grep -q 'experiments/recipe.js' docs/v3/architecture.md && grep -q 'experiments/recipe.js' docs/v3/algorithms.md"
  - id: "studio-import-limit-one"
    criterion: "The Studio import limit is one number measured one way, and a refused Studio setting says why beside its field"
    evidence: "command"
    ref: "node --test tests/unit/studio-import-limit.test.mjs"
  - id: "release-page-shows-tag"
    criterion: "After release:publish tags a release, Pages is redeployed so the release commit's live page names its tag"
    evidence: "command"
    ref: "node --test tests/unit/release-publish.test.mjs"
  - id: "pr-names-its-plan"
    criterion: "Every pull request names an existing plan record in its title or branch, or waives with a reason, has a conventional title and no closing keyword in its title, body or commits, judged by the base branch's program in a read-only job (owner decisions C1 and C3, 2026-10-29)"
    evidence: "command"
    ref: "node --test tests/unit/pr-metadata.test.mjs"
  - id: "release-notes-first-parent"
    criterion: "Release analysis and notes read first-parent history: the level comes from the pull request titles, a train takes its highest member's level, and the notes link (#N) and plan IDs and carry no merge subject"
    evidence: "command"
    ref: "node --test tests/unit/release-analyze.test.mjs tests/unit/release-publish.test.mjs"
  - id: "forge-projection-adopted"
    criterion: "GitHub's labels and milestones are written from the records by Majordomus' forge projection alone, through rendered workflows whose derive job reads only and whose project job alone holds a write token"
    evidence: "command"
    ref: "node --test tests/unit/ci-workflows.test.mjs"
  - id: "github-backfilled"
    criterion: "GitHub carries the milestones of the records and the metadata of the open and the merged pull requests since v3.0.0, each phase printed before it applies, and a second apply makes no write"
    evidence: "command"
    ref: "npm test"
  - id: "github-drift-reported"
    criterion: "GitHub departing from the records is reported by a scheduled, bounded check outside the gate that names each drifted object, and cadence issues carry release-overdue"
    evidence: "command"
    ref: "node --test tests/unit/ci-workflows.test.mjs"
governance:
  - "rule:project.single-file-deliverable"
  - "rule:project.rules-name-their-enforcement"
  - "rule:project.visual-identity-lock"
  - "rule:project.studio-model-is-canonical"
  - "rule:project.review-verdict"
  - "adr:adr-0013"
  - "adr:adr-0015"
  - "adr:adr-0034"
  - "adr:adr-0051"
  - "file:docs/v4/completion-ledger.md"
non_goals:
  - "Replacing p5, or changing the size budget of scripts/build-config.mjs: decisions the owner deferred (ADR 0013, #114); this intent measures, it does not decide"
  - "Refactoring the frozen V1 instrument or the audio engine for their length (ADR 0014)"
  - "A test that a split improved anything beyond size and passing suites: the split is mechanical, and a design change is its own issue"
  - "Splitting src/js/studio/transport.js (72 327 bytes on main at d4bd97f), src/js/measurement/engine.js (70 955) or src/js/measurement/quality.js (66 213) in this milestone: they stay under their falling cap with its headroom, and a split of any of them is a candidate criterion for the owner, not planned work"
  - "Bounding the total size of src/js: the per-file budget measures distribution; the total is bounded by the dist budget"
created_at: 2026-10-18
updated_at: 2026-10-29
