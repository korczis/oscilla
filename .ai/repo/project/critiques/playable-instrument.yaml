findings:
  - id: k010-log-edge-sidebands-false
    class: unproven_assumption
    subject: "K010"
    finding: "A log edge adds octaves to the carrier's detune in cents (src/js/studio/compiler.js, mapping log), which is exponential FM: the lines sit at the mean frequency fc x <2^(d sin)> +- n x fm, not at fc +- n x fm. At 48 kHz, fc 1000 Hz and fm 440 Hz the level at fc + 440 is -115 dB at 0.5 octave and -175 dB at 1 octave, so the stated figure either fails or holds only at a depth tuned small enough to hide the error (project.no-fake-science)."
    blocking: true
    resolution:
      state: planned
      issue: "K010"
      because: "K010 and the voice-nodes criterion now assert lines at fc +- n x 440 Hz on a linear edge (depth in Hz, as the Playground FM voice maps it) with the first sideband within 1 dB of J1/J0 of the stated index, and any log-edge figure states its depth and its mean-frequency centre (2026-10-29)."
  - id: k011-shelf-q-inert-and-missing-scope
    class: missed_requirement
    subject: "K011"
    finding: "Web Audio ignores Q on a shelf (usesQ, src/js/audio/filters.js), so a shelf leaves the Q control inert (project.no-inert-surfaces). The new types also reach gainIsUsed in src/js/studio/clip-targets.js (peaking only), the V431 gain test that loops over FILTER_TYPES, the Filter help text, the Filter Lab that shares FILTER_TYPES and the V1 config file that keeps its own list, none of which was in scope."
    blocking: false
    resolution:
      state: planned
      issue: "K011"
      because: "K011's scope names those files and its criteria require Q hidden or disabled with its reason on a shelf, a Q edge marked inactive, the help text corrected, and the Filter Lab and config file decision stated (2026-10-29)."
  - id: k004-round-trip-outside-the-model
    class: regression_risk
    subject: "K004"
    finding: "exportSequence(importSequence(x)) deep-equal to x can be met only by keeping the imported file's seed in workspace state outside the StudioModel, which a save and reload loses; that is a parallel copy (project.studio-model-is-canonical). The \"Export track as sequence\" control is new markup that would raise the ratchet before F001."
    blocking: false
    resolution:
      state: planned
      issue: "K004"
      because: "K004 now requires the round trip through serialize and parse of the model alone, or a listed set of fields the model does not carry with their defaults, and no state outside the model; the export control moves to K018 in Wave 2 as Pro markup (2026-10-29)."
  - id: d10-premise
    class: unproven_assumption
    subject: "V605"
    finding: "V605 depends on V604 only by a scope chain (M048), which narrows once E003 names its modules, not when the LFO is widened. The real link is the other way: V605's AM and FM configurations above 100 Hz cannot validate until K010 lands, so V605 should gain a dependency on K010."
    blocking: false
    resolution:
      state: planned
      issue: "K010"
      because: "D10 is restated in the intent, V605 depends on K010, and its V604 dependency and M048's E003 condition stay (2026-10-29)."
  - id: k007-describes-main-as-missing
    class: unnecessary_work
    subject: "K007"
    finding: "Ctrl + wheel already zooms at the pointer and touch pinch exists on main (graph-editor.js:570-577, 685-688, 915-922), and the minimap (V602) and timeline pinch (V603) are built although the feature record lists them as missing. A pinch test would pass on the base, and changing the plain wheel to pan removes mouse-wheel zoom without saying so."
    blocking: false
    resolution:
      state: planned
      issue: "K007"
      because: "K007 is limited to a panning wheel with Ctrl/Cmd + wheel zoom, states that mouse-wheel zoom moves to Ctrl/Cmd + wheel, keeps the existing pinch and buttons, and only corrects the stale minimap and timeline-pinch lines (2026-10-29)."
  - id: edge-mute-already-exists
