  - id: meta-layer-grows-to-measure-itself
    class: unproven_assumption
    subject: "M046"
    finding: "ADR 0051 records the owner's steering: 'the meta-layer must not grow for its own sake; Majordomus must pay rent'. M046 adds 13 claims to docs/CLAIMS.yaml, about a dozen unit tests, three new CI step summaries (size delta, flake ledger, layer cost) and a project rule, and none of them changes what a user can do. E011 measures the .ai layer's share while the milestone adds to it. Each item may be worth it, but the intent never weighs the cost against ADR 0051. E001, E002 and E006 pay rent directly. E009-E011 should say what decision their number feeds, or be cut."
    blocking: false
    resolution:
      state: planned
      issue: "E011"
      because: "E009, E010 and E011 each name the decision their number feeds (size acceptance and the owner's budget and p5 decisions; fix-or-infrastructure for a flaky check; the owner's ADR 0051 decision on the layer), and the per-issue claim edits move into one closing issue, E015 (2026-10-18)."
  - id: split-criteria-undecidable
    class: delivery_verification
    subject: "E002"
    finding: "'The built dist/index.html changes only by the module boundaries' cannot be decided. esbuild's scope hoisting renames and reorders identifiers when modules move, and npm run build:check only proves that the committed dist matches a rebuild, not what kind of difference it has. 'No change to any expected value' also clashes with the 23 unit tests that read ui/measure.js, ui/studio/workspace.js or ui/studio/inspector.js by path (grep -l over tests/unit): they must change to follow the code. The criterion should say what may change (test paths, source-scanning fixtures) and what may not (expected values, snapshots, visual references, the browser suites' assertions)."
    blocking: false
    resolution:
      state: planned
      issue: "E002"
      because: "E002, E003 and E004 now say what may change (test paths, source-scanning fixtures, dist module order and identifier names) and what may not (expected values, snapshots, visual references, browser-suite assertions), and drop 'changes only by the module boundaries' (2026-10-18)."
  - id: shell-partials-readers
    class: regression_risk
    subject: "E005"
    finding: "About 20 tests and scripts read src/index.html directly: no-fake-science, about, css-producers, navigation, vocabulary, v3-ui, v4-shortcuts, v31-studio-self-knowledge, raw-retention, release-provenance and others under tests/unit, plus scripts/build-config.mjs, visual-compare.mjs, social-assets.mjs and pack-single-file.mjs. E005 asks that they 'read the assembled shell (or every partial)'. A scan that reads one partial silently misses the rest: no-fake-science would then pass on copy it never saw. The criterion should require one shared reader that every scanner uses, plus a test that fails when a scanner reads src/index.html directly. #197's follow-ups ask the owner whether src/index.html should become a guarded path. Splitting it first changes which file that question is about."
    blocking: false
    resolution:
      state: planned
      issue: "E005"
      because: "E005 names src/partials, requires one shared reader of the assembled shell and tests/unit/shell-partials.test.mjs, which fails when a scanner reads src/index.html directly, and moves a guard on src/index.html to src/partials if the owner has added one (2026-10-18)."
  - id: screen-reader-pass-sequencing
