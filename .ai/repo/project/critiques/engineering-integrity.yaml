findings:
  - id: baseline-at-current-size-freezes-seventeen-files
    class: regression_risk
    subject: "E001"
    finding: "Most serious, and blocking. E001 sets every first cap to the file's current size, and 17 files under src/js are above 40 000 bytes today (measured at 0761335: ui/measure.js 115 572, measurement/engine.js 70 955, ui/studio/workspace.js 75 076, ui/studio/inspector.js 69 711, measurement/quality.js 66 213, experiments/validate.js 57 642, core/instrument.js 55 166, studio/transport.js 54 555, studio/runtime.js 51 585, measurement/capture.js 49 858, experiments/schema.js 47 908, ui/experiments.js 47 732, ui/studio/graph-editor.js 47 145, ui/studio/timeline-editor.js 46 304, audio/audio-engine.js 45 543, studio/actions.js 44 295, studio/validate.js 41 076), plus src/index.html at 255 020. A cap equal to the size leaves zero headroom: one added byte in any of them fails npm test. The open V272 pull request #197 (origin/docs/v272-final-review, 71 commits ahead of main) grows eight of them: studio/transport.js by 17 217 bytes (to 71 772), inspector.js by 3 473, workspace.js by 3 048, studio/validate.js by 2 757, graph-editor.js by 1 282, timeline-editor.js by 1 234, actions.js by 970 and studio/runtime.js by 185, and it grows src/index.html by 362. If E001 lands first, #197 cannot merge without raising nine caps, which the invariant forbids except as a stated, reviewed exception. If #197 lands first, the baseline is simply taken later. M047 and M048 then hit the same wall: V393 adds a measurement kind to measurement/engine.js, V396 adds reasons to measurement/quality.js, and V601 changes studio/actions.js and studio/validate.js. None of those files has a split planned. Before E001 starts, the plan must say (a) that E001 waits for #197, and (b) what a feature does when it must touch a capped file that is not being split: a headroom margin on first capture, a planned split, or an accepted raise. Otherwise the budget either blocks the measurement wedge or teaches every pull request to raise caps."
    blocking: true
    resolution:
      state: planned
      issue: "E001"
      because: "E001 now depends on V431, so its baseline is taken on a main that contains #197; each first cap is the file's size plus 10 %, rounded up to the next 1 000 bytes (the size is re-measured at the start commit; 18 files under src/js are above 40 000 bytes at #197's head 55ae40d); and the intent, its invariants and M046's risks say what a feature does past the headroom: split the file first or declare the raise in the baseline's raises ledger with its pull request and reason (2026-10-18)."
  - id: only-falls-is-unenforced
    class: insufficient_work
    subject: "engineering-integrity#source-size-budget"
    finding: "Blocking. The invariant says a cap only falls, yet none of E001's four mutations (file past its cap, new large file without a cap, stale cap, cap more than 5 % above size) catches a raised cap. A pull request that edits the baseline upward and grows the file passes the test. The model the issue names already solves this: tests/unit/browser-timing.test.mjs:444 ('the recorded debt only shrinks: no count is above its value in an earlier commit') reads git history. E001 needs the same history check, or the criterion must say that 'only falls' is review-only. Two edge cases are also undecided. (1) A file that grows past 40 000 bytes for the first time needs a new cap, which is in effect a raise from 'uncapped'. (2) After E002-E004 a split file drops below 40 000 bytes. Does it keep a cap at its new size, which holds it tighter than an uncapped sibling at 39 999 bytes, or does its cap go away? The 5 % rule decides neither. A per-file cap also bounds no total: moving code into new files under 40 000 bytes always passes, so the budget measures how code is distributed, not how much there is. The statement should say that."
    blocking: true
    resolution:
      state: planned
      issue: "E001"
      because: "The source-size-budget criterion and E001 now require a history check on the model of browser-timing.test.mjs: a cap above its value in the most recent earlier commit of the baseline fails unless the raises ledger declares it; an uncapped file counts as capped at 40 000 bytes, so passing 40 000 for the first time is a declared raise; an entry for a file of 40 000 bytes or less fails, so a split file loses its cap; and the statement and a non-goal say the budget bounds distribution, not the total (2026-10-18)."
  - id: studio-splits-collide-with-v272
    class: regression_risk
    subject: "E003"
    finding: "E003 and E004 split ui/studio/workspace.js and ui/studio/inspector.js. Those are two of the files #197 (the V272 final review, open since 2026-10-18) changes most in the UI: B10, C2, C3 and C8 in the inspector, I2 in the workspace, and 26 src/js files changed in total (git diff --stat main...origin/docs/v272-final-review). A mechanical split of either file while #197 is open turns every V272 fix into a cross-file conflict. A rebase of the split, or of #197, then re-touches guarded src/js/studio content and invalidates the recorded review verdict. Neither issue depends on anything but E001. Both should wait for #197 to merge, and the objective sizes (75 076 and 69 711) should be re-measured then (78 124 and 73 184 on the review branch)."
    blocking: false
    resolution:
      state: planned
      issue: "E003"
      because: "E003 and E004 depend on E001, which depends on V431 (#197), and their objectives cite the sizes on main at 044f98a and at #197's head 55ae40d (78 124 and 73 184 bytes) with re-measurement at the start commit; E004 follows E003 (2026-10-18)."
  - id: measure-split-escapes-the-guard
    class: regression_risk
    subject: "E002"
    finding: "After #197, scripts/review-verdict.mjs guards 'src/js/ui/measure.js' as a single file (line 67 on origin/docs/v272-final-review, finding D5). E002 moves most of that file into new modules. If they go under src/js/ui/ or src/js/ui/measure/, the code that decides what MEASURE runs and saves stops being a guarded path, and later changes to it merge without a verdict. E002 must extend GUARDED to the new modules in the same change. Because the base branch's list judges a pull request, this split needs a verdict anyway. Likewise E005 changes scripts/build.mjs, which matches 'scripts/build*' (line 72 there), so it needs a verdict as well. Neither issue says so, while E006, E009 and E010 do."
    blocking: false
    resolution:
      state: planned
      issue: "E002"
      because: "E002 extends the guard of scripts/review-verdict.mjs to every module split from src/js/ui/measure.js in the same change and needs a verdict; E005 says scripts/build.mjs matches the guarded scripts/build* and needs a verdict (2026-10-18)."
  - id: placeholder-scan-false-positives
    class: unproven_assumption
    subject: "E007"
    finding: "E007's checks (a) to (d) cannot be enforced on today's tree without false positives, and (c) and (d) also produce false negatives. (a) Several legitimate strings match. 'todo' is a flow-step status in src/index.html:1382-1387 and src/js/measurement/views/measure-flow.js:12. ?mock=1 is a deliberate layout-comparison mode (src/js/ui/app.js:62-65, src/styles/base.css:140-145): the very 'mockup' the owner wanted kept to geometry, so the rule must allow it explicitly. The copy 'not implemented by this build' (src/js/experiments/evidence.js:435) is honest status text that the rule should keep, not ban. (c) 111 of the 341 button, input, select and textarea elements in src/index.html have no Alpine binding (@, x-on, x-model). They are bound imperatively by id or data-osc from src/js, so a static check of index.html flags all of them unless it resolves those JS bindings, which is a parser project of its own. The Studio inspector's controls are built in JS and are not in index.html at all, so (c) never sees them. (d) 'A value shown as data that comes from a literal' cannot be decided statically: cited constants such as the nominal 20 Hz-20 kHz convention (src/js/data/bioacoustics.js:44) are literals on purpose. The issue should narrow each check to one that can be decided (for example: data-osc controls with no handler registered at runtime, checked in the browser suite), name what stays with the reviewer, and enforce 'the allowance only shrinks' by history, as in only-falls-is-unenforced. Fixing the violations found in 'src' is a behaviour change. It needs its own visual-reference acceptance and does not fall under the intent's no-behaviour-change invariant."
    blocking: false
    resolution:
      state: planned
      issue: "E007"
      because: "E007 now names allowances for 'todo', ?mock=1, 'not implemented by this build' and the placeholder attribute; replaces the static control check with a runtime browser check of data-osc controls without a handler; leaves literal-as-data to the reviewer; makes the allowance only shrink by its git history; and moves every fix of a listed violation out of the issue as a behaviour change with its own visual acceptance (2026-10-18)."
  - id: automation-table-oracle-and-v272
    class: unproven_assumption
    subject: "E008"
    finding: "'A row's transform differs from the compiler's' can be tested only with an oracle that does not come from the compiler. A table generated from the compiler, or written by running it, is a tautology. Each row must carry an expected value computed independently, for example an analytic cents-to-Hz or dB-to-gain value at two or three points. The transforms are also moving on #197. A7 adds detuneCeiling and limitedLanes, which bound detune lanes by frequency headroom. B7 makes exponential lanes plus linear offsets schedule through a ConstantSource on strictly positive parameters. B3, B4 and B6 change lane gliding and re-offsetting. A table written against main encodes the pre-fix behaviour of #78 (eeed4b6), so E008 must wait for #197 and cite A7 and B7."
    blocking: false
    resolution:
      state: planned
      issue: "E008"
      because: "E008 depends on V431, cites A7, R-1 and B7 of #197 with their tests, and requires each row's expected value to be computed independently of the compiler at two or more analytic points, including a detune lane over a clamped static detune (2026-10-18)."
  - id: flake-ledger-has-no-retry-to-record
    class: unproven_assumption
    subject: "E010"
    finding: "No browser suite or check is retried today. .github/workflows/ci.yml retries only apt and the browser download (lines 20 and 322-339), and tests/browser/lib/suite.cjs has no retry. The only way a check can 'fail and then pass on a retry' is a person re-running the job, which GitHub records as github.run_attempt > 1. A ledger written by attempt 2 would need the GitHub API (actions: read) to learn what attempt 1 failed, and the scope (tests/browser/lib, ci.yml) does not say that. The alternative, adding a retry to the harness, is the very mechanism that hides failures. It would change project.suite-harness behaviour and needs its own decision. The issue should choose: record re-run attempts from the API, or introduce a bounded in-harness retry that always fails the job and only labels the flake."
    blocking: false
    resolution:
      state: planned
      issue: "E010"
      because: "E010 chooses re-run attempts read from the GitHub API (github.run_attempt above 1, actions: read, bounded under project.ci-bounded), adds no retry to the harness, and is proven on fixture API responses (2026-10-18)."
