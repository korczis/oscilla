  - id: evidence-never-recorded
    class: delivery_verification
    subject: "M046"
    finding: "None of the 13 criteria can read as met. Eleven are node --test or npm commands that Majordomus 0.29 cannot record (intent explain: 'evidence of a kind the ledger cannot derive'; V272 D3). The other two, p5-cost-measured and screen-reader-pass, use 'majordomus plan show E012/E013', which exits 0 whatever the issue says. Several commands also pass on the unchanged tree today: npm run test:measure, npm run test:studio and npm run build:check pass before any split, so as evidence they decide nothing about the split. The remedy for the first is the post-alpha Majordomus request for recording foreign runners. For the second, each criterion should name a check that fails before the issue lands, as E006 does."
    blocking: false
    resolution:
      state: open
      because: "Partly addressed 2026-10-18: p5-cost-measured and screen-reader-pass now cite checks that fail before the work (a grep of ADR 0013, plan list DONE), shell-partials cites a new test, and E015 swaps eleven criteria to claims once they land; the split criteria still cite suites that pass before a split, and Majordomus 0.29 still cannot record command evidence."
