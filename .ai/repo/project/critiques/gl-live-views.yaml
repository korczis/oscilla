intent: gl-live-views
reviewed_at: "f887066f3e869735cbb62cd4226459e9b6db498a"
reviewed_by: "claude-opus-5.5 (critic, oscilla-af63 session)"
findings:
  - id: cost-rule-cannot-rank-at-gate-timer-resolution
    class: unproven_assumption
    subject: "gl-live-views#gl-cost"
    finding: "Blocking. The rule of every Y issue's chart-cost criterion (Y002-Y006) is 'the GL path is the automatic choice only where its median [main-thread time] is not above the 2D path's', and Q050 (2a) adopts it. Y001's own figures show this measure cannot decide that question in the gate. (1) Y001 ran its bench crossOriginIsolated on purpose (spike/gl/bench.cjs:74-79 at d39c6cad: COOP/COEP 'so performance.now() is not coarsened to 100 us (Chromium) / 1 ms'). The gate's server is python3 -m http.server (tests/browser/lib/serve.cjs:48-49), which sends no COOP/COEP, and nothing under tests, scripts or src sets them, so chart-cost.cjs reads timers at 100 us in Chromium and coarser elsewhere. The medians it would compare are 0.01-0.04 ms (ADR 0016:170-177): both paths round to 0 or one tick, the comparison ties, and 'not above' sends every tie to GL. Even isolated, the note says Firefox and WebKit medians of 0.02-0.04 ms are 'one or two ticks of the 0.02 ms timer, so a ranking at that size means little' (ADR 0016:189-190). (2) Main-thread time leaves out GPU and raster work. Where Y001 measured that work, the ranking reverses: synced raw-gl ring 1.295 ms against canvas2d 0.24 ms in Chromium headless, and 0.96 against 0.24 ms in Firefox (ADR 0016:170-180). (3) The legs that would produce the baseline are SwiftShader (linux and darwin Chromium headless), no GL at all (linux Firefox) or a shared Mac whose load the note calls inflating. So the criterion can pass while choosing GL on a tie and on software rasterisation, which is not 'where it measurably pays'. Before Y002 lands its choose.js and its GL cost rows, the plan must name a measure that can discriminate: a per-frame cost over many frames (for example the sum over a 300-frame window), an isolated test page or a stated minimum detectable difference above the timer resolution, the synced or rAF-interval figure beside the main-thread one, and the leg whose figures decide."
    blocking: true
    resolution:
      state: open
  - id: zero-allocation-is-not-observable-with-the-planned-check
    class: delivery_verification
    subject: "gl-live-views#gl-cost"
    finding: "Blocking. The invariant and the criterion say every GL view 'allocates nothing per tick', and Y002-Y006 prove it by 'Chromium CDP heap sampling over a polled window, the per-tick ceiling of tests/browser/chart-cost-baseline.json not raised'. K036 defines that ceiling page-wide, and its --require-complete accepts a ceiling of up to 60 KB per tick ('fails while any check is pending or the ceiling is above 60 KB', K036 acceptance). Y001 measured a browser baseline of 300-380 B per frame for every backend, raw WebGL included (ADR 0016:181-182), and p5's WEBGL ring at 25 169 B per frame (ADR 0016:174). So a GL view that allocates as much as p5 does would pass the planned check, and a view that allocates nothing cannot be told apart from the baseline. Y001 could attribute bytes to its backend only because each backend was a separate script file (bench.cjs: byScriptPerFrame, 'excl. bench page'). In dist every module is inlined into one script, so the gate cannot attribute bytes that way. The check needs a differential figure: the same page and window with the view on GL, on ?gl=0 and unmounted, with the GL view's increment at or below a stated small bound. Or it needs a test page that loads the gl modules as separate scripts so samples can be attributed."
    blocking: true
    resolution:
      state: open
  - id: phosphor-brightness-is-not-samples-per-pixel
    class: unproven_assumption
    subject: "Y005"
    finding: "Blocking under project.no-fake-science. Y005 draws the new samples 'as a line strip with additive blending into an accumulation framebuffer' and has the caption state 'Brightness: samples per pixel over the last tau'. A line strip adds one unit to every pixel each segment crosses, so a pixel accumulates segment crossings, weighted by segment length, and not samples. A tone near the top of the band at 48 kHz has only a few samples per cycle, so its segments span many pixels: the figure lights pixels that hold no sample, while a slow signal concentrates its samples in a few pixels. The cursor readout 'the density at that pixel as a count' has the same problem. On the RGBA8 path it cannot even be a count: the channel saturates at 255, and the 'one-step floor subtraction' makes the decay non-exponential. The test as written (a tone's 'density maximum within 1 px of the CPU reference line') would not detect any of this. Either draw POINTS, one per sample (then the caption is true and the parity test can count), or caption the brightness as trace (beam) density and drop the count readout on the RGBA8 path."
    blocking: true
    resolution:
      state: open
  - id: caveat-flag-does-not-detect-software-gl
    class: unproven_assumption
    subject: "gl-live-views#backend-honest"
    finding: "The criterion and Y002 rest on failIfMajorPerformanceCaveat: 'a major performance caveat refused unless ?gl=sw', where 'sw' is 'for CI legs Y001 found on a software rasteriser only'. Y001 found the opposite. Chromium headless runs on SwiftShader on both OSes and still creates webgl2 and webgl with the flag set (webgl-in-the-gate-browsers.md:51; ADR 0016:125, 130, 136: 'ok / ok' both ways). The unmasked renderer string cannot stand in for the flag either, since WebKit reports the fixed 'Apple GPU' even on linux (record:62-65). So no gate leg ever reports the caveat: ?gl=sw is never needed, the refusal branch is testable only against the fake context of gl-caps.test.mjs, and every CI leg that draws GL does so as an unmarked 'WebGL 2'. The renderers() reason then says 'WebGL 2' on a software rasteriser, which is not 'states its backend and reason'. The plan should drop ?gl=sw or give it a measured purpose, and say how software GL is detected or stated (for example a SwiftShader or llvmpipe match on the renderer string where it is unmasked, reported as such). It should also say that the caveat branch is proven by the unit test only."
    blocking: false
    resolution:
      state: open
  - id: leg-table-is-from-the-image-not-the-runner
    class: delivery_verification
    subject: "gl-live-views#gl-parity"
    finding: "Every GL check 'states per gate browser and OS whether it drew on WebGL 2, WebGL 1 or was skipped, with the reason Y001 recorded for that leg'. Y001 probed linux in mcr.microsoft.com/playwright:v1.63.0-noble under amd64 emulation, not on the ubuntu-latest runner ci.yml uses, and the record says so: 'a GL check that first runs on the runner confirms the table or corrects this record' (webgl-in-the-gate-browsers.md:47-48). No issue makes the checks do that. A check that takes its expected skip from the record would hide a leg that stops drawing GL, and would claim a skip the runner did not need. Two further facts follow from the record. CI never proves GL parity on a hardware GPU: linux Chromium is SwiftShader, linux Firefox has no context, and linux WebKit's rasteriser is unidentified. darwin Chromium headless is also SwiftShader (ADR 0016:130), so hardware parity is shown only by the darwin Firefox and WebKit legs of a local release-gate. gl-parity.cjs should assert the observed backend of each leg against an expectation table and fail on a mismatch. It should also record the renderer string, so that the evidence names which parity ran on hardware. Y009's re-probe 'on the then-current CI images' comes after every GL check has landed, which is too late."
    blocking: false
    resolution:
      state: open
  - id: spectrogram-writes-several-columns-per-frame
    class: unproven_assumption
    subject: "Y003"
    finding: "Y003 says 'Per frame the newest column is uploaded with one texSubImage2D', and its cost rows hold 'draw calls per frame ... at the stated figure'. The spectrogram's time axis is wall time: 'columns advance with wall time (timeSpanS across the canvas width). When several columns are due in one frame ... the latest analyser snapshot is repeated' (src/js/analysis/spectrogram.js:18-20). push() writes n = floor(acc) columns, where perMs = width / (timeSpanS * 1000) (spectrogram.js:304-311), with timeSpanS 10 by default (:202). K033 keeps one level per device pixel. So a 1 000 CSS px card at DPR 2 (2 000 device columns) advances 200 columns per second, 3.3 per 60 Hz frame, and more after a dropped frame. A run of n columns that crosses the ring's end needs two uploads, and the WebGL 1 'preallocated column buffer' must hold n columns. Y001 benched exactly one column per frame (bench.cjs:3; raw-gl.js:86-87), which is not the shipped behaviour. Y003 should state the upload as n columns in at most two texSubImage2D calls, size the WebGL 1 buffer for the worst case it clamps to, and have gl-spectrogram.test.mjs cover a run that wraps. There is a related precision gap. The spike's shader samples the ring at fract(uv.x + h) in mediump (raw-gl.js:15-20). Where mediump is honoured (16-bit float, about 11 bits of precision near 1.0, as on many phone GPUs, the 390x844 target), that cannot address each column of a ring 2 000 or more columns wide, so NEAREST sampling lands one column off. Desktop GPUs and SwiftShader run mediump at highp, so the parity suite would not see it. Y003 should require highp for the coordinate, or integer texelFetch on WebGL 2."
    blocking: false
    resolution:
      state: open
  - id: y001-does-not-show-where-gl-pays-for-y003-to-y006
    class: unproven_assumption
    subject: "M096"
    finding: "The intent and M096 promise WebGL 'where it measurably pays'. Y001 benched two scenes only: a one-column ring coloured by an arithmetic ramp in the shader, not by the 256 x 1 LUT texture Y003 plans (raw-gl.js:15-20 at d39c6cad) and a single-pass cleared LINE_STRIP (raw-gl.js:101-120). For the ring scene, GL wins on main-thread time only in Firefox (0.02 against 0.22 ms). In Chromium it ties (0.02 against 0.025 ms), and in WebKit it wins by one timer tick (0.02 against 0.04 ms). Synced, it loses in Chromium and Firefox. It costs 1 236 B gzip against 473 B (ADR 0016:170-201). The cost that M096 names as the reason for Y003, the W x H recolour on a theme or range change, was never measured. Nor was any of the designs Y004-Y006 build: Y004's 256 x 128 height field (32 768 vertices with a vertex texture fetch each), Y005's three passes per frame (decay, additive accumulate into RGBA16F, present) at canvas size, and Y006's per-column histogram with decay. Y001 also did not probe EXT_float_blend, which additive blending needs if Y005 picks a 32-bit float target where only EXT_color_buffer_float exists, as in Firefox's WebGL 2 (ADR 0016:132-133). Each of Y003-Y006 should begin by measuring its own design against its 2D twin (under the measure the first finding asks for), and should stop at the Canvas 2D path if GL does not pay."
    blocking: false
    resolution:
      state: open
  - id: three-d-grid-decimates-the-history
    class: unproven_assumption
    subject: "Y004"
    finding: "Y004 samples the level texture at the vertices of a grid of 'at most 256 frequency rows by 128 time columns'. The K033 ring holds one level per device pixel (0.17-0.66 MB per instance, K033), so each 3D cell spans roughly 8-25 ring columns and 1-4 rows. The 2D row map takes the maximum over bins 'so a narrow tone is never diluted' (spectrogram.js:12-16). A vertex fetch at one texel can step over a one-row tone line, and a tone that drifts flickers as it crosses the sample points, so the 3D view would hide peaks the 2D view shows. A per-cell maximum, or at least a statement of the decimation, is needed. Two further points. (1) 'The top preset is an orthographic projection whose cells equal the 2D view's', and gl-parity compares them 'within 1 per channel at named cells'. That holds only if colour is fetched per fragment from the full texture, which the objective does not say; with per-vertex colour the top preset is a 256 x 128 mosaic. (2) Height is 'linear in dB over the stored range' (K033 stores -150 to +10 dB), while colour goes 'through the K027 LUT', whose window the user sets. After a range change, height and colour encode different mappings, yet the caption says 'Height and colour: level'. Height should follow the LUT window, or the caption should state both mappings."
    blocking: false
    resolution:
      state: open
  - id: context-pool-by-mount-order-and-unreleased-contexts
    class: regression_risk
    subject: "Y002"
    finding: "pool.js 'hands a context to the views in host order' up to a default budget of 4, and gives the rest Canvas 2D. The line mounts six GL hosts: three spectrograms, the XY view and two density layers. The spectrograms are created at start-up and stay mounted while hidden (main.js:346, labs/index.js:42, mic-analyzer.js:172; spectrogram-view.js:144 treats a hidden panel by offsetParent, not by unmounting). So hidden hosts keep their contexts, and the view the user actually opens can be the one that gets 'Canvas 2D: GL context budget in use'. The pool should hand contexts by visibility through K036's host flag, or release a hidden host's context. There is also a release problem. Y002's destroy() and the lazy capability probe do not say they call WEBGL_lose_context.loseContext(). Without it, a context lives until garbage collection, and each remount (the Settings switch of Y008, the ?gl toggles, route changes) adds a live context. Y001 measured that the 17th live context loses the oldest at once in Chromium and WebKit, and that WebKit logs it as a console error, which fails every zero-console-error check (ADR 0016:149-157). gl-renderers.cjs should count contexts across repeated mount, destroy and Settings cycles, not only with more views mounted than the budget."
    blocking: false
    resolution:
      state: open
  - id: gpu-held-accumulation-contradicts-invariant-one
    class: missed_requirement
    subject: "Y006"
    finding: "Invariant 1 says a GL view 'draws only data the analysis already holds on the CPU ... computes no new analysis and its loss loses no data', and the non-goals exclude 'a second ... analysis on the GPU: the GPU composes data the CPU holds'. Y006's GL path accumulates decaying per-column level counts on the GPU, while its Canvas 2D twin 'accumulates the same counts on the CPU'. That makes a new statistic computed on the GPU, and its readout ('38 % of the last 2.0 s at -32 dB rel') needs a readPixels on the GL path. A context loss then loses the counts, so the twin restarts from zero, and Y006 does not say what the readout shows then. Y005's persistence buffer is GPU-only in the same way. Accumulating the counts once on the CPU in a preallocated buffer, for both backends, and uploading them as a texture would keep the invariant. It would also make the readout backend-independent and the GL parity exact. Otherwise the intent must amend invariant 1 and the non-goal, and state what a loss does to the readout."
    blocking: false
    resolution:
      state: open
  - id: plan-text-out-of-order-and-stale
    class: insufficient_work
    subject: "M096"
    finding: "(1) Y003's acceptance requires 'the static scan of tests/unit/gl-views-wording.test.mjs', but that file is in Y004's scope and is created there ('which fails on the merge base'). Y003 comes first and does not list it in its scope, so Y003 cannot meet that criterion as written. (2) Y002 defines axesOf() in a new src/js/charts/gl/axes.js, beside the existing src/js/charts/axes.js, which holds the shared tick and mapping helpers. Every Canvas 2D twin, which lives outside gl/, must draw the same axes, so the descriptor belongs with the shared helpers, not under the GL directory. (3) M096's acceptance names 'Y007, Y007 and Y008'. (4) M096's problem says the spectrogram 'recolours W x H bytes on the CPU on a theme or range change (K033)'. On main a LUT change clears the history ('A new LUT clears the history', spectrogram-view.js:220; spectrogram.js:277), and the recolour is K033's plan, with M062 at 0 of 31. (5) Every size criterion quotes '1 000 000 B on main at b67d1e58, 1 200 000 B once #279 lands'. #279 has landed: BUDGET.gzipBytes is 1 200 000 (scripts/build-config.mjs:48-51), and dist measures 825 984 B gzip at f887066f."
    blocking: false
    resolution:
      state: open
  - id: y001-evidence-short-of-its-acceptance
    class: delivery_verification
    subject: "Y001"
    finding: "Y001's objective asks for the gzip cost of each backend 'from npm run build' and timings 'headless as CI runs them and headed on the Mac'. Its evidence falls short in four ways. (1) G1 is 'not npm run build' but an insertion into the committed dist (ADR 0016:194-197). (2) The quoted headed timings are Chromium's only, because the Firefox and WebKit headed runs were set aside with the first run (ADR 0016:120-121). (3) The linux timings are emulated and not quoted (:112-114). (4) Every darwin timing ran at a 1-minute load of 6.7-24.5, with runs overlapping, which the note itself says broke item 2 of project.shared-machine-discipline (:103-111). The capability and context facts are sound. The timings are, by the note's own words, 'not proven upper bounds' and are what Q050 (2a) and the 'where it pays' decisions would rest on. Y001 should be recorded as done for capabilities and context limits, with the timings re-run one browser at a time on a quiet machine (or on the runner) before Q050 decides from them."
    blocking: false
    resolution:
      state: open
