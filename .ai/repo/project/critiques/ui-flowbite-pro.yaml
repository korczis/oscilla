intent: ui-flowbite-pro
reviewed_at: "cbaccebd21a8c8a0db85d95144975b12abee1707"
reviewed_by: "claude-opus-5.5 (critic, plan-ui-flowbite-pro session)"
findings:
  - id: budget-headroom-is-shared
    class: regression_risk
    subject: "F001"
    finding: "dist measured 2 824 602 B raw / 817 426 B gzip at 91c89b0, which leaves 182 574 B gzip under BUDGET (1 000 000 B). flowbite 2.5.2's whole minified script is 135 824 B raw / 29 632 B gzip, and its prebuilt full stylesheet is 181 924 B raw / 25 569 B gzip, measured from the npm tarball on 2026-10-28. A purged Tailwind build is smaller, but the legacy stylesheets stay in the file until each workspace issue removes its share (#250's record, measure 2, counts 1627 selectors in the 12 legacy stylesheets at ee70253, part of its debt of 4252 there). The same headroom also has to carry M045, M047, M048 and M049. If no issue measures the addition, the budget fails in the middle of the migration, and the reflex would be to raise it again without an owner decision."
    blocking: false
    resolution:
      state: planned
      issue: "F001"
      because: "F001 imports only the flowbite components the shell uses, states dist's raw and gzip size before and after in the pull request and in the BUDGET comment, and every F issue removes the legacy selectors it replaces in the same change and states the size. The intent's invariant allows a budget raise only by owner decision (2026-10-28)."
  - id: preflight-restyles-everything-at-once
    class: regression_risk
    subject: "F001"
    finding: "Tailwind's preflight resets the margins of headings and lists, button and form-control appearance, and makes svg, canvas and img display:block. Enabled together with the build integration, it would restyle every legacy workspace at once: the inline Lucide icons would drop onto their own lines and the uPlot and p5 canvases would reflow. The flowbite plugin adds its own form base styles by element selector (every [type=text], select, checkbox, radio and range), with forms on by default and independently of preflight (flowbite 4.0.2's plugin.js, read 2026-10-28), so turning preflight off alone does not keep the sliders and selects as they are. The visual gate would then fail on every reference in a pull request that is meant to change no pixel."
    blocking: true
    resolution:
      state: planned
      issue: "F002"
      because: "F001 ships with preflight disabled and the plugin loaded with forms: false (or, if the pinned 2.5.x line lacks that option, without the plugin), and must pass the visual gate at the recorded thresholds with no reference or threshold changed; that measured result is what 'nothing renders differently' means. F002 enables preflight and the form base styles together with the shell, checks the icons, canvases, sliders and dialogs for their resets, and updates the references it changes with the reason (2026-10-28; review of #251, P2-4)."
  - id: visual-identity-lock-contradicts-the-order
    class: missed_requirement
    subject: "ui-flowbite-pro"
    finding: "Three records contradict the owner's order. project.visual-identity-lock v1 is blocking and binds every surface to src/styles/tokens.css and the hidden-logo question. ADR 0012 states that Tailwind and Flowbite are dropped. The invariants of ui-current and first-run-experience cite the existing tokens, and ui-current's non-goals exclude 'a framework change'. If they stay as written, each F pull request would be refused under those rules, or would land against them."
    blocking: true
    resolution:
      state: planned
      issue: "F001"
      because: "Pull request #250, written the same day, lands ADR 0061 (accepted on the owner's order), a resolution note on ADR 0012 that supersedes only its Tailwind and Flowbite bullet, project.visual-identity-lock v2 and rule project.ui-uses-flowbite-pro. F001 starts only once #250 is on main, and its acceptance says so. This plan change already rewrites the ui-current and first-run-experience invariants and ui-current's non-goal to cite the order and ADR 0061, and the invariants of midi-jam-companion (M045) and studio-completion (M048), which required new surfaces to extend the existing tokens, so that their new surfaces are built on Pro (2026-10-28; review of #251, P2-5)."
  - id: licence-in-a-public-mit-repository
    class: unproven_assumption
    subject: "ui-flowbite-pro#licence-clean"
    finding: "The Pro set is licensed under the Flowbite EULA (the Admin Dashboard's package.json and README), while OSCILLA is MIT-licensed and served on public Pages. Everything committed here is public. The Admin Dashboard ships Pro-only JavaScript (src/js/sidebar.js, dark-mode.js, charts.js), illustrations (images/illustrations/404.svg) and demo copy (names, avatars). Copied in, any of these would be Pro source published verbatim. Nothing in the repository detects that today."
    blocking: true
    resolution:
      state: planned
      issue: "F002"
      because: "Clause (d) of the ratchet that #250 lands refuses any tracked file that matches a fingerprint of the Pro set (tests/unit/flowbite-pro-fingerprints.json) or carries a Pro package marker, and F001 starts on it. F002 writes the sidebar collapse and the theme toggle in OSCILLA's own Alpine code. Only the MIT flowbite and tailwindcss packages become dependencies. Adapting markup is what the owner's licence statement of 2026-10-28 allows."
  - id: file-protocol-and-no-remote-font
    class: delivery_verification
    subject: "ui-flowbite-pro#pro-build"
    finding: "The Pro <head> loads Inter from Google Fonts and the bundle from a path. ADR 0012 and verify-dist forbid both: no remote font, no root-relative asset, no runtime fetch. The flowbite plugin's form styles carry data: SVG URLs, which verify-dist's CSS url() check must accept explicitly and narrowly. The flowbite 2.5.2 minified script contains no fetch( and no import( (checked 2026-10-28), but that holds only for the version measured."
    blocking: false
    resolution:
      state: planned
      issue: "F001"
      because: "F001's font stack names Inter first and falls back to the system stack with no download. verify-dist accepts the plugin's data: URLs and nothing else new. The build test and verify-dist run on the pinned version, and the gate browsers open dist from file:// and from the sub-path with zero console errors (2026-10-28)."
  - id: alpine-and-flowbite-own-the-same-element
    class: regression_risk
    subject: "F001"
    finding: "Flowbite binds its drawer, dropdown, collapse and tooltip instances once, when it initialises. An element that Alpine re-renders (x-for, x-if) loses its instance, and an element whose hidden state both Alpine and a data-*-toggle attribute flip drifts out of sync. OSCILLA's navigation groups, menus and dialogs are already Alpine state (navGroup, navGroupButton, openDialog)."
    blocking: false
    resolution:
      state: planned
      issue: "F001"
      because: "src/js/ui/flowbite.js initialises Flowbite after Alpine has rendered. An element is driven either by Alpine state or by a data-*-toggle attribute, never both, and F001 adds that check, with a fixture case, to tests/unit/ui-flowbite-pro.test.mjs. F010 keeps the native <dialog> elements instead of Flowbite's modal script (2026-10-28)."
  - id: dark-mode-mechanism-differs
    class: missed_requirement
    subject: "F001"
    finding: "The Pro template toggles a 'dark' class on <html> and stores 'color-theme' in localStorage. OSCILLA keeps a two-state theme under oscilla.theme and sets data-theme on <html>: resolveTheme in src/js/ui/app.js returns 'light' for a stored 'light' and 'dark' for anything else, dark being the default and the reference, and nothing reads prefers-color-scheme. Copying the Pro mechanism would discard every visitor's stored choice, would bring in a system default OSCILLA does not have, and would leave the charts, which re-theme from data-theme (src/js/charts/chart-theme.js), out of step with the chrome."
    blocking: false
    resolution:
      state: planned
      issue: "F001"
      because: "F001 configures darkMode ['selector', '[data-theme=\"dark\"]'], so the existing two-state theme drives Tailwind's dark variant, and the intent's invariant keeps OSCILLA's mechanism; a system state is a non-goal of the intent and would be a separate owner decision. F002 wires the Pro toggle button to that mechanism and F006 checks that the charts re-theme (2026-10-28; corrected after review of #251, P2-3: the plan first called the theme three-state)."
  - id: accessibility-of-the-pro-shell
    class: missed_requirement
    subject: "ui-flowbite-pro#pro-accessible"
    finding: "The Pro sidebar marks the active link with a background colour only, with no aria-current (reference.md section 4). The Pro modal is a div with no focus trap or inert background. Flowbite's dropdowns put no roving focus on their items. Today's tab bar carries aria-current, and the native dialogs trap focus. A faithful copy of the Pro shell would remove both for keyboard and screen-reader users. text-gray-500 on gray-50 is close to the 4.5:1 limit."
    blocking: false
    resolution:
      state: planned
      issue: "F002"
      because: "F002 adds aria-current to the active sidebar link and introduces the accessibility checks in tests/browser/ui-flowbite-pro.cjs: keyboard reach, visible focus, Escape returning focus, and contrast of at least 4.5:1 in both themes. F010 keeps the native <dialog> elements with Pro modal markup and lands the dialog table of ui-flowbite-pro.cjs, which lists all 22 dialogs with their owning issue, fails on an unlisted one, and checks focus entry, Escape, return and inertness for every dialog; F004, F005 and F008 turn on the Pro structure rows of their own dialogs (2026-10-28)."
  - id: visual-references-per-platform-and-per-issue
    class: delivery_verification
    subject: "F011"
    finding: "The visual references exist per platform (tests/visual/measure and tests/visual/studio hold darwin-arm64 and linux-x64 images), and CI renders in a Linux runner. A reference regenerated only on the Mac fails CI. A migration that defers every reference update to the end leaves main with a failing visual gate after the first workspace lands. Nine of the twelve workspaces have no reference at all, and none has one in the light theme."
    blocking: false
    resolution:
      state: planned
      issue: "F011"
      because: "Every F issue that changes a referenced view updates that reference through the visual gate with its reason, in the same pull request. F011 regenerates every reference from the finished shell, adds references for every workspace in both themes and at both sizes, and produces the linux-x64 images in the CI runner's container image (2026-10-28)."
  - id: live-smoke-reads-legacy-classes
    class: regression_risk
    subject: "F011"
    finding: "tests/browser/live-smoke.cjs runs after every Pages deploy, not on the pull request. It reads presentation classes: .osc-statusbar .osc-sb-name, .osc-sb-version, .osc-sg-node, .osc-sg-title, .osc-sg-cat, .osc-sg-edge-line, .osc-block-name and .osc-stl-hrow--track. A workspace issue that removes one of them passes its own gate and then breaks the deployed page's smoke."
    blocking: false
    resolution:
      state: planned
      issue: "F011"
      because: "F003, F008 and F010 keep those class tokens on their elements, unstyled if need be, and run the smoke against the built file. F011 moves the smoke to data-osc hooks and has it check the Pro shell (2026-10-28)."
  - id: other-open-milestones-build-interface
    class: insufficient_work
    subject: "M055"
    finding: "Open issues in M045 (MIDI), M047 (measurement figures), M048 (Studio completion), M049 (lessons) and M050 (P002, the first screen) also add interface. Editing every one of them would churn the plan. Leaving them unchanged would let them add legacy chrome while the migration removes it. Pull requests already open when #250 lands are the sharp case: #249 (V501, M045) adds one use each of osc-btn, osc-btn-secondary, osc-dialog-actions, osc-divider and osc-label, and #247 (V603, M048) adds one declaration to studio-timeline.css; merged onto #250 at d7dd1db, each fails the ratchet, and whichever lands after #250 fails (re-review of #250, 2026-10-28). Neither V501 nor V603 depends on F001 or F002, so the plan shows both READY while their pull requests cannot pass once #250 is on main."
    blocking: false
    resolution:
      state: planned
      issue: "F001"
      because: "The ratchet that #250 lands (tests/unit/ui-flowbite-pro.test.mjs) fails any change, whichever issue it belongs to, that adds a surface off Pro or a use of a legacy primitive, or that raises the debt. P002 now depends on F003 and builds on the Pro shell. M054's U002 to U008 depend on F002 or on their workspace's F issue (this plan change, 2026-10-28). A pull request open before #250 that adds anything the record counts (an osc-* class token, a selector or declaration of a legacy stylesheet, an inline style, a class outside the frozen vocabulary, a surface) is ordered before #250, which then merges main and re-measures its record on top of it, or it carries its own rewrite of tests/unit/ui-flowbite-pro-baseline.json; the ratchet compares that rewrite with every committed version, so it can only keep or lower each number, and the change removes as much of the same class name or stylesheet as it adds, or builds its addition on Pro after F001. #247 and #249 are in that position; landing them first or reworking them is the owner's merge order (re-review of #250, 2026-10-28)."
  - id: m054-would-be-built-twice
    class: unnecessary_work
    subject: "ui-current"
    finding: "M054 was planned the same day on the legacy chrome: U004 and U005 lay out the Analyze views, U003 fills the empty states and U002 rewrites About. If they ran before the F issues, each layout would be built once in osc-* CSS and again in Pro components."
    blocking: false
    resolution:
      state: planned
      issue: "F002"
      because: "U002 depends on F009, U003 on F005 and F010, U004 and U005 on F006, U006 on F002, U007 on F003 to F010 and U008 on F011. Each of their objectives says it is built on Pro. U001's audit stays as recorded (2026-10-28)."
  - id: deep-link-inventory-shared-with-p002
    class: delivery_verification
    subject: "F002"
    finding: "P002 plans its own deep-link inventory in tests/browser/first-screen.cjs, and F002 needs the same inventory before it moves the navigation. Two copies of the same table would drift apart."
    blocking: false
    resolution:
      state: planned
      issue: "F002"
      because: "F002 lands the table-driven inventory in tests/browser/ui-flowbite-pro.cjs, passing on the current interface before the shell changes, and P002's objective now imports it rather than restating it (2026-10-28)."
  - id: owner-verifier-is-not-evidence
    class: unproven_assumption
    subject: "F012"
    finding: "F012 made the owner's verifier the issue's evidence ('reports OSCILLA compliant'). Run on pull request #250's tree on 2026-10-28, ~/.claude/skills/flowbite-pro/verify.mjs reported 'PASS (no UI: S0 false, vacuous pass)': its S0 did not recognise src/index.html as a UI, so it would have called OSCILLA compliant before a single surface moved. A later copy of the file (dated 2026-10-28 23:01) recognises src/index.html and reports FAIL with 8 findings, which shows the other half of the problem: the file lives outside the repository and changes without this repository's review, so what it says of OSCILLA is not fixed by any commit here."
    blocking: true
    resolution:
      state: planned
      issue: "F012"
      because: "F012's evidence is the repository's own: the ratchet at debt 0 and tests/browser/ui-flowbite-pro.cjs asserting the Pro structure of the shell, the twelve workspaces and the 22 dialogs. The verifier's output may be quoted for information and is never a criterion or a validation command. The file belongs to the dev-68 session; this plan records the gap and does not edit it (2026-10-28; review of #251, P2-2)."
  - id: debt-zero-without-pro
    class: delivery_verification
    subject: "ui-flowbite-pro#no-legacy-chrome"
    finding: "The no-legacy-chrome criterion rested on the ratchet's debt reaching 0. The first record (measure 1) counted 28 named primitives and the surfaces that are a <section> or <dialog> with an id, so renaming osc-btn-secondary to osc-btn-alt, dropping a surface's id or putting Tailwind classes on a surface before Tailwind is built lowered the debt with no Pro adoption (review of #250, P1-1, mutations M7 to M9). Measure 2 (#250 at d7dd1db) closes those three, and the re-review still lowered the debt without Pro: renaming osc-btn-secondary to is-muted, a token of the frozen vocabulary, drops it by 94 (N7), and classless markup styled by legacy descendant selectors adds nothing to it (N1). A count of legacy chrome does not prove Pro structure. Only the shell had a browser check of its structure."
    blocking: true
    resolution:
      state: planned
      issue: "F012"
      because: "The criterion now also requires tests/browser/ui-flowbite-pro.cjs to assert, in the rendered page, the Pro structure of the shell, of each of the twelve workspaces and of each of the 22 dialogs in every gate browser and origin, and its command runs that suite after the debt check. Every workspace issue F003 to F010 already asserts its own Pro structure there; F012 makes the whole suite part of the release gate (2026-10-28; review of #251, P2-7; restated for measure 2 after the re-review of #250, N7 and N1)."
  - id: dialogs-without-owner
    class: insufficient_work
    subject: "F010"
    finding: "The shell holds 22 native dialogs; F010 named about eight. The three of Measure (level-cal, cal-convention, recipe-link), the five of Experiments and Findings (exp-rename, def, exp-delete, finding, finding-delete) and six of the Studio's eight (templates, link, add, connect, find, library) had no issue that named them, and the code that opens Measure's, Experiments' and Findings' dialogs sits in the guarded src/js/ui/measure.js, experiments.js and findings.js, which F010's scope left out and for which it required no verdict."
    blocking: false
    resolution:
      state: planned
      issue: "F010"
      because: "F010 owns the six shared dialogs (save, headphones, copy, help, mic, settings), the modal pattern and the dialog table, which lists all 22 with their owner and fails on an unlisted one, and changes no guarded path. F004 owns Measure's three and F005 the five of Experiments and Findings, each with its guarded file in scope and a review verdict; F008 owns the Studio's eight in src/js/ui/studio. F004, F005 and F008 depend on F010 (2026-10-28; review of #251, P2-6)."
  - id: governance-before-the-rule-exists
    class: missed_requirement
    subject: "ui-flowbite-pro"
    finding: "The intent is governed by rule project.ui-uses-flowbite-pro and ADR 0061, but its governance does not name them. Both land with #250, which is not on main: naming them now makes intent validate fail with unresolved_governance."
    blocking: false
    resolution:
      state: planned
      issue: "F001"
      because: "F001 starts only once #250 is on main and adds both to the intent's governance as its tenth step, unless the merge of main that brings #250 into this plan's pull request already has; its acceptance requires intent validate to report 0 failures. The intent's statement records why they are absent until then (2026-10-28; review of #251, P3-10)."
