priority: p1
profile: implementation
objective: "Lands as fix(ui), built by 26 in lane A next to U095, after K171. At 844x390 landscape on a touch phone with the keyboard dock unfolded, the app chrome above the pad is 319 px and the unfolded dock's top sits at 159.5 px, so the 96 px pad lies entirely under the keys and no scroll can reveal it (26's check, reverted from the keys+pad train as d5c8ba71; patch r9-landscape-check.patch in 26's scratchpad). After: the pad is wholly visible and playable with the dock unfolded in landscape, by one phone-shell rule, not a per-workspace patch."
why: "af's K171 review finding R9 (2026-11-05); the owner's 'no kaosspad' and phone-first orders (ui-current#phone-whole)."
