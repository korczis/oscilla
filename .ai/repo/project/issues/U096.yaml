acceptance_criteria:
  - "Fail-first: 26's landscape check (844x390, touch, dock unfolded) reports the pad covered on the merge base and wholly visible with the change, in Chromium, Firefox and WebKit, by elementFromPoint at the pad's corners and centre, through the suite harness with wait.cjs deadlines."
  - "One shell rule decides it, chosen by a measured comparison in the pull request of (a) the app chrome yielding in landscape (navigation and page header collapse to a thin bar while an instrument surface owns the notes), (b) the unfolded dock not overlaying the pad (the pad shrinks to its 6rem minimum above the keys), and (c) keys beside the pad (a side-by-side split in landscape); af's preference is (a) first, because it frees room for every instrument surface and keeps one dock behaviour, then (c); the builder decides on the measurement."
  - "Portrait 390x844 and 375x667 and desktop 1536x1024 keep their K171 behaviour (no regression in x-dock-yields and x-dock-desktop); iphone.cjs's census reach does not fall."
  - "Done only after each criterion is re-checked on a main commit."
