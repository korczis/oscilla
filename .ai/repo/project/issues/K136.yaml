id: K136
milestone: M082
serves:
- "signal-generator-lab#honest-level"
title: "The generator's level in dBFS at the generator, with the plan's peak and RMS"
slug: the-generator-s-level-in-dbfs-at-the-generator-with-the-plan
priority: p2
profile: implementation
objective: "Lands as feat(ui). The gain readout says dBFS-like and where ('-21.9 dBFS at the generator, before the -3 dBFS limiter and the output ceiling'), and the status bar and the gain slider's aria-valuetext add the current plan's peak and RMS ('peak -21.9, RMS -24.9 dBFS'), which differ for noise and multi-tone; text only, in existing elements. Under a valid LevelCalibration the existing CALIBRATED path may label SPL; without it nothing says SPL. The title's 'relative, not SPL' stays. The canonical readout truth table and its test are T026's (P05 measurement truth), and the gain readout's setpoint wording and the output-ceiling state are T001's; this issue adds the generator rows to T026's table and the stated peak and RMS on top of T001's wording, so it depends on both."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings G1-G14 measured on origin/main b67d1e58)."
scope:
- src/js/ui/workbench.js
- src/js/core/instrument.js
- src/js/audio/patterns.js
- src/index.html
- tests/unit/generator-level.test.mjs
- tests/browser/generator.cjs
- tests/README.md
- dist
- docs/v3/readout-truth.yaml
acceptance_criteria:
- "Before: VERIFIED (G10): the gain readout says '-21.9 dB' with a title 'relative, not SPL'; peak and RMS are never stated."
- "After and negative cases: as the objective and the criteria below state; the setpoint (what was requested) and the observation (what the analyser measured on the digital output, or the microphone on the room) are separate readouts with separate labels, and no readout claims the acoustic output."
- "Rollback: revert the merge commit. Nothing changes the schema, a studioHash, URL key meaning or stored preset, so documents saved while it was live load unchanged after the revert."
- "Scientific-truth rows (Quantity | Unit | Source | Algorithm | Resolution | Calibration | Limitations | Tests | UI label) are added to T026's canonical readout table docs/v3/readout-truth.yaml and checked by T026's tests/unit/readout-provenance.test.mjs, which this issue extends so that each UI label's text is in the source, each Tests path exists, and a setpoint row never shares its label with an observed row: Generator gain (setpoint) | dBFS-like | instrument state gainLevel | 20 log10(gain) | 0.1 dB | none; SPL only under a valid LevelCalibration | at the generator, before the -3 dBFS limiter and the output ceiling; device volume unknown | tests/unit/generator-level.test.mjs | -21.9 dBFS at the generator || Plan peak and RMS (computed) | dBFS-like | plan | closed form for periodic waves, offline render for noise and multi-tone | 0.1 dB | none | computed for the digital signal, not measured at the output | tests/unit/generator-level.test.mjs | Peak -21.9, RMS -24.9 dBFS (computed)"
- "tests/unit/generator-level.test.mjs, failing on the merge base: the stated peak and RMS of sine, square, triangle, saw, white noise and the two-tone plans equal the offline render's within 0.2 dB; the wording passes tests/unit/no-fake-science.test.mjs and the SPL label appears only under a valid calibration (tests/unit/v3-calibration.test.mjs)."
- "src/index.html changes text and bound attribute values only: no class token, selector or element is added."
- "Definition of done, extends: the gain of S021 and the level wording of project.no-fake-science v2."
- "Definition of done, cross-links: the stated level equals the MEASURE stimulus level when a sweep is handed over (K140). The link is a row of tests/browser/integration-map.json once that map (synth line K075) is on main."
- "Definition of done, dynamics: the readout follows the gain slider and the pattern as they change."
- "Definition of done, docs and routes: README.md's Playground feature list and docs/GLOSSARY.md where a term is new; .ai/repo/features/playground.md (or the feature record of the Playground) says what changed; tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'level' in tests/browser/generator.cjs moves the gain slider by keyboard and by pointer and waits with until() (deadline 'status bar states peak and RMS', 3 s) for the status text; switches to square and waits for RMS equal to peak within 0.2 dB; drags the slider by touch in a hasTouch context; on the merge base the status bar states no RMS. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit and the completed evidence the release that carried it; E030's judge passes on the pull request once E030 is on main."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Wave 1: it adds no class token, selector, markup surface or inline style, so the Flowbite Pro record does not change: node scripts/ui-flowbite-pro-record.mjs --check passes with no rewrite and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro); live drawing is on a canvas, a domain view."
- "scripts/size-report.mjs shows at most 0.5 KB gzip added, with the base and head figures in the pull request body, within the owner's dist budget of 1 200 000 B gzip (decision of 2026-10-29, about 355 KB of headroom at origin/main b67d1e58); the ceiling of this line is 25 KB gzip in all (Studio boxes 35 KB, signal generator 25 KB), stated in the milestone (project.single-file-deliverable)."
validation:
- node --test tests/unit/generator-level.test.mjs
- node tests/browser/generator.cjs --only level
- npm test
evidence_required:
- verified
