acceptance_criteria:
  - "tests/unit/studio-steps-clip.test.mjs, failing on the merge base: a valid steps clip round-trips through serialize, parse and the import pipeline; each field out of range is refused with its sentence and leaves the store unchanged; a steps clip on a target without notes or hits capability is refused; an oversized payload is refused by the import limits; every pinned template hash is unchanged."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: each field out of range; a target without notes or hits; an oversized payload."
  - "A browser check in tests/browser/v31-studio-timeline.cjs, wired into npm run test:studio (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a steps clip dispatched through the Studio store shows as a clip chip in the Studio timeline and in the compact Studio of the Playground, and survives a save and reload. Real-time: the chip appears after the dispatch and disappears after undo, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the chip is selected by pointer, by keyboard (arrows in the timeline listbox) and by touch, deleted by Delete, and carries its role and accessible name ('Steps clip, 16 steps'). Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every pinned template studioHash is unchanged: it adds node types, ports, capabilities, enum options or clip kinds only, never a parameter on an existing node type (D2, K022)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
