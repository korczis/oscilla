  - "Browser check `seq-playhead-after-edit` in tests/browser/sequencer.cjs: type Duration 3000 ms and Tab during pass 1; when editor.currentFrequency() reads 1200 Hz, the block under the playhead is the Pulse block, and the pass was not restarted."
