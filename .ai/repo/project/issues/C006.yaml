title: "The sequencer playhead marks the block that sounds after an edit during playback"
slug: the-sequencer-playhead-marks-the-block-that-sounds-after-an
priority: p2
profile: implementation
objective: "Lands as fix(sequencer). Finding vis-divergence-3. Edits during playback apply from the next pass (editor.js:21-23), but the panel builds the timeline scale and block rects from the edited editor.model and maps the sounding pass's clock onto it linearly: after a Tone block is lengthened to 3000 ms in pass 1, the playhead sits inside that Tone while the Pulse 1.2 kHz block sounds. Keep a snapshot of the compiled pass's layout (block ids, starts and durations) in the pass record and expose currentPassBlock() -> { id, index, startS, endS, t } read on the audio clock. A pure passPlayheadX(rects, passBlock) in src/js/sequencer/timeline.js finds the rect by block id, not index, so moves, duplicates and deletes stay right, and returns null when the block is gone. While the pass's layout differs from the edited model the panel marks the sounding block (aria-current) and, on null, ghosts the playhead with 'changes apply from the next pass'; the status bar shows the sounding and the next length. The pass is never restarted on an edit (that would be audible). Rebase over K003 (pull request #266), which edits the same two files."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
