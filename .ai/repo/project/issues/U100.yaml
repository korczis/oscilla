acceptance_criteria:
  - "Fail-first: tests/browser/ui-current.cjs phone-synth-room-320 and phone-synth-room-375 open #m=synth&yt=engines fresh from a link at 320 x 568 and 375 x 667 (chromium, firefox and webkit, a coarse pointer) with the link notice and the listening safety notice shown, and find the docked keys folded to their handle, each notice at most one line (a toast 64 px, the safety notice 56 px), Expand all taking a tap at its centre at 44 px, and at least three 44 px rows of the tab between the main scroller's top and the dock; on main 7637039e both fail (the keys docked, the safety notice 86 px, Expand all covered)."
  - "Decided by the coordinator oscilla-43 on 2026-11-09 (option 2 of oscilla-ee's question): on the Panel tab the keys are the Synth's instrument, so they stay docked there on every phone (phone-synth-panel-keys-320 and -375); hiding them behind a handle on most phones would cost the Synth its primary playing surface (the owner's line: the instrument sounds on a phone, mobile-first). One rule decides it, midi/routes.js roomFolds over the Synth route's keepsRoom (toolbar the page header, editorMin SYNTH_CONTENT_MIN_PX 192, never stacked), with a declared input: a tab that keeps the dock declares keepsDock (panels/semi-mono.js: Panel) and its tab panel carries data-keeps-dock (keepsRoom.keptBy); Engines, XY and, when it lands, Drums yield. A tab switch re-judges through ROOM_EVENT. The Panel tab's own room at 375 x 667 is helped by the one-line notices."
  - "On a short phone (a viewport height of 700 px or less) the listening safety notice, collapsed, is one line (its title, its first sentence cut with an ellipsis, More, a 44 px target); expanded it wraps with its whole wording as everywhere; a toast takes one line. tests/browser/iphone.cjs's checks pass (the Synth key on the docked Panel keys); no other phone-whole check regresses at 320 x 568 and 375 x 667."
  - "The Flowbite Pro baseline and the legacy class ledger only shrink (Tailwind utilities only, no new legacy class, no inline style). Guarded (src/js/synth): oscilla-c1 writes the verdict; oscilla-c3 checks the phone screens."
