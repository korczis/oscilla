acceptance_criteria:
  - "Fail-first: a phone-whole check (tests/browser/ui-current.cjs) opens #m=synth&yt=engines fresh from a link at 320 x 568 and 375 x 667 (WebKit iPhone SE profiles and the same viewports in chromium and firefox) with the link notice and the safety notice shown, and finds the tab's first control (Expand all) tappable: inside the main scroller's visible area below the sticky chips and above the dock, not covered at its centre, at least 44 px; and the main scroller keeps at least 132 px of the tab's content in view. On the merge base it fails at both sizes."
  - "On a short phone (viewport height 700 px or less) the docked keyboard yields on the Synth tabs whose own surface plays or edits (Engines' picker and cards, XY, Drums when it lands), folded to its handle as K171 folds it for the XY tab, and unfolds by its handle as there; on the Panel tab, whose keys are the instrument, it stays docked. The listening safety notice keeps its wording behind its More control and its reopen control, and takes one line on a short phone; a link notice takes at most one line there."
  - "iphone.cjs's CLOSE_NOTICES prep is removed (it lands with K222) and its Drums checks pass on both iPhone SE profiles with the notices open; no other workspace's phone-whole checks regress at 320 x 568 and 375 x 667."
  - "One rule per surface (the shell's notice area, the dock's yield), no per-workspace exception beyond the dock's tab list; the Flowbite Pro baseline and the legacy class ledger only shrink; no inline style is added. Guarded paths (src/js/synth) carry a non-builder's verdict."
