objective: "Lands as test(synth). K061's criterion 3 names browser checks tests/browser/synth.cjs does not run: the panel inserted through the Studio's patches dialog shows its nodes and normal edges in the Studio graph; a normal deleted there stays deleted while the Synth panel shows the jack open with Restore normal (src/js/synth/ui.js:288), which restores it as one history entry; a cable patched over a normal in the Studio graph removes the normal from the runtime's edge list (debugInfo) and the cable carries the signal; the panel is inserted by pointer, keyboard and touch; the restored-normal announcement is in the polite live region. Rollback: revert; tests only."
why: "Gap of K061 (criterion 3) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): K061's browser checks are not in tests/browser/synth.cjs. No owner direction re-scopes it, so it is its own issue and K061's criterion points here (chore/plan-m064-rescope). K061 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
