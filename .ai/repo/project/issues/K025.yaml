title: "Linked spectrum over a scrolling spectrogram, and the Audio-band receiver template"
slug: linked-spectrum-over-a-scrolling-spectrogram-and-the-audio-b
priority: p2
profile: implementation
objective: "Lands as feat(analysis). A spectrum over a time-down scrolling spectrogram (D7: never \"waterfall\") with a shared frequency axis and a tuning cursor, stating the sample rate and FFT size; and an \"Audio-band receiver\" template that heterodynes by ring modulation (both sidebands; a single-sideband shift needs an AudioWorklet, ADR 0026, and its help text says so). A wording test reads every string of the line (section 5 of the plan; intent audio-band-signal-lab invariants). It waits on F001 and F002 of plan pull request #251 (intent ui-flowbite-pro), which are not on main yet; depends_on names them in the plan change after #251 lands."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
