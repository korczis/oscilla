acceptance_criteria:
  - "The two views share one frequency axis and cursor, span no more than Nyquist, and state the sample rate and FFT size, in a unit test that fails on the merge base."
  - "The Audio-band receiver template validates, has a pinned studioHash and renders both sidebands offline at both sample rates."
  - "tests/unit/audio-band-wording.test.mjs finds the required phrases (\"audio-band\", \"a digital signal generated in this page or captured from the microphone\", \"no radio is received\") in every string the line adds and none of the banned terms (radio reception, SDR hardware, waterfall, dBm, and RF matched as a whole word and case-sensitively, so that perform and interface do not match); alias arrays are excluded, so the Spectrogram node's search alias \"waterfall\" (src/js/studio/nodes/analysis.js) stays as a search term, never a displayed name."
  - "Any new chrome is Flowbite Pro markup adapted from the matching Pro block and lowers or keeps the ratchet (project.ui-uses-flowbite-pro, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs); controls are Pro range sliders with number inputs, never a custom rotary knob (D5)."
  - "The pull request carries a reviewer's verdict (src/js/analysis and src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
  - "Its chart hosts (the linked spectrum, kind plot, and the scrolling spectrogram, kind rows, sharing the tuning cursor through link.js) enter tests/unit/chart-host-census.json as done in this change (they do not exist when K053 lands, so they are never pending), each carrying data-osc-chart, and the table-driven pass of tests/browser/charts-interaction.cjs holds for each: the host is role=group holding the aria-describedby summary and the snapshot data table, and its focusable plot surface is role=application with aria-roledescription \"interactive chart\" (never role=img), both asserted in the accessibility tree, with a visible focus ring; ArrowRight moves the cursor one step and the one polite live region announces the readout once after the keys settle; Escape clears the cursor and still reaches the page's stop (a playing tone stops); Space keeps its workspace meaning (SPACE_MEANING of src/js/ui/shortcuts.js) and is never taken (ADR 0050); on a touch pointer a tap pins the cursor and it stays after the finger lifts. It lands before K050 of M062 through K048 or K033, so its hosts are in the census when K050 captures the per-host references; if scripts/visual-charts.mjs already exists, each host it adds gets its light and dark reference, bound and expected colours in the same change, which also opens the M063 question that re-accepts the light references."
  - "The two views paint as one subscriber of src/js/charts/frame-loop.js registered with both hosts (K036's hosts option), with no rAF of their own; tests/browser/chart-cost.cjs passes with them shown and finds them idle while hidden."
