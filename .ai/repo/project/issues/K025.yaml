title: "Linked spectrum over a scrolling spectrogram, and the Audio-band receiver template"
slug: linked-spectrum-over-a-scrolling-spectrogram-and-the-audio-b
priority: p2
profile: implementation
objective: "Lands as feat(analysis). A spectrum over a time-down scrolling spectrogram (D7: never \"waterfall\") with a shared frequency axis and a tuning cursor, stating the sample rate and FFT size; and an \"Audio-band receiver\" template that heterodynes by ring modulation (both sidebands; a single-sideband shift needs an AudioWorklet, ADR 0026, and its help text says so). A wording test reads every string of the line (section 5 of the plan; intent audio-band-signal-lab invariants). It waits on F002 of #251 (intent ui-flowbite-pro; F002 needs F001) and on K053 of M062, whose cursor bus (link.js) carries the shared frequency cursor and whose census and keyboard cursor its two views use, and on K036 of M062, whose frame loop takes its hosts; the plan change that added M062 named these edges. Through K053 and K028 it also waits on the charts owner decisions Q014 (the gzip cap) and Q016 (the home of M062) of M063. The scrolling spectrogram does not follow a spectrum zoom and its history never restarts on one (OD11 of the charts plan, out of scope); K033 of M062 stores the history as levels after this issue and keeps its time-down orientation."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
