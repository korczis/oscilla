title: "Pulse waveform with width, band-limited and proven so"
slug: pulse-waveform-with-width-band-limited-and-proven-so
priority: p2
profile: implementation
objective: "Lands as feat(audio). The band-limited pulse is synth K059's PeriodicWave builder (its vco's pulse, partials stopping below 0.95 x Nyquist of the running context, rebuilt when frequency or width changes), shared as src/js/audio/pulse.js: if K059 kept it inside the vco adapter, this slice moves it there so both use one module. The Generator workspace (K138) gains a Pulse waveform and a Width control. The help says 'band-limited: no partial above the digital Nyquist limit', and states that sine, triangle, saw and square are band-limited by the browser's table oscillator. The Studio Oscillator node gains no width parameter (D2); the Studio's pulse is the vco."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings G1-G14 measured on origin/main b67d1e58)."
