acceptance_criteria:
  - "Fail-first: tests/unit/core-visualization.test.mjs fails on the merge base: harmonicFrequencyTicks for a 2.52 kHz sine axis at 48 kHz returns at least two ticks, every tick inside [fmin, fmax], labels from formatHzTick, none within 40 px of another or of the Nyquist label, and none for an empty table; harmonics.js exports no HARMONIC_N_LABELS."
  - "Fail-first: tests/unit/charts.test.mjs fails on the merge base: the additive chart's y tick labels for the default -80..0 range are '0 dB rel', '-20', '-40', '-60', '-80', and never contain 'dBFS', 'SPL' or 'audible'."
  - "tests/browser/app.cjs (analysis-tabs-and-fullscreen) opens the Harmonics tab with a 2.52 kHz sine and asserts the tick labels the view drew in its last frame (a read-only record the view keeps, as the additive chart's getBars() does) are non-empty Hz or kHz labels; tests/browser/labs.cjs asserts the additive chart's drawn y labels include '0 dB rel'. Both run in chromium, firefox and webkit and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "It adds no class token, selector, markup surface or inline style, so tests/unit/ui-flowbite-pro-baseline.json stays equal (node scripts/ui-flowbite-pro-record.mjs --check passes) and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro, project.visual-identity-lock)."
  - "As a fix change it carries a unit test that fails on the merge base and passes on the head (project.fail-first); its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed."
  - "The visual references of the analysis and additive regions of test:visual are re-accepted with the reason \"harmonics frequency ticks; additive dB rel unit\" in the pull request body (npm run test:visual)."
  - "Definition of done, extends: the harmonics view gains a frequency axis and the additive grid its unit, on the shared axes.js helpers."
  - "Definition of done, interlinks: the objective names K044 and T022; the pull request names U015 and K044, and K044's text is not duplicated."
  - "Definition of done, interactivity: none added; the labels serve the existing hover and keyboard readouts K044 plans (stated)."
  - "Definition of done, docs, menus and routes: docs/GLOSSARY.md's 'dB rel' entry (or a new one) says what the additive and harmonic levels are relative to; no menu or route changes."
  - "Definition of done, tested: the unit and browser checks above; tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
  - "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
