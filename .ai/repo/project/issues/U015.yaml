title: "The Harmonics chart labels its frequency axis and the additive chart states its dB unit"
slug: the-harmonics-chart-labels-its-frequency-axis-and-the-additive
priority: p3
profile: implementation
objective: "Lands as fix(charts). Two partial charts show readings with no axis to read them against. (1) Harmonics tab ([data-osc=\"analysis.tab\"][data-value=\"harmonics\"], host #osc-chart-waveform, createHarmonicBarsView in src/js/ui/p5-views.js:248-296): the log-frequency x axis from harmonicAxis (src/js/visualization/harmonics.js:110) carries no tick label; only the Nyquist marker is labelled, so a bar's frequency cannot be read. HARMONIC_N_LABELS ('f', '2f', ...; harmonics.js:101) is defined and never drawn. After: a pure harmonicFrequencyTicks(axis, widthPx) in harmonics.js returns the 1-2-5 ticks inside [fmin, fmax] from logTicks of src/js/charts/axes.js, labelled with formatHzTick ('2 kHz', '5 kHz'), and the view draws exactly those under the plot; HARMONIC_N_LABELS and HARMONIC_DB_LABELS, which nothing reads, are removed. (2) Additive chart (#osc-chart-additive, src/js/charts/additive-chart.js:68): the y grid reads bare '0 ... -80' through formatDbTick(v, 'plain'). After: the 0 tick reads '0 dB rel' and the others stay bare numbers (the 'top' convention of the spectrum), the same 'dB rel' wording K044 uses for the bar tooltip; the level is the coefficient's gain (gainDb of audio/additive.js visualCoefficients), so no dBFS, SPL or 'audible' wording is drawn (project.no-fake-science). Negative cases: an empty table still draws 'UNAVAILABLE' and no tick; a tick nearer than 40 px to the Nyquist label or to its neighbour is dropped rather than overlapped; the dual source (harmB) widens fmax and the ticks follow; a narrow host keeps at least two ticks or none; minDb and maxDb options other than the defaults still label only the 0 tick with the unit. Canvas drawing only: no markup, class token or inline style is added (project.ui-uses-flowbite-pro), and the labels are text, not controls (project.no-inert-surfaces). Rollback: revert the commit; it changes no stored state, URL key or schema. Not this: K044 (the dB rel unit on the harmonic bars' y grid, the bar readouts and the Nyquist contrast; this slice leaves HARMONIC_DB_GRID's labels to it), T022 (its reading of K044), K046, Y004 and T002 (unit ticks on other charts)."
why: "Found by the S074 quality-bar review of 2026-10-30 at origin/main d9db6bdf, section 74 symptom \"The Harmonics chart has no frequency labels on its log-frequency x axis; only the Nyquist marker is labelled, so a bar's frequency cannot be read. Its y grid labels are bare numbers '0, -20, -40, -60' with no unit. The Additive chart's y axis is also unitless '0 ... -80'\", reproduced by an independent verifier; evidence: scratchpad s074/live2-tab-harmonics.png (2.52 kHz sine bars on an unlabelled axis and a unitless 0/-20/-40/-60 scale). Readouts must carry units; K044 covers the harmonic y unit only, not the frequency ticks or the additive grid unit."
