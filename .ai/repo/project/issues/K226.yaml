acceptance_criteria:
  - "Fail-first unit: with REC armed and the transport playing, a pad L gesture writes automation points of its two targets at the playhead's positions in one undo entry; REC off writes nothing; a take while stopped is refused with its sentence."
  - "One record path: the take goes through K223's recorder (no second recorder for the pad); undo and redo restore the exact serialized model."
  - "Browser (chromium, firefox, webkit), through tests/browser/lib/suite.cjs and wait.cjs until(): a recorded take replays (the target's automation lane drives it on the next pass); a phone check with the gesture rule on; the suite pace declared."
  - "Guarded (src/js/synth, src/js/studio): a non-builder verdict."
