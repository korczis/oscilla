title: "REC on the Synth's pad L: a take of its X and Y written into an automation clip at the playhead, one undo per take"
slug: rec-on-the-synth-pad-l
priority: p2
profile: implementation
objective: "Lands as feat(synth). Split from K220 on 2026-11-09 (the coordinator oscilla-43): K220 lands the two performance pads under the Synth face; this slice adds REC on pad L. With REC armed and the Studio transport playing, a take of pad L's X and Y (the targets its normals or cables feed) is written as automation of those targets at the playhead, one undo entry per take, through the one record path K223 builds for live pad and key hits (oscilla-75's record model: hits into a clip at the playhead, quantised, one undo per take), so pads, keys and the pad's automation share one recorder. Before: pad L plays its targets live only. After: a take replays from the timeline. Rollback: revert; the take's automation stays valid model data."
why: "Owner direction Q103 and the owner's screenshots of 2026-11-09 (an integrated performance pad with record); K220's objective names recording, split out so the pads land first."
current_state: "Filed 2026-11-09 when K220 was split; waits for K220 and K223's record model."
