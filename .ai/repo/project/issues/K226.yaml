title: "Step-voltage sequencer node: three rows of step values with a role each, per-step skip, a manual step advance, a CONTROL out per row and a TRIGGER out per step, on the one transport"
slug: step-voltage-sequencer-node-three-rows-of-step-values-on-the-one-transport
priority: p2
profile: implementation
objective: "Lands as feat(studio). A new node type, step-voltage-sequencer (category MODULATION): rows A, B and C of 8 or 16 step values each (a length enum 8 | 16, values -1..1, each row edited in the Inspector as the step-grid kind's param-list lane, W008/K221: the one implementation of a step editor, by the owner's order of 2026-11-04 to unify every control kind), one shared step position; inputs clock (TRIGGER, one step per trigger; with no cable it steps at a rate parameter like the Step Modulator) and reset (TRIGGER, back to step 1 on the next step boundary); outputs a CONTROL per row (cvA, cvB, cvC; port ids are letters and digits, studio/ports.js definePort, the current step's value held to the next step), a TRIGGER per step (trig1 .. trig16, the ones past the length silent and said so on the card) and a gate TRIGGER on every step; a playback enum (forward, back and forth, once). It compiles through the scheduler the Step Modulator uses (audio/scheduler.js scheduleSteps) on the one Studio transport, so a K023 Clock or the transport's own tempo drives it and its steps fall on the same frames as the synth's, the drums' and the clips' (one-transport). The existing Step Modulator (one row, no reset, no step triggers) is unchanged: rows and step triggers would be new parameters and ports on an existing type (D2), so this is a type of its own. Each row declares its role (a role enum per row, Czech labels): CV (the step value, -1..1), pitch (the value quantised to semitones under a pitch edge that maps 1 to one octave, as K022's Step quantize rounds), octave (rounded to whole octaves, -2..+2), gate length (the row sets how long that step's Gate and trigger hold, a fraction of the step period, so a Gate can be legato or short per step) or velocity (0..1, unipolar, for a velocity or level input); the role changes what the row's output carries, stated on the card. Sequence mode: forward, back and forth or once, and a skip flag per step (a list of 16 booleans): a skipped step is passed over, the next one plays on that tick, and a pattern whose steps are all skipped plays none and says so. A manual step advance (a Step button on the node's face, pointer, keyboard and touch): while the transport is stopped or armed it takes one step through the live router (studio/live-notes.js, the one fan-out), firing that step's Gate and trigger; while the timeline plays and owns the clock it is refused with its reason (K103's ownership rule). It is a projection of the one Studio store like every node (no second sequencer state). Before: a patch cannot have three stepped CV rows sharing one position, nor a trigger out per step, a reset, a role per row, skipped steps or a manual step. After: one node gives them, live and offline. Rollback: revert the pull request; a document saved with the new type is then refused by the import pipeline with its unknown-type sentence, never dropped silently."
why: "Owner direction of 2026-11-09, relayed by the integrator oscilla-43 (amended the same day from three more screenshots of the sequencer's detail: the row roles, the sequence mode with per-step skip, the manual step advance and the 16 step triggers): the owner sent screenshots of a semi-modular tablet instrument and asked that it be split into independent functional components on OSCILLA's own model, functional only (no trade dress or labels, project.visual-identity-lock). Its step-voltage sequencer has no issue: K221 and W008 play notes from a notes clip grid, K078's CV lanes are clip data written onto a parameter, and the Step Modulator (src/js/studio/nodes/modulation.js) has one row, no reset and no trigger per step. Checked against origin/main 7637039e."
