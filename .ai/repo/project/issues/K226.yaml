acceptance_criteria:
  - "tests/unit/studio-step-voltage-sequencer.test.mjs, failing on the merge base: the type is registered with the ports and parameters above and every pinned template studioHash is unchanged (D2); the scheduler's plan for 16 clock triggers at a stated tempo puts row A, B and C's values and trig1 .. trig16 on the step times the clock gives, the same times a Step Modulator on that clock plays (one-transport); a reset on step 5 plays step 1 at the next step boundary, never mid-step; length 8 leaves trig9 .. trig16 silent; back and forth and once play their stated orders; a cable from cvA into a VCO's pitch and from trig3 into an Envelope's gate passes canConnect, and a TRIGGER out into an AUDIO input is refused with the validator's sentence (project.typed-ports)."
  - "tests/unit/studio-step-voltage-sequencer.test.mjs, failing on the merge base, also: a pitch row puts a step of 0.29 at 0.25 (a semitone is 1/12), an octave row at a whole octave, a velocity row stays within 0..1; a gate-length row of 0.5 holds the Gate for half the step period and one of 1 to the next step (legato); a skipped step is passed over (steps 1, 3, 4 with step 2 skipped) and its trigger stays silent; all steps skipped play none and the card's reason says so; the manual advance takes one step through the live router while stopped and is refused with the ownership reason while the timeline plays."
  - "tests/browser/instrument-dsp.cjs renders, offline at 44.1 kHz and at 48 kHz, cvA stepping a VCO through three stated values: each step's frequency within one bin of the stated one at its computed time, and trig1 opening an envelope on step 1 only; no sample rate assumed."
  - "A browser check in tests/browser/synth.cjs (run by npm run test:synth) proves it linked, real-time and interactive: inserted from the Studio, cabled by pointer, keyboard and touch into the Synth panel's VCO and EG, it plays on PLAY with the drums on the same transport; turning a step knob changes that step's value in the Studio store and in the sound at the next pass; a row's role, a step's skip and the Step button work by pointer, keyboard and touch; every wait through tests/browser/lib/wait.cjs until() with a named deadline, inside tests/browser/lib/suite.cjs, and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a knob drag one history entry; undo and redo restore the exact serialized model) (project.studio-model-is-canonical); every node it plays is built through the engine with track()/source() accounting, all timing on the audio clock, and the engine node census is 0 after stop (project.audio-engine-discipline)."
  - "Every string it adds is Czech (project.czech-prose) and passes tests/unit/synth-wording.test.mjs (no product, brand or model name); the UI is Flowbite Pro and the D11 knob (project.ui-uses-flowbite-pro); scripts/size-report.mjs shows at most 4 KB gzip added (3 KB before the amendment of 2026-11-09 added the row roles, the skip and the manual step; measured +3 303 B against 0f9403d8); a reviewer's verdict for the guarded paths (project.review-verdict); tests/README.md has a row for each new test; dist is rebuilt."
