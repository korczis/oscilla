title: "One keyboard, centrally driven: every workspace's keys play the one Studio instrument, armed and docked everywhere"
slug: one-keyboard-plays-the-one-instrument-everywhere
priority: p1
profile: implementation
objective: "Lands as feat(midi). Measured before (2026-11-15, the owner's Mac build of feat/v507-midi-devices, keyboard code as on main fba40f4d): an armed A played the Playground's own sine voice in the Playground and, with the default document, in the Studio; the Synth panel in the Synth; and nothing in the ten other workspaces, which were not armed and showed no keys while the readout said \"v Playgroundu\". Cause: midi/routes.js listed only playground, synth and studio and routeOf() gave every other workspace the Playground row; KEYBOARD_VIEWS named the same three. After: KEYBOARD_VIEWS is every workspace (WORKSPACE_IDS); the Playground row and DEFAULT_ROUTE (every unlisted workspace) play the Studio document's note target (studioSink); midi/ui.js centralSink falls back to the Synth panel (synthSink, the same document) and never to the engine's voice (that stays only for a page without the Synth, a unit rig); every workspace is armed at once (Q105 'Armed everywhere', now really everywhere); the same docked keyboard is in every workspace but the Playground (whose keys stay under its panels), folded to its handle on a page that is not an instrument (route.folded) and unfolded by the user; the readout and the link notice name no page; leaving any workspace ends the keys' armed-only runs (LEAVE_POLICY: the Studio row out of every workspace but the Synth, the Synth row out of every workspace)."
why: "The owner's order of 2026-11-15 in session cae276ab-2d90-45d2-babb-a1f8023668d2 (Claude Code), verbatim: \"stale je bordel v klavesnicich, na kazde strance se chova jinak, neni napojene na centralni studio syntr,h vsude se chova jinak, neni stejna component, centralne rizena ...\" (the keyboards are still a mess, they behave differently on every page, they are not connected to the central Studio synth, the same component, centrally driven). The proposal (every workspace plays the central synth; the Playground's keys lose their own tone) was put to the owner in the same session with an explicit invitation to object; the owner answered by restarting the work loop with the same order, without objecting."
current_state: "Landing: the owner wrote at 2026-11-15T06:40Z in session cae276ab-2d90-45d2-babb-a1f8023668d2 (Claude Code), verbatim: \"pokracuj, dotahni K247 PR a V508\" (carry on, finish the K247 PR and V508); on it oscilla-43 lands the whole stack (V506, V507, K247, V508) as train T22 in PR 555 (v3.38.0), c3 agreeing. Review C3-553-1 (oscilla-c3, 2026-11-15): a key in the Playground or Measure inserted the Synth panel into the untouched default document (6 to 28 nodes, one undo entry) and said so only in the Synth's live region. Two readings were put: (a) insert, and say K246's whole sentence where it happens with its own Zpět; (b) play the engine's voice outside the Synth and the Studio until the document holds an instrument. oscilla-43, deciding under Q090, first chose (b), then reversed it to (a) on the owner's words, verbatim: \"stale je bordel v klavesnicich, na kazde strance se chova jinak, neni napojene na centralni studio syntr,h vsude se chova jinak, neni stejna component, centralne rizena ...\" (under (b) a fresh Playground plays a stand-in, the reported fault). Implemented as (a) within the bounds: the insert only where insertDecision.auto allows it (nothing of the user's cut, or the untouched reference template), a user's own chain into Master Output never rewired from a key, K246's sentence as a warning notice in that workspace once per insert with its own Zpět (workspace/keys.js alertUndo), which undoes the insert while it is the last change of the document. Built by oscilla-p7 (Claude Code session cae276ab-2d90-45d2-babb-a1f8023668d2) in task started 2026-11-15 on feat/k247-one-central-keyboard, stacked on V507 (PR 549). The audit after the change: in all 13 workspaces an armed A arms the Studio transport and plays, no engine voice sounds, the handle shows on every folded page and unfolds the same keys. Coordination: the dock rule change (dock-yield.js foldable reads route.folded) touches the file of oscilla-p3's U101."
