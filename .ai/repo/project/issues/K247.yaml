acceptance_criteria:
  - "KEYBOARD_VIEWS is WORKSPACE_IDS; routeOf() of an unlisted workspace is DEFAULT_ROUTE (plays studioSink, armed, leave, folded); armedDefaults() names every workspace armed (tests/unit/keys-routes.test.mjs)."
  - "midi/ui.js centralSink gives the workspace's sink, else the Synth panel; the engine voice plays only where neither exists (tests/unit/midi)."
  - "In every workspace an armed computer key arms the Studio transport and sounds through it, no Playground engine voice sounds, the dock (or its handle on a folded page) is shown and unfolds the same keys (tests/browser/midi.cjs keys-everywhere-central)."
  - "LEAVE_POLICY ends the keys' armed-only runs out of every workspace (tests/unit/leave-policy.test.mjs)."
  - "ADR 0058 records the K247 note; docs/midi.md and the Settings copy no longer say the keys play the Playground's voice."
