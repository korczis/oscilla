- "Definition of done, interactivity: none: a decision record (stated)."
- "Definition of done, docs, menus and routes: .ai/repo/adrs/README.md lists the new decision and why it is proposed; no route changes."
- "Definition of done, tested: majordomus adr check and npm test (no browser surface; stated)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
- "Docs-only: not a feat or fix change, so project.fail-first does not apply; its paths are not guarded, so no review verdict is needed."
