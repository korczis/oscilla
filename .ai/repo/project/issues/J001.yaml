- "The new decision's status is proposed and the 0058 note leaves every section above '## Resolution notes' and the status unchanged; the note names the planned work it binds (K058, K077, N001, N004, N005, N006, Q062) by plan id only, never a rule id that is not in force (project.rules-name-their-enforcement)."
- "J001 is recorded done only when ADR 0061 carries the resolution note for the instrument visuals on main, from J001's own docs pull request or from #329 if it lands the same note first, the evidence naming that commit; 4368b592 (ADR 0081 and the ADR 0058 note, merged through 08795f1f) is the first part only. The ADR_NOT_A_CAPABILITY entry 4368b592 added to tests/unit/knowledge-integrity.test.mjs is in scope."
- "npm test passes, including tests/unit/knowledge-integrity.test.mjs (every path the records name exists), and majordomus knowledge validate reports no new finding."
- "Definition of done, extends: ADR 0058 gains its knob note; the decision record set gains the component contract that G001, N001, N003, K105, V619, W001 and Y001 build on."
