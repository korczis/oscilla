objective: "A full-range plucked string (Karplus-Strong) and FM operator feedback are recurrences inside one node's DSP; project.no-silent-feedback v1 refuses graph cycles and D8 waits on its v2 for feedback delay and chorus. The plan recommends a v2 that allows a recurrence inside one node only, with its loop gain clamped below 1 and proven by a unit test, still refusing every graph-level cycle; feedback delay and chorus stay with D8."
