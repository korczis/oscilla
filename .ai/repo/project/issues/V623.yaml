title: "The box menu: presets, open lab, probe, measure from here, listen, duplicate, group, help"
slug: the-box-menu-presets-open-lab-probe-measure-from-here-listen
priority: p2
profile: implementation
objective: "P04 slice D (editing and undo invariants). Lands as feat(studio-ui). Right-click, long-press or the ContextMenu key on a box opens a Pro dropdown: Presets (K020), Open lab (the Filter lab for Filter, the Envelope lab for Envelope, the Additive lab for an Oscillator with an additive table), Probe output (V616), Measure from here (adds a Transfer Analyzer wired to the box through one batch, the MEASURE integration of V418), Bypass (K022's generic bypass), Listen here (V625 when it lands), Duplicate, Group (V601 when it lands; absent until then, never a disabled item without a reason), Help (the registry help, as the node reference shows it), Delete. Every item is a real command of the one command table."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
