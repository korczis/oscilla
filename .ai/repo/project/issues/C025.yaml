  - "tests/browser/navigation.cjs opens Synth, navigates away and reloads, and asserts no unsaved-work prompt; after a knob turn it asserts the prompt; waits through tests/browser/lib/wait.cjs until() with named deadlines, through tests/browser/lib/suite.cjs, nothing added to tests/browser/timing-baseline.json (project.suite-harness, project.bounded-test-timing)."
  - "Undo after the first edit returns the document to clean, and a saved project that contains the default voice reopens clean."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
  - "If the change reaches a guarded path (src/js/studio/*) the pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml (project.review-verdict)."
  - "Lands after the feature train #367 (Synth workspace K062)."
