objective: "Lands as feat(studio). Every new parameter on an existing node type lands here, once (D2): oscillator unison and spread, filter slope 12/24, sync on LFO, Step and Random, Step quantize, and a generic bypass (edge mute needs no new property: every edge already has muted). STUDIO_HASH_VERSION is bumped with a migration (src/js/studio/migrate.js); a document or experiment saved under the earlier version reloads stating \"saved under hash v1, migrated\" with its original hash kept in provenance. ADR 0030 carries a note and the pull request lists every re-pinned template. It is a model change with no new chrome: the new parameters get their Inspector controls from the existing parameter rendering, so it waits on the template pack it re-pins (K014) and not on the Wave 2 chrome."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
