acceptance_criteria:
  - "STUDIO_HASH_VERSION is bumped exactly once and every new parameter of the list is in that bump, in a unit test that fails on the merge base."
  - "A document and an experiment saved under hash v1 reload with \"saved under hash v1, migrated\" and their original hash in provenance; their render is unchanged with the new parameters at their defaults."
  - "The pull request lists every re-pinned template, and ADR 0030 carries the note."
  - "The pull request carries a reviewer's verdict (src/js/studio and src/js/experiments is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first). It adds no markup, osc-* class token or stylesheet selector, so the Flowbite Pro ratchet stays flat (node --test tests/unit/ui-flowbite-pro.test.mjs). A capped file it grows past its cap is split first or its raise is declared in tests/unit/source-size-baseline.json's raises ledger."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
