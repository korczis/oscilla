title: "Step grid kind: lanes, pages, range edit and a playhead on the audio clock, first on the Step Modulator's steps"
slug: step-grid-kind-lanes-pages-range-edit-and-a-playhead-on-the
priority: p1
profile: implementation
objective: "Lands as feat(studio-ui). src/js/ui/kinds/step-grid.js and its pure model (cursor, range selection, clipboard, paging, lanes of gate, value or note steps, the playing step index): role=grid, a gridcell per step with aria-selected and a name ('Step 5, 0.50, on'), aria-current=step on the playing step; keys arrows, Enter, Shift+arrows, Ctrl/Cmd+C, X, V, Delete, PageUp and PageDown a semitone (Shift an octave), [ and ] page; drag paints along a lane, a value lane drags vertically; 8 steps per page at 390 px, 16 at 1536 px; the playhead from transport.playhead() through one frame-loop subscriber that writes the DOM only when the step index changes. Events build CLIP_UPDATE for a steps clip or NODE_PARAM_SET for a list parameter. First consumer: the Step Modulator node's steps in the Studio Inspector, edited today as one comma-separated text field (VERIFIED inspector.js:182); K069 and K073 then mount the kind. Before: no step editor on main. After: a step grid by pointer, keyboard and touch. Negative cases: a paste longer than the target (the target's length kept); Delete on an empty step (no action); Space (the transport's); a value out of the parameter's range (refused with its sentence). Rollback: revert; the text field returns. Merged plan of the component follow-up (2026-10-30): Accent, slide and ratchet are buttons of the focused step's detail row and items of its menu (ContextMenu, Shift+F10), never bare letter or digit keys. K069 and K073 depend on W008 and drop their own grid model."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
