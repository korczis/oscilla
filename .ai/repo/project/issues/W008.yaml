acceptance_criteria:
- "tests/unit/ui-kind-step-grid.test.mjs fails on the merge base: every key maps to exactly one action of the expected payload (recorded through a fake commit); a paste keeps the target's length; Space builds nothing; the playhead subscriber writes only on a step change and reuses its state across ticks; a list-parameter grid builds one NODE_PARAM_SET per gesture."
- "Negative cases, each asserted by a test that fails on the merge base: the four of the objective."
- "Definition of done, tested: tests/browser/step-grid.cjs drives this kind on its first mounted consumer, the Studio Inspector's step grid of a selected notes clip (pointer drag along a lane at 1536x1024, a touch drag at 390x844 in a hasTouch page, arrows and Enter, Delete), waits with until() (deadline 'step note in model', 2 s) for the notes in the clip's notes array, undoes once per gesture, and while playing waits for aria-current to move (deadline 'step playhead moves', 3 s). The check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, runs at 1536x1024 and 390x844, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json and fails on the merge base (project.suite-harness, project.bounded-test-timing). Restated 2026-11-09 (oscilla-43): was K222's tests/browser/drums.cjs in the Drums view; K222's drums.cjs keeps its own check of the Drums view. Before 2026-11-07 it was tests/browser/ui-kinds.cjs on a Step Modulator; that check moves to K221."
- "Definition of done, extends: the notes clip of ADR 0086 and the section 79 descriptor (the list-parameter lane, first mounted by K221); interlinks: the grid's notes clip opens in the Studio timeline at the same revision."
- "Definition of done, interactivity: pointer, keyboard and touch on every step."
- "Every Studio edit it builds is one plain action the owning surface dispatches through the one Studio store; a continuous gesture is one history entry and undo and redo restore the exact serialized model; a refusal leaves model, history and runtime unchanged and the kind states the store's sentence once in the polite live region (project.studio-model-is-canonical, project.typed-ports)."
- "Definition of done, docs, menus and routes: the kind's declaration names its docs, links and tests; docs/ui-catalog.md (G014) lists it; the Keyboard shortcuts dialog lists its keys; tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Its trace entry in scripts/ui-catalog/trace/kinds.mjs names the intent criterion, this issue, its rules, ADRs and tests, each resolved by the trace check, for the Majordomus knowledge projection."
- "The kind's modules pass W001's static scan: no import of src/js/studio/actions.js, a store, sources.js or a lab module; no dispatch or owner writer called; no AudioContext, AudioNode or worklet created (project.audio-engine-discipline v2: one AudioEngine); no requestAnimationFrame, setInterval or setTimeout outside src/js/charts/frame-loop.js; no allocation in a frame callback (1000 ticks keep the same typed arrays) and frameSubscriberCount() returns to its value after destroy()."
- "Its chrome (buttons, button groups, popovers, dropdowns, inputs) is markup adapted from the matching Flowbite Pro block and names its flowbite-pro reference.md section; its instrument surface is a domain view under ADR 0061 decision 3 as J001's ADR 0061 resolution note records it: inline SVG or canvas and Tailwind utilities inside a Pro card, no stylesheet, no selector, no osc-* class token, no el.style write or style attribute; no osc-* name in the ratchet record rises and the domain views' stylesheets gain nothing (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node scripts/ui-flowbite-pro-record.mjs --check and node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "No input path of the build gains a components, widgets, ui-kit or design-system segment (the COMPONENT_LIBRARY check of scripts/ui-flowbite-pro-measure.mjs): declarations live in src/js/ui/catalog/kinds, views in src/js/ui/kinds."
- "It changes guarded paths (scripts/review-verdict.mjs GUARDED: src/js/studio/actions.js and the new src/js/studio/notes-grid.js, NOTES_GRID_SET), so it merges only with a reviewer's .ai/repo/reviews/<pr>.yaml verdict covering them (project.review-verdict; restated 2026-11-09 on review finding R2-W8-5, was 'its paths are not guarded'); as a feat change it carries a unit test that fails on the merge base (project.fail-first)."
- "scripts/size-report.mjs shows at most 9 KB gzip added (restated 2026-11-09 from 3 KB, the objective's amendment states why), compiled CSS included, with the base and head figures in the pull request body, inside the component line's cap Q037 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
