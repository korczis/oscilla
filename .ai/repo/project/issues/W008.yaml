title: "Step grid kind: lanes, pages, range edit and a playhead on the audio clock, a projection of the notes clip, first in the Drums view"
slug: step-grid-kind-lanes-pages-range-edit-and-a-playhead-on-the
priority: p1
profile: implementation
objective: "Lands as feat(studio-ui). src/js/ui/kinds/step-grid.js and its pure model (cursor, range selection, clipboard, paging, lanes of gate, value or note steps, the playing step index): role=grid, a gridcell per step with aria-selected and a name ('Step 5, 0.50, on'), aria-current=step on the playing step; keys arrows, Enter, Shift+arrows, Ctrl/Cmd+C, X, V, Delete, PageUp and PageDown a semitone (Shift an octave), [ and ] page; drag paints along a lane, a value lane drags vertically; a page of the steps its laid-out width fits, 44 px each (pageStepsFor: 4 in the Studio Inspector's 268 px side panel at 1536 px, 8 in its 350 px at 390 px; 16 with the names beside them where the width holds them, first in K222's Drums view); the playhead from transport.playhead() through one frame-loop subscriber that writes the DOM only when the step index changes. Events build CLIP_UPDATE for a steps clip or NODE_PARAM_SET for a list parameter. First consumer: the Step Modulator node's steps in the Studio Inspector, edited today as one comma-separated text field (VERIFIED inspector.js:182); K069 and K073 then mount the kind. Before: no step editor on main. After: a step grid by pointer, keyboard and touch. Negative cases: a paste longer than the target (the target's length kept); Delete on an empty step (no action); Space (the transport's); a value out of the parameter's range (refused with its sentence). Rollback: revert; the text field returns. Merged plan of the component follow-up (2026-10-30): Accent, slide and ratchet are buttons of the focused step's detail row and items of its menu (ContextMenu, Shift+F10), never bare letter or digit keys. K069 and K073 depend on W008 and drop their own grid model. Amended 2026-11-07 (Q103, the drum-view chain; ADR 0086): was 'Events build CLIP_UPDATE for a steps clip' and 'First consumer: the Step Modulator node's steps in the Studio Inspector'. There is no steps clip (ADR 0086 decisions 1, 2 and 5): a note lane is a note number, a step that is on is a note at at = i x stepBeats of the clip's grid, accent is vel >= the exported accent constant, ratchet is r, probability p, slide slide, and one gesture builds one CLIP_UPDATE of the notes array (a grid change is NOTES_GRID_SET); an off-grid note is shown as off-grid and never moved. A list-parameter lane still builds one NODE_PARAM_SET per gesture. The first mounted consumer is K222's Drums view, in the same pull request, because a kind nothing mounts is an inert surface; the Step Modulator's steps (the Inspector's comma field, inspector.js:182) move to K221, the strip with three lanes, which mounts this kind's list-parameter lane. K069 (the Synth sequencer card) and K073 then mount the same kind. Depends on K068, whose notes clips play on the audio clock with their grid fields. This slice adds the NOTES_GRID_SET action of ADR 0086 decision 2 (keep, map and refuse modes, one undo entry) to src/js/studio and bumps W001's step-grid declaration to version 2 with its grid event, re-pinning tests/unit/ui-kinds-digest.json. At 390 px the lane name sits above its row of eight 44 px steps (8 x 44 px and a name column do not fit 358 px inside the 16 px gutters); at 1536 px it sits beside the sixteen steps (K222's Drums view; in the Inspector's side panel the name sits above four steps). Amended 2026-11-09 (the coordinator oscilla-43, under the owner's order of that day to release by trains): the first mounted consumer is the Studio Inspector's step grid of a selected notes clip (src/js/ui/studio/inspector-steps.js, mounted by inspector.js; the playhead from the Studio transport through the frame loop), so W008 lands without K222; K222's Drums view mounts the same kind in its own pull request after it. The size ceiling is 9 KB gzip, restated from 3 KB with the measured breakdown (each module minified and gzipped on its own: the model 3.7 KB, the view 3.3 KB, inspector-steps 0.8 KB, NOTES_GRID_SET 1.0 KB, and about 2 KB raw of Tailwind utilities); Q037 keeps each slice's own stated ceiling, and the coordinator chose to restate it rather than trim behaviour. Restated the same day on review finding R2-W8-6: the steps per page are the ones the width fits (8 at 390 px, 4 in the Inspector at 1536 px), and sixteen beside the names is K222's."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
