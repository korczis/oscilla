objective: "Truth-table rows GEN-05 (scratchpad p05/truth-table.md). beatText branches on dual.stereo and dual.binaural: mono keeps the V1 text; split says one tone per channel, no beat in the signal, may beat acoustically over speakers depending on position, perceptual over headphones; binaural describes only the perceptual beat. sig(d, 3) and formatPeriod stay."
