title: "Audio tracks and audio clips from recordings and files"
slug: audio-tracks-and-audio-clips-from-recordings-and-files
priority: p2
profile: implementation
objective: "Lands as feat(studio). Size: big; it is split further into landable pull requests when started, each with its own fail-first test. Track kind audio and clip kind audio (enum options, D2): a clip references a buffer of the K074 sample store by id and hash (the model stays plain data), plays through an AudioBufferSourceNode on the transport into the track's channel, with offset, gain and fades; recording arms the track (arm is view state, never hashed) and writes the capture worklet's frames into a new buffer and clip while the transport plays, the recording's latency compensation stated. Before: there is no audio track or recorded take. After: audio tracks and clips from recordings and files. User-value tier 3 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document with a audio clip is then refused by the import pipeline with its sentence, so after a release the clip kind stays and the editor is removed instead."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/studio/schema.js"
  - "src/js/studio/timeline.js"
  - "src/js/studio/timeline-compiler.js"
  - "src/js/studio/transport.js"
  - "src/js/studio/clip-targets.js"
  - "src/js/studio/offline.js"
  - "src/js/measurement/capture.js"
  - "src/js/core/storage.js"
