title: "Sequencer lane: requested-frequency glyphs, readout and playhead chip"
slug: sequencer-lane-requested-frequency-glyphs-readout-and-playhe
priority: p3
profile: implementation
objective: "Lands as feat(sequencer), after K017 (and so K003) of M059, which edit the same panel and change the units of its time readout (ms or beats). Each block of the V2 sequencer lane shows an SVG glyph of its requested frequency over its duration on a shared log-Hz scale (sweep curve, flat tone, shaded noise band) from planFreqAt, the maths the compiler uses; a hover crosshair across the lane \"2.35 s . Sweep 2 . 1.84 kHz (requested)\" in the units K017 chose; a playhead chip with the current block and frequency, its text changed only when it changes; the playhead moves by transform instead of left. The lane's keys stay the timeline's own (SEQUENCER_ROWS: arrows, Alt + arrows, Del), so it is a census host of kind timeline: selecting a block by keyboard announces its requested-frequency readout through the kit's region, and no second cursor is added. Under reduced motion the playhead still moves (it is essential) and follow-scroll jumps instead of smoothing."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
