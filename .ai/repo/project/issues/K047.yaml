acceptance_criteria:
  - "tests/unit/sequencer-timeline.test.mjs, failing on the merge base: the glyph path equals planFreqAt samples."
  - "tests/browser/sequencer.cjs: hovering at a known time shows the expected readout; selecting the next block with the keyboard announces its readout once. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Its hosts, seq-timeline and seq-ruler (index.html:796 and :789 on main), move from pending to done in tests/unit/chart-host-census.json as kind timeline, and tests/browser/charts-interaction.cjs checks their role, summary and the announcement on keyboard selection; Escape and Space keep their global meaning."
  - "The readout and glyphs say \"requested\", never measured (project.no-fake-science)."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3) and after F003 placed the card it sits in; no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
  - "The visual references of the sequencer region of test:visual are re-accepted in darwin-arm64 and linux-x64, in each theme that has references (light ones exist once F011 lands), with the reason \"requested-frequency glyphs\" in the pull request body (npm run test:visual)."
  - "scripts/size-report.mjs shows at most 2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
