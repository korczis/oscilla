acceptance_criteria:
  - "Fail-first: navigation.cjs status-readout-fields no longer accepts the title: at 1536 x 1024 and 390 x 844, in the Playground, Analyzer, Presets, Measure and Studio, every readout field is displayed and lies whole inside the status bar; on the merge base it fails."
  - "The status Play of C030 stays on screen where C030 shows it and keeps its column; no control of the bar is covered (ui-current#phone-whole)."
  - "The visual references that change (tests/visual reference, measure, studio, synth) are re-accepted through the visual gate with the reason recorded, and the iphone.cjs census reach does not fall."
  - "Its chrome is Flowbite Pro and tests/unit/ui-flowbite-pro-baseline.json only falls (project.ui-uses-flowbite-pro); every string it adds is Czech (project.czech-prose)."
