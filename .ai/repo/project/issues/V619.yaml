title: "One declaration per node: face sections in defineNode and a generated node reference"
slug: one-declaration-per-node-face-sections-in-definenode-and-a
priority: p2
profile: implementation
objective: "P04 slice A (model invariants and round-trip). defineNode (src/js/studio/nodes/common.js) accepts face: { sections: [{ label, params: [parameter ids] }], primary: [ids shown while collapsed], view: 'level' | 'waveform' | 'response' | 'spectrum' | 'scope' | 'none' }; every parameter of the type is in exactly one section (owner decision Q031 of 2026-10-29: every parameter is on the face), primary lists at most three, and the registry refuses a face that misses or repeats a parameter. Every shipped node type declares one; the face is drawn by V622 and V620. scripts/studio-node-reference.mjs writes docs/v31/node-reference.md from NODE_REGISTRY (category, aliases, ports with type and role, parameters with unit, range, default and flags, face sections, help); npm run docs:nodes writes it and --check, run by npm test, fails when it is stale. tests/unit/studio-face-declaration.test.mjs is table-driven over the registry for the face, help and aliases; the contract over every parameter (unit, range, mapping, automatable, modulatable, deep-link address) is synth K105's and is not repeated here. The registry is not in the model, so no studioHash changes. Program B (the patch bay contract, owner programs of 2026-11-03, with dev-53's K164 matrix): defineNode and src/js/studio/ports.js also declare (1) PORT_KINDS per port type: channels, rate (audio | control | event), unconnected behaviour (silent | default value | normalled), default cardinality, monitor and compact eligibility, the side a port sits on (west | east | north | south; the input a layout engine needs for port constraints, owner order of 2026-11-03 on fewer crossings) and a version; (2) CABLE_KINDS: shape, dash, width, layer (drawn behind or in front of the audio cables), rest emphasis (full, or faded until its node or port is hovered, focused or selected), noun and the configurable fields (amount, polarity, offset, smoothing), one table the bay and the graph draw from; control cables declare a thinner dashed line behind the audio cables, faded at rest, because b0's layout spike of 2026-11-03 found every crossing of the 100- and 300-node graphs on modulation cables (58 % of the edges) and none on audio cables; (3) a declared label on every port; (4) a parameter `live` rule, immediate | note | step | block | apply, derived per adapter from what runtime.js does (an AudioParam it sets without a rebuild is immediate, a value a voice reads at note-on is note, a change that rebuilds the node in the runtime transaction is block) and written where it is derived into the port's or parameter's `defaulted: [...]` list, so K164's matrix counts it as defaulted, not missing. The four are registry declarations, not model fields, so no studioHash changes."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
