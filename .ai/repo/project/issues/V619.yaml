title: "One declaration per node: face sections in defineNode and a generated node reference"
slug: one-declaration-per-node-face-sections-in-definenode-and-a
priority: p2
profile: implementation
objective: "P04 slice A (model invariants and round-trip). defineNode (src/js/studio/nodes/common.js) accepts face: { sections: [{ label, params: [parameter ids] }], primary: [ids shown while collapsed], view: 'level' | 'waveform' | 'response' | 'spectrum' | 'scope' | 'none' }; every parameter of the type is in exactly one section (owner decision Q031 of 2026-10-29: every parameter is on the face), primary lists at most three, and the registry refuses a face that misses or repeats a parameter. Every shipped node type declares one; the face is drawn by V622 and V620. scripts/studio-node-reference.mjs writes docs/v31/node-reference.md from NODE_REGISTRY (category, aliases, ports with type and role, parameters with unit, range, default and flags, face sections, help); npm run docs:nodes writes it and --check, run by npm test, fails when it is stale. tests/unit/studio-face-declaration.test.mjs is table-driven over the registry for the face, help and aliases; the contract over every parameter (unit, range, mapping, automatable, modulatable, deep-link address) is synth K105's and is not repeated here. The registry is not in the model, so no studioHash changes."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
scope:
- src/js/studio/nodes
