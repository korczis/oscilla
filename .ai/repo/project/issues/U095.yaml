title: "On an iPhone the docked keyboard never covers a Synth control: WebKit honours the dock's room"
slug: on-an-iphone-the-docked-keyboard-never-covers-a-synth-control
priority: p0
profile: implementation
objective: "Lands as fix(ui), built by 26. 21's rebuilt tests/browser/iphone.cjs (test/iphone-suite 0f27696f) shows that in WebKit at the iPhone 13 and iPhone SE profiles, 81 Synth controls are covered at their centre by the docked keyboard after scrollIntoView, while Chromium and Firefox have 0. The likely cause is that WebKit ignores the dock's scroll-padding, which makes it a real iPhone Safari defect. After: every Synth control scrolled into view sits wholly above the docked keyboard in all three engines at both profiles, by a mechanism WebKit honours (for example scroll-margin on the controls or an explicit offset for the dock's measured height), not by WebKit-specific branching in the UI."
why: "Owner order of 2026-11-02, 'no sound on phone must not happen' and the phone-whole criterion; found by 21's iPhone suite on 2026-11-05 and relayed by b0. A covered control is unreachable on the owner's phone."
