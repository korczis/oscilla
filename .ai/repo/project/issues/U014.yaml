acceptance_criteria:
  - "Fail-first: tests/unit/device-limit-copy.test.mjs reads src/index.html, src/js/charts/device-panel.js and docs/GLOSSARY.md and fails on the merge base: the label of [data-osc=\"device.safeMax\"] is 'Digital limit' and contains no 'safe' (case-insensitive); the value element carries aria-describedby naming an element whose text is built from SAFE_NYQUIST_PERCENT_TEXT and names Nyquist; no literal 0.95 or '95 %' is written in the panel's markup or module; docs/GLOSSARY.md has a '**Digital limit.**' entry naming SAFE_NYQUIST_FACTOR."
  - "The check 'device panel shows the real sampleRate, Nyquist and safe max' of tests/browser/labs.cjs is extended in chromium, firefox and webkit: the label reads 'Digital limit', the described-by text reads '95 % of Nyquist', the value equals sampleRate / 2 × SAFE_NYQUIST_FACTOR of the running context, and before audio starts the value is '—' with the derivation still present."
  - "node --test tests/unit/no-fake-science.test.mjs passes and the panel copy holds no frequency-safety phrase (project.no-fake-science)."
  - "It adds no osc-* class token, selector, legacy surface or inline style; the label and description use Flowbite Pro helper text or tooltip markup with literal Tailwind utilities, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes) and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro)."
  - "Every new or changed browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "Definition of done, extends: the Device & Limits readout gains its stated derivation and a glossary term shared with the spectrum marker and the preset refusal."
  - "Definition of done, interlinks: the label uses DIGITAL_LIMIT_LABEL's word, the description is composed from SAFE_NYQUIST_PERCENT_TEXT, and docs/GLOSSARY.md links the term to src/js/core/constants.js and the Device & Limits panel."
  - "Definition of done, interactivity: the derivation is reachable by keyboard and screen reader through aria-describedby (and the Pro tooltip on focus where one is used); the value still follows the running sample rate."
  - "Definition of done, docs, menus and routes: docs/GLOSSARY.md gains 'Digital limit'; tests/README.md gains the row of tests/unit/device-limit-copy.test.mjs and the extended labs.cjs description; no menu or route changes (stated)."
  - "Definition of done, tested: tests/unit/device-limit-copy.test.mjs, tests/unit/no-fake-science.test.mjs and tests/browser/labs.cjs; dist is rebuilt and npm run build:check passes."
  - "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
