id: K151
milestone: M067
serves:
- "connected-instrument#patch-bay-generic"
title: The patch bay is drawn as hardware, with plates, nuts, plugs and cable sheen
slug: the-patch-bay-is-drawn-as-hardware
priority: p2
profile: implementation
objective: "Draw the generic patch bay (ui/patch/patch-bay.js) as a hardware panel, for every source: each module is a raised plate with its cable colour as a strip along the top (the label names it, never colour alone) and two screws; each jack sits in a hex nut; each cable ends in a plug seated in both its jacks in the cable's colour and carries a thin sheen, and a hovered cable thickens. Plates, nuts and plugs take no pointer (the jacks and cables under them do) and every shape sets its own stroke. Colours come only from the panel tokens. The style is generic hardware, never a product's."
why: "Owner direction of 2026-11-02, in Czech: \"patchbay ... viditelne, hezke, sexy, funkni\", \"vic visible\", \"vic visual\" and \"vylepsi patchbay\". The bay was a flat grid of glyphs on the card, its modules told apart by labels alone and its cables ending in nothing."
scope:
- src/js/ui/patch/patch-bay.js
- tests/unit/patch-bay-hardware.test.mjs
- tests/README.md
- .ai/repo/project/issues/K151.yaml
- dist
depends_on:
- K150
acceptance_criteria:
- "Before: VERIFIED: the bay draws glyphs and labels on the card with no module surface, and a cable ends at the jack's centre with nothing seated."
- "After: every module has a plate with its cable colour strip and two screws, every jack a hex nut, every cable two plugs of its colour and a sheen; the jacks' rings, focus, labels and hit targets are unchanged."
- "Negative cases: a tap on a plug or a plate reaches the jack or the cable under it; no shape inherits the legacy svg stroke; both themes hold the jack-ring and cable contrast of s-look."
- "Rollback: revert the merge commit; no stored record or schema changes."
validation:
- node --test tests/unit/patch-bay-hardware.test.mjs
- node tests/browser/synth.cjs
evidence_required:
- verified
created_at: '2026-11-02'
updated_at: '2026-11-02'
