title: "Scrolling spectrogram composed on the GPU from the K033 level history, the Canvas 2D path its twin"
slug: scrolling-spectrogram-composed-on-the-gpu-from-the-k033-leve
priority: p2
profile: implementation
objective: "Lands as feat(charts) with a guarded part. The slice begins by measuring its own design against the Canvas 2D twin under Y002's measure on the hardware legs, the 256 x 1 LUT texture included (Y001's shader coloured by an arithmetic ramp), and the cost of a LUT change against the recolour K033 plans (on main a LUT change clears the history, spectrogram-view.js:220); the figures are in the pull request before any host is wired, and where GL does not pay the slice stops at the Canvas 2D path, GL opt-in by ?gl=2 or the Settings choice. The GL view is a compositor of the level history K033 stores (one Uint8 level index per device pixel over its fixed dB range), never a second spectrogram: the history stays CPU-held in analysis/spectrogram.js, which gains one read-only accessor for the ring, its head index and its axes. Per frame the columns push() wrote since the last draw are uploaded: n of them, because columns advance with wall time (spectrogram.js:18-20 and 304-311: a 2 000-device-pixel ring over the default 10 s advances 200 columns per second, 3.3 per 60 Hz frame, more after a dropped frame), n clamped to the ring width as push() clamps it. A run that crosses the ring's end is split, so a frame makes at most two texSubImage2D calls: R8 on WebGL 2 straight from the CPU ring through UNPACK_ROW_LENGTH and UNPACK_SKIP_PIXELS, LUMINANCE on WebGL 1 from a column buffer preallocated at mount for the worst case, the ring's full W x H, since WebGL 1 has no row-length unpack. One quad samples the ring with NEAREST filtering at the ring offset, the coordinate in highp, or by integer texelFetch on WebGL 2; a WebGL 1 context whose fragment shader has no highp (GL_FRAGMENT_PRECISION_HIGH undefined, as on some phone GPUs, where mediump cannot address each column of a ring 2 000 or more wide) takes the Canvas 2D twin with the reason 'Canvas 2D: no highp in this GPU's fragment shader', so the old two-blit compose and its ImageData leave the GL path. Colour is a 256 x 1 LUT texture from K027's palette, so a theme change, a floor and ceiling change or a colour-key drag (K033) rewrites 1 KB instead of recolouring W x H bytes on the CPU. The orientation is K025's time-down view. The three spectrogram hosts (analysis panel, analysis tab, mic) mount through createLiveView with the existing Canvas 2D compose as the twin; the cursor, keyboard row and column, readout ('-3.2 s', quantized +-0.3 dB) and colour key stay K033's and K053's, drawn on the overlay above the GL canvas. The frequency axis does not zoom (OD11 of the charts plan stands)."
why: "Owner orders of 2026-10-29 (session oscilla-b0, in Czech): add p5.js, WebGL and interactivity and deploy; plan WebGL renderers for the scrolling spectrogram (with a 3D option), a phosphor XY scope and a live spectrum, falling back to canvas/p5 when WebGL is unavailable, one frame loop with no per-frame allocation, the single file and its gzip budget, axes and units from the analysis (no-fake-science). Built on the M062 charts plan (#269, merged as cdda563c): the frame loop K036, the interaction kit K053, the shared zoom K052, the level history K033 and the chart-cost check of K036 are reused, never duplicated (components-followup/render-gl.md)."
