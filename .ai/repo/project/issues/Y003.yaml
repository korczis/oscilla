acceptance_criteria:
- "As a feat change it carries tests/unit/gl-spectrogram.test.mjs: the ring offset maps column c at head h to the texture column the shader samples for every c and h; the LUT texture bytes equal K027's LUT for each theme; a range change rewrites only the LUT; the ring accessor returns the same buffer object across frames; a run of n columns that wraps the ring's end is uploaded as two ranges whose union is exactly the columns written, and n equal to the ring width as one full upload; a fake WebGL 1 context without fragment highp gets the twin with its reason; which fails on the merge base (project.fail-first)."
- "tests/unit/gl-views-wording.test.mjs is created by this slice and fails on the merge base: its static scan finds no sample-rate, Nyquist or dB-range literal under src/js/charts/gl (Y002's modules included) and the spectrogram strings are registered; Y004 to Y006 extend it."
- "tests/browser/gl-parity.cjs: a synthetic level ring (every index 0-255 in known cells, with the head mid-ring) drawn on GL and on Canvas 2D gives the same RGBA within 1 per channel at each named cell centre, in each theme, after a theme toggle and after a range change; the history survives a context loss (the twin shows the same rows) and a restore. Every GL check states per gate browser and OS whether it drew on WebGL 2, WebGL 1 or was skipped and the renderer string it observed, and asserts the observed backend against Y002's expectation table, failing on a mismatch (no leg claims a GL path it did not draw), and the same check runs with ?gl=0 on every leg and passes on the Canvas 2D path. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
- "tests/browser/chart-cost.cjs gains the spectrogram rows: its GL subscriber is a frame-loop subscriber with its host (K036) and allocates nothing per tick (Y002's differential figure: Chromium CDP heap sampling over the same window with the view on GL, on ?gl=0 and unmounted, the view's increment at most 128 B per frame on each backend; the page-wide per-tick ceiling of tests/browser/chart-cost-baseline.json not raised); its draw calls per frame are counted by the gl.cjs spy and stay at the stated figure (at most two texSubImage2D and one draw); its cost is measured by Y002's measure (five interleaved windows of 300 frame calls per backend timed as one interval, the synced figure and the live rAF figure, the minimum detectable difference and the hardware legs that decide) and recorded for the GL and the Canvas 2D path in tests/browser/chart-cost-baseline.json, with the figures in the pull request; the GL path is the automatic choice only where it is faster beyond that difference on every hardware leg, and a tie or a loss keeps the 2D path automatic, the baseline saying why; nothing is drawn while the host is hidden or Pause animation is on."
- Its three hosts keep their done census entries and gain the backend list; the charts-interaction pass holds on both backends.
- "The view reads existing AnalyserNodes or the CPU-held analysis data on the main thread only, creates no audio node, adds no work to the audio path and writes no DOM per frame (project.audio-engine-discipline v2)."
- "Levels say dB relative (dBFS-like) unless a valid LevelCalibration applies; every axis, tick, unit and caption comes from the analysis descriptor axesOf() and never from a constant (the static scan of tests/unit/gl-views-wording.test.mjs finds no sample-rate, Nyquist or dB-range literal under src/js/charts/gl); no data value is tweened or eased; every string it adds is registered in its chart's wording table and passes tests/unit/charts-readout-wording.test.mjs; the word waterfall is never displayed (D7; it stays a search alias only) (project.no-fake-science)."
- "Memory is stated in the pull request: the CPU ring (W x H bytes, K033) plus one texture of the same size per mounted GL host and, on WebGL 1, the W x H column buffer."
- "It changes guarded paths (src/js/analysis/spectrogram.js, the ring accessor only), so the pull request carries a reviewer's .ai/repo/reviews/<pr>.yaml for the content it changes (project.review-verdict)."
- "The visual references of the spectrogram regions are taken with ?gl=0 and stay unchanged (the 2D twin is the reference, Q050); if a region moves, it is re-accepted in darwin-arm64 and linux-x64 in each theme that has references, with the reason in the pull request (npm run test:visual)."
- "It adds no markup, class name or stylesheet rule, so the Flowbite Pro ratchet is unchanged (node --test tests/unit/ui-flowbite-pro.test.mjs and node scripts/ui-flowbite-pro-record.mjs --check pass with the record untouched), and no new string or module name carries an osc- prefix (ADR 0061)."
- "The owner's definition of done, one item each: extends the K033 spectrogram with a GPU path; interlinks the three spectrogram hosts through one view and OSCILLA.charts.renderers(); interactive: the K033 cursor, keyboard and readout on both backends; docs, menus and routes: docs/renderers.md lists the view, README's Testing table names gl-parity.cjs; tested with pointer, keyboard and touch; deployed by merge commit under project.deploy-often (Pages deploys on the merge)."
- "Designed at 390x844 first: every check runs at 390x844 and at 1536x1024, touch targets are at least 44 px, and each gesture has a pointer, a keyboard and a touch path."
- "scripts/size-report.mjs shows at most 2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the Y line's figures stays within the component line's cap Q037 records, under the gzip budget of scripts/build-config.mjs (1 200 000 B since #279 landed, BUDGET.gzipBytes of scripts/build-config.mjs; dist measured 825 984 B gzip at f887066f; project.single-file-deliverable)."
- "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
