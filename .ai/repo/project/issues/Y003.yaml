title: "Scrolling spectrogram composed on the GPU from the K033 level history, the Canvas 2D path its twin"
slug: scrolling-spectrogram-composed-on-the-gpu-from-the-k033-leve
priority: p2
profile: implementation
objective: "Lands as feat(charts) with a guarded part. The GL view is a compositor of the level history K033 stores (one Uint8 level index per device pixel over its fixed dB range), never a second spectrogram: the history stays CPU-held in analysis/spectrogram.js, which gains one read-only accessor for the ring, its head index and its axes. Per frame the newest column is uploaded with one texSubImage2D (R8 on WebGL 2, LUMINANCE on WebGL 1 from the preallocated column buffer), and one quad samples it with NEAREST filtering at the ring offset, so the old two-blit compose and its ImageData leave the GL path. Colour is a 256 x 1 LUT texture from K027's palette, so a theme change, a floor and ceiling change or a colour-key drag (K033) rewrites 1 KB instead of recolouring W x H bytes on the CPU. The orientation is K025's time-down view. The three spectrogram hosts (analysis panel, analysis tab, mic) mount through createLiveView with the existing Canvas 2D compose as the twin; the cursor, keyboard row and column, readout ('-3.2 s', quantized +-0.3 dB) and colour key stay K033's and K053's, drawn on the overlay above the GL canvas. The frequency axis does not zoom (OD11 of the charts plan stands)."
why: "Owner orders of 2026-10-29 (session oscilla-b0, in Czech): add p5.js, WebGL and interactivity and deploy; plan WebGL renderers for the scrolling spectrogram (with a 3D option), a phosphor XY scope and a live spectrum, falling back to canvas/p5 when WebGL is unavailable, one frame loop with no per-frame allocation, the single file and its gzip budget, axes and units from the analysis (no-fake-science). Built on the M062 charts plan (#269, merged as cdda563c): the frame loop K036, the interaction kit K053, the shared zoom K052, the level history K033 and the chart-cost check of K036 are reused, never duplicated (components-followup/render-gl.md)."
