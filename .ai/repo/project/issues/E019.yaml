title: "A browser check that a Studio measurement refuses a Master Output level other than the run's"
slug: a-browser-check-that-a-studio-measurement-refuses-a-foreign-output-level
priority: p3
profile: implementation
objective: "#197 R-4 and docs/v31/review-v272.md, Open, 'a browser check of the A5 level wiring': V272 I2 wired A5's level refusal into the app (src/js/ui/studio/workspace.js passes outputLevel: cmp.gainLevel to the measurement hand-off), and the R-2 unit tests exercise outputLevel against the hand-off, but no browser check proves that the refusal reaches the user in the page. Add a check to tests/browser/v31-studio-workflows.cjs: with a measurement clip in the Studio, a Master Output level other than the MEASURE output level makes the run fail with its reason shown to the user, and an equal level runs."
why: "Review verdict .ai/repo/reviews/197.yaml, finding R-4, and the builders' follow-up in docs/v31/review-v272.md: the unit tests hold the recipe side only, so a regression in the workspace wiring would pass every unit test."
scope:
  - "tests/browser/v31-studio-workflows.cjs"
  - "tests/README.md"
acceptance_criteria:
  - "The new check fails when outputLevel is removed from the hand-off in src/js/ui/studio/workspace.js (a local mutation the evidence records) and passes on the unmutated head in chromium, firefox and webkit (the CI run is named in the evidence)."
  - "The refused run's reason is read from the page (the text the user sees or the live-region announcement), not from a module's return value."
  - "Every wait goes through tests/browser/lib/wait.cjs with a named deadline (project.bounded-test-timing), the suite stays on tests/browser/lib/suite.cjs (project.suite-harness), and tests/browser/timing-baseline.json does not grow."
  - "tests/README.md's row for v31-studio-workflows names the check."
validation:
  - "npm run release-gate"
evidence_required:
