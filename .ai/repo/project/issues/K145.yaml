acceptance_criteria:
  - "Fail-first: tests/unit/midi-route.test.mjs asserts that with workspace 'studio' and a document holding a Keys node the route returns a sink that drives that node, and that with no note-playing node the note is refused with a stated reason; it fails on the merge base (route returns null outside 'synth')."
  - "tests/browser/midi.cjs presses a computer key in the Studio workspace with a Keys-to-FM document and waits with until() (deadline 'studio note sounds', 2 s) for the engine's census to show the document's voice and none of the V502 voices; the check runs through tests/browser/lib/suite.cjs, assumes no sample rate and adds nothing to tests/browser/timing-baseline.json (project.suite-harness, project.bounded-test-timing)."
  - "The Playground and Synth routes are unchanged (their existing checks pass)."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
  - "If the change reaches a guarded path (src/js/studio/*, src/js/audio/*) the pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml (project.review-verdict)."
  - "Lands after the feature train #367 (MIDI V502, keys K026, Synth workspace)."
validation:
