title: "In the Studio workspace the keyboard and MIDI play the document's instrument, not the Playground voice"
slug: in-the-studio-workspace-the-keyboard-and-midi-play-the-documents-instrument
priority: p2
profile: implementation
objective: "Lands as fix(midi). src/js/midi/ui.js:60 routes notes to a workspace sink only when cmp.workspace === 'synth' (synthSink); in every other workspace, the Studio included, the computer keys, the on-screen keys and MIDI play a V502 engine voice built from the Playground's tuning, waveform and envelope, while the Studio document's Keys node and Engines stay silent. Before: with a Studio document whose Keys node drives an FM engine open in the Studio workspace, pressing a key sounds a Playground sine. After: in the Studio workspace notes play the document's instrument through the same transport.live path synthSink uses (the node metadata.noteTarget names when #375 has landed, otherwise the document's Keys node), with the same refusals and owners; a document with no note-playing node says so once and plays nothing, rather than sounding the Playground voice. The Playground keeps the V502 voice. Rollback: revert; no saved state changes."
why: "Review of the feature train #367 (oscilla-af, verdict at 5cad3dcf, finding F3 'D2', P2): in the Studio workspace keyboard and MIDI play the Playground engine voice, not the document's Keys or Engines. The piano-keyboard criterion says one piano component plays the Keys node in the Synth workspace and the Studio."
