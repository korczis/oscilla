acceptance_criteria:
  - "tests/unit/studio-steps-playback.test.mjs, failing on the merge base, asserts on StudioFakeContext (tests/unit/sequencer-fake-audio.mjs) the scheduled calls, times, ramps and node census; tests/browser/instrument-dsp.cjs, rendering a real OfflineAudioContext in Chromium, Firefox and WebKit at each context's own rate (in the style of tests/browser/dsp.cjs) and failing on the merge base, checks the figures: every step onset is within one frame of its computed time at 120 and 97 BPM, with swing 50 and 66; a ratchet of 3 gives three onsets per step; a slide step has no gate onset and reaches its pitch within the glide time; two renders of a pattern with probability 0.5 are identical and change when the seed changes; a tempo change rescales the onsets; the node census is 0 after stop; tap tempo of four taps 500 ms apart sets 120 BPM."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: probability 0 and 1; ratchet 4 at 1/32 at the tempo maximum; a tempo change while playing; stop with a ratchet pending."
  - "A browser check in tests/browser/steps.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a steps clip on the panel's Keys node plays the panel in the Synth workspace and in the Studio from the same transport, and the Studio playhead and the Synth playhead show the same position. Real-time: the playing step index read from the page follows transport.playhead(); a tempo changed while playing changes the measured onset interval in the runtime's debugInfo, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: Play and Stop by pointer, Space and touch; Tap by pointer, Enter and touch; the transport group's buttons and the tempo spinbutton are asserted in the accessibility tree. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 4 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
