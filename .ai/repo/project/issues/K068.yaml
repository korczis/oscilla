title: "Steps playback on the audio clock: swing, ratchet, slide, accent, seeded probability, tap tempo"
slug: steps-playback-on-the-audio-clock-swing-ratchet-slide-accent
priority: p1
profile: implementation
objective: "Lands as feat(studio). The timeline compiler compiles each look-ahead window of a steps clip into note events, and the transport applies them to the target's notes() or hit() on the audio clock at baseTime + beats x 60 / tempo on whole frames: swing delays odd steps by (swing / 100 - 0.5) x 2 x step; a ratchet of r plays r equal hits in the step; a slide glides the Keys pitch without a new gate; an accent raises velocity by 0.25 (capped at 1); a step plays iff mulberry32(seed ^ pass ^ index) < probability, so live and offline play the same hits; transpose and scale apply at compile time. Tempo is transport.tempo; tap tempo (the mean of the last four taps within 2 s, clamped) is one TRANSPORT_SET per tap series. The one timer stays the bookkeeping wake-up. Before: a steps clip does not play. After: steps play within one frame of their computed time, live and offline alike. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; steps clips stay valid data that play nothing, which the transport lists in debugInfo().unplayed with its reason. Merged plan of the component follow-up (2026-10-30): Tap tempo is W006's pure tapTempo(taps, now); this slice calls it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
