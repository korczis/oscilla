acceptance_criteria:
- "tests/unit/control-menu.test.mjs fails on the merge base: the item list for a table of specs and providers (modulatable or not, automatable where a lane plays or not, MIDI available or not, disabled control) is the expected set, each disabled item with its reason."
- "Definition of done, tested: tests/browser/v31-studio-graph.cjs and tests/browser/labs.cjs open the menu of a Filter cutoff by right-click, the ContextMenu key, Shift+F10 and a hasTouch long-press, choose Reset, Type a value and Copy link, and wait with until() (deadline 'control menu applied', 2 s) for the value, the clipboard text and the focus to land. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), runs at 390x844 and at 1536x1024, adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, extends: the Inspector's Automate action and the knob menu that K058 describes."
- "Definition of done, interlinks: Copy link, Modulate, Automate and What is this each open another view: each is a row of tests/browser/integration-map.json."
- "Definition of done, interactivity: every control gains reset and a link by pointer, keyboard and touch."
- "Definition of done, docs, menus and routes: the Keyboard shortcuts dialog lists ContextMenu and Shift+F10; docs/v31/user-guide.md describes the menu once. tests/README.md has a row for each new test; the parameter's or view's catalogue entry names its docs, links and tests (G001 trace part); dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (named by its flowbite-pro reference.md section) with Tailwind class lists only; the knob arc and the band are inline SVG with Tailwind utilities under the ADR 0061 resolution note of K058; it adds no osc-* class token, no legacy vocabulary use and no selector, and the domain views' stylesheets gain nothing; the record's debt does not rise (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 1.2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the line's sum stays within its row of the cap Q037 records, under the 1.2 MB gzip budget of scripts/build-config.mjs (project.single-file-deliverable)."
