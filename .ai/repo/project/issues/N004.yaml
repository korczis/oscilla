id: N004
milestone: M112
serves:
- "parameter-controls#generated-views"
title: "One control menu for every control: reset, type a value, copy link, modulate, automate, MIDI learn and what is this"
slug: one-control-menu-for-every-control-reset-type-a-value-copy-lin
priority: p2
profile: implementation
objective: "Lands as feat(ui). src/js/ui/kinds/param/control-menu.js: one Pro dropdown for every control, opened by right-click, the ContextMenu key, Shift+F10 or a 500 ms long-press, closed by Escape with focus back on the control. Items come from the spec and the owner's MenuProvider: Reset to default (with the default's text), Type a value (number, integer, list), Copy link to this parameter (its G007 address or the K105 deep link), Modulate <label> (spec.modulatable; K076 supplies the action), Automate <label> or Show <label> lane (spec.automatable where a lane plays; the Inspector's existing texts, inspector.js:198), Learn MIDI controller (K077 supplies it), What is this? (G015). An item that does not apply here is listed disabled with its reason: no compatible source (canConnect's reason), no lane would play here (clipTarget's reason, the Inspector's 'No automation: ...'), Web MIDI not available (ADR 0058's support-state sentence). K076, K120 and K077 add their actions to this menu; none builds a knob-only menu. Before: VERIFIED only the Inspector offers Automate, as a button; nothing offers reset or a link. After: one menu on every control. Negative cases: each disabled item with its reason; long-press cancelled by a move over 10 px; the menu on a disabled control (only What is this and Copy link). Rollback: revert."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, KB and interlinking; full DAW, full sequencer, full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels in one generic way, integrated with Majordomus; every element tweakable; mobile first; the landing easy to use, easy to extend and open to hack. Owner decisions: knobs that always show value and unit (D11, Q018, the ADR 0058 note of 2026-10-29), every parameter on the box face (Q031), the generator in its own workspace (Q033). Design: the params-controls part of the component follow-up of 2026-10-29 (scratchpad components-followup/params-controls.md), checked against origin/main b67d1e58 and the head of plan pull request #285 (c0a631b2)."
