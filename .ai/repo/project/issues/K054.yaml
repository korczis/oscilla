objective: "Lands as fix(measure). LINE_STYLES.unreliable and LINE_STYLES.context are alpha 0.45 in src/js/measurement/views/common.js:80-81 (guarded), 1.6-2.9:1 on the plot surface, and in light no alpha below 1.0 lifts --osc-green to 3:1. The renderer draws a series exactly as its descriptor says (measure-charts.js header), so the change is made in the descriptors, under a reviewer's verdict, never by overriding alpha in the renderer. A descriptor carries emphasis (primary, context, unreliable, invalid) instead of a bare alpha for fading: the palette resolves role x emphasis per theme to a colour validated at 3:1 (K027) in light always, and in dark only if Q009 answers (b); under (a) the dark faded colours keep today's contrast and are named exceptions in chart-palette, and no dark reference moves. Context lines are 1 px against the primary's 1.5 px (LINE_STYLES.primary on main) and carry a direct \"context\" label; unreliable keeps its dash, and the marker and peak-hold lines (LINE_STYLES.marker and peakHold) keep theirs and are named in the legend, so on a measured curve a dash means only unreliable; and INVALID keeps a signal of its own (the INVALID badge plus emphasis invalid) instead of the alpha cap of response-chart.js:391, so raising the faded contrast does not hide it. ui/measure's test of d.alpha < 1 (ui/measure.js:843 on main) reads emphasis. Which dark references move is Q009's answer."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
