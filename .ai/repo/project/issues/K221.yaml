title: "A step-sequencer strip above the Synth face plays the panel's Keys from a notes clip grid"
slug: a-step-sequencer-strip-above-the-synth-face
priority: p2
profile: implementation
objective: "Lands as feat(synth). Q103 (2): a strip of 8 or 16 steps above the Synth panel, each with a pitch, a gate and an on-light, playing the panel's Keys on the transport. It is the Step Modulator node's face with three lanes (pitch and two control voltages, as the reference's 16 steps by three channels), its outputs typed control ports a cable patches to the Keys or any parameter, and its steps a grid projection (ADR 0086), mounted through the one step-grid kind (W008) that the drum machine (K073) mounts too, never a second grid model; until W008 exists it waits."
why: "Owner direction Q103 (the analog sequencer above the semi-modular face)."
scope:
  - "src/js/synth/ui.js"
  - "src/index.html"
  - "tests/unit/synth-step-strip.test.mjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K068"
  - "W008"
acceptance_criteria:
  - "Fail-first unit: toggling step 5 adds or removes the grid note of the strip's notes clip and the transport plays it at step 5's onset on the audio clock."
  - "The strip and the drum machine (K073) mount the same step-grid kind (W008)."
validation:
  - "node --test tests/unit/synth-step-strip.test.mjs"
evidence_required:
  - "verified"
