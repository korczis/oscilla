profile: implementation
objective: "Lands as fix(synth) with fix/derived-workspace-lists. Opening #m=synth inserts the semi-mono panel into the Studio document by itself (src/js/synth/insert.js insertDecision); the Studio's dirty tracker (src/js/studio/library.js createDirtyTracker) then counted the panel as an unsaved edit, so a later #m=studio&st=basic-tone was refused with 'this Studio has unsaved changes' and the template dialog took focus. After: createDirtyTracker().rebaseFresh(before, after) re-bases a never-saved document whose model was still the baseline, and src/js/synth/ui.js ensurePanel calls it for the automatic insertion only (never Insert)."
why: "Found 2026-11-06 by oscilla-2b: tests/browser/first-screen.cjs began to read every workspace from WORKSPACE_IDS, Synth included, and its in-page link pass failed every Studio row after link:m=synth (main passes, 104/104, because it never visited Synth). A user who looks at the Synth and then follows a template link meets an unsaved-changes refusal for work they never did."
