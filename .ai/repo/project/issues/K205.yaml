id: K205
milestone: M064
serves:
  - "connected-instrument#knob-control"
title: "Knob wheel: no turn without focus and Ctrl or Cmd, as K058 criterion 4 is written"
slug: knob-wheel-no-turn-without-focus-and-ctrl-or-cmd-as-k058-cri
priority: p1
profile: implementation
objective: "Lands as fix(synth). K058's objective and criterion 4 say a knob takes no wheel unless it is focused and Ctrl or Cmd is held, and make a wheel event without focus and modifier a negative case. The shipped knob does the opposite: src/js/synth/gestures.js:58-79 turns the knob under the pointer on a plain wheel, focused or not, and leaves Ctrl or Cmd (a pinch) and a horizontal swipe to the page (21's R8); tests/browser/synth.cjs s-feel asserts that ('the wheel turns the knob under the pointer'). No owner direction supports the shipped wheel (Q018 names knobs with a number shown and nothing about the wheel), so the criterion is not re-scoped. This brings the wheel to the criterion: a plain wheel over a knob scrolls the page and leaves the value; Ctrl or Cmd with the wheel on the focused knob turns it, a burst one undo entry, without zooming the page. If the owner decides for the shipped wheel instead, that answer is recorded as a Q issue and supersedes this issue and K058's wheel clause, never by a silent edit. Before: the wheel turns any knob under the pointer. After: only the focused knob, with Ctrl or Cmd. Rollback: revert the pull request; no saved state depends on it."
why: "Gap of K058 (criterion 4) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): the wheel turns a knob without focus and leaves Ctrl or Cmd to the page, the opposite of the criterion. No owner direction re-scopes it, so it is its own issue and K058's criterion points here (chore/plan-m064-rescope). K058 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
scope:
  - "src/js/synth/gestures.js"
  - "tests/unit/synth-knob-wheel.test.mjs"
  - "tests/browser/synth.cjs"
