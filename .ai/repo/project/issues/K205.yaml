depends_on: []
acceptance_criteria:
  - "tests/unit/synth-knob-wheel.test.mjs, failing on the merge base: on the gesture handler of src/js/synth/gestures.js with a fake DOM, a plain wheel over an unfocused knob and a plain wheel over the focused knob leave the value and the history unchanged and do not call preventDefault; Ctrl+wheel and Cmd+wheel on the focused knob turn it by one notch of wheelValue (Shift a tenth), a burst is one history entry, and preventDefault is called (project.fail-first)."
  - "tests/browser/synth.cjs s-feel asserts the same in every gate browser: a plain wheel over a knob scrolls the page and leaves aria-valuenow; Ctrl+wheel on the focused knob changes it and the page zoom stays at 1; each within a named until() deadline. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "src/js/synth is guarded (project.review-verdict v2): a non-builder's verdict in .ai/repo/reviews/<pr>.yaml."
  - "tests/README.md has a row for the new test; dist is rebuilt and npm run build:check passes."
