current_state: "was (2026-11-07): title \"Knob wheel: no turn without focus and Ctrl or Cmd, as K058 criterion 4 is written\"; the issue built a wheel that needs focus and Ctrl or Cmd, as K058 criterion 4 was written; re-scoped to pin the shipped wheel, decided with oscilla-a3 on 2026-11-07 (a Majordomus decision), on the owner's hardware direction of 2026-10-29 and .ai/repo/reviews/420.yaml R8."
acceptance_criteria:
  - "tests/unit/synth-knob-wheel.test.mjs, failing on the merge base: on the gesture handler of src/js/synth/gestures.js with a fake DOM, a plain wheel over a knob, focused or not, changes its value by the wheel step and is one history entry per burst; Ctrl or Cmd with the wheel and a horizontal swipe over a knob leave the value and the history unchanged and leave the event to the page (no preventDefault)."
  - "tests/browser/synth.cjs s-feel asserts the same in every gate browser: a plain wheel over a knob changes aria-valuenow; Ctrl+wheel over a knob leaves aria-valuenow and the page zoom stays at 1; each within a named until() deadline. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate, and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
