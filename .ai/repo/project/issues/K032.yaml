id: K032
milestone: M062
serves:
  - "playable-instrument#chart-interaction"
  - "playable-instrument#chart-cost"
title: "Scope readouts, trigger, Hold and window zoom, drawn without p5 vertex calls"
slug: scope-readouts-trigger-hold-and-window-zoom-drawn-without-p5
priority: p2
profile: implementation
objective: "Lands as feat(charts). createScopeView in src/js/ui/p5-views.js gets the kit's crosshair and keyboard cursor with a readout of ms after the trigger, amplitude +-1 relative and dB rel (under a still pointer the readout of a live chart is rewritten at most 4 times a second with a \"live\" marker, and says \"held\" once the data stops (paused, frozen); it is announced only for keyboard moves); a trigger marker with its level and a Pro button group (rising zero crossing | free run); a Hold button; readouts of Vpp (relative), DC offset, and period and frequency labelled \"est.\" from interpolated zero crossings (+-1/fs), from a pure src/js/charts/scope-readout.js; \"min/max per pixel\" where that band is shown. The window is a zoom within the scopeWindow() limits, keeping the \"limited\" note, through the shared zoom of K052: + and -, 0, Zoom in, Zoom out and Reset, and a mouse drag on the time axis. The trace is drawn with p.drawingContext moveTo and lineTo into the existing canvas without allocation, replacing beginShape and vertex, and its pending check in tests/browser/chart-cost-baseline.json is removed. It does not depend on the spectrum zoom (K031): only on the shared modules."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
