id: K071
milestone: M066
serves:
  - "connected-instrument#drum-machine"
title: "Drum voices: kick, snare and hats with a choke group"
slug: drum-voices-kick-snare-and-hats-with-a-choke-group
priority: p1
profile: implementation
objective: "Lands as feat(studio). Node types drum-kick (sine with a pitch envelope: start and end frequency and sweep time, decay, a band-passed noise click), drum-snare (two tones and band-passed noise with their own decays) and drum-hat (six square oscillators at fixed non-harmonic ratios through a high-pass, closed and open decays, choke group 0-4), each with a trigger TRIGGER input, an AUDIO output and the hits capability; the adapter's hit(t, { vel }) schedules a one-shot voice on the audio clock, and a hit in a choke group releases the group's sounding voices at that time. Before: there is no drum sound. After: kick, snare and hats with checked figures and a choke group. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node types is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
