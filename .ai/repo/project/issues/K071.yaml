title: "Drum voices: kick, snare and hats with a choke group"
slug: drum-voices-kick-snare-and-hats-with-a-choke-group
priority: p1
profile: implementation
objective: "Lands as feat(studio). Restated 2026-11-09 (D1, agreed by oscilla-2e and oscilla-43 on the mesh): the kick, snare and hats are voices of the one percussion engine (perc-voice, K123), not node types of their own, since ADR 0086 decision 5 and K222 make a drum lane a note of that engine's key map and a second family of drum nodes would duplicate it (the DRY-families order). Each voice gets its own decay, tune, level and choke group (0 none, 1-4) as perc-voice parameters of hash epoch 3 (D2), whose defaults play what the kit played (the hats share group 1); a hit in a group releases the group's voices sounding at it, on the audio clock; the Drums tab gets the row's sound editor with the voice's four knobs. Velocity follows the repo's law (midi/notes.js, amplitude (v/127)^2, D3) and velocity 0 sounds nothing. Before: kit-wide decay and tune, a hard-coded hat choke. After: per-voice figures checked in real renders and choke groups. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; the epoch 3 parameters then are unknown keys a saved document holds, refused by the import pipeline with its sentence, never dropped silently."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
current_state: "R2-T5-2 (the sound editor's row select and a pad's voice select dropped focus on a pick) fixed by oscilla-0b (session bbcd8e21-77c5-407d-b96e-e2451f1cdee9) in task t-20261110051717-bda7 on fix/r2-t5-2-perc-select-focus, for train T5."
