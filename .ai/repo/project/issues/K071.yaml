acceptance_criteria:
  - "tests/unit/drum-voices.test.mjs, failing on the merge base, asserts on StudioFakeContext (tests/unit/sequencer-fake-audio.mjs) the scheduled calls, times, ramps and node census; tests/browser/instrument-dsp.cjs, rendering a real OfflineAudioContext in Chromium, Firefox and WebKit at each context's own rate (in the style of tests/browser/dsp.cjs) and failing on the merge base, checks the figures: the kick's instantaneous frequency falls from its start to its end frequency within 2 % at its sweep time; each voice decays to -60 dB rel within 10 % of its stated decay; a closed hat hit releases a sounding open hat in the same choke group within one render quantum, click-free (no one-frame fall above 1.5 x the release ramp's first, never above the voice's level); velocity 64 is 40 log10(64/127) = -11.9 dB rel velocity 127 within 0.5 dB (restated 2026-11-09, D3: the repo's velocity law; the 6 dB figure contradicted it)."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a hit at velocity 0 sounds nothing and takes no voice; a choke of a voice that is not sounding (scheduled after the hit, or ended) leaves it untouched."
  - "A browser check in tests/browser/drums.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: the voices are notes of the percussion engine's key map, the Drums tab's rows and a notes clip's lanes (ADR 0086 decision 5; K222's dr-linked). Real-time: a pad strike sounds its voice (dr-pad), each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive (restated 2026-11-09, D1): the row's sound editor shows the voice's four knobs named in Czech, and a key or a pointer drag on one changes the engine's parameter in one undo entry (dr-sound). Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Its parameters on the existing perc-voice type land in hash epoch 3 (D2, K022), shared with K229/K230 and landing in one train with them: a record hashed under epoch 2 verifies as before, the templates are re-pinned with their epoch 1 and 2 pins kept, and the current epoch declares only registered parameters (review C1-HE3-1)."
  - "Every string it adds passes tests/unit/synth-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/audio and src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
