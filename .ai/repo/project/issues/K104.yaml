title: "Armed monitoring: live notes sound while the transport is stopped"
slug: armed-monitoring-live-notes-sound-while-the-transport-is-sto
priority: p1
profile: implementation
objective: "Lands as feat(studio). Today only transport.start starts the Studio runtime, so a live note with the transport stopped reaches no graph. The Synth workspace arms a monitoring state: runtime.start without a timeline, after onClaimOutput({ owner: 'studio' }) (exclusive with the Playground voice, as Studio PLAY is), counted by the engine's census; it disarms on leaving the workspace, hide, Escape and the Disarm control, releasing every held note (D3) and returning the census to 0. PLAY while armed starts the transport on the running graph; STOP stops playback, the keys stay armed and sounding, and the transport bar shows an armed indicator (owner decision 'STOP keeps it armed (Recommended)', 2026-11-03). A held note is exempt from the playback limit only while held (the ADR amending ADR 0005, K026). Before: a live note with the transport stopped reaches no running graph. After: the Synth workspace arms a counted monitoring state in which live notes sound. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it. Amended 2026-11-03 after the M064 audit and the owner's decisions (oscilla-b0's AskUserQuestion): STOP keeps the Synth armed and sounding with an armed indicator in the transport bar ('STOP keeps it armed (Recommended)'; the shipped STOP disarms), the browser check runs through tests/browser/synth.cjs under npm run test:studio and the wording test is tests/unit/synth-wording.test.mjs, while the armed indicator, role=switch, the Playground stop, the hide test and the unit test stay criteria."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
