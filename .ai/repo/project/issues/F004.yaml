title: "Measure on Pro components"
slug: measure-on-pro-components
priority: p2
profile: implementation
objective: "Rebuild the MEASURE workspace from Pro components: the guided seven-step flow as a Pro stepper inside a card, the stimulus, live input and quality panels as Pro cards with the quality states as Pro status badges (green, yellow, red pairs with their dark variants), the device and calibration selectors as Pro form controls, the result views (frequency response, impulse response, RTA) as Pro chart cards whose header carries the view's actions, and Measure's three dialogs (osc-dlg-level-cal, osc-dlg-cal-convention, osc-dlg-recipe-link, opened from src/js/ui/measure.js) on the Pro modal pattern F010 lands, with their rows of F010's dialog table turned on. The measurement charts keep their axes, units, traces and the signal palette; the TEST CONTEXT label and every quality warning stay as prominent as today (project.no-fake-science). Remove the legacy primitives and selectors Measure no longer uses, lower the ratchet baseline by the surfaces migrated and the primitive uses removed, keep every data-osc hook and id."
why: "Owner, 2026-10-28: the whole interface on Flowbite Pro. Measure is the wedge (ADR 0051) and its labels carry scientific meaning, so it lands on its own."
scope:
  - "src/index.html"
  - "src/styles"
