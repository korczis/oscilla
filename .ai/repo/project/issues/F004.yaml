acceptance_criteria:
  - "ui-flowbite-pro.cjs asserts the Measure panels are Pro cards and are listed as migrated by the ratchet at both sizes, and that osc-dlg-level-cal, osc-dlg-cal-convention and osc-dlg-recipe-link carry the Pro modal structure with focus entry, Escape, focus return and an inert background, in every gate browser from file:// and the sub-path."
  - "npm run test:measure passes with no behaviour check changed; the TEST CONTEXT label and the quality warnings are visible in the same steps as before."
  - "The Measure references (tests/visual/measure, desktop and phone, darwin and linux) are updated through the visual gate with the reason; the ratchet baseline's debt is lower (the surfaces migrated move from surfaces.pending to surfaces.migrated and the primitive uses removed leave the counts); dist's size is stated and within BUDGET."
  - "The pull request carries a review verdict (src/js/ui/measure.js and src/js/measurement are guarded)."
validation:
