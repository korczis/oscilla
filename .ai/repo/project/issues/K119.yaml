title: "Project save and restore across every instrument, with measurement provenance"
slug: project-save-and-restore-across-every-instrument-with-measur
priority: p2
profile: implementation
objective: "Lands as test(studio). One project with every instrument kind, a mixer, clips of every kind, samples and a measured patch round-trips through the existing Studio persistence (IndexedDB or page memory) and through file export and import, with its studioHash unchanged, its samples found by hash and every schema migration of the line applied in order; a patch exported or inserted elsewhere carries its measurement provenance (the experiment ids and hashes of K087) with it. Before: round trips are tested per feature. After: one project of every instrument round-trips with its provenance. User-value tier 3 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/studio/patches.js"
  - "src/js/studio/migrate.js"
  - "src/js/studio/provenance.js"
  - "src/js/core/storage.js"
  - "tests/unit/project-roundtrip.test.mjs"
  - "tests/browser/arrange.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K087"
  - "K109"
  - "K112"
acceptance_criteria:
  - "tests/unit/project-roundtrip.test.mjs, failing on the merge base: the fixture project round-trips with equal studioHash; a document of each earlier schema migrates and states it; a patch carries its provenance through export, import and PATCH_INSERT."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a missing sample after reload (stated)."
  - "A browser check in tests/browser/arrange.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a reloaded project opens in the arrangement, the mixer and the Studio identically. Real-time: after reload the first note plays, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: save and open work by pointer, keyboard and touch. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every pinned template studioHash is unchanged: it adds node types, ports, capabilities, enum options or clip kinds only, never a parameter on an existing node type (D2, K022)."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/studio and src/js/core/storage is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 1 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the line's figures stays within the cap Q023 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/project-roundtrip.test.mjs"
  - "node tests/browser/arrange.cjs"
  - "npm test"
evidence_required:
  - "verified"
