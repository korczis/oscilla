  - "Named as not held, each with a pinned passing example in the documented-limits test: JS forms Reflect.apply(fetch), fetch.call/apply/bind, an aliased fetch, setAttribute with a variable name, Alpine object-form x-bind, window.open and location.assign, Object.assign(new Image(),{src}), a computed non-global key, sendBeacon by concatenation, a blob worker with importScripts by concatenation, and `<img/src=…>` inside an HTML string (or fixed by accepting [\\s/] after the tag name in the HTML-string pattern)."
