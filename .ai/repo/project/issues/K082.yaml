title: "Labs open the instrument's sound: the filter and envelope labs on the panel's nodes, and Send to instrument"
slug: labs-open-the-instrument-s-sound-the-filter-and-envelope-lab
priority: p2
profile: implementation
objective: "Lands as feat(labs). Filter Lab 'Show Synth 1 filters' plots the product of the panel's High-pass and Low-pass responses from getFrequencyResponse of the runtime's own nodes (K048's call), or of a scratch BiquadFilterNode with the model's parameters labelled 'computed from the parameters' when no runtime runs, the modulation band drawn and labelled; Envelope Lab 'Edit Synth 1 Envelope 2' binds its draggable graph two-way to that node (a drag is one NODE_PARAM_SET gesture); 'Send to instrument' from the Filter, Envelope and Additive labs applies the lab's settings to the chosen node as one batch. Before: the labs show their own sounds only. After: the labs open and send the instrument's sound. User-value tier 3 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
