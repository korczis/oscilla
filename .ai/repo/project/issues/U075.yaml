id: U075
milestone: M054
serves:
  - "ui-current#ui-audited"
title: "The surface census ratchets test debt separately from link debt along the base's history, and each entry states its own reason for no deep link"
slug: the-surface-census-ratchets-test-debt-separately-from-link-debt
priority: p1
profile: implementation
objective: "Lands as test(census). Line numbers at origin/main a19f1ff6. U063 (DONE) defined the census debt as the union 'no deep link OR no test' (tests/unit/surface-census.test.mjs:429-434, 601-616), so the debt is 47 (25 subviews, 22 dialogs, all with a deepLinkWhyNot) while only 8 surfaces lack a test (phase.tab:lissajous, bio.tab:ranges, presets.tab:musical, presets.tab:sweeps, presets.tab:high, osc-dlg-headphones, osc-dlg-copy, osc-dlg-exp-delete). The tests of any of the 39 no-link surfaces that have one can be deleted with no failure (probe: problems 0, debt 47, noTest 47). Reasons are shared verbatim: all 22 dialogs carry one deepLinkWhyNot, and 24 subviews share six reasons (5 analysis, 3 mic, 3 phase, 2 bio, 3 result, 8 preset category). After: two numbers, link debt and test debt, each judged against every committed version of tests/unit/surface-census.json on the base branch's first-parent chain from the fork (the rule tests/unit/ui-flowbite-pro.test.mjs:72-84 states, through scripts/ratchet-history.mjs once R031 factors it, inline until then), never against the most recent commit alone and never against a branch commit; each only falls. Raises ledger: a top-level raises array of entries {surface, measure ('link' or 'test'), pr, reason of more than 30 characters}, added and never edited, as tests/unit/source-size-baseline.json's ledger. Held: a surface whose deep link a decision defers carries held: '<decision id>' (Q094 for its 21 subviews: the 5 analysis tabs restored from localStorage, src/js/ui/app.js:245-250, and 16 shell tab or adapter state), is counted in link debt and is never reported as resolved. From U078 (removed, see why): a deepLinkWhyNot shared verbatim by more than one entry fails, so each dialog and subview states its own reason. Test debt is 8 at landing: the two dialogs 96daa67b credited to tests/browser/control-census.cjs (osc-dlg-headphones, osc-dlg-copy) are not credited here, because control-census reaches them through no counted locator form of U076; U076's branch measurement decides them."
why: "oscilla-b0 Total Coherence audit of main 68b117f3, slice A, skeptic-verified. The pack's figure of 46 surfaces without a deep link is refuted: 47 at all five census commits. U063 is DONE and is not reopened. af's critique of 96daa67b (AMEND 19): the localStorage wording was wrong (only the analysis tabs use it), the two credited dialogs fail U076's forms, a most-recent-commit ratchet is weaker than any-commit, the ledger and 'held' fields were undefined, and a CI-log precondition is not decidable by a test. U078 was removed because plan validate cannot hold a depends_on edge to it; its duplicate-reason check moved here and its reachedFrom check and its four role=menu menus to U079 (corrected 2026-11-05: af's U073, origin/chore/plan-nav-folds, is 'Analyzer is the one analysis page' and adds only the status-bar settings menu, so the menus could not fold into it). Census ids move: af's U070 (Presets folds into the library) and U072 (Compare splits: mic and phase to Analyzer, Bioacoustics to Learn), both on origin/chore/plan-nav-folds, move or retire the presets, mic, phase and bio subviews, so this ratchet holds counts, never pinned ids."
scope:
  - "tests/unit/surface-census.test.mjs"
  - "tests/unit/surface-census.json"
  - "tests/README.md"
depends_on: []
acceptance_criteria:
  - "Fail-first: a unit mutation that sets tests:[] on subview:analysis.tab:waveform is refused by the new test-debt ratchet with a message naming the surface; on the merge base the same mutation gives 0 problems."
  - "Link debt and test debt are two numbers printed by the test, each judged against every version on the base's first-parent chain; a fixture repository whose branch raises test debt in one commit and judges a later commit against it is still refused, and a rise passes only with a raises entry naming the surface, the measure, the pull request and a reason."
  - "A deepLinkWhyNot shared verbatim by two entries fails naming both; at landing every dialog and subview has its own reason (22 dialog and 24 subview reasons rewritten in the same change, each of five words or more)."
  - "At landing test debt is 8 and link debt 47, with the 21 Q094 subviews marked held: 'Q094'; a held entry whose deepLink becomes non-null without its decision being DONE fails."
  - "The ratchet holds counts, not ids: a fixture that renames a held subview (as U070 or U072 may) and keeps the count passes; one that drops a held subview without a deepLink lowers link debt only with a raises-ledger-free decrease."
  - "Not a guarded path under v2; R031's v3 guards src/ only, and R033 guards this file only if a rule's enforcement names it, so a critique from prismatic-majordomus-98 is asked for. Lane: oscilla-21."
validation:
  - "node --test tests/unit/surface-census.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
