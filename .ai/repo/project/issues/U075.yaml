objective: "Lands as test(census). U063 (DONE) defined the census debt as the union 'no deep link OR no test' (tests/unit/surface-census.test.mjs:429-434, 601-616), so at main 68b117f3 the debt is 47 (25 subviews, 22 dialogs, all with a deepLinkWhyNot) while only 8 surfaces lack a test (phase.tab:lissajous, bio.tab:ranges, presets.tab:musical, presets.tab:sweeps, presets.tab:high, osc-dlg-headphones, osc-dlg-copy, osc-dlg-exp-delete). The tests of any of the 39 no-link surfaces that have one can be deleted with no failure (probe: problems 0, debt 47, noTest 47). After: two history ratchets in the same test, link debt and test debt, each compared with its value in the most recent earlier commit of tests/unit/surface-census.json, each only falling. In the same change tests/browser/control-census.cjs is listed for osc-dlg-headphones and osc-dlg-copy, which it drives (test debt 8 to 6), after the latest census-* CI job logs on main confirm it runs. The 21 localStorage subviews held by Q094 are named in the link-debt ratchet as held, not resolved."
why: "oscilla-b0 Total Coherence audit of main 68b117f3, slice A, skeptic-verified (coherence-verified.json surfaces gap 1, severity high). The pack's figure of 46 surfaces without a deep link is refuted: 47 at all five census commits. U063 is DONE and is not reopened."
