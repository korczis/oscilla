objective: "Lands as fix(about). The copy says 'as of this release' (src/index.html:2922) but roadmap.json names no release, and the page sits 48 commits past its tag. After: scripts/roadmap.mjs writes release (package.json version at prepare) and About reads 'as of vX.Y.Z'."
