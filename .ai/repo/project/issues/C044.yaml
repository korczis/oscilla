priority: p2
profile: implementation
objective: "Lands as fix(labs). Panel Excellence criterion 5. At main 68b117f3 Additive never applies to a dual plan (src/js/audio/lab-play-options.js:50, periodicWave only when !dual) and the panel does not say so; the labs state their scope only when the sequencer plays (coherent-state#sequencer-through-engine). After: each lab (Filter, Envelope, Additive, Phase & Stereo) reads one scope table that says, for the current source (single oscillator, dual plan, sequencer, Studio), whether the lab reaches it; while it does not, the panel shows a statement naming the source, and the statement is gone once the lab applies again."
why: "af's Panel Excellence synthesis (2026-11-05, snapshot 68b117f3): criterion 5 and the Inventory row for Additive ('silent when dual plays')."
scope:
  - "src/js/audio/lab-play-options.js"
