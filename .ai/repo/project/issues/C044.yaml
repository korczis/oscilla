acceptance_criteria:
  - "Fail-first: tests/unit/lab-scope.test.mjs fails on the merge base: with a dual plan selected and Additive on, the Additive panel shows no statement that it does not apply."
  - "The scope table is the only place that decides which source a lab reaches; lab-play-options.js reads it (a mutation that lets Additive reach a dual plan while the table says it does not fails the test, and so does the reverse)."
  - "tests/browser/labs.cjs: Additive on, Dual selected: the statement is visible and names the dual plan; Dual off: it is gone. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "src/js/audio is guarded: prismatic-majordomus-98, who built none of it, writes .ai/repo/reviews/<pr>.yaml (project.review-verdict)."
validation:
