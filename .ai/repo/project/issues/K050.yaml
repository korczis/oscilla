  - "node scripts/visual-charts.mjs passes in the environment it runs in, three times in a row on unchanged code; a mutation that shifts one light trace role by CIEDE2000 3 in its palette source (the file Q008 names), with the renderer unchanged, makes the colour sampling fail, recorded in the pull request with the role named."
