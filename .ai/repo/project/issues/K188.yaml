title: "Two instances of one engine are independent, and a whole-panel preset never touches the engine-tab nodes"
slug: two-engine-instances-are-independent
priority: p2
profile: implementation
objective: "Lands as test(studio). No test isolates two fm-voice instances (an edit, a note or a preset on one must not reach the other) or a whole-panel preset from the engine-tab nodes (pack 06 section C: 'never let a single-node preset secretly reset sibling modules'). After: tests/unit/engine-instances.test.mjs builds two fm-voice nodes and a panel with engine tabs and proves independence of parameters, voices and presets; it is the instantiation check the voice wrapper must keep green (K191's slice; this file stays K188's and is not in K191's scope)."
why: "oscilla-b0 Total Coherence audit of main 68b117f3, slice 06 (uncovered: no instance-isolation test). af's critique of 96daa67b (AMEND 17): no offline render exists (name engineEnv), { all: true } resets engine tabs by design, and the guarded fix paths must be declared before the work."
scope:
  - "tests/unit/engine-instances.test.mjs"
  - "tests/README.md"
depends_on: []
acceptance_criteria:
  - "Two fm-voice instances: NODE_PARAM_SET, a note and a node preset on one leave the other's params, voice count and output unchanged, the output compared through the engine fixture (engineEnv, tests/unit/engine-fixture.mjs:13: the adapter on a fake context, its params and voice census read back), because no offline render of one engine node exists (src/js/studio/adapters/engines.js:58 is additivePartials, a table, not a render)."
  - "A module-scope preset changes only its module, and every engine-tab node's params are deep-equal before and after; a whole-panel preset with { all: true } resets the engine tabs by design (src/js/synth/presets.js:13, src/js/synth/link.js:63, one PATCH_REPLACE step), asserted as such, so the test pins that design rather than contradicting it."
  - "If a case fails on the merge base the slice lands as fix(...) with the fix and the failing case as its fail-first test; if all pass it lands as test(studio) with 'fail-first: n/a test-only, no defect found'. Each case is mutation-proven (a deliberate shared-state mutation in a fixture fails it)."
  - "The test itself is not a guarded path (tests/unit only; guarded by R033 if a rule names it). Pre-declared fix paths, if a case fails on the merge base: src/js/studio/node-presets.js, src/js/studio/adapters/voices.js, src/js/studio/adapters/engines.js and src/js/synth/presets.js, all guarded under v2, so the fix needs a verdict from prismatic-majordomus-98. Lane: oscilla-26."
validation:
  - "node --test tests/unit/engine-instances.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
