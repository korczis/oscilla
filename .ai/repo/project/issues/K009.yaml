acceptance_criteria:
  - "A bridge is made only where canConnect allows it; otherwise the node is deleted plainly and the reason announced."
  - "L is one NODE_MOVE gesture, deterministic against compactLayout fixtures."
  - "The shortcut list is generated from STUDIO_SHORTCUTS, and graph keys do not take Space."
  - "No pinned template studioHash changes; muting an edge changes that document's studioHash by design, since muted is part of the canonical edge."
  - "No reviewer's verdict is needed (src/js/ui/studio is not a guarded path); as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first). It adds no markup, osc-* class token or stylesheet selector, so the Flowbite Pro ratchet stays flat (node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
