title: "Shift+Del deletes and bridges, L tidies, M mutes the selected edges"
slug: shift-del-deletes-and-bridges-l-tidies-m-mutes-the-selected
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). In src/js/ui/studio/graph-keys.js and the key dispatch of workspace.js: Shift+Del deletes the selected node and bridges its input to its output where canConnect allows; L tidies the graph against compactLayout as one NODE_MOVE gesture; M mutes the selected edges through the muted property every edge already has (EDGE_PROPERTY_FIELDS in src/js/studio/ports.js, applied by the compiler), so it adds no edge property and does not wait for K022."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
