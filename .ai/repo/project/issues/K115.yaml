title: "Full piano: 88 keys, scrolling, velocity by key position"
slug: full-piano-88-keys-scrolling-velocity-by-key-position
priority: p1
profile: implementation
objective: "Lands as feat(synth). The K065 piano spans A0-C8 with an octave scroll and a zoom, and velocity follows the pointer's position on the key (lower is louder), stated, or MIDI velocity; at 390 px it shows two octaves and scrolls. Before: the piano spans a few octaves. After: 88 keys with velocity by key position. User-value tier 2 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it. Merged plan of the component follow-up (2026-10-30): Range, scroll, zoom and velocity by position are W007's; this slice keeps the 88-key placement in the Synth workspace and its browser check."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/ui/piano"
  - "tests/unit/ui-flowbite-pro-baseline.json"
  - "tests/unit/piano-88.test.mjs"
  - "tests/browser/piano.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K065"
  - "W007"
acceptance_criteria:
  - "tests/unit/piano-88.test.mjs, failing on the merge base: the key map spans notes 21-108, velocity by position is monotonic and bounded, and scrolling keeps the focused key."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a key outside 21-108 (none drawn)."
  - "A browser check in tests/browser/piano.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: the lowest and highest keys play the armed instrument and light in the Studio's note view. Real-time: a key pressed low on its face gives a higher runtime velocity than high on it, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: scroll and zoom work by pointer, keyboard and touch; every key is a named button. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every link it adds (open in, send to, a modulation route, a probe or a jump between views) is a row of tests/browser/integration-map.json, and tests/browser/integration-map.cjs walks it: the control works by pointer and by keyboard, the target shows the same Studio revision, focus lands on the target heading, and Back, Forward and reload keep the state."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "Its chrome uses the Flowbite Pro component where Pro has one (card, button, button group, input, dropdown, tabs, tooltip, popover), adapted from that block, lands after F002, is recorded as migrated (never pending) and lowers or keeps the ratchet; the instrument visuals Pro has no component for (the knob arc, the cable layer, the piano keys, the pad surface) are inline SVG and Tailwind utilities inside Pro cards, as the ADR 0061 resolution note of K058 records; it adds no osc-* class token, no legacy selector, no inline style and no stylesheet (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs); every continuous instrument parameter it shows is the knob of K058 (D11)."
  - "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 1 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the line's figures stays within the cap Q023 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/piano-88.test.mjs"
  - "node tests/browser/piano.cjs"
  - "npm test"
evidence_required:
  - "verified"
