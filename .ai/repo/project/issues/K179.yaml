title: "Live Studio playback lets the last note's release finish before the transport ends"
slug: live-studio-playback-lets-the-last-notes-release-finish
priority: p2
profile: implementation
objective: "Lands as fix(studio). Found by V605's fixes (2026-11-04) and asked for by its reviewer (prismatic-majordomus-98): live Studio playback ends STOP_PAD_S (10 ms, sequencer/compiler.js) after the timeline's last clip (transport.js, the end check at anchorEndTime + STOP_PAD_S) and then fades out, so an envelope release longer than about 25 ms is cut short live, while the offline render (and V605's residual) judges the full release: a voice opened from the Playground does not sound the same live as it renders. The transport's end time takes the longest release still sounding at the last clip's end into account (each Envelope's release, and each voice engine's release, from the compiled plan), so playback ends after the last release has fallen to the floor and then stops as today. The cause is the stop pad, not the start fade, so it is separate from K177."
why: "V605 review (prismatic-majordomus-98, 2026-11-04): a release over about 25 ms is cut short live, a 'does not sound the same live' gap the offline render cannot see."
