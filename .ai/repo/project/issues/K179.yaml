acceptance_criteria:
  - "A unit test, failing on the merge base, on the transport's fake engine: a timeline whose last clip gates an Envelope with a 300 ms release ends no earlier than the clip end plus the release (and STOP_PAD_S), and a timeline with no release ends as today."
  - "A browser check (qa-regressions.cjs signal-path-open-in-studio-plays or v31-studio-transport): a voice opened from the Playground with a 300 ms release, played live, is still above the floor 200 ms after its gate ends and silent with census 0 after the release, in chromium, firefox and webkit, within named until() deadlines."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and a unit test that fails on the merge base (project.fail-first)."
  - "tests/README.md rows are updated; dist is rebuilt and npm run build:check passes."
