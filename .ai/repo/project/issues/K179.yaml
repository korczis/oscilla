  - "src/js/studio/transport.js"
  - "src/js/studio/timeline-compiler.js"
  - "tests/unit/v31-studio-transport.test.mjs"
  - "tests/browser/qa-regressions.cjs"
  - "tests/README.md"
  - "dist"
