  - "A static scan finds one note-to-frequency function used by both routes; a mutation that gives the Synth route its own 440 constant fails."
  - "With A4 at its default 440 Hz, the synth-panel criterion's A4 = 440 Hz and A5 = 880 Hz within 0.1 cent still holds, and tests/unit/freeze.test.mjs passes with the golden vectors unchanged."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
