title: "One note-to-pitch law: the Synth route honours the A4 reference as the Playground route does"
slug: one-note-to-pitch-law-the-synth-route-honours-the-a4-reference
priority: p2
profile: implementation
objective: "Lands as fix(synth). Two note-to-pitch laws exist after the #367 train: the Playground route (src/js/midi/notes.js:89) plays midiToFrequency(note, s.a4 > 0 ? s.a4 : 440) and follows the A4 reference setting, while the Synth route (src/js/synth/ui.js noteOn -> transport.live -> the Keys node and the oscillator kind of src/js/studio/nodes/instrument.js, 'A4 x 2^octave, 8' = 440 Hz') ignores it. Before: with A4 set to 432 Hz, MIDI note 69 sounds 432 Hz in the Playground and 440 Hz in the Synth workspace. After: one law, in one module (src/js/core/music.js midiToFrequency), decides a note's pitch for every route, and the Synth route reads the same A4 reference, so note 69 sounds A4 on both routes within 0.1 cent; the A4 control says which routes it tunes. If tuning the Studio document by a Playground setting is judged wrong, the alternative is that the Synth workspace shows the reference it plays at and the A4 control says it does not apply there; the pull request records which and why. Rollback: revert; no saved state changes."
why: "Review of the feature train #367 (oscilla-af, verdict at 5cad3dcf, finding F4 'D3', P2): two note-to-pitch laws, the Playground route follows A4, the Synth route ignores it. A control that reaches one route and not the other is what the coherent-state intent forbids."
