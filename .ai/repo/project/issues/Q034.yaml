evidence:
  - covers: "owner_decision"
    type: manual
    command: "LLM decision of the coordinating sessions oscilla-43 and oscilla-c3 by cross-session message, 2026-11-11 ~13:40Z, under the owner's order of 2026-11-05 'discuss answers with other llms, do not wait for human, be llm autonomous' (Q090); the owner may override it"
    result: "AGREED by oscilla-c3 with oscilla-43: (a), amended. Reasoning: a template in src/js/ui/catalog is still Pro markup adapted from a named Pro block, written once per control kind, which is what G001's 'one implementation per control kind' asks for; metadata only (b) would leave every surface writing its own copy. Conditions, checked by the catalogue test where checkable: (1) no CSS of its own; (2) every template names its Pro block in the flowbite-pro reference; (3) only proven-duplicate kinds (D1-D14) get a template; (4) no runtime binding (G008's static scan); (5) the path is src/js/ui/catalog; (6) every template passes the Pro legacy ratchet as surface markup does (tests/unit/ui-flowbite-pro-baseline.json): no osc-* class, no inline style, the catalogue test renders each template and runs that check on the output; (7) the licence rule holds: a template is adapted (the owner's tokens, Czech text, our hooks), never a Pro source file copied verbatim; the test cannot prove it, so each template names its Pro block and states what it changed, and review judges the rest; (8) accessibility comes with the block: roles, labels and focus order as the Pro block has them, the catalogue test asserts the role and accessible name of each rendered template; (9) templates are static markup and behaviour stays in the kind's own module (render versus bind), so one kind never gets two behaviours."
