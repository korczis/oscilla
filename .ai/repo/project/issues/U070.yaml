objective: "Lands as feat(ui) after K147. The V1 preset store (oscilla.presets) is the third preset store; its presets move onto the studio/patches.js record (K147), stored data migrates once with a notice, and Load in the library plays the voice and shows it. No loss before removal (Q090, b0's binding condition): the old page stays until everything it offers is live, reachable and sounding in its new home, proven by a browser check that walks each of the old page's controls to its new place in Chromium, Firefox and WebKit; only then is its #m= route redirected to the new home (the link keeps working, ADR 0045's one dispatcher) and its markup removed."
why: "af nav-pages audit wf_ed1cc8d6-3e8 and Play audit wf_99782352-a93 on origin/main 6d5efa89 (v3.19.0), after the owner's complaint in the af session 2026-11-04/05: views feel lost, Play does not work on most pages, nothing runs through one bus, engines are not wrapped, many top-nav pages are obsolete, unconnected, not realtime, poor. Decided by af and b0 on 2026-11-05 under the owner's order of that day 'discuss answers with other llms, do not wait for human, be llm autonomous' (Q090)."
