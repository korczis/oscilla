acceptance_criteria:
  - "Migration: a browser with V1 presets stored opens the library with each preset present and playable; a corrupt store is refused with a notice, never dropped silently."
  - "tests/browser/page-folds.cjs walks every control of the old page (derived from tests/unit/surface-census.json, never a hand list) to its new place in Chromium, Firefox and WebKit, and each sounds or draws there; only after that does the old #m= route redirect."
  - "tests/unit/page-folds.test.mjs: the old route resolves to the new home through the one hash dispatcher, every Learn and counterpart link to the old page is retargeted, and About names the new home."
  - "Fail-first: the unit test and the browser check named here fail on the merge base (project.fail-first)."
  - "Browser checks run through tests/browser/lib/suite.cjs with lib/wait.cjs deadlines and assume no sample rate; tests/browser/timing-baseline.json and tests/unit/ui-flowbite-pro-baseline.json do not grow; the iphone.cjs census reach does not fall."
  - "Done only after each criterion is re-checked on a main commit (b0's rule of 2026-11-05)."
