acceptance_criteria:
  - "Fail-first, on seams of the merge base: tests/unit/stop-path.test.mjs scans src/js for window- or document-level keydown (Escape), pagehide and visibilitychange listeners and fails on every one that stops sound outside the key registry and the bus, naming main.js:680-681, workspace.js:487 and :531-532, midi/ui.js:111-116, midi/keyboard-ui.js:174-192 and synth/ui.js:834; the allow-list (experiments.js:514, app.js:293-298, frame-loop.js:21, p5-host.js:156, capture.js:368-376) is in the test with a reason per entry, and a mutation that re-adds a stop listener fails."
  - "With the instrument, the sequencer, the Studio, the Synth and held MIDI notes sounding, Escape, the status-bar stop and a page hide each leave the bus with no owner and the engine census 0 in the same event (unit, fake clock, no 150 ms window)."
  - "The capture still aborts on pagehide when the bus is bypassed (capture.js's own listener), asserted in tests/unit/stop-path.test.mjs."
  - "tests/browser/app.cjs plays each player, presses Escape, the status-bar stop and hides the page, and waits with until() (named deadlines) for nothing playing and census 0, in Chromium, Firefox and WebKit through the suite harness; tests/browser/touch-audio.cjs passes with the gesture rule on."
  - "The status-bar stop is the app shell's control: this issue consumes M123's one app shell (G026, component-system#one-implementation-per-family, origin/chore/plan-unified-controls) and adds no second stop widget; project.visual-identity-lock holds."
  - "Guarded paths marked: src/js/measurement/* and src/js/ui/measure/* (v2, prismatic-majordomus-98 writes the verdict; 'capture still aborts on pagehide' is the reviewer's check), src/js/synth/*; the rest is judged by the screens seat once R031 lands. Lane: dev-53."
