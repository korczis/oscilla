title: "The playback bus, slice 2: Stop, Escape, the status-bar stop and page hide take one stopAll path"
slug: one-stop-escape-and-page-hide-path
priority: p0
profile: implementation
objective: "Lands as fix(bus). Split from C037 by af's critique of 96daa67b (BLOCKING 5). Line numbers at origin/main a19f1ff6. Stop handlers live in many places: src/js/main.js:672 (blur releases Hold), :674-681 (hide: measureAbort('pagehide') then cmp.stop(), on visibilitychange and pagehide); src/js/ui/studio/workspace.js:487 (a window keydown) and :531-532 (visibilitychange and pagehide hide); src/js/midi/ui.js:111-116 (visibilitychange, blur, pagehide and an Escape keydown silence MIDI notes); src/js/midi/keyboard-ui.js:174-192 (keydown, blur, pagehide and visibilitychange release the on-screen keys); src/js/synth/ui.js:834-835 (a window Escape while on Synth); src/js/ui/keys/dispatcher.js:96-99 and src/js/ui/keys/clients.js:20-24 (page.escape calls measureAbort('escape')); src/js/ui/measure/run.js:143-164 (the user's Stop); src/js/measurement/capture.js:368-376 (the capture's own pagehide and visibility abort). Listeners that are not stops stay and are allow-listed with their reason: src/js/ui/experiments.js:514 (a visibility refresh of the list), src/js/ui/app.js:293-298 (Escape closes the nav and menus), src/js/charts/frame-loop.js:21 and src/js/visualization/p5-host.js:156 (render pauses). After: the bus exposes stopAll(reason); Escape is one key-registry binding, page hide one listener pair, and the status-bar stop one action, each calling stopAll, which stops every owner from its live state in the same event; the capture still aborts on pagehide by itself (spec §169, capture.js:368-376 stays), and the MIDI and on-screen-key releases become owners' release callbacks the bus calls."
why: "af's critique of 96daa67b (BLOCKING 5): the stop scan of 96daa67b would fail on handlers outside its scope; its list is completed here with the non-stop listeners named. coherent-state#stops-are-immediate; C034 expects 'one Stop/Escape/hide path' as its own slice."
