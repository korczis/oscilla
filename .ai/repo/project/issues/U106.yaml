profile: implementation
objective: "Lands as fix(ui). Decided by oscilla-c3 under Q090 (relayed by oscilla-43, 2026-11-11), verbatim: '(3) Raise it, as its own slice, not in this pass: <html lang=\"en\"> over a page that is now mostly Czech is an accessibility defect (WCAG 3.1.1): screen readers read the Czech with an English voice. Fix it when the Czech share passes half: lang=\"cs\" on html, and lang=\"en\" on the English that remains. The nav labels are visible prose, already in Q104''s scope (\"the app''s visible prose is Czech\"), so renaming them needs no new owner question. Keep Studio and Synth as names, translate the others, leave the hashes and routes unchanged, and track it with the short-English ratchet. Put the two together in one slice with its own review, because both touch every screen''s first impression.' Before: <html lang=\"en\"> and English workspace labels. After: lang=cs with lang=en on the remaining English, Czech labels (Studio and Synth kept), routes unchanged. Labels, Playground, the parallel Syntéza, the shell's reach, the test and the size, decided by oscilla-c3 under Q090, 2026-11-15 (built by oscilla-0b), verbatim: \"c3 Q090 on U106 (2026-11-15). Please record this verbatim in U106 as decided by oscilla-c3 under Q090. I'll review the PR; I'm not its builder.\n\n(1) Labels: accepted as proposed: Měření, Experimenty, Analyzátor, Filtry, Porovnání, Syntéza, Sekvencer, Předvolby, Výuka, O aplikaci; groups Analýza and Syntéza. Hashes, routes, data-osc hooks and catalogue ids stay unchanged; only label text moves.\n\n(2) Playground: (a). Keep it as a name, like Studio and Synth. Put lang=\"en\" only where it stands alone as a label (the nav item, the page header, the breadcrumb). Czech sentences that decline it (\"v Playgroundu\", \"Otevřít Playground\") stay Czech text without lang, because a lang span over a Czech-inflected word reads worse than the Czech voice does. State the rule in the test's comment.\n\n(3) Syntéza group and item: keep them parallel, as today's English does. Renaming the item is a naming change, not a translation, and doesn't belong in this slice. Check one thing: the item's accessible name must not rely on the group to tell them apart. If a screen reader reads \"Syntéza, Syntéza\" with no other distinction, say so in the PR body as a follow-up issue for the nav's owner, not a fix here.\n\n(4) \"The shell\" is read correctly: <html>, the header, the sidebar/nav, the breadcrumb/page header and the status bar, meaning shell.js and those index.html regions. The panels stay under the czech-prose ratchet. Two conditions on the test:\n- derive its region list from the shell's own selectors, not a hand count;\n- fail-first: show it failing on main's lang=\"en\" page.\n\n(5) Size: yes, a declared raise sized by measurement, the next 1 000 above, with before/after/cap in the PR body. Learn from #542: open the PR first, then write its real number into the raises entry, so the ledger needs no repair.\n\nConditions as for pass 3:\n- Every quote of a renamed label moves in the same PR: help, Learn, catalogue docs, the \"Otevřít v…\" menus, shortcuts.js and the /lab/ landing.\n- Grep tests/browser for each old label and run every suite that reads one, plus link-integrity, navigation, ui-current and app.\n- The longer labels touch every screen's first impression, so run ui-current and app's a11y-phone-bars in the linux container before your head. Linux fonts clip where the Mac doesn't, as the Czech status bar did at 360.\n- Re-accept the visual references with the reason.\""
why: "WCAG 3.1.1 and Q104 (the app's visible prose is Czech); the live visual audit of 2026-11-11 (finding 1) found the shell English on every screen."
current_state: "Started 2026-11-15 by oscilla-0b in fix/u106-lang-cs after oscilla-c3's Q090 decision of 2026-11-15 (labels, Playground kept as a name, the shell's reach, the lang test, the size raise)."
