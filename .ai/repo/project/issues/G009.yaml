title: "Every empty state offers its next step, and 'open in a workspace' and 'fullscreen' are two components with one look each"
slug: every-empty-state-offers-its-next-step-and-open-in-a-workspa
priority: p2
profile: implementation
objective: "Lands as feat(ui). D10 and D9: six empty-state class families with no action and two texts for the same state; one expand icon with five meanings (in-page fullscreen, browser fullscreen, navigate to a workspace, and in Filter Lab back to the Playground, B1). Two catalogue kinds: empty { text, action: a route or a command } (the Pro empty-state block) and open (a link with an href, the route of the target, so it opens in a new tab too) apart from fullscreen (a toggle button with aria-pressed). The Studio graph, the embedded Studio, the Studio library and patches lists, the Presets lists and the Playground panels use them; Experiments and Findings adopt them in F005 (their adapters are guarded). Before: VERIFIED (inventory L2, L9; links.md B1). After: every empty state leads somewhere and an icon means one thing. Negative cases: an empty action, an open link to a route the router refuses, fullscreen refused by the browser (stated, never a silent no-op). Rollback: revert."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
