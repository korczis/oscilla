acceptance_criteria:
- "tests/unit/ui-catalog.test.mjs gains the kinds and fails on the merge base: an empty declaration without an action, and an open declaration without a resolvable route, are refused; no #i-expand use remains whose meaning is not fullscreen."
- "Definition of done, extends: the Pro empty-state block and the router's existing workspace routes."
- "Definition of done, interlinks: each empty state's action is a row of the link graph (G016)."
- "Definition of done, interactivity: every action works by pointer, keyboard and touch."
- "Definition of done, docs, menus and routes: the B1 label is fixed in src/index.html; docs/ui-audit.md A08 and its empty-state rows are brought current. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'empty-actions' in tests/browser/qa-regressions.cjs empties the Studio graph and the Presets list and follows each action by pointer, Enter and a hasTouch tap, waiting with until() (deadline 'empty action reached', 2 s) for the target. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (the template names its flowbite-pro reference.md section), recorded as migrated, never pending; it adds no osc-* class token, no legacy vocabulary use and no selector, removes the legacy ones it replaces, and the domain views' stylesheets gain nothing (compact density is Tailwind utilities on the domain view's own elements); the record's debt falls (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 2 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
