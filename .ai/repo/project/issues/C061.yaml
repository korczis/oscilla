title: "A second live envelope edit keeps the first: the Envelope node accumulates its changes"
slug: a-second-live-envelope-edit-keeps-the-first
priority: p1
profile: implementation
objective: "Lands as fix(studio). The Envelope node's update rebuilds its ADSR from the creation parameters plus only the latest change: adsr = adsrOf({ ...params, ...changed }) (src/js/studio/adapters/modulation.js:80-82), and params is never updated. Setting attack to 1.5 s and then decay to 0.7 s while it runs loses the attack: the next gate plays the creation attack. After: the node keeps its current parameters (each update merges into them) and every later gate uses all the edits made so far."
why: "Found by seat 98's coherence train B check (R8, P2, pre-existing on main 2026-11-05; repro in 98's scratchpad 7b-check), filed by af at b0's request. A live edit that silently reverts an earlier one breaks coherent-state#live-edits-reach-the-voice and project.no-fake-science (the Inspector shows 1.5 s, the voice plays the old attack)."
scope:
  - "src/js/studio/adapters/modulation.js"
  - "tests/unit/c061-envelope-edits-accumulate.test.mjs"
  - "tests/README.md"
  - "dist"
depends_on: []
acceptance_criteria:
  - "Fail-first unit on the fake audio context: update({attack: 1.5}) then update({decay: 0.7}), then a gate schedules the attack ramp over 1.5 s and the decay over 0.7 s; it fails on main (the attack is the creation value)."
  - "The same holds for sustain and release after two or more updates, and an update of one key leaves every other edited key as last set."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded); done only after each criterion is re-checked on a main commit."
validation:
  - "node --test tests/unit/c061-envelope-edits-accumulate.test.mjs"
  - "npm test"
evidence_required:
