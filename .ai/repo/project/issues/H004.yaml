title: "The logo, the skip link, Help, Import and row focus do what their names say"
slug: the-logo-the-skip-link-help-import-and-row-focus-do-what-their
priority: p2
profile: implementation
objective: "Lands as fix(ui). Five controls named for something they do not do (links probe of the G1 inventory): B6 the logo only moves focus; it opens the Playground, or stops being a control. B7 'Skip to the instrument' appears in every workspace; it names and targets the main content of the workspace shown. B8 'Help' opens the keyboard shortcuts only; it is named for the dialog it opens (a help hub is not planned here). B13 Import sits in the Export menu; it moves out of it, beside the import it already has (More, Import). B14 a div row has a click handler; it becomes a focusable control with keyboard activation. B1 ('Open Filter Lab page') is the UX-audit plan's control-naming slice and is not repeated here."
why: "Links probe B6, B7, B8, B13 and B14 of the G1 coherence contract of 2026-10-29 (scratchpad g1/coherence-contract.md, section 5 row 6.3; inventory g1/inventory.md; critique g1/critique.md) (VERIFIED on main cdda563c); serves ui-current#ui-audited, an INFERRED fit."
