acceptance_criteria:
  - "Fail-first: tests/unit/control-names.test.mjs reads src/index.html and src/partials and fails on the merge base: the header help control's accessible name is the title of the dialog it opens; the Export menu holds no Import item; no element without an interactive role and tabindex carries a click handler; the skip link's label is bound to the workspace shown."
  - "A check in tests/browser/navigation.cjs activates the logo, the skip link in three workspaces, Help and Import, and asserts the workspace, focus target or dialog each one reaches."
  - "It adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
  - "As a fix change it carries a unit test that fails on the merge base and passes on the head (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/control-names.test.mjs"
  - "node tests/browser/navigation.cjs"
  - "npm test"
evidence_required:
