title: "The Sequencer's blocks stay readable and hittable at phone width, and the lane scrolls instead"
slug: the-sequencers-blocks-stay-readable-and-hittable-at-phone-width
priority: p2
profile: implementation
objective: "Lands as fix(ui). Defect: at 390x844 the Pattern Sequencer lane (#osc-panel-sequencer .osc-seq-timeline-wrap) fits the whole sequence into 350 px and never scrolls (scrollWidth = clientWidth = 350), so its blocks (div.osc-block, #osc-seq-block-b1..b5) shrink to 36x40 px and the Silence block #osc-seq-block-b3 to 16x40 px, under 24 px on a coarse pointer; span.osc-block-name and span.osc-block-detail clip ('Silence' scrollWidth 41 against clientWidth 0, '440 -> 880 Hz' 79 against 18, 'Tone' 27 against 20; at 768 px 'Silence' still clips, 41 against 25). Cause: timelineWindow() (src/js/labs/sequencer-panel.js:33-48, TIMELINE_OPTIONS minSpanS 3.75, minPxPerS 66) fits at least minSpanS and the whole sequence into the lane before it ever scrolls, so a narrower lane only shrinks the blocks; the block width is then Math.max(4, r.w) (sequencer-panel.js:233). Before: blocks are slivers whose names read 'T... / S... / P... / C...'. After: the window is bounded by the shortest block as well as by the duration: the visible span shrinks until the shortest block is at least 24 px wide (44 px under a coarse pointer, the layout.cjs touch minimum) and its name fits, and the lane then scrolls through the scrollbar and thumb it already has (maxScrollPx); the time scale stays linear, so every block's width remains proportional to its duration (project.no-fake-science: no minimum-width padding that misstates a duration, no non-linear squeeze). Each block's accessible name carries its full name and detail, so a truncated detail is never the only label. Negative cases: a sequence that already fits at its current pixel density renders unchanged at 1536 px (no scroll appears); an empty sequence still shows minSpanS; a single very short block (10 ms) is still reachable by scrolling, not dropped; the playhead, the drop index and the insertion marker follow the scrolled window. Fixes use the existing lane and Pro components and Tailwind utilities, never a new osc-* class, stylesheet rule or inline style beyond the block geometry the lane already sets (project.ui-uses-flowbite-pro). Rollback: revert the commit; the window maths returns to fit-to-lane. Not this: C005 (Loop glyph and Add-menu clipping at desktop width), C006, K001-K003 and K017 (tempo, ms/beats and note-name chrome), K047 (frequency glyphs, hover readout and playhead chip), F003 (moves the Sequencer onto Pro, keeps the grid's drawing and sets no phone-width criterion), G011, G008, W011 and Q063 (touch criteria on other surfaces)."
why: "Found by the S074 quality-bar review of 2026-10-30 at origin/main d9db6bdf, section 74 symptom 'The Pattern Sequencer's blocks are squeezed to unreadable slivers at phone width: labels show 1-2 letters, and the Silence block is 16 px wide.', reproduced by an independent verifier. Evidence: screenshot scratchpad s074/out/probe-seq.png of the review session (/private/tmp/claude-501/-Users-korczis-dev-oscilla/901211e2-501d-4cb8-8333-88e1a6fcf519/scratchpad/s074/out/probe-seq.png) and the measured block boxes and scroll widths quoted in the objective. On a phone the blocks cannot be told apart and the Silence block is hard to hit. No plan issue or open PR covers it (map note: C005, C006, K001-K003, K017, K047, F003, G011, G008, W011, Q063; PRs #292, #306, #266, #283, #302, #315 checked); the cause is the layout maths, not legacy osc-* styling, so it does not wait for the Pro migration."
