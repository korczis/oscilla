acceptance_criteria:
  - "Fail-first: tests/unit/charts.test.mjs (beside the existing timelineWindow cases) fails on the merge base: for the default five-block sequence at laneW 350, the window's pixels per second give the shortest block at least 24 px (44 px with the coarse-pointer option) and maxScrollPx > 0; at laneW 1536 the window is unchanged from the merge base; for every case contentPx / spanS is one constant, so block widths stay proportional to their durations."
  - "A check in tests/browser/layout.cjs, at 390x844 and 768x1024 with a coarse pointer, opens the Sequencer workspace and asserts every div.osc-block in #osc-panel-sequencer is at least 44 px wide, every span.osc-block-name has scrollWidth <= clientWidth, each block's accessible name contains its name and detail, and the lane's scrollWidth exceeds its clientWidth; at 390x844 it scrolls the lane to #osc-seq-block-b3 and taps it, and the timeline selection becomes that block."
  - "tests/browser/sequencer.cjs at 1536x1024 still passes unchanged (no scroll for the default sequence, the playhead, drop index and insertion marker as before), in chromium, firefox and webkit."
  - "It adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro, project.visual-identity-lock)."
  - "As a fix change it carries a unit test that fails on the merge base and passes on the head (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "Definition of done, extends: the Sequencer lane gains a block-aware zoom bound and phone-width scrolling; the layout gate gains a Sequencer block criterion at 390 and 768 px."
  - "Definition of done, interlinks: the objective names C005, K047 and F003 by id, and tests/README.md's layout.cjs row names the Sequencer block criterion."
  - "Definition of done, interactivity: the lane scrolls by pointer, touch and keyboard at phone width and a scrolled-to block is selectable by tap and by keyboard (project.no-inert-surfaces)."
  - "Definition of done, docs, menus and routes: tests/README.md rows for layout.cjs and charts.test.mjs updated; no route or menu changes (stated)."
  - "Definition of done, tested: node --test tests/unit/charts.test.mjs, node tests/browser/layout.cjs, node tests/browser/sequencer.cjs and npm test pass; dist is rebuilt and npm run build:check passes."
  - "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
