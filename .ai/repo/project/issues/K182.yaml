objective: "Lands as fix(midi). The audit found that after arming the Synth, a key pressed on Analyzer is silent: the V502 key voice serves every workspace except Synth and Studio (src/js/midi/ui.js:62), and the keyboard overrides the scope input (src/js/midi/keyboard-ui.js:220-223). After: the computer keys, the on-screen keys and MIDI play the instrument of the current output owner on every page, through the one key registry (src/js/ui/keys, K153), and the views follow it (C013)."
