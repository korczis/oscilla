title: "A Generator workspace with its own route and navigation entry, linked from the Playground"
slug: a-generator-workspace-with-its-own-route-and-navigation-entr
priority: p1
profile: implementation
objective: "Lands as feat(generator), on the Pro shell of F002 (owner decision Q033 of 2026-10-29: the generator gets a workspace of its own). A new workspace 'Generator' with the route #m=generator and a navigation entry after Playground, built from Pro cards: Signal (waveform, the pattern vocabulary of audio/patterns.js including the noise, test-signal and burst patterns, a typed field that accepts Hz and note names through K132's parsePitch with the other form beside it, a level typed in dBFS-like units, output to left, right or both and a polarity switch per channel, an inverted channel being a gain of -1 inside the engine's stereo router), Live (scope and spectrum with a requested-frequency marker per tone and the setpoint and observed readouts side by side), and Plan (the pattern's parameters). The workspace and the Playground's Source panel are two projections of the one instrument state (core/instrument.js): no copy, no second voice; the Source panel gains 'Open in Generator' and the Generator a link back. Every field is carried by URL state and presets, and a link never raises the gain above DEFAULT_GAIN. The surface is Pro from its first commit, so the Flowbite ratchet gains no pending surface."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings G1-G14 measured on origin/main b67d1e58)."
