acceptance_criteria:
- "Before: VERIFIED (G3, G6, G13): the generator is the Playground's Source panel only, with no typed field, no channel or polarity, and its analysis a scroll away at phone width; no Generator route or navigation entry exists."
- "After and negative cases: as the objective and the criteria below state; the setpoint (what was requested) and the observation (what the analyser measured on the digital output, or the microphone on the room) are separate readouts with separate labels, and no readout claims the acoustic output."
- "Rollback: revert the merge commit. Nothing changes the schema, a studioHash, URL key meaning or stored preset, so documents saved while it was live load unchanged after the revert."
- "Scientific-truth rows (Quantity | Unit | Source | Algorithm | Resolution | Calibration | Limitations | Tests | UI label) are added to docs/science/readouts.md and checked by tests/unit/readout-truth.test.mjs (each UI label's text is in the source, each Tests path exists, and a setpoint row never shares its label with an observed row): Requested and observed frequency side by side | Hz | setpoint; output AnalyserNode | observed: peak bin with parabolic interpolation | observed +-1 bin stated | uncalibrated | the observed value is the digital output's, never the acoustic one; a difference beyond one bin is shown, never hidden | tests/unit/generator-workspace.test.mjs | Requested 440 Hz | Analyser 440.1 Hz +-5.9 Hz (digital output)"
- "The pull request carries a reviewer's verdict (it touches a guarded path; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
- "Wave 2: its chrome is Flowbite Pro markup adapted from the matching Pro component, lands after F002, adds no osc-* class token or legacy selector, and studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration; the domain drawing stays OSCILLA's own inside Pro cards (project.ui-uses-flowbite-pro, project.visual-identity-lock v2; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 4 KB gzip added, with the base and head figures in the pull request body, within the owner's dist budget of 1 200 000 B gzip (decision of 2026-10-29, about 355 KB of headroom at origin/main b67d1e58); the ceiling of this line is 25 KB gzip in all (Studio boxes 35 KB, signal generator 25 KB), stated in the milestone (project.single-file-deliverable)."
- "tests/unit/generator-workspace.test.mjs, failing on the merge base: the route #m=generator is an app mode with a navigation entry; the Generator and the Source panel read and write one instrument state (an edit in one is the value in the other, with no second store); the field's parse and echo; polarity and channel routing on the recording mock context (an inverted channel's samples are the negation of the normal one's); URL round trip of every field; a link never raises the gain above DEFAULT_GAIN."
- "The new surface is on Pro from its first commit: node --test tests/unit/ui-flowbite-pro.test.mjs passes with the surface listed as migrated and no pending surface added (project.ui-uses-flowbite-pro)."
- "Definition of done, extends: the Source panel of S005-S012 and the pattern vocabulary of audio/patterns.js."
- "Definition of done, cross-links: Playground to Generator ('Open in Generator') and back, the navigation entry, and the deep link #m=generator; each a row of tests/browser/integration-map.json once that map (synth line K075) is on main."
- "Definition of done, dynamics: the Live card's scope and spectrum follow every field, with the setpoint and the observed digital output side by side."
- "Definition of done, docs and routes: README.md's workspace list and route table, a feature record .ai/repo/features/generator.md, docs/GLOSSARY.md for setpoint and observed; tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: a check 'workspace' in tests/browser/generator.cjs opens the Generator from the navigation entry by pointer, by keyboard and by touch in a hasTouch context, types 'C#5' and waits with until() (deadline 'C#5 sounding', 5 s) for 554.37 Hz in the engine while Hold is pressed; opens the Playground and waits for the Source panel to show 554.37 Hz (one state); follows 'Open in Generator' and Back; opens #m=generator directly and waits for focus on its heading; sets the left channel inverted and waits for the stereo analyser's L and R correlation below -0.95; on the merge base the route does not exist. The check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs, assumes no sample rate and adds nothing to tests/browser/timing-baseline.json."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit and the completed evidence the release that carried it; E030's judge passes once E030 is on main."
