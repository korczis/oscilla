title: "Owner decision: a tracked, generated knowledge projection of the components under .ai/repo/knowledge/components/"
slug: owner-decision-a-tracked-generated-knowledge-projection-of-t
priority: p1
profile: routine
owner: repository owner
objective: "The knowledge README says a compiled product belongs under .ai/local/cache/, and the curated README that a note is never a copy. Majordomus discovers tracked files only, so a projection kept local is served by nothing (measured 2026-10-29). (a) A tracked generated directory .ai/repo/knowledge/components/, one knowledge/v1 record per kind, panel and node type, status verified, origin extracted, regenerated and checked byte-equal in npm test, as the component contract decision drafts it; (b) as (a) but the records stay status candidate, which the knowledge README defines as awaiting a person's promotion; (c) no projection: docs/ui-catalog.md only, until Majordomus derives edges for a repository-declared component kind. The plan recommends (a)."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs and knowledge base, interlink them and add more; knobs, sliders and control panels in one generic way, Majordomus integrated: each component and parameter declaration carries its intent, issue and rule ids, a deterministic generator projects the registry into .ai/repo/knowledge so that Majordomus serves it (context resolve, why, traceability), and a check fails when a component has no plan or knowledge link. Design: components-followup/majordomus-kb-adr.md of this plan change, measured with Majordomus 1.0.0-alpha.1 (the CI pin) and 1.0.0-alpha.8 on a throwaway copy of origin/main cdda563c."
current_state: "Open on 2026-10-29. The plan's recommendation is not an answer. J003 names this issue in depends_on, so majordomus plan next does not hand it out before it is answered."
