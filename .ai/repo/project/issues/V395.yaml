title: "Unwrapped phase and group delay of a single run"
slug: unwrapped-phase-and-group-delay-from-the-transfer-function
priority: p2
profile: implementation
objective: "Wrapped phase and its masking reasons exist (src/js/measurement/transfer.js: NOT_REQUESTED, NO_ALIGNMENT, ALIGNMENT_NOT_ROBUST, AGGREGATED), and a measurement of repeated runs has no phase at its aggregate centre by design (aggregate.js; specification section 27). Add the unwrapped phase and the group delay of a single run, relative to the removed alignment lag (so a pure delay shows 0 ms after alignment, and its delay is the alignment lag), shown only where the reliability mask is valid and the alignment is robust and masked elsewhere with the reason; for the aggregate of repeated runs, refuse group delay with the reason AGGREGATED and show it per run; versioned algorithm ID. It follows V394 because both extend the stored result schema and the result views."
why: "V3 MEASURE specification sections 4 and 90-92 (docs/specs/oscilla-v3-measure.md); conversation 6abec18d, 2026-10-02T03:15:06Z. Phase already exists and the aggregate has none (critique measurement-extensions, phase-exists-and-aggregate-has-none)."
