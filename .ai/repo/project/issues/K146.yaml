acceptance_criteria:
  - "Fail-first: a unit test opens a Studio document carrying metadata.noteTarget with the previous reader's rules (variant a: a schemaVersion-1 document migrates; variant b: the tolerant validator accepts an unknown presentation key) and asserts it opens and says what it did; it fails on the merge base."
  - "A document without noteTarget round-trips byte-identically through serialize and import."
  - "K066's rollback sentence states what a revert does to a saved document that routes the keys."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
  - "The pull request touches a guarded path (src/js/studio/*) and carries a reviewer-written .ai/repo/reviews/<pr>.yaml (project.review-verdict)."
  - "Lands after #375 (K066), which introduces metadata.noteTarget."
validation:
