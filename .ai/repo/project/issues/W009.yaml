id: W009
milestone: M102
serves:
- "instrument-kinds#sequencer-surfaces"
title: "Parameter locks on the step grid: hold a step and turn a knob, Shift+Enter, long-press; each lock checked by its parameter's descriptor"
slug: parameter-locks-on-the-step-grid-hold-a-step-and-turn-a-knob
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). The step grid kind gains locks: a held step (pointer hold, Shift+Enter, touch long-press) opens its lock row, where any lockable parameter of the target (its section 79 descriptor through the params-controls knob) writes steps[i].locks['<node>.<param>'] as one CLIP_UPDATE, the value first checked by the parameter's validateParamValue; a lock mark on the step; the step's accessible name lists its locks; Delete in the row clears a lock. The lock data and its playback are K078's. Model first: no module on main shows this kind yet, so the slice ships the model, the view model, the view and the contract test, and no runtime module imports it (esbuild leaves it out of dist, 0 B); its browser, interactivity and deployed criteria are carried by K078, which mounts it. The plan notes this on the consumer when the drafts land. Before: no lock interaction exists. After: one lock interaction for every grid. Negative cases: a value the parameter refuses (no action, its sentence); a lock on a parameter an automation lane owns (K078's refusal, stated); a lock on a step that is off. Rollback: revert. Merged plan of the component follow-up (2026-10-30): K078 depends on W009; the hold-and-turn lock gesture is this slice's."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
