acceptance_criteria:
  - "Unit tests: push(s, t) then push(s, t + 4000) writes at most one column; a tick after setFramesPaused(true) then false, and the first tick after document.hidden, deliver resumed; they fail on the merge base."
  - "Browser check `spectrogram-no-backfill` in tests/browser/app.cjs: Pause animation, start a 1 kHz tone, wait on the audio clock (a wait.cjs condition on ctx.currentTime, not a sleep), Resume, poll until the tone appears: the bright-column count stays within the columns of the time since Resume plus two; the same with an emulated hidden document."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/analysis/spectrogram.js (project.review-verdict); the builder never writes it."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
