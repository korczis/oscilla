objective: "Analysing what plays needs a workspace switch today. Sonda opens from the instrument strip over any place and shows only observed views of the digital output after the ceiling (waveform, spectrum, spectrogram, level), its subject named from soundingOwner (core/output-bus.js), \"Nic nehraje\" when idle; computed views only for the V1 instrument and labelled so (ADR 0063 decision 2, project.no-fake-science). No new audio node; no second analyser read."
why: "Product reconstruction audit of 2026-11-24 (docs/reconstruction/), target architecture 07, owner decision Q114."
