  - "src/index.html"
  - "src/js/ui/"
  - "src/js/labs/"
  - "src/js/charts/"
  - "src/js/visualization/"
  - "tests/"
depends_on: []
acceptance_criteria:
  - "With the Synth playing a note, the sheet names Synth and the engine analyser's peak bin is at the note's fundamental, in Chromium, Firefox and WebKit at 1536x1024 and 390x844."
  - "Idle: the sheet says Nic nehraje and draws no trace claimed as sound."
  - "Escape closes the sheet first without stopping audio; focus enters and returns."
  - "On a phone the sheet is at most 60 % of the height with 44 px targets; axe reports no critical or serious finding on the open sheet."
