title: "On touch the phase-offset field sits beside the Phase chart, not over its traces"
slug: on-touch-the-phase-offset-field-sits-beside-the-phase-chart-no
priority: p3
profile: implementation
objective: "Lands as fix(ui). Defect: in the Phase & Stereo panel (section#osc-panel-phase, data-osc-modes compare synthesis) div.osc-phase-offset is absolutely positioned over the chart (src/styles/integration.css:111, position:absolute, top 0, left 8px, z-index 3), and the coarse-pointer rule at src/styles/integration.css:774 raises its input#osc-phase-offset [data-osc=\"phase.offset\"] to 44 px; on touch the field then covers the top 44 of the 112 px of div#osc-chart-phase over its first 83 px of width (Compare at 390, Playground at 768), hiding the A trace label and the start of both traces. After: the offset field is a Pro form control in the Pro chart card F003 and F006 build for this panel (in the card header's actions or a toolbar row above the plot, Tailwind responsive variants for the coarse size), laid out in flow, so at every width and pointer the field and the plot share no pixel; the absolute overlay rule and the panel's entry in the coarse list leave src/styles/integration.css, and no osc-* class, selector or inline style is added (project.ui-uses-flowbite-pro). Negative cases: the field stays hidden on the Stereo tab and shown on Phase and Lissajous; its id, data-osc hook, label 'Δφ B', unit (degrees), 0-359 range and aria-label are unchanged, and the value it shows is the offset that plays (project.no-fake-science); it stays a 44 px target on a coarse pointer and a working input everywhere (project.no-inert-surfaces); the fine-pointer desktop layout loses no chart area to it. Rollback: revert the fix commit; the overlay returns and no data or stored state changes. Not this: C010 (PR #293, the field's value after an import), V220 and V241 (phase-offset function), S048 and S071 (general touch targets and coarse layouts), V252 (stepper keys hidden), U005 (PR #273, Analyzer and Compare fill their workspace), PRs #278 and #330 (markup moves only)."
why: "Found by the S074 quality-bar review of 2026-10-30 at origin/main d9db6bdf, section 74 symptom \"On touch, the 44 px phase-offset input sits over the top-left of the Phase chart and hides the A trace label and the start of the traces.\", reproduced by an independent verifier; evidence: the measured boxes (390: input x 28-111, y 451-495 on a chart x 20-370, y 451-563; 768: input y 548-592 on a chart y 548-660) and the screenshot scratchpad s074/out/probe-phase-390.png. The panel is pending Flowbite debt, but the overlap comes from the coarse-size rule, so the Pro rebuild must not carry the overlay over."
