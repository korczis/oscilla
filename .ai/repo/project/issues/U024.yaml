acceptance_criteria:
  - "Fail-first: tests/unit/phase-offset-placement.test.mjs reads src/index.html and src/styles and fails on the merge base: input#osc-phase-offset is not inside an element that a src/styles rule positions absolute or fixed, and its container is not a later sibling overlaid on #osc-chart-phase."
  - "The coarse-pointer loop of tests/browser/layout.cjs (hasTouch, 390x844 Compare and 768x1024 Playground) asserts that the bounding boxes of input#osc-phase-offset and div#osc-chart-phase do not intersect and that document.elementFromPoint at the chart's top-left plot corner returns the chart or a descendant, in chromium, firefox and webkit; it fails on the merge base."
  - "The same check asserts the field is hidden on the Stereo tab, visible on Phase and Lissajous, at least 44 px tall on a coarse pointer, and that typing 90 into it changes the offset the Phase chart draws."
  - "It adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
  - "As a fix change it carries a unit test that fails on the merge base and passes on the head (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "Definition of done, extends: the touch invariant of tests/browser/layout.cjs gains a no-overlap clause for a control over its chart."
  - "Definition of done, interlinks: the pull request names U024, F003, F006 and C010 by plan id; the tests/README.md row of layout.cjs names the new clause."
  - "Definition of done, interactivity: the offset field stays a live 44 px input on touch that redraws the Phase chart (asserted above)."
  - "Definition of done, docs, menus and routes: tests/README.md gains the row of the new unit test and the extended row of layout.cjs; no menu or route changes (stated)."
  - "Definition of done, tested: the unit test and the browser check above, and npm test; dist is rebuilt and npm run build:check passes."
  - "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
