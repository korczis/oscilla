title: "Level meter: sample peak and window RMS, peak hold, clip latch and stated read gaps"
slug: level-meter-sample-peak-and-window-rms-peak-hold-clip-latch
priority: p2
profile: implementation
objective: "Lands as feat(charts), if Q010 (OD3) answers yes; otherwise it is cancelled citing Q010, and the same change removes it from K050's depends_on (majordomus counts a cancelled dependency as not done; M062's acceptance already reads \"done or cancelled under Q010\"). A pure, allocation-free src/js/charts/level-meter-model.js reusing amplitudeToDb, and a canvas bar meter in a Pro card of the analysis panel, placed inside the panel's reference box so tests/visual/regions.json keeps its geometry, scaled -60 to 0 \"dB rel (dBFS-like)\": sample peak and RMS of the analyser window with its length in ms (fftSize / sampleRate) stated; labels never say VU, LUFS or true peak (\"sample peak, not true peak\"); a 2 s peak-hold line with its number; a clip latch \"sample >= 0 dBFS seen\" reset by a click. Gaps: when the time between reads times fs exceeds fftSize, samples were missed; only the quantities that accumulate across reads become lower bounds, so the peak hold and the clip latch show \">=\", while the window RMS and the window peak stay exact for their window and are not marked; a \"reads had gaps\" badge appears after a gap and clears after 2 s without one (hysteresis), and the status region announces it at most once per appearance. L and R come from the stereo router analysers while stereo plays, otherwise the meter says \"mono\"; a fall of 20 dB/s labelled as display ballistics snaps under reduced motion; it draws on the shared loop only when a value changed. If K016 lands first with its own meter maths, this slice moves it into level-meter-model.js and K016's Meter node view imports it. Merged plan of the component follow-up (2026-10-30): The level-meter model and the meter kind are W003's (wave 1); this slice places the meter card in the analysis panel and adds no second model."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
