title: "MEASURE zoom and pan on frequency and IR time, with the level axis fixed"
slug: measure-zoom-and-pan-on-frequency-and-ir-time-with-the-level
priority: p2
profile: implementation
objective: "Lands as feat(measure). With the shared zoom of K052: x-only zoom on the response, IR and delta charts, clamped to view.axes.x.range with a minimum span of 3 grid points (20 samples for the IR); grid-point dots appear once the spacing exceeds 8 px; IR zoom asks the adapter to rebuild buildIrView({ range }), so decimation re-runs and min/max columns are never stretched; ticks come from logTicks and linearTicks over the span. Zoom has a keyboard path (+ and - about the cursor, Shift + arrows pan, 0 resets) and a single-pointer path (Zoom in, Zoom out and Reset as a Pro button group); a plain wheel never zooms, focused or not, so a click followed by a wheel scrolls the page; Ctrl or Cmd + wheel and a pinch zoom; a mouse or pen drag brushes, a one-finger touch drag scrolls (touch-action pan-y) and a tap pins the cursor. The Pro button group sits in the card header with the badge \"ZOOMED 1.20-4.80 kHz . level axis fixed\", and the summary states the span. Zoom survives theme changes, relayout and setView. It does not depend on the spectrum zoom (K031), only on the shared modules."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
