  - "tests/browser/v3-ui.cjs: a drag zooms within the view range and Reset restores it; + and the Zoom in button zoom; after a click on the chart a plain wheel leaves the scale alone and the page scrolls; zoom survives a theme toggle; IR zoom to a short span rebuilds with decimation.factor === 1; under emulated reduced motion the scale reaches its target in one setScale; a tap on a touch pointer pins the readout. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The level axis stays the view's own fixed range and the badge says so (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/measurement, src/js/ui/measure.js (src/js/ui/measure/* after E002) and src/js/ui/experiments.js are guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
