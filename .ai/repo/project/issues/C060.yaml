title: "Back from a Studio opened by keyboard returns to where it came from: the expand does not steal focus"
slug: back-from-a-studio-opened-by-keyboard-returns-where-it-came-from
priority: p0
profile: implementation
objective: "Lands as fix(studio-ui), built by 21 on fix/p8-keyboard-back (028906c7). studioExpand in src/js/ui/studio/workspace/navigation.js focuses the graph viewport in the next animation frame unconditionally, so focus that reached the in-page Back in that frame is taken and the graph's keydown (workspace.js:487) consumes the key: keyboard Back from a Studio opened from the Sequencer does not return, and history Back and Forward then go off by one. Fast Tab and screen readers hit it. After: the expand focuses the viewport only when focus has not moved since the expand began."
why: "A product bug first seen as a webkit flake: #419 run 41942714722 attempt 1 (Browser gate webkit, cross-links P8 keyboard leg, recorded by the flake ledger as unclassified) and #417 run 41955594170 job 127010139496 (webkit/http), where C028 slice 1 printed the state: workspace studio, hash #m=studio, focus DIV data-osc=studio.graph.viewport. Root-caused by 21 (2026-11-05); af's condition after #419 was to file it on a second occurrence."
