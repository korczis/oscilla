objective: "Lands as fix(synth). src/js/synth/studio-sink.js arms the shared transport on the first note when it is not playing, and nothing disarms it on leaving the Studio, so `studioOwnsOutput()` stays true: the Playground keys and MIDI are refused with 'Studio is playing' and MEASURE's setup counts it as other audio. Leaving the Studio disarms a run the sink armed for live notes only (armed-only), never a run the user started with PLAY. Found by the retroactive review at 447bb27b (docs/reviews/synth-retroactive-447bb27b.md, S19; W1b review R2; K060)."
why: "Owner decision K060 ('Retroactive review', 2026-11-03); output ownership that outlives its surface breaks project.no-silent-feedback and blocks other workspaces."
