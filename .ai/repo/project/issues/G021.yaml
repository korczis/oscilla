id: G021
milestone: M123
serves:
  - "component-system#one-implementation-per-family"
title: "A census refuses a second implementation of a control family; today's duplicates are a baseline that only shrinks"
slug: a-census-refuses-a-second-implementation-of-a-control-family
priority: p1
profile: implementation
objective: "Lands as test(catalog). The UI catalogue (G001) gains, per control family (knob, slider, switch, patch-bay, keyboard, app-shell), its one model module and its skins (`family: { id, model, skins: [...] }` on the declarations of that family): a family has exactly one model (state, value mapping, keys, ARIA, feel) and any number of skins that draw it (the synth layer's hardware skin, the Pro skin), a skin importing the model and holding no value logic of its own. scripts/ui-catalog/families.mjs derives, from the source, every module that implements a family (a module exporting a model or a skin of the family, found by the marker comment `// ui-family: <id> model` or `// ui-family: <id> skin <name>` required at the top of an implementing module and by a scan for its known signatures: a knob's value-to-angle mapping, a switch's role=switch/radiogroup renderer, a keyboard's key layout, a cable path) and tests/unit/ui-families.test.mjs refuses a family with more than one model module, or a skin that re-implements the model's value logic, unless the extra one is listed in tests/unit/ui-families-baseline.json with its owning slice (G022-G026); the baseline only shrinks. The census has two halves. (1) Rendered: on every workspace, in every gate browser, at desktop and phone sizes (tests/browser/surface-census.cjs and tests/unit/surface-census.json reused), every element whose role matches a family's signature carries data-ui-family=\"<id>\", which only that family's one model or its skins set; an element of a family's role without it fails unless the shrink-only baseline lists it with its slice. The role signatures: slider = role=slider or input[type=range]; switch = role=switch, input[type=checkbox] styled as a toggle, or a role=radiogroup of options; knob = an svg with role=slider inside a [data-knob]; patch-bay = a [data-jack] or a cable path of the bay; keyboard = a piano key of the on-screen keyboard (data-osc keyboard.keys and its key regions); app-shell = role=banner, the sidebar navigation landmark and the page header. (2) Source: the module scan with the marker comment and these concrete signatures: knob = a value-to-angle mapping (SWEEP_DEG or an arc from a value) or controlSvg; slider = a value-to-position mapping of a track; switch = a renderer emitting role=switch or a radiogroup of options; keyboard = a key-layout function of the octave; patch-bay = a cable-path function between jacks; app-shell = a renderer of the navbar or sidebar. A module that matches a signature without the marker fails too, so the marker is not opt-in."
why: "Owner order of 2026-11-04 (M123): no parallel implementations. Without a check, a third knob or switch can land unnoticed, as S11's two knobs did."
scope:
  - "scripts/ui-catalog"
  - "src/js/ui/catalog"
  - "tests/unit/ui-families.test.mjs"
  - "tests/unit/ui-families-baseline.json"
  - "tests/browser/surface-census.cjs"
  - "tests/unit/surface-census.json"
  - "tests/README.md"
depends_on:
  - "G001"
acceptance_criteria:
  - "Fail-first: tests/unit/ui-families.test.mjs fails on the merge base (no family declarations), and its mutations prove a new module carrying a family's marker or signature without a baseline entry fails, and a baseline entry for a duplicate that is gone fails (the baseline only shrinks)."
  - "The baseline at landing lists exactly today's duplicates, each with its slice: the knob (src/js/synth/view/knob.js vs src/js/ui/synth/knob.js, G022), the switch and the slider (G023), any second patch-bay, keyboard or shell module found (G024-G026)."
  - "Rendered half: in every gate browser, at 1536x1024 and 390x844, every element of a family's role signature on every workspace carries data-ui-family or is in the baseline; a mutation adding an ad-hoc input[type=range] to src/index.html fails, and one adding a role=switch button fails."
  - "Source half: a module matching a family's signature without its marker fails (mutation), so a duplicate cannot escape by omitting the marker."
  - "The census and its baseline are documented in tests/README.md."
validation:
  - "node --test tests/unit/ui-families.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
created_at: 2026-11-04
updated_at: 2026-11-04
