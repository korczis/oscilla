id: K074
milestone: M067
serves:
  - "connected-instrument#drum-machine"
  - "connected-instrument#honest-instrument"
title: "Drum sample slot from a recording or a user file, stored by hash"
slug: drum-sample-slot-from-a-recording-or-a-user-file-stored-by-h
priority: p2
profile: implementation
objective: "Lands as feat(studio). A drum-sample node type plays a buffer the user recorded (Recorder node, capture) or loaded from a file (FileReader, decodeAudioData); the buffer lives in an IndexedDB sample store keyed by its SHA-256, the model holds only { id, sha256, name, frames, rate }, provenance names the hash, no third-party sample is bundled, and a missing sample says 'sample not in this browser' and plays nothing for it. Before: drums are synthesized only. After: a sample slot from a recording or a user file. User-value tier 3 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node type is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/studio/nodes"
  - "src/js/studio/registry.js"
  - "src/js/studio/adapters"
  - "src/js/core/storage.js"
  - "src/js/ui/synth"
  - "tests/unit/drum-sample.test.mjs"
  - "tests/browser/drums.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K073"
  - "Q023"
acceptance_criteria:
  - "tests/unit/drum-sample.test.mjs, failing on the merge base: a loaded buffer is stored once by hash, the model stays plain data, a document whose hash is missing compiles to the stated status, and an offline render plays the buffer at its frames."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a missing sample (stated, silent); a file that does not decode."
  - "A browser check in tests/browser/drums.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a sample loaded in the Drums sub-view is the node and hash the Studio Inspector shows after reload. Real-time: a hit plays the loaded sample (meter tap rises), each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: loading works by pointer, keyboard (the file input) and touch; the slot's status is announced. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Every pinned template studioHash is unchanged: it adds node types, ports, capabilities, enum options or clip kinds only, never a parameter on an existing node type (D2, K022)."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/studio and src/js/core/storage is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the line's figures stays within the cap Q023 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/drum-sample.test.mjs"
  - "node tests/browser/drums.cjs"
  - "npm test"
evidence_required:
  - "verified"
