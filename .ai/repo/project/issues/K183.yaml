acceptance_criteria:
  - "src/js/studio/runtime.js stays within its source-size cap (tests/unit/source-size-baseline.json, 58000 B) without raising it: the keys+pad train lands after coherence train B, so it first splits a module out of runtime.js (the live-update and trace classification) as a pure move with no behaviour change and its own reviewer verdict line, then K183's edits go on top (b0's order, 2026-11-05)."
  - "The X and Y routes are declared performance outputs that sum into their target and break no normal (af and 26, 2026-11-05: a plain xy.y to lpf.frequency cable would break normals n21 MG and n22 EG 2, losing the keys' filter envelope): the cable is a visible, typed, removable model edge drawn as summing in the bay, every performance output of the pad that sums into a CONTROL target (Y, and X when X is assigned to a control rather than pitch) is 0 until the first touch and returns to 0 when the finger lifts, unless Hold (Q099) keeps it; X as the pitch input ends with its note (af, after 98's review N2 of a31ad98c: a lifted pad must not leave the filter opened under the keys), the sum stays within the target's declared range, and a unit test shows n21 and n22 still active with the cable in place."
  - "K183 supersedes K167's phone first action (the explicit Patch button, #420): under option B no patch is needed, so this slice removes the button and K167's first-action criterion is recorded as superseded on its record once #420 is on main (26 and dev-53 agreed, 2026-11-05)."
  - "tests/unit/xy-default-patch.test.mjs: the default Synth document holds the Y route as a model cable with typed ports (project.typed-ports), the pad's notes reach the voice through the one Keys source (K178's KEY_ROUTES) with last-note priority, the Keys pitch and gate normals stay intact so a computer key and a pad touch both sound, and removing the Y cable leaves the pad playing pitch only."
  - "A browser check in all three engines and WebKit 390x844 touch: one pointer-down on the pad raises the active source count within a named deadline and moves the pitch with x; release silences it."
  - "The pull request carries a reviewer's verdict (src/js/synth and studio templates are guarded)."
  - "Fail-first: the unit test and the browser check named here fail on the merge base (project.fail-first)."
  - "Browser checks run through tests/browser/lib/suite.cjs with lib/wait.cjs deadlines and assume no sample rate; tests/browser/timing-baseline.json and tests/unit/ui-flowbite-pro-baseline.json do not grow; the iphone.cjs census reach does not fall."
  - "Done only after each criterion is re-checked on a main commit (b0's rule of 2026-11-05)."
