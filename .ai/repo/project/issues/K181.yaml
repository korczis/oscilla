objective: "Lands as feat(ui). The views the owner misses exist only in the Playground analysis panel (src/js/ui/p5-views.js) and the labs; the Synth's displays are computed from settings (src/js/ui/synth/display.js:1-24) and the Studio's analysis nodes never draw (K016). After: one framed live strip, one component declared once in the UI catalogue (G001), mounted on Synth, Studio, Sequencer and Analyzer, draws the scope, the spectrum and the level meter of whatever owns the output (src/js/ui/output-owner.js), in Canvas 2D, from the existing view code of ui/p5-views.js and charts (no second view implementation), with axes from the analysis' axesOf(), and shows the owner's name. It writes nothing for an interval it did not observe."
