title: "Arrangement view: tracks with arm, mute and solo over the Studio timeline"
slug: arrangement-view-tracks-with-arm-mute-and-solo-over-the-stud
priority: p2
profile: implementation
objective: "Lands as feat(synth). Size: big; it is split further into landable pull requests when started, each with its own fail-first test. The Arrange sub-view reuses the Studio timeline editor (src/js/ui/studio/timeline-editor.js and timeline-view.js) as the arrangement: track headers for instrument, audio and CV/automation tracks with arm, mute and solo (mute and solo are the track's channel node parameters; arm is view state), clips, the loop region and markers as they exist, and a link from each header to its mixer strip and instrument. Before: the timeline is Studio-only. After: an arrangement view with track headers on the same timeline. User-value tier 3 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/ui/synth"
  - "src/js/ui/studio/timeline-editor.js"
  - "src/js/ui/studio/timeline-view.js"
  - "tests/unit/ui-flowbite-pro-baseline.json"
  - "tests/browser/integration-map.json"
  - "tests/unit/arrange-view.test.mjs"
  - "tests/browser/arrange.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K107"
  - "K068"
  - "Q019"
acceptance_criteria:
  - "tests/unit/arrange-view.test.mjs, failing on the merge base: each header control is one dispatch on its channel node (or a view-state change for arm), and the arrangement and the Studio timeline render the same clips from one store."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: arm while a dialog is open (no change)."
  - "A browser check in tests/browser/arrange.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a clip moved in the arrangement is moved in the Studio timeline at the same revision. Real-time: the playhead of the arrangement follows the transport, and a mute changes the runtime gain, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: headers and clips work by pointer, keyboard and touch; headers carry roles. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every link it adds (open in, send to, a modulation route, a probe or a jump between views) is a row of tests/browser/integration-map.json, and tests/browser/integration-map.cjs walks it: the control works by pointer and by keyboard, the target shows the same Studio revision, focus lands on the target heading, and Back, Forward and reload keep the state."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "Its chrome uses the Flowbite Pro component where Pro has one (card, button, button group, input, dropdown, tabs, tooltip, popover), adapted from that block, lands after F008, is recorded as migrated (never pending) and lowers or keeps the ratchet; the instrument visuals Pro has no component for (the knob arc, the cable layer, the piano keys, the pad surface) are inline SVG and Tailwind utilities inside Pro cards, as the ADR 0061 resolution note of K058 records; it adds no osc-* class token, no legacy selector, no inline style and no stylesheet (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs); every continuous instrument parameter it shows is the knob of K058 (D11)."
  - "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the line's figures stays within the cap Q023 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/arrange-view.test.mjs"
  - "node tests/browser/arrange.cjs"
  - "npm test"
evidence_required:
  - "verified"
