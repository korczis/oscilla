acceptance_criteria:
  - "Unit tests that fail on the merge base: host-relative tooltip placement; change-only writes against a fake element; the re-hit-test decision table (scroll, resize, leave, data change, touch pin); nearest index on a log axis with its provenance text; the live-readout rate bound under a fake clock; the live-region settle rule under a fake clock; the key map with K052's zoom keys, cross-checked against GLOBAL_SHORTCUTS, MEASURE_ROWS, SEQUENCER_ROWS and STUDIO_SHORTCUTS of src/js/ui/shortcuts.js: Space, Tab, letters and Escape are never handled, and every overlap a chart host shadows while it has focus is listed by name."
  - "tests/unit/chart-host-census.test.mjs: the static scan attributes every chart mount call site of src/js, canvas, uPlot, p5 and SVG, to a census entry, a named helper or an exempt site, and fixtures with an unlisted canvas mount and an unlisted SVG chart fail it; every census host carries data-osc-chart; the bio host is done; no host leaves pending except into done; scripts/chart-census.mjs --require-complete fails on this change, since the other hosts are pending."
  - "tests/unit/charts-readout-wording.test.mjs refuses each banned term in a fixture, accepts a sourced entry that names its reference, and passes on the bio chart's wording table with its basis strings as sourced entries."
  - "tests/browser/charts-interaction.cjs, table-driven over the census's done hosts (the bio chart here): with the pointer parked over the chart, a scroll of the scrolling ancestor leaves the tooltip hidden or re-placed under the pointer; ArrowRight announces once after the keys settle; Escape clears the cursor, and with a tone playing the tone stops; Space keeps its Playground meaning (hold to play) with the chart focused; a tap pins the cursor and it stays after the finger lifts; the accessibility tree shows the host as group with its summary and table and the plot surface as application, not img; the runtime inventory finds no chart mount the census lacks. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "tests/browser/charts-interaction.cjs runs in npm run test:browser (package.json), so CI and the release gate run it. README.md's Testing table names it (tests/unit/ci-workflows.test.mjs, tests/unit/docs-derived.test.mjs), and the Keyboard shortcuts dialog shows the chart rows."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3); no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "Every osc-* use it removes leaves the record in the same change: tests/unit/ui-flowbite-pro-baseline.json is rewritten by node scripts/ui-flowbite-pro-record.mjs (osc-chip-readout falls by the bio chart's use, 3 to 2), and a selector left without a producer is deleted from src/styles/charts.css (tests/unit/css-producers.test.mjs); the pull request states by how much the debt fell."
  - "The chart reads existing AnalyserNodes on the main thread only, creates no audio node and adds no work to the audio path; hover and keyboard work runs on events only, a live readout under a still pointer is rewritten at most 4 times a second through the kit's live-readout, and no draw loop writes the DOM per frame (project.audio-engine-discipline v2)."
  - "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
  - "No visual reference is expected to move (the visual scripts park the pointer away from charts); one that does is re-accepted in both environments with its reason."
  - "scripts/size-report.mjs shows at most 5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
