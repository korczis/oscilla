title: "The figure contract, and room decay from the impulse response: Schroeder integral, EDT, T20 and T30"
slug: room-decay-from-the-impulse-response-schroeder-integral-edt
priority: p1
profile: implementation
objective: "First, the contract every M047 figure inherits: a figure kind registered with the measurement engine stores its estimate; the setup and position it estimates (for room decay: 'single-position decay estimate of this playback and capture chain at this source and receiver position', never 'the room's reverberation time'); its validity condition; its method reference without a conformance claim; and its spread or uncertainty, or the statement that none can be given. Decide and record in docs/v3/algorithms.md whether derived figures enter the result hash (they are re-derivable from the stored PCM by a versioned algorithm) and bump the experiment schema with a migration for the stored figures (ADR 0023), so an experiment saved before a figure existed loads and compares with that figure absent and said so. Then room decay: from a measured impulse response compute the energy-time curve and the backward (Schroeder) integral, limited to the full-overlap span of the deconvolution (the post-roll minus the latency, src/js/measurement/impulse-response.js) and truncated at the stated noise floor, and per octave band of the product's own filter bank (named bands and filter, IEC 61260-like without claiming its class) EDT (0 to -10 dB), T20 (-5 to -25 dB) and T30 (-5 to -35 dB) by linear regression, with the regression's correlation coefficient as the per-band spread and the run-to-run spread where the measurement has repeated runs. A band yields a figure only when its decay range above the noise floor covers its evaluation range plus a stated margin, its bandwidth-time product B x T (with T the band's own estimate) is at least 16, and its evaluation range fits in the full-overlap span; otherwise it yields no figure and the reason. Mint a versioned algorithm ID; store, export (CSV) and compare (B minus A per band) the figures like the existing results."
why: "V3 MEASURE specification sections 4 and 90-92 (docs/specs/oscilla-v3-measure.md); conversation 6abec18d, 2026-10-02T03:15:06Z. A per-band synthetic decay would prove only the fit, not the filter bank, and beyond the full-overlap span the deconvolved noise falls away artificially and would give a falsely clean decay (critique measurement-extensions, room-decay-proof-is-circular and no-uncertainty-or-reference-stated)."
