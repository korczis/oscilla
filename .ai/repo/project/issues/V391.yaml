acceptance_criteria:
  - "tests/unit/measurement-figure-contract.test.mjs fails for a registered figure kind without an estimate, setup and position label, validity condition, method reference or spread (or its stated absence), fails if a method reference claims conformance, and passes for room decay."
  - "tests/unit/room-decay.test.mjs: a broadband synthetic impulse response built from per-band exponential decays of known T (0.8 and 2.0 s, generated with FFT-domain band masks independent of the product's filter bank) plus noise at a known floor, at 44.1 and 48 kHz, passed through the product's own filter bank, gives EDT, T20 and T30 within 5 % in every band the result names as evaluated, and the evaluated bands are listed in the test."
  - "At T = 0.3 s a band with B x T below 16 (the 63 Hz octave) is refused with that reason; a decay whose evaluation range does not fit in the full-overlap span (T = 3.0 s with the default 1.5 s post-roll) is refused with that reason; a decay range too short above the floor is refused with that reason; never a number."
  - "An experiment saved before this change loads, migrates and compares with the figure absent and said so; the figures carry the new algorithm ID, survive the experiment round trip and CSV export, and the comparison shows B minus A per band."
  - "docs/v3/algorithms.md documents the contract, the hash decision and the method; .ai/repo/features/impulse-response.md no longer says these figures are not computed."
  - "The pull request carries a reviewer's verdict and, as a feat change, fail-first (project.review-verdict, project.fail-first); a capped file it grows past its cap is split first or its raise is declared in tests/unit/source-size-baseline.json's raises ledger."
  - "tests/README.md has a row for each new test; V399 registers the claims; this issue does not edit docs/CLAIMS.yaml or the intent."
validation:
