title: "The output says when the safety ceiling acts, and the gain readout says it is a setpoint"
slug: the-output-says-when-the-safety-ceiling-acts-and-the-gain-re
priority: p1
profile: implementation
objective: "Truth-table rows GEN-01 (scratchpad p05/truth-table.md). The engine reports when its ceiling acts, read from the signal before the ceiling (an engine-owned tap: max |x| before the WaveShaper above MAX_OUTPUT_GAIN), sampled in the existing draw loop without per-frame DOM work. The status bar and the gain readout show OUTPUT AT CEILING (clipped) with text and a glyph; the gain title reads as a setpoint before filter, envelope, limiter and the -12 dBFS ceiling (relative, not SPL); the engine comment is corrected and ADR 0002 gets a resolution note that an insert can push one voice past the cap and the UI then says so. The ceiling itself stays (ADR 0002 safety backstop)."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): A 1 kHz sine at the default gain 0.08 through Filter Lab peaking 1 kHz, Q 1, +24 dB is hard-clipped by the -12.04 dBFS output ceiling (peak -12.04 dBFS, crest factor 0.69 dB, 79.2 % of samples at the ceiling) while the gain readout says -21.9 dB, the status bar says nothing, and audio-engine.js:245-247 claims the UI gain is the level that reaches the output."
