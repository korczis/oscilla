acceptance_criteria:
  - "Fail-first fixture: tests/unit/readout-states-ceiling.test.mjs: a pure ceilingState({ pre, cap }) on synthetic buffers. 0.08·sin → not acting; 1.27·sin (0.08 boosted by +24 dB) → acting, with the fraction of samples above the cap; fails on the merge base (no such state). Browser check in tests/browser/app.cjs (Chromium, file://): the path of the audit probe (setContinuous, setFrequency 1000, latch, filter peaking 1 kHz Q 1 +24 dB) shows the indicator; the same path without the filter does not."
  - "Negative cases, each asserted: A sine, square and sawtooth at 100 % gain with no insert do not trigger it: their pre-ceiling peak is at or below the cap (sine -12.04, square -12.45, saw -12.70 dBFS), compared with a float tolerance of 2^-20, so a 20 Hz sine whose neighbouring samples sit within 1e-4 of its peak is not flagged; idle shows nothing; the indicator clears within a named deadline after the boost is removed."
  - "Revertible on its own: Revert the pull request: indicator, copy and ADR note only; the audio path is unchanged apart from the read-only tap, which the revert removes."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
