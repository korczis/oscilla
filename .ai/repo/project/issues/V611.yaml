title: "Magnetic port capture, port-row hit targets, refusal reasons with the cycle outlined, and keyboard wiring in both directions"
slug: magnetic-port-capture-port-row-hit-targets-refusal-reasons-w
priority: p2
profile: implementation
objective: "P04 slice C (typed edge UX). Lands as feat(studio-ui), in a new src/js/ui/studio/graph-wire.js beside K006's graph-gestures.js. (1) While a cable is dragged, a pure nearestPort(geometry, point, radius) over the model's node positions and port rows captures the cable end at the nearest port within 32 screen pixels, compatible ones first; the whole port row, label included, is the hit target (at least 24 px on a coarse pointer). (2) Hovering or dropping on an incompatible port writes canConnect's sentence into the existing graph banner and the polite live region; a drop that would close a cycle shows the project.no-silent-feedback sentence and selects the cycle's nodes for 2 s as view state (nothing in history). (3) Shift+C on a selected node opens the connection dialog in the input direction: each input of the node with the outputs that can feed it, refused ones with their reasons; Enter on a row is one EDGE_ADD. (4) On touch, a released cable end within the radius of a compatible port connects. Every connection goes through canConnect and the store; the existing is-compatible and is-incompatible classes carry the highlight."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
