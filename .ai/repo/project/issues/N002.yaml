id: N002
milestone: M111
serves:
- "parameter-controls#one-interaction-model"
title: "One interaction model: keys, drag, fine adjustment, reset and double-tap as pure functions, wired to the Inspector and lab sliders"
slug: one-interaction-model-keys-drag-fine-adjustment-reset-and-doub
priority: p2
profile: implementation
objective: "Lands as feat(ui). src/js/ui/catalog/param-input.js exports keyStep(spec, value, key, { shift }), dragStep(spec, start, dy, { shift }), resetValue(spec) and isDoubleTap(prev, next): ArrowUp and ArrowRight one step (log parameters 1/100 of the display range in the log domain, about a tenth of an octave over 20 Hz-20 kHz; linear parameters their step, else 1/100 of the range; integers 1), Shift a tenth of that (integers 1), PageUp and PageDown a tenth of the range, Home and End the display range's ends, Space never taken (ADR 0050); a knob drag of 200 px is the full range with Shift x0.1; reset is double-click and a double-tap (two touch pointerups within 300 ms on one control), never a letter key (R is a note key of the computer-keyboard piano). Rounding is G003's sliderToValue. Wired without markup change: the Studio Inspector's range inputs (inspector.js numberField) and the Filter Lab, Envelope, Additive and Synthesis range inputs of src/index.html take keyStep and the reset, each key press and reset one commit (one history entry in the Studio). Before: VERIFIED arrows move one native step, 1/1000 of the slider positions, linearly across the log mapping; nothing resets to the default. After: one model, Shift for fine, reset everywhere. Negative cases: a key on a disabled control, Home with a value beyond softRange, Shift on an integer, Space. Rollback: revert; nothing stored changes."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, KB and interlinking; full DAW, full sequencer, full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels in one generic way, integrated with Majordomus; every element tweakable; mobile first; the landing easy to use, easy to extend and open to hack. Owner decisions: knobs that always show value and unit (D11, Q018, the ADR 0058 note of 2026-10-29), every parameter on the box face (Q031), the generator in its own workspace (Q033). Design: the params-controls part of the component follow-up of 2026-10-29 (scratchpad components-followup/params-controls.md), checked against origin/main b67d1e58 and the head of plan pull request #285 (c0a631b2)."
