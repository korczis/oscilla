acceptance_criteria:
- "tests/unit/param-input.test.mjs fails on the merge base: a table of specs (log frequency, linear level, seconds, integer, bipolar cents) gives the expected value for every key with and without Shift, for drags of 0, 100 and 200 px, and for reset; a double-tap pair 299 ms apart is one, 301 ms apart is not."
- "Definition of done, tested: tests/browser/labs.cjs and tests/browser/v31-studio-graph.cjs focus the Filter Lab cutoff and the Inspector cutoff of a Filter node, press ArrowUp, Shift+ArrowUp, PageUp and Home, double-click and double-tap (hasTouch), and wait with until() (deadline 'parameter key applied', 2 s) for the value, the readout and aria-valuetext to agree after each; in the Studio each step is one undo entry. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), runs at 390x844 and at 1536x1024, adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, extends: the Inspector's slider mapping (inspector.js valueToSlider, sliderToValue) and G003's model."
- "Definition of done, interlinks: the knob (K058), the slider and field (G008) and every face control use these functions, never their own."
- "Definition of done, interactivity: every continuous control in the labs and the Inspector gains Shift fine adjustment, PageUp, Home and End, and reset."
- "Definition of done, docs, menus and routes: the Keyboard shortcuts dialog lists the control keys once, and states that Shift is fine on a control and x4 when moving a box; docs/v31/user-guide.md says the same. tests/README.md has a row for each new test; the parameter's or view's catalogue entry names its docs, links and tests (G001 trace part); dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; no module, listener or string it adds contains an osc- name; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 1.0 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the line's sum stays within its row of the cap Q037 records, under the 1.2 MB gzip budget of scripts/build-config.mjs (project.single-file-deliverable)."
