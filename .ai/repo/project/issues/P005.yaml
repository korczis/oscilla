objective: "Change the About copy in src/index.html to what Q005 decided on 2026-10-18: the Origin paragraph (now 'OSCILLA began with a simple question: how much of an acoustic laboratory could live entirely inside a web browser?') tells the documented start, the owner's reaction to an anti-bark ad promising 'ultrasound through any phone's speaker' that only dogs hear (a phone tone around 15-16 kHz is audible to many people and is not ultrasound; the copy states no frequency as the vendor's) with 'this can be knocked together in one HTML5', growing that night into a lab, and keeps the browser-laboratory question only as the framing the project grew into; it neither names nor characterises the company behind the ad beyond 'an anti-bark ad', and tells no personal motive (knowledge record oscilla-origin-in-the-transcripts). The 'Built in one night.' statement and its 5 h 51 min stay, qualified as wall-clock time from the first tracked commit to V2 with several AI workers in parallel (knowledge record built-in-one-night-is-wall-clock), and the copy cites no figure the knowledge records do not measure. Add tests/unit/about-origin.test.mjs, which reads the shell markup through E005's shared reader of the assembled shell once that exists (src/index.html until then) and fails when the Origin paragraph tells the simple question as the start, when the pace statement lacks the qualifier, or when the copy names the company or a figure the records do not measure; and update the about checks of tests/browser/app.cjs where the copy they read changes. If the owner overrides Q005, the test follows the owner's decision. It follows P003 because both change the About section and its tests."
why: "Q005 asks for the public story to follow the record; its implementation is separate from the decision (Q005: 'this issue changes no copy')."
