    result: "Decided on 2026-10-31 by the consultation the owner asked for instead of choosing an option (owner, verbatim: 'porad se s ostatnimi isntances / llms / providers, mirim top notch'); the owner may override it. The Inspector does not move to knobs: one parameter control per declaration (N001 paramSpec, N003 mountControl, N004 control menu) with two views sharing mapping (taper, step), value text, reset, menu and MIDI learn: the knob on performance surfaces (the Synth panel and the Studio node faces), the Pro range + number in the Studio Inspector (with a small arc readout as the visual tie), labs, MEASURE and settings; fine adjustment on the knob works without a drag modifier (arrows or keys), and a switching-cost test at 390 px and on desktop (adjust on the Synth, find it in the Inspector, fine-correct, return; compare hesitation and wrong-parameter edits) is the acceptance check. Positions: oscilla-26 A, oscilla-af A, oscilla-b0 B then A, codex A ('Consistency should mean the same parameter, value, mapping, formatting, reset behavior, menu and MIDI assignment - not necessarily the same shape'; 'A better suits a narrow Inspector'; 'Fine adjustment must also be achievable without a drag modifier'); gemini failed (IneligibleTierError), ollama had no models, chatgpt had no client."
