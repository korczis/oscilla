owner: "repository owner"
objective: "D11 makes the knob the control of every continuous instrument parameter in the Synth workspace. The Studio Inspector shows the same parameters with Pro range sliders and numbers. The plan recommends that the Inspector's continuous node parameters use the same knob (one control for one parameter definition), while labs, MEASURE and settings keep Pro range and number inputs."
why: "Asked by the connected-instrument plan (owner direction of 2026-10-29). .ai/repo/project/README.md: work that waits on an answer names the Q issue in depends_on."
current_state: "Answered on 2026-10-31 by consultation the owner delegated: asked through AskUserQuestion (oscilla-26), the owner chose no option and answered 'porad se s ostatnimi isntances / llms / providers, mirim top notch' (consult the other instances, LLMs and providers; I aim for top notch). oscilla-26, oscilla-af and codex chose A, oscilla-b0 moved from B to A; gemini, ollama and chatgpt could not answer (see evidence). The Inspector keeps the Pro range + number with a small arc readout; the knob is the view on the Synth panel and the Studio node faces; both are views of one control per declaration (N001, N003, N004). The owner may override it. K096, which names this issue in depends_on, is built from that answer."
