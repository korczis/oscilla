acceptance_criteria:
  - "Fail-first: tests/unit/units.test.mjs drives the knob's text and the Inspector's text for the same values (440.5, 999.95, 1000, 12500 Hz) and asserts they are equal; it fails on the merge base (the knob reads '441 Hz')."
  - "A static scan of src/js (comments removed) finds one hzText body and no frequency formatter outside src/js/core/frequency.js other than the method-specific formatters G002 left out of scope (src/js/measurement/smoothing.js, src/js/experiments/schema.js); a mutation that re-adds a copy fails the scan."
  - "tests/unit/freeze.test.mjs passes with tests/freeze/vectors.cjs and tests/freeze/golden-a7b7a23.json byte-identical to the merge base."
  - "Every text a user saw before is listed with its after value in the pull request; a visual reference that changes is re-accepted through the visual gate with the reason."
  - "Typed entry in a Synth Hz knob accepts '2.5k' and refuses '2,5k' and '1e3' with the sentence parseFrequency gives for each."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
  - "The pull request touches a guarded path (src/js/experiments/*, src/js/measurement/*) and carries a reviewer-written .ai/repo/reviews/<pr>.yaml (project.review-verdict)."
  - "Lands after the feature train #367, which introduces src/js/synth/view/knob.js and G002's units module."
