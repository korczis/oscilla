id: G020
milestone: M085
serves:
  - "component-system#proven-duplicates"
title: "One value formatter for every frequency readout: the Synth knob and the three hzText copies format through core/frequency.js"
slug: one-value-formatter-for-every-frequency-readout-the-synth-knob-and-the-three-hztext-copies
priority: p2
profile: implementation
objective: "Lands as fix(ui). After G002 (#349, in the #367 train) src/js/core/frequency.js is the one units module, but four frequency formatters still sit beside it: the Synth knob's formatValue case 'Hz' (src/js/synth/view/knob.js, sig(v) to three significant digits below 1 kHz and fixed(v / 1000, 2) above) and three identical hzText bodies (src/js/experiments/evidence.js:60, src/js/experiments/findings.js:101, src/js/measurement/views/response-chart.js:111, each toPrecision(4)). Before: the same StudioModel value of 440.5 Hz reads '441 Hz' on the Synth knob and '440.50 Hz' in the Inspector. After: the knob's Hz text and the three hzText call sites format through core/frequency.js (formatFrequency, or one named sibling there when a reference label keeps its stated precision), hzText has one definition, and the knob's parse goes through parseFrequency so typed entry accepts and refuses the forms G002 froze with the same sentences. The reference labels of experiments and measurement are stated values (a profile point, a requested reference), not measured readouts; their text may change only where the pull request lists the before and after, and no scientific readout gains or loses precision (project.no-fake-science). Rollback: revert; no stored record holds formatted text."
why: "Review of the feature train #367 (oscilla-af, verdict at 5cad3dcf, finding F2 'D1', P2): src/js/synth/view/knob.js formats and parses StudioModel params differently from the Inspector and G002's units module, and F6 names a third hzText copy. A value shown two ways is the duplication the component-system intent set out to remove."
scope:
  - "src/js/core/frequency.js"
  - "src/js/synth/view/knob.js"
  - "src/js/experiments/evidence.js"
  - "src/js/experiments/findings.js"
  - "src/js/measurement/views/response-chart.js"
