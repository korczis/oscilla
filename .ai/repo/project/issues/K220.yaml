acceptance_criteria:
  - "Fail-first unit: pad L is a second xy-pad module of the Synth panel whose X and Y outputs are normalled to the LPF cutoff and the HPF cutoff (log mapping, typed CONTROL edges, a cable replaces each normal, no NODE_PARAM_SET shortcut), a touch on it moves those targets through transport.live and its release returns them to rest; pad R's touch plays a note of the scale and its release ends it; on the merge base no second pad exists."
  - "Browser (chromium, firefox, webkit): both pads are on the Synth face at 1536 px and stacked at 390 px, each answers pointer and keyboard (arrows move the point), Stop releases both."
  - "One pad implementation (xy.js) serves both; the census rows exist (C062 is not widened)."
  - "Guarded (src/js/synth): a non-builder verdict."
