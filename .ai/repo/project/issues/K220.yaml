title: "Two performance pads under the Synth face: L on two parameters (cutoff, resonance), R on pitch in a scale and gate"
slug: two-performance-pads-under-the-synth-face
priority: p1
profile: implementation
objective: "Lands as feat(synth). Q103 (3): below the Synth panel at 1536 px (stacked at 390 px), two XY pads share the panel's store. Pad L drives two parameters of the panel through the Studio model (default X the low-pass cutoff, Y its resonance; each axis's target chosen in its settings from the parameters the panel exposes, the mapping log for a frequency); pad R plays the Keys like the existing XY pad (pitch in the chosen scale on X, gate or velocity on Y, the scale selector beside it). Both draw their touch point, release on Stop and on leaving (the shared mount of 3.21), and record into a notes or automation clip when record is armed. Reuses src/js/synth/xy.js and panels/xy.js (one pad implementation, two instances), no second pad model. Each pad is an xy-pad node of the Studio model: its X and Y are typed control output jacks in the patch bay, so the cutoff and resonance targets are normals a cable replaces (project.typed-ports, project.studio-model-is-canonical), never a hard-wired special case; the pad's touch, release and recording go through the one shared note and gesture paths (the owner's Q103 constraint: no one-offs, all connectable, one living system over shared state)."
why: "Owner direction Q103 (an integrated pad like the reference); the Synth has one XY pad on its own tab today."
scope:
