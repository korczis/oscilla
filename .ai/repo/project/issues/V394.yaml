acceptance_criteria:
  - "tests/unit/chain-delay.test.mjs: synthetic delays of 0, 1 234 and 4 800 samples are recovered exactly and a fractional delay within 0.5 sample; an uncorrelated capture yields no delay and the reason; a result without the recorded clock relationship is labelled capture offset, never latency; it fails on the merge base."
  - "docs/v3/algorithms.md records the clock relationship measured in each gate browser with its commands, and .ai/repo/features/impulse-response.md says what the figure is."
  - "The figure follows the V391 contract (tests/unit/measurement-figure-contract.test.mjs passes with this figure kind registered)."
  - "The pull request carries a reviewer's verdict and, as a feat change, fail-first (project.review-verdict, project.fail-first); a capped file it grows past its cap is split first or its raise is declared in tests/unit/source-size-baseline.json's raises ledger."
  - "tests/README.md has a row for each new test; V399 registers the claim; this issue does not edit docs/CLAIMS.yaml or the intent."
