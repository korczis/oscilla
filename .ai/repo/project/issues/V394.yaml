id: V394
milestone: M047
serves:
  - "measurement-extensions#round-trip-latency"
title: "Delay of the measured chain, and a round-trip latency only where the clock relationship supports it"
slug: round-trip-latency-of-the-measured-chain
priority: p2
profile: implementation
objective: "The repository says the alignment lag is not a latency: .ai/repo/features/impulse-response.md says the peak time includes unknown device and browser delays and 'is not a time of flight and not a latency', and specification section 91 says 'no latency claim without a sufficient clock relationship'; src/js/measurement/align.js already recovers the lag to sub-sample accuracy (oscilla.align.xcorr.v2). So first establish and record in docs/v3/algorithms.md the clock relationship of capture and playback: whether both ends are timed on the AudioContext clock, what outputLatency, baseLatency and the MediaStream input path add, and how far the lag repeats across runs and reloads in each gate browser. Where that relationship holds, report the round-trip latency in samples and milliseconds at the context rate with its run-to-run spread and what it includes (output, input and scheduling path, plus the acoustic path, separated only when the user states a distance), and supersede the feature record's sentence; where it does not, name the figure the capture offset of the measured chain and never a latency, and leave the sentence as it is. It follows V393 because both extend the stored result schema and the result views."
why: "V3 MEASURE specification sections 4 and 90-92 (docs/specs/oscilla-v3-measure.md); conversation 6abec18d, 2026-10-02T03:15:06Z. The plan must not ship the latency claim the record forbids (critique measurement-extensions, latency-contradicts-the-record)."
