id: K007
milestone: M057
serves:
  - "playable-instrument#patching-gestures"
title: "A wheel or two-finger scroll pans the graph, Ctrl/Cmd + wheel zooms at the pointer"
slug: two-finger-wheel-pans-the-graph-ctrl-wheel-and-pinch-zoom-at
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). The wheel handler (onWheel, graph-editor.js:915 on main, wired at :979; in graph-gestures.js after K006) zooms on every wheel event. A plain wheel or two-finger scroll pans the view by deltaX and deltaY (Shift turns a vertical wheel sideways); Ctrl/Cmd + wheel, which is also how browsers report a trackpad pinch, zooms at the pointer, bounded to about one zoom step per event. This changes mouse-wheel zoom into Ctrl/Cmd + wheel, and the pull request and the user guide say so; the + and - buttons, the zoom keys and the two-pointer touch pinch already on main (graph-editor.js:570-577, 685-688) are unchanged. The pointer-model comment is updated, and the feature record .ai/repo/features/studio.md and docs/v31/user-guide.md stop listing the minimap (V602) and timeline pinch (V603) as not built, since both are on main; K007 builds neither."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
scope:
  - "src/js/ui/studio/graph-gestures.js"
  - "src/js/ui/studio/graph-editor.js"
  - "src/js/ui/studio/graph-view.js"
  - "tests/unit/studio-graph-wheel.test.mjs"
  - "tests/browser/v31-studio-graph.cjs"
  - ".ai/repo/features/studio.md"
  - "docs/v31/user-guide.md"
  - "tests/browser/timing-baseline.json"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K006"
acceptance_criteria:
  - "In a browser check deltaX and deltaY pan the view and Ctrl zooms it at the pointer. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac) (project.suite-harness, project.bounded-test-timing)."
  - "tests/unit/studio-graph-wheel.test.mjs fails on the merge base: a plain wheel pans by its deltas and never zooms, and Ctrl/Cmd + wheel zooms at the pointer by a bounded step."
  - "The feature record .ai/repo/features/studio.md and docs/v31/user-guide.md list the minimap and timeline pinch as built and say how a mouse user zooms."
  - "No reviewer's verdict is needed (src/js/ui/studio is not a guarded path); as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first). It adds no markup, osc-* class token or stylesheet selector, so the Flowbite Pro ratchet stays flat (node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/studio-graph-wheel.test.mjs"
  - "node tests/browser/v31-studio-graph.cjs"
  - "npm test"
evidence_required:
  - "verified"
