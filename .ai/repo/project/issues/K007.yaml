objective: "Lands as feat(studio-ui). The wheel handler (graph-editor.js:979 on main, in graph-gestures.js after K006) only zooms. deltaX and deltaY pan the view; Ctrl+wheel and a two-pointer pinch zoom at the pointer. The pointer-model comment and the feature record .ai/repo/features/studio.md (minimap and pinch) are updated."
