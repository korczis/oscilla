acceptance_criteria:
  - "Fail-first fixture: tests/unit/readout-in-effect-mic-freeze.test.mjs: a fake reader whose level changes between frames; after freeze, chart.setPeak receives the interpolated peak of the frozen buffer (within the 0.09 dB bound peak-detector.js documents), not the earlier tick. A copy test reads the titles from AVERAGE_TAU_S and the smoothing constants. Fails on the merge base."
  - "Negative cases, each asserted: Unfrozen live readout cadence (100 ms) unchanged; a steady tone still agrees within 0.5 dB; peak-hold behaviour unchanged."
