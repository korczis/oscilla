title: "A frozen microphone view shows one moment, and the traces state their averaging"
slug: a-frozen-microphone-view-shows-one-moment-and-the-traces-sta
priority: p2
profile: implementation
objective: "Truth-table rows MIC-06, SPC-09, MIC-08 (scratchpad p05/truth-table.md). Turning Freeze on runs measure() on the same reader frame before the chart freezes, so the dot, chip and readout describe the frozen trace. The Compare buttons carry titles from exported constants (Average: exponential power average, time constant 1 s; Peak hold: per-bin maximum since enabled, no decay; Freeze: holds the current frame), and the dialog says (beside the K030 provenance line with the smoothing of each node) both traces are smoothed by the browser analyser and that the generator trace is the digital output on its own full scale."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): Freeze freezes the trace on the click frame while the dot, chip and \"relative level\" readout come from the last 100 ms measure(): reproduced as a frozen trace maximum of -20.8 dB beside a dot and chip at -30.4 dB. The node smoothing (0.5 microphone, 0.55 output), the 1 s Average time constant and the different references of the two traces are stated nowhere in the UI (open item docs/v3/audits-v383.md:112)."
