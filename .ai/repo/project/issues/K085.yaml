title: "Keyboard and sequencer notes in the note view beside the spectrum"
slug: keyboard-and-sequencer-notes-in-the-note-view-beside-the-spe
priority: p2
profile: implementation
objective: "Lands as feat(midi). V504's note view (incoming and generated notes beside the spectrum and waveform) shows the Keys node's notes from every source (piano, computer keys, MIDI, sequencer) with their names and velocities. Before: the note view shows MIDI notes only. After: it shows every source's notes. User-value tier 3 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/midi"
  - "src/js/synth"
  - "src/js/ui"
  - "tests/browser/integration-map.json"
  - "tests/unit/note-view-sources.test.mjs"
  - "tests/browser/midi.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "V504"
  - "K065"
acceptance_criteria:
  - "tests/unit/note-view-sources.test.mjs, failing on the merge base: each source's note appears once with its source and velocity."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a note without velocity (sequencer default stated)."
  - "A browser check in tests/browser/midi.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: the note view links to the Synth workspace's Keys node and back. Real-time: a piano key and a sequencer step each appear in the note view at their time, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the note view's list is reachable by keyboard and its rows have accessible names. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every link it adds (open in, send to, a modulation route, a probe or a jump between views) is a row of tests/browser/integration-map.json, and tests/browser/integration-map.cjs walks it: the control works by pointer and by keyboard, the target shows the same Studio revision, focus lands on the target heading, and Back, Forward and reload keep the state."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/synth is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 1 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the line's figures stays within the cap Q023 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/note-view-sources.test.mjs"
  - "node tests/browser/midi.cjs"
  - "npm test"
evidence_required:
  - "verified"
