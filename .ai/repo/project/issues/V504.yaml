acceptance_criteria:
  - "Show incoming and generated notes (name, velocity) next to the existing spectrum and waveform views, in the OSCILLA visual language, with a non-pointer path and announcements."
  - "Decision: .ai/repo/adrs/0058-midi-is-an-optional-local-input-layer-over-the-audio-engine.md; the visual identity lock applies."
  - "From K085 (merged by Q112): the note view shows the Keys node's notes from every source (piano, computer keys, MIDI, sequencer) with their names and velocities; tests/unit/note-view-sources.test.mjs fails on the merge base: each source's note appears once with its source and velocity, and a note without velocity shows the sequencer default, stated."
  - "From K085 (merged by Q112): a browser check in tests/browser/midi.cjs, wired into npm run test:synth so CI and the release gate run it, fails on the merge base. Linked: the note view links to the Synth workspace's Keys node and back. Real-time: a piano key and a sequencer step each appear in the note view at their time within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the note view's list is reachable by keyboard and its rows have accessible names. It runs inside tests/browser/lib/suite.cjs, assumes no sample rate and adds nothing to tests/browser/timing-baseline.json."
  - "From K085 (merged by Q112): every link it adds is a row of tests/browser/integration-map.json walked by tests/browser/integration-map.cjs; every string it adds passes tests/unit/synth-wording.test.mjs (project.no-fake-science); a change under src/js/synth carries a reviewer's verdict (project.review-verdict) and a feat or fix change a unit test that fails on the merge base (project.fail-first); scripts/size-report.mjs shows at most 1 KB gzip added within the cap Q023 records; tests/README.md has a row for each new test and dist is rebuilt."
