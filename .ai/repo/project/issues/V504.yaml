current_state: "2026-11-18: K085 (every Keys source in the note view) merged into this issue by the plan triage the owner approved in bulk (Q112: 'schvaluji vse', 2026-11-18T02:27Z, Claude Code session 980e22ee-d9d4-4dd0-8318-8b727f127ce9, oscilla-e5; triage derived from origin/main 4682eea4): since K178 and K183 every source feeds the one Keys node, so the incoming and generated notes this issue shows are K085's notes; its criteria are the ones that start 'From K085'. K085's scope src/js/ui was not taken over, so the scope stays as narrow as the note above explains; src/js/ui/midi covers the view. The issue moved from M045 to M069 with the milestone merge of the same triage. Updated 2026-10-18. The scope names only MIDI paths plus the one integration file the criteria need, so that majordomus intent realization does not infer unrelated earlier work as realising this intent (audit finding main-plan F9, 2026-10-18). src/index.html is the integration file for the note view. It follows V503 as well as V502 because both change src/js/midi (scope conflict in the same wave, simulated 2026-10-18)."
