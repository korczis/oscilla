id: U076
milestone: M054
serves:
  - "ui-current#ui-audited"
title: "A test names a census surface only through a counted locator form in executable code, measured on a branch before it lands"
slug: a-test-names-a-census-surface-only-through-a-real-locator
priority: p1
profile: implementation
objective: "Lands as test(census). Line numbers at origin/main a19f1ff6. 'Has a test' is decided by text predicates over the whole test file (tests/unit/surface-census.test.mjs:265-293, judged at :391-401). For a subview the predicates include a prefix branch (:281-282): the file contains the subview's id prefix anywhere and the value quoted anywhere. That, not a comment, is why assigning tests/browser/control-census.cjs to presets.tab:musical passes ([]): the prefix osc-ptab-cat- occurs in '#osc-ptab-cat-custom' (control-census.cjs:1182) and an unrelated 'musical' string at :801 satisfies the quoted value, two facts about other surfaces. After: the census check parses the named test file, strips comments, and counts a surface only when one counted locator form names it in executable code: (a) a CSS selector string literal ([data-osc=\"<key>\"] or #<id>) passed as the first argument to a Playwright page or locator method (click, locator, $, $$, waitForSelector, focus, hover, check, fill, dispatchEvent; page.dispatchEvent has 3 calls today) or to a named repository helper: a method of a helper object defined in the same file (control-census.cjs:92 D, whose D.click has 122 calls across the suites; app.cjs:121 and cross-links.cjs:99 H) or an export of tests/browser/lib/*.cjs; (b) syntactically, a call getByRole(role, { name: <literal> }), getByTestId(<literal>) or getByLabel(<literal>) whose literal equals the surface's accessible name or test id; (c) a string literal containing the surface's deep-link hash passed to page.goto, to H.open (74 calls, as H.open(context, base) with base carrying the hash) or assigned to location.hash; (d) syntactically, for a workspace, a call that passes the workspace id as a string literal to the shell's navigation (nav.<id> selector under (a), setWorkspace(<literal>), or a WORKSPACES-driven loop whose list the census test resolves to the id). A template literal counts only when its static text is the whole selector, or its interpolated values are a literal array in the same file that holds the surface's value. A string in a comment, a log or assertion message, or a variable never passed to one of those forms does not count."
why: "oscilla-b0 Total Coherence audit of main 68b117f3, slice A; af's critique N6 (mesh, 2026-11-05): the forms must be stated. af's critique of 96daa67b (BLOCKING 7): the stated cause was wrong (the subview prefix branch, not a comment), and the closed list of forms left out D.click (122 calls), H.open with a hash and page.dispatchEvent, so many surfaces would lose their test at once; the loss must be measured on a branch before landing."
scope:
  - "tests/unit/surface-census.test.mjs"
  - "tests/unit/surface-census.json"
  - "tests/README.md"
depends_on:
  - "U075"
acceptance_criteria:
  - "Measured first: before the pull request is opened, a branch run of the new check over every census entry on main lists each surface that would lose its test and the form it is reached by today; the list and its count are in the pull request body, and each lost surface is either reached by a form above (the form list is widened in the same change if a repeated helper is missing) or recorded as test debt under U075's ratchet with a reason."
  - "Fail-first: a unit mutation that assigns tests/browser/control-census.cjs to presets.tab:musical is refused (no counted form names '#osc-ptab-cat-musical' or the tab's data-osc there); on the merge base the mutation passes with [] through the prefix branch (:281-282)."
  - "A fixture test file that names a surface only in a // comment, a /* block */ comment, an assertion message and a variable never passed to a counted call is refused for each; the same surface reached through each form (a) with page.click, with D.click and with page.dispatchEvent, (b), (c) with page.goto and with H.open, and (d) is accepted, one case each."
  - "The counted forms and the helper rule are listed once, in the test, and tests/README.md's row quotes them."
  - "Not a guarded path under v2; R031's v3 does not reach tests/, and R033 guards this file only if a rule's enforcement names it. Lane: oscilla-21, af as critic."
validation:
  - "node --test tests/unit/surface-census.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
