id: G002
milestone: M085
serves:
- "component-system#proven-duplicates"
title: "One units module: one frequency grammar, one millisecond and one clock formatter for every control, readout and chart"
slug: one-units-module-one-frequency-grammar-one-millisecond-and-o
priority: p2
profile: implementation
objective: "Lands as fix(ui). D3 of the inventory: six frequency formatters, two frequency parsers with different grammars, two byte-identical formatMs bodies and four clock formatters. src/js/core/frequency.js becomes the one units module (parseFrequency, formatFrequency, formatFrequencyShort, formatMs, formatSeconds, formatClock); charts/axes.js parseFrequency and formatHz, sequencer/model.js formatCompactFrequency and formatMs, the compact Studio's compactTime and timeline-view.js formatClock / formatSecondsText import it. The one grammar is V1's, frozen by tests/freeze/vectors.cjs and tests/freeze/golden-a7b7a23.json and left unchanged: parseFrequency of core/frequency.js accepts a decimal point, a k suffix and a unit, and refuses a comma decimal ('1,5k'), an exponent ('1e3'), zero, negatives and non-finite values with the sentences the golden records ('Frequency must be greater than 0 Hz.' for '0', the 'is not a frequency' sentence for '-5' and the rest); charts/axes.js parseFrequency, whose only caller is Filter Lab and which also takes '2,5k' and '1e3', is deleted, so Filter Lab refuses those forms with the same sentence as every other field, a behaviour change the pull request lists. formatFrequency, formatFrequencyShort and formatMs keep the outputs the golden records; a folded formatter that printed other text (formatHz, formatCompactFrequency, compactTime, formatClock) changes its callers' text, never the frozen functions' output, so the guarded modules that import core/frequency.js (src/js/audio/patterns.js, src/js/studio/nodes/common.js, src/js/studio/signal-path-projection.js) see no change and need no verdict. The scientific formatters of src/js/measurement/smoothing.js and src/js/experiments/schema.js keep their method-specific precision and stay out of scope (project.no-fake-science); src/js/studio/timeline.js formatSeconds is folded only if a reviewer's verdict covers it. Before: VERIFIED Filter Lab accepts '2,5k' and the Playground frequency field does not; the clock rounds in one place and floors in another (inventory X2-X4, R3). After: one grammar and one text per quantity. Negative cases: '0', '-5', 'abc', '1e309', '1,5k' and '1e3' refused through every entry point with the sentence the V1 golden records for that input. Rollback: revert; no stored record holds formatted text."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
