acceptance_criteria:
- "tests/unit/units.test.mjs fails on the merge base: the same input table ('2.5k', '2.5 kHz', '2500', '2,5k', '1e3', '0', '-5', 'abc') gives the same result through every entry point, equal to the V1 golden's parseFrequency case for that input ('2,5k' and '1e3' refused), and formatMs, formatClock and formatFrequency have one definition each (a static scan of src/js, comments removed, finds no second body)."
- "tests/unit/freeze.test.mjs passes with tests/freeze/vectors.cjs and tests/freeze/golden-a7b7a23.json byte-identical to the merge base (git diff --exit-code on both, shown in the pull request); a change that needs either is outside this slice, because the freeze is the enforcement project.audio-engine-discipline names."
- Every text a user saw before is listed with its after value in the pull request; a visual reference that changes is re-accepted through the visual gate with the reason.
- "Definition of done, extends: core/frequency.js, which already owns parseFrequency and formatFrequency."
- "Definition of done, interlinks: the catalogue's param and readout kinds (G001, G008) format through this module only."
- "Definition of done, interactivity: typed entry in the Playground frequency field and the Filter Lab cutoff accepts and refuses the same forms with the same sentence."
- "Definition of done, docs, menus and routes: docs/GLOSSARY.md states the accepted frequency forms and that a comma decimal and an exponent are refused. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: tests/browser/labs.cjs types '2.5k' into the Playground frequency field and the Filter Lab cutoff by keyboard and waits with until() (deadline 'frequency accepted', 2 s) for both readouts to read 2.50 kHz, then types '2,5k' into both and waits (deadline 'frequency refused', 2 s) for the same refusal sentence in both while each readout keeps 2.50 kHz. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
