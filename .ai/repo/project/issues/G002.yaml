id: G002
milestone: M085
serves:
- "component-system#proven-duplicates"
title: "One units module: one frequency grammar, one millisecond and one clock formatter for every control, readout and chart"
slug: one-units-module-one-frequency-grammar-one-millisecond-and-o
priority: p2
profile: implementation
objective: "Lands as fix(ui). D3 of the inventory: six frequency formatters, two frequency parsers with different grammars, two byte-identical formatMs bodies and four clock formatters. src/js/core/frequency.js becomes the one units module (parseFrequency, formatFrequency, formatFrequencyShort, formatMs, formatSeconds, formatClock); charts/axes.js parseFrequency and formatHz, sequencer/model.js formatCompactFrequency and formatMs, the compact Studio's compactTime and timeline-view.js formatClock / formatSecondsText import it. The one grammar accepts what either parser accepted (a comma decimal, a k suffix, a unit) and refuses zero, negatives and non-finite values with one sentence. The scientific formatters of src/js/measurement/smoothing.js and src/js/experiments/schema.js keep their method-specific precision and stay out of scope (project.no-fake-science); src/js/studio/timeline.js formatSeconds is folded only if a reviewer's verdict covers it. Before: VERIFIED Filter Lab accepts '2,5k' and the Playground frequency field does not; the clock rounds in one place and floors in another (inventory X2-X4, R3). After: one grammar and one text per quantity. Negative cases: '0', '-5', 'abc', '1e309' refused the same way everywhere. Rollback: revert; no stored record holds formatted text."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
