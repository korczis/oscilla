objective: "Lands as fix(engines). Slice 2 (WIRING) of the voice wrapper split from K189 by af's critique of 96daa67b (BLOCKING 6). Line numbers at origin/main a19f1ff6. After K189 declares each engine's ports, every engine connection is validated by canConnect of src/js/studio/ports.js against that declaration (type and direction), and the Synth panel's series chain (the semi-mono panel's fixed module order) gives way to declared jacks the patch bay draws from the port contract; the mixer stays K108. A refused connection leaves the model unchanged and says why (project.typed-ports), and a feedback path is refused (project.no-silent-feedback)."
why: "af's critique of 96daa67b (BLOCKING 6): slices 2-4 had no fail-first; pack 06 section B (wiring)."
