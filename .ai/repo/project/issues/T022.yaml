title: "Additive bars show a partial below the axis floor differently from a harmonic that is off"
slug: additive-bars-show-a-partial-below-the-axis-floor-differentl
priority: p3
profile: implementation
objective: "Truth-table rows LAB-07, LAB-08 (scratchpad p05/truth-table.md). Bars have three states (off at gain 0 or ≤ -96 dB, below-range, in-range); a below-range partial gets a floor marker that does not rely on colour; getBars() reports the state (K044 adds the dB rel unit and the bar tooltips); the slider shows the below-range state instead of a silent clamp."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): The default Custom table plays harmonic 9 at -81.1 dB and 10 at -85.0 dB, but bars are drawn only above -80 dB, so both look exactly like \"off\"; claim additive-coefficients-play says the bars are exactly the coefficients that play. The gain field reads -85.0 dB while the slider sits at its -60 dB minimum."
