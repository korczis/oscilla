title: "A generated component catalogue: docs/ui-catalog.md from the declarations, kept current by npm test"
slug: a-generated-component-catalogue-docs-ui-catalog-md-from-the
priority: p2
profile: implementation
objective: "Lands as feat(docs). scripts/ui-catalog.mjs imports the registry (pure modules only) and writes docs/ui-catalog.md: per workspace, its panels and their components with id, kind, label, unit and range, state owner and persistence (from sources.js, so 'kept in the configuration file only' is stated where pack03/dataflow.md measured it), links in and out, tests and source module; node faces are the registry's (the same source as V619's node reference, linked, never repeated). npm run docs:ui writes it, --check (run by npm test) fails when it is stale; the output is byte-stable (sorted, no clock). What a component means stays authored in its declaration; nothing is inferred. Before: VERIFIED no catalogue (inventory 4.4). After: one generated reference. Negative cases: a stale file, a declaration whose docs are empty, two declarations claiming one hook. Rollback: revert; docs only."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
current_state: "2026-11-18: N010 (the per-view control reference and 'Add a parameter') merged into this issue by the plan triage the owner approved in bulk (Q112: 'schvaluji vse', 2026-11-18T02:27Z, Claude Code session 980e22ee-d9d4-4dd0-8318-8b727f127ce9, oscilla-e5; triage derived from origin/main 4682eea4): both write docs/ui-catalog.md through scripts/ui-catalog.mjs with one --check run by npm test. Its criteria are the ones that start 'From N010', and this issue now serves parameter-controls#documented-extensible, whose intent names M087 for it."
scope:
- scripts/ui-catalog.mjs
- docs/ui-catalog.md
- package.json
- tests/unit/ui-catalog-docs.test.mjs
- tests/README.md
- "docs/EXTENDING.md"
- "tests/unit/extending-guide.test.mjs"
