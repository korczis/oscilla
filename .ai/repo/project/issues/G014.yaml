acceptance_criteria:
- "tests/unit/ui-catalog-docs.test.mjs fails on the merge base: the generated text equals the committed file, a fixture declaration change makes --check fail, and two runs give identical bytes."
- "Definition of done, extends: the registry of G001 and the node reference V619 generates."
- "Definition of done, interlinks: every row links its workspace route, its component address (G007) and the node reference."
- "Definition of done, interactivity: none: a document (stated)."
- "Definition of done, docs, menus and routes: README.md and docs/v3/ui-integration.md link the catalogue; package.json gains docs:ui. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: the unit test only (no browser surface; stated). The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 0 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
- "From N010 (merged by Q112): docs/ui-catalog.md also carries a per-view control reference generated from src/js/ui/kinds/param and src/js/ui/catalog: per view its interface, the keys and gestures, the attributes controlAttrs gives, the contract clauses control-contract.cjs checks and viewFor's table, for every view module present (the section grows as N002-N008 land); the one sentence per view stays authored, and tests/unit/ui-catalog-docs.test.mjs fails on the merge base when the generator is not byte-stable over two runs, misses a view module, or --check passes a fixture view without its sentence."
- "From N010 (merged by Q112): docs/EXTENDING.md gains 'Add a parameter or a control' (a parameter is one constructor call in a node definition plus its face section; the face, the Inspector, the menu, the reference and the census follow; a new view implements mountControl and passes the harness), held by tests/unit/extending-guide.test.mjs; it extends 'Add a Studio node' and V619's node reference."
- "From N010 (merged by Q112): Help and the What is this panel (G015) link to the control reference, the reference links each view to its Learn and Help entries and Help links back, walked by the link-integrity suite; no markup, class token or stylesheet changes and no bundled byte is added."
