id: V508
milestone: M045
serves:
  - "midi-jam-companion#midi-transport-clock"
title: "A controller's transport and clock: Start, Continue, Stop and the DAW buttons play the workspace in view; the clock's tempo is shown"
slug: midi-transport-clock
priority: p1
profile: implementation
objective: "Lands as feat(midi). src/js/midi/transport.js maps MIDI realtime Start (FA), Continue (FB) and Stop (FC) from any input, and the DAW-control port's Mackie Control buttons (a Note On with velocity > 0: Play 94, Stop 93, Rewind 91, Cycle 86, the published protocol's numbers) to transport actions, and measures MIDI clock (F8, 24 per quarter note) over the last whole beat on the messages' own timestamps. midi/ui.js midiTransport acts on the transport of the workspace in view: the Sequencer's own in the Sequencer (its panel's play, stop and loop, handed in by main.js), the Studio's everywhere else (Start from the start, Continue from where it is, Stop keeping the keys' armed run, Rewind, Cycle). The monitor row says what each message did; the MIDI section shows the clock's tempo (midi.clock) and clears it when the clock stops. The transport never follows the clock by itself. Before: Start, Stop, the DAW buttons and the clock changed nothing (the DAW port's notes were silenced by V507 and did nothing else). After: the owner's BeatStep Pro's transport and the KeyLab mkII's DAW buttons play and stop OSCILLA."
why: "The owner's orders of 2026-11-14 and 2026-11-15 in session cae276ab-2d90-45d2-babb-a1f8023668d2 (Claude Code): \"cilem oscilla ... je ovladat to pres midi vcetne jam\" and \"napoj cely midi stack ... dotahni veskere issues souvisejici s midi, napoj na ui, otestuj, vyzkousej, over, ze funguje\". ADR 0058 kept MIDI clock out of its first version; this note takes the transport and a measured clock in, and keeps following the clock out."
current_state: "Landing: the owner wrote at 2026-11-15T06:40Z in session cae276ab-2d90-45d2-babb-a1f8023668d2 (Claude Code), verbatim: \"pokracuj, dotahni K247 PR a V508\" (carry on, finish the K247 PR and V508); on it oscilla-43 lands the whole stack (V506, V507, K247, V508) as train T22 in PR 555 (v3.38.0), c3 agreeing. Built by oscilla-p7/ff (Claude Code session cae276ab-2d90-45d2-babb-a1f8023668d2) on feat/v508-midi-transport, stacked on K247 (PR 553). The owner's BeatStep Pro sent FA/FC with its transport and F8 clock, and MMC SysEx, on 2026-11-14 (observed with scripts/midi/listen.swift); the KeyLab mkII's DAW port's buttons follow the Mackie Control protocol in its default DAW map (the editor's DAW Map field: Default MCU) and are to be confirmed on the device with scripts/midi/listen.swift (.ai/repo/workflows/midi-device-import.md step 4). Review C3-555-1 (oscilla-c3, P3): a Start or Continue the Studio refused was still reported and Start moved the playhead; fixed (nothing moves or is said while a measurement owns the output, nothing is said when studioPlay refuses). Noted by c3, outside this issue: studioPlay's refusal sentences are still English, and a hardware Start can now raise them (the next Czech pass)."
