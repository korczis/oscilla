  - "NODE_PARAM_SET hpf.type, the hpf/dark preset and the sync/engine-formant-pad Apply are each refused or skipped on the fixed key with a reason naming panel, module and parameter; the model and history are unchanged by the refused dispatch (one case each in tests/unit/synth-panel.test.mjs)."
  - "Import of a document with an overridden fixed value resets it and the import report names the reset (coherent-state#saved-state-is-honest)."
