title: "A panel's fixed parameter is refused by the model, skipped by presets and Apply with a reason, and reset on import"
slug: a-panels-fixed-parameter-is-refused-by-the-model
priority: p1
profile: implementation
objective: "Lands as fix(synth). Implements Q092. A Synth panel module's 'fixed' is declared and validated (src/js/synth/panel.js:90-99) and shown as a 'Fixed by the panel' badge (panel.js:181-185, synth/view/face.js:164-170), but NODE_PARAM_SET, a node preset (hpf/dark sets HPF type lowpass) and a catalog Apply (sync/engine-formant-pad sets HARD SYNC bank formant, sync/default bank basic) overwrite it while the badge keeps the declared value. After: the StudioModel refuses NODE_PARAM_SET on a fixed parameter with a reason naming the panel, the module and the parameter, leaving model and history unchanged; a node preset and a catalog Apply apply every other parameter and report each skipped fixed one with its reason; a saved document whose fixed value differs imports with it reset to the declared value and the reset named in the import report. K061 (BLOCKED) keeps the rest of the panel contract."
why: "Q092 (af with b0, 2026-11-05); oscilla-b0 Total Coherence audit of main 68b117f3, slice 06 (audio-ontology gap 1, severity high), probes set-fixed.mjs and probe-fixed.mjs reproduced."
