acceptance_criteria:
  - "Fail-first: tests/unit/studio-node-presets.test.mjs:117, which asserts the HPF type becomes 'lowpass', flips to assert the preset leaves 'type' at the declared value and reports it skipped; it fails on the merge base."
  - "NODE_PARAM_SET hpf.type, the filter/dark preset on the HPF module, the engine-formant-pad engine preset on HARD SYNC, a catalog Apply, PATCH_REPLACE, paste and history replay are each refused or skipped on the fixed key with a reason naming panel, module and parameter; the model and history are unchanged by the refused dispatch (one case each in tests/unit/synth-panel.test.mjs)."
  - "Fail-first (import): tests/unit/synth-panel.test.mjs imports a saved document whose HPF type is overridden and expects it reset to the declared value with the reset named in the import report; on the merge base the override survives import (coherent-state#saved-state-is-honest)."
  - "The Inspector shows a fixed parameter as a read-only control with the panel's reason; the face's 'Fixed by the panel' badge and the Inspector consume M123's one switch and knob (G022, G023; component-system#one-implementation-per-family, origin/chore/plan-unified-controls) and add no parallel read-only widget; project.visual-identity-lock holds."
  - "Guarded paths (src/js/studio/*, src/js/synth/*): prismatic-majordomus-98 writes the verdict; oscilla-21 checks the synth values. Lane: oscilla-26 with dev-53."
