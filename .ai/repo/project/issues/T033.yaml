title: "An imported raw device id is hashed before it is stored, and the Privacy text names the stored calibration"
slug: an-imported-raw-device-id-is-hashed-before-it-is-stored-and
priority: p2
profile: implementation
objective: "Lands as fix(experiments). Hardening S4, third and fourth findings (both about what a saved record holds of the user's setup). At main 68b117f3 validate.js accepts any string as input.device.id (src/js/experiments/validate.js:515); a raw id is hashed only on creation and removed only on export, so an imported record can keep a raw id in IndexedDB (inferred; the import path was not run). README's Privacy section says level calibrations stay in page memory only (README.md:1079), while every saved or exported experiment holds the applied calibration: profile id and name and the full LevelCalibration with its free-text conditions and hashed input binding. After: the import path hashes a raw device id (or runs sanitizeForExport) before the record is stored, and the Privacy paragraph names the stored calibration."
why: "oscilla-b0's hardening audit of origin/main 68b117f3 (v3.19.0), synthesis S4. Contract: ADR 0049, README Privacy."
