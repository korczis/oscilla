  - "src/js/experiments/validate.js"
  - "src/js/experiments/store.js"
  - "src/js/ui/experiments.js"
  - "README.md"
  - "tests/unit/experiment-import-device-id.test.mjs"
  - "tests/unit/raw-retention.test.mjs"
  - "tests/README.md"
  - "dist"
depends_on: []
acceptance_criteria:
  - "Fail-first: tests/unit/experiment-import-device-id.test.mjs imports a file whose input.device.id is raw and reads the stored record back; it fails on the merge base and on the head isHashedDeviceId(id) is true. A mutation that skips the sanitizing step on import fails it."
  - "tests/unit/raw-retention.test.mjs (near :357) requires the Privacy section to contain the sentence naming the stored calibration (profile id and name, the LevelCalibration and its conditions); it fails on the merge base, and reverting the sentence fails it."
  - "Guarded (src/js/experiments/*, src/js/ui/experiments.js): prismatic-majordomus-98, who built none of it, writes .ai/repo/reviews/<pr>.yaml (project.review-verdict)."
validation:
