id: C001
milestone: M090
serves:
  - "coherent-state#stops-are-immediate"
title: "Every stop path reads the sequencer's live state, and the status-bar stop key starts nothing"
slug: every-stop-path-reads-the-sequencer-s-live-state-and-the-sta
priority: p1
profile: implementation
objective: "Lands as fix(sequencer). Findings engine-sync-8, coupling-6, dup-stale-5 and dead-controls-6. stopSequencer and stopPlayback in src/js/main.js and statusPlay in src/js/ui/workbench.js decide on cmp.seqPlaying, a copy of editor.playing refreshed by a 150 ms setInterval. Escape, pagehide and visibilitychange-hidden inside that window leave a looped sequence playing (RMS 0.053 one second later; real Playwright input 37-61 ms after Play fails 3 of 3), and the status-bar key labelled 'Stop playback' (shown at <= 767.98 px) stops the sequencer and then falls through to toggleLatch()/trigger(), starting an instrument voice (RMS 0.057, status PLAYING). Add one helper sequencerPlaying() that reads labs.sequencer.editor.playing (PR #261 adds the same helper: keep one definition) and use it in stopSequencer, stopPlayback and statusPlay. Pass stopPlayback to createWorkbench through svc so that statusPlay stops through the existing stop authority and returns when anything it labels as sounding plays, and only otherwise latches or triggers; clear app.seqPlaying at the stop so the key reads Play at once. The 150 ms poll stays only to show a natural end. A stop never arms the latch."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
scope:
  - "src/js/main.js"
  - "src/js/ui/workbench.js"
  - "tests/unit"
  - "tests/browser/app.cjs"
  - "tests/README.md"
  - "dist"
acceptance_criteria:
  - "Browser check `seq-stop-in-poll-window` in tests/browser/app.cjs: click Loop and Play, then press Escape in the same task (second leg: dispatch pagehide, third: visibilitychange-hidden) and poll until editor.playing is false and the output is silent; it fails on the merge base."
  - "Browser check `status-key-stops-only` in tests/browser/app.cjs at 390x844: with the sequence looping, one press of [data-osc=\"status.play\"] leaves app.seqPlaying, app.playing and engine.voice false or absent within a named deadline; a unit test of statusPlay with a playing fake editor asserts that neither trigger nor toggleLatch is called."
  - "With nothing sounding the key still latches or triggers (ADR 0050), and with only the Studio playing it still starts the instrument (tests/browser/v31-studio-graph.cjs stays green)."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "engine.activeNodeCount returns to 0 after every stop in the new checks, in Chromium, Firefox and WebKit (project.audio-engine-discipline v2)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node tests/browser/app.cjs"
  - "npm test"
evidence_required:
  - "verified"
