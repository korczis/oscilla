objective: "Truth-table rows STP-07, STP-08, STP-10 (scratchpad p05/truth-table.md). liveData carries labels [\"L\", \"R\"] (kept \"A\"/\"B\" in split, where L = A and R = B); drawPhaseWaves draws the labels it is given. The model label reads \"model · sine, equal level\", and \"model (mono output, not measured)\" while a mono dual plays; claim phase-and-lissajous-model is reworded by T027 to say sine-only, unit amplitude. A faithful model of waveform and level is left to a later issue."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): Live, the rows are always labelled \"A\" and \"B\"; with Output Mono and Pan ≠ 0 both rows carry the A+B mix (rmsR/rmsL 2.42 at pan +0.5). The model draws two unit sines whatever the configured waveform and levels (square A at 80 % against sine B at 20 % still draws equal sines and an equal-axis ellipse), also while a mono dual voice plays, labelled only \"model\"."
