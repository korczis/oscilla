title: "A First patch template whose timeline markers are the steps, linked from Learn and the empty Studio"
slug: a-first-patch-template-whose-timeline-markers-are-the-steps
priority: p2
profile: implementation
objective: "P04 slice F (visual, keyboard and responsive). Lands as feat(studio). A seventh template, 'First patch' (src/js/studio/templates/first-patch.js), starts as Oscillator to Master and carries five timeline markers whose names are the steps: '1 Press Play', '2 Add a Filter between them (drop it on the cable)', '3 Move the Filter cutoff', '4 Add a Spectrum from the Filter output (drag a cable into empty canvas)', '5 Save it as a patch'; its notes say the same. [ and ] move between markers (existing keys), so the steps are reachable by keyboard. The Learn concept card 'Signal path' gains 'Open the First patch in Studio' (#m=studio&st=first-patch), and the empty Studio's note names it. It is a template with notes, not a guided path (Q004 chose no guided path for the first screen). The template carries a pinned studioHash and renders non-silent offline."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
