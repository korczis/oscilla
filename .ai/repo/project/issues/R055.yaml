id: R055
milestone: M011
serves:
  - "release-provenance#majordomus-knows-the-product"
title: "The pinned Majordomus download bounds each public attempt, so the API fallback always gets its time"
slug: majordomus-download-bounded-per-attempt
priority: p2
profile: implementation
objective: "The Majordomus install steps (.github/workflows/ci.yml:339, .github/workflows/main-checks.yml:90) fetch the public release URL with --retry 5 --connect-timeout 20 but no --max-time, under a 5-minute step. A slow 504 or a stalled transfer can use the whole step before the GitHub API fallback (3 x 60 s) starts, so the job fails although the fallback would have served the same asset (project.ci-bounded). After: each public attempt has a --max-time, and the public retries plus the fallback fit within the step's timeout."
why: "Review-findings audit of 2026-11-10, P3 pass (oscilla-ce, ordered by the integrator oscilla-43, format agreed with oscilla-c3; record .ai/repo/reviews/audit-2026-11-10-p3.yaml): 490.yaml#F-1 (P3), still open on main a7102358, checked by reading the code and, where noted, a probe or unit run; not re-measured in a browser."
scope:
  - ".github/workflows/ci.yml"
  - ".github/workflows/main-checks.yml"
  - "tests/unit/ci-knowledge-job.test.mjs"
  - ".ai/repo/project/issues/R055.yaml"
current_state: "Built by oscilla-75 in task t-20261110054634-738e on fix/r055-majordomus-curl-max-time from ce's ee54c5b5, on the coordinator's assignment (oscilla-43); it lands in train T6 with the verdict from oscilla-c1. Each public attempt carries --max-time 20 and the retries fall from 5 to 3, giving a worst case of 285 s (4 x 20 + 3 x 5, then the fallback's 3 x 60 + 2 x 5) inside the 300 s step, in ci.yml and main-checks.yml alike; ci-workflows.test.mjs's curl mutation targets the new flags. Widened on oscilla-43's order: the ci-bounded checker requires a per-attempt bound on every curl and wget and a step budget; today it finds only these two curls, already fixed. Landed by #523 (verdict 523.yaml). Done on 2026-11-11 after oscilla-0b re-checked each criterion on main 04d33aaf (evidence below)."
depends_on: []
acceptance_criteria:
  - "Fail-first unit (tests/unit/ci-knowledge-job.test.mjs, fails on a7102358): each Majordomus install step's public curl carries --max-time N, and N x (retries + 1) plus the retry delays plus the fallback's bound stays under the step's timeout-minutes."
  - "The class, not the instance (oscilla-43, 2026-11-10; added by oscilla-75, the builder): scripts/ci-workflow-rules.mjs (project.ci-bounded) names, as curl-flags, every curl under .github/ and scripts/*.sh without --max-time <s> (or -m) and every wget without --timeout <s>, unless a timeout <s> prefix bounds the call; and it names, as download-budget, a step whose curls at their worst (every attempt at --max-time, every retry delay: --retry-delay, else curl's 1, 2, 4 ... s backoff, or the timeout prefix) exceed its timeout-minutes. tests/unit/ci-workflows.test.mjs proves this with a mutation per workflow file: an unbounded curl and wget probe step is named in each, and a bounded one is not. Whatever the checker finds today is fixed in the same change."
  - "Guarded (.github): a non-builder's verdict in .ai/repo/reviews/<pr>.yaml."
