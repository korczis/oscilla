title: "The correlation meter never shows a number or a bar for silence or a one-sided signal"
slug: the-correlation-meter-never-shows-a-number-or-a-bar-for-sile
priority: p2
profile: implementation
objective: "Truth-table rows STP-03, STP-04, STP-05 (scratchpad p05/truth-table.md). correlationDisplay returns available: false for idle, silent and one-sided states; the canvas meter of K035 (M062) gets data-state=\"unavailable\" and a hatched or dimmed track with no value bar; \"1.00 mono\" requires the engine output (an adapter getter) above DEFAULT_SILENCE_RMS; a new one-sided state names the side with signal and says the coefficient is undefined."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): An unavailable meter draws the same empty bar as a correlation of -1 (idle 0.0 % against split-180 1.0 %). A mono dual pair at equal frequency with Δφ 180 cancels (output RMS 2.6e-9) and the panel shows \"1.00 mono\" at 100 %. Mono with Pan -1 carries signal on the left only, and the reason shown is \"no signal on the stereo router yet\"."
