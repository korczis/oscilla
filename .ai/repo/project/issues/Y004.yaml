title: "3D spectrogram: the level history as a height field with stated axes, bounded camera, pick readout and markers"
slug: 3d-spectrogram-the-level-history-as-a-height-field-with-stat
priority: p2
profile: implementation
objective: "Lands as feat(charts). A 2D | 3D Pro button group on the analysis-tab spectrogram card (named as Q051 decides; the plan recommends '3D spectrogram', never 'waterfall', D7) switches the same host to a height field drawn from the same level texture as Y003: a static grid of at most 256 frequency rows by 128 time columns (Uint16 indices, built once), whose vertex shader reads the level at its cell, so a frame uploads one column and nothing else. Height and colour both encode the level, linear in dB over the stored range, through the K027 LUT; there is no lighting, fog or shading that is not data. Axes: frequency on the analysis scale (log or linear, ticks from axesOf()), age in seconds from the column period, level in dB relative, with tick labels drawn on a 2D overlay from projected positions, redrawn only when the camera or the axes change. The caption says 'Height and colour: level, dB relative. Read values with the cursor.' The camera has three presets (front, three-quarter, top), a bounded orbit by pointer drag (azimuth +-60 deg, elevation 10 to 90 deg), a dolly zoom by Ctrl or Cmd + wheel, pinch, and Zoom in, Zoom out and Reset buttons through K052's zoom-math (the camera zooms; no data is resampled, and the badge says so), and a depth choice of the last 2, 5 or 10 s where the history holds them. The cursor is a pick: a pointer or tap ray-casts on the CPU against the height field (on the event, never per frame) to a (column, row) cell, and the readout is K033's for that cell (frequency, age, quantized level); arrow keys move the picked cell through K053's keys.js exactly as on the 2D view, and Enter pins a marker (Y007). The top preset is an orthographic projection whose cells equal the 2D view's. Without vertex textures (WebGL 1 with none) or without GL the 3D button is disabled with the sentence '3D needs WebGL with vertex textures; this browser has none.' Under reduced motion presets switch without easing."
why: "Owner orders of 2026-10-29 (session oscilla-b0, in Czech): add p5.js, WebGL and interactivity and deploy; plan WebGL renderers for the scrolling spectrogram (with a 3D option), a phosphor XY scope and a live spectrum, falling back to canvas/p5 when WebGL is unavailable, one frame loop with no per-frame allocation, the single file and its gzip budget, axes and units from the analysis (no-fake-science). Built on the M062 charts plan (#269, merged as cdda563c): the frame loop K036, the interaction kit K053, the shared zoom K052, the level history K033 and the chart-cost check of K036 are reused, never duplicated (components-followup/render-gl.md)."
