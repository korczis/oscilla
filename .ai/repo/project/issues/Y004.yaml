acceptance_criteria:
- "As a feat change it carries tests/unit/gl-pick.test.mjs: for every preset and for random cameras inside the bounds, a ray through the projected centre of cell (c, r) picks (c, r); the top preset's projection maps cells to the 2D view's pixels; the cell maximum of a one-row tone line equals the tone's level wherever the tone falls inside the cell; after a range change height and colour map the same level to the same fraction of the window; orbit and dolly stay in their bounds; tests/unit/gl-views-wording.test.mjs (created by Y003) gains the caption, the axis titles and the disabled sentence, and its static scan still finds no constant sample rate, Nyquist or dB range under src/js/charts/gl, which fails on the merge base (project.fail-first)."
- "tests/browser/gl-parity.cjs gains the 3D top preset: on the synthetic ring its sampled cells equal the 2D view's within 1 per channel. tests/browser/charts-interaction.cjs: the 3D host passes the table-driven pass; a pick reads the same readout text as the 2D view's cursor on the same cell; the camera buttons, drag, pinch and Ctrl + wheel each move the camera and a plain wheel scrolls the page. Every GL check states per gate browser and OS whether it drew on WebGL 2, WebGL 1 or was skipped and the renderer string it observed, and asserts the observed backend against Y002's expectation table, failing on a mismatch (no leg claims a GL path it did not draw), and the same check runs with ?gl=0 on every leg and passes on the Canvas 2D path. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
- "tests/browser/chart-cost.cjs gains the 3D spectrogram rows: its GL subscriber is a frame-loop subscriber with its host (K036) and allocates nothing per tick (Y002's differential figure: Chromium CDP heap sampling over the same window with the view on GL, on ?gl=0 and unmounted, the view's increment at most 128 B per frame on each backend; the page-wide per-tick ceiling of tests/browser/chart-cost-baseline.json not raised); its draw calls per frame are counted by the gl.cjs spy and stay at the stated figure; its cost is measured by Y002's measure (five interleaved windows of 300 frame calls per backend timed as one interval, the synced figure and the live rAF figure, the minimum detectable difference and the hardware legs that decide) and recorded for the GL and the Canvas 2D path in tests/browser/chart-cost-baseline.json, with the figures in the pull request; the GL path is the automatic choice only where it is faster beyond that difference on every hardware leg, and a tie or a loss keeps the 2D path automatic, the baseline saying why; nothing is drawn while the host is hidden or Pause animation is on."
- "Its chart hosts enter tests/unit/chart-host-census.json as done in this change, each carrying data-osc-chart and its backend list, and the table-driven pass of tests/browser/charts-interaction.cjs holds for each (role=group host with the summary and the snapshot data table, role=application plot surface with aria-roledescription \"interactive chart\", visible focus ring, ArrowRight moves the cursor one step and the polite region announces once after the keys settle, Escape clears the cursor and still reaches the page's stop, Space keeps its workspace meaning (ADR 0050), a tap pins the cursor on touch); the GL canvas is aria-hidden like every drawing canvas (K053)."
- "Levels say dB relative (dBFS-like) unless a valid LevelCalibration applies; every axis, tick, unit and caption comes from the analysis descriptor axesOf() and never from a constant (the static scan of tests/unit/gl-views-wording.test.mjs finds no sample-rate, Nyquist or dB-range literal under src/js/charts/gl); no data value is tweened or eased; every string it adds is registered in its chart's wording table and passes tests/unit/charts-readout-wording.test.mjs; the word waterfall is never displayed (D7; it stays a search alias only) (project.no-fake-science)."
- "A 3D control that cannot act is disabled with its sentence, never hidden or inert (project.no-inert-surfaces)."
- "Chart chrome (toolbar, toggle, badge, tooltip, readout row, marker table) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles and after the card issue of its workspace placed the card; no osc-* class token or legacy selector is added, no name of the new modules or strings carries an osc- prefix, and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs and node scripts/ui-flowbite-pro-record.mjs --check). The GL canvas is a domain view inside the card."
- "Every osc-* use it removes leaves the record in the same change (node scripts/ui-flowbite-pro-record.mjs); the pull request states by how much the debt fell."
- "The view reads existing AnalyserNodes or the CPU-held analysis data on the main thread only, creates no audio node, adds no work to the audio path and writes no DOM per frame (project.audio-engine-discipline v2)."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed."
- "The owner's definition of done, one item each: extends the spectrogram with a 3D view of the same history; interlinks the 2D and 3D views share the cursor, the readout and the colour key (markers join in Y007, the deep link in Y008); interactive: pick, keyboard cell cursor, bounded orbit and dolly, presets, depth choice; docs, menus and routes: the card's toolbar, the shortcuts rows of K053 (no new key outside them), docs/renderers.md; tested with pointer, keyboard and touch; deployed by merge commit under project.deploy-often (Pages deploys on the merge)."
- "Designed at 390x844 first: every check runs at 390x844 and at 1536x1024, touch targets are at least 44 px, and each gesture has a pointer, a keyboard and a touch path."
- "scripts/size-report.mjs shows at most 4.5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the Y line's figures stays within the component line's cap Q037 records, under the gzip budget of scripts/build-config.mjs (1 200 000 B since #279 landed, BUDGET.gzipBytes of scripts/build-config.mjs; dist measured 825 984 B gzip at f887066f; project.single-file-deliverable)."
- "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
