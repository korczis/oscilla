title: "In the Studio, the status-bar Play and Export Audio act on the Studio on screen"
slug: in-the-studio-the-status-bar-play-and-export-audio-act-on-the
priority: p2
profile: implementation
objective: "Lands as fix(ui), with a resolution note to ADR 0050. Defect: in #m=studio the shell's audio controls act on the hidden Playground instrument while the Studio's own Play and Render WAV sit beside them and do something else. The footer [data-osc=\"action.exportAudio\"] (src/index.html:2821) calls exportAudio() (src/js/ui/workbench.js:395-397), which picks 'pattern' unless the workspace is the sequencer, so it downloads oscilla-pattern-*.wav of the Playground tone; the mobile footer [data-osc=\"status.play\"] (src/index.html:2776, statusPlay() at src/js/ui/workbench.js:253) triggers the instrument (engine.activeSourceCount 0 -> 1, status PLAYING) while window.OSCILLA.studio.transport.playing stays false and the Studio banner still says 'Nothing plays until you press Play'. Before: two Play keys and two audio exports in one view with divergent effects. After: both footer controls follow the workspace's Space owner (src/js/ui/shortcuts.js SPACE_OWNER, ADR 0050), read through one exported function of shortcuts.js beside spaceOwner(); where the owner is 'studio', status.play stops anything the instrument or sequencer is sounding (stop is global and starts nothing, as C001 keeps it) and otherwise toggles the Studio transport through studioTogglePlay() (src/js/ui/studio/workspace.js:1228), its aria-label and aria-pressed read the Studio transport ('Play Studio' / 'Stop Studio'); action.exportAudio opens the Studio's own render dialog through studioOpenRender() (workspace.js:1270), the one offline render path studio.renderWav uses, carries the same blocked reason and aria-disabled while studio.task.active, and its accessible name says it exports the Studio. The notice states the duration, sample rate and peak of the buffer actually rendered, never the instrument's (project.no-fake-science). Negative cases: every workspace whose owner is 'instrument' keeps today's meaning (pattern export, sequence export in the Sequencer, latch or trigger on status.play); Measure, Experiments, Learn and About are unchanged; no second render path and no new control. The change rides on the Pro footer bar F010 builds (Pro buttons and badges, no new osc-* class, no inline style; project.ui-uses-flowbite-pro), and no control is left inert (project.no-inert-surfaces). It revisits the recorded decision that the status Play key keeps its instrument meaning in the Studio: ADR 0050 gains a resolution note, and the criteria of C012 ('the hidden status Play key keeps its instrument meaning') and C001 ('with only the Studio playing it still starts the instrument') are superseded for the Studio only, their checks updated here. Not this: C012 and C001 (status label, gain readout, stop paths), C002 (one output owner), C013 (scope follows the output owner), F010 and F002 (restyle the status bar and footer without changing their meaning), C004 (the sequencer WAV). Rollback: revert the merge commit; the ADR note and the test changes leave with it."
why: "Found by the S074 quality-bar review of 2026-10-30 at origin/main d9db6bdf, section 74 symptom \"In the Studio view, the shell's audio controls act on the hidden Playground instrument, not on the Studio on screen. They sit next to the Studio's own Play and Render WAV, which do different things.\", reproduced by an independent verifier: desktop probe s074/targeted.cjs (footer Export Audio in #m=studio downloaded oscilla-pattern-20261030-183303.wav, notice 'Audio exported 0.67 s · 48000 Hz · 16-bit WAV · peak -21.9 dBFS', the Playground 440 Hz tone) and mobile probe s074/mobile2.cjs at 390x844 with screenshots s074/m-studio.png and s074/m-studio-footplay.png (status.play, label 'Trigger', set PLAYING and activeSourceCount 1 while the Studio transport stayed stopped). A duplicate control with a divergent effect, judged by the rule that every visible control does something real in the view it is in."
