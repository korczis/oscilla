acceptance_criteria:
  - "Fail-first: tests/unit/v4-shortcuts.test.mjs fails on the merge base and passes on the head: the exported footer-target function of src/js/ui/shortcuts.js returns 'studio' for studio and 'instrument' for every workspace SPACE_OWNER gives to the instrument, for every key of app.js WORKSPACES; and statusPlay() and exportAudio() of src/js/ui/workbench.js read it rather than a workspace literal (a source assertion that fails on the 'sequencer' ternary of today)."
  - "A check in tests/browser/v31-studio-transport.cjs, at 390x844 in #m=studio with nothing sounding: activating [data-osc=\"status.play\"] makes window.OSCILLA.studio.transport.playing true and leaves engine.activeSourceCount at 0; activating it again stops the Studio; its aria-label reads 'Play Studio' then 'Stop Studio' and aria-pressed follows the transport."
  - "The same suite at 1536x1024 in #m=studio: activating [data-osc=\"action.exportAudio\"] opens osc-dlg-studio-render (the dialog studio.renderWav opens), no oscilla-pattern-*.wav download starts, and while studio.task.active the control is aria-disabled with the reason studioRenderBlocked() gives; a completed render's notice states the rendered buffer's own duration, sample rate and peak."
  - "Negative cases in tests/browser/navigation.cjs and qa-regressions.cjs: in the Playground status.play still latches or triggers and Export Audio still downloads the pattern; in the Sequencer Export Audio still exports the sequence; with the instrument sounding in the Studio, status.play stops it and starts nothing (C001's stop semantics hold)."
  - "ADR 0050 gains a dated note under a new closing '## Resolution notes' section that names this issue and the superseded clauses of C001 and C012; every existing section and its status stay unchanged; majordomus adr check reports no problem."
  - "It adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
  - "As a fix change it carries a unit test that fails on the merge base and passes on the head (project.fail-first); it touches no path project.review-verdict guards (src/js/studio/ stays unchanged), or it carries a reviewer's verdict for the one it does."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "Definition of done, extends: the footer controls gain the Studio meaning ADR 0050 already gives Space there."
  - "Definition of done, interlinks: the footer Export Audio and studio.renderWav share one dialog and one render path; ADR 0050, C001 and C012 cross-reference this issue."
  - "Definition of done, interactivity: status.play toggles the Studio transport and Export Audio opens the Studio render dialog in the Studio (the browser checks above)."
  - "Definition of done, docs, menus and routes: docs/v31/user-guide.md says what the footer Play and Export Audio do in the Studio; no route changes."
  - "Definition of done, tested: tests/README.md has a row for each new check; dist is rebuilt and npm run build:check passes."
  - "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
