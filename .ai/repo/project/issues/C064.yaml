objective: "Two open findings of #288 on main: after a pause the first columns repaint the pre-pause spectrum through the AnalyserNode's smoothing (0.55), because nothing resets or bypasses it on resume and the view's default feed is still the smoothed analyser one (src/js/charts/spectrogram-view.js:36, :231; 288 R1: 11-13 ghost 1 kHz columns after a 2 s pause at 5 kHz, measured then); and MAX_PUSH_GAP_MS = 250 (src/js/analysis/spectrogram.js:43, push at :370) treats every slow frame as a restart, so below 4 fps each frame writes one column and the 10 s axis spans minutes (288 R2). Flush or bypass the smoothing on the first resumed frame, and bound the restart by the pause signal or the frame interval."
