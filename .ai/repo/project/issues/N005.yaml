id: N005
milestone: M112
serves:
- "parameter-controls#honest-modulation-automation"
title: "Modulation band: the range a parameter's routes can sweep, computed from the model by the compiler's own arithmetic and labelled as computed"
slug: modulation-band-the-range-a-parameter-s-routes-can-sweep-compu
priority: p2
profile: implementation
objective: "Lands as feat(ui). modulationBand(spec, base, routes) in src/js/ui/catalog/param-model.js returns { lo, hi, clamped, text } from the CONTROL edges into a parameter: linear edges by depth and polarity (bipolar +-depth, unipolar 0..depth) composed as actual = base + sum of edges (automation.js combineAutomationAndModulation), log edges in cents on the same AudioParam (runtime.js baseOffset), clamped to the parameter's range and saying so; each source is taken at its declared output range, so the band is 'the range the routes can sweep', never a measurement. setModulation({ band, sources }) draws it as an arc segment on the knob and a track segment on the slider (inline SVG and Tailwind utilities), and aria-describedby reads 'Modulated by LFO 1 (+-1.00 oct): range 600 Hz to 2.40 kHz, computed from the route depths'. The band stays under prefers-reduced-motion. V620's face knobs and K076's modulated knobs show this band. Before: VERIFIED the Inspector lists 'modulatedBy' as text only; no control shows a range. After: every modulated control shows its computed range. Negative cases: a band clamped at the bounds, a log route, two summed routes, a unipolar envelope, a route removed (the band goes). Rollback: revert."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, KB and interlinking; full DAW, full sequencer, full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels in one generic way, integrated with Majordomus; every element tweakable; mobile first; the landing easy to use, easy to extend and open to hack. Owner decisions: knobs that always show value and unit (D11, Q018, the ADR 0058 note of 2026-10-29), every parameter on the box face (Q031), the generator in its own workspace (Q033). Design: the params-controls part of the component follow-up of 2026-10-29 (scratchpad components-followup/params-controls.md), checked against origin/main b67d1e58 and the head of plan pull request #285 (c0a631b2)."
