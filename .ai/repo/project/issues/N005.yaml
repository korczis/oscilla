acceptance_criteria:
- "tests/unit/modulation-band.test.mjs fails on the merge base: for fixtures of an LFO at +-depth, a unipolar envelope, two summed routes and a log pitch route, the band's ends equal the values combineAutomationAndModulation gives at the sources' extremes, to 1e-9; any other arithmetic fails."
- "Definition of done, tested: tests/browser/v31-studio-graph.cjs adds an LFO route to a Filter cutoff through the connection dialog and waits with until() (deadline 'band drawn', 2 s) for the Inspector's cutoff to describe the computed range and draw the segment; removing the route removes both; the same by touch. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), runs at 390x844 and at 1536x1024, adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, extends: the Inspector's modulatedBy list and the runtime's composition rule."
- "Definition of done, interlinks: the band's sentence names each source, and each name opens that source's node."
- "Definition of done, interactivity: adding, editing or removing a route changes the band at once, by pointer, keyboard and touch."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md states what the band is and that it is computed, not measured (project.no-fake-science). tests/README.md has a row for each new test; the parameter's or view's catalogue entry names its docs, links and tests (G001 trace part); dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (named by its flowbite-pro reference.md section) with Tailwind class lists only; the knob arc and the band are inline SVG with Tailwind utilities under the ADR 0061 resolution note of K058; it adds no osc-* class token, no legacy vocabulary use and no selector, and the domain views' stylesheets gain nothing; the record's debt does not rise (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 0.8 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the line's sum stays within its row of the cap Q037 records, under the 1.2 MB gzip budget of scripts/build-config.mjs (project.single-file-deliverable)."
