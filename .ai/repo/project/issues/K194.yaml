title: "The templates use engine nodes, and the two duplicate oscillator builders are deleted"
slug: templates-use-engine-nodes-duplicate-builders-deleted
priority: p2
profile: implementation
objective: "Lands as fix(engines). Coverage gap of af's critique of 96daa67b ('K189 carries no criterion that the three templates stop rebuilding engines, and none that offline-renderer.js:130 and additive.js:280 are deleted'). Line numbers at origin/main a19f1ff6. The demo-song, fm-chime and ring-mod templates (src/js/studio/templates/demo-song.js, fm-chime.js, ring-mod.js) rebuild their voices from plain oscillator, LFO, filter and envelope nodes (demo-song's bass-osc, lead-osc, lead-lfo, kick-osc; fm-chime's audio-rate LFO into an Oscillator) where an engine node (fm-voice and the other K090-K092 engines) exists; src/js/audio/offline-renderer.js:129-130 (connectVoice's own createOscillator) and src/js/audio/additive.js:277-280 (createAdditiveOscillator) are oscillator builders beside the voice host. After: each template uses the engine node that makes its sound, or states in the template file why a plain-node graph is the point of the template (a teaching graph), and the two builders are deleted with their callers moved onto the voice host or the shared primitives of K193."
why: "af's critique of 96daa67b, coverage gap 'components reused' and 'tested and deployed' (K189 needs midi.cjs, engine-v1port.cjs, sequencer.cjs, demo-song.cjs and the size-report delta)."
