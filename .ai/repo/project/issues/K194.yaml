acceptance_criteria:
  - "Fail-first: tests/unit/templates-engine-nodes.test.mjs asserts every template voice is an engine node or carries a stated teaching reason, and that src/js/audio/ exports no oscillator builder beside the voice host and K193's primitives; it fails on the merge base naming demo-song, fm-chime and ring-mod and offline-renderer.js:129-130 and additive.js:277-280."
  - "Each changed template still renders its documented sound: its offline render's spectral lines (fm-chime: 440 +/- n x 616 Hz) and level are within the template test's stated tolerance before and after."
  - "tests/browser/demo-song.cjs, tests/browser/sequencer.cjs, tests/browser/midi.cjs and tests/browser/engine-v1port.cjs pass in Chromium, Firefox and WebKit; scripts/size-report.mjs's gzip delta is in the pull request body and is not positive."
  - "The V1 freeze golden vectors (tests/unit/freeze.test.mjs) are unchanged with the labs off (ADR 0014)."
  - "Guarded paths (src/js/audio/*, src/js/studio/*): prismatic-majordomus-98 writes the verdict; oscilla-21 checks the template sounds. Lane: oscilla-26."
