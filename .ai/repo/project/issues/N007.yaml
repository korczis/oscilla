acceptance_criteria:
- "tests/unit/automation-hook.test.mjs fails on the merge base: automationState over fixtures (no lane, a lane that plays, a lane on a parameter that plays nowhere) gives the Inspector's existing texts byte for byte; laneValueAt equals what compileLaneEvents schedules at sampled times for each curve shape."
- "Definition of done, tested: tests/browser/v31-studio-graph.cjs automates a Filter cutoff from its control menu, plays, and waits with until() (deadline 'lane value shown', 3 s) for the tick to describe the lane value and the readout to say Base; Show lane focuses the lane and Back returns focus to the control; by keyboard and touch. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), runs at 390x844 and at 1536x1024, adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, extends: the Inspector's fieldOf automation model, unchanged in wording."
- "Definition of done, interlinks: Show lane and Back are a row of tests/browser/integration-map.json."
- "Definition of done, interactivity: the tick follows the playhead; the menu opens the lane by pointer, keyboard and touch."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md describes base and lane once, for every control. tests/README.md has a row for each new test; the parameter's or view's catalogue entry names its docs, links and tests (G001 trace part); dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (named by its flowbite-pro reference.md section) with Tailwind class lists only; the knob arc and the band are inline SVG with Tailwind utilities under the ADR 0061 resolution note of K058; it adds no osc-* class token, no legacy vocabulary use and no selector, and the domain views' stylesheets gain nothing; the record's debt does not rise (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 0.6 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the line's sum stays within its row of the cap Q037 records, under the 1.2 MB gzip budget of scripts/build-config.mjs (project.single-file-deliverable)."
