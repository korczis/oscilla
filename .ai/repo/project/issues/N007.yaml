id: N007
milestone: M112
serves:
- "parameter-controls#honest-modulation-automation"
title: "Automation hook on every control: base readout under a lane, the lane's scheduled value while playing, open the lane and come back"
slug: automation-hook-on-every-control-base-readout-under-a-lane-the
priority: p2
profile: implementation
objective: "Lands as feat(ui). automationState(spec, model, nodeId, playhead) in src/js/ui/catalog/param-model.js is the automation half of the Inspector's fieldOf (inspector.js:156-198), moved unchanged and shared: available where a lane plays (clipTarget), else its reason; lane { id } when one exists, with the readout 'Base 1.20 kHz' and aria-valuetext '1.20 kHz, base, overridden by the lane' (the existing texts); valueAt while playing from laneValueAt (automation.js:146), drawn as a tick with 'Lane 900 Hz', never read from AudioParam.value. setAutomation(state) shows it on every view; the menu item of N004 calls the owner's openLane(laneId | null): in the Studio the automation view focuses the lane, from a Synth card the Studio opens at the lane and Back returns (K120 consumes this hook). Turning an automated control while playing writes the base and says the lane overrides it; it never writes the AudioParam. Before: VERIFIED only the Inspector knows a lane overrides a value. After: every control says so and opens its lane. Negative cases: an automated control turned while playing (base written, lane wins, stated), a parameter whose lane plays nowhere (reason shown), a lane removed (the tick and the base wording go). Rollback: revert."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, KB and interlinking; full DAW, full sequencer, full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels in one generic way, integrated with Majordomus; every element tweakable; mobile first; the landing easy to use, easy to extend and open to hack. Owner decisions: knobs that always show value and unit (D11, Q018, the ADR 0058 note of 2026-10-29), every parameter on the box face (Q031), the generator in its own workspace (Q033). Design: the params-controls part of the component follow-up of 2026-10-29 (scratchpad components-followup/params-controls.md), checked against origin/main b67d1e58 and the head of plan pull request #285 (c0a631b2)."
