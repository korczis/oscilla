acceptance_criteria:
- "ADR 0016 carries a dated resolution note with the capability table per browser, OS and mode (headless, headed), the context limit observed per browser, and the per-frame allocation, main-thread time, draw calls and gzip cost of each backend for the level ring and the XY trace, each figure with its command and the spike commit it ran at; the note is appended and leaves the sections above it and the status as written (.ai/repo/adrs/README.md)."
- "The curated record webgl-in-the-gate-browsers (schema knowledge/v1, class fact, epistemics observed, derived_from the spike commit) states what each CI leg can draw, so every later GL check names its skips from it; majordomus knowledge check and majordomus knowledge validate report no finding for it, and majordomus knowledge search webgl finds it."
- "The note states the uPlot spectrum's measured draw time and says whether a GL spectrum line would save anything measurable; Y006 builds only the density layer unless it would."
- "main carries no spike code: git grep -n -i webgl -- src on main finds nothing the spike added."
