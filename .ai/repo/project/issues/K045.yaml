title: "Envelope graph with time and level axes, A D S R labels and exact hover values"
slug: envelope-graph-with-time-and-level-axes-a-d-s-r-labels-and-e
priority: p2
profile: implementation
objective: "Lands as feat(charts). envelope-graph.js gets a time axis (linearTicks, ms and s) and a level axis 0, 0.5, 1 \"gain (linear, peak 1)\"; the labels A D S R if Q012 (OD5) answers so (today envelope-graph.js:140 shows only A, D and R to match the reference image); the kit's crosshair and keyboard cursor read t and level from audio/envelope.js valueAtTime(adsrEvents(...)), the closed form the voice schedules; sustain is drawn at a display hold marked \"held until note-off\"; handle hover shows the exact parameter (\"A 12 ms\") and a drag chip; gestures emit onPreview and onCommit beside onChange, which K048 uses; the handles use the handle role of K027's registry in both themes; the disabled envelope (globalAlpha 0.6 on main) enters the registry as an inactive exemption under WCAG 1.4.11, named, with \"disabled\" stated in its summary."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
