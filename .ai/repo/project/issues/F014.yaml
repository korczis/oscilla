objective: "Finish Q110's one Pro page frame for every surface below md. F002 (#601) landed the frame everywhere but carved the Synth and the Studio out below md (src/js/ui/shell.js PHONE_PRE_FRAME, issue F002b): those two views keep their pre-F002 phone geometry because their phone contracts were built on it. Under the frame as F002 first had it, CI run 44445904760 (#601 at 5eadead1, merged over U118 and U119) failed exactly these phone checks: ui-current phone-whole-edge-studio-320 (studio.graph.minimapToggle 4 px beyond the edge), phone-whole-overlap-studio-375 (keyboard.handle x studio.find), phone-whole-overlap-synth-320-pairs, phone-whole-covered-synth-375 and phone-whole-overlap-synth-375, u108-alert-on-top-320-open-collapsed; iphone reach-studio@iPhone SE (minimap toggle offscreen); step-grid sg-mount (rows 1, head C4, 4 cells); xy-pad x-view-phone (the touch point not drawn as sent); qa-regressions safety-notice. After: the carve-out is empty and every one of those checks passes with the frame applied below md too."
why: "Q110 (owner decision 2026-11-17) asks for one Pro page frame on every surface; the split that let F002 land (an LLM decision of oscilla-c3 and oscilla-43 under Q090, 2026-11-19) keeps that target open here rather than re-recording the phone debts it would have moved."
current_state: "Filed 2026-11-19 by oscilla-43 with F002's landing (#601), as the carve-out's named issue (F002b in shell.js and tests/unit/pro-page-frame.test.mjs). Nothing built yet."
