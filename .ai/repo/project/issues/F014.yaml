acceptance_criteria:
  - "src/js/ui/shell.js PHONE_PRE_FRAME is empty (and with it PRO.phoneSynth and PRO.phoneStudio); tests/unit/pro-page-frame.test.mjs then asserts every surface carries the Pro frame at every width, and fails on the base, which still carves the two views out."
  - "With the frame applied below md, in chromium, firefox and webkit: ui-current's phone-whole-edge-studio-320, phone-whole-overlap-studio-375, phone-whole-overlap-synth-320-pairs, phone-whole-covered-synth-375, phone-whole-overlap-synth-375 and u108-alert-on-top-320-open-collapsed pass with ui-current's recorded debt not grown (R320, R375 and U108_DEBT only shrink); iphone reach-studio, step-grid sg-mount, xy-pad x-view-phone and qa-regressions safety-notice pass."
