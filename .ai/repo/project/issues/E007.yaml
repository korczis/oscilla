id: E007
milestone: M046
serves:
  - "engineering-integrity#no-inert-surfaces"
title: "Formalize the owner's ban on placeholders, mockup data and inert controls as an enforced project rule"
slug: formalize-the-owner-s-ban-on-placeholders-mockup-data-and-in
priority: p1
profile: implementation
objective: "The owner's standing instruction: no hard-coding, mockups or placeholders, old or new; everything connected, interactive, integrated and covered by tests (conversation 6ac1beb8, 2026-10-04T03:01:41Z), with the earlier \"NO FAKE DATA: the mockup fixes UI geometry, never values\" and \"every control does something real\" (conversation 6abec18d, 2026-10-01T21:52:21Z; specification section 74). Write the rule under .ai/repo/rules/project/ in the same change as its enforcement: a unit test that refuses (a) placeholder copy in what a user can be shown (\"TODO\", \"lorem\", \"coming soon\", \"not implemented\", \"mock\" and the like; the HTML placeholder attribute of an input is not placeholder copy), (b) a disabled control with no stated reason (the completion ledger's W6), (c) a control in src/index.html with no binding to an effect and no mark that it is static, and (d) a value shown as data that comes from a literal rather than from state; each with a mutation test. What no mechanism can decide stays with the reviewer and the rule says so."
why: "The owner formalizes lessons as rules with mutation-proven enforcement; no project rule bans placeholders or inert controls today (no-fake-science covers invented science only)."
scope:
  - ".ai/repo/rules/project"
  - "tests/unit/no-inert-surfaces.test.mjs"
  - "tests/README.md"
  - "CLAUDE.md"
  - "AGENTS.md"
  - "src"
  - "docs/CLAIMS.yaml"
depends_on:
  - "E001"
acceptance_criteria:
  - "The rule file and its test land in one commit; the test fails on a mutation for each of (a) to (d) and passes on the tree, after the existing violations it finds are fixed or listed with a reason in an allowance that only shrinks."
  - "tests/unit/knowledge-integrity.test.mjs passes: the rule names its enforcement, the rules index lists it with version and class, and every bootstrap that names it names a rule in force (project.rules-name-their-enforcement)."
  - "Until the rule document lands, no file names it by an id."
  - "docs/CLAIMS.yaml gains the guaranteed claim `no-inert-surfaces` naming the source and the test that prove it, and the intent criterion this issue serves names that claim as its evidence in place of the command."
validation:
  - "node --test tests/unit/knowledge-integrity.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
created_at: 2026-10-18
