title: "Spectrum and mic spectrum: bin-honest readout, matched legend, stated peaks, last frame"
slug: spectrum-and-mic-spectrum-bin-honest-readout-matched-legend
priority: p2
profile: implementation
objective: "Lands as feat(charts) with a guarded part. spectrum-chart.js (analysis spectrum and mic dual) gets the kit's crosshair and keyboard cursor with a readout such as \"1.00 kHz . bin 11.7 Hz . max of 3 bins . -23.4 dB rel\": the frequency is printed by formatFrequencyWithResolution (src/js/measurement/format.js), with no digit finer than the bin width allows (\"1.00 kHz\" at 11.7 Hz, \"1.002 kHz\" only at 2.93 or 5.86 Hz), note name and cents only where the bin width resolves them, and a provenance line read from the node (smoothingTimeConstant, fftSize, sampleRate). under a still pointer the readout of a live chart is rewritten at most 4 times a second with a \"live\" marker, and says \"held\" once the data stops (paused, frozen); it is announced only for keyboard moves. Peaks: a new, guarded findPeaks(spectrum, { count, minSeparationBins, minProminenceDb }) in src/js/analysis/peak-detector.js (it has only the one-peak findPeak today): local maxima at least minSeparationBins apart and minProminenceDb above bandMedianDb of their neighbourhood, ranked by level, each refined by parabolicPeak and labelled at its interpolated frequency with its uncertainty, the method stated in the module header; the top three are laid out by layoutMarkerLabels. The legend becomes Pro toggles whose SVG swatches are drawn with the series' real stroke and dash from the palette; the mic plot (yLabel null) gets the relative caption; the analysis spectrum gains peak hold (\"Peak hold since hh:mm:ss\", Reset) and averaging with its mode and window, as Pro toggles; the peak-hold dash is named in the legend. F1 analogue: one Float32Array snapshot of the last drawn frame per configuration, so pause followed by Log/Linear, Max or a theme change re-renders it under a \"Paused, last frame\" badge, and a state note says why a plot without a snapshot is empty. No setData or redraw while Audio not started or paused; the spectrum and the mic analyzer subscribe to the frame loop with their hosts. It builds the chrome F006 places on the Analyzer card."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
