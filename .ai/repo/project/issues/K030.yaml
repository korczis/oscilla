acceptance_criteria:
  - "Unit tests that fail on the merge base: the readout's frequency equals formatFrequencyWithResolution at 2.93, 5.86 and 11.72 Hz bins (\"1.002 kHz\", \"1.002 kHz\", \"1.00 kHz\" for 1002 Hz) and states the aggregation; cents appear only under the stated bin-width rule; the snapshot redraw after a reconfigure equals the snapshot; the live-readout bound holds under a fake clock."
  - "tests/unit/analysis-peaks.test.mjs, failing on the merge base: findPeaks on synthetic spectra at 44.1 and 48 kHz finds two and three tones within one bin, keeps two tones minSeparationBins apart separate, finds nothing in noise below minProminenceDb, ignores DC, and states its uncertainty."
  - "tests/browser/labs.cjs: after pause and Log/Linear the plot is not at the floor (getImageData above the floor colour); the hover bin width equals the one computed from the live sampleRate; a legend toggle hides its series and leaves the other colours unchanged; uPlot setData is called 0 times across polled frame-loop ticks while audio has not started. A qa check in tests/browser/qa-regressions.cjs parks the pointer over the spectrum while a tone plays and finds the readout's DOM writes over a polled window within the live-readout bound (the hovered variant of no-per-frame-dom-writes). Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Its chart hosts (analysis spectrum, mic spectrum) move from pending to done in tests/unit/chart-host-census.json, each carrying data-osc-chart, and the table-driven pass of tests/browser/charts-interaction.cjs holds for each: the host is role=group holding the aria-describedby summary and the snapshot data table, and its focusable plot surface is role=application with aria-roledescription \"interactive chart\" (never role=img), both asserted in the accessibility tree, with a visible focus ring; ArrowRight moves the cursor one step and the one polite live region announces the readout once after the keys settle; Escape clears the cursor and still reaches the page's stop (a playing tone stops); Space keeps its workspace meaning (SPACE_MEANING of src/js/ui/shortcuts.js) and is never taken (ADR 0050); on a touch pointer a tap pins the cursor and it stays after the finger lifts."
  - "Levels say dB relative (dBFS-like) unless a valid LevelCalibration applies, every estimate is labelled as one, and no data value is tweened or eased; every readout, tooltip, axis title and caption string it adds is registered in its chart's wording table and passes tests/unit/charts-readout-wording.test.mjs (project.no-fake-science)."
  - "The chart reads existing AnalyserNodes on the main thread only, creates no audio node and adds no work to the audio path; hover and keyboard work runs on events only, a live readout under a still pointer is rewritten at most 4 times a second through the kit's live-readout, and no draw loop writes the DOM per frame (project.audio-engine-discipline v2)."
  - "The pull request carries a reviewer's verdict (src/js/analysis is guarded for findPeaks; the chart files are not; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3) and after F006 placed the card it sits in; no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "Every osc-* use it removes leaves the record in the same change: tests/unit/ui-flowbite-pro-baseline.json is rewritten by node scripts/ui-flowbite-pro-record.mjs (osc-chip-readout falls by the spectrum chip's use, and the legend's osc-* uses leave (osc-legend, osc-analysis-legend, osc-legend-item, osc-legend-dot at index.html:586-588 on main)), and a selector left without a producer is deleted from src/styles/charts.css (.osc-chip-readout, if this removes its last use), src/styles/components.css (.osc-legend, -item and -dot; K027, on which this slice depends, already removed the dot colour modifiers at :672-673, :650-673 on main), src/styles/instrument.css and src/styles/responsive.css (.osc-analysis-legend, :652 and :121) (tests/unit/css-producers.test.mjs); the pull request states by how much the debt fell."
  - "The visual references of the analysis and mic regions of test:visual are re-accepted in darwin-arm64 and linux-x64, in each theme that has references (light ones exist once F011 lands), with the reason \"spectrum legend, caption and peak labels\" in the pull request body (npm run test:visual)."
  - "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
