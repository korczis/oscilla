title: "Meter kind over the one level-meter model: densities for card, toolbar, strip and face, two channels, and the Studio header's output level"
slug: meter-kind-over-the-one-level-meter-model-densities-for-card
priority: p2
profile: implementation
objective: "Lands as feat(ui). The meter kind and the one level-meter model src/js/charts/level-meter-model.js (sample peak, window RMS, 2 s hold, clip latch 'sample >= 0 dBFS seen', gap detection; pure and allocation-free), which this slice lands in wave 1 and K049 then places in the analysis panel (K049 depends on W003; no second model): src/js/ui/kinds/meter.js draws one or two channels at the densities card, toolbar, strip and face, with role=meter, aria-valuetext in dB rel at the 4 Hz readout rate, and its numbers as W002 readouts. First new consumer: the Studio workspace header's output level, read from the engine's post-master analyser, labelled 'Output, dB rel (dBFS-like), sample peak, not true peak'. K016's Meter node mini canvas and the cockpit (G011), box faces (V621), channel strips (W013) and the Generator (K136) then mount the same kind. Before: VERIFIED no level is shown in the Studio workspace. After: one meter kind, one model. Negative cases: no AudioContext (Not running, never a flat bar); MEASURE owns the output (stated); reduced motion (the hold line still); a gap in the reads (the latch says >=). Rollback: revert. Merged plan of the component follow-up (2026-10-30): Wave 1: it needs F001 only. One model instance per observed signal, created and held by that signal's owner (the Studio workspace for its output) and passed to every view of it, so two densities of one signal show one number; latch.reset calls the owner's model, the view holds no hold or latch of its own. Enter on the focused meter or the latch button resets the latch (no letter key). Its numbers are formatted through G002 and carry T026 rows; they become W002 readout instances when W002 lands. This slice creates tests/browser/ui-kinds.cjs."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
