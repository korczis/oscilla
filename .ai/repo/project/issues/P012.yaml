current_state: "Not started. Waits on Q089's evidence, on F002 (WORKSPACE_REGISTRY, lane A's #386) on P013 (the hero's audition target) on K171 (the keyboard dock's yield rule) and on K167 (26's phone-pad slice under M069, branch feat/xy-shared-mount: mountSynthXy in src/js/synth/view/xy-wiring.js with its release paths), which joins depends_on when its record is on main. Later slices of M122 add the compact Studio and sequencer, the peeper (U067) and OSCILLOPAD's recorder (K098)."
acceptance_criteria:
  - "Starts only after K167's mountSynthXy, K171's dock yield rule, P013's audition target and F002's WORKSPACE_REGISTRY are on main. Fail-first: tests/unit/landing.test.mjs fails on the merge base: the landing model derives one card per WORKSPACE_REGISTRY row except itself, in the registry's order, with label, summary and related links, and a fixture registry with one more row yields one more card (project.fail-first)."
  - "Route: in every gate browser, from file:// and the /oscilla/ sub-path, an empty hash opens the landing, #m=playground opens the Playground, and every entry of the committed deep-link inventory resolves as before (tests/browser/landing.cjs; the inventory suite passes unchanged)."
  - "No audio before a gesture: opening the landing creates no AudioContext and no audio node (surface-census no-audio), and asks for no microphone or MIDI permission."
  - "First tap sounds on a phone: at 390x844 with touch and Chromium's user-gesture rule on, and in iphone.cjs's WebKit iPhone 13 and iPhone SE phones (the proving suite of project.a-phone-sounds), a tap on the XY pad and a tap on a keyboard key each start the one engine's output inside the tap's handler; the release paths are K167's criteria, which this slice runs on the landing's hero."
  - "The document is untouched: opening the landing, tapping the pad and playing the keyboard leave the Studio document's JSON, studioHash, history length and dirty flag unchanged and fire no unsaved-work guard; 'Open in Synth' adds exactly one undoable edit that inserts the preset."
  - "The migration is complete: every suite, helper and visual script that relied on the empty-hash Playground opens #m=playground through tests/browser/lib/start.cjs, a unit check finds no suite that opens dist with no hash except landing.cjs and the route checks, the Playground's visual references are byte-identical, the landing has its own reference accepted in review, and the iPhone census baseline is re-recorded and only shrinks."
  - "Size: the size report gives the base and head gzip figures, within the 1.2 MB budget."
  - "One of each: the landing mounts the pad only through mountSynthXy and the keyboard only through keyboard-ui.js; a unit check finds no AudioContext, createOscillator, keydown listener or second keyboard in src/js/ui/landing (the keys ratchet does not rise)."
  - "Derived cards: every card opens its workspace through the dispatcher by pointer, keyboard and touch, and the related links resolve (link-integrity)."
  - "Phone: at 390x844 the hero is in the first viewport, every target is at least 44 x 44 px, no text is under 12 px and nothing overlaps (ui-current#phone-whole)."
  - "Playable at once on a phone: at 390x844, in Chromium and in WebKit's iPhone 13 and iPhone SE, the whole XY pad lies inside the first viewport (elementFromPoint at its corners and centre is the pad), the keyboard or, while the pad owns the notes, the keyboard dock's handle is visible below it, no surface covers any part of the pad, and the first tap on the pad sounds; K171 (26, M069, riding Train 5 with K167: the dock state is a pure function of the note owner, pointer and width, collapsing to an announced handle when a pad owns the notes on a coarse pointer under 768 px) is what keeps it so, cited here and not restated, and it joins depends_on when its record is on main."
  - "Flowbite: the record's debt does not rise (node scripts/ui-flowbite-pro-record.mjs --check) and the landing's cards are the Pro card block."
  - "README's landing deep links and the Pages site open the landing (public-entry --live after the release)."
