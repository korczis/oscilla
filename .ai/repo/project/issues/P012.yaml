title: "The live landing, slice 1: /oscilla/ opens a landing whose XY pad and keyboard sound on the first tap and whose cards are derived"
slug: the-live-landing-slice-1-oscilla-opens-a-landing
priority: p1
profile: implementation
objective: "Lands as feat(ui) on branch feat/p012-live-landing. A `landing` workspace joins WORKSPACE_REGISTRY (summary, related, phone.primary) and becomes the default route of the one hash dispatcher: /oscilla/ and an empty hash open it, #m=playground opens the Playground, and every other #m=... entry opens what it opens today (ADR 0045, with a note on the default route). Its module is src/js/ui/landing (a pure model that derives the cards, and an Alpine part composed into the ONE component); the build has no HTML partials (E005 is not landed), so its markup in src/index.html is a few lines rendered from the model with x-for, and what it adds is paid for by legacy markup it removes or carries a raises entry with the reason. Hero: the XY pad mounted only through the shared XY wiring of K167 (mountSynthXy, lifted by 26 out of the Synth's xy-tab under M069), with the touch keyboard (src/js/midi/keyboard-ui.js) under it, its keys bound through K153's registry in scope { workspace: 'landing' }; no second pad, voice, keyboard or engine. The hero never edits the user's document: it plays a shipped XY preset of the one patch library (tag xy) as an engine plan owned by 'landing' with the engine's owner mark, compiled by the one compiler on the one AudioEngine and transport, with nothing written to the StudioModel, its history, its hash or its dirty flag (an audition, like the riff library's); 'Open in Synth' inserts the preset into the document as one explicit, undoable edit. That audition target is P013, on K167's seam; P012 mounts the hero through it and cites its criteria and K167's. The first tap on the pad or a key starts audio inside its own event handler (project.a-phone-sounds); opening the landing starts none. The hero's release paths (Stop, leaving the workspace, pagehide, losing the audio owner) are K167's, cited and not restated. The route change moves the empty hash off the Playground, so in the same slice every browser suite, helper and visual script that opens dist with no hash and expects the Playground opens #m=playground through one shared start helper (tests/browser/lib/start.cjs, not per-file edits); the visual references at the Playground stay unchanged, the landing gets its own new reference whose acceptance is the review (project.visual-identity-lock v3: a new view gets a new reference, and accepting it is the review), and the iPhone census baseline (tests/browser/iphone.cjs, #388) is re-recorded for the new first screen and only shrinks. ADR 0045 gets an appended, dated note on the default route; its decision text is not edited. Below the hero, one card per workspace in the registry's order, each with its label, summary and the registry's related links, opening its full workspace through the dispatcher; a workspace added to the registry appears without a landing edit. A visible line names the positioning sentence Q002 records and the tagline. Built on Flowbite Pro (ADR 0061): the cards are the Pro card block, no osc-* class token, legacy selector or inline style is added, so the Flowbite record only falls."
why: "Q089 (owner, 2026-11-03): /oscilla/ opens a new live landing, playable at once on a phone with the XY pad and keyboard, everything derived, reused and connected on one engine."
