title: "One deterministic response mode on the audio clock"
slug: midi-response-mode
priority: p2
profile: implementation
objective: "Implement one bounded response mode (drone plus answer, or call and response) as a pure rule from input events to output events, scheduled on the AudioContext clock; the same input gives the same output."
current_state: "Decided 2026-11-15 (ADR 0058's V503 note): call and response, agreed under Q090 by oscilla-c3 (rev-seat-2, claude-code c0f0687c) with amendments A1-A7, oscilla-43 adding the timer test and the one voice path. Built by oscilla-ff (session cae276ab-2d90-45d2-babb-a1f8023668d2) on feat/v503-midi-response from main 474ce9c3: the pure phrase recorder and answer (src/js/midi/response.js) with their unit tests first; the note-layer path, the clock mapping in audio/clock.js, the switch and the browser check follow on the same branch. Earlier record (2026-10-18): the scope names only MIDI paths plus the one integration file the criteria need (audit finding main-plan F9)."
