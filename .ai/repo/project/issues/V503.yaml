acceptance_criteria:
  - "The decision is ADR 0058's V503 note (call and response, its bounds, no feedback, the one voice path, the clock, the switch), agreed under Q090 by oscilla-c3 with amendments A1-A7 and recorded before the code that implements it."
  - "answer() is a pure function of the phrase: the same timestamped phrase gives the identical answer; it is the phrase at the fifth (same onsets, lengths and order, velocity max(1, round(v x 0.8))) within RESPONSE_MAX_NOTES, RESPONSE_MAX_MS, the polyphony, MIDI 127 and the running context's safeMaximum, a note beyond a bound dropped and never moved (tests/unit/midi/response.test.mjs)."
  - "The phrase end is the last Note Off with no key held plus PHRASE_GAP_MS, decided by a pure check on the caller's clock; a unit test fails if it uses setTimeout, setInterval or requestAnimationFrame (oscilla-43's ask)."
  - "No feedback: an answer's notes (source answer) never enter the phrase recorder, a MIDI output or a recording as the player's input; a unit test feeds an answer back and gets no answer (A1)."
  - "Answer notes take the same path as the player's keys (notes.js's owner table, the one instrument of K247, one NOTE_POLYPHONY pool, the session safety limit, refused while another owner holds the output) and are cut when the player plays again (A5; oscilla-43's ask), proven by unit tests on the note layer and tests/browser/midi.cjs midi-seam-response through the stub device."
  - "The answer starts at the phrase end + PHRASE_GAP_MS mapped to context time by audio/clock.js from one getOutputTimestamp reading; a start already past begins at now + START_OFFSET_S with the later onsets kept; mapping error 0 on a fake clock (A3, A4)."
  - "midi/response.js imports only core/music.js and references no timer, randomness, wall clock, fetch, XMLHttpRequest, WebSocket, Worker or import() (a unit test reads its source, A6)."
  - "The switch \"Otázka a odpověď\" in the MIDI section is catalogued (data-osc hook, trace, control-census row), off on every load and not persisted (A7); Flowbite Pro markup, Czech copy, the UI ratchets do not rise."
