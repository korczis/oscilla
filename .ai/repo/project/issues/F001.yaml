id: F001
milestone: M055
serves:
  - "ui-flowbite-pro#pro-build"
title: "Compile Tailwind and Flowbite at build time into the single file"
slug: compile-tailwind-and-flowbite-at-build-time-into-the-single-file
priority: p1
profile: implementation
objective: "Starts once pull request #250 is on main. That PR carries ADR 0061, rule project.ui-uses-flowbite-pro, project.visual-identity-lock v2, the ADR 0012 note and the ratchet tests/unit/ui-flowbite-pro.test.mjs with its baseline and the Pro fingerprints. This issue does not restate them. (1) Pin tailwindcss 3.4.x, postcss and flowbite 2.5.x in package.json as build-time dependencies, with exact versions; flowbite 2.5.x is the line the owner's poppyhead adaptation uses. (2) Add tailwind.config.cjs with the Pro theme of the flowbite-pro reference, section 0: the flowbite plugin; primary set to the Tailwind blue scale; the gray surface palette; transitionProperty width; a font stack that names Inter first and falls back to the existing system stack, with no font downloaded; darkMode ['selector', '[data-theme=\"dark\"]'], so OSCILLA's three-state theme drives the dark variant; content src/index.html, src/partials and src/js; and a safelist of the classes the shell's script toggles (lg:w-16, lg:ml-16, lg:hidden, lg:absolute and the rest that reference section names). (3) scripts/build.mjs compiles src/styles/tailwind.css, the one entry ADR 0061 allows, through Tailwind's PostCSS API before the esbuild CSS pass, and emits it after the legacy CSS in the one <style>. Preflight stays disabled in this issue, so the existing interface renders unchanged. (4) src/js/ui/flowbite.js imports into the app bundle only the flowbite components the shell uses (drawer, dropdown, collapse, tooltip, tabs) and initialises them after Alpine has rendered. An element is driven either by Alpine state or by a data-*-toggle attribute, never both. (5) scripts/release-metadata.mjs adds tailwind.config.cjs and the Tailwind entry to the source digest. (6) scripts/verify-dist.mjs accepts the plugin's data: URLs in CSS and nothing else new, and the notice lists flowbite and tailwindcss (MIT). (7) Add tests/unit/ui-flowbite-pro-build.test.mjs: dist carries the compiled Pro theme and the flowbite components, build:check reproduces it, and the size is within BUDGET. (8) Extend ui-flowbite-pro.test.mjs with the single-owner check. (9) State dist's measured raw and gzip size, before and after, in the pull request and in the BUDGET comment of scripts/build-config.mjs."
why: "Owner, 2026-10-28: every project must have Flowbite Pro, enforced and always used. ADR 0061 decides that Tailwind and Flowbite return at build time. The Play CDN was the only part ADR 0012 could not inline, and a build-time compile keeps the file self-contained."
