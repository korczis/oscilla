acceptance_criteria:
  - "Pull request #250 (ADR 0061, project.ui-uses-flowbite-pro, the ratchet) is on main before this issue starts. The ratchet's debt is unchanged by this issue. tests/unit/ui-flowbite-pro-baseline.json is rewritten from the tree in the same change: its vocabulary loses exactly the tokens the compiled CSS now defines, and every other field of the record keeps its value."
  - "tests/unit/ui-flowbite-pro-build.test.mjs passes and fails on the merge base (fail-first). npm test passes."
  - "tests/unit/ui-flowbite-pro.test.mjs also refuses an element of src/index.html that carries both Alpine state (x-bind, x-show, @click toggling it) and a flowbite data-*-toggle or data-*-target attribute, with a fixture case that makes the check fail."
  - "npm run build twice gives a byte-identical dist (build:check). verify-dist passes with no runtime fetch, no remote font and no root-relative asset. The gate browsers open dist from file:// and from the sub-path with zero console errors."
  - "The visual gate (npm run test:visual) passes against the existing references at their recorded thresholds, with no reference and no threshold changed: that measured result, not a reading of the CSS, is what 'nothing renders differently' means here. Preflight is off and the plugin is loaded with forms: false (or not at all, see the objective), and the built CSS carries no flowbite rule for a bare input, select or [type] selector."
  - "dist's size before and after is stated and is within BUDGET."
  - "The pull request carries a review verdict, because scripts/build*, scripts/pack-single-file.mjs, scripts/verify-dist.mjs and scripts/release-metadata.mjs are guarded."
  - "The governance of intent ui-flowbite-pro names rule:project.ui-uses-flowbite-pro and adr:adr-0061, and majordomus intent validate reports 0 failures."
validation:
  - "node --test tests/unit/ui-flowbite-pro-build.test.mjs tests/unit/ui-flowbite-pro.test.mjs"
  - "npm test"
  - "npm run build:check"
  - "npm run verify-dist"
  - "npm run test:visual"
evidence_required:
  - "verified"
