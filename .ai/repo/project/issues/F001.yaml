title: "Compile Tailwind and Flowbite at build time into the single file"
slug: compile-tailwind-and-flowbite-at-build-time-into-the-single-file
priority: p1
profile: implementation
objective: "Pin tailwindcss 3.4.x, postcss and flowbite 2.5.x (the line the owner's poppyhead adaptation uses; exact versions in package.json) as build-time dependencies. Add tailwind.config.cjs with the Pro theme of the flowbite-pro reference section 0: the flowbite plugin, primary = the Tailwind blue scale, the gray surface palette, transitionProperty width, a font stack that names Inter first and falls back to the existing system stack with no font downloaded, darkMode ['selector', '[data-theme=\"dark\"]'] so OSCILLA's three-state theme drives the dark variant, content src/index.html, src/partials and src/js, and a safelist of the classes the shell's script toggles (lg:w-16, lg:ml-16, lg:hidden, lg:absolute and the rest reference.md section 0 names). scripts/build.mjs compiles src/styles/tailwind.css through Tailwind's PostCSS API before the esbuild CSS pass and emits it after the legacy CSS in the one <style>; preflight stays disabled in this issue so the existing interface renders unchanged. src/js/ui/flowbite.js imports only the flowbite components the shell uses (drawer, dropdown, collapse, tooltip, tabs) into the app bundle and initialises them after Alpine has rendered; an element is driven either by Alpine state or by a data-*-toggle attribute, never both. scripts/release-metadata.mjs adds tailwind.config.cjs and the Tailwind entry to the source digest. scripts/verify-dist.mjs accepts the plugin's data: URLs in CSS and nothing else new, and the notice lists flowbite and tailwindcss (MIT). Add three tests: tests/unit/ui-flowbite-pro-build.test.mjs (dist carries the compiled Pro theme and the flowbite components, build:check reproduces it, the size is within BUDGET); tests/unit/ui-flowbite-pro.test.mjs, the ratchet: per file of src/styles, the class selectors outside tests/unit/ui-flowbite-pro-domain.json (the domain-visual allowlist, each entry with its reason) are the debt recorded in tests/unit/ui-flowbite-pro-baseline.json as {\"debt\": {\"<file>\": <count>}}; a count above its baseline (new legacy chrome) fails, a count below it fails until the baseline is lowered in the same change, and a legacy class whose name equals a Tailwind utility (hidden, flex, container, ...) fails until it is renamed; tests/unit/ui-flowbite-pro-licence.test.mjs, which refuses the Pro templates' fingerprints (demo names and copy, asset paths, licence headers, the dashboard's own sidebar.js and dark-mode.js) in every tracked file. Record the decision as ADR 0061 (Tailwind and Flowbite compiled at build time, the Pro theme, preflight staged), append a resolution note to ADR 0012 (its 'Tailwind and Flowbite are dropped' bullet is superseded; the rest stands), revise project.visual-identity-lock to v2 (the identity is the Pro shell and components with OSCILLA's logo, domain visuals and signal palette; colours come from tailwind.config.cjs for chrome and src/styles/tokens.css for domain visuals; review checks Pro fidelity), and name the three tests in the Verification section of project.ui-uses-flowbite-pro. State dist's measured raw and gzip size, before and after, in the pull request and in the BUDGET comment of scripts/build-config.mjs."
why: "Owner, 2026-10-28: every project must have Flowbite Pro, enforced and always used. ADR 0012 rejected a build-time Tailwind only because the design was token-driven; the Play CDN was the part that could not be inlined, and a build-time compile keeps the file self-contained."
