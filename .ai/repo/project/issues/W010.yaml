id: W010
milestone: M102
serves:
- "instrument-kinds#sequencer-surfaces"
title: "XY pad kind: two declared parameters on one surface, with two sliders for keyboard and screen readers, first on the Filter Lab and ADSR handles"
slug: xy-pad-kind-two-declared-parameters-on-one-surface-with-two
priority: p2
profile: implementation
objective: "Lands as feat(charts). src/js/ui/kinds/xy-pad.js over charts/drag-math.js (one implementation): x and y each bound to a section 79 parameter (unit, bounds, log or linear), a live preview during a drag (the explicit ephemeral case of section 80) and one commit per gesture; role=group holding two sliders with aria-valuetext in each unit; keys Left and Right on x, Up and Down on y, Shift fine, PageUp and PageDown coarse, Home and End, Enter for typed entry of both, reset by double-click, double-tap or the menu (N002); touch-action none on the pad only. First consumers: the Filter Lab response handle (cutoff by Q, after K043) and the ADSR handles (after K045), whose canvas is aria-hidden today (VERIFIED envelope-graph.js:22); K097 then mounts it. Before: two pointer-only 2D handles. After: one XY kind reachable by keyboard and touch. Negative cases: a typed value out of range (refused with its sentence); a drag beyond the plot (clamped); a two-finger gesture (left to the page). Rollback: revert. Merged plan of the component follow-up (2026-10-30): K097 depends on W010."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
