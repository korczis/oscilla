title: "Parameter locks and CV lanes that target any knob of any instrument"
slug: parameter-locks-and-cv-lanes-that-target-any-knob-of-any-ins
priority: p2
profile: implementation
objective: "Lands as feat(studio). A steps clip gains locks per step ({ '<node>.<param>': value }) and CV lanes (one value per step for a target parameter, own length for polymeter), compiled to setValueAtTime on that parameter at the step time under the transport's parameter ownership (runtime.setOwnedParams) as automation lanes are; the sequencer fields swing, probability and length are lane targets at step resolution, stated as such. In the grid, holding a step and turning a knob writes a lock (one history entry). Before: a step cannot change a parameter. After: locks and CV lanes per step. User-value tier 3 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document with a steps (with locks) clip is then refused by the import pipeline with its sentence, so after a release the clip kind stays and the editor is removed instead. Merged plan of the component follow-up (2026-10-30): The lock gesture and its validation are W009's."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
