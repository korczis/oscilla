acceptance_criteria:
  - "The response probe shows the shelf gain within +-0.5 dB and the allpass magnitude flat within 0.1 dB, in a unit test that fails on the merge base."
  - "A type change keeps the existing click-free crossfade."
  - "Brown noise has a -6 dB/octave slope within 1.5 dB."
  - "Web Audio ignores Q on a shelf (usesQ in src/js/audio/filters.js), so on a shelf the Inspector's Q control is hidden or disabled with that reason and a Q edge or lane is marked inactive with it; gain is live on the shelves and peaking only, and the help text says so (project.no-inert-surfaces)."
  - "The Filter Lab and the V1 config file either accept the new types, with a test, or keep their current set, stated in the pull request; no new markup."
  - "All hashes are unchanged."
  - "The pull request carries a reviewer's verdict (src/js/audio and src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first). It adds no markup, osc-* class token or stylesheet selector, so the Flowbite Pro ratchet stays flat (node --test tests/unit/ui-flowbite-pro.test.mjs). A capped file it grows past its cap is split first or its raise is declared in tests/unit/source-size-baseline.json's raises ledger."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
