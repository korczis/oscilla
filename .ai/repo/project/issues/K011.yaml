objective: "Lands as feat(studio). Add the lowshelf, highshelf and allpass types to the Filter node (src/js/audio/filters.js usesQ and usesGain, src/js/studio/nodes/processing.js) and a brown option to the Noise node (src/js/studio/nodes/sources.js, src/js/audio/noise.js). New enum options leave every pinned hash unchanged. Everything that reads the filter types follows: gainIsUsed in src/js/studio/clip-targets.js (peaking only today) and the graph view's inactive-edge rule, the Filter help text (\"gain applies to peaking only\", src/js/studio/nodes/processing.js), the V431 gain test that loops over FILTER_TYPES, the Filter Lab that shares FILTER_TYPES (src/js/labs/filter-lab.js) and the V1 config file that keeps its own list (src/js/ui/config-file.js)."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
