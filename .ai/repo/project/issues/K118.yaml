title: "MIDI file export and import (Standard MIDI File, offline)"
slug: midi-file-export-and-import-standard-midi-file-offline
priority: p3
profile: implementation
objective: "Lands as feat(midi). A pure Standard MIDI File codec (types 0 and 1, tempo and meter events, notes, CC): export of notes and steps clips with the tempo map, and import through the strict import pipeline (size cap, structural scan, counts) into notes clips on new instrument tracks; no network. Before: no MIDI file is read or written. After: SMF export and import. User-value tier 4 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/midi"
  - "src/js/studio/sequence-import.js"
  - "src/js/studio/validate.js"
  - "src/js/ui/synth"
  - "tests/unit/smf-codec.test.mjs"
  - "tests/browser/session.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K099"
  - "K112"
acceptance_criteria:
  - "tests/unit/smf-codec.test.mjs, failing on the merge base: export then import of a fixture project deep-equals its notes, tempo and meter; a truncated, oversized or malformed file is refused with a sentence and changes nothing; running status and variable-length quantities decode exactly."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a truncated or oversized file (refused)."
  - "A browser check in tests/browser/session.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: an imported file's tracks appear in the arrangement and the Studio timeline. Real-time: an imported clip plays on the next pass, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: import and export work by pointer, keyboard and touch. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the line's figures stays within the cap Q023 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/smf-codec.test.mjs"
  - "node tests/browser/session.cjs"
  - "npm test"
evidence_required:
  - "verified"
