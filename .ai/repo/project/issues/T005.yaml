objective: "Truth-table rows SPC-01 (MIC-05 is planned by K030) (scratchpad p05/truth-table.md). About reads \"Relative (dBFS-like, uncalibrated)\"; README and docs/GLOSSARY.md say in one line that the analyser scale puts a full-scale sine near -13.6 dB and that the MEASURE scales differ (docs/v3/algorithms.md). The microphone chart caption and the dB rel readouts are K030 (M062): the mic plot gets the relative caption there, and T026 holds it."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): About says \"Levels: Relative (dBFS)\" (index.html:2506), the bare dBFS that accepted ADR 0017 says these readings are not. The microphone chart passes yLabel: null, so its \"0 dB\" top tick has no reference, while the single-mode spectrum shows \"RELATIVE LEVEL (dBFS-like, uncalibrated)\". The -13.56 dB offset of a full-scale sine is stated only in the ADR."
