priority: p3
profile: implementation
objective: "R2-T5-8 (product note, P3; found by rev-seat-2 oscilla-c3's control run of graph-keys-k009 at train T5 91838acb, webkit). In the Studio graph (src/js/ui/studio/graph-editor.js draws each cable as a group with an osc-sg-edge-hit path), a click at the midpoint of edge-3 (Filter -> Master), where edge-5 crosses it, selected edge-5, while document.elementFromPoint at that point returned edge-3's hit path: the graph's pick does not follow the paint order, so the cable drawn on top is not the one a click selects. Make a click select the cable that is topmost at the pointer (the hit path elementFromPoint returns), or draw the selected-on-click cable on top, so the cable a user sees under the pointer is the one selected."
why: "oscilla-c1's T5 train review (2026-11-10) took R2-T5-8's test fix (a) into T5 and filed the product side (b) for T6; oscilla-43 ordered it filed. Main a7102358 selects edge-3 at the same test only because no other cable crosses its midpoint there."
