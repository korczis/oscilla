- dist
current_state: "Criteria audit on main 04d33aaf (2026-11-11) by oscilla-0b with a read-only audit agent, each finding read at its source: not stamped. Landed by train 3 #404 (16172059, 9d347125; verdict 404.yaml). Met: text at least 12 px, no label overlap, 44 px jacks, cards hidden behind the Patch bay chip, a module chip brings them back (synth.cjs s-mobile, synth-bay-phone 3/3). Not as written: (1) \"directly under the chip bar\": s-mobile computes gap (synth.cjs ~:2739) but never asserts it; (2) the Panel chip bringing the cards back is implied by s-look's later click, not asserted; (3) the xl negative case (both faces, Panel chip hidden) is proven only by class names (synth-bay-phone.test.mjs:84-86), with no rendered check at 1536 px. All three gaps closed on test/v636-bay-asserts: s-mobile asserts the bay card 0-16 px under the chip bar (measured 8 seen, 12 in flow, the bar's mb-3 plus 4 px) and that the Panel chip brings the cards back (cards and plate shown, bay hidden, aria-pressed); the new s-xlfaces renders 1536x1024 with both faces side by side, no chip nav on the Panel tab, no Panel chip on Engines, both faces after Patch bay. Each fails its negative control (an mt-10 bay; the nav without xl:hidden; the Panel chip without xl:hidden). Stamp after it lands. Done on 2026-11-12 on main 3dfe1985 (v3.36.0, T14 #537 landed the checks): every criterion met (evidence below)."
depends_on:
- V635
acceptance_criteria:
- "Before: VERIFIED: at 390x844 under touch the bay starts below every module card and its SVG text is 10 px."
- "After: the Patch bay chip shows the bay at the card's full width directly under the chip bar, with the cards hidden; its text is at least 12 px, no two jack labels overlap and every jack is a 44 px target; Panel or a module chip shows the cards again."
- "Negative cases: at xl both faces show and the Panel chip is hidden; a cable patched on the bay face plays and is listed under Cables."
- "Rollback: revert the merge commit; no stored record or schema changes."
