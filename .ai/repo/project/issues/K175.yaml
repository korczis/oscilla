depends_on: []
current_state: "Built, landing with trains 5 and 6: S2 and S18 are fixed by 26's 3c22d01a (train 6), where midi/notes.js records at note-on, in its `via` map, the sink route() returned or the Playground engine, and routes the note-off there; this supersedes dev-53's 2124f226 (train 5, #413) for S18. tests/browser/midi.cjs:972-986 reproduces S18 and S19 (fails at 447bb27b, passes on feat/train-6-prep 9e4f1035 in three engines). Done with evidence once both are on main and the criteria below hold there. Done 2026-11-11 (stamped by oscilla-43 after a per-criterion check on main 0e20f83c): the routing fix is f118edc0 (S2: the note layer keeps each key's sink from its note-on), not 3c22d01a, which moved the Synth note path out of ui.js; the S18 held-map check is e01be8b0; the verdict is 486.yaml."
acceptance_criteria:
  - "Fail-first: a unit test holds a note through the Playground sink, switches the route to the Synth and releases it, and asserts the Playground voice is released; the same for a note held through the Studio sink; it fails on the merge base (project.fail-first)."
  - "Browser (every gate browser): a continuous Playground MIDI note held across a switch to the Synth, and a Studio-keyboard note held across leaving the Studio, each end on release; the engine's live note census returns to idle."
  - "Browser, S18 specifically (af, second pass): holding a Studio-keyboard key across a workspace switch releases it on the Studio node, and the Studio sink's held map is empty afterwards, in every gate browser."
  - "src/js/synth is guarded (project.review-verdict v2): a non-builder's verdict."
