acceptance_criteria:
- "Before (re-verified at origin/main a19f1ff6; K150's src/js/ui/patch/patch-bay.js is on main, while K150's record is still open, so K150 is not a dependency): patch-bay.js keeps a STATE_LABEL table of its own (:84) and reads PORT_VISUALS (imported at :19 from src/js/studio/ports.js, used at :93) for shape and noun, and the per-module part is the Synth adapter's labels (synth/view/bay.js panelSource, from panel.jacksOf), which the port contract does not hold."
- "After: every jack's name, shape, direction and refusal on the bay come from describePort, PORT_KINDS and canConnect; a fixture source whose port changes its contract changes the bay with no bay code changed."
- "Negative cases: a port of an unknown type, a cable of an unknown kind and a port whose contract misses its label are refused or reported by name, never drawn with a guessed shape."
- "Rollback: revert the merge commit; nothing changes the schema or a stored record."
- "tests/unit/patch-bay-contract.test.mjs fails on the merge base (project.fail-first); synth.cjs s-connect and s-look stay green in chromium, firefox and webkit."
- "A criterion decides it: the same pull request adds node --test tests/unit/patch-bay-contract.test.mjs to the ref of studio-box-system#node-declaration and of connected-instrument#patch-cables (today neither ref runs it), and M080's acceptance names K165."
- "The bay is M123's one patch bay (G024, component-system#one-implementation-per-family, origin/chore/plan-unified-controls): this issue makes the bay render from the contract and adds no second bay; Arturia and iMS-20 are a quality bar, not a look, and project.visual-identity-lock holds."
- "It changes no file under src/js/studio (ports.js and registry.js are 26's and guarded): the contract is read, never edited here; a change that needs one is 26's V619."
- "Flowbite Pro: no class token, selector or inline style is added (node scripts/ui-flowbite-pro-record.mjs --check passes with no rewrite); scripts/size-report.mjs shows the gzip delta in the pull request body; synth-wording.test.mjs passes on every new sentence; the phone checks do not fall: synth.cjs s-mobile and tests/browser/touch-audio.cjs pass (tests/browser/iphone.cjs, named before, is not on main)."
validation:
- node --test tests/unit/patch-bay-contract.test.mjs
- node tests/browser/synth.cjs --only s-connect,s-look,s-mobile
evidence_required:
