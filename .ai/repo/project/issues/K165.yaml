title: "The patch bay and the cable inspector render only from the port contract"
slug: the-patch-bay-and-the-cable-inspector-render-only-from-the-port-contract
priority: p1
profile: implementation
objective: "Owner program B (2026-11-03), slice B2. Every jack the patch bay draws (src/js/ui/patch/patch-bay.js, its Synth adapter src/js/synth/view/bay.js) and every cable the cable inspector shows takes its name, type, direction, cardinality, unconnected behaviour and refusal from the one port contract: describePort and canConnect of src/js/studio/ports.js and the port and cable kinds V619 declares (PORT_KINDS, CABLE_KINDS), never from per-module code. The Synth panel's own jack labels become the declared label the contract carries; a jack whose contract lacks a field shows the field's derived default and the matrix (K164) counts it. A refusal is canConnect's sentence, unchanged. The bay's drawing stays the synth-theme layer's (F013)."
why: "The owner's program B of 2026-11-03 asks that the bay render only from the contract so a module needs no bay code of its own; agreed on the mesh with oscilla-26 (V619 declares, dev-53 renders)."
depends_on:
- "V619"
- "K164"
scope:
- src/js/ui/patch
- src/js/synth/view/bay.js
- src/js/synth/ui.js
- tests/unit/patch-bay-contract.test.mjs
- tests/browser/synth.cjs
- tests/README.md
- dist
acceptance_criteria:
- "Before: re-verified on main after the phone-bay train lands K150 and with it src/js/ui/patch/patch-bay.js (K150's record travels in that train, so it cannot be a dependency before it lands): patch-bay.js keeps a STATE_LABEL table of its own and reads PORT_VISUALS (src/js/studio/ports.js:55) for shape and noun, and the per-module part is the Synth adapter's labels (synth/view/bay.js panelSource, from panel.jacksOf), which the port contract does not hold."
- "After: every jack's name, shape, direction and refusal on the bay come from describePort, PORT_KINDS and canConnect; a fixture source whose port changes its contract changes the bay with no bay code changed."
- "Negative cases: a port of an unknown type, a cable of an unknown kind and a port whose contract misses its label are refused or reported by name, never drawn with a guessed shape."
- "Rollback: revert the merge commit; nothing changes the schema or a stored record."
- "tests/unit/patch-bay-contract.test.mjs fails on the merge base (project.fail-first); synth.cjs s-connect and s-look stay green in chromium, firefox and webkit."
- "It changes no file under src/js/studio (ports.js and registry.js are 26's and guarded): the contract is read, never edited here; a change that needs one is 26's V619."
- "Flowbite Pro: no class token, selector or inline style is added (node scripts/ui-flowbite-pro-record.mjs --check passes with no rewrite); scripts/size-report.mjs shows the gzip delta in the pull request body; synth-wording.test.mjs passes on every new sentence; tests/browser/iphone.cjs census reach does not fall."
validation:
