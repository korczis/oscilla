title: "A shared unit-test helper has one owner: the in-memory IndexedDB, the YAML unquote and the shell markup reader"
slug: a-shared-unit-test-helper-has-one-owner
priority: p3
profile: implementation
objective: "DRY audit 2026-10-29 (cases clones-test-fake-indexeddb-inline, clones-test-claims-unquote, clones-test-shell-markup). tests/unit/v31-studio-patches.test.mjs kept an older inline copy of tests/unit/fixtures/fake-indexeddb.mjs (no openError or throwOnOpen switch, no quota at commit, no readonly or inactive transaction errors); tests/unit/v31-studio-self-knowledge.test.mjs a byte copy of tests/unit/claims-parse.mjs unquote; tests/unit/about-origin.test.mjs and positioning-consistency.test.mjs two copies of the shell markup reader, E005's future assembly rule. Each copy is deleted and its test imports the owner: the shared fake gains the inline copy's deleteObjectStore guard, and the shell reader moves to tests/unit/fixtures/shell-markup.mjs, which E005 replaces with the build's assembler. tests/unit/test-helpers-one-owner.test.mjs keeps a copy from coming back."
why: "A copied test helper keeps testing the old contract: the patch store's tests ran against a weaker IndexedDB than the experiment store's, and two tests each defined how the shell is assembled before the build does."
scope:
  - "tests/unit/v31-studio-patches.test.mjs"
