  - "tests/unit/test-helpers-one-owner.test.mjs"
  - "tests/README.md"
acceptance_criteria:
  - "The four migrated test files pass the same tests before and after the move (22, 21, 2 and 8), and none of them changes an assertion."
  - "tests/unit/test-helpers-one-owner.test.mjs: each helper is defined by its owner and by no other file under tests/ (the unquote of plan-evidence-commits and release-validation-pins, which differ in meaning, are named as distinct); a mutation case proves the scan sees a function and an arrow redefinition."
  - "npm test passes; no src/ or dist/ change."
validation:
