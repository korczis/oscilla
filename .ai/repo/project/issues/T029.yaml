depends_on: []
acceptance_criteria:
  - "Fail-first: the new BANNED pattern safe max(?:imum)? hits src/index.html:719 on the merge base, and the docs scan hits docs/v31/timeline.md:368 and the bare 'dB SPL' of docs/v3/architecture.md."
  - "shippedCopy includes README.md and docs/**/*.md (code fences stripped) and the scan passes on them; a fixture that adds 'safe max' or a bare 'dB SPL' to docs fails."
  - "The Device & Limits readout shows 'Digital limit'; data-osc device.safeMax and its browser checks are unchanged."
  - "learn.js:78 names its source, and the cited-style check of tests/unit/bioacoustics.test.mjs covers learn.js."
  - "The qualifier rule is in the test with a case per qualifier and one bare case; the measured counts (46 hits, 1 bare) are in the pull request body."
  - "Not a guarded path under v2 (src/index.html is guarded once R031 lands; then the second seat of Q091 judges it). Lane: dev-53."
