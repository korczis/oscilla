title: "Run-to-run consistency of repeated runs"
slug: coherence-of-repeated-runs
priority: p2
profile: implementation
objective: "For a measurement of three or more runs compute, per frequency, the run-to-run consistency gamma^2 = |sum H_i|^2 / (N sum |H_i|^2) of the N transfer estimates, whose expected value under independent noise is (SNR + 1/N) / (SNR + 1), not SNR / (1 + SNR); name it run-to-run consistency, never coherence in the input-output sense; show it as a reliability view with N stated, and add it to the quality reasons where it is low. It follows V395 because both extend the stored result schema and the result views."
why: "Conversation 6abec18d, 2026-10-02T03:15:06Z, item 16; the natural estimator is biased at small N (critique measurement-extensions, coherence-target-is-biased)."
