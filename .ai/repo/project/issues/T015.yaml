  - "Fail-first fixture: tests/unit/readout-in-effect-phase-controls.test.mjs: entering 400 leaves the field at 40; update({ phaseDeg: 90, pan: -0.5 }) leaves the fields at 90 and -0.5. Browser check in tests/browser/labs.cjs: mono dual playing, pan 0 → -1, poll with a named deadline until the router gains are gL 1, gR 0. Fails on the merge base."
  - "Negative cases, each asserted: Valid values 0-359 unchanged; split route ignores pan and says so; no audible click on the restart (engine-v1port.cjs restart checks pass)."
