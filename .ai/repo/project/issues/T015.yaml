title: "The Phase & Stereo fields and the Pan slider show the value in effect"
slug: the-phase-stereo-fields-and-the-pan-slider-show-the-value-in
priority: p2
profile: implementation
objective: "Truth-table rows STP-12, STP-13 (scratchpad p05/truth-table.md). setCfg writes the normalised values back to the fields (offset, pan, A, B) on commit and on update() from an import; the pan change while playing rebuilds the router through the engine's seamless restart (ADR 0003), or the dual plan always has a router; the slider is disabled with a stated reason in Stereo split; Δφ B shows its unit and the B-leads, start-only meaning."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): Typing 400 into Δφ B leaves \"400\" (invalid) while 40° applies; after a configuration import with phaseDeg 90 the field still shows 180, and the Pan slider shows 0 while cfg.pan is -0.5. Moving Pan from 0 to -1 while a mono dual plays changes nothing (no router, panners at 0) while the slider and aria-valuetext say \"100% left\", which also contradicts accepted ADR 0003 (glide or restart)."
