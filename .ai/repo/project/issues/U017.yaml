acceptance_criteria:
  - "Fail-first: tests/unit/icon-meaning.test.mjs reads src/index.html and fails on the merge base: every control whose accessible name or text starts with Export uses the one export symbol and every one that starts with Import the one import symbol ([data-osc=header.export], [data-osc=action.exportAudio], [data-osc=studio.export] and [data-osc=studio.import] among them); both symbols are Lucide @icon markers; no <symbol id=\"i-export\"> or <symbol id=\"i-upload\"> remains unused; and no toolbar container holds both an #i-* and an #s-* use."
  - "A browser check in tests/browser/v31-studio-workflows.cjs (or the suite F002 adds, once landed) reads the rendered <use> of the four controls in the header, the Studio toolbar and the status bar at 1536x1024 and asserts the export ones name one symbol and the import one the other, and that each control still performs its action (the export menu opens, the Studio project downloads, the import file picker is requested, the audio export starts)."
  - "It adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
  - "As a fix change it carries a unit test that fails on the merge base and passes on the head (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "Definition of done, extends: the icon set gains a rule of meaning (one glyph per action) on top of G009's one look for expand and fullscreen."
  - "Definition of done, interlinks: the objective names G009, H004, F002, F008 and F010; the unit test names this issue and the review finding."
  - "Definition of done, interactivity: the four controls keep their actions, asserted by the browser check above."
  - "Definition of done, docs, menus and routes: no route or menu entry changes (stated); docs/ui-audit.md records the finding as resolved and states which glyph means export and which import."
  - "Definition of done, tested: tests/README.md has a row for each new test; npm test and the browser check pass."
  - "Definition of done, deployed: dist is rebuilt and npm run build:check passes; it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
validation:
  - "node --test tests/unit/icon-meaning.test.mjs"
  - "node tests/browser/v31-studio-workflows.cjs"
  - "npm test"
evidence_required:
