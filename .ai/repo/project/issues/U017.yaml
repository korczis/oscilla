id: U017
milestone: M054
serves:
  - "ui-current#ui-audited"
title: "Export and import each show one glyph, from one icon family, wherever they appear"
slug: export-and-import-each-show-one-glyph-from-one-icon-family
priority: p2
profile: implementation
objective: "Lands as fix(ui). Before: the same action has no stable glyph and the arrows contradict each other. The header Export ([data-osc=header.export], src/index.html:199) uses the hand-drawn #i-export (arrow up out of a tray, src/index.html:45) and the status bar's Export Audio ([data-osc=action.exportAudio], src/index.html:2824) the hand-drawn #i-upload (arrow up, src/index.html:46), while the Studio toolbar's Export project file ([data-osc=studio.export], src/index.html:2387) uses the Lucide #s-export (file-down, src/index.html:99) and its Import ([data-osc=studio.import], src/index.html:2398) the Lucide #s-import (file-up, src/index.html:98): export points up in the header and down in the Studio, where import points up, and one toolbar mixes the hand-drawn i-* family (stroke 2.2) with the Lucide family the packer inlines (scripts/pack-single-file.mjs, @icon markers). After: one export glyph (a file leaves for the user's disk: the Lucide download family, arrow down) and one import glyph (a file is read in: arrow up), both Lucide symbols inlined by the packer, used by every control whose accessible name starts with Export or Import and carries a glyph; #i-export and #i-upload are removed once nothing uses them. The fix changes only which symbol a <use> names: no new osc-* class, selector, markup surface or inline style (project.ui-uses-flowbite-pro), and every control keeps its action (project.no-inert-surfaces). Because the header, the Studio toolbar and the status bar are legacy surfaces that F002, F008 and F010 rebuild on Pro, it lands on (or as a criterion of) those migrations so the rebuilt Pro icon buttons carry the agreed glyphs. Negative cases: a control named Export or Import whose glyph is not the agreed one; an i-* symbol beside a Lucide symbol in one toolbar; a glyph with an arrow but no export or import meaning reusing the export symbol. Rollback: revert; markup and symbol references only. Not this: G009 (one look for expand, fullscreen and open-in-workspace only), H004 (moves Import out of the Export menu: naming and placement), C005 and K017 (the sequencer loop icon); F002 and F008 restyle these controls but name no glyph."
why: "Found by the S074 quality-bar review of 2026-10-30 at origin/main d9db6bdf, section 74 symptom 'random icon usage: the arrow direction for export and import is contradictory across the app', reproduced by an independent verifier. Evidence: scratchpad s074/d-studio.png (1536x1024: header Export at x=1460 and status-bar Export Audio at x=1232 show up-arrows; the Studio's Export project file at x=1399 y=185 a down arrow and Import at x=1467 an up arrow) and the control crops s074/btn-header.export.png, s074/btn-action.exportAudio.png, s074/btn-studio.export.png and s074/btn-studio.import.png; serves ui-current#ui-audited."
