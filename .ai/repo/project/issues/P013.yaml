current_state: "Not started. Starts only after K167 (the seam, 26, feat/xy-shared-mount, heading Train 5) is on main; it joins depends_on when its record is on main. K149's audition is not used (a panel patch needs the runtime, not a steps plan); its owner-mark and riff-id conventions are. P012's hero mounts through this target. src/js/synth is guarded under project.review-verdict v2 (landing with Train 4), so the pull request carries a non-builder's verdict."
acceptance_criteria:
  - "Starts only after K167 is on main. Fail-first: tests/unit/xy-audition.test.mjs fails on the merge base: the audition target wires a shipped XY preset as a plan owned by 'landing', and wiring, playing and releasing it leave the document's JSON, studioHash, history length and dirty flag unchanged (project.fail-first)."
  - "Owner separation: with the Synth's document panel also patched to the pad, a live update of the document panel leaves the landing's voice sounding, and Stop releases both (unit on the fake context, browser in every gate browser)."
  - "Open in Synth adds exactly one undoable edit that inserts the preset, opens the Synth on it, and Undo removes it."
  - "One runtime: the runtime that sounds the hero is the one Studio runtime in its detached-patch mode; the detached model passes the same validate and normalize as the store's, is never in the store, and is gone after release; the runtime's live node census returns to idle on every release path (Stop, leaving the landing, owner loss, pagehide); a unit check finds no AudioContext or createOscillator in xy-audition.js."
  - "Audio discipline (project.audio-engine-discipline): click-free attack and release, every frequency below 0.95 x Nyquist, the peak at or under the output ceiling, measured on the fake context and in the browser."
  - "The first tap on the hero sounds in WebKit's iPhone 13 and iPhone SE phones with the gesture rule on (project.a-phone-sounds)."
  - "Review: src/js/synth is guarded (project.review-verdict v2), so .ai/repo/reviews/<pr>.yaml from a non-builder reviewer carries verdict merge for the content."
  - "Standard: the size report gives base and head figures within the 1.2 MB budget; the wording test covers 'Open in Synth' and every new string; Open in Synth is a Pro button; tests/README rows name the new checks."
