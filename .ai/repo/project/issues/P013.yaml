title: "The landing hero plays an owned audition of a shipped XY preset, never an edit of the user's document"
slug: the-landing-hero-plays-an-owned-audition-of-a-shipped-xy-preset
priority: p1
profile: implementation
objective: "Lands as feat(synth) on branch feat/p013-xy-audition-target. Adds the audition target to K167's seam in src/js/synth/view/xy-wiring.js (the target interface { owner, output, wire(slot, ctx), unwire(), live(kind, x, y), arm(), release(reason) }, beside documentTarget): a target that sounds a shipped XY preset of the one patch library (tag xy) through the one Studio runtime in a detached-patch mode. The preset is a panel patch (oscillator, filter and envelope nodes and CONTROL edges from the pad's x and y), not a note list, so K149's steps-plan audition cannot sound it; instead the runtime gains one entry that compiles a detached model, plain data that passes the same validate and normalize as the store's model and is never put in the store, under the runtime's claim with owner 'landing' and a riff-id style identity (af's K149 note (b)), on the one AudioEngine and transport. Its nodes count in the runtime's live node census like any other owner's and leave it on release; Stop releases it with every other owner. It writes nothing to the StudioModel, its history, its hash or its dirty flag, and fires no unsaved-work guard; the instrument's live update of the document's own panel never touches or releases the landing's voice, and Stop releases both. 'Open in Synth' inserts the preset into the document as one undoable edit and opens the Synth on it. The four release paths (Stop, leaving the workspace, losing the audio owner, pagehide) are K167's shared mount's, not this target's."
why: "af's critique of the live landing (B2, 2026-11-03): a hero mounted on the document would silently edit the user's saved work. 26 split it out of K167 (2026-11-03) so K167 does not wait on K149's audition mechanism."
