current_state: "Cancelled on 2026-10-18 under this intent's rule that masking and critical bands are built only if the answer to Q001 names them: Q001's decision of 2026-10-18 (option (a), adopt and triage; recorded in Q001's current_state, evidence pending on main) names L001, L002 and L005 as the implementation of sections 89-90 and does not name critical bands, which rests only on a ChatGPT proposal (V2 roadmap item 9) that no owner adopted; ADR 0051's steering (fewer new nouns, measurement is the wedge) argues against adding it unasked. Applied by the planning session working under the coordinating session's delegation of 2026-10-18 ('tak to vse pores'); the owner may override by removing cancelled and asking for it."
objective: "It starts only after Q001 is answered. Critical bands are not in sections 89-90: this issue is built only if the answer to Q001 names them, and is otherwise cancelled with Q001 as the reason. A lesson whose demonstration plays two tones whose separation steps across the equivalent rectangular bandwidth of the centre frequency, by Glasberg and Moore (1990): ERB = 24.7 (4.37 f / 1000 + 1) Hz (about 133 Hz at 1 kHz; Zwicker's critical bandwidth, about 160 Hz there, is named as the other model). The copy follows the literature rather than a single boundary: beats are commonly reported below about 15 Hz of separation, roughness peaks near a quarter of the critical bandwidth (Plomp and Levelt 1965), and two tones are commonly reported as separate somewhat below a full bandwidth. It follows L003 because both add a topic to src/js/data/learn.js and use its two-source demonstration path."
why: "Conversation 6abec18d, 2026-10-01T21:08:07Z (V2 roadmap item 9, a ChatGPT proposal); sections 89-90 do not name it, so only the answer to Q001 can adopt it. The model must be named and the copy kept to what the source supports (critique perception-lessons, critical-band-formula-and-claim)."
