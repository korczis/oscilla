  - "docs/CLAIMS.yaml"
  - ".ai/repo/adrs"
  - "dist"
  - "src/js/audio"
  - "src/js/sequencer"
  - "src/js/studio"
depends_on:
  - "V508"
acceptance_criteria:
  - "The MIDI section lists the access's outputs; none is chosen by default and choosing none sends nothing (tests/unit/midi)."
  - "With an output chosen, Start/Continue/Stop are sent as the transport starts, resumes and stops, and MIDI clock at 24 PPQ is scheduled from the audio clock while it plays, at the tempo of the workspace's transport (unit tests on a fake output and a fake clock; tests/browser/midi.cjs on the stub's output)."
  - "The clock's jitter on the owner's BeatStep Pro is measured with scripts/midi/listen.swift and recorded in docs/midi.md with the command and the numbers."
  - "ADR 0058 records the V510 note; MMC is named as SysEx and left to V511."
validation:
