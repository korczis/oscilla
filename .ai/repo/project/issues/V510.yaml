id: V510
milestone: "M069"
serves:
  - "midi-jam-companion#midi-output-transport"
title: "MIDI output without SysEx: the transport answers on a chosen output (MMC and MIDI clock out), measured on the owner's devices"
slug: midi-output-transport
priority: p1
profile: implementation
objective: "Lands as feat(midi). An output chosen in the MIDI section (the access's outputs, same plain midi permission, sysex: false) receives MIDI realtime Start, Continue and Stop and, while the transport plays, MIDI clock at 24 PPQ scheduled on the audio clock (the Sequencer's tempo in the Sequencer, the Studio's elsewhere, K247); MMC is sent only where its message is plain MIDI and not SysEx (it is SysEx: F0 7F ... F7, so it waits for V511, and this issue says so). No output is chosen by default; choosing none sends nothing. Its jitter against the audio clock is measured on the owner's BeatStep Pro following the clock (scripts/midi/listen.swift) and stated, not assumed."
why: "The owner's order of 2026-11-15 in session cae276ab-2d90-45d2-babb-a1f8023668d2 (Claude Code), verbatim in part: \"pridej sekci midi nastroju\", \"mapping midi, features , protocol ...\", \"napoj cely midi stack\", \"midi instrumenting\", \"dotahni veskere issues souvisejici s midi, napoj na ui, otestuj, vyzkousej, over, ze funguje, ne roubovani, ale realne napoejni , ciste\". V508 makes a controller drive OSCILLA's transport; the reverse, OSCILLA driving a hardware sequencer's transport and tempo, needs only standard realtime messages under the permission OSCILLA already asks for."
current_state: "Planned 2026-11-15 by oscilla-ff; split from MIDI output with oscilla-43 the same day: this issue needs no SysEx (no new consent), V511 carries the SysEx decision. ADR 0058's V508 note says OSCILLA sends no MIDI; this issue's ADR note amends it for realtime output only."
scope:
  - "src/js/midi"
  - "src/index.html"
  - "src/js/ui/catalog/decl/midi.js"
