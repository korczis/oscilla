acceptance_criteria:
  - "tests/unit/correlation-meter.test.mjs, failing on the merge base: the M/S mapping, the correlation zone classifier and the window text computed from fftSize and sampleRate."
  - "tests/browser/labs.cjs: the goniometer mode label switches; the correlation text shows the mono and the stereo state. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Its hosts (correlation meter) move from pending to done in tests/unit/chart-host-census.json as kind meter: role=meter with aria-valuetext that states the value and its unit, rewritten at most 4 times a second, an aria-describedby summary of the window and the estimate, and no keyboard cursor (a meter has no axis to move along); tests/browser/charts-interaction.cjs checks the role, the valuetext and the summary."
  - "Its hosts (goniometer) move from pending to done in tests/unit/chart-host-census.json as kind scatter: role=group with an aria-describedby summary that states the correlation, the width and the window, and a snapshot data table of the last window's L and R RMS, correlation and width; no keyboard cursor, because an X/Y trace has no axis a cursor steps along; tests/browser/charts-interaction.cjs checks the summary and the table."
  - "Levels say dB relative (dBFS-like) unless a valid LevelCalibration applies, every estimate is labelled as one, and no data value is tweened or eased; every readout, tooltip, axis title and caption string it adds is registered in its chart's wording table and passes tests/unit/charts-readout-wording.test.mjs (project.no-fake-science)."
  - "The chart reads existing AnalyserNodes on the main thread only, creates no audio node and adds no work to the audio path; hover and keyboard work runs on events only, a live readout under a still pointer is rewritten at most 4 times a second through the kit's live-readout, and no draw loop writes the DOM per frame (project.audio-engine-discipline v2)."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3) and after F003 placed the card it sits in; no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
  - "The visual references of the phase region of test:visual are re-accepted in darwin-arm64 and linux-x64, in each theme that has references (light ones exist once F011 lands), with the reason \"correlation meter and goniometer grid\" in the pull request body (npm run test:visual)."
  - "scripts/size-report.mjs shows at most 2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
