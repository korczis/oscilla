id: K035
milestone: M062
serves:
  - "playable-instrument#chart-states-honest"
title: "Correlation meter and goniometer with stated window, scale and estimate"
slug: correlation-meter-and-goniometer-with-stated-window-scale-an
priority: p2
profile: implementation
objective: "Lands as feat(charts). Correlation: a canvas bar from -1 to +1 with a zero tick, a thin tick for the instantaneous value and a bar for the value smoothed over tau 0.3 s, labelled \"est., tau 0.3 s, two analysers read in turn\"; a 10 s sparkline from a ring allocated once; negative values use the warning status with an icon and \"out of phase: mono sum cancels\"; role=meter and the correlationDisplay states stay. Goniometer: a Pro button group \"X/Y (L->x, R->y)\" | \"M/S (rotated 45 deg)\", a grid with L, R, M and S axes and the +-1 diagonals, auto-scale stated (\"auto xN\" from liss.scale) with a fixed-scale option, and the window stated from fftSize and sampleRate (\"last 21 ms, 1024 samples\"); optional afterglow off under reduced motion; model mode keeps its label. Neither has an axis a cursor moves along: the meter states its value as aria-valuetext and the goniometer its correlation, width and window in its summary, so it does not claim chart-interaction. src/js/analysis/correlation.js is imported, not edited."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
