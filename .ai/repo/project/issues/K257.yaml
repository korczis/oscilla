depends_on: []
acceptance_criteria:
- "Releasing on blur, visibilitychange to hidden and Escape leaves no held note in src/js/studio/live-notes.js and a node census of 0 after stop, in the same unit test, which injects those window events into the shipped release path (src/js/midi/ui.js, src/js/synth/ui.js) with the Synth armed."
- "(added) Since C050 the shipped release path is the playback bus (src/js/core/output-bus.js stopAll and onStop, reached from the page binder and the key registry's page.escape); the test injects the three events there, and a mutation that drops the binder or the Escape binding fails it."
- "(added) tests/unit/stop-path.test.mjs still proves that no page-level Escape, pagehide or visibilitychange listener stops sound off the bus."
- "(added) Fail-first: the event cases fail on the merge base; the tests/README.md synth-keys row is corrected (no Chord, which K116 owns; the three events through the bus); dist is rebuilt and build:check passes."
validation:
