title: "Blur, a page hide and Escape released as real events through the playback bus in one Keys unit test"
slug: blur-hide-escape-real-events-through-the-bus
priority: p2
profile: implementation
objective: "Lands as fix(synth) or test(synth). The page-hide listener pair inline in src/js/main.js (:706-709 on 8e087873) moves into an importable binder next to the bus (for example bindPageStops({ win, doc, bus }) in src/js/core/output-bus.js), called by main.js with no change in behaviour. synth-keys's AC4 case then dispatches a window blur, a document visibilitychange with hidden true and an Escape keydown through bindPageKeys and createKeyDispatcher, with the Synth armed; each leaves no held note in live-notes.js, the Keys gate closed and a census of 0 after stop. The test fails when the binder or the Escape binding is cut."
why: "Split from K060 (criteria 4, copied verbatim) by the audit-and-stamp follow-up train of 2026-11-18 (oscilla-d9, under the triage the owner approved on 2026-11-18, relayed by oscilla-e5, Q112). Re-run on main 8e087873: only blur is an event in synth-keys (:345); hide and Escape call bus.stopAll directly (:346-347), and visibilitychange is checked only by a regex over main.js (stop-path:110-111). Found by the audit of 2026-11-11 and confirmed here."
current_state: "Filed 2026-11-18 by oscilla-d9 in the audit-and-stamp follow-up train; not started."
scope:
- src/js/main.js
- src/js/core/output-bus.js
- tests/unit/synth-keys.test.mjs
- tests/unit/stop-path.test.mjs
- tests/README.md
