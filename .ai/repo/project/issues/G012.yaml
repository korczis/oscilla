acceptance_criteria:
- "tests/unit/studio-expand-origin.test.mjs fails on the merge base: the expand origin is stored in the history entry, Back's label names it, and a pruned selection is empty, not stale."
- "Definition of done, extends: studioExpand and the ADR 0045 history entries."
- "Definition of done, interlinks: the cockpit, the full Studio and fullscreen are one identity; Back is a declared link (G016)."
- "Definition of done, interactivity: selection and framing follow the user across views."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md states what Open in Studio and Back keep. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'cockpit-identity' in tests/browser/studio-cockpit.cjs selects a node in the cockpit of the Sequencer and of the Playground, opens the Studio by pointer, Enter and a hasTouch tap, waits with until() (deadline 'studio framed', 2 s) for the same selection framed, goes Back and waits (deadline 'back at origin', 2 s) for the origin workspace with the selection kept. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (the template names its flowbite-pro reference.md section), recorded as migrated, never pending; it adds no osc-* class token, no legacy vocabulary use and no selector, removes the legacy ones it replaces, and the domain views' stylesheets gain nothing (compact density is Tailwind utilities on the domain view's own elements); the record's debt falls (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
validation:
- node --test tests/unit/studio-expand-origin.test.mjs
- node tests/browser/studio-cockpit.cjs --only cockpit-identity
- npm test
