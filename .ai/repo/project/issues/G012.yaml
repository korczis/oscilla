id: G012
milestone: M086
serves:
- "component-system#embedded-cockpit"
title: Open in Studio keeps the selection and frames it; Back returns to the workspace it came from with the cockpit as it was
slug: open-in-studio-keeps-the-selection-and-frames-it-back-return
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). P4 slice B (cross-view identity) for the cockpit, and links.md P8: today Expand from the Sequencer and Back drop the user in the Playground, and nothing asserts that the selection survives. studioExpand records the workspace it was called from; the full Studio opens with the store's selection and frames the selected nodes (or keeps its stored viewport when nothing is selected); Back reads '< Sequencer' or '< Playground' and returns there with the cockpit's scroll position and selection kept; browser fullscreen of either view keeps them too, or states FULLSCREEN_BLOCKED. A card's double-click and Enter do the same for that node. When V632 is on main this slice extends its view-identity check instead of adding a second one. Before: VERIFIED one-way (links.md P8); UNKNOWN identity. After: asserted identity across Open, Back and fullscreen. Negative cases: the selected node deleted in the full Studio (pruned, not stale), Back after a reload (the origin is in the history entry's state, not in memory), fullscreen refused. Rollback: revert."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
