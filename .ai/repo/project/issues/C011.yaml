id: C011
milestone: M090
serves:
  - "coherent-state#live-edits-reach-the-voice"
title: "Safety limits reach what sounds: a lower hard limit shortens the sounding note, a sequencer loop stops at the programmed cap"
slug: safety-limits-reach-what-sounds-a-lower-hard-limit-shortens
priority: p1
profile: implementation
objective: "Lands as fix(audio). Findings dead-controls-4 and coupling-4. setSafetyLimit only writes this.safetyLimit and the limit is fixed at play: lowering 5 s to 0.5 s while a trigger or held note sounds leaves it alive at 1.6 s, although the control's help says the finite tone and trigger stop after N s. The sequencer Loop repeats with 'Allow continuous playback' off (still playing after 5.5 s of audio clock with a 0.5 s limit), against README Safety, the Help dialog and accepted ADR 0005, which keeps sequences to their programmed end of at most MAX_PROGRAMMED_S (30 s). Add engine.tightenLimit(limitS), mirroring revokeContinuous: for each live voice the limit governs (hold, trigger, the finite tone; not programmed patterns, not extended voices) newEnd = v.t0 + limitS, applied only when earlier than the current end; lower v.opts.limitS and v.deadline, release at once when newEnd is past or inside the schedule lead, else schedule the release on the untouched output-stage gain at newEnd, re-stop the sources, update endTime and re-arm the timers; never edit env or eg (V249), never extend. setSafetyLimit calls it when the value drops and continuous is off. For the sequencer, the adapter passes a read-only continuousAllowed(); while it is false _pump schedules no pass that would end past MAX_PROGRAMMED_S since play() and ends with the click-free stop and a stated reason ('Loop stopped at 30 s: allow continuous playback to loop until stopped'); withdrawing the permission stops a loop past the cap. The loop flag in the model is never rewritten (an imported loop:true is capped, not changed), Loop stays usable with the cap in its title, and the Device & Limits help names the loop cap. The Studio transport loop is not changed here."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
