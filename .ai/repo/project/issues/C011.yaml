acceptance_criteria:
  - "A unit test with a fake clock: with the permission off the loop schedules no pass ending past 30 s and stops with the stated reason, with it on it continues, and an imported loop:true sequence is capped the same way; it fails on the merge base."
  - "Browser check `limit-tightens-live` in tests/browser/engine-v1port.cjs: a 5000 ms trigger with the limit lowered to 0.5 s about 100 ms in ends within release + 50 ms of t0 + 0.5 s on the audio clock; raising the limit again does not extend it."
  - "Browser check `seq-loop-cap` in tests/browser/sequencer.cjs: with the permission off the last pass the editor has scheduled ends at or before t0 + 30 s, read from the editor's schedule without waiting 30 s, and the reason is on the Loop control."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "engine.activeNodeCount returns to 0 after every stop in the new checks, in Chromium, Firefox and WebKit (project.audio-engine-discipline v2)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/audio/audio-engine.js (project.review-verdict); the builder never writes it."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
