id: E046
milestone: M046
serves:
  - "engineering-integrity#main-red-shows"
title: "Main checks run every gate job on main's merged tree and gate the release on it"
slug: main-checks-run-every-gate-job-on-mains-merged-tree
priority: p1
profile: implementation
objective: "Lands as fix(ci). Hardening gap 5: branch protection is strict false (release-flow-complete.v1.md:217), and .github/workflows/main-checks.yml:9-18 runs only the unit, knowledge and browser jobs and does not gate: engine, suites (DSP, labs, sequencer), measure, studio, visual and census never run on main's combined tree. Two pull requests green alone can merge into a red main that nothing reports until a release. After: main-checks runs every job of the pull request gate's needs that is not PR-only (fail-first, review-verdict and changes are PR-only), with the same bounds and pins (project.ci-bounded); its summary names each failed job; and release:prepare refuses while the latest main-checks run of the commit it prepares is not green. Line numbers at origin/main a19f1ff6. This reverses the CI-minutes choice main-checks.yml:15-18 records (the V1 engine, DSP/labs/sequencer, MEASURE, Studio and visual jobs left to the pull request gate), so the pull request records the reversal with majordomus decision before the workflow changes, citing those lines and the minutes its own first main-checks run costs, and rewrites the header comment with it. Differences from ci.yml, named in the test: main-checks has no changes job, so its copies of the jobs that need changes (engine, suites, measure, studio, browser and visual: ci.yml:138, :181, :233, :276, :317, :402) run unconditionally on main; flake-ledger (ci.yml:603-636) reads a pull request run's attempts and is PR-only, like fail-first and review-verdict. The prepare check is bounded: it reads the run with gh at most 3 times 10 s apart and, while the run is queued or in progress, waits at most 15 minutes before refusing with the run's URL. Order: after PR #417 (open, ci/census-path-gated), which changes main-checks.yml and tests/unit/main-checks.test.mjs, and beside R032, which also changes scripts/release-prepare.mjs; whichever lands second rebases."
why: "af's Hardening proof-chain synthesis, findings 5-6 and smallest slice 9; af's critique B2 (mesh, 2026-11-05): 'main-checks never runs engine/suites/measure/studio/visual/census on main and does not gate'. af's critique of 96daa67b (AMEND 23): no decision record for the reversal, the needs: changes difference and flake-ledger unnamed, the prepare gate unbounded, no order against R032, and engineering-integrity#main-red-shows stale (updated in the same plan change)."
scope:
  - ".github/workflows/main-checks.yml"
  - "tests/unit/main-checks.test.mjs"
  - "scripts/release-prepare.mjs"
  - "tests/unit/release-prepare.test.mjs"
  - "tests/README.md"
depends_on: []
acceptance_criteria:
  - "Fail-first: tests/unit/main-checks.test.mjs asserts main-checks covers every job in ci.yml's gate needs that is not PR-only; it fails on the merge base naming engine, suites, measure, studio, visual and census."
  - "Every added job is bounded, pinned and retried as tests/unit/ci-workflows.test.mjs requires; the test names the two differences (no changes job, flake-ledger PR-only) and fails on any other."
  - "The reversal is recorded (majordomus decision) before the workflow change, and main-checks.yml's header comment cites it."
  - "release:prepare exits non-zero with a message naming the run when the latest main-checks run for its commit is not success, and after at most 15 minutes when it is still running; a fixture test with a fake gh proves both."
  - "Guarded (.github/*, scripts/release-*, tests/unit/release-*): prismatic-majordomus-98 writes the verdict. Lane: oscilla-b0."
validation:
  - "node --test tests/unit/main-checks.test.mjs tests/unit/ci-workflows.test.mjs tests/unit/release-prepare.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
