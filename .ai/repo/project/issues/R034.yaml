id: R034
milestone: M011
serves:
  - "release-provenance#public-release-verified"
title: "release:publish uploads and verifies the committed bytes, not the working tree read up to 90 minutes after the clean check"
slug: release-publish-uploads-and-verifies-the-committed-bytes
priority: p1
profile: implementation
objective: "Lands as fix(release). Hardening D2 (P2, observed). Line numbers at origin/main a19f1ff6. The tree is checked clean only at the start (scripts/release-publish.mjs:418, 427); verify-deploy runs at :585 and the asset is uploaded at :606, with three waits of up to 30 minutes each between them (:146, :510-570). verify-deploy also reads the checkout, not the commit: readVersion(root) at scripts/verify-deploy.mjs:259, computeSourceDigest(root) at :268 and dist/index.html at :270. A tree modified mid-publish reaches the Release and is what the live page is compared with. After: immediately before verify-deploy and again before the upload, publish re-asserts that the working tree is clean and HEAD is the commit it checked at the start (git status --porcelain empty, git rev-parse HEAD unchanged), and refuses naming what changed; the upload reads dist/index.html with git show <commit>:dist/index.html. Making verify-deploy itself read version, digest and dist from the commit is R039's --strict mode, not this issue's, so the two do not overlap."
why: "af's Hardening proof-chain synthesis, defect D2 and smallest slice 5. The same synthesis refuted and dropped four release-chain findings of the Hardening pack, so none is planned: the receipt does bind the dist bytes (tree equality, release-ci-receipt.mjs:79-84, and distSha256 at release-prepare.mjs:136); verify-deploy compares bytes, hash, commit and digest, not only the version; the scripted flow writes the record after verification; and path-gated skips on a release pull request fail closed. D1 (the receipt refusing a first-attempt skipped flake-ledger job) is carried by open PR #417, a pull request and not a plan id; R037 holds on it. af's critique of 96daa67b (AMEND 5): verify-deploy reads the checkout too (verify-deploy.mjs:259, 268), and the earlier criterion 2 duplicated R039."
scope:
  - "scripts/release-publish.mjs"
  - "scripts/verify-deploy.mjs"
  - "tests/unit/release-publish.test.mjs"
depends_on: []
acceptance_criteria:
  - "Fail-first: tests/unit/release-publish.test.mjs runs publish with a fake 'gh run watch' that rewrites dist/index.html and asserts that publish refuses or that the uploaded bytes equal git show HEAD:dist/index.html; it fails on the merge base."
  - "A fake 'gh run watch' that leaves dist/index.html unchanged but moves HEAD (a commit made mid-publish) makes publish refuse before verify-deploy runs, naming both commits; a clean, unchanged tree publishes as today."
  - "verify-deploy's own reads (verify-deploy.mjs:259, 268, 270) are not changed here; R039 makes them read the commit under --strict, and this issue's test does not assert them."
  - "Guarded (scripts/release-*, scripts/verify-deploy.mjs, tests/unit/release-*): prismatic-majordomus-98 writes the verdict. Lane: oscilla-b0."
validation:
  - "node --test tests/unit/release-publish.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
created_at: 2026-11-05
updated_at: 2026-11-05
