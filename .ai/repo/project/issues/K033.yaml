acceptance_criteria:
  - "Unit tests that fail on the merge base: the index to dB round trip within half a step; out-of-range levels read as bounds; a theme change keeps the history; a range change recolours without clearing; the history readout states its age and quantization."
  - "tests/browser/labs.cjs: a tone row survives a theme toggle (polled getImageData on the ring row) and a range change recolours it; the colour-key ticks equal minDb and maxDb after a range change. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Its chart hosts (analysis-panel spectrogram, analysis-tab spectrogram, mic spectrogram) move from pending to done in tests/unit/chart-host-census.json, each carrying data-osc-chart, and the table-driven pass of tests/browser/charts-interaction.cjs holds for each: the host is role=group holding the aria-describedby summary and the snapshot data table, and its focusable plot surface is role=application with aria-roledescription \"interactive chart\" (never role=img), both asserted in the accessibility tree, with a visible focus ring; ArrowRight moves the cursor one step and the one polite live region announces the readout once after the keys settle; Escape clears the cursor and still reaches the page's stop (a playing tone stops); Space keeps its workspace meaning (SPACE_MEANING of src/js/ui/shortcuts.js) and is never taken (ADR 0050); on a touch pointer a tap pins the cursor and it stays after the finger lifts. ArrowUp and ArrowDown move the row."
  - "Levels say dB relative (dBFS-like) unless a valid LevelCalibration applies, every estimate is labelled as one, and no data value is tweened or eased; every readout, tooltip, axis title and caption string it adds is registered in its chart's wording table and passes tests/unit/charts-readout-wording.test.mjs (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/analysis is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3) and after F006 placed the card it sits in; no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs). The canvas colour key is a domain visual inside the card."
  - "Every osc-* use it removes leaves the record in the same change: tests/unit/ui-flowbite-pro-baseline.json is rewritten by node scripts/ui-flowbite-pro-record.mjs (the static colour-key tick markup leaves (<ol class=\"osc-colorbar-ticks\"> at index.html:632 on main), and, if the canvas key replaces the CSS bar div at index.html:630, its osc-colorbar and osc-h-colorbar uses too), and a selector left without a producer is deleted from src/styles/instrument.css (.osc-colorbar-ticks, :867 on main), and with the bar div src/styles/components.css (.osc-colorbar, :675), src/styles/charts.css and src/styles/integration.css (.osc-h-colorbar, :29 and :612) (tests/unit/css-producers.test.mjs); the pull request states by how much the debt fell."
  - "The visual references of the spectrogram regions of test:visual are re-accepted in darwin-arm64 and linux-x64, in each theme that has references (light ones exist once F011 lands), with the reason \"LUT recompose and generated colour keys\" in the pull request body (npm run test:visual)."
  - "scripts/size-report.mjs shows at most 2.5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
