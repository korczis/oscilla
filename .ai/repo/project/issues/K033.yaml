title: "Spectrogram history as levels, keyboard readout, generated colour keys and theme recolour"
slug: spectrogram-history-as-levels-keyboard-readout-generated-col
priority: p2
profile: implementation
objective: "Lands as feat(analysis). The renderer stores a Uint8 level index per device pixel over a fixed -150 to +10 dB range (about 0.63 dB per step) and applies colour at compose time through the LUT of K027, monotonic in L* in both themes. A theme change recolours the history instead of clearing it, which retires the theme case of K015 F1; floor and ceiling become a LUT window set by a Pro range slider with a number input (the form base styles F002 turns on) or by dragging the colour key, recoloured in one LUT pass at the event. The readout works on any column with its age (\"-3.2 s\") and says \"quantized +-0.3 dB\" for history columns; a level outside the stored range reads \"<= -150 dB rel\" or \">= +10 dB rel\", never the end value; the newest column keeps K015's exact float. K015 F5: the kit's keyboard row and column cursor with the announced readout. All three spectrogram hosts (analysis panel, analysis tab, mic) get a canvas colour key whose ticks come from minDb and maxDb, replacing the static tick markup in src/index.html, and the analysis-tab spectrogram is wired to theme events through src/js/charts/wire.js; each spectrogram view subscribes to the frame loop with its host. Orientation is a compose-time choice that follows the time-down view K025 lands first (K025 no longer waits on this slice). Memory is W x H bytes, 0.17-0.66 MB per instance, stated in the pull request. The plain spectrogram does not zoom in frequency (OD11 resolved as out of scope)."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
