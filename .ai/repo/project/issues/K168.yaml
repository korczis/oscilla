title: "The graph summary is structured: one path per line, collapsible groups, every node a link that selects it, the unconnected flagged with a fix"
slug: the-graph-summary-is-structured-one-path-per-line-collapsible-groups
priority: p1
profile: implementation
objective: "Lands as feat(studio). Owner defect of 2026-11-03 (relayed by prismatic-majordomus-1d and oscilla-b0): on a 26-node patch the Studio Inspector's graph summary is one prose line that truncates ('through 5 more nodes', 'and 2 more', 'and 6 more'). src/js/studio/a11y.js gains summarizeGraphModel(model, { registry }) -> { counts, sections: [{ id: 'signal' | 'unconnected' | 'modulation' | 'triggers' | 'analysis' | 'measurement', items }] }, every item listing its nodes as { id, name } and its edges by id, with no truncation; summarizeGraph becomes the bounded sentence projection of that same model (the screen-reader summary of spec section 249 keeps its bounds, section 250), so there is one derivation and two renderings. The Inspector's Studio card (src/js/ui/studio/inspector.js) renders the model as collapsible groups (the Flowbite Pro accordion), one path per line, each node a button that selects the node in the graph and frames and focuses it (the one selection of the store, as Find node does), long groups shown in full on demand rather than cut; a sounding node that reaches no output is flagged in the Not connected group with a fix action that opens the connection list for its output port (the existing patch-to target list), never patching on its own. Before: one truncated line. After: a structured, navigable summary derived from the graph."
why: "Owner defect of 2026-11-03 on https://korczis.github.io/oscilla/#m=studio (the summary of a 26-node patch read as one line with 'through N more' and 'and N more'), relayed by prismatic-majordomus-1d and assigned to oscilla-26's Studio lane by oscilla-b0; the owner's standing orders of the day ask for every view ergonomic, connected, derived and responsive."
scope:
