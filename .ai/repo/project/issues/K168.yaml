depends_on: []
acceptance_criteria:
  - "tests/unit/studio-graph-summary.test.mjs, failing on the merge base (summarizeGraphModel does not exist): on the reference templates and on a 26-node fixture shaped like the owner's patch, every signal path to the Master Output is one item with all its nodes in order (no 'more'), every sounding node that reaches no output is in the unconnected group, every CONTROL, TRIGGER, TAP and ANALYSIS edge is in its group once, and summarizeGraph's text equals its bounded projection of the same model (the existing a11y tests unchanged)."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: an empty graph, a graph with no Master Output, a cycle-free graph whose only path is muted, and a node named with markup (rendered as text, never HTML)."
  - "A browser check 'graph-summary' in tests/browser/v31-studio-graph.cjs, failing on the merge base: on a 26-node patch the Inspector shows the groups as an accordion with one line per path; Enter on a node's button selects that node in the graph and moves focus to it (the graph's selection and the Inspector agree); the unconnected node's fix action opens the connection list of its output port and patches nothing until a target is chosen; at 390 px the groups stay readable with no horizontal scroll. Waits through tests/browser/lib/wait.cjs until() with a named deadline, inside tests/browser/lib/suite.cjs, assuming no sample rate (project.suite-harness, project.bounded-test-timing)."
  - "One derivation: no file but a11y.js computes the paths or groups; the Inspector and the screen-reader sentence read summarizeGraphModel (a unit test greps the sources)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a feat change, a unit test that fails on the merge base (project.fail-first). Its chrome is the Flowbite Pro accordion and buttons, with no osc-* class token, legacy selector, inline style or stylesheet (project.ui-uses-flowbite-pro; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/studio-graph-summary.test.mjs"
  - "node tests/browser/v31-studio-graph.cjs --only graph-summary"
  - "npm test"
evidence_required:
