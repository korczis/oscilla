title: "On a short desktop window the Synth's Panel keeps 292 px of docked keys and leaves its content about 100 px"
slug: on-a-short-desktop-window-the-synth-panel-keeps-little-room
priority: p3
profile: implementation
objective: "Lands as fix(ui). Found by oscilla-c3's review of U100 (R2-U100-3, 2026-11-09): U100 keeps the Synth's docked keys on its Panel tab at every size (keepsDock, keptBy), because there the keys are the instrument; on a short desktop window (1366 x 650, the viewport a 1366 x 768 laptop gives) the Panel keeps 292 px of keys and leaves about 101 px between the page header and the dock. The coordinator oscilla-43 kept the keys docked on the desktop Panel and asked for this follow-up rather than a change inside U100. Before: on a short desktop window the Panel's knobs scroll in a strip about 100 px tall. After: a decision and a fix for the desktop short-window room (a lower dock on a fine pointer, a dock that folds where the computer keys play, or a recorded acceptance), with a check at 1366 x 650. Rollback: revert."
why: "The phone-whole criterion and the owner's order of 2026-11-04 (no control hidden under another) apply to the desktop's short windows as well; U100 fixed the phones only, by its scope."
current_state: "Filed 2026-11-09 from U100's review. Decided by the coordinator oscilla-43 on 2026-11-10, verbatim: “On a fine pointer, when the window is shorter than 760 px, the Synth's Panel folds its docked keys to a one-row strip with a toggle (Czech label 'Klávesy', aria-expanded), because on a desktop the computer keys play the notes; expanding it restores U100's dock. Phones and coarse pointers keep U100 exactly as it is.” Built by oscilla-04 in task t-20261110043151-bede on fix/u101-short-desktop-dock from main a7102358: routes.js keepsRoom.keptFineBelow (SYNTH_KEPT_FINE_BELOW_PX 760) read by roomFolds with the measured pointer (dock-yield.js measureRoom: (pointer: fine)); the dock's handle is that strip, labelled Klávesy."
scope:
  - "src/js/midi"
  - "src/js/ui"
  - "src/styles"
  - "tests/browser/ui-current.cjs"
depends_on:
  - U100
acceptance_criteria:
  - "The decision on the desktop short-window room is recorded in this issue in the owner's or the coordinator's words, with its reason."
  - "Decision criterion (oscilla-43, 2026-11-10, verbatim): “On a fine pointer, when the window is shorter than 760 px, the Synth's Panel folds its docked keys to a one-row strip with a toggle (Czech label 'Klávesy', aria-expanded), because on a desktop the computer keys play the notes; expanding it restores U100's dock. Phones and coarse pointers keep U100 exactly as it is.” ui-current.cjs desktop-short-synth-panel asserts it at 1366 x 650: the toggle expands the full dock, and a computer key sounds a note with the keys folded."
  - "Fail-first: a ui-current.cjs check at 1366 x 650 (a fine pointer) opens #m=synth and finds what the decision states (for example at least three 44 px rows of the Panel's content between the page header and the dock); on the merge base it fails."
  - "The Panel's keys stay playable as U100 left them on phones (phone-synth-panel-keys-320 and -375 stay green)."
