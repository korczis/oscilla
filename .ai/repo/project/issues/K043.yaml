id: K043
milestone: M062
serves:
  - "playable-instrument#chart-interaction"
title: "Filter lab chart: exact hover response, -3 dB markers, keyboard control, no wheel trap"
slug: filter-lab-chart-exact-hover-response-3-db-markers-keyboard
priority: p2
profile: implementation
objective: "Lands as feat(charts). filter-chart.js gets the kit's crosshair with a readout \"1.00 kHz . -3.0 dB gain\" from getResponse evaluated with 1-element arrays at the exact cursor frequency, not the nearest of 256 samples; interpolated -3 dB markers for low-, high- and band-pass labelled as approximate; a low-alpha pass-band fill; a dashed curve and a flat 0 dB line labelled \"bypassed\" when bypassed, the bypassed trace (alpha 0.45 on main, 1.8-2.3:1) drawn in a faded colour registered in K027's palette at 3:1 in both themes; the caption \"computed response (getFrequencyResponse)\". The wheel never changes Q unless Alt is held, whether the chart is focused or not, so clicking a handle and then scrolling scrolls the page (filter-chart.js:192-197 changes Q on every wheel today); the wheel policy is K052's. The focused host moves the cutoff by 1/12 octave with left and right and Q with up and down, the readout follows and is announced through the kit; Escape propagates. Handle hit area 12 px (22 px for coarse pointers); a drag chip \"fc . Q\". Gestures emit onPreview and onCommit beside onChange (lab behaviour unchanged), which K048 uses."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
