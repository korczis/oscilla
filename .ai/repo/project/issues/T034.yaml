objective: "Lands as test(measure). Hardening S7, first and third findings; tests only. At main 68b117f3, on device loss track.onended reports MIC_DISCONNECTED, which interrupts and releases (src/js/measurement/capture.js:1040-1042, :610); removing line 610 fails no test, and no test dispatches track-ended. Removing stopStreamTracks(stream) from the microphone close() (:1035) passes every unit test; the only deciding check is in the browser (v3-measure.cjs:772), and abort-stages runs on loopback, where openTrackCount is always 0. After: a unit test on the captureRig fixture (as tests/unit/preflight-own-output.test.mjs:66 builds it) opens the live tap, fires track.onended and asserts activeNodeCount 0, openTrackCount 0, liveTapOpen false and a pending capture rejected with MIC_DISCONNECTED; a second asserts every fake track is readyState 'ended' after cancel() and after an abort while a capture is pending."
why: "oscilla-b0's hardening audit of origin/main 68b117f3 (v3.19.0), synthesis S7. C033 ('MEASURE emits its stimulus') sits next to it and is not duplicated."
