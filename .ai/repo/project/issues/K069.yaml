id: K069
milestone: M065
serves:
  - "connected-instrument#step-sequencer"
title: "Step grid editor with clear playback and full keyboard operation"
slug: step-grid-editor-with-clear-playback-and-full-keyboard-opera
priority: p1
profile: implementation
objective: "Lands as feat(synth). The sequencer card of the Synth workspace: one row per track with variable length, a role=grid with roving tabindex (arrows move, Enter toggles, Shift+arrows selects a range, Ctrl/Cmd+C, X, V copy, cut, paste, Delete clears, A accent, S slide, 1-4 ratchet, PageUp/PageDown a semitone, with Shift an octave; Space stays the transport), a detail row of knobs for the focused step (note, gate, velocity, probability, ratchet) and pattern controls (length, division, swing, scale, root). The playing step is highlighted from transport.playhead() by a frame-loop subscriber that writes the DOM only on a step change. Every edit is one CLIP_UPDATE. Before: steps can be edited only as data. After: a keyboard-operable grid with the playing step highlighted. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it. Merged plan of the component follow-up (2026-10-30): The grid is W008's step-grid kind; no second grid model."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
