acceptance_criteria:
- "Before: VERIFIED on int/train-3 at efc2794f (2026-11-03). L (graph-commands.js tidy) places compactLayout's longest-path columns and first-upstream rows 240 apart, each row 48 below the tallest card above; it ignores port order and never reorders a column. Measured by the anchor-to-anchor straight-segment count: 0 crossings on the 7 templates, 2 526 on the 100-node / 200-cable fixture and 23 347 on a 300-node / 600-cable scale-up; it is always one strip, so on 390x844 no template fits at the coarse fit floor (about 0.92)."
- "After: L places the cards by tidyLayout: 0 crossings and no overlapping boxes on every template unwrapped and on 1536x1024; at most 1 crossing and no overlap on 390x844; strictly fewer crossings than the K009 tidy on the 100- and 300-node graphs (1 353 and 12 286, about half); rows only below the 0.92 fit zoom, and then at a larger fit zoom and never with more crossings than the strip."
- "Invariants (ADR 0087): the layout runs only on the explicit L (nothing else in src/js calls tidyLayout); one Tidy is one NODE_MOVE history entry labelled 'Tidy the graph', undone exactly; it never writes the model; positions are presentation state, so studioHash is unchanged by a Tidy (NODE_MOVE changes presentationState, never executionState); the look is unchanged (no class, selector, markup or style)."
- "Negative cases: an empty graph returns no positions and L says the graph is empty; a single node stays at its snapped corner; a graph that already fits the viewport is not wrapped, and a portrait graph (the 100-node fixture on a phone) stays one strip; a hidden graph (viewport 0 x 0) is never wrapped; the demo song stays one strip on the phone, because its rows would cross 5 cables; the shipped templates keep their authored positions (a stored phone-wrapped layout made the desktop Subtractive Synth one column at 33 % zoom, ADR 0087); a second L on a tidy graph adds no history entry and says so; an unmeasured card takes the CSS geometry."
- "Rollback: revert the merge commit. Nothing changes the schema, a studioHash or a stored record; documents tidied while it was live keep their positions, which are ordinary presentation state."
- "tests/unit/studio-graph-layout.test.mjs, failing on the merge base (graph-layout.js has no tidyLayout there): every row of After, the invariants and the negative cases above, determinism and the grid, the registry's port order, and the CPU time of 100 and 300 nodes within one frame (PERF_BUDGETS.dispatchMove) on the E029 clock (cpuMs of tests/unit/fixtures/v31-large-studio.mjs, fastest repeat, re-measured up to a wall-clock deadline)."
- "Definition of done, extends: K009's L (one NODE_MOVE gesture, one store hold) and the §150 rule that automatic layout never moves a user graph without an explicit action."
- "Definition of done, cross-links: the minimap, find (/) and Frame all read the new positions as any NODE_MOVE; V614's Shift+L builds on tidyLayout; the compact Studio keeps compactLayout."
- "Definition of done, dynamics: the boxes move in one frame as one gesture; the announcement names the rows when it wraps."
- "Definition of done, docs and routes: docs/v31/user-guide.md (the L bullet and the shortcut row, equal to STUDIO_SHORTCUTS), .ai/repo/features/studio-signal-graph.md (cites ADR 0087), ADR 0087 and the ADR index; tests/README.md has a row for the new test and the changed rows; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: the check 'tidy-layout' of tests/browser/v31-studio-graph.cjs presses L on the demo song at 1536x1024 and in a 390x844 hasTouch context, waits with until() (named deadlines) until the model and the drawn cards agree, asserts one history entry, no two drawn boxes overlapping and rows on the phone, then presses Undo and waits until every position is restored; on the merge base the phone announces no rows and the check fails. It runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until(), assumes no sample rate and adds nothing to tests/browser/timing-baseline.json (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
- "Its paths are not guarded (scripts/review-verdict.mjs --content --list on the branch), so no verdict is needed; as a feat change its unit test fails on the merge base (project.fail-first)."
- "Wave 1: it adds no class token, selector, markup surface or inline style, so the Flowbite Pro record does not change (node scripts/ui-flowbite-pro-record.mjs --check; node --test tests/unit/ui-flowbite-pro.test.mjs); no visual reference presses L, so the visual gate is unchanged."
- "scripts/size-report.mjs shows about 1.4 KB gzip added, within the owner's dist budget of 1 200 000 B gzip and the 35 KB ceiling of this line (project.single-file-deliverable); every touched source file stays under its source-size cap."
