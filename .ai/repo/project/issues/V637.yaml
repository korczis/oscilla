id: V637
milestone: M080
serves:
- "studio-box-system#find-and-layout"
title: "Tidy (L) lays the graph out in layers with the fewest crossings, and wraps into rows only where the graph does not fit"
slug: tidy-l-lays-the-graph-out-in-layers-with-the-fewest-crossings
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). The owner's order of 2026-11-03 on the Studio graph (quoted in ADR 0087): fewest crossings, ergonomics first, mobile first, multi-line, better than now and no step back. L stops placing compactLayout's columns and rows (K009's tidyPositions, deleted) and places the cards by tidyLayout in src/js/ui/studio/graph-layout.js, pure: longest-path layers, barycentric crossing reduction on the port anchors in the registry's port order (def.inputs, def.outputs), coordinates from the cards as the editor measured them (height and anchors; the CSS geometry, port rows from y 49 at 16 px on a 168-wide card, when a card is not drawn), and, only when the unwrapped Frame-all zoom on the graph viewport is below COARSE_FIT_MIN_ZOOM (24/26, about 0.92), a wrap of consecutive layers into rows cut where the fewest cables span, taken only when the rows fit at a larger zoom and cross no more cables than the strip. graph-editor.js hands the command the measured cards and the viewport size; the command stays one NODE_MOVE gesture and says how many rows it made. compactLayout stays (the compact Studio uses it). The decision, the measurements and the rejected libraries (elkjs 450.6 KB, dagre 16.7 KB, d3-dag 29.1 KB, cytoscape breadthfirst) are ADR 0087. Why not K009 or V618: K009 (M057, playable-instrument) carries verified evidence for the compactLayout tidy on commit 32b439e6 and its criterion 'deterministic against compactLayout fixtures' would no longer describe main, so extending it would rewrite a recorded fact; V618 is the large-graph frame cost (culling, minimap, BATCH), not placement. V614's tidy-selection (Shift+L) builds on tidyLayout."
why: "Owner order of 2026-11-03 on the Studio graph, verbatim: \"optimalizuj rendering krabicek a propojeni ... minimum krizeni, ergo first, mobile first\"; \"generic, dynamic, derived, inferred, lepsi nez ted, zadny kroky zpet\"; \"grafika je nyni pekna, layout zly, interaktivita muze byt lepsi\"; \"multiline\". The layout spike of the same day measured five candidates on origin/main 117c755c (ADR 0087's table)."
