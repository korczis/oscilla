objective: "P04 slice E (compile and playback). Lands as feat(studio), as Q032 decides. 'Listen here' on a box or cable routes that output through the probe tap (V616) to the output chain in place of the Master's input, inside the engine's accounting and under the output ceiling, as an explicit ephemeral live preview (§80): a Pro alert banner names what is heard, Escape, Stop, any model edit or leaving the Studio ends it; nothing enters the model, history, studioHash, provenance or an export."
