title: "A tap always sounds: the shared note path holds a gate open for a stated minimum"
slug: a-tap-always-sounds-the-shared-note-path-holds-a-gate-open
priority: p0
profile: implementation
objective: "Lands as fix(audio) with or right after K178 (dev-53's one keys path), on the one note/gate path every player shares, never per surface. When a touchstart and its touchend (or a pointerdown and pointerup, a key down and up, a MIDI on and off) are handled in the same task, the gate opens and closes at the same audio time and the tap is silent: 26 found it on the XY pad under K171 (Playwright touchscreen.tap does it about 1 run in 10, and a fast real tap can), a violation of project.a-phone-sounds. After: an off scheduled at or before its on plus a stated minimum gate (one constant, in seconds, in the shared note path, documented with its reason) is deferred to that minimum; a longer note is unchanged; the release envelope runs from the deferred off; the voice census is 0 after it ends."
why: "Relayed by oscilla-b0 and dev-53 to af on 2026-11-05 from oscilla-26's K171 finding; filed by af as the owner of the playback map (C030-C034, K180-K183). The fix belongs to the one playback owner so the Synth keys, the on-screen and computer keyboards, the XY pad, the drum pads and MIDI all inherit it."
