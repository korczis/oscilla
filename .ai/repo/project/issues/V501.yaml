current_state: "Updated 2026-10-18. Depends on P005 (and through it P003) because they edit src/index.html (scope conflicts in the same wave, simulated 2026-10-18), and on V500, which records the two decisions this issue must not start without: the test seam that stands in for MIDI hardware in the gate, and which ADR 0052 kind it is (critique midi-jam-companion finding no-hardware-test-seam-undecided), and the full support-state table with the cause and copy of each state (finding permission-prompt-and-state-taxonomy). Both findings are blocking and are planned against V500, so majordomus plan ready does not list this issue until V500 is done. The scope names only MIDI paths plus the integration files the criteria need (src/js/main.js to compose the module, src/index.html for the stated support state), so that majordomus intent realization does not infer unrelated earlier work as realising this intent (audit finding main-plan F9, 2026-10-18). tests/browser/midi.cjs is the one browser suite the M045 issues share; package.json wires it into the release gate. dist is in scope because every src change commits the rebuilt dist/index.html, and tests/README.md because tests/browser/midi.cjs skips in WebKit (no Web MIDI) and tests/unit/browser-suite-contract.test.mjs fails a skip tests/README.md does not declare; V502-V505 carry both for the same reasons (V504 also src/styles/main.css, which @imports src/styles/midi.css)."
