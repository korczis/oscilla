acceptance_criteria:
  - "Fail-first fixture: tests/unit/readout-states-filter-chart.test.mjs plus labs.cjs checks: low-pass 2.5 kHz Q 30 → offScaleHigh with 29.5 dB, equal to getFrequencyResponse at display precision; peaking Q 1 +24 dB → 24.0 dB; a chart mounted with enabled false and getNote \"model @ 48 kHz\" shows both strings; band-pass shows \"Centre\". Fails on the merge base."
  - "Negative cases, each asserted: The default Butterworth shows no marker; a live stage shows BYPASSED alone; the -30..+17 dB reference range is unchanged (visual lock); the Studio Filter node label unchanged."
  - "Revertible on its own: Revert: chart overlay, note and label."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
