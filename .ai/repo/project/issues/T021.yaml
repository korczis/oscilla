title: "The Filter Lab chart marks off-scale responses, keeps the model-rate note when bypassed, and names the frequency for each type"
slug: the-filter-lab-chart-marks-off-scale-responses-keeps-the-mod
priority: p2
profile: implementation
objective: "Truth-table rows LAB-02, LAB-03, LAB-04, LAB-13 (scratchpad p05/truth-table.md). Above +17 dB (or below the floor at a notch) the chart draws a caret at the edge with the true value from getResponse and draws the handle as an edge marker; getData() reports offScaleHigh and the value. Bypassed keeps the model-rate note beside the K043 bypassed label: \"BYPASSED · model @ 48 kHz\". The label reads Cutoff for low- and high-pass and Centre otherwise (Filter Lab only; the Studio label is left alone). The gain shows its value."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): Low-pass Q 30 is +29.54 dB at the cutoff and peaking +24 dB is +24.00 dB, but the plot stops at +17 dB with the handle pinned to the edge and no marker. In the default state (filter off, no context) \"BYPASSED\" replaces \"model @ 48 kHz\", so the curve computed at an assumed rate is not labelled. The field says \"Cutoff\" for band-pass, notch and peaking, where it is the centre. The peaking gain has no visible value."
