acceptance_criteria:
  - "tests/unit/measure-readouts.test.mjs, failing on the merge base: irReadoutAt gives sample text undecimated and column text decimated; the overlay readoutAt carries the resampled flag and \"NOT MEASURED\" in gaps; the RTA band-edge formatter; a live frame under a still cursor refreshes the band text within the live-readout bound."
  - "tests/browser/v3-ui.cjs: hovering grid point i makes the chip text equal view.readout(i).lines; ArrowRight moves exactly one index; pointer moves within one index cause no extra Alpine write; the IR chart has a readout; with a measurement running, Escape on a focused MEASURE chart aborts it. tests/browser/chart-cost.cjs: the hidden live RTA check passes (no analyser read while its tab is hidden) and is no longer pending. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Its chart hosts (MEASURE response, IR and RTA; Experiments detail, overlay, delta and IR overlay) move from pending to done in tests/unit/chart-host-census.json, each carrying data-osc-chart, and the table-driven pass of tests/browser/charts-interaction.cjs holds for each: the host is role=group holding the aria-describedby summary and the snapshot data table, and its focusable plot surface is role=application with aria-roledescription \"interactive chart\" (never role=img), both asserted in the accessibility tree, with a visible focus ring; ArrowRight moves the cursor one step and the one polite live region announces the readout once after the keys settle; Escape clears the cursor and still reaches the page's handler (a running measurement aborts); Space keeps its workspace meaning (SPACE_MEANING of src/js/ui/shortcuts.js) and is never taken (ADR 0050); on a touch pointer a tap pins the cursor and it stays after the finger lifts."
  - "Units do not change: Magnitude dB relative or NORMALIZED, RTA dB relative (dBFS-like) unless a valid LevelCalibration applies, IR re direct peak; the strings join the wording table (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/measurement, src/js/ui/measure.js (src/js/ui/measure/* after E002) and src/js/ui/experiments.js are guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3) and after F004 and F005 placed the card it sits in; no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "Every osc-* use it removes leaves the record in the same change: tests/unit/ui-flowbite-pro-baseline.json is rewritten by node scripts/ui-flowbite-pro-record.mjs (osc-chip-readout and osc-chip-readout--stack fall by the measure chip's use; the change that removes the last osc-chip-readout use deletes the selector), and a selector left without a producer is deleted from src/styles/charts.css and src/styles/measure.css (.osc-chip-readout--stack at measure.css:556 on main) (tests/unit/css-producers.test.mjs); the pull request states by how much the debt fell."
  - "The visual-measure references do not move (the pointer is parked at (0, h-1) and the readout row is hidden until a cursor exists); one that does is re-accepted in both environments with its reason."
  - "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
