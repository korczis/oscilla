title: "MEASURE and Experiments readouts rendered, announced, live-honest and gated while hidden"
slug: measure-and-experiments-readouts-rendered-announced-live-hon
priority: p2
profile: implementation
objective: "Lands as feat(measure). createViewChart in src/js/charts/measure-charts.js keeps zoomX, pinIdx and lastIdx across build() and moves its chip onto the kit's Pro tooltip inside the host (a body-anchored tooltip would bring K015 F2 back). Today meas.readout and exps.readout are Alpine writes on every pointer move that nothing renders, and the chip is aria-hidden: the chip and onReadout now update when cursor.idx changes and, for the live RTA, at most 4 times a second with a LIVE marker while the pointer is still (a frame redraw does not move uPlot's cursor, so the band text is stale today). Each chart gets a visible Pro description-list readout row, hidden until a cursor exists, not itself aria-live: announcements go through the kit's one polite region after the keys settle. Keys are the kit's one key map (arrows one step, PageUp and PageDown a large step: 10 points on a linear axis, 1/3 octave on a log one, Home and End, Escape clears and propagates); Escape on a focused MEASURE chart still aborts a running measurement and stops output (the MEASURE row of shortcuts.js). New readouts: IR (ms re direct peak; where decimation.factor > 1 a column reads \"column 3.20-3.24 ms: min, max (48 samples)\"), the overlay (each entry at its nearest stored or resampled point, \"resampled to 48/oct for display\" where the grid is resampled, \"NOT MEASURED\" in gaps) and the IR overlay; RTA band hover \"1/3 oct . 1 kHz (891-1122 Hz) . -23.4 dB rel\", saying where a band is under-resolved with the threshold measurement/rta.js uses. The live RTA's liveTick (ui/measure.js:962-968 on main, subscribed without a host at :1062) passes its host to onFrame, so a hidden RTA reads no analyser and pushes nothing, and its pending check in tests/browser/chart-cost-baseline.json is removed; a peak hold cannot cover reads it never made, so on return the RTA restarts its hold and says \"peak hold restarted: not read while hidden\". The Experiments detail chart (#osc-exp-chart-detail, experiments.js:547 on main, built on createViewChart) is a host of this slice. The 11 osc-m-chip uses of src/index.html are MEASURE, Experiments and Findings header badges, F004's and F005's work, not chart chips."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
