objective: "A structural follow-up of Czech pass 3 (U109), filed at oscilla-c3's condition 5 under Q090, 2026-11-12, verbatim: \"The structural question (index.html near its cap, e.g. Device & Limits as its own template) goes into a plan issue for the panel's owner, named in the PR body. Not in pass 3.\" src/index.html was at 303 976 of its 304 000 B cap after U108; pass 3 raises the cap only by what the translation adds. Moving whole panels out of index.html into templates keeps the cap falling without restructuring in translation PRs."
why: "The source-size budget bounds how markup is distributed; every Czech pass lengthens index.html, and a translation PR may not restructure markup (Q090)."
