title: "Step-voltage sequencer unit proofs: the Step Modulator's step times, a mid-step reset, every step trigger, the validator's sentence and one undoable edit"
slug: step-voltage-sequencer-unit-proofs
priority: p2
profile: implementation
objective: "Lands as test(studio), or fix(studio) if a defect is found (then fail-first). tests/unit/studio-step-voltage-sequencer.test.mjs asserts what K226's criteria 1 and 5 ask and its 14 cases do not: the row and trigN frames equal a Step Modulator's on the same Clock; a reset arriving mid-step takes effect only at the next step boundary; trig1..16 over 16 triggers with trig9..16 silent at length 8; canConnect cvA to a VCO pitch input and trig3 to an Envelope gate; the TRIGGER to AUDIO refusal reason equals the validator's sentence; one param-list edit is one undo entry and undo/redo restore byte-equal serializeStudio."
why: "Split from K226 (criteria 1, 5, copied verbatim) by the audit-and-stamp follow-up train of 2026-11-18 (oscilla-d9, under the triage the owner approved on 2026-11-18, relayed by oscilla-e5, Q112). Re-run on main 8e087873 (studio-step-voltage-sequencer 14/14): criterion 1 lacks the Step Modulator comparison, a mid-step reset, trig1..16 with trig10..16 silent, a VCO-pitch canConnect and the refusal sentence (only non-empty is checked); criterion 5 has its census proof but no undo/redo test on this node. The oscilla-ff audit of 2026-11-15 found the same gaps."
current_state: "Filed 2026-11-18 by oscilla-d9 in the audit-and-stamp follow-up train; not started."
