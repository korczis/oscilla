  - "tests/README.md"
  - "dist"
depends_on:
  - "C002"
acceptance_criteria:
  - "A unit test on the fake context: with the Filter enabled a sequencer pass reaches engine.master through a BiquadFilterNode, the engine's node count is above 0 while it sounds and 0 after stop; it fails on the merge base."
  - "Browser check `seq-filter-reaches-sequence` in tests/browser/sequencer.cjs: a looping 4 kHz Tone block drops by more than 20 dB once a 200 Hz low-pass is set through #osc-filter-cutoff-value, a cutoff edit during playback applies to the next reading, and the node count is 0 after stop and after Escape."
  - "A unit test of the offline sequence render with the Filter enabled attenuates the 4 kHz block by more than 20 dB, matching the live chain."
  - "The Envelope and Synthesis panels show their instrument-only note in the Sequencer workspace, and a unit test reads that note and README:24-25 so that they agree."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "engine.activeNodeCount returns to 0 after every stop in the new checks, in Chromium, Firefox and WebKit (project.audio-engine-discipline v2)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/audio/audio-engine.js (project.review-verdict); the builder never writes it."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/sequencer-editor.test.mjs"
  - "node tests/browser/sequencer.cjs"
  - "npm test"
evidence_required:
  - "verified"
