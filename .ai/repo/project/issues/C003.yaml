id: C003
milestone: M090
serves:
  - "coherent-state#sequencer-through-engine"
title: "The sequencer plays through the engine's Filter stage and is counted; the labs that do not apply say so"
slug: the-sequencer-plays-through-the-engine-s-filter-stage-and-is
priority: p1
profile: implementation
objective: "Lands as fix(sequencer). Findings dead-controls-7, control-census-2 and engine-sync-5. editor._schedulePass compiles every pass straight into engine.master with no lab insert and no track/source hooks: a 200 Hz low-pass with the Filter on attenuates a held 4 kHz instrument tone by 52.4 dB and the looping 4 kHz sequence by 0.0007 dB, and engine.activeNodeCount is 0 while the sequence sounds, although project.audio-engine-discipline v2 names compileSequence among the builders that receive { track, source } and README:24-25 says sequences are shaped with filters, an ADSR and additive harmonics. Add one AudioEngine-owned, counted stage chain for non-voice graphs (for example engine.stageChain(insertFactories) -> { input, dispose }) built with labs.filter.createInsert, opened once per playback session in editor.play and disposed after the last pass and on stop and Escape (one filter per pass would reset the biquad state at loop boundaries). compileSequence gets the engine's track and source. renderSequenceToWav builds the same chain offline, so the exported WAV is what plays. The ADSR and additive labs are not stacked on the compiler's per-block envelopes (ADR 0003, ADR 0015): in the Sequencer workspace their panels say they apply to the instrument only, the Signal Path and the status bar do not claim them for the sequence, and README:24-25 says what applies. If K001 (plan pull request #265, implementation #266) has landed, build on its AudioEngine.stageAccounting() rather than a second accounting path and record the census criterion as met by it."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
