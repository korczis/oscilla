title: "Studio Import opens a V2 sequence or config file, and a track exports as a sequence"
slug: studio-import-opens-a-v2-sequence-or-config-file-and-a-track
priority: p2
profile: implementation
objective: "Lands as feat(studio). studioImportText (src/js/ui/studio/workspace.js) ignores V2 sequence files although src/js/studio/sequence-import.js is tested and has no caller. Wire it in through src/js/studio/library.js so that a V2 sequence or saved config opens as N pattern clips on one track, and add \"Export track as sequence\". If E003 has split workspace.js when this starts, the change goes into the file I/O module it names."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
scope:
  - "src/js/studio/library.js"
  - "src/js/studio/sequence-import.js"
  - "src/js/ui/studio/workspace.js"
  - "src/js/ui/studio/workspace"
  - "tests/unit/studio-sequence-exchange.test.mjs"
  - "tests/browser/v31-studio-workflows.cjs"
  - "tests/README.md"
  - "dist"
acceptance_criteria:
  - "exportSequence(importSequence(x)) deep-equals x for the reference sequences, in a unit test that fails on the merge base."
  - "A malformed or oversized file gets a readable refusal and leaves the model unchanged (project.studio-model-is-canonical)."
  - "A browser check shows a saved config opening as N pattern clips on one track. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac) (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first). It adds no markup, osc-* class token or stylesheet selector, so the Flowbite Pro ratchet stays flat (node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/studio-sequence-exchange.test.mjs"
  - "node tests/browser/v31-studio-workflows.cjs"
  - "npm test"
evidence_required:
