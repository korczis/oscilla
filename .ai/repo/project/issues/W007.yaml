id: W007
milestone: M101
serves:
- "instrument-kinds#piano-surface"
title: "Piano kind with 88 keys: a named button per key, octave scroll and zoom, velocity by position, a vertical orientation, on K026's keyboard model"
slug: piano-kind-with-88-keys-a-named-button-per-key-octave-scroll
priority: p1
profile: implementation
objective: "Lands as feat(midi). The piano kind over K026's src/js/midi/keyboard.js and keyboard-view.js (one key map, one layout; no copy): range A0-C8 (MIDI 21-108); the visible range computed from the width so a white key is at least 44 px (8 white keys at 390 px portrait, two octaves at 844 px landscape, four at 1536 px); an octave scroll (two buttons and a role=slider for the lowest visible note) and a zoom; velocity by the pointer's position on the key (lower is louder, stated) or MIDI velocity; orientation horizontal or vertical (for the piano roll, W011); the scale highlight as a shape mark; lights per source; and DOM keys instead of K026's canvas drawing: one button per visible key, white keys in a flex row and each black key an absolutely positioned child of the white key before it, all with literal Tailwind utilities (no canvas, no el.style; K026's canvas.style writes leave), named 'C sharp 4', aria-pressed while held, the group named 'Keyboard: plays <target>'. Its sizing uses Tailwind utilities, not canvas.style writes. First consumer: K026's Playground and Studio keyboard; K065, K115, K142, K070 and W011 then mount it. Before: INFERRED from the K026 worktree, a canvas of a few octaves with one list for assistive technology. After: 88 keys, each a named button. Negative cases: a key outside 21-108 (none drawn); a field or dialog focused (no key plays); blur, hide and Escape (every note released, ADR 0062); Space (never a key, ADR 0050). Rollback: revert; no saved state depends on it. Merged plan of the component follow-up (2026-10-30): Wave 1: it needs F001 and K026 (#299). K065 and K115 depend on W007 and keep only their placement; K142 plays the generator through the same kind."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
