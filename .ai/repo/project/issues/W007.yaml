acceptance_criteria:
- "tests/unit/ui-kind-piano.test.mjs fails on the merge base: the layout spans 21-108 and nothing outside; every visible key has a named button; white keys are 44 px or wider at 390, 844 and 1536 px; velocity by position is monotonic and bounded; scrolling keeps the focused key; every held note is released on the forced-release events; the key map is K026's (one import, no copy)."
- "Negative cases, each asserted by a test that fails on the merge base: the four of the objective."
- "Definition of done, tested: tests/browser/midi.cjs plays A0 and C8 by pointer, by keyboard on a focused key and by two simultaneous hasTouch points, waits with until() (deadline 'piano note sounding', 2 s) for the note layer's held notes and the key's aria-pressed, then releases on Escape; at 390x844 the octave scroll reaches C8 by buttons, the slider and PageUp. The check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, runs at 1536x1024 and 390x844, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, extends: K026; interlinks: the group's target name jumps to the instrument it plays."
- "Definition of done, interactivity: pointer with glissando, multi-touch, the computer keyboard when armed, MIDI (ADR 0058's support states unchanged)."
- "The black keys' target exemption is the one Q063 records, stated in the kind."
- "Definition of done, docs, menus and routes: the kind's declaration names its docs, links and tests; docs/ui-catalog.md (G014) lists it; the Keyboard shortcuts dialog lists its keys; tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Its trace entry in scripts/ui-catalog/trace/kinds.mjs names the intent criterion, this issue, its rules, ADRs and tests, each resolved by the trace check, for the Majordomus knowledge projection."
- "The kind's modules pass W001's static scan: no import of src/js/studio/actions.js, a store, sources.js or a lab module; no dispatch or owner writer called; no AudioContext, AudioNode or worklet created (project.audio-engine-discipline v2: one AudioEngine); no requestAnimationFrame, setInterval or setTimeout outside src/js/charts/frame-loop.js; no allocation in a frame callback (1000 ticks keep the same typed arrays) and frameSubscriberCount() returns to its value after destroy()."
- "Its chrome (buttons, button groups, popovers, dropdowns, inputs) is markup adapted from the matching Flowbite Pro block and names its flowbite-pro reference.md section; its instrument surface is a domain view under ADR 0061 decision 3 as J001's ADR 0061 resolution note records it: inline SVG or canvas and Tailwind utilities inside a Pro card, no stylesheet, no selector, no osc-* class token, no el.style write or style attribute; no osc-* name in the ratchet record rises and the domain views' stylesheets gain nothing (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node scripts/ui-flowbite-pro-record.mjs --check and node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "No input path of the build gains a components, widgets, ui-kit or design-system segment (the COMPONENT_LIBRARY check of scripts/ui-flowbite-pro-measure.mjs): declarations live in src/js/ui/catalog/kinds, views in src/js/ui/kinds."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat change it carries a unit test that fails on the merge base (project.fail-first)."
- "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body, inside the component line's cap Q037 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
- "From K115 (merged by Q112): the piano kind is placed in the Synth workspace where K065 docks the keyboard, as well as in K026's Playground and Studio keyboard; there it spans A0-C8 (MIDI 21-108) with the octave scroll and the zoom, and at 390 px it scrolls by octave (K115 said two octaves; this issue's 44 px minimum white key, 8 white keys at 390 px, governs)."
- "From K115 (merged by Q112): tests/unit/piano-88.test.mjs, or this issue's tests/unit/ui-kind-piano.test.mjs where it already asserts the same, fails on the merge base: the key map spans notes 21-108 and draws none outside, velocity by position is monotonic and bounded, and scrolling keeps the focused key."
- "From K115 (merged by Q112): a browser check in tests/browser/piano.cjs (or this issue's tests/browser/midi.cjs), wired into npm run test:synth so CI and the release gate run it, fails on the merge base and proves the Synth placement linked, real-time and interactive. Linked: the lowest and highest keys play the armed instrument and light in the Studio's note view. Real-time: a key pressed low on its face gives a higher runtime velocity than high on it, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: scroll and zoom work by pointer, keyboard and touch; every key is a named button. It runs inside tests/browser/lib/suite.cjs, assumes no sample rate and adds nothing to tests/browser/timing-baseline.json (project.suite-harness, project.bounded-test-timing)."
- "From K115 (merged by Q112): every link the placement adds (open in, send to, a modulation route, a probe or a jump between views) is a row of tests/browser/integration-map.json walked by tests/browser/integration-map.cjs (pointer and keyboard, the same Studio revision, focus on the target heading, Back, Forward and reload keep the state), and every string it adds passes tests/unit/synth-wording.test.mjs (project.no-fake-science)."
- "From K115 (merged by Q112): the Synth placement adds at most 1 KB gzip on top of this issue's figure, within the cap Q023 records for the instrument line, with base and head figures in the pull request body (project.single-file-deliverable)."
