acceptance_criteria:
  - "tests/unit/surface-census.test.mjs passes on the tree and fails, naming the surface, on a copy of src/index.html with an added <dialog id>, an added role=tab and an added data-osc-modes panel, and on a contract entry whose test file does not name its surface."
  - "Every entry's canonical-state path, test files and plan issues exist; chart hosts are referenced to K053's census, not listed again."
  - "The debt (entries with no deep link or no test) is counted and may not grow against the history of tests/unit/surface-census.json."
  - "tests/browser/surface-census.cjs runs in npm run test:browser in Chromium, Firefox and WebKit from file:// and the Pages sub-path, through tests/browser/lib/suite.cjs with wait.cjs deadlines and no fixed sleep, and fails on a runtime surface the contract lacks."
  - "tests/README.md and README.md's testing table name both tests; no count of surfaces is written by hand in prose."
