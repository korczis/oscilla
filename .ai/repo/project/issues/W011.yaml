title: "Piano roll kind: notes on a time-by-pitch grid with a vertical piano, a velocity lane, quantise and legato, and a list view of the same notes"
slug: piano-roll-kind-notes-on-a-time-by-pitch-grid-with-a-vertica
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). src/js/ui/kinds/piano-roll.js and its pure model: notes ({ t, dur, note, vel }, K099's shape) on a role=grid of time cells by pitch rows (the cursor model of W008 on two axes), each note named ('C4, bar 2 beat 3, 1 beat, velocity 0.8'), a switchable listbox of the same notes, the vertical piano of W007 to audition (opt-in), a velocity lane; keys arrows, Enter add or remove, Shift+arrows select, Alt+Left and Alt+Right resize, Alt+Up and Alt+Down velocity, Ctrl/Cmd+A, C, X, V, D, Delete, PageUp and PageDown an octave, + and - zoom; double-click or double-tap adds, drag moves, edges resize, long-press opens the note menu; rows 44 px on a coarse pointer, scrolling inside the card. Every event builds one CLIP_UPDATE. Model first: no module on main shows this kind yet, so the slice ships the model, the view model, the view and the contract test, and no runtime module imports it (esbuild leaves it out of dist, 0 B); its browser, interactivity and deployed criteria are carried by K099, which mounts it. The plan notes this on the consumer when the drafts land. Before: no piano roll. After: one piano-roll kind. Negative cases: a move past the clip's end (clamped, stated); a note outside the range (refused); quantise of an empty selection (no action). Rollback: revert. Merged plan of the component follow-up (2026-10-30): Quantise and legato are toolbar buttons and note-menu items, never bare letter keys. K099 depends on W011 and keeps the notes clip data and its placement."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
