objective: "ADR 0058 (proposed) decision 5 puts MIDI output, MIDI clock and multiple tracks outside the first version, and rejects turning the block sequencer into a MIDI sequencer; it names no piano roll. The owner's order of 2026-10-29 asks for a full DAW. (a) A resolution note on ADR 0058, or a short ADR amending its decision 5 only, puts notes clips with a piano-roll editor, several instrument tracks, a session grid and later MIDI output in scope on the Studio timeline, decisions 1-4 unchanged and the block sequencer still a sound-pattern editor; (b) decision 5 stays and W011, W012 and W015 are cancelled. The plan recommends (a)."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
