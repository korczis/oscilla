  - "tests/README.md"
  - "dist"
acceptance_criteria:
  - "On synthetic frames a transient's smear is shorter with the unsmoothed feed than with the 0.55-smoothing feed."
  - "The readout bin matches a synthetic tone within +-1 bin, in a unit test that fails on the merge base."
  - "The label says relative dB, never an absolute level (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/analysis is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first). It adds no markup, osc-* class token or stylesheet selector, so the Flowbite Pro ratchet stays flat (node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "f=$(mktemp) && node --test --test-name-pattern='^K015 ' --test-reporter=tap tests/unit/analysis-spectrogram.test.mjs > $f && grep -q '^# Subtest: K015 ' $f; r=$?; rm -f $f; exit $r"
  - "npm test"
evidence_required:
