objective: "Lands as feat(analysis). Its tests live in tests/unit/analysis-spectrogram.test.mjs, the file #263 puts them in (commit 3bc96a11), each named \"K015 ...\"; its validation runs only those, writes their TAP to a temporary file and fails when none ran, so it fails on main. The review follow-ups F1-F4 and F6 are K029 and F5 is K033 (M062). src/js/charts/spectrogram-view.js gets a hover readout (frequency and relative dB) drawn on the canvas, using rowFrequency of src/js/analysis/spectrogram.js (unused today), and an unsmoothed feed from readTime() beside the 0.55-smoothing feed. A domain visual on the canvas, so it has no ratchet effect. The spectrogram view is shared by the whole app, so it carries none of the banned terms of intent audio-band-signal-lab and needs not carry its required phrases, which belong to the views K025 adds."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
