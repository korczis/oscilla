title: "Clip slot and scene kinds: a tracks-by-scenes grid with launch, stop and the queued bar stated"
slug: clip-slot-and-scene-kinds-a-tracks-by-scenes-grid-with-launc
priority: p3
profile: implementation
objective: "Lands as feat(studio-ui). src/js/ui/kinds/clip-slot.js and scene.js: a slot shows G005's one clip face and its state (empty, stopped, queued, playing, recording); the grid is role=grid with tracks as columns and scenes as rows, a slot named 'Bass, scene 2, Riff A, queued for bar 9' with the bar taken from the transport; keys arrows, Enter launch, Shift+Enter stop the track, Ctrl/Cmd+Enter launch the scene row, Delete clear; three 104 px track columns at 390 px, scrolling inside the card; an empty slot offers an action, not only text. Events map to K101's session actions and the transport commands. Model first: no module on main shows this kind yet, so the slice ships the model, the view model, the view and the contract test, and no runtime module imports it (esbuild leaves it out of dist, 0 B); its browser, interactivity and deployed criteria are carried by K101, which mounts it. The plan notes this on the consumer when the drafts land. Negative cases: a launch in the last frame of a bar (queued for the next one); a clear while playing (stops first, stated); a scene with empty slots (those tracks stop, stated). Rollback: revert. Merged plan of the component follow-up (2026-10-30): K101 depends on W012."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
