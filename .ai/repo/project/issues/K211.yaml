acceptance_criteria:
  - "A browser check in tests/browser/synth.cjs (or a new suite added to the test:studio script of package.json), run by npm run test:studio so CI and the release gate run it. Linked: a vco and a contour added in the Studio show in the Signal Path and the compact Studio of the Playground as the same nodes. Real-time: a vco pulse width changed in the Inspector reaches the runtime's rebuilt pulse wave (the width read from the runtime's debugInfo) and the Studio spectrum node's summary, each within a named until() deadline. Interactive: each type is added from the library by pointer, by the keyboard quick add (N) and by touch, and its ports have their accessible names ('Pitch control input'). Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Test-only unless debugInfo lacks the pulse width: exposing it is a feat(studio) change with a unit test that fails on the merge base and a reviewer's verdict (src/js/studio is guarded); otherwise the body says 'fail-first: n/a' with the reason."
