objective: "Lands as test(studio). K059's criterion 4 names browser checks that tests/browser/synth.cjs does not run: a vco and a contour added in the Studio shown in the Signal Path and in the compact Studio of the Playground as the same nodes; a vco pulse width changed in the Inspector reaching the runtime's rebuilt pulse wave (read from debugInfo: the width shapes a PeriodicWave, it is not an AudioParam) and the Studio spectrum node's summary; each type added from the library by pointer, by the keyboard quick add (N) and by touch; ports with their accessible names ('Pitch control input'). Adds them once K207 lands the contour type. Rollback: revert; tests only."
why: "Gap of K059 (criterion 4) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): K059's browser checks are not in tests/browser/synth.cjs. No owner direction re-scopes it, so it is its own issue and K059's criterion points here (chore/plan-m064-rescope). K059 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
