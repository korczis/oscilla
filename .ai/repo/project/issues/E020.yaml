title: "The ADR index names every accepted ADR and marks those whose decision still opens with 'Proposed'"
slug: the-adr-index-names-every-accepted-adr-and-marks-stale-proposed-openings
priority: p3
profile: implementation
objective: "#198 R-5: the owner gave one blanket instruction on 2026-10-18 to accept the ADRs the code implements as described, and which ADRs that covers was the session's selection, not a per-ADR review by the owner (R-1 of #198 showed the selection can be wrong: 0016 was withdrawn). #198 R-6: many accepted ADRs still open their decision with 'Proposed:' or 'Proposed (being implemented...)', for example 0022, 0027, 0028 and 0029, and the policy forbids rewriting above the resolution notes, so a reader sees both. Add to .ai/repo/adrs/README.md a list of every ADR whose front matter says status: accepted, each with the date of its acceptance note, marking those whose decision section opens with 'Proposed', so the owner can confirm or withdraw each one and a reader knows that the note governs. Add tests/unit/adr-accepted-list.test.mjs, which checks the list against the ADR files."
why: "Review verdict .ai/repo/reviews/198.yaml, findings R-5 and R-6: the acceptance is recorded honestly, but the owner never saw the selection by name, and the accepted records read as proposed at their decision."
scope:
  - ".ai/repo/adrs/README.md"
  - "tests/unit/adr-accepted-list.test.mjs"
  - "tests/README.md"
acceptance_criteria:
  - "The test fails when an ADR with status: accepted is missing from the README list, when the list names an ADR that is not accepted, and when the 'Proposed' mark differs from whether that ADR's decision section opens with 'Proposed'; each failure is a unit case on fixture ADRs."
  - "The test passes over the real .ai/repo/adrs; no ADR body above its resolution notes changes, and no ADR's status changes in this issue (a status change is the owner's act)."
  - "tests/README.md has a row for the test (one appended row)."
validation:
  - "node --test tests/unit/adr-accepted-list.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
