acceptance_criteria:
  - "A unit test: loading a sequence whose waveform differs from the instrument's leaves model.waveform equal to the instrument waveform and adds no undo step; it fails on the merge base."
  - "Browser check `seq-waveform-one-owner` in tests/browser/app.cjs: importing waveform=sine with sequencer.waveform=square while the instrument is already sine gives 'sine' for the realtime OscillatorNode type, the sequence WAV's harmonic signature (Goertzel h2 and h3 below -60 dB) and the status readout, and the import message names the waveform note."
  - "A unit test in tests/unit/qa-regressions.test.mjs: while the sequence plays, setLoop(false) then addBlock('tone') makes statusDurationText equal formatMs(totalDurationMs(model)), with ' (loop)' only when model.loop; browser check `seq-status-duration-follows-edits` in tests/browser/qa-regressions.cjs drives the same edits through the Loop button and the Add menu."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "A reviewer's verdict is needed if the change reaches a path in scripts/review-verdict.mjs GUARDED (project.review-verdict); the builder never writes it."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/qa-regressions.test.mjs tests/unit/sequencer-editor.test.mjs"
  - "node tests/browser/app.cjs"
  - "node tests/browser/qa-regressions.cjs"
  - "npm test"
evidence_required:
