acceptance_criteria:
  - "A fresh page's Studio document holds the Synth panel; Studio Play on a fresh page sounds the template's chain at the level of today's fresh page (within 1 dB, analyser read) and the panel's voice reaches Master Output through a mixer, not by taking its only input."
  - "Opening the Synth on a fresh page, and on a document without the panel, leaves the model, studioHash, undo history and clean state unchanged (a unit test over the real store, failing on the merge base)."
  - "On a document without the panel the Synth shows SYNTH_TEXT.notInserted with Vložit; Vložit inserts in one undo step and marks the document unsaved; a key before Vložit inserts nothing."
