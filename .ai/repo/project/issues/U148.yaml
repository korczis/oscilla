objective: "Implement the owner's Q117 answer: the reference (default) Studio document contains the Synth panel, mixed with the template's own chain into Master Output so the Studio's Play sounds both; the Synth's workspace watcher (synth/ui.js ensurePanel on visit) inserts nothing; a document without the panel shows the existing Vložit sentence (SYNTH_TEXT.notInserted) and the explicit Vložit stays the only insert."
