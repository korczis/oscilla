acceptance_criteria:
  - "Fail-first fixture: tests/unit/readout-in-effect-mic-compare.test.mjs: generatorPlaying false with a peak at the request → not \"match\"; request 15 Hz with a 120 Hz peak and band 20-20000 → out-of-band, never harmonic; request 21000 with or without a peak → out-of-band; a frozen comparison rendered under a 2000 Hz request names 1 kHz or equals compareFrequencies against 2000. Fails on the merge base."
  - "Negative cases, each asserted: Request 19999 Hz is in band at 48 kHz; 30 kHz stays out-of-range; generatorPlaying true with a 1 kHz peak still \"match\"; generatorPlaying null keeps today's behaviour; a peak above -70 dBFS shows no weak qualifier; analysis-misc.test.mjs cases pass."
  - "Revertible on its own: Revert: two pure functions and their callers; no stored data."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
