title: "The microphone comparison says what it compared: generator off, out of the analysed band, frozen request"
slug: the-microphone-comparison-says-what-it-compared-generator-of
priority: p1
profile: implementation
objective: "Truth-table rows MIC-11, MIC-12, MIC-14, MIC-15, MIC-16 (scratchpad p05/truth-table.md). compareFrequencies takes generatorPlaying and bandMinHz/bandMaxHz. New states: generator-off (difference from the configured request only) and out-of-band (requested frequency outside the analysed band 20 Hz-<max>), evaluated before match, close, harmonic and mismatch; detectedText shows the comparison label instead of \"signal too weak\" for these; the weak flag appears as \"(weak peak, near the noise floor)\"; a frozen verdict names the request it used (\"vs 1 kHz at freeze\") or is recomputed against the live request."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): With the generator stopped, a 1 kHz sound at the microphone reads \"Δ 0 Hz (Within analyser resolution)\" (adapter.isPlaying exists and is never read). A 15 Hz request with 120 Hz hum reads \"Strongest peak is a harmonic\" (n = 8); a 21 kHz request with a -6 dBFS tone reads \"no clear peak (signal too weak or noisy)\", because the 20 Hz-20 kHz analysed band never reaches the verdict and OUT_OF_RANGE fires only at Nyquist. After Freeze and a request change to 2 kHz the panel shows \"Requested: 2 kHz\" beside a match computed against 1 kHz. A -104 dB peak gets a confident verdict; the weak flag is computed and never shown."
