acceptance_criteria:
  - "The template demo-song validates without a warning under its pinned studioHash, holds 744 tempo-linked clips (one per note of demo-song-score.js) on six tracks, seven section markers and the lanes the Studio plays, plans an offline render of the whole 110 s song with no limitation, and the six earlier templates keep their hashes; tests/unit/demo-song.test.mjs fails on the merge base (project.fail-first)."
  - "Its Learn text says the song is original, that the drums are a sine sweep and filtered noise, and that velocity is not represented; what the score holds and the Studio cannot play (velocity, the Q lane, drive) is absent from the model and named in DEMO_SONG_OMITTED (project.no-fake-science, project.no-inert-surfaces)."
  - "tests/browser/demo-song.cjs runs through tests/browser/lib/suite.cjs in test:browser, waits only through tests/browser/lib/wait.cjs with named deadlines, and passes in chromium, firefox and webkit with its expected failures printed XFAIL; an expected failure that passes fails the suite until its mark is removed (project.suite-harness, project.bounded-test-timing)."
  - "README.md has the section \"Demo song: a vertical slice\" and tests/README.md a row for each new test; the pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and adds no markup, osc-* class token or stylesheet selector (project.ui-uses-flowbite-pro)."
validation:
