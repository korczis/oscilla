title: "Parameter fields, lab switches and single choices render from their declarations as Flowbite Pro markup, Filter Lab first"
slug: parameter-fields-lab-switches-and-single-choices-render-from
priority: p2
profile: implementation
objective: "Lands as feat(ui). D2 (view half), D4 and D8. src/js/ui/catalog/render.js renders a declaration of kind param, switch or choice from its template, markup adapted from the Pro blocks of the flowbite-pro reference (range with number input, toggle, button group), with Tailwind class lists only: label for, aria-valuetext with value and unit, aria-describedby for unit, error and disabled reason, the keyboard of each kind (roving tabindex for choice), 44 px targets on a coarse pointer, reset to the declared default (double-click, or the R key on the focused control), and the readout through G002. One entry point: mountControl(host, decl, { value, commit }) -> { set(value), setDisabled(reason | null), destroy() }, called by the surface that owns the value (the lab, the Studio through dispatch); the renderer holds no value, resolves no state path, subscribes to nothing and evaluates no condition at run time, so it is a function per kind and not a binding layer. Filter Lab, the first surface, is wired by id in JavaScript and needs no Alpine integration; if F003 later needs one for markup surfaces, its directive name carries no osc- prefix (Alpine.directive('osc-control', ...) puts the new osc-* name osc-control into the ratchet record, a rise: measured with the ratchet's measure() on 2026-10-29). Filter Lab is the first surface: its three parameter fields, its enable switch and its type choice (a radiogroup today styled as tabs, D4) render from their declarations and the panel moves to migrated in the ratchet record; F003 then builds the other Playground-family panels from the same kinds instead of hand-building them. The envelope's power button (aria-pressed) becomes the same switch as Filter and Additive (D8). Before: VERIFIED seven parameter-field variants, two switch forms, inline copies of choice() (inventory C5, C8, C9). After: one renderer per kind. Negative cases: a declaration without a template, a template with an osc-* class, a template for a kind outside param, switch and choice, a disabled control without a reason, a commit the owner refuses (the control shows the owner's value again and states the refusal); each refused by the catalogue test. Rollback: revert the merge commit; the panel returns to its legacy markup and the ratchet record to its earlier values in the same revert."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
