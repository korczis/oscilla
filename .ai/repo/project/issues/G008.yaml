acceptance_criteria:
- "tests/unit/ui-catalog-render.test.mjs fails on the merge base: for every kind, the rendered markup (jsdom-free string form) carries the declaration's label, bounds, step, unit, aria and reset, no osc-* class, and a template that names its reference.md section; Filter Lab's markup in src/index.html carries no hand-built field."
- "src/js/ui/catalog/render.js imports nothing from sources.js and no module of the catalogue calls a state owner's writer, subscribes to a store or evaluates a declaration field as a condition (a static import and call scan in the unit test)."
- "No osc-* name in the ratchet record rises: no catalogue module, directive or template string contains osc- (node scripts/ui-flowbite-pro-record.mjs --check)."
- "No input path of the build gains a components, widgets, ui-kit or design-system segment (the COMPONENT_LIBRARY check of scripts/ui-flowbite-pro-measure.mjs refuses it): the catalogue lives in src/js/ui/catalog."
- "Definition of done, extends: the param model of G003 and the declarations of G001; K058's knob is a third view of the same descriptor (the synth line), and K058 depends on G003, not G008 on K058."
- "Definition of done, interlinks: each rendered control carries its catalogue id, so the in-app panel and the link graph find it."
- "Definition of done, interactivity: every rendered control has drag, keys, typed entry, reset and a stated refusal."
- "Definition of done, docs, menus and routes: the Filter Lab help and docs/v31/user-guide.md describe the controls once. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: tests/browser/labs.cjs drives the Filter Lab cutoff by slider drag, arrow keys, PageUp, typed entry and reset, and by a hasTouch drag, and waits with until() (deadline 'filter control applied', 2 s) for the state, the readout and aria-valuetext to agree after each, in every gate browser. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (the template names its flowbite-pro reference.md section), recorded as migrated, never pending; it adds no osc-* class token, no legacy vocabulary use and no selector, removes the legacy ones it replaces, and the domain views' stylesheets gain nothing (compact density is Tailwind utilities on the domain view's own elements); the record's debt falls (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 3 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
