title: "Owner decision: /proceed works in OSCILLA; Majordomus is upgraded to 1.0.1 once it is published, and the skill is generated for the adopter"
slug: owner-decision-proceed-skill-and-majordomus-1-0-1
priority: p2
profile: routine
owner: "repository owner"
objective: "Record the owner's question and answer of 2026-11-09 (Claude Code session c9ae388a-1265-4c28-8fad-5fdaea45ef04, oscilla-43, ~17:20Z). The owner asked, verbatim: 'jaktoze zas nefunguje prikaz \"/proceed\" mame posledni verzi majordomus?'. Found: OSCILLA never had .claude/skills/proceed/SKILL.md (the skill is generated only inside prismatic-majordomus by `majordomus generate editors`); the installed Majordomus is 1.0.0; v1.0.1 is tagged in prismatic-majordomus but not published (no GitHub release, https://majordomus.dev/releases/v1.0.1.json answers 404). The question asked (AskUserQuestion), verbatim: '`/proceed` doesn't work in OSCILLA because the skill file (.claude/skills/proceed/SKILL.md) only exists in the prismatic-majordomus repo, which generates it for itself. OSCILLA never had it (git history is empty for it). The installed Majordomus is 1.0.0; the latest is v1.0.1. The capability itself works in 1.0.0 (`majordomus proceed step` / MCP `majordomus_proceed_step`). What should I do?' The answer, verbatim: 'Upgrade + skill (Recommended)', whose option read: 'Upgrade the global majordomus to 1.0.1, raise OSCILLA's pin to 1.0.1 on a branch (chore/majordomus-1.0.1, CI MJ_VERSION), generate .claude/skills/proceed in OSCILLA, and land it in the next train. If 1.0.1 can't generate the skill for an adopter, file an issue in Majordomus.'"
why: "The owner's direct answer; recorded the same session (owner answers live in the repository)."
current_state: "Decided 2026-11-09. Majordomus v1.0.1 was published 2026-11-09T17:44Z (release record commit 426e9855) and the machine-wide launcher runs it. On chore/majordomus-1.0.1 (from train T4 9fa580e0) the pin moves to 1.0.1: CI MJ_VERSION and MJ_SHA256 in ci.yml and main-checks.yml (524adfd3..., the linux-x86_64-gnu digest in both its SHA256SUMS and its release record), the captured doctor lines of tests/unit/ci-knowledge-job.test.mjs re-captured with 1.0.1 (identical but for version strings), and the vendored standard rules re-vendored at source revision 1.0.1 (only that field changed). doctor reports the same findings under 1.0.0 and 1.0.1 (0 failures); majordomus update changes no generated file. 1.0.1 generates the skill for an adopter: majordomus generate editors, run in OSCILLA, writes .claude/skills/proceed/SKILL.md (with 64 more .claude/skills/mj-* skills and three .agents/skills, not adopted here), and the hand copy is replaced by that generated file, which differed only in its Generator line. Open: the evidence for criteria 2 and 3 once the branch lands on main; whether to adopt the other generated skills is a separate decision."
