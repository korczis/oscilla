title: "A frequency profile that covers none of the measured points never reads CALIBRATED"
slug: a-frequency-profile-that-covers-none-of-the-measured-points
priority: p1
profile: implementation
objective: "Truth-table rows MSR-18, MSR-30 (scratchpad p05/truth-table.md). A correction with no covered point is treated as no correction: RAW is primary, the badge reads UNCALIBRATED, the summary gives the RAW extremes, and a note says the profile covers none of the measured range (no extrapolation, ADR 0020). Band mode badges from the coverage mask exactly as FFT mode does."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): A profile with points only at 12-16 kHz on a 100 Hz-10 kHz sweep covers 0 of 319 grid points, yet the result badge reads \"CALIBRATED (frequency)\" and the summary \"Frequency response (calibrated): no measured points\" (badge keyed on the correction object, response-chart.js:426). A one-point profile at 1 kHz does the same. In live RTA band mode a 30-40 kHz profile covers no band and badges CALIBRATED, while FFT mode reads UNCALIBRATED."
scope:
  - "src/js/measurement/views/response-chart.js"
  - "src/js/measurement/views/rta-chart.js"
  - "tests/unit/readout-labels-calibration-coverage.test.mjs"
