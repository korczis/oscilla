title: "One LFO, one Nyquist bound and one voice headroom law, in src/js/audio/, imported by every voice system"
slug: shared-voice-primitives-in-audio
priority: p1
profile: implementation
objective: "Lands as fix(audio). Coverage gap of af's critique of 96daa67b ('nothing places the LFO copied three times, the Nyquist bound at about 11 sites, safeMaxFor has no caller, or the three headroom laws') and its BLOCKING 6 point that the shared primitives belong in src/js/audio/, not studio/adapters/ (or audio/ and sequencer/ would import studio/). Line numbers at origin/main a19f1ff6. The LFO is built three times: src/js/audio/modulation.js:14-34 (V1), src/js/sequencer/compiler.js:933 and src/js/studio/adapters/modulation.js:15. The generation bound (Nyquist x SAFE_NYQUIST_FACTOR) is recomputed at audio-engine.js:223, audio/additive.js:313, audio/filters.js:74, audio/offline-renderer.js:49, sequencer/model.js:81, studio/adapters/engine-hooks.js:60 and :65, studio/adapters/engines.js:21 and :65, studio/adapters/instrument.js:25 and studio/offline.js:213, while core/frequency.js:173 safeMaxFor, the one function meant for it, has no caller (measurement/stimulus.js:81 keeps its own name for MEASURE by design, rta.js:73 NYQUIST_FRACTION is an analysis bound). The per-voice headroom has three laws: the V1 note voices' level / NOTE_POLYPHONY (audio-engine.js:1089), the voice host's VOICE_LEVEL_SCALE = 1 / (VOICE_LEVEL_MAX x MAX_VOICES) (studio/adapters/voices.js:49-52) and the additive table's own headroom normalisation (audio/additive.js:212-223). After: src/js/audio/ holds one LFO builder, one voice headroom law (consuming K180's cap) and the generation bound is safeMaxFor; the eleven sites call it, and the voice systems import these primitives, so no import edge from audio/ or sequencer/ to studio/ appears."
why: "af's critique of 96daa67b (coverage gaps under 'one bus', and BLOCKING 6 on where the primitives live); the owner's 'reuse, dry, parametrizuj' (relayed by af, 2026-11-05)."
