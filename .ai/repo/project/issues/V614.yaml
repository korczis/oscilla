title: "Align, distribute and tidy the selection, and mute a box"
slug: align-distribute-and-tidy-the-selection-and-mute-a-box
priority: p2
profile: implementation
objective: "P04 slice D (editing and undo invariants). Lands as feat(studio-ui). A pure src/js/ui/studio/graph-layout.js computes align (left, right, top, bottom, horizontal and vertical centre) and distribute (horizontal, vertical) of the selected nodes on the 8-unit grid, and K009's tidy (L) applied to the selection only (Shift+L) in left-to-right topological columns; each is one NODE_MOVE batch and one history entry. The multi-selection Inspector offers the same commands through its existing action-button helper, and keys Alt+Shift+arrows align. M on a selected node mutes every outgoing edge of it in one EDGE_UPDATE batch (and unmutes when all are muted), using the edge mute the model already has: no schema change and no studioHash change for an unmuted document."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
