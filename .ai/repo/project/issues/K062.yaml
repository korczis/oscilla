title: "Synth workspace: the panel as Pro cards with knobs on the one Studio store"
slug: synth-workspace-the-panel-as-pro-cards-with-knobs-on-the-one
priority: p1
profile: implementation
objective: "Lands as feat(synth). A new workspace synth (#m=synth, sub-view sv=panel) in the Pro shell: page header with breadcrumb, the transport group (Play/Stop, tempo, Tap, Loop) of the one Studio transport, presets dropdown and Open in Studio; the panel as a responsive grid of Pro cards, one per module, showing every parameter of its node on its face (owner decision of 2026-10-29: every parameter on a box face, not a subset), with collapse and expand first-class: each card's header is a disclosure button with aria-expanded, a collapsed card keeps its jacks, label and a one-line summary from the registry, Expand all and Collapse all act on the panel, and the expanded set is view state (persisted per view, never in history or the hash); every continuous parameter a K058 knob bound to NODE_PARAM_SET and every amount knob to EDGE_UPDATE of its normal or patched edge, disabled with its reason when nothing is patched. It reads the store from the handle createStudioUi returns (the Studio workspace still calls createStudioStore once; tests/unit/v4-one-studio-store.test.mjs stays green) and adds at most 300 B to src/js/main.js, else it waits on K028's wiring module. SPACE_OWNER (keyed by app.js WORKSPACES) gains synth: 'studio' and WORKSPACE_LABELS its label, and the Studio keydown handler of src/js/ui/studio/workspace.js, which acts only while the workspace is studio, also acts in synth (ADR 0050's table gains its row). Its place in the sidebar and its sub-views follow Q019. Opening the workspace with no panel in the model offers 'New Synth voice' (K061). Before: there is no instrument front panel. After: the Synth workspace shows the voice as cards of knobs on the one store. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
