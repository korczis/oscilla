acceptance_criteria:
  - "One module owns the keyboard state (octave, velocity, held notes, lights, armed) for on-screen keys, QWERTY and MIDI; the Playground, Synth and Studio read it and never keep their own copy (a unit test fails if a second owner exists)."
  - "A declared table maps each workspace to what the keys play and when they are armed; changing workspace changes only the route, never the octave, velocity or lights."
  - "A browser check in midi.cjs plays the same key sequence by pointer, QWERTY and MIDI in the Playground, the Synth and the Studio in chromium, firefox and webkit and asserts the same octave, velocity, lit keys, release on blur, hide, Escape and workspace switch, and no note left sounding; it fails on the merge base."
  - "A guarded change carries a non-builder verdict (project.review-verdict); feat changes carry a fail-first unit test."
validation:
  - "node tests/browser/midi.cjs --browsers chromium,firefox,webkit"
  - "npm test"
evidence_required:
  - "verified"
