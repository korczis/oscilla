id: K178
milestone: M061
serves:
  - "playable-instrument#workspaces-exchange"
title: "One keyboard: the same keys, QWERTY and MIDI behave the same in every workspace, through one Keys source the workspace's instrument listens to"
slug: one-keyboard-behaves-the-same-in-every-workspace
priority: p1
profile: implementation
objective: "Lands as feat(keys). The owner asked on 2026-11-04 (relayed by prismatic-majordomus-44): 'jaktoze neni vse propojene, jaktoze se keyboard chova vzdy jinde, jaktoze to neni interconnected' (why is nothing connected, why does the keyboard behave differently everywhere). On main the parts exist but are wired per workspace: K153 gives one key registry and dispatcher, K026 the on-screen keys and QWERTY on the V502 voices, M086 (#410) docks the keys in the Synth and the Studio, and the Studio sink, the Synth panel and the Playground voice each decide on their own what a key does, which octave and velocity apply, what is lit, when a note is released and whether the keys are armed. M061's Wave 3 'one Keys node fed by keyboard, QWERTY and MIDI' was never issued. This issue issues it: one Keys source (on-screen, QWERTY and MIDI as its inputs) with one octave, velocity, held-notes and lights state, and one arm and route rule per workspace that is declared, not coded per surface; the Playground, Synth and Studio each consume its note events through one interface, and a note is always released on the instrument that took it (K175, K176)."
why: "The owner's direct question names the defect class: the same control behaving differently per workspace is incoherent state (coherent-state, M090) and the opposite of the interconnected instrument the owner ordered on 2026-10-29."
current_state: "Its arming rule rests on the owner's answer of 2026-11-04 recorded verbatim as Q105 ('Armed everywhere (Recommended)', session 4fba4ca0, 23:07:30Z): the Playground, the Synth and the Studio play the computer keys at once, and Arm switches them off."
scope:
  - "src/js/midi/"
