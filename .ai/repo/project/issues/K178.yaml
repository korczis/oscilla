id: K178
milestone: M061
serves:
  - "playable-instrument#workspaces-exchange"
title: "One keyboard: the same keys, QWERTY and MIDI behave the same in every workspace, through one Keys source the workspace's instrument listens to"
slug: one-keyboard-behaves-the-same-in-every-workspace
priority: p1
profile: implementation
objective: "Lands as feat(keys). The owner asked on 2026-11-04 (relayed by prismatic-majordomus-44): 'jaktoze neni vse propojene, jaktoze se keyboard chova vzdy jinde, jaktoze to neni interconnected' (why is nothing connected, why does the keyboard behave differently everywhere). On main the parts exist but are wired per workspace: K153 gives one key registry and dispatcher, K026 the on-screen keys and QWERTY on the V502 voices, M086 (#410) docks the keys in the Synth and the Studio, and the Studio sink, the Synth panel and the Playground voice each decide on their own what a key does, which octave and velocity apply, what is lit, when a note is released and whether the keys are armed. M061's Wave 3 'one Keys node fed by keyboard, QWERTY and MIDI' was never issued. This issue issues it: one Keys source (on-screen, QWERTY and MIDI as its inputs) with one octave, velocity, held-notes and lights state, and one arm and route rule per workspace that is declared, not coded per surface; the Playground, Synth and Studio each consume its note events through one interface, and a note is always released on the instrument that took it (K175, K176)."
why: "The owner's direct question names the defect class: the same control behaving differently per workspace is incoherent state (coherent-state, M090) and the opposite of the interconnected instrument the owner ordered on 2026-10-29."
scope:
  - "src/js/midi/"
  - "src/js/synth/studio-sink.js"
  - "src/js/synth/"
  - "src/js/studio/live-notes.js"
  - "src/index.html"
  - "tests/unit/"
  - "tests/browser/midi.cjs"
  - "dist/index.html"
depends_on:
  - "K026"
  - "K153"
acceptance_criteria:
  - "One module owns the keyboard state (octave, velocity, held notes, lights, armed) for on-screen keys, QWERTY and MIDI; the Playground, Synth and Studio read it and never keep their own copy (a unit test fails if a second owner exists)."
  - "A declared table maps each workspace to what the keys play and when they are armed; changing workspace changes only the route, never the octave, velocity or lights."
  - "A browser check in midi.cjs plays the same key sequence by pointer, QWERTY and MIDI in the Playground, the Synth and the Studio in chromium, firefox and webkit and asserts the same octave, velocity, lit keys, release on blur, hide, Escape and workspace switch, and no note left sounding; it fails on the merge base."
  - "A guarded change carries a non-builder verdict (project.review-verdict); feat changes carry a fail-first unit test."
current_state: "In the keys+pad train (int/keys-pad-train). af's criteria check at 81b31110 (2026-11-05, asked by b0) found it not yet done. Criterion 1 holds for the routes only: keys-routes.test.mjs refuses a second workspace -> sink or arm map, but no test refuses a second owner of octave, velocity, held notes or lights. Criterion 3: keys-one-keyboard plays QWERTY and MIDI but no pointer note, and asserts neither velocity nor the release on blur and hide. It re-arms after Escape ('Escape may have disarmed the keys'), so a per-workspace Escape passes. These are K178's own criteria and stay open until met on main; the key path itself (24 listeners outside src/js/ui/keys/, Escape disarming in the Synth only) is K202."
validation:
  - "node tests/browser/midi.cjs --browsers chromium,firefox,webkit"
  - "npm test"
evidence_required:
  - "verified"
