acceptance_criteria:
  - "tests/unit/charts-export.test.mjs, failing on the merge base: CSV header metadata carries the sample rate, FFT size, bin width, smoothing and the relative, uncalibrated wording; MEASURE delegates to experiments/csv.js."
  - "tests/browser/charts-interaction.cjs: the PNG blob is produced and the CSV header reads as specified. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Levels say dB relative (dBFS-like) unless a valid LevelCalibration applies, every estimate is labelled as one, and no data value is tweened or eased; every readout, tooltip, axis title and caption string it adds is registered in its chart's wording table and passes tests/unit/charts-readout-wording.test.mjs (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/ui/measure.js (src/js/ui/measure/* after E002) and src/js/ui/experiments.js are guarded where the delegate is wired; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3) and after F004, F005 and F006 placed the card it sits in; no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "No per-host reference moves: if scripts/visual-charts.mjs exists it passes unchanged, with --check-accepted; the full-page references it moves are re-accepted in both themes and both environments with the reason \"export menu in the card header\"."
  - "scripts/size-report.mjs shows at most 2.5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
