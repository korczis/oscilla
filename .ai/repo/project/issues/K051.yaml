title: "Chart export: PNG with a provenance caption and CSV only where the numbers are data"
slug: chart-export-png-with-a-provenance-caption-and-csv-only-wher
priority: p3
profile: implementation
objective: "Lands as feat(charts), only if Q015 (OD10) keeps it; otherwise it is cancelled citing Q015, and the same change removes it from M062's acceptance list. src/js/charts/export.js: a PNG offscreen 2x composite of plot, axes and legend with a caption (title, provenance line, ISO timestamp, build-info.js version) on the theme's surface, without the tooltip; CSV only where the numbers are data: the live spectrum's raw analyser bins (bin-centre Hz, dB) with a header naming sampleRate, fftSize, binHz, smoothingTimeConstant, source and \"relative dBFS-like, uncalibrated\", the frozen scope buffer, the filter's \"computed response\", the harmonics \"theoretical\" and the bio citation table; MEASURE and Experiments delegate to experiments/csv.js (transferCsv, irCsv, rtaCsv); no CSV for the spectrogram, phase or envelope. A Pro dropdown menu (F001 bundles dropdown) in the card headers, outside the chart host, so no per-host reference of K050 moves and the owner's light acceptance (Q017) stays valid. The snapshot data table every chart already has (K053) is not part of this issue. The export's offscreen canvas is an exempt site of the census."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
