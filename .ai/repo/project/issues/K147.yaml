acceptance_criteria:
  - "Fail-first: tests/unit/presets-one-store.test.mjs saves a Playground preset and a Synth preset and asserts both are records of the one patch shape in the one store; it fails on the merge base."
  - "A legacy 'oscilla.presets' fixture (every lab setting C018 restores) migrates to patch records that restore the same settings; an unmigratable entry is kept and named; a static scan finds no second writer of a preset key."
  - "The patch browser lists the migrated Playground presets beside the instrument presets; tests/browser/navigation.cjs restores one and asserts the lab settings it claims, through tests/browser/lib/suite.cjs and tests/browser/lib/wait.cjs until() with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "As a refactor it lands with the browser suites and the visual gate unchanged, apart from the browser listing named above."
