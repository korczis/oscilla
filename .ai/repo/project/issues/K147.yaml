title: "One preset record and one store: the Playground and lab presets move onto the patch record of studio/patches.js"
slug: one-preset-record-and-one-store-the-playground-and-lab-presets-move-onto-the-patch-record
priority: p3
profile: implementation
objective: "Lands as refactor(presets). src/js/data/presets.js with src/js/core/instrument.js keeps the Playground and lab voice presets in localStorage 'oscilla.presets' (src/js/core/constants.js:47) as flat records, a second preset store beside the one patch record of src/js/studio/patches.js that the Synth, kits, engines and XY presets use after #375 (K102). Before: two record shapes, two stores, two browsers' worth of naming and import rules. After: one record shape and one store for every preset; the Playground voice is described as a Studio graph its patch applies to, so a Playground preset is a patch; existing 'oscilla.presets' records are migrated once on read, each named in the migration notice, and an entry that cannot be migrated is kept and said, never dropped; the one patch browser of K102 lists them. C018's guarantee holds: a preset restores the lab settings it claims. Rollback: revert; the migration leaves the old key in place until a release has shipped with the new store, so a revert still reads it."
why: "Review of #375 (oscilla-21 reviewer, delta at 124f6ece, finding R7, P3): the Playground/labs V1 voice presets remain a second preset store with a flat record shape; acceptable as a named follow-up; K102's scope lists only the Studio-model instruments, and moving the Playground voice onto patches needs a Studio graph for it; file one under M069 so the duplication is tracked. oscilla-af's #367 review names the same duplication (F6, 'Synth presets outside the Studio Library')."
