title: "The embedded Studio is a compact cockpit card: toolbar, Open in Studio, run state, mini level and scope, the selected node, and a phone layout"
slug: the-embedded-studio-is-a-compact-cockpit-card-toolbar-open-i
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). U1, U9, U13 and U15 and the rest of the redesign of the design section 5: a Pro card whose header holds the heading at the level of its siblings (h2 in the Playground family), the document title, the dirty mark and an 'Open in Studio' link (an href to #m=studio, so it opens in a new tab too) with an overflow menu (Templates, Fullscreen); a toolbar row with the transport strip of G006, the time, the tempo and the runtime state chip the Inspector already computes (runtimeView: 'Not applied', 'Running', revision) and, at its end, a mini level bar and a small scope of the engine's post-master analyser (the existing engine.analyser, no new AudioNode), labelled 'Output, relative level (dBFS)' and drawn on a canvas through charts/frame-loop.js, in the toolbar row and not in a column beside the graph, because the half-width card is about 584 px wide inside once F002's sidebar is open and the graph needs 552 px (the design's compact-fit-shell measurement in Node, 2026-10-29); where the Playground's Signal analysis already shows the waveform on the same screen, the cockpit shows the level bar only, so the page does not draw the same signal twice; the graph of G010 across the card's width; the timeline miniature of G006 below; and a one-line readout of the selected node or clip with 'Edit in Studio'. Below 640 px it is one column: header, a toolbar of Play, Stop, time and a level bar, the graph top to bottom, the miniature at 48 px, the selection line; nothing scrolls sideways. P002 places the card on the first screen (Q004 option A: beside the Pattern Sequencer); this slice makes it fit that half-width card (about 616 px outside and 584 px inside at 1536 px with F002's sidebar open, 712 px outside with it collapsed) and the full width of its other hosts. Before: VERIFIED 1516 x 133 px, body 70 px, 860 px of spacer, 0 px visible on the first view (inventory U1, U2). After: no wasted band; every row carries an instrument quantity. Negative cases: no AudioContext yet (the meter says 'Not running', never a flat line passed off as silence), MEASURE owns the output (the meter says so), reduced motion (the scope freezes to its last frame with a label). Rollback: revert; no model or record change."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
