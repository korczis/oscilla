acceptance_criteria:
- "tests/unit/studio-cockpit.test.mjs fails on the merge base: the cockpit's view model states the meter's three honest states (not running, measuring owns the output, relative level), the run state from runtimeView, and the selection line for a node, a clip and nothing."
- "The engine's node census is unchanged by the meter (it reads the existing analyser; project.audio-engine-discipline v2), asserted after stop in the cockpit suite."
- Its heading is h2 in the Playground and Sequencer outline (U13).
- "Definition of done, extends: the transport strip and miniature of G006, the renderer of G010, runtimeView of the Inspector, and the existing analyser and frame loop."
- "Definition of done, interlinks: Open in Studio, Edit in Studio and the overflow menu's items are declared links (G016 rows); the card has a component address (G007)."
- "Definition of done, interactivity: level and scope move only while the engine runs; the selection line follows the store."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md shows the card; the Help menu and the Keyboard shortcuts dialog list its keys. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: tests/browser/studio-cockpit.cjs gains 'cockpit-layout': at 1536x1024 (full width, and half width with the sidebar open and collapsed) and 390x844, in both themes and every gate browser from file:// and the sub-path, no element of the card is clipped, the page does not scroll sideways, Play by pointer, Enter and a hasTouch tap moves the meter within until() (deadline 'meter moves', 3 s) and Stop returns it to 'Not running'. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "The pull request carries a reviewer's verdict for the guarded paths it touches (project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (the template names its flowbite-pro reference.md section), recorded as migrated, never pending; it adds no osc-* class token, no legacy vocabulary use and no selector, removes the legacy ones it replaces, and the domain views' stylesheets gain nothing (compact density is Tailwind utilities on the domain view's own elements); the record's debt falls (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 3 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
