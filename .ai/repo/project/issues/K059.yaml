title: "Oscillator and contour node kinds, and the instrument wording test"
slug: oscillator-and-contour-node-kinds-and-the-instrument-wording
priority: p1
profile: implementation
objective: "Lands as feat(studio). Node types: vco (waveform sine, triangle, saw, square, pulse; scale 32', 16', 8', 4', that is octave -2..+1 against A4 at 8'; tune in cents, -1200..+1200; pitch and FM inputs in octaves; pulse width 5-95 % as a parameter that is not modulatable, the pulse built as a band-limited PeriodicWave of that width recomputed when the width changes, so it tracks pitch exactly; modulated width (PWM) comes with the worklet oscillator of K089, and the help says so), ring as its own node (src/js/studio/nodes/instrument.js: carrier and modulator AUDIO inputs, mode ring or AM) in place of a ring mode on the vco, and contour (attack, hold, release, invert; a gate TRIGGER input; a 0..1 CONTROL output from a ConstantSource ramped on the audio clock). Their adapters live in the category module K005 created (src/js/studio/adapters/instrument.js). Its wording test is tests/unit/synth-wording.test.mjs: the string literals of src/js/synth, src/js/studio/nodes/instrument.js, src/js/studio/adapters/instrument.js, src/js/studio/live-notes.js, src/js/studio/nodes/engines.js, src/js/studio/adapters/engines.js and src/js/studio/adapters/voices.js, the Synth markup of src/index.html and its Learn topic refuse product, brand and model names and analog-modelling words with the negation rules of tests/unit/no-fake-science.test.mjs, and every later instrument slice adds its modules to that scan. Before: the Studio has one generic oscillator with no octave, pulse width or ring mode, and no gate-driven control contour. After: vco and contour nodes with figures checked offline. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node type is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI. Amended 2026-11-03 after the M064 audit and the owner's decisions (oscilla-b0's AskUserQuestion): the vco is what is on main ('What's on main is enough (Recommended)': octave -2..+1, ring as its own node, no interval, mode or level parameter), the wording test is tests/unit/synth-wording.test.mjs and the browser check runs through tests/browser/synth.cjs under npm run test:studio, while the contour node type, its DSP figures, the offline figure suite and the wording fixtures stay criteria."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
current_state: "#329 added 23 381 B gzip (scripts/size-report.mjs, from its merge base) across its plan ids K058, K059 (part), K060, K061, K062, K063, K065, K066 (part), K103 (part), K104 and K106 (part); the figure is not split per issue. Q023 (answered by the owner on 2026-10-31: no line cap) sets no line cap, only the global gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29), and the aggregate is within it (dist/index.html 866 334 B gzip -9 at the head of #329); Q023 keeps each slice's own stated ceiling in force, so the per-issue cap is not proven for what shipped and applies to the remaining builds."
