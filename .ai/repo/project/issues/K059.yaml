title: "Oscillator and contour node kinds, and the instrument wording test"
slug: oscillator-and-contour-node-kinds-and-the-instrument-wording
priority: p1
profile: implementation
objective: "Lands as feat(studio). Two new node types: vco (waveform sine, triangle, saw, square, pulse; octave -3..+3; fine in cents; pulse width 5-95 % as a parameter that is not modulatable, the pulse built as a band-limited PeriodicWave of that width recomputed when the width changes, so it tracks pitch exactly; modulated width (PWM) comes with the worklet oscillator of K089, and the help says so; interval -24..+24 semitones; mode off or ring, ring multiplying by an AUDIO ring input; level) and contour (attack, hold, release, invert; a gate TRIGGER input; a 0..1 CONTROL output from a ConstantSource ramped on the audio clock). Their adapters live in the category module K005 created. It adds tests/unit/instrument-wording.test.mjs: the string literals of src/js/synth, src/js/ui/synth, src/js/ui/piano and the instrument node definitions refuse product, brand and model names and analog-modelling words with the negation rules of tests/unit/no-fake-science.test.mjs, and every later instrument slice adds its modules to that scan. Before: the Studio has one generic oscillator with no octave, pulse width or ring mode, and no gate-driven control contour. After: vco and contour nodes with figures checked offline. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node type is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
