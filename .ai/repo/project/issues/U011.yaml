- tests/unit/ui-flowbite-pro-baseline.json
- tests/browser/navigation.cjs
- tests/browser/app.cjs
- tests/browser/midi.cjs
- docs/ui-audit.md
- tests/README.md
- dist
depends_on:
- "F002"
- "F010"
- "H004"
acceptance_criteria:
- "Fail-first: tests/unit/duplicate-controls.test.mjs reads src/index.html and fails on the merge base. In the global chrome (header, tab bar, footer action bar), joined with each workspace's own toolbar, no two controls carry the same @click expression, no menu item calls setWorkspace for a workspace the tab bar already links, and exportAudio() is never called without an argument. The failure message names both hooks of each pair."
- "tests/unit/v4-shortcuts.test.mjs no longer asserts three openers of the help dialog. It asserts that exactly one control opens it in each workspace, and that the dialog is still the one #osc-dlg-help."
- "A check in tests/browser/navigation.cjs opens the Playground, the Sequencer, the Studio and MEASURE. In each, it collects the visible controls of the header menus, the tab bar and the footer, and asserts that no two share an action. It then drives each remaining entry (Export menu items, More > Import config, More > Settings, Help, the About tab, Save Preset) and asserts the download, dialog, workspace or notification each one reaches."
- "Every removed hook is gone from tests/unit/control-drive-baseline.json and tests/unit/no-inert-surfaces-allowance.json. node --test tests/unit/control-drive-baseline.test.mjs and node --test tests/unit/no-inert-surfaces.test.mjs pass, and no remaining control becomes undriven (project.no-inert-surfaces)."
- "The change adds no class token, selector, markup surface or inline style; it only removes legacy ones. tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes; the file is rewritten only where a count fell), and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro, project.visual-identity-lock)."
- "As a fix change, it carries a unit test that fails on the merge base and passes on the head (project.fail-first). It touches src/index.html, so it also carries a reviewer's verdict if project.review-verdict guards the path."
- "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs, with a named deadline (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, extends: the S074 'duplicate controls' symptom gains a ratchet that refuses a second control for an action already on screen."
- "Definition of done, interlinks: the objective names H004, F002, F010 and G001. The test file names U011, and the tests/README.md row names the symptom."
- "Definition of done, interactivity: each action keeps one working control in every workspace; the browser check above drives each one."
- "Definition of done, docs, menus and routes: docs/ui-audit.md records the one home of each action, and the menus change as stated. No route or URL-state key changes, and #m=about still opens About."
- "Definition of done, tested: node --test tests/unit/duplicate-controls.test.mjs, node tests/browser/navigation.cjs and npm test. tests/README.md has a row for each new test, dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often. The verified evidence names the main commit."
validation:
