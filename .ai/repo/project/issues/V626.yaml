title: Comments on the graph
slug: comments-on-the-graph
priority: p2
profile: implementation
objective: "P04 slice D (editing and undo invariants). Lands as feat(studio) with V601's schema step. A comment is a presentation object of the model (text, position, size, colour role) added by a key (K after V601's shortcut review) or the canvas menu, edited inline, moved with the selection, copied and pasted with nodes, never hashed (semanticState only); it is untrusted text on import (the import pipeline's caps) and is rendered with textContent."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
