acceptance_criteria:
- "Before: VERIFIED (S10): no comment object exists."
- "After: comments are presentation objects, undoable, never hashed."
- "Negative cases: a comment never becomes an execution input; oversized or markup-bearing text on import is refused or rendered as text."
- "Rollback: the reader lands with the writer and stays when the writer is reverted (the field is presentation state that an older reader would refuse), so a revert removes only the writer and documents saved while it was live still load; this is stated in the pull request."
- "tests/unit/studio-comments.test.mjs, failing on the merge base: add, edit, move, paste and delete are undoable; studioHash is unchanged by any comment; an oversized or script-bearing comment in an import is refused or rendered as text."
- "Definition of done, extends: V601's schema step and the presentation state of §163."
- "Definition of done, cross-links: comments survive save, load, patch export and import (round trip). The link is a row of tests/browser/integration-map.json once that map (synth line K075) is on main."
- "Definition of done, dynamics: a comment follows its selection while dragged."
- "Definition of done, docs and routes: docs/v31/user-guide.md and .ai/repo/features/studio-signal-graph.md say what changed; tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'comments' in tests/browser/studio-boxes.cjs adds a comment by keyboard and by pointer, types into it, waits with until() (deadline 'comment in the model', 2 s), saves and reloads the project and waits for the same text; drags it by touch; on the merge base no comment exists. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit and the completed evidence the release that carried it; E030's judge passes on the pull request once E030 is on main."
- "The pull request carries a reviewer's verdict (it touches a guarded path; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
- "Wave 2: its chrome is Flowbite Pro markup adapted from the matching Pro component, lands after F002, adds no osc-* class token or legacy selector, and studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration; the domain drawing stays OSCILLA's own inside Pro cards (project.ui-uses-flowbite-pro, project.visual-identity-lock v2; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 2 KB gzip added, with the base and head figures in the pull request body, within the owner's dist budget of 1 200 000 B gzip (decision of 2026-10-29, about 355 KB of headroom at origin/main b67d1e58); the ceiling of this line is 35 KB gzip in all (Studio boxes 35 KB, signal generator 25 KB), stated in the milestone (project.single-file-deliverable)."
