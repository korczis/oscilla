acceptance_criteria:
  - "The ADR amending ADR 0005 is recorded before any code of this issue lands."
  - "A held note sounds past the configured playback limit only while held, at or below the output ceiling, and every note is released on blur, visibilitychange to hidden and Escape, in a unit test that fails on the merge base."
  - "The keyboard is armed per view and never takes Space; the node census is 0 after release. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac) (project.suite-harness, project.bounded-test-timing)."
  - "Any new chrome is Flowbite Pro markup adapted from the matching Pro block and lowers or keeps the ratchet (project.ui-uses-flowbite-pro, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs); controls are Pro range sliders with number inputs; a continuous instrument parameter in the Synth workspace is the knob of K058 (D11, Q018, superseding D5 there)."
  - "The pull request carries a reviewer's verdict (src/js/audio and src/js/core/safety is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "The keyboard is armed per view in the Playground and the Studio (KEYBOARD_VIEWS) and plays nothing elsewhere; the link key kbd arms the view it opens; the on-screen keys are a canvas that lights the keys of every source (computer keyboard, pointer, MIDI input)."
  - "Once F002 and F003 are on main, the keyboard sits in its Pro card, whose grid placement replaces the inline order and grid-column that src/js/midi/keyboard-ui.js sets (review R-6 of pull request #299), and keyboard-ui.js sets no inline layout style; until then that placement is the stated interim."
  - "The keyboard is one component (src/js/midi/keyboard.js, keyboard-view.js and keyboard-ui.js) with the two-row computer-key layout (A W S E D F T G Y H U J K, Z and X octave, C and V velocity), asserted by tests/unit/keyboard-held-notes.test.mjs."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
