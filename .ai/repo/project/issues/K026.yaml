title: "On-screen and QWERTY keyboard on the V502 note voices, with held notes released on blur, hide and Escape"
slug: on-screen-and-qwerty-keyboard-on-the-v502-note-voices-with-h
priority: p2
profile: implementation
objective: "Lands as feat(midi). First an ADR amending ADR 0005 (D3): a held key or MIDI note is a user-held gesture exempt from the configured playback limit (ADR 0005: 0.5-5 s, default 2 s) while it is held, the output ceiling is kept, and release is forced on blur, hide and Escape. Then an on-screen and a QWERTY keyboard play the V502 note voices (8 notes at 1/8 gain, D4), armed per view, never taking Space (ADR 0050). On the owner's direction of 2026-10-29 the on-screen keys ship now as a canvas (data-osc keyboard.keys, drawn by src/js/midi/keyboard-ui.js), without waiting on F001-F003, and the keyboard is armed per view in the Playground and in the Studio (KEYBOARD_VIEWS; the link key kbd arms the view it opens). Until the keyboard moves into its Pro card, keyboard-ui.js places it in the main grid with an inline order and grid-column (keyboard-ui.js:217-218); once F002 and F003 land, the Pro card's own grid placement replaces them and the inline styles go. The QWERTY keyboard needs no chrome. The keyboard is one component (src/js/midi/keyboard.js for the layout, octave, velocity and held notes; keyboard-view.js and keyboard-ui.js for the canvas), with the computer-key layout of two rows from A (Z and X octave, C and V velocity), which K065 of intent connected-instrument binds to the Studio Keys node without a second component. In the Studio the computer keyboard and the on-screen keys play the same V502 note voices, armed on their own; the Wave 3 Keys node (K065) later binds the same component as a Studio note source."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
current_state: "Amended on 2026-10-29 after review R-1 of pull request #299 (reviewer dev-68): the owner's direction of 2026-10-29, quoted in that pull request, reads 'the keyboard / piano must be ergonomic, mapped onto the computer keyboard, super user-friendly, functional, connected to everything', so the on-screen keys ship now as a canvas and the keyboard is armed in the Playground and the Studio; the Pro card replaces the interim grid placement after F002 and F003."
