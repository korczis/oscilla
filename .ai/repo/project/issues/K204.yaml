id: K204
milestone: M064
serves:
  - "connected-instrument#knob-control"
title: "Knob typed entry: Escape cancels only the typing, and an out-of-range value is refused in the browser"
slug: knob-typed-entry-escape-cancels-only-the-typing-and-an-out-o
priority: p2
profile: implementation
objective: "Lands as test(synth). The Synth knob's typed entry (src/js/synth/ui.js:648-676) opens on Enter, commits on Enter or blur, cancels on Escape (finish(false)) and stops the key from reaching the page; an out-of-range value is refused with the knob model's parse reason. Nothing asserts either: no check that Escape cancels the typing only and leaves the value, the history and the page's own Escape untouched, and no browser check of a refused out-of-range typed value (tests/unit/synth-knob.test.mjs:47 covers the parser only). Adds both checks to tests/browser/synth.cjs. Before: the behaviour exists but nothing fails if it breaks. After: the gate holds it. Rollback: revert; tests only."
why: "Gap of K058 (criterion 3 and 4) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): no test that Escape cancels the typed entry, and no browser check of an out-of-range typed value. No owner direction re-scopes it, so it is its own issue and K058's criterion points here (chore/plan-m064-rescope). K058 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
scope:
  - "tests/browser/synth.cjs"
  - "src/js/synth/ui.js"
  - "tests/README.md"
  - "dist"
depends_on: []
acceptance_criteria:
  - "A browser check in tests/browser/synth.cjs (npm run test:synth, so CI and the release gate run it), in every gate browser: Enter on a knob opens the typed entry; typing a value and pressing Escape leaves the knob's aria-valuenow, aria-valuetext and visible value and the Studio store's undo depth unchanged, returns focus to the knob, and does not reach the page's Escape handler; typing an out-of-range value ('40k' on the 10-20000 Hz cutoff) and Enter leaves the value and undo depth unchanged and puts the registry's reason in the live region; each within a named until() deadline. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Test-only while the behaviour holds: the pull request body says 'fail-first: n/a' with the reason that the checks pin existing behaviour; a check that finds it broken makes the change a fix(synth) with a unit test that fails on the merge base and, src/js/synth being guarded, a reviewer's verdict (project.fail-first, project.review-verdict)."
  - "tests/README.md names the new checks in its row for tests/browser/synth.cjs; dist is rebuilt only if src changes, and npm run build:check passes."
validation:
  - "node tests/browser/synth.cjs"
  - "npm test"
evidence_required:
  - "verified"
