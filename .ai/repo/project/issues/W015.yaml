title: "DAW transport: a metronome scheduled on the audio clock, a count-in and record arm in the transport kind"
slug: daw-transport-a-metronome-scheduled-on-the-audio-clock-a-cou
priority: p3
profile: implementation
objective: "Lands as feat(audio). The transport kind gains metronome (TRANSPORT_SET { metronome }, a new transport field, not hashed into execution state; clicks scheduled on the audio clock from the transport's beat grid by an engine-owned, counted click source, at a stated relative level), count-in (one or two bars before PLAY, stated in the clock) and record arm (view state; shown only once K113's recording exists). Before: no metronome or count-in. After: the DAW transport. Negative cases: metronome while MEASURE owns the output (refused, stated); a tempo change mid-bar (the next click follows the new tempo); the node census after stop (0). Rollback: revert; a saved metronome flag is ignored by an older build's normalizer, stated."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
