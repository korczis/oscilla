acceptance_criteria:
  - "tests/unit/notes-record.test.mjs, failing on the merge base: the quantise function on exact, early, late and halfway hits; a take of n hits builds one CLIP_UPDATE with the n quantised notes and nothing else changed; a repeat hit on an on step keeps one note with the later vel; the three negative cases of the objective."
  - "tests/browser/drums.cjs gains the record check, failing on the merge base: armed and playing, three pad presses within a pass appear as three notes in the clip after Stop (deadline 'take in model', 2 s), and one Undo removes all three; it runs through tests/browser/lib/suite.cjs and tests/browser/lib/wait.cjs until() with named deadlines, assumes no sample rate and adds nothing to tests/browser/timing-baseline.json (project.suite-harness, project.bounded-test-timing)."
  - "All timing comes from the audio clock (the playhead), never a timer or rAF (project.audio-engine-discipline v2); every write is one undoable dispatch through the one Studio store (project.studio-model-is-canonical)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a feat change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 1.5 KB gzip added, under the gzip budget of scripts/build-config.mjs (project.single-file-deliverable); tests/README.md has its rows; dist is rebuilt and npm run build:check passes; it ships in the next release and its evidence names the main commit."
