objective: "Owner order of 2026-10-29: the landing must be easy to use, easy to extend, open to hack and extend-friendly. Write docs/EXTENDING.md from the code on main: adding a Studio node (defineNode, definePort, the parameter helpers, the compiler key, the adapter contract of adapters/nodes.js, NODE_DEFINITIONS and NODE_ADAPTERS, templates), a lab or workspace (mountLabs, WORKSPACES, routeOfHash), a chart (the shared onFrame loop and the chart hosts), a browser check (suite.cjs, until), what the single-file build forbids, and the rules a change satisfies, fail-first and the review verdict included. tests/unit/extending-guide.test.mjs fails when a path, export, rule, link or npm script the guide names does not exist, and compiles the guide's Polarity example node through createNodeRegistry and compileStudio. README opens with a landing (the Q002 sentence, the live page, three deep links that each cite their guaranteed claims, Extend it) whose links the same test decodes with the shipped routers."
why: "The guide is only useful while it is true; a guide checked by a test is the extend-friendly part of the owner's order that can be held. The landing's claims follow project.no-fake-science: each cites a guaranteed claim of docs/CLAIMS.yaml."
