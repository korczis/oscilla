objective: "Lands as fix(ui), in two PRs. 7a covers the guided flow: the Measure header keys (Frequency, Level, Expert), the seven steps with their labels and details, the primary and secondary actions (Check setup, Start measurement, Stop and the rest), and the Stimulus, Live input, setup summary and Calibration panels of src/index.html, with their view models in measurement/views/measure-flow.js and ui/measure. 7b covers the quality bar, the metric rows and the result views: quality-bar.js, response-chart.js, ir-chart.js, rta-chart.js, and the chart axis labels including RELATIVE LEVEL (dBFS-like, uncalibrated), which oscilla-43 found live on v3.41.2. Data, ids and stored records stay English. The calibration states keep going through calibration/display.js (U114 b), and the engine's and quality.js's report sentences stored in experiments are out of scope, as they are data. Agreed with oscilla-43 on 2026-11-17 (pass 7 is oscilla-0b's, U115 under M054); it follows oscilla-c3's open P3 on #590 (the surrounding Measure prose stays English)."
why: "Q104 (the app's visible prose is Czech): after U114 the Measure workspace still shows its guided flow, steps, panels, quality bar and result views in English around the Czech calibration states (oscilla-c3's P3 on #590; oscilla-43's live check of v3.41.2 at 1536 px)."
current_state: "Started 2026-11-17 by oscilla-0b in fix/czech-pass-7. 7a built by oscilla-0b in task t-20261117105351-fcaa on fix/czech-pass-7: the guided flow of #osc-view-measure (header keys, steps and their sr status words, primary, secondary and Stop actions, Stimulus, Live input, setup summary, Measurement setup with the expert fields, Calibration panel, Experiment save, definition and retention text), measure-flow.js (steps, details, actions, output levels NÍZKÁ, STŘEDNÍ, VYSOKÁ as shown names over the ids, safety and room notes, expert fields), the adapter (input rows, level texts, save reason, evidence notes, recipe-link notices) and core/url-state-measure.js recipe-link errors in Czech. Left for 7b and later: the quality bar and result views, the input chooser and TEST CONTEXT announcements (ui/measure/input.js, live.js), the save notices (saving.js), the level calibration dialog and the Studio template link text (cross-links derives it). 7b built by oscilla-0b in task t-20261117121956-fb24 on fix/czech-pass-7b (stacked on 7a): the Quality panel, the result views (response, IR, RTA: notes, summaries, series labels, axis labels, the readout), the result section, the level calibration and sign-convention dialogs, the input chooser, the TEST CONTEXT, live RTA and save notices and summarizeQuality's frame in Czech; the bar's items and values, the quality statuses, the UNAVAILABLE words and the views' badges stay English as data and are shown through measurement/views/display.js (measureShown), tested by tests/unit/measure-display.test.mjs. 7b also put the spectrum caption in Czech (RELATIVNÍ ÚROVEŇ (obdoba dBFS, nekalibrováno), with ADR 0017 given a trace line and no-fake-science v3 a display row). 7c built by oscilla-0b on fix/czech-pass-7c from oscilla-c3's four P3 notes on #597: the review step's detail through measureShown, the charts' empty note NEZMĚŘENO, the IR tail named 'šum na konci odezvy' everywhere (C3-607-1), adjective agreement (NORMALIZOVANÁ velikost, NAMĚŘENÁ impulsní odezva, zobrazena surová křivka). Landed: 7a by PR 593 (main merge 0b216245, v3.41.3), 7b by PR 597 (1f1a6183, v3.41.4), 7c by PR 607 (5bccf0f8, v3.41.5). Left English on purpose, as data: the reasons quality.js and engine.js store, measurement/announcements.js, smoothing and normalization labels, LEVEL_SCALE.label and the IR overlay of Experiments."
