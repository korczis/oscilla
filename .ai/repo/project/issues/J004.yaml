id: J004
milestone: M118
serves:
- "component-system#majordomus-served"
title: "A component with no plan link or no knowledge link fails: the links check and the rule that names it"
slug: a-component-with-no-plan-link-or-no-knowledge-link-fails-the
priority: p1
profile: implementation
objective: "Lands as feat(docs). tests/unit/component-links.test.mjs, run by npm test in the CI unit job, fails when a declared kind, catalogue component, Studio node type or parameter (and every kind and GL host the W and Y lines declare in the same registry) has an empty effective plan; names an id that does not resolve (J002's resolver); is listed in no generated record of J003 or in more than one; belongs to a record that is stale or whose relations name no rule and no ADR. Declarations that exist before it lands are listed in the unlinked section of tests/unit/ui-catalog-allowance.json (G001's shape), whose length only falls against the base branch's copy. The rule project.components-are-traced v1 (class blocking) lands in the same change: its statement is the test's, its # Enforcement names the test and how CI runs it, and .ai/repo/rules/project/README.md lists it (project.rules-name-their-enforcement). The enforcement is mutation-proven: the pull request body shows three mutations (a trace entry removed, an issue id changed to one with no file, a generated record deleted), each failing the test with its sentence, and the restored tree passing. Before: nothing fails when a component has no plan or knowledge link. After: the gate does. Negative cases: the three mutations; an allowance entry added (the length rises: fail). Rollback: revert the test, the allowance and the rule together."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs and knowledge base, interlink them and add more; knobs, sliders and control panels in one generic way, Majordomus integrated: each component and parameter declaration carries its intent, issue and rule ids, a deterministic generator projects the registry into .ai/repo/knowledge so that Majordomus serves it (context resolve, why, traceability), and a check fails when a component has no plan or knowledge link. Design: components-followup/majordomus-kb-adr.md of this plan change, measured with Majordomus 1.0.0-alpha.1 (the CI pin) and 1.0.0-alpha.8 on a throwaway copy of origin/main cdda563c."
scope:
- tests/unit/component-links.test.mjs
- tests/unit/ui-catalog-allowance.json
- .ai/repo/rules/project/components-are-traced.v1.md
- .ai/repo/rules/project/README.md
- tests/README.md
depends_on:
- J003
acceptance_criteria:
- "tests/unit/component-links.test.mjs fails on the merge base, and each of the three mutations above fails it with a sentence naming the declaration and what is missing."
- "tests/unit/knowledge-integrity.test.mjs passes with the new rule: it names enforcement that exists and CI runs, and the rules index lists exactly the rules in force."
- majordomus doctor and majordomus rules report the rule without a new finding under the pinned Majordomus.
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "It adds no class token, selector, markup surface or inline style, so tests/unit/ui-flowbite-pro-baseline.json stays equal (node scripts/ui-flowbite-pro-record.mjs --check and node --test tests/unit/ui-flowbite-pro.test.mjs pass) (project.ui-uses-flowbite-pro, ADR 0061)."
- "scripts/size-report.mjs shows 0 B gzip added: nothing it adds is under src/ or bundled (project.single-file-deliverable)."
- tests/README.md has a row for each new test.
- "Definition of done, extends: the trace (J002) and the projection (J003) become a gate."
- "Definition of done, interlinks: the rule relates to the decision of J001 and to project.rules-name-their-enforcement; majordomus knowledge related rule:project.components-are-traced lists the records."
- "Definition of done, interactivity: none: a check (stated)."
- "Definition of done, docs, menus and routes: the rules README lists the rule; the component contract decision of J001 gains a resolution note naming it; no route changes."
- "Definition of done, tested: the unit test and its three mutations (no browser surface; stated)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
validation:
- node --test tests/unit/component-links.test.mjs
- npm test
evidence_required:
- verified
