title: "Studio automation lanes: value axis, scheduled-value readout, playhead values"
slug: studio-automation-lanes-value-axis-scheduled-value-readout-p
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). Lanes get SVG tick labels with the unit from info.scale.ticks(); the kit's crosshair, dot and keyboard cursor with a readout \"1.250 s . 1.20 kHz\" from laneValueAt, which a unit test pins to scheduledValueAt(compileLaneEvents(...)) within 1e-6 relative, so the readout is what the transport schedules; the snapped time as a dashed tick named in the lane's legend; a playhead dot per lane moved by transform from timeline-editor.js's existing onFrame subscription (:25 and :579 on main), marked essential (K036) so Pause animation does not freeze it, and a head chip captioned \"scheduled\" (never AudioParam.value), its text changed only when it changes; a drag preview chip with a ghost of the original point; segments that pointProblem rejects drawn in the warning role with a hatch and the reason in the point title; a modulationRange band when an LFO or Random modulates the same parameter, with \"lane = base value; shaded = modulated range\"; lane colour by target node family from the node-family role set of K027's registry, validated in both themes and applied through the palette's classes, never a hex; playhead dots only on the compact timeline. New code goes into src/js/ui/studio/lane-readout.js (timeline-editor.js is 49 330 of 53 000 B). It imports src/js/studio/automation.js and edits nothing under src/js/studio. The lane host shadows Studio's arrow shortcuts and the timeline keys of transport-view.js KEY_HELP (Home, the arrows with Shift for fine, up and down) only while it has focus, and adds them by name to the kit's key test."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
