title: "One clip face, one count text and empty texts that tell the truth"
slug: one-clip-face-one-count-text-and-empty-texts-that-tell-the-t
priority: p2
profile: implementation
objective: "Lands as fix(studio-ui). D6, D11 and the text half of D10: a clip is labelled 'Tone 440 Hz' by the sequencer strip and the Studio timeline but 'Tone' by the embedded Studio (a11y.js clipLabel against timeline-view.js clipText); the counts read '1 connections' and '1 automation lanes'; the embedded Studio says 'No clips.' on Filter Automation, whose model has an automation lane. One clipFace(clip, model) -> { label, detail, kind } in src/js/studio/a11y.js serves the sequencer strip, the timeline, the embedded Studio and the screen-reader text; one studioCounts(model) with the existing plural() serves the embedded Studio, the Inspector and the graph header; the embedded Studio's empty texts say what the model holds ('1 automation lane, no clips'). Before: VERIFIED (compact-states.json). After: one text per fact. Negative cases: zero, one and many of each count; a clip whose node was deleted. Rollback: revert; text only."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
