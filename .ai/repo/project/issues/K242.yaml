acceptance_criteria:
  - "Fail-first: a browser check (synth.cjs) taps once in one task, stalls the main thread 450 ms, and hears the tap above -60 dB in firefox; it fails on main 5bbf69bc in firefox and passes in chromium, firefox and webkit after the fix."
  - "A unit case pins the re-anchoring: a gate whose open time has already passed when it is applied opens at the next render time and keeps its minimum length."
  - "iphone.cjs and synth.cjs stay green in all three engines."
