acceptance_criteria:
- "tests/unit/studio-edge-style.test.mjs fails on the merge base: every port type of the compatibility matrix has exactly one style, the graph and the embedded Studio read it, and portAnchor() places the Filter's cutoff input and its audio input at different points for Subtractive Synth."
- "The ratchet record shows studio.css's selectors equal and its declarations lower, and no osc-* name with a higher count (node scripts/ui-flowbite-pro-record.mjs --check)."
- "The compact visual references (tests/visual/studio/*-compact.png) are re-accepted through the visual gate with the reason."
- "Definition of done, extends: graph-geometry.js cablePath, which both views already share."
- "Definition of done, interlinks: the embedded Studio's cable is the same edge the full graph and its Inspector describe (one style table)."
- "Definition of done, interactivity: selecting a cable's target chip states the cable's type in the screen-reader summary."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md shows the edge legend once for both views. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'compact-cables' in tests/browser/v31-studio-graph.cjs reads the rendered path end points for Subtractive Synth and waits with until() (deadline 'compact cables drawn', 2 s) for the CONTROL and AUDIO ends at the Filter to differ, at 1536x1024 and 390x844. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
