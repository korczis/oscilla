id: G004
milestone: M085
serves:
- "component-system#embedded-cockpit"
title: "Cables keep their meaning in the embedded Studio: one edge style table and cables that end at their ports"
slug: cables-keep-their-meaning-in-the-embedded-studio-one-edge-st
priority: p2
profile: implementation
objective: "Lands as fix(studio-ui). D5 and U5 of the inventory: the full graph and the embedded Studio draw the same edge types with different dash arrays and widths (CONTROL 6 4 against 5 3, ANALYSIS 9 3 2 3 against 8 3 2 3, 1.5 against 1.25), and the embedded Studio's cables end at the chip edges, so in Subtractive Synth the LFO's CONTROL cable to the Filter cutoff enters at the same point as the Envelope's AUDIO cable. One edge style per signal type in studio.css serves both views: each pair of rules becomes one rule whose selector list names both (.osc-sg-edge.is-control .osc-sg-edge-line, .osc-sc-link.is-control), which keeps the domain view's selector count and lowers its declarations; compact.js keeps its own osc-sc-link names and never takes up an osc-sg-* name, because the ratchet counts every osc-* name per occurrence in the JavaScript text and a name used in one more place is a rise (the osc-sc-link selectors leave with G010). compact.js anchors each cable at its port: inputs on the chip's left edge and outputs on its right, at (index + 1) / (count + 1) of its height, computed from the registry's port lists by a pure function in graph-geometry.js; a PARAMETER port's cable ends at the parameter row. Before: VERIFIED in compact-default-1536-dark.png. After: a modulation cable is visibly a different line entering at a different point. Negative cases: a node with no ports, ten inputs, a port type the table lacks (the unit test fails instead of drawing it as AUDIO). Rollback: revert; presentation only."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
