id: E008
milestone: M046
serves:
  - "engineering-integrity#automation-transforms"
title: "One table-driven test for every automatable Studio parameter"
slug: one-table-driven-test-for-every-automatable-studio-parameter
priority: p2
profile: implementation
objective: "Add tests/unit/studio-automation-transforms.test.mjs, which enumerates every parameter the Studio node registry marks automatable and checks, from one table, its unit, scale, limits and the transform from automation value to AudioParam value. Write it against a main that contains the V272 fixes of #197 (plan issue V431): the detune and logarithmic offsets of #78 and, after V272, the A7 detune headroom bound (detuneCeiling, limitedLanes), the R-1 correction of a static detune lowered into the Nyquist headroom, and the B7 exponential-lane-plus-constant-offset path (tests/unit/v272-studio-automation.test.mjs, tests/unit/v431-studio-detune-lane.test.mjs). Each row's expected value is computed independently of the compiler, as an analytic value at two or more points (cents to frequency ratio, dB to gain, a linear or exponential lane at its ends and midpoint); a table generated by running the compiler would prove nothing. A parameter added to the registry without a row fails the test."
why: "Conversation 6ac1beb8, prompt 1 section 11: automation correctness from parameter descriptors with table-driven tests; descriptors exist (src/js/studio/nodes/common.js) but no single test covers every transform. The transforms move on #197, so a table written against main would encode the pre-fix behaviour (critique engineering-integrity, automation-table-oracle-and-v272)."
scope:
  - "tests/unit/studio-automation-transforms.test.mjs"
  - "tests/README.md"
depends_on:
  - "V431"
acceptance_criteria:
  - "The test fails when a registry parameter has no row, when a row names a parameter the registry lacks, and when the compiler's AudioParam value differs from the row's independently computed value at any of its points."
  - "The table covers a detune lane over a clamped static detune at 44.1 and 48 kHz (the case of V272 R-1)."
  - "npm test passes; tests/README.md has a row for the test (one appended row)."
  - "E015 registers the claim; this issue does not edit docs/CLAIMS.yaml or the intent."
validation:
  - "npm test"
evidence_required:
  - "verified"
