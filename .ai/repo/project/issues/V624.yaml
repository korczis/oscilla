objective: "P04 slice C (typed edge UX). Lands as feat(studio-ui). One canvas layer under the cable SVG draws, while the transport plays, each AUDIO cable's level as its stroke intensity and each CONTROL cable's current modulation value as a moving marker along it, read from the face views' taps (V621); one K036 subscriber, viewport-culled, nothing per frame in the DOM (project.audio-engine-discipline: draw loops do not touch the DOM per frame); static under prefers-reduced-motion (intensity only)."
