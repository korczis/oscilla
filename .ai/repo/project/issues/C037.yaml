acceptance_criteria:
  - "Fail-first: tests/unit/bus.test.mjs fails on the merge base: it starts each of the 8 players and asserts that each claims through the bus (the notes path and the audition claim nothing or claim three times today)."
  - "A static scan over src/js finds no start of sound outside the bus's claim (engine.play, noteOn, studioPlay, editor.play and the Synth arm call claim first), no window-level keydown handler for Escape outside the key registry, no pagehide/visibilitychange stop outside the bus, and no history.replaceState outside src/js/ui/navigation.js; a mutation re-adding one of each fails."
  - "cmp.seqPlaying, studioPlaying, synth.armed, isSounding and anySounding are reads of the bus's one 'playing' state; a unit test asserts the state changes in the same event as claim and release (no 150 ms poll)."
  - "tests/browser/app.cjs plays each player, presses Escape, the status-bar stop and hides the page, and waits with until() (named deadlines) for the bus to report nothing playing and the engine census 0, in Chromium, Firefox and WebKit through the suite harness."
  - "Risk named: K184 (a minimum gate on the shared note path, origin/chore/plan-nav-folds) and K178 (one Keys node, origin/feat/k178-*) change the same note path; whichever lands second rebases onto the bus's claim, and one lane owns src/js/midi/* meanwhile."
  - "Guarded paths (src/js/audio/*, src/js/studio/*, src/js/synth/*): prismatic-majordomus-98 writes the verdict; the src/js/ui/* and main.js part is judged by the second reviewer seat of Q091 once R031 lands. Lane: dev-53 with oscilla-26 for the Studio part."
validation:
