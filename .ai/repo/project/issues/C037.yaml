acceptance_criteria:
  - "Fail-first, against seams that exist on the merge base (no import of the new module): tests/unit/output-claims.test.mjs drives each of the 8 players through its existing entry (engine.play through withLabOptions, editor.play, the sequencer panel's onStart, the transport's play with an onClaimOutput spy, studioPlay, the Synth arm, engine.noteOn, the riff audition) with a recording claim function injected through the options those modules already take, and asserts exactly one claim per start naming the player; on the merge base it fails by assertion on engine.noteOn (no claim) and the audition (three claims)."
  - "A static scan over src/js finds no start of sound outside a claim: engine.play, engine.noteOn, studioPlay, editor.play and the Synth arm each call the bus's claim first; a mutation that removes one claim call fails the scan naming the file and line."
  - "The newest-action-wins rule of C002 and the measurement refusal hold for every player (one case each); tests/unit/output-owner.test.mjs and tests/unit/keys-registry.test.mjs pass unchanged."
  - "tests/browser/app.cjs starts each player and waits with until() (named deadlines) for the bus to name it as owner, in Chromium, Firefox and WebKit through the suite harness; tests/browser/touch-audio.cjs (project.a-phone-sounds, its gesture rule on) still sounds on a tap."
  - "Risk named: K184 (a minimum gate on the shared note path, origin/chore/plan-nav-folds) and K178 (one Keys node, origin/feat/k178-*) change the same note path; whichever lands second rebases onto the bus's claim, and one lane owns src/js/midi/* meanwhile."
  - "Guarded paths marked: src/js/audio/*, src/js/studio/*, src/js/synth/* (v2): prismatic-majordomus-98 writes the verdict; src/js/core/output-bus.js, src/js/ui/*, src/js/labs/*, src/js/sequencer/* and main.js are unguarded under v2 and judged by the screens seat of Q091 once R031 lands. Lane: dev-53 with oscilla-26 for the Studio part."
