  - "Every renamed label is renamed where other prose quotes it, in the same PR."
  - "npm test with GITHUB_BASE_REF=main, and every browser suite that reads a removed English string, pass; app a11y-phone-bars and ui-current pass in the linux amd64 container; a reviewer's verdict; visual references re-accepted with the reason."
