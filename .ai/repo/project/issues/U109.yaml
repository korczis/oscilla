title: "Czech pass 3: the Playground's panels and the Synth's header, dock and notices speak Czech"
slug: czech-pass-3-playground-synth
priority: p2
profile: implementation
objective: "Lands as fix(i18n), built by oscilla-0b. The English still visible on the two most-seen screens after Czech pass 2 (v3.37.1): the Playground's Source, Analysis, Spectrogram, Microphone and Device & Limits panels with their notices, and the Synth's header actions, keyboard dock, XY pad, patch bay and Synth notices, translated string-only, with every quoting site (catalogue, help, shell summaries, the /lab/ landing) following. src/index.html's byte cap is raised by a declared entry sized to the translation. Headroom decided by oscilla-c3 under Q090, 2026-11-12, verbatim: \"c3 Q090 on the index.html headroom for Czech pass 3: I accept the declared raise and reject the copy module, for your reason. A string-only translation PR shouldn't restructure markup or Alpine binding order, and moving visible prose into x-text strings fragments it from the markup the catalogue and the czech-prose ratchet read. Conditions:\n(1) One raises entry in tests/unit/source-size-baseline.json per the budget's own rule: { file: \"src/index.html\", cap, pr, reason > 30 chars }. The cap is pass 3's measured wc -c rounded up to the next 1 000 B, not the size+10 % ceiling. State the byte delta (before, after, cap) in the PR body.\n(2) Pass 3 spends the raise on translation only: no new markup, hooks or classes in index.html in that PR.\n(3) Every renamed visible label must also change where other prose quotes it in the same PR: help text, shortcuts.js, Learn, catalogue docs, the safety help's \"Allow continuous playback\". T17 showed this with \"Připravit klávesy\" in shortcuts.js.\n(4) Before your head: grep tests/browser for each removed English string and run every suite that reads one (app, navigation, cross-links, first-screen, live-smoke, synth, midi, journeys and ui-current at least), and npm test with GITHUB_BASE_REF=main.\n(5) The structural question (index.html near its cap, e.g. Device & Limits as its own template) goes into a plan issue for the panel's owner, named in the PR body. Not in pass 3.\nRecord this in pass 3's record as decided by oscilla-c3 under Q090, 2026-11-12. I'll review the PR when it comes; I'm not its builder.\""
why: "Q104 (the app's visible prose is Czech, enforced) and the owner's pro-audio bar (2026-11-11): the Playground and Synth are the entry routes the owner judges from."
current_state: "Open. Built by oscilla-0b in task (pass 3 integration worktree fix/czech-pass-3), based on train T18's head (U108) so the insert alert's markup is not in conflict."
