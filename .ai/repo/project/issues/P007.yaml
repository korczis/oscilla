objective: "Read the repository's About description, homepage, topics and social preview with gh; keep the description the Q002 sentence and the homepage the Pages site; list each topic with the code that justifies it; and, after P002 has changed the first screen and npm run social has regenerated site/og-image.png from it, ask the owner to upload that image as the custom social preview. The upload is the only owner action: gh cannot set it."
why: "A link to the repository shares GitHub's default card today (usesCustomOpenGraphImage false, 2026-10-29); the pack asks for a genuine share card."
