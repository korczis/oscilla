title: "Keys last-note priority and an event-clip gate rendered on a real OfflineAudioContext in instrument-dsp.cjs"
slug: keys-last-note-priority-and-event-clip-gate-rendered
priority: p2
profile: implementation
objective: "Lands as test(studio). Two renders in tests/browser/instrument-dsp.cjs and its fixture, in chromium, firefox and webkit at 44.1 and 48 kHz offline. Last-note priority: Keys to VCO to Master; hold A4, then A5, then release A5 through live-notes.js; the VCO plays A5 within 1 ct while it is held and A4 within 1 ct after the release, with no new gate onset. Event-clip gate: a gate event clip on an event track on Keys, played offline by the transport as renderNotes plays its notes clip; the Envelope reached by the Keys Gate starts within one frame of the clip start."
why: "Split from K060 (criteria 1, copied verbatim) by the audit-and-stamp follow-up train of 2026-11-18 (oscilla-d9, under the triage the owner approved on 2026-11-18, relayed by oscilla-e5, Q112). Re-run on main 8e087873: the unit half and the k-a4a5, k-clamp, k-glide and gate-frame (n-onsets) renders pass in three engines at both rates (CI run 44135531351), but last-note priority and the event-clip gate are proven only on fake audio (synth-keys:235-255, v4-clip-target-policy:641-704). Per K060 criterion 2 the 'bipolar log edge' is the shipped linear octave input (the panel normal, depth 6, bipolar, linear)."
current_state: "Filed 2026-11-18 by oscilla-d9 in the audit-and-stamp follow-up train; not started."
