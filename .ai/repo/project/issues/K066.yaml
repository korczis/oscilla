title: "Instrument picker, waveform quick select and quick presets beside the piano"
slug: instrument-picker-waveform-quick-select-and-quick-presets-be
priority: p1
profile: implementation
objective: "Lands as feat(synth). Beside the piano: a Pro dropdown of every node with the notes or hits capability in the model (Synth panels, the drum kit with keys mapped to voices once K073 lands, engines once they land) plus New Synth voice; choosing one routes the note router to it as one history entry. A Pro button group selects the waveform of the selected oscillator (sine, triangle, saw, square, pulse with its width knob, and noise as the Mixer's noise level) through NODE_PARAM_SET. Quick presets are factory panel patches (data in src/js/synth/presets.js) applied by PATCH_REPLACE through src/js/studio/patches.js. All three are views of the store. The picker also lists 'Signal generator', a link to the Generator workspace (owner decision of 2026-10-29, planned with the studio-siggen line) when that workspace is in app.js WORKSPACES, with its integration-map row; whichever of the two lands second adds the link. Before: the piano's target and the waveform are reached through other views. After: a picker, a waveform group and quick presets beside the piano. User-value tier 2 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/ui/synth"
  - "src/js/synth"
  - "tests/unit/ui-flowbite-pro-baseline.json"
  - "tests/browser/integration-map.json"
  - "tests/unit/synth-picker.test.mjs"
  - "tests/browser/piano.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
