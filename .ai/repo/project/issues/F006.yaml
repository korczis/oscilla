acceptance_criteria:
  - "ui-flowbite-pro.cjs asserts the three workspaces are Pro chart and stat cards with no legacy chrome class at both sizes, in every gate browser from file:// and the sub-path, and that each chart re-themes on the theme toggle."
  - "npm run test:labs, test:dsp and test:browser pass with no behaviour check changed."
  - "References for the three workspaces are added or updated through the visual gate with the reason; the ratchet baseline is lower; dist's size is stated and within BUDGET."
validation:
