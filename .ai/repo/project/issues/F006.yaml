title: "Analyzer, Filter Lab and Compare on Pro components"
slug: analyzer-filter-lab-and-compare-on-pro-components
priority: p2
profile: implementation
objective: "Rebuild the three Analyze workspaces from Pro components: each analysis view a Pro chart card (reference.md sections 7 and 8: header with title and actions, the chart, a footer with the range or source picker as a Pro dropdown), the readouts as Pro stat cards with tabular numerals, the filter controls (type, cutoff, Q) as Pro form controls, the layout a Pro grid (gap-4, 2xl:col-span-2 for the wide chart) that U004 and U005 extend with their before/after spectrum and their links. The charts keep their axes, units and signal palette and re-theme on the theme change as they do today (src/js/charts/chart-theme.js). Remove the legacy selectors these views no longer use, lower the ratchet baseline, keep every data-osc hook and id."
why: "Owner, 2026-10-28: the whole interface on Flowbite Pro. The audit (A05 to A07) found Filter Lab and Compare a third empty; U004 and U005 lay them out on this markup."
