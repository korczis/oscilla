title: "Collapse and expand are first-class: per box, selection and graph, and a mute toggle on the face"
slug: collapse-and-expand-are-first-class-per-box-selection-and-gr
priority: p2
profile: implementation
objective: "P04 slice D (editing and undo invariants). Every parameter is on the face (owner decision Q031 of 2026-10-29), so folding is first-class: a box collapses to its title, ports, primary parameters (V619) and live view, or expands to every section; commands collapse and expand the focused box, the selection and the whole graph (keys listed in STUDIO_SHORTCUTS, toolbar and box chrome by Pro buttons with aria-expanded); the state is presentation (node metadata), saved, undoable, never hashed. The face carries V614's box mute as a toggle. V620 adds the knobs inside the expanded sections and lands after this slice; bypass (K022) is a box-menu item of V623."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
