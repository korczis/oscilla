acceptance_criteria:
  - "A unit test on the mock context: play in hold, setNoteOffRelease(2), release(): the fade ramp ends at t + 2; step envelopes scheduled afterwards keep the play-time release; a plan-type _restart after the edit keeps 2; it fails on the merge base."
  - "Browser check `release-edit-while-held` in tests/browser/app.cjs: for #osc-set-release with the Envelope off and for #osc-env-release-value with it on, set 2000 ms while holding: 300 ms after letting go the output is above 30% of the held level, measured by condition polls on the audio clock."
  - "A limited voice never ends later than its hard-limit endTime after the edit (unit test)."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/audio/audio-engine.js (project.review-verdict); the builder never writes it."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
