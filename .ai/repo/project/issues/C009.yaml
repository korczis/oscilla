id: C009
milestone: M090
serves:
  - "coherent-state#live-edits-reach-the-voice"
title: "A release time edited while a note is held is the one used when it is let go"
slug: a-release-time-edited-while-a-note-is-held-is-the-one-used-w
priority: p1
profile: implementation
objective: "Lands as fix(audio). Findings engine-sync-9 and dead-controls-8. engine.play copies the release time into v.release at note start (audio-engine.js:446) and release() fades over it; neither the Envelope lab's onChange nor the Settings Release field (instrument.js setEnv) tells the sounding voice. Release 300 ms edited to 2 s while held is silent 0.5 s after letting go (2 s set before the note: -3.0 dB); Settings 30 -> 2000 ms while held leaves 0.061 s at release. Add one engine method, for example setNoteOffRelease(s): only while this.voice exists, is not releasing and has not ended, it sets v.noteOff = max(0.005, s) and updates v.opts (releaseS, or adsr.r on a copied adsr) so a _restart keeps it; release() fades over v.noteOff ?? v.release. v.release itself stays, so the step envelopes scheduler.js:139 tops up and the RELEASING notice keep their play-time value, and no AudioParam is written while held (V249). Call it from the existing instrument-to-engine sync next to engine.updateLive in main.js with the effective value (the ADSR r when the Envelope lab is on, else app.release / 1000); add no second $watch writer in instrument.js. _releaseVoice still refuses a release past the hard-limit endTime. A line under the Settings fields says 'Attack applies from the next note; release also applies to a held note'."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
