acceptance_criteria:
  - "tests/unit/synth-patch-bay.test.mjs, failing on the merge base where the behaviour is new: for every jack pair of the panel the verdict equals canConnect plus full-model validation of the batch the drop would dispatch, so the High-pass, Low-pass and Output audio inputs show as replaceable while normalled; the derived colour of two modules differs and is one of the validated set; a drop and a Delete each produce one BATCH with the normal change (project.fail-first; if every verdict already equals the batch's on main, the body says 'fail-first: n/a' with that measurement)."
  - "Negative cases, each asserted in that file: an incompatible drop (refused with the validator's sentence, model unchanged); a feedback cable (refused with the no-silent-feedback sentence); a drop on empty panel (no action); a second cable into a single input (replaces the first, one BATCH)."
  - "src/js/synth is guarded (project.review-verdict v2): a non-builder's verdict in .ai/repo/reviews/<pr>.yaml."
  - "tests/README.md has a row for the new test; dist is rebuilt and npm run build:check passes."
