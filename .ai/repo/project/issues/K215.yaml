objective: "Lands as fix(synth). The bay judges a drop by canConnect plus jackReason (src/js/synth/ui.js:150-170, src/js/synth/normals.js:135), not by full-model validation of the whole batch the drop would dispatch (the cable plus the normals it breaks), which K063's objective requires because a probe that adds the trial edge without removing the normal shows a single-input normalled jack as refused. Judges each jack pair once per drag on that batch and adds tests/unit/synth-patch-bay.test.mjs with K063's unit cases. Before: the verdicts are judged on the trial edge. After: on the batch the drop dispatches. Rollback: revert the pull request; no saved state depends on it."
why: "Gap of K063 (criterion 1 and 2) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): tests/unit/synth-patch-bay.test.mjs does not exist and the jack verdicts are not judged on the whole batch. No owner direction re-scopes it, so it is its own issue and K063's criterion points here (chore/plan-m064-rescope). K063 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
