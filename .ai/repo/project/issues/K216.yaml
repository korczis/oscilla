id: K216
milestone: M064
serves:
  - "connected-instrument#patch-cables"
title: "Patch bay: dragging a cable's plug off its jack removes the cable and restores its normal"
slug: patch-bay-dragging-a-cable-s-plug-off-its-jack-removes-the-c
priority: p1
profile: implementation
objective: "Lands as feat(synth). K063 removes a cable by Delete or by a drag-off; on main only Delete and the Remove buttons do. A plug dragged off its jack past the drag threshold and dropped on no jack removes the cable as one BATCH that restores the jack's normals (normals.js), the cable following the pointer while dragged. Before: a cable can be removed only by Delete or a button. After: also by pulling its plug off. Rollback: revert the pull request; no saved state depends on it."
why: "Gap of K063 (criterion 1) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): a drag-off does not remove a cable. No owner direction re-scopes it, so it is its own issue and K063's criterion points here (chore/plan-m064-rescope). K063 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
scope:
  - "src/js/synth/ui.js"
  - "src/js/synth/view/bay.js"
  - "tests/unit/synth-patch-bay.test.mjs"
  - "tests/browser/synth.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K215"
acceptance_criteria:
  - "tests/unit/synth-patch-bay.test.mjs, failing on the merge base: a drag-off of a cable's plug produces one BATCH (the EDGE_REMOVE plus the restored normals), one history entry, whose undo re-patches the cable; a drag that returns to the same jack changes nothing (project.fail-first)."
  - "A browser check in tests/browser/synth.cjs, in every gate browser: a pointer drag and a touch drag of a plug off its jack remove the cable from the bay and from the Studio graph at the same revision and show the jack normalled, each within a named until() deadline. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "src/js/synth is guarded (project.review-verdict v2): a non-builder's verdict."
  - "tests/README.md names the new checks; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/synth-patch-bay.test.mjs"
  - "node tests/browser/synth.cjs"
  - "npm test"
evidence_required:
  - "verified"
