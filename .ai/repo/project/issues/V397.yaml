title: "Optional context overlays on the response chart's frequency axis"
slug: optional-context-overlays-on-the-response-chart
priority: p2
profile: implementation
objective: "Offer overlays on the measured response chart, off by default: the nominal human hearing range (with the record's caveat that 20 Hz-20 kHz is a convention, src/js/data/bioacoustics.js), a speech band, musical note frequencies and the bioacoustics species ranges with their citations; each names its source, none changes data, and every overlay draws on the frequency axis only: a species threshold or any level criterion is drawn in the level dimension only when a valid level calibration applies (ADR 0017), since the chart's level axis is otherwise relative. It follows V396 because both change the response chart and its views."
