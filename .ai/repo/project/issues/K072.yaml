id: K072
milestone: M066
serves:
  - "connected-instrument#drum-machine"
title: "Drum voices: clap, toms and perc"
slug: drum-voices-clap-toms-and-perc
priority: p1
profile: implementation
objective: "Lands as feat(studio). Node types drum-clap (band-passed noise with three short pre-bursts and a decay), drum-tom (sine with a pitch envelope, low, mid and high tunings) and drum-perc (a two-operator linear FM blip with its index stated), each with the hits capability, a trigger input and an AUDIO output, built like K071's. Before: only three drum voices. After: clap, toms and perc. User-value tier 2 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node types is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/studio/nodes"
  - "src/js/studio/registry.js"
  - "src/js/studio/adapters"
  - "src/js/audio"
  - "tests/browser/instrument-dsp.cjs"
  - "tests/unit/drum-voices-2.test.mjs"
  - "tests/browser/drums.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K071"
acceptance_criteria:
  - "tests/unit/drum-voices-2.test.mjs, failing on the merge base, asserts on StudioFakeContext (tests/unit/sequencer-fake-audio.mjs) the scheduled calls, times, ramps and node census; tests/browser/instrument-dsp.cjs, rendering a real OfflineAudioContext in Chromium, Firefox and WebKit at each context's own rate (in the style of tests/browser/dsp.cjs) and failing on the merge base, checks the figures: the clap has its three pre-burst onsets at the stated spacing within one frame; each tom's fundamental after the sweep is at its tuning within 1 %; the perc's first FM sideband matches J1/J0 of its stated index within 1 dB; each decays to -60 dB rel within 10 % of its stated decay."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a tom tuning above 0.95 x Nyquist."
  - "A browser check in tests/browser/drums.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: the three voices appear in the Signal Path and as hits targets. Real-time: a hit raises the voice's meter tap, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: each type is added by pointer, keyboard and touch, with accessible port names. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Every pinned template studioHash is unchanged: it adds node types, ports, capabilities, enum options or clip kinds only, never a parameter on an existing node type (D2, K022)."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/audio and src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/drum-voices-2.test.mjs"
  - "node tests/browser/drums.cjs"
  - "node tests/browser/instrument-dsp.cjs"
  - "npm test"
evidence_required:
  - "verified"
