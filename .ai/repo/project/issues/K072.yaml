title: "Drum voices: clap, toms and perc"
slug: drum-voices-clap-toms-and-perc
priority: p1
profile: implementation
objective: "Lands as feat(studio). Restated 2026-11-09 (D1, D4, agreed by oscilla-2e and oscilla-43 on the mesh): the clap (band-passed noise with three short pre-bursts and a decay) and the low, mid and high toms (a sine with a pitch envelope) are voices of the one percussion engine (perc-voice, K123), with K071's per-voice decay, tune, level and choke group; the perc is a new voice of it, a two-operator linear FM blip with its index stated (a 1000 Hz sine carrier swung by a sine at 0.35 x its frequency, index 1) on pitch class 11 (B), which played the second noise-hit key before. Before: no FM voice and the clap and toms unchecked in real renders. After: clap, toms and the FM blip with checked figures. User-value tier 2 of 4 (synth-design.md section 17). Rollback: revert the pull request; B then plays the noise hit again."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/studio/nodes"
  - "src/js/synth"
  - "src/js/studio/registry.js"
  - "src/js/studio/adapters"
  - "src/js/audio"
  - "tests/browser/instrument-dsp.cjs"
  - "tests/browser/fixtures"
