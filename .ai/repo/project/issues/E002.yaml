objective: "Split src/js/ui/measure.js (115 572 bytes and 2 503 lines on main at 044f98a and at d4bd97f, where #197 merged; measure again with wc -c at the start commit) along its responsibilities (for example: setup and input selection, the run flow, result views, calibration panel, experiment saving, the test seam) into modules under src/js/ui/measure/, each under 40 000 bytes, with no behaviour change and no framework; src/js/ui/measure.js stays the module its importers import, so no other file under src/js/ui changes; lower or remove its cap in tests/unit/source-size-baseline.json in the same change. Since #197 (d4bd97f), scripts/review-verdict.mjs guards src/js/ui/measure.js as a single file (V272 D5); extend that guard to the new modules in the same change, so the code that decides what MEASURE runs and saves stays a guarded path."
