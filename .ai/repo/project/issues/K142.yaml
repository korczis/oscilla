title: "The on-screen, QWERTY and MIDI keyboard play the generator"
slug: the-on-screen-qwerty-and-midi-keyboard-play-the-generator
priority: p2
profile: implementation
objective: "Lands as feat(ui). With 'Follow keyboard' armed in the Generator workspace, a note from the on-screen or QWERTY keyboard (K026) or MIDI (V501, V502) sets the generator's frequency (one note source) and holds it while the key is held, under K026's held-note rules (released on blur, hide and Escape, output ceiling kept)."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings G1-G14 measured on origin/main b67d1e58)."
scope:
- src/js/ui/workbench.js
- src/js/core/instrument.js
- src/index.html
- tests/unit/generator-keyboard.test.mjs
- tests/browser/generator.cjs
- tests/README.md
- dist
depends_on:
- K138
- K026
acceptance_criteria:
- "Before: PROPOSED dependency: K026's keyboard is not on main."
- "After and negative cases: as the objective and the criteria below state; the setpoint (what was requested) and the observation (what the analyser measured on the digital output, or the microphone on the room) are separate readouts with separate labels, and no readout claims the acoustic output."
- "Rollback: revert the merge commit. Nothing changes the schema, a studioHash, URL key meaning or stored preset, so documents saved while it was live load unchanged after the revert."
- "tests/unit/generator-keyboard.test.mjs, failing on the merge base: a note event sets the frequency of that note at the current A4, release on blur, hide and Escape, no note taken while unarmed."
- "Definition of done, extends: K026's keyboard and V502's note voices."
- "Definition of done, cross-links: the keyboard's note and the Generator's note echo agree (one note source). The link is a row of tests/browser/integration-map.json once that map (synth line K075) is on main."
- "Definition of done, dynamics: the readout and spectrum follow each key live."
- "Definition of done, docs and routes: README.md's Playground feature list and docs/GLOSSARY.md where a term is new; .ai/repo/features/playground.md (or the feature record of the Playground) says what changed; tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'keys' in tests/browser/generator.cjs arms Follow keyboard by pointer, presses the QWERTY key for A4 and waits with until() (deadline 'generator at 440 Hz while held', 3 s); taps a piano key in a hasTouch context; blurs the page and waits for release; on the merge base the switch does not exist. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit and the completed evidence the release that carried it; E030's judge passes on the pull request once E030 is on main."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Wave 2: its chrome is Flowbite Pro markup adapted from the matching Pro component, lands after F002, adds no osc-* class token or legacy selector, and studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration; the domain drawing stays OSCILLA's own inside Pro cards (project.ui-uses-flowbite-pro, project.visual-identity-lock v2; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, within the owner's dist budget of 1 200 000 B gzip (decision of 2026-10-29, about 355 KB of headroom at origin/main b67d1e58); the ceiling of this line is 25 KB gzip in all (Studio boxes 35 KB, signal generator 25 KB), stated in the milestone (project.single-file-deliverable)."
validation:
- node --test tests/unit/generator-keyboard.test.mjs
- node tests/browser/generator.cjs --only keys
- npm test
