objective: "Lands as fix(measure). buildPhaseView joins points across the +180/-180 jump, so each wrap draws a full-height line that is not data: the phase descriptor in src/js/measurement/views/response-chart.js gets wrapDeg 360 and a pure wrapBreaks(values) (indices where |delta| > 180), and measure-charts breaks the path there. Wrapped degrees only. Unwrapped phase and group delay are V395 (M047, intent measurement-extensions#phase-group-delay), which already settles their algorithm questions; this plan change adds K039 to V395's depends_on, so the unwrapped series lands on the fixed path. V397's context overlays change the same response chart on the frequency axis only; they share no function with this fix and rebase over it. The Magnitude | Phase | Both view is K055. It adds no markup; it waits on F004 because F004 rebuilds the same files (src/js/measurement/views and measure-charts.js) and re-accepts the same visual-measure references, a shared-file edge, not a chrome gate."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
