depends_on:
  - "K167"
acceptance_criteria:
  - "tests/unit/keyboard-dock-yield.test.mjs, failing on the merge base: the dock state is a pure function of (route, note owner): a pad owning the notes collapses it at every size and pointer (amended 2026-11-05 from 'a coarse pointer under 768 px' after the owner's screenshot of that day), the keys owning them dock it; changing the owner changes the state in one step."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a collapsed dock expanded by the user stays expanded until the owner changes; the keys' held notes are released when the dock collapses (the keyboard's fold release: its own inputs, never the XY pad's note, review of #425); no surface sets the dock state directly (a grep test)."
  - "Browser: tests/browser/xy-pad.cjs at 390x844 in chromium and webkit (iPhone 13 and SE sizes): on the XY tab with the pad playable (K183: it owns the notes once mounted) the whole pad is inside the first viewport, nothing covers it (elementFromPoint at its corners and centre is the pad), the keyboard handle is visible below it, the first tap on the pad sounds (engine analyser), a computer key held while the pad owns the notes sounds (engine analyser), and the handle expands the keys by tap and by keyboard; at 1536x1024 and 1280x720 the dock folds to its handle too and nothing covers the pad (the owner's screenshot of 2026-11-05: the dock covered the pad's lower part at 1536x1024); unfolded, the pad stays whole above the dock (its height follows the room: 100dvh less the chrome and --osc-dock-h) with the on-screen keys shown (amended 2026-11-05 after the review of #425: the keys are drawn wherever the dock is docked, routes.js keysShown, the same rule, so the XY tab with no pad owning the notes shows them), and a note the pad holds keeps sounding through an unfold and a fold. Inside tests/browser/lib/suite.cjs with named until() deadlines (project.suite-harness, project.bounded-test-timing, project.a-phone-sounds)."
  - "The pull request carries a reviewer's verdict (src/js/synth is guarded under review-verdict v2; project.review-verdict) and, as a feat change, a unit test that fails on the merge base (project.fail-first). Its chrome is Flowbite Pro utilities with no osc-* class token, legacy selector, inline style or stylesheet (project.ui-uses-flowbite-pro)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/keyboard-dock-yield.test.mjs"
  - "node tests/browser/xy-pad.cjs"
  - "npm test"
evidence_required:
  - "verified"
