title: "The docked keyboard yields to the surface that owns the notes, so a pad is never under it on a phone"
slug: the-docked-keyboard-yields-to-the-surface-that-owns-the-notes
priority: p2
profile: implementation
objective: "Lands as feat(synth). Found in K167's screenshots at 390x844 (2026-11-03): on a phone the docked keyboard (src/js/midi/keyboard-ui.js, fixed at the bottom, its height in --osc-dock-h) takes about 40 % of the XY tab and hides the pad below the fold, so a pad that is the instrument is not playable at once. One rule (src/js/midi/routes.js dockState, applied by src/js/midi/dock-yield.js alone, which keyboard-ui.js mounts) decides the dock's state from the workspace's route and which surface owns the notes, derived from the mounted surfaces' claims (K167's mountSynthXy, playable from the first touch since K183), never from a per-page flag: when a pad owns the notes, at every size, the dock collapses to a one-line handle (its toggle in the K153 key registry, its state announced) that the user can expand; when the keys own the notes it docks as today. The rule lives in one place; the XY tab and the live landing's hero (oscilla-21's P012) both inherit it. Before: the dock covers the pad. After: the whole pad is in the first viewport with the keyboard handle below it."
why: "Owner orders of 2026-11-03 (the OSCILLOPAD pack's phase 2 'pad and mobile UX: playable from the first open on a phone'; the live landing 'playable on a phone at once'); oscilla-21 asked for it as one rule in the dock rather than a fix in two surfaces and measures the result on the landing (P012)."
