acceptance_criteria:
  - "tests/unit/v31-studio-transport.test.mjs, failing on the merge base, on its fake engine: arm, make the full-document apply refuse, call start(), then dispatch an edit; after the fix the runtime is idle, a 'state' event with playing false and reason 'play-refused' has fired, debugInfo().lastError names the refusal, and the divergence verdict is 'not-applied' (today: runtime running, transport stopped, verdict 'behind'). The same holds for a refused output claim and for a throw from the armed branch's later steps."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a PLAY refused while NOT armed is unchanged; a successful PLAY after arm still promotes the armed run without a gap; an apply that throws inside syncNow is retried at the next wake-up (lastRevision is not advanced past an unapplied revision)."
  - "Browser: a check in tests/browser/v31-studio-workflows.cjs arms the Studio, forces a PLAY refusal through a documented test hook (no fault injection into page internals beyond that hook), edits a node, and asserts within a named until() deadline of tests/browser/lib/wait.cjs that the Play control is not pressed, the reason is announced in the live region, the runtime census is 0, and the Inspector does not show 'behind'. Inside tests/browser/lib/suite.cjs, assuming no sample rate (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a fix change, a unit test that fails on the merge base (project.fail-first). It adds no markup, class token or stylesheet (project.ui-uses-flowbite-pro)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
