title: "A PLAY refused while armed stops the runtime and says so, so the Studio never stays 'behind' with its edits unapplied"
slug: a-play-refused-while-armed-stops-the-runtime-and-says-so
priority: p1
profile: implementation
objective: "Lands as fix(studio). Owner defect of 2026-11-03 (relayed by prismatic-majordomus-1d and oscilla-b0): on a 26-node patch the Inspector showed LFO 1 'not in runtime' in the state 'behind' with no refusal of that revision, and it never caught up. Reproduced on main c3045229 (oscilla-26's investigation, probe C): with the Studio armed (transport.arm(), as the Synth keys or MIDI do), a PLAY that is refused after startNow's armed branch has set playing = false and left armed mode (src/js/studio/transport.js about lines 1589-1611: the output claim, the apply refusal, or a throw from applyStop or setOwnedParams) returns while the runtime keeps running the armed graph and emits no 'state' event; from then on admitNow treats every edit as stopped (not-applied), sync() returns early, the wake-up does not run, and studioDivergence sees a running runtime, so the state stays 'behind' and the UI still shows the Studio playing until Stop. The fix routes every failure after the armed branch, and a throw (try/finally), through one helper that stops the runtime fast when it still runs and emits 'state' { playing: false, reason: 'play-refused' } with the refusal kept in debugInfo, restoring the invariant that a running runtime means a playing or armed transport. Also, syncNow records lastRevision only after runtime.apply returns, so an apply that throws is retried at the next wake-up rather than lost. Before: an armed PLAY refusal leaves a running runtime under a stopped transport. After: the runtime stops, the UI and the Inspector say why, and the next edit is not stranded."
why: "Owner defect of 2026-11-03 on https://korczis.github.io/oscilla/#m=studio, the Inspector's 'Not in the running graph: the last update was refused' on LFO 1 with no refusal of that revision; oscilla-b0's C027 made the text state-aware and found the state was 'behind' with no refusal; oscilla-26's investigation reproduced it through an armed PLAY refusal (scratchpad sync-stall/probe2.cjs, probe C) and ruled out a sync stall on large patches (300- and 400-operation random edit runs on two 26-node patches converged every time)."
