title: "THD and THD+N at a stated fundamental, bandwidth and notch"
slug: thd-and-thd-n-at-a-stated-fundamental
priority: p2
profile: implementation
objective: "First weigh, in docs/v3/algorithms.md, the two ways to get harmonic distortion: a new stepped-sine stimulus (a new stimulus kind, capture and result type in src/js/measurement/engine.js) or the harmonic impulse responses the existing log sweep already separates in time (Farina; the inverse-filter oracle of ADR 0021), and build the one the record chooses. Compute THD from harmonics 2 to N below 0.95 x Nyquist and THD+N with the fundamental removed by a stated notch (its width in bins or Hz), both in a stated measurement bandwidth (20 Hz to the lower of 20 kHz and 0.95 x Nyquist unless the record states another), reported beside the floor of the same chain measured with the stimulus silent (the noise capture transfer.js already uses for SNR); a harmonic above the safe maximum is left out and the result says so; the figure is the chain's distortion at that level and setup, never the speaker's; the spread is the run-to-run spread where runs repeat. A new stimulus joins the measurable kinds only with this measurement. It follows V392 because both extend the stored result schema and the result views."
why: "V3 MEASURE specification sections 4 and 90-92 (docs/specs/oscilla-v3-measure.md); conversation 6abec18d, 2026-10-02T03:15:06Z."
