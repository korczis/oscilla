title: "Transport kind: the Studio's transports share one set of labels, titles and shortcuts, with tap tempo"
slug: transport-kind-the-studio-s-transports-share-one-set-of-labe
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). transport-bar.js is declared as the transport kind (props keys, tempo, timeMode, tap, density; events to transport-commands.js), mounted by the timeline strip and the compact Studio (G006) with the same labels, titles and aria-keyshortcuts; role=toolbar with roving focus; the clock a W002 readout; on a phone Play, Stop, Loop and the clock in one row and the rest in a Pro overflow dropdown. Tap tempo (the Tap button, Enter on it): the mean of the last four taps within 2 s, clamped to TEMPO_RANGE, one TRANSPORT_SET per tap series, in the kind's pure model so K068 reuses it. Before: VERIFIED three Studio transports with different labels, Loop as text in one, Return missing in one, titles and shortcuts in one (inventory D1). After: one transport kind. Negative cases: a refused play while MEASURE owns the output (stated); Loop with no loop region; a tap series beyond the tempo range (clamped, stated); Space inside the toolbar (the workspace's, never the kind's). Rollback: revert. Merged plan of the component follow-up (2026-10-30): tapTempo(taps, now) is pure and returns { taps, bpm }; the tap series is held by the owner (view state of the surface), never by the kind. K068 calls this function instead of a second tap-tempo rule (K068 depends on W006)."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
