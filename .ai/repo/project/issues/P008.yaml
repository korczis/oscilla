acceptance_criteria:
  - "A unit test that fails on the merge base and passes on the head proves each of the two parts names a route of the entry-path inventory and that the route opens its workspace (project.fail-first)."
  - "tests/browser/public-entry.cjs passes in Chromium, Firefox and WebKit, from file:// and the sub-path, at 1536x1024 and 390x844, dark and light: each way is reachable by keyboard with visible focus, opens its workspace, and no AudioContext starts and no getUserMedia call is made before a press; with --live it opens every README landing deep link on the deployed site."
  - "tests/unit/ui-flowbite-pro.test.mjs's ratchet does not grow; live-smoke still passes; the visual references change only for the first screen, with a reviewer-written verdict for every guarded path the change touches (project.review-verdict); a claim in docs/CLAIMS.yaml names the new suite."
  - "The gzip delta is measured and at most 10 000 B, counted against the headroom Q014 divides; npm run social regenerates site/og-image.png if the first screen's pixels changed."
  - "No new route, no second HTML file, no microphone prompt on entry, and Q004's layout unchanged."
validation:
  - "node tests/browser/public-entry.cjs"
evidence_required:
  - "verified"
