title: "The live landing's parts lead to their full workspaces, proven from the README and the deployed site"
slug: the-parts-q004-placed-on-the-first-screen-lead-to-their-full-workspaces
priority: p3
profile: deep-work
objective: "Re-targeted on 2026-11-03 from the parts Q004 placed (superseded by Q089) to the live landing M122 builds. Add tests/browser/public-entry.cjs, which proves that the landing's hero and each of its derived workspace cards leads into its full workspace through the hash dispatcher, by pointer, keyboard (visible focus) and touch, in dark and light themes, starting no audio and asking for no microphone or MIDI permission until pressed; with --live it opens every README landing deep link on the deployed site, and the README's deep links name the landing. The targets are read from the workspace registry and the entry-path inventory, never a new hand-written list."
why: "The owner's prompt pack (2026-10-29) asks for an entry from GitHub into real workspaces; since Q089 (2026-11-03) that entry is the live landing, so the proof follows it from the README to the deployed workspaces."
scope:
  - "src"
  - "dist/index.html"
  - "tests/browser/public-entry.cjs"
  - "tests/browser/live-smoke.cjs"
  - "tests/visual"
  - "tests/unit"
  - "tests/README.md"
  - "docs/CLAIMS.yaml"
  - "site/og-image.png"
  - ".ai/repo/project/issues/P008.yaml"
depends_on:
  - "P012"
acceptance_criteria:
  - "A unit test that fails on the merge base and passes on the head proves each landing card and the hero names a route of the entry-path inventory or the registry and that the route opens its workspace (project.fail-first)."
  - "tests/browser/public-entry.cjs passes in Chromium, Firefox and WebKit, from file:// and the sub-path, at 1536x1024 and 390x844, dark and light: each way is reachable by keyboard with visible focus, opens its workspace, and no AudioContext starts and no getUserMedia call is made before a press; with --live it opens every README landing deep link on the deployed site."
  - "tests/unit/ui-flowbite-pro.test.mjs's ratchet does not grow; live-smoke still passes; the visual references change only for the first screen, with a reviewer-written verdict for every guarded path the change touches (project.review-verdict); a claim in docs/CLAIMS.yaml names the new suite."
  - "The gzip delta is measured and at most 10 000 B, counted against the headroom Q014 divides; npm run social regenerates site/og-image.png if the first screen's pixels changed."
  - "No second HTML file, no microphone or MIDI prompt on entry, and every deep link of the inventory resolving as before."
validation:
  - "node tests/browser/public-entry.cjs"
evidence_required:
  - "verified"
