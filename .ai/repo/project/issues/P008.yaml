title: "The parts Q004 placed on the first screen lead to their full workspaces"
slug: the-parts-q004-placed-on-the-first-screen-lead-to-their-full-workspaces
priority: p3
profile: deep-work
objective: "Add no new band, preview or copy to the first screen: Q004 already places the positioning sentence as its heading, Signal analysis, a full-width Guided measurement row and the compact Studio, and the owner declined a guided path there ('No, not now'). Make the Guided measurement row and the compact Studio each carry one visible, labelled way into their full workspace (Measure, Studio) through the hash dispatcher, its target read from the entry-path inventory P002 commits rather than a new hand-written list, starting no audio and asking for no microphone until pressed; and add tests/browser/public-entry.cjs, which proves those ways and, with --live, the README's landing deep links on the deployed site."
why: "The owner's prompt pack (2026-10-29) asks for an entry from GitHub into real workspaces; Q004 keeps the Playground as root, so the entry is the parts the owner already chose, made to lead somewhere."
scope:
  - "src"
  - "dist/index.html"
  - "tests/browser/public-entry.cjs"
  - "tests/browser/live-smoke.cjs"
  - "tests/visual"
  - "tests/unit"
  - "tests/README.md"
  - "docs/CLAIMS.yaml"
  - "site/og-image.png"
  - ".ai/repo/project/issues/P008.yaml"
