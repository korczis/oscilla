acceptance_criteria:
  - "tests/unit/synth-keys.test.mjs, failing on the merge base, asserts on StudioFakeContext (tests/unit/sequencer-fake-audio.mjs) the scheduled calls, times, ramps and node census; tests/browser/instrument-dsp.cjs, rendering a real OfflineAudioContext in Chromium, Firefox and WebKit at each context's own rate (in the style of tests/browser/dsp.cjs) and failing on the merge base, checks the figures: a keys node driving a vco through a bipolar log edge of depth 6 octaves plays A4 at 440 Hz and A5 at 880 Hz within 0.1 cent; at vco octave +3, note 0 tracks exactly and note 127 is clamped at 0.95 x Nyquist with the clamp stated, and every note below the clamp keeps exact tracking (no kc scaling of a pitch edge); a glide of 100 ms reaches the new pitch within 1 cent at 100 ms +- one render quantum; a gate starts the contour at the scheduled frame within one frame; last-note priority returns to the held note on release; an event clip on the keys node gates it at its start."
  - "Releasing on blur, visibilitychange to hidden and Escape leaves no held note and a node census of 0 after stop, in the same test with the router's injected window events."
  - "project.review-verdict v2 is recorded and majordomus doctor passes before any code lands; src/js/synth (the note router now, the panel model from K061) then joins GUARDED in scripts/review-verdict.mjs, with a fixture of tests/unit/review-verdict.test.mjs proving a change under it needs a verdict; because the base branch's list applies, a later slice's verdict claim for src/js/synth holds only once K060 has merged, which their depends_on ensures."
  - "tests/unit/v4-clip-target-policy.test.mjs gains the keys row and still proves that store, timeline UI, transport and offline render agree for every node type and clip kind."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a note held over blur, hide or Escape; a note outside 0-127; a second simultaneous note under last-note priority."
  - "A browser check in tests/browser/synth-nodes.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a keys node added in the Studio is offered as a target of an event clip in the timeline and of the note router. Real-time: a note sent through window.OSCILLA's existing Drive surface for the Studio (no new seam member) reaches the runtime pitch value and opens the gate, read back from the runtime's debugInfo, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the keys node is added by pointer, keyboard and touch, and its outputs carry accessible names ('Pitch control output', 'Gate trigger output'). Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Every pinned template studioHash is unchanged: it adds node types, ports, capabilities, enum options or clip kinds only, never a parameter on an existing node type (D2, K022)."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/studio and scripts/review-verdict.mjs and src/js/synth is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
