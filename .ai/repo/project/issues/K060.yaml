title: "Keys node: the one note source, with exact pitch CV and gates on the audio clock"
slug: keys-node-the-one-note-source-with-exact-pitch-cv-and-gates
priority: p1
profile: implementation
objective: "Lands as feat(studio). The Keys node that intent playable-instrument's Wave 3 named and never issued: a keys node type with outputs pitch (CONTROL over the source range [-6, 6] octaves relative to A4, so that a bipolar log edge of depth 6 octaves has edge gain a = 1 and moves a frequency by exactly one octave per octave of note, compiler.js routing semantics), gate (TRIGGER) and velocity (CONTROL 0..1), parameters glide (ms), transpose (semitones), priority (last, low, high; monophonic, D4), key range low and high (notes 0-127, for splits and layers) and chord (off, or a chord shape in the pattern's scale), the last three declared now and applied by K116, so no hash epoch is needed later, and the registry capability notes. Its adapter exposes notes(t, { note, vel, gate, slide }) and release(t), applied on the audio clock by the transport (event clips on it gate it from this slice) and by src/js/synth/note-router.js, the only place that applies live notes; the router releases every held note on blur, hide and Escape (D3) through the engine's release path. A pitch edge (a CONTROL edge from a keys pitch output) is exempt from computeBases' downward scaling of a log edge's gain (kc), which would change the tracking ratio of every note; its frequency is clamped at 0.95 x Nyquist instead, the clamp stated in debugInfo and on the card. The clip-target policy (src/js/studio/clip-targets.js) gains the keys row: event clips gate it. src/js/synth joins GUARDED through project.review-verdict v2, recorded before any code (the rule's statement enumerates the guarded paths and tests/unit/review-verdict.test.mjs pins them), with the repository's CLAUDE.md enumeration updated in the same change. Before: nothing turns a note into pitch and gate in the Studio. After: a keys node whose pitch CV is exact and whose gates sit on the audio clock. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node type is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
