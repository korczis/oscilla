title: "Keys node: the one note source, with exact pitch CV and gates on the audio clock"
slug: keys-node-the-one-note-source-with-exact-pitch-cv-and-gates
priority: p1
profile: implementation
objective: "Lands as feat(studio). The Keys node that intent playable-instrument's Wave 3 named and never issued: a keys node type with outputs pitch (CONTROL over the source range [-6, 6] octaves relative to A4, so that a bipolar log edge of depth 6 octaves has edge gain a = 1 and moves a frequency by exactly one octave per octave of note, compiler.js routing semantics), gate (TRIGGER) and velocity (CONTROL 0..1), parameters glide (a linear glide in exact time: the pitch arrives in exactly the glide time), transpose (semitones), priority (last, low, high; monophonic, D4), key range low and high (notes 0-127, for splits and layers) and chord (off, or a chord shape in the pattern's scale), key range low and high declared and applied now, chord declared by K116 with the piano zones that play it (amended 2026-11-06 at review of #447: a chord parameter that plays nothing would be an inert control under project.no-inert-surfaces, so K116 takes it with its own hash epoch), and the registry capability notes. Its adapter exposes notes(t, { note, vel, gate, slide }) and release(t), applied on the audio clock by the transport (event clips on it gate it from this slice) and by the note router src/js/studio/live-notes.js (fed by src/js/midi/notes.js and the synthSink of src/js/synth/ui.js), the only place that applies live notes; every held note is released on blur, hide (src/js/midi/ui.js) and Escape (src/js/synth/ui.js) (D3) through the engine's release path. A pitch edge (a CONTROL edge from a keys pitch output) is exempt from computeBases' downward scaling of a log edge's gain (kc), which would change the tracking ratio of every note; its frequency is clamped at 0.95 x Nyquist instead, the clamp stated in debugInfo and on the card. The clip-target policy (src/js/studio/clip-targets.js) gains the keys row: event clips gate it. src/js/synth joins GUARDED through project.review-verdict v2, which lands with Train 4 (the rule's statement enumerates the guarded paths and tests/unit/review-verdict.test.mjs pins them), with the repository's CLAUDE.md enumeration updated in the same change; because the synth code landed before that guard, an independent reviewer who built none of it writes a separate retroactive verdict on the existing src/js/synth code (owner decision 'Retroactive review', 2026-11-03). Before: nothing turns a note into pitch and gate in the Studio. After: a keys node whose pitch CV is exact and whose gates sit on the audio clock. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node type is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI. Amended 2026-11-03 after the M064 audit and the owner's decisions (oscilla-b0's AskUserQuestion): the router is src/js/studio/live-notes.js, the browser check runs through tests/browser/synth.cjs under npm run test:studio, the wording test is tests/unit/synth-wording.test.mjs, glide is 'Linear glide in exact time' and the guard 'before any code' became 'Retroactive review' with review-verdict v2 landing with Train 4, while exact tracking, the clamp statement, key range and chord, the clip-target row, the blur and hide test and the 0-127 refusal stay criteria."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
current_state: "#329 added 23 381 B gzip (scripts/size-report.mjs, from its merge base) across its plan ids K058, K059 (part), K060, K061, K062, K063, K065, K066 (part), K103 (part), K104 and K106 (part); the figure is not split per issue. Q023 (answered by the owner on 2026-10-31: no line cap) sets no line cap, only the global gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29), and the aggregate is within it (dist/index.html 866 334 B gzip -9 at the head of #329); Q023 keeps each slice's own stated ceiling in force, so the per-issue cap is not proven for what shipped and applies to the remaining builds."
