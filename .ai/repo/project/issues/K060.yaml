acceptance_criteria:
  - "tests/unit/synth-keys.test.mjs, failing on the merge base, asserts on StudioFakeContext (tests/unit/sequencer-fake-audio.mjs) the scheduled calls, times, ramps and node census; tests/browser/instrument-dsp.cjs, rendering a real OfflineAudioContext in Chromium, Firefox and WebKit at each context's own rate (in the style of tests/browser/dsp.cjs) and failing on the merge base, checks the figures: a keys node driving a vco through a bipolar log edge of depth 6 octaves plays A4 at 440 Hz and A5 at 880 Hz within 0.1 cent; at vco scale 4' (octave +1, the highest of K059's -2..+1), note 0 tracks exactly and note 127 is clamped at 0.95 x Nyquist with the clamp stated, and every note below the clamp keeps exact tracking (no kc scaling of a pitch edge); glide is linear in exact time (owner decision 'Linear glide in exact time', 2026-11-03): a glide of 100 ms reaches the new pitch within 1 cent at 100 ms +- one render quantum, rendered at 44.1 kHz and at 48 kHz, in a test that fails on the merge base (the shipped glide is an exponential approach with time constant glide / 3); a gate starts the contour at the scheduled frame within one frame; last-note priority returns to the held note on release; an event clip on the keys node gates it at its start."
  - "A tracking test proves exact pitch tracking from a keys node into a vco: three notes two octaves apart (A2, A4 and A6) each within one cent of 440 x 2^((note - 69) / 12) Hz, rendered on an OfflineAudioContext at 44.1 kHz and at 48 kHz; no test on main proves this today (tests/unit/synth-review-329-round2.test.mjs checks the edge map's slope of 1.00 oct per octave on fake Web Audio, and s-track of tests/browser/synth.cjs two notes one octave apart within one FFT bin), and only once it passes may the objective's log-edge mechanism be reworded to the shipped linear octave input (the oscillator's octave CV)."
  - "Failing on the merge base: the keys registry entry (src/js/studio/nodes/instrument.js) declares key range low and key range high with their defaults (chord moved to K116, amended 2026-11-06), and the note clamp is stated in debugInfo and on the card; the studioHash of a document saved before the change is unchanged (if adding them changes existing hashes, that is a hash epoch and the pull request says so)."
  - "Releasing on blur, visibilitychange to hidden and Escape leaves no held note in src/js/studio/live-notes.js and a node census of 0 after stop, in the same unit test, which injects those window events into the shipped release path (src/js/midi/ui.js, src/js/synth/ui.js) with the Synth armed."
  - "A retroactive review of src/js/synth at the main commit after Train 4 lands, by a session that built none of it (oscilla-21 is asked), files its findings, and no P0 or P1 finding stays open (owner decision 'Retroactive review', 2026-11-03)."
  - "project.review-verdict v2 lands with Train 4 and majordomus doctor passes: src/js/synth then joins GUARDED in scripts/review-verdict.mjs, with a fixture of tests/unit/review-verdict.test.mjs proving a change under it needs a verdict (it fails on the merge base), and every file that enumerates the guarded paths (CLAUDE.md today) names it; because the base branch's list applies, a later slice's verdict claim for src/js/synth holds only once that change has merged."
  - "tests/unit/v4-clip-target-policy.test.mjs gains the keys row and still proves that store, timeline UI, transport and offline render agree for every node type and clip kind."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a note held over blur, hide or Escape; a note outside 0-127; a second simultaneous note under last-note priority."
  - "A browser check in tests/browser/synth.cjs (or a new suite added to the test:studio script of package.json), run by npm run test:studio (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a keys node added in the Studio is offered as a target of an event clip in the timeline and of the note router (src/js/studio/live-notes.js). Real-time: a note sent through window.OSCILLA's existing Drive surface for the Studio (no new seam member) reaches the runtime pitch value and opens the gate, read back from the runtime's debugInfo, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the keys node is added by pointer, keyboard and touch, and its outputs carry accessible names ('Pitch control output', 'Gate trigger output'). Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Every pinned template studioHash is unchanged: it adds node types, ports, capabilities, enum options or clip kinds only, never a parameter on an existing node type (D2, K022)."
  - "Every string it adds passes tests/unit/synth-wording.test.mjs (K059's wording test): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "Each pull request of the slice carries a reviewer's verdict (src/js/studio and scripts/review-verdict.mjs are guarded, and src/js/synth once review-verdict v2 has landed; project.review-verdict): .ai/repo/reviews/329.yaml and .ai/repo/reviews/367.yaml for what landed through #329 and #367, a new one for the remaining criteria; and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test (the shipped tests in its rows for browser/synth.cjs and the synth-* unit tests, each new one its own or a named place in those rows); dist is rebuilt and npm run build:check passes."
