acceptance_criteria:
  - "tests/unit/cross-links.test.mjs fails when a lab's Studio link names a template that is not shipped, an address the router does not open to Studio, or text other than the template's title, and when a Learn tool names a topic or workspace that does not exist."
  - "tests/browser/cross-links.cjs, in chromium, firefox and webkit from file:// and /oscilla/, follows every new link by pointer, keyboard and touch: it opens its workspace with the state it names, focus lands on the workspace heading, Back returns and Forward reopens; it fails on the merge base."
  - "With unsaved Studio changes, neither a lab's template link nor the Sequencer's pattern link replaces the document."
  - "No new class name, no inline style and no Flowbite Pro debt growth (tests/unit/ui-flowbite-pro.test.mjs)."
