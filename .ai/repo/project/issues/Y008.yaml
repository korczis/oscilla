title: "Renderer setting, routes and the hackable surface: a Settings choice, deep links to each GL view, the guide and the Learn links"
slug: renderer-setting-routes-and-the-hackable-surface-a-settings
priority: p2
profile: implementation
objective: "Lands as feat(ui). Settings gains a Pro select 'Live view renderer: Automatic | Canvas 2D only' (stored as oscilla.v2.renderer in localStorage, like the theme; an unreadable store means Automatic), and each GL host's summary line names its backend and reason from OSCILLA.charts.renderers() ('Drawn with WebGL 2'; 'Canvas 2D: WebGL unavailable'). Routes, through the one hash dispatcher (ADR 0045): the analysis spectrogram in 3D and the Phase & Stereo XY view each have a deep link, refused and removed when the backend cannot draw them, with the sentence. docs/renderers.md gains a worked example that adds a small GL view in under a hundred lines against the contract, the ?gl= values, the context budget and how to test both backends; README's feature list and Testing table name the GL views and suites; the Learn spectrogram and phase topics link to the views. Where the integration map exists (the session's K075 draft), each new link is a row of it."
why: "Owner orders of 2026-10-29 (session oscilla-b0, in Czech): add p5.js, WebGL and interactivity and deploy; plan WebGL renderers for the scrolling spectrogram (with a 3D option), a phosphor XY scope and a live spectrum, falling back to canvas/p5 when WebGL is unavailable, one frame loop with no per-frame allocation, the single file and its gzip budget, axes and units from the analysis (no-fake-science). Built on the M062 charts plan (#269, merged as cdda563c): the frame loop K036, the interaction kit K053, the shared zoom K052, the level history K033 and the chart-cost check of K036 are reused, never duplicated (components-followup/render-gl.md)."
