objective: "P04 slice F (visual, keyboard and responsive). Lands as feat(studio-ui). The Templates dialog and the patch and project library show a thumbnail of each graph, drawn on a canvas from its model (node boxes by category colour, cables by type) by a pure layout of src/js/ui/studio/graph-thumb.js; a corrupt record shows its refusal reason instead. The thumbnail is aria-hidden; the card's text names the node count and the signal path."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
