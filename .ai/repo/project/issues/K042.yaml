title: "Findings evidence point pinned on the experiment chart"
slug: findings-evidence-point-pinned-on-the-experiment-chart
priority: p3
profile: implementation
objective: "Lands as feat(experiments). A click, a tap or Enter on the focused detail chart calls experimentsEvidenceAt(hz), which snaps to the stored grid point through resultPoint (Enter is not a global key: shortcuts.js binds it only on Hold and Trigger); a pin marker \"EVIDENCE 1.000 kHz (stored grid point)\" is drawn only when evidence.point exists, from a small marker-descriptor helper with its own test; Escape clears the cursor and propagates. \"Show on chart\" for a value reference in Findings opens through the existing verified Open path, then pins the point, and refuses an unverifiable reference with the stated reason. Mini-plots inside the Findings list are not built (OD9: each row would need a verified store.get under the integrity contract of review 3 of #149; no slice waits on that question)."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
