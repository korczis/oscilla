acceptance_criteria:
  - "A unit test that fails on the merge base: the marker descriptor carries the exact grid-point frequency and exists only when evidence.point does."
  - "tests/browser/v3-ui.cjs: a click at x and Enter at the keyboard cursor each set #osc-x-ev-hz to the grid point's exact Hz; the marker is drawn; \"Show on chart\" refuses an unverifiable reference with its reason. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer's verdict (src/js/ui/experiments.js and src/js/ui/findings.js are guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3) and after F005 placed the card it sits in; no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "The pin appears only after an interaction, so no default reference moves; the Experiments compare scene of K041 is re-accepted if it does."
  - "scripts/size-report.mjs shows at most 1 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
