acceptance_criteria:
- "As a feat change it carries tests/unit/gl-phosphor.test.mjs: the new-sample count from the clock delta at 44.1 and 48 kHz, clamped to fftSize; the decay factor over one second is exp(-1 / tau) within 1 % for frame intervals of 1/60, 1/120 and 1/144 s; the RGBA8 floor subtraction reaches 0 from 255 in a bounded number of frames; the M/S rotation maps (L, R) = (1, 1) onto the M axis and (1, -1) onto the S axis, as K035's grid states, which fails on the merge base (project.fail-first)."
- "tests/browser/gl-parity.cjs: a stereo test tone at a known L/R ratio draws its density maximum within 1 px of the CPU reference line; with tau Off the accumulation holds only the last window; a context loss shows K034's 2D view with the stated reason. Every GL check states per gate browser and OS whether it drew on WebGL 2, WebGL 1 or was skipped, with the reason Y001 recorded for that leg (no leg claims a GL path it did not draw), and the same check runs with ?gl=0 on every leg and passes on the Canvas 2D path. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
- "tests/browser/chart-cost.cjs gains the phosphor XY rows: its GL subscriber is a frame-loop subscriber with its host (K036) and allocates nothing per tick (Chromium CDP heap sampling over a polled window, the per-tick ceiling of tests/browser/chart-cost-baseline.json not raised); its draw calls per frame are counted by the gl.cjs spy and stay at the stated figure; its main-thread time per frame (median and p95 of performance.now() around the subscriber) is recorded for the GL and the Canvas 2D path in tests/browser/chart-cost-baseline.json, with both figures in the pull request; the GL path is the automatic choice only where its median is not above the 2D path's, otherwise the 2D path stays automatic and the baseline says why; nothing is drawn while the host is hidden or Pause animation is on."
- "Its chart hosts enter tests/unit/chart-host-census.json as done in this change, each carrying data-osc-chart and its backend list, and the table-driven pass of tests/browser/charts-interaction.cjs holds for each (role=group host with the summary and the snapshot data table, role=application plot surface with aria-roledescription \"interactive chart\", visible focus ring, ArrowRight moves the cursor one step and the polite region announces once after the keys settle, Escape clears the cursor and still reaches the page's stop, Space keeps its workspace meaning (ADR 0050), a tap pins the cursor on touch); the GL canvas is aria-hidden like every drawing canvas (K053)."
- "Levels say dB relative (dBFS-like) unless a valid LevelCalibration applies; every axis, tick, unit and caption comes from the analysis descriptor axesOf() and never from a constant (the static scan of tests/unit/gl-views-wording.test.mjs finds no sample-rate, Nyquist or dB-range literal under src/js/charts/gl); no data value is tweened or eased; every string it adds is registered in its chart's wording table and passes tests/unit/charts-readout-wording.test.mjs; the word waterfall is never displayed (D7; it stays a search alias only) (project.no-fake-science)."
- Persistence Off is the default under reduced motion and the control states why (project.no-inert-surfaces).
- "Chart chrome (toolbar, toggle, badge, tooltip, readout row, marker table) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles and after the card issue of its workspace placed the card; no osc-* class token or legacy selector is added, no name of the new modules or strings carries an osc- prefix, and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs and node scripts/ui-flowbite-pro-record.mjs --check). The GL canvas is a domain view inside the card."
- "The view reads existing AnalyserNodes or the CPU-held analysis data on the main thread only, creates no audio node, adds no work to the audio path and writes no DOM per frame (project.audio-engine-discipline v2)."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed."
- "The owner's definition of done, one item each: extends the K035 goniometer with a GPU persistence view; interlinks the phase lab's K035 correlation meter and goniometer modes on one host (markers join in Y007, the deep link in Y008); interactive: cursor readout of L, R, M, S and density; amplitude zoom; tau choice; markers; docs, menus and routes: the Phase & Stereo card's toolbar, docs/renderers.md, the Learn phase topic link; tested with pointer, keyboard and touch; deployed by merge commit under project.deploy-often (Pages deploys on the merge)."
- "Designed at 390x844 first: every check runs at 390x844 and at 1536x1024, touch targets are at least 44 px, and each gesture has a pointer, a keyboard and a touch path."
- "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the Y line's figures stays within the component line's cap Q037 records, under the gzip budget of scripts/build-config.mjs (1 000 000 B on main at b67d1e58, 1 200 000 B once #279 lands; project.single-file-deliverable)."
- "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
