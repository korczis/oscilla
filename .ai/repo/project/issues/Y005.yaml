title: "Phosphor XY view: the K035 goniometer on WebGL with sample-density persistence, stated decay, zoom and cursor"
slug: phosphor-xy-view-the-k035-goniometer-on-webgl-with-sample-de
priority: p2
profile: implementation
objective: "Lands as feat(charts). A GL backend for the live L/R view of the Phase & Stereo lab, keeping K035's semantics (the X/Y and M/S modes, the stated scale and the window 'last 21 ms, 1024 samples' from fftSize and sampleRate) and K034's Canvas 2D view as its twin. Each frame the new samples since the last frame are drawn once: their count is the audio-clock delta times the context's sampleRate, clamped to the analyser's fftSize, and labelled estimated, because two analysers are read in turn and are not sample-aligned (correlation.js says the same). Samples are read into preallocated Float32Arrays with getFloatTimeDomainData and uploaded with bufferSubData; they are drawn as a line strip with additive blending into an accumulation framebuffer (RGBA16F where a float or half-float colour buffer exists, otherwise RGBA8 with a one-step floor subtraction so a trace decays to zero instead of sticking), which a decay pass multiplies by exp(-dt / tau) with the measured frame interval, so persistence is the same at 60, 120 and 144 Hz. Brightness is sample density: the caption says 'Brightness: samples per pixel over the last tau (display persistence), not level'. tau is a Pro button group Off | 50 | 200 | 1000 ms; Off and reduced motion show the last window only, as K035's afterglow off does. Zoom is the amplitude scale x1, x2, x4, x8 through K052's zoom-math on both axes together, with the badge 'x4: full scale is off-screen'. The kit's crosshair and keyboard cursor read L and R (or M and S) in +-1 relative at the cursor position, and the density at that pixel as a count; Enter pins a marker (Y007). The model mode (fA != fB, no live L/R) keeps its 'model' label and draws without persistence."
why: "Owner orders of 2026-10-29 (session oscilla-b0, in Czech): add p5.js, WebGL and interactivity and deploy; plan WebGL renderers for the scrolling spectrogram (with a 3D option), a phosphor XY scope and a live spectrum, falling back to canvas/p5 when WebGL is unavailable, one frame loop with no per-frame allocation, the single file and its gzip budget, axes and units from the analysis (no-fake-science). Built on the M062 charts plan (#269, merged as cdda563c): the frame loop K036, the interaction kit K053, the shared zoom K052, the level history K033 and the chart-cost check of K036 are reused, never duplicated (components-followup/render-gl.md)."
