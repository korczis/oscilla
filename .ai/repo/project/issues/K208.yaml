objective: "Lands as test(studio). K059's criterion 1 names figures checked offline in tests/browser/instrument-dsp.cjs, which exists only on K060's unmerged branch. Once K060 lands the suite and K207 the contour type, this adds K059's figures to it, rendered in Chromium, Firefox and WebKit at each context's own rate in the style of tests/browser/dsp.cjs. Before: the vco, ring and pulse shipped with their series checked only in unit tests (tests/unit/synth-nodes.test.mjs:43,77). After: their sound is measured. Rollback: revert; tests only."
why: "Gap of K059 (criterion 1) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): tests/browser/instrument-dsp.cjs and its K059 figures are not on main. No owner direction re-scopes it, so it is its own issue and K059's criterion points here (chore/plan-m064-rescope). K059 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
