acceptance_criteria:
  - "tests/browser/instrument-dsp.cjs, rendering a real OfflineAudioContext in Chromium, Firefox and WebKit at each context's own rate, checks: a vco saw at 220 Hz has its fundamental at 220 Hz within one FFT bin; one scale step up (16' to 8') doubles it within 0.1 cent; a pulse at width 25 % has its third harmonic within 1 dB of the analytic |sin(3 pi w)| / 3 relative to the fundamental's |sin(pi w)|, and its fourth harmonic at least 40 dB down, the same at A4, A5 and A6 played from a keys node (the width tracks pitch); a ring node in ring mode outputs the sample-wise product of its carrier and modulator inputs within 1e-6; a contour with attack 10 ms reaches 0.99 of 1 at 10 ms +- one render quantum and never steps by more than the click limit of the freeze suite at release. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Test-only: the pull request body says 'fail-first: n/a' with the reason (figures of shipped types); a figure that fails on main is fixed by its own fix(studio) change with a unit test that fails on the merge base and a reviewer's verdict (src/js/studio and src/js/audio are guarded)."
  - "The suite's row in tests/README.md names the K059 cases."
validation:
  - "node tests/browser/instrument-dsp.cjs"
  - "npm test"
evidence_required:
