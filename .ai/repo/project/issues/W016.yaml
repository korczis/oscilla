priority: p2
profile: implementation
objective: "Lands as test(ui). Each kind instance's links (design section 3.3) become rows of tests/browser/integration-map.json (K075's file; generated once G016 lands), walked by pointer and keyboard with Back, Forward and reload; the control census (PACK 03 and qa-regressions.cjs no-inert-controls) asserts that every visible kind instance exposes its parameters through declarations (the owner's 'every element tweakable'); and tests/browser/ui-kinds.cjs runs every bundled kind at 390x844 and asserts its declared mobile rule (target sizes, no horizontal page scroll, in-card scroll only where declared). Before: kinds are tested one by one. After: one sweep that fails a kind instance with a missing link, an untweakable parameter or a broken phone layout. Negative cases: a target under 44 px without its exemption; a page that scrolls sideways at 390 px; a declared link whose control is hidden. Rollback: revert; tests only."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
