depends_on: []
acceptance_criteria:
  - "Fail-first: tests/unit/charts.test.mjs imports the chart module's exported label function and fails on the merge base: on, it returns 'Harmonic amplitudes 1 to 10'; off, a different string that says additive synthesis is bypassed (project.fail-first)."
  - "A check in tests/browser/labs.cjs toggles #osc-add-enable off and on and asserts, polled against a named deadline: the canvas pixels of #osc-chart-additive differ between the states; the host's aria-label differs and the off one names the bypass; the chart's isEnabled() equals the lab's enabled; getBars() is identical in both states and still equals the PeriodicWave coefficients (the existing 'additive bars equal the PeriodicWave coefficients' check passes)."
  - "The same check restores a state with enabled false through labs.additive.update and asserts the chart and its label show the off state without a toggle."
  - "It adds no class token, selector, markup surface or inline style, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes) and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro, project.visual-identity-lock)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "Definition of done, extends: the Additive chart joins the inactive chart set of the Filter (BYPASSED) and the Envelope (dimmed)."
  - "Definition of done, interlinks: the chart's state follows the switch, presets, History and the config file through the one lab state; the pull request names U013 and the related ids T022, K044 and K027."
  - "Definition of done, interactivity: the switch changes the chart at once; selection and arrow-key adjustment of a bar still work while bypassed."
  - "Definition of done, docs, menus and routes: tests/README.md rows for the unit and browser checks name the off state; no menu or route changes (stated)."
  - "Definition of done, tested: node --test tests/unit/charts.test.mjs, node tests/browser/labs.cjs and npm test pass; dist is rebuilt and npm run build:check passes."
  - "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
validation:
