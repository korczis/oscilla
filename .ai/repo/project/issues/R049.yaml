profile: implementation
objective: "Lands as fix(ci). The pin 1.0.0-alpha.9 is typed in 11 places: .github/workflows/ci.yml (MJ_VERSION, MJ_SHA256, a comment and the job name), .github/workflows/main-checks.yml (the job name, MJ_VERSION, MJ_SHA256), tests/unit/ci-knowledge-job.test.mjs (a comment, CAPTURED_WITH), .ai/repo/rules/vendor/majordomus/manifest.yaml source_revision and M118's prose; the bump e880703e edited eight files by hand and every bump renames a check. After: MJ_VERSION/MJ_SHA256 in ci.yml are the one source (scripts/majordomus-pin-check.mjs reads them); main-checks.yml either reuses them or is held equal by a test; job names carry no version; CAPTURED_WITH and the manifest are read or checked against it."
why: "Audit of 2026-11-06 (oscilla-2b, owner: 'something is hard-coded, numbers duplicated, not everything derived')."
