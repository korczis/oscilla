title: "Channel strip kind: fader, pan, mute, solo, sends, inserts and the shared meter, first on the Studio's Master strip"
slug: channel-strip-kind-fader-pan-mute-solo-sends-inserts-and-the
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). src/js/ui/kinds/channel-strip.js: a role=group per node (channel, bus or master) with the vertical slider and the knob of the params-controls part (one descriptor model, G003), mute and solo aria-pressed, send knobs, an ordered insert list, and its W003 meter at strip density; a control the node lacks is absent, not disabled; the master strip states the ceiling (wording per p05 T001); 88 px strips, four at 390 px, scrolling inside the mixer card. Events build NODE_PARAM_SET (gain, pan, mute, solo, sends) and one batch for an insert move (K108). First consumer: the Master node's strip in the Studio (its level parameter and the output meter); K108 then renders every channel and bus through it. Before: VERIFIED levels are set per node in the Inspector, with no strip and no meter. After: one strip kind. Negative cases: a control the node lacks (absent); a fader value beyond the parameter's range (refused); an insert move closing a cycle (refused with the no-silent-feedback sentence). Rollback: revert. Merged plan of the component follow-up (2026-10-30): Its pan is the K058 knob and its fader N003's slider view; mute and solo are buttons (no M or S key). K108 depends on W013."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
