current_state: "Not started. Depends on G001 (#371, the catalogue) and builds on U067's frame (feat/a5-frame-peeper, the header the handle sits in), not yet an issue on main: its dependency is added when U067 lands, and U068 is not started before. K153's key registry is on main. Intent change: component-system gains the satisfaction criterion panels-arrangeable (below), landed in the same plan PR as this issue. af's critique of the draft (2026-11-03, 2 blocking, 8 non-blocking) is in critiques/component-system.yaml with its resolutions."
acceptance_criteria:
  - "Starts only after U067's frame is on main (the handle's host). The model is pure and total: tests/unit/panels-layout.test.mjs moves, resizes, collapses, resets and undoes a reset on a fixture workspace; a stored layout with an unknown id, a missing id, a bad version or bad JSON reads as the default plus the valid part, and never throws."
  - "Per device, never in the document: the browser suite arranges the Analyzer, reloads and reads the same order; the hash, history.length and the Studio document's JSON are unchanged by every layout action; a second context with fresh storage opens the default."
  - "Phone 390x844 touch: one column, no resize control rendered, Move up / Move down and the handle reorder, every handle and action at least 44 x 44 px, nothing overlaps <main>'s content."
  - "Keyboard: the handle is reachable by Tab, its menu's Move and Wider/Narrower act and keep focus on the moved panel; the bindings resolve through src/js/ui/keys (the key-listener ratchet of tests/unit/keys-registry.test.mjs does not rise) and never inside a text field or a dialog."
  - "Order is real: after a Move, Tab from the panel before the new position reaches the moved panel next, and the accessibility tree's panel order (Playwright ariaSnapshot) equals the visual order, in every gate browser."
  - "Move, never hide: with the Studio playing and with a Measure capture running, the ownsOutput panel's collapse control is disabled with its reason; an ownsOutput panel collapsed while idle expands when sound or a capture starts; with that panel moved last and the page scrolled to its top, status.play reads Stop playback, is in the viewport at 390x844 and 1536x1024 and stops the Studio transport and aborts the capture, and Escape does the same; after Stop the collapse control enables."
  - "Coverage is not vacuous: a census test derives from the catalogue that Playground, Analyzer, Studio, Synth and Measure each declare at least two arrangeable panels and exactly one ownsOutput panel where the workspace makes sound or captures."
  - "The default layout is today's page: npm run visual and the visual gate are unchanged with no stored layout, and tests/browser/iphone.cjs's census reach does not fall."
  - "Storage unavailable (iphone.cjs journey with denyCapabilities, and a unit fixture whose storage throws): the default layout renders, Move and Reset work for the visit, and nothing throws."
  - "Touch drag: on a 390x844 touch context the handle reorders by a trusted touch drag without scrolling the page, and a desktop trusted mouse drag reorders and resizes (no synthetic pointer holds, the #388 lesson)."
  - "Keys: the four Alt+Shift+Arrow bindings resolve only on a focused handle; the registry reports one owner each and no clash with the Synth's armed keys (unit, tests/unit/keys-registry.test.mjs)."
  - "Standard: the Reset toast and the handle menu are the Pro toast and dropdown blocks with the ui-flowbite-pro ratchet not rising; the size report gives base and head figures; tests/README rows for the new unit and browser checks; the unit test and the browser check fail on the merge base (fail-first)."
  - "Reset per page with undo: Reset layout restores the declared default of that workspace only (another workspace's arrangement survives), its toast's Undo restores the previous layout once, and a second Undo is not offered."
  - "No layout action starts audio or changes a parameter (census of AudioNodes and the URL state before and after are equal)."
  - "Every gate browser, file:// and the /oscilla/ sub-path (tests/browser/panels.cjs through tests/browser/lib/suite.cjs, waits through lib/wait.cjs)."
