id: K149
milestone: M069
serves:
- "connected-instrument#riff-library"
title: A library of original riffs in the styles of genres and eras, inserted as Studio clips
slug: a-library-of-original-riffs-inserted-as-studio-clips
priority: p2
profile: implementation
objective: "Add src/js/studio/riffs/: library.js holds sixteen short riffs written for OSCILLA on 2026-11-02, each labelled 'Original, in the style of <genre> (<era>)' (disco, synth-funk pop, French house, acid house, synthwave, Berlin school, Italo disco, Detroit techno, West Coast G-funk, drum and bass, chiptune, Detroit soul, trance, new wave, electro-funk, minimal techno), in the demo song's note format ([step, pitch, length, velocity], 16 steps a bar), monophonic, with a role (bass, lead, arp), tempo, key and the voice it was written for. expand.js turns a riff into one BATCH of tempo-linked tone pattern clips on an event track (one Undo removes it) and gives toNotes(riff), the payload of the multi-note clip kind the piano roll brings (lane C+), so the expander alone changes when that kind lands. riffVoiceAction inserts a riff with a voice of its own in the same one batch: the Oscillator and low-pass Filter it was written for, wired to the Master Output (directly, into a free input of the Mixer that feeds it, or through a new Mixer, since the Master's input takes one connection), an event track on the Oscillator and the clips; TRACK_ADD may name an unused id, as NODE_ADD and EDGE_ADD already may. source.js lists the riffs in the one patch library (K102) as the category Riffs, which the Synth and the Studio open in the same dialog: tagged with the role and the genre, the style said beside the name, Insert (riffVoiceAction) the only way in, never shown as in use. audition.js plays a riff as ONE finite steps plan of the engine's play() (the instrument's own path, behind its output guard), Listen stopping the other owners first and Stop, any load, the riff's end or closing the dialog ending it; an ephemeral audition (Q032), never written to the model. Every riff records author OSCILLA, licence MIT and its method (Q079-Q082)."
why: "Owner direction of 2026-11-02, in Czech: \"chcu mit lib klasickejch riffu - od jacksona, pres daft punk, pres ... az po ...\". A song is somebody's work and is not transcribed or quoted; a style is a shared vocabulary, so each riff is original and names its genre and era only (agreed on the mesh with b0 and 26)."
