acceptance_criteria:
- "Before: VERIFIED: the Studio has one original song (the demo song) and no riff library."
- "After: sixteen original riffs in sixteen genres; Insert on an event track adds one tempo-linked tone clip per note as one undoable batch; toNotes gives beats, MIDI numbers and velocity 0..1; Insert with its voice on the reference, demo-song and subtractive-synth templates adds the voice, its path to the Master Output, the track and the clips, compiles, and two inserts take free ids; the patch library's Riffs category lists all sixteen with their style, Listen is heard (RMS above -40 dB rel) and Stop falls below -70 dB rel without an undo entry, and Enter inserts one in one undo entry (synth.cjs s-riffs, chromium, firefox and webkit)."
- "Negative cases: Insert refuses a missing track, a track of another kind and a start before beat 0, with a reason; a Studio without a Master Output refuses the voice; nothing of the existing graph is removed but the one Master feed a new Mixer takes over."
- "Rollback: revert the merge commit; no stored record or schema changes."
validation:
- node --test tests/unit/riff-library.test.mjs
- node tests/browser/synth.cjs --only s-riffs,s-library,s-libxy
