acceptance_criteria:
  - "A round trip Sequencer to Studio to Sequencer leaves the sequence deep-equal (or loses only the fields K004's test lists), in tests/unit/studio-sequencer-bridge.test.mjs, which fails on the merge base."
  - "With unsaved work either way the guard names what would be lost and nothing moves until the person confirms."
  - "Any new chrome is Flowbite Pro markup adapted from the matching Pro block and lowers or keeps the ratchet (project.ui-uses-flowbite-pro, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs); controls are Pro range sliders with number inputs; a continuous instrument parameter in the Synth workspace is the knob of K058 (D11, Q018, superseding D5 there)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
