objective: "Lands as feat(studio). \"Open in Studio\" in the Sequencer and \"Send track to Sequencer\" in the Studio carry the material across through K004's import and export, behind the studioWhatWouldBeLost guard. It serves U006 and audit finding A17 (docs/ui-audit.md) too, without editing U006's record. It waits on F001 and F002 of plan pull request #251 (intent ui-flowbite-pro), which are not on main yet; depends_on names them in the plan change after #251 lands."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
