objective: "Lands as feat(studio). \"Open in Studio\" in the Sequencer and \"Send track to Sequencer\" in the Studio carry the material across through K004's import and export, behind the studioWhatWouldBeLost guard. It serves U006 and audit finding A17 (docs/ui-audit.md) too, without editing U006's record. It also adds the \"Export track as sequence\" control over K004's export, behind the same guard. Its chrome is in two workspaces: the Sequencer's button waits on F001, F002 and F003 and the Studio's buttons on F001, F002 and F008 of plan pull request #251 (intent ui-flowbite-pro), which are not on main yet; depends_on names them in the plan change after #251 lands. The Studio side goes into the file I/O module E003 splits out of workspace.js, so it also waits on E003."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
