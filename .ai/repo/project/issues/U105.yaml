objective: "Lands as fix(studio-ui). The owner-ordered live visual audit of v3.35.0 (2026-11-11, finding 6) found the Studio Inspector's ADR 0042 Trace on the default screen reading 'op-1 · bus leave · null'. Decided by oscilla-c3 under Q090 (relayed by oscilla-43, 2026-11-11), verbatim: '(2a) Trace in the Studio Inspector: agree, a closed \"Trace\" disclosure by default, like the \"Runtime details\" one above it. Two amendments: The raw \"null\" in \"op-1 · bus leave · null\" is a defect in its own right, even when collapsed. An absent field is omitted, or written as \"—\", in the trace view and its Czech text. The disclosure''s summary names the count (\"Trace (1)\") so it doesn''t hide that something happened.' Before: the trace list open on the default screen with null texts. After: a closed disclosure 'Operace (N)', no null in any operation or step text."
why: "The owner's bar of 2026-11-11 (verbatim, loop prompt): 'vse at vypada profi, hezky, luxusne, detailne, production grade, proste profi autio nastroj'; developer output on the default screen and a literal null read as unfinished."
