acceptance_criteria:
  - "Fail-first fixture: tests/unit/readout-states-scope.test.mjs: scopeScale({ peak: 0.16, gain: 0.08 }) → overRange, ratio 2, yMax ≥ 2; scopeScale({ peak: 0.25, gain: 0.08 }) → ratio 3.125; the label builder at its narrowest fallback still contains \"set gain\" and \"mono\". Fails on the merge base (no helper; narrow label drops the qualifier). Browser check in tests/browser/app.cjs: the +6 dB peaking path shows the rescaled axis; the split-180 path shows the mono-sum text."
  - "Negative cases, each asserted: A sine at the set gain keeps yMax 1 and no over-range text; the idle computed trace is unchanged; the min/max band below sr/f < 4 is unchanged; window maths (qa-regressions.test.mjs:224-236) unchanged."
  - "Revertible on its own: Revert: display-only module and label strings."
