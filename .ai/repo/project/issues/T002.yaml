title: "The waveform scope never draws a flat top that is not in the data, and says when it shows a mono sum"
slug: the-waveform-scope-never-draws-a-flat-top-that-is-not-in-the
priority: p1
profile: implementation
objective: "Truth-table rows GEN-02, STP-15 (scratchpad p05/truth-table.md). A pure scopeScale({ peak, gain }) returns { yMax, overRange, ratio }; the y axis rescales to the next nice step at or above the window peak and labels its ticks as multiples of the set gain, and the ceiling state comes from T001. It lands on the drawing K032 (M062) rewrites, so it follows K032. The label says \"mono sum (L+R)/2\" in every uiPickFit width, and while the dual stereo route plays it adds that opposite-phase channels cancel here and points to Phase & Stereo."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): The scope clamps samples to 1.15 x the set gain with no mark: a clean sine boosted +6 dB (crest 3.01 dB, 0 % at the ceiling) is drawn with flat tops, and a 3.1x over-range is drawn as a plateau at about +1.1. With Stereo split, A = B = 440 Hz and Δφ 180 both channels play at full level (router RMS 0.282) while the scope labelled \"output analyser\" is flat (RMS 2.08e-8), because the analyser sees the mono down-mix. Narrow panels drop \"relative to set gain\", so +1 reads as full scale."
