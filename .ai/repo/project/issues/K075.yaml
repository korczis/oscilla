acceptance_criteria:
  - "Mutation checks in tests/unit/integration-map.test.mjs: a fixture producer without a row fails the scan, a fixture hash-route write without the marker fails it, a row naming a missing control fails, and a row whose target shows another Studio revision fails; the real table passes; the test fails on the merge base (the files do not exist there)."
  - "The suite runs in Chromium, Firefox and WebKit from file:// and from the Pages sub-path, and tests/unit/ci-bounded.test.mjs (project.ci-bounded) accepts the CI step it adds (bounded, pinned, retried)."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a producer without a row; a row without a control; a target at another revision; a reload that loses the target state."
  - "A browser check in tests/browser/integration-map.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: every row's target workspace shows the same Studio store revision as the source and Back, Forward and reload restore source and target. Real-time: a row's target state appears after its control is activated, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: each row's control is activated once by pointer, once by keyboard (Enter) and once by a synthesized touch tap, and its role (link or button) is asserted in the accessibility tree. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer's verdict (.github is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 0 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/integration-map.test.mjs"
  - "node tests/browser/integration-map.cjs"
  - "npm test"
evidence_required:
  - "verified"
