title: "Integration map: a declared table of every link, walked by a browser suite"
slug: integration-map-a-declared-table-of-every-link-walked-by-a-b
priority: p1
profile: implementation
objective: "Lands as test(integration). Adds tests/browser/integration-map.json, a declared table of every link between workspaces, instruments, labs and visualizations (open in, send to, modulation route, probe, jump), and tests/browser/integration-map.cjs through tests/browser/lib/suite.cjs, which walks every row. No marker exists today (no data-osc-link attribute and no openIn or sendTo call in src), so the slice defines the data-osc-link marker and puts it on every existing producer: the workspace navigation, the #m=studio&st= template links of tests/browser/v31-studio-links.cjs, Copy recipe link and the connected-record links of ADR 0048; the static scan also collects every write of a hash route (location.hash, history.pushState and replaceState) in src/js, so a producer without the marker is found too. A producer without a row fails, and a row whose control is missing or whose round trip fails fails. Open in Studio (K018) is not on main and is not a first row. It adds npm run test:synth (this suite first) to package.json and to test:release, and runs it in CI's browser job. It reuses the link-crawl code another session is writing (scratchpad ux-audit links.md) where that has landed. It is the first slice: every later link-adding slice adds its row here. Before: links between workspaces are checked one suite at a time and no table says which exist. After: every link is a declared row walked in three browsers. User-value tier 2 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
