  - "On the fake context, releasing a lane-owned parameter schedules no base-glide event earlier than the transport's hold time; the case fails on the merge base."
  - "npm test passes; the pull request carries a review verdict (src/js/studio is guarded); tests/README.md has a row for the test (one appended row)."
