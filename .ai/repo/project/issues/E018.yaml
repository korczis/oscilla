title: "An overridden detune leaves the frequency headroom free, and a released parameter holds before it glides"
slug: an-overridden-detune-leaves-the-headroom-free-and-a-release-holds-first
priority: p3
profile: implementation
objective: "#197 R-7: computeBases (src/js/studio/compiler.js) sizes a frequency's log-edge headroom from max(static detune, detune lane peak) even when a detune lane owns the detune, the same sizing as V431 X1. With an Oscillator at 12 kHz, static detune +1200 ct, a detune lane at 0 ct and a log LFO->frequency edge with offset 0.1 (120 ct constant), the edge's cents drop to 0 although the ceiling is 1111 ct; it is reported in limitedEdges (edge-6), so it is visible, not silent. Size a lane-owned detune from its lane peak alone. docs/v31/review-v272.md, Open, builders' follow-up: in a window of about 20 ms the runtime's base glide (src/js/studio/runtime.js) precedes the transport's hold (src/js/studio/transport.js) on a released parameter (pre-existing). Order the two so that no base glide event is scheduled before the hold time of the release."
why: "Review verdict .ai/repo/reviews/197.yaml, finding R-7, and the follow-ups the V272 builders named in docs/v31/review-v272.md: both are conservative today (a limited edge, a short glide), but each makes the played value differ from the model's for no stated reason."
scope:
