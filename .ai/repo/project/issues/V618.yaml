title: "Large graphs: a 300-node baseline, then culling, a pan and zoom frame that does not grow with the graph, and one validation per multi-cable edit"
slug: large-graphs-a-300-node-fixture-offscreen-culling-and-transf
priority: p2
profile: implementation
objective: "P04 slice F (visual, keyboard and responsive). Lands as perf(studio-ui). Amended 2026-11-02 after critique studio-box-system (v618-targets-the-wrong-cost, large-graph-budgets-not-measurable): pan and zoom are already one transform on the world layer (applyView, src/js/ui/studio/graph-editor.js:109-117), so this slice targets the costs that grow with the graph instead. First commit, the baseline: tests/unit/fixtures/v31-large-studio.mjs gains a 300-node / 600-edge build beside the 100-node one, and docs/v31/performance.md records the 300-node numbers measured on the merge base, per browser, before any change. Then: (1) while the minimap is shown, a pan or zoom frame redraws it without per-node work (graph-minimap.js render reads nodeRects(), which reads offsetWidth and offsetHeight of every box, and writes five attributes per node on every applyView); the node rects are cached and refreshed only when the model, a box size or the shown state changes, and a frame moves only the viewport frame. (2) A zoom step stops restyling every cable: applyView writes --osc-sg-z on the world layer, and the hit stroke of every cable is calc(12px / var(--osc-sg-z)) (24px under pointer: coarse; src/styles/studio.css:297, 361), so each step recalculates the style of all 600 hit paths; the hit width follows the zoom only when the gesture ends (commitView), or through one rule that does not depend on the cable count. (3) The graph editor skips layout work for boxes and cables outside the viewport plus a margin (their elements stay in the DOM with their accessible names, so find and Tab order are unchanged). (4) M on several cables is one store action: toggleMute (src/js/ui/studio/graph-commands.js:356-376) dispatches one EDGE_UPDATE per cable inside hold, each validated against the whole model by the store; it becomes one BATCH of EDGE_UPDATE steps, the K061 action already on main (src/js/studio/actions.js:767-787: reduced in order, validated once, one revision, one history entry), so src/js/studio/actions.js does not change. V613 (fan-out) and V614 (box mute) build their multi-cable edits the same way, as one BATCH."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58). The amendment of 2026-11-02 answers critique .ai/repo/project/critiques/studio-box-system.yaml (v618-targets-the-wrong-cost, large-graph-budgets-not-measurable), whose claims were checked against main at 32b439e6."
