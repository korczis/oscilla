acceptance_criteria:
- "Before: VERIFIED on main at 32b439e6 (2026-11-02). Pan and zoom already change one transform on the world layer (applyView sets translate and scale, graph-editor.js:109-117), and a node drag moves only the dragged nodes and their cables (docs/v31/performance.md). What grows with the graph: (a) while the minimap is shown, every applyView calls minimap.render(), which reads offsetWidth and offsetHeight of every box through nodeRects() and writes data-node-id, x, y, width and height on one rect per node (graph-minimap.js:144-160); (b) every zoom step writes --osc-sg-z, on which the hit stroke of every cable depends (studio.css:297, 361); (c) M dispatches one EDGE_UPDATE per cable, and the store validates the whole model on each (validateStudioCommit, about 1.9 ms in Node and 4-6 ms in the browsers on the 100-node fixture). docs/v31/performance.md measured on 100 nodes / 200 edges at a load of about 25: M on all 200 cables 290-320 ms in Chromium, 495-1020 ms in Firefox and 480 ms in WebKit (M on 8 cables 27-63 ms; L on all 100 nodes 11-20 ms); NODE_MOVE 3.5-10 ms and Frame All at most 1 ms across the three engines. A probe for this amendment (Node 22.20.0, main-thread CPU time, fastest of 7, load about 19) measured M on the 200 cables at 354 ms as 200 EDGE_UPDATE, 3.2 ms as one BATCH of the same steps, and 1.6 ms for one validated EDGE_UPDATE. No pan frame, zoom frame or 300-node figure has been measured; budgets exist for 100 nodes / 200 edges only."
- "Baseline first: the first commit adds the 300-node / 600-edge build and records in docs/v31/performance.md, measured on the merge base before any change, the 300-node and 100-node figures of build, dispatchMove, search and M on all cables (Node, CPU time), and of a pan frame and a zoom frame with the minimap hidden and shown, a node drag frame and M on all cables, in Chromium, Firefox and WebKit. Later commits are judged against these rows."
- "After: on the 300-node / 600-edge fixture, a pan or zoom frame does no per-node or per-cable work while the minimap is shown, boxes and cables outside the viewport plus margin are culled, and M on any number of cables is one BATCH, so one validation."
- "Budgets are CPU time or ratios measured in the same run, never quiet-machine wall time (plan E029, intent engineering-integrity). Unit (tests/unit/v31-studio-performance.test.mjs, the E029 harness: main-thread CPU time through process.threadCpuUsage, fastest repeat, REMEASURE_DEADLINE_MS): the 300-node build, dispatchMove, search and the culling computation each within its PERF_BUDGETS row; M on all 600 cables as one BATCH at most 4 times one validated EDGE_UPDATE on the same 300-node model (one validation plus the reducer steps; the per-cable form costs about one validation per cable, 220 times on the probe's 200 cables, and fails it). Browser (one method in every engine): the synchronous work of a frame, timed with performance.now from the input event to a forced style and layout read in the same task, median of 9, measured interleaved on the 300-node and the 100-node fixture in the same page; a pan frame and a zoom frame with the minimap shown each at most 1.5 times their 100-node figure (work proportional to the graph would be about 3), and M on all 600 cables at most 3 times the same page's NODE_PARAM_SET edit (both one validation and one projection pass). The milliseconds are recorded in docs/v31/performance.md and reported by the check, not gated on. No PerformanceObserver frame entry is used: long-animation-frame exists in Chromium only."
- "Negative cases: a culled node keeps its accessible name and Tab order; find reaches it. A refused step inside the M BATCH (a stale edge id) refuses the whole action with the store's sentence and changes neither model, history nor runtime; muting one cable stays one EDGE_UPDATE."
- "Rollback: revert the merge commit. Nothing changes the schema, a studioHash or a stored record, so documents saved while it was live load unchanged after the revert; M through BATCH produces the same muted edges and the same studioHash as the per-cable form."
- "tests/unit/v31-studio-performance.test.mjs, failing on the merge base (the 300-node rows and the BATCH ratio do not exist there): the unit budgets above; the culled set of a viewport is exactly the boxes outside it plus margin."
- "tests/unit/studio-graph-commands.test.mjs, failing on the merge base: M on N selected cables dispatches exactly one store action, a BATCH of N EDGE_UPDATE steps, recorded as one history entry; the minimap render on an unchanged model reads no node rect a second time (a counting nodeRects stub)."
- "tests/unit/v31-studio-docs.test.mjs holds the new budget rows equal to the fixture's PERF_BUDGETS and BROWSER_BUDGETS."
- "Definition of done, extends: the performance budgets of V431 and E029 and docs/v31/performance.md; the K061 BATCH action, unchanged."
- "Definition of done, cross-links: the minimap (V602) and find (/) still reach every node of the 300-node graph (round trip: find a culled node, frame it, its box is laid out). The link is a row of tests/browser/integration-map.json once that map (synth line K075) is on main."
- "Definition of done, dynamics: pan and zoom stay one transform per frame, and the shown minimap and the cable hit width no longer add per-node or per-cable work to it; the budget table reports the pan, zoom and drag frame figures."
- "Definition of done, docs and routes: docs/v31/performance.md gains the baseline rows, the after rows, the browser method and the replacement of the paragraph that says a multi-edge EDGE_UPDATE 'has not been built' (M is one BATCH). tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'large-graph' in tests/browser/v31-studio-workflows.cjs imports the 300-node fixture, waits with until() (deadline '300-node graph rendered', 10 s) for the node count, measures by the browser method above a pan by keyboard (arrow keys on the canvas) and by a two-finger touch pan in a hasTouch context, a zoom step, both with the minimap shown and hidden, a node drag by pointer and M on all 600 cables, and holds the ratios; finds a node that was culled by / and waits until its box is laid out; on the merge base the fixture has no 300-node build and the check fails. The browser check runs through tests/browser/lib/suite.cjs (whose load gate applies), waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit and the completed evidence the release that carried it; E030's judge passes on the pull request once E030 is on main."
- "Its paths are not guarded (checked with scripts/review-verdict.mjs isGuarded on every scope path, 2026-11-02; src/js/studio/actions.js is guarded and is not in scope, since BATCH already exists), so no verdict is needed; as a perf change it carries the unit tests above, which fail on the merge base (project.fail-first)."
- "Wave 1: it adds no class token, selector, markup surface or inline style; a change in src/styles/studio.css only edits or removes declarations of existing selectors, so the Flowbite Pro record does not grow: node scripts/ui-flowbite-pro-record.mjs --check passes and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro); live drawing is on a canvas, a domain view."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, within the owner's dist budget of 1 200 000 B gzip (decision of 2026-10-29; the headroom is measured on the pull request's base, not quoted); the ceiling of this line is 35 KB gzip in all (Studio boxes 35 KB, signal generator 25 KB), stated in the milestone (project.single-file-deliverable)."
