title: "Large graphs: a 300-node fixture, offscreen culling and transform-only pan and zoom"
slug: large-graphs-a-300-node-fixture-offscreen-culling-and-transf
priority: p2
profile: implementation
objective: "P04 slice F (visual, keyboard and responsive). Lands as perf(studio-ui). tests/unit/fixtures/v31-large-studio.mjs gains a 300-node / 600-edge build beside the 100-node one. The graph editor skips layout work for boxes and cables outside the viewport plus a margin (their elements stay in the DOM with their accessible names, so find and Tab order are unchanged), and pan and zoom change one transform on the world layer per frame instead of per-node work. docs/v31/performance.md gains the new rows and browser budgets: a node drag frame and a pan frame on the 300-node graph within 16.7 ms median on a quiet machine, re-measured under load with the existing REMEASURE_DEADLINE_MS rule."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
