title: "Control panel: a group of parameters laid out from their declarations, sections, primary controls, collapse and expand, mobile first"
slug: control-panel-a-group-of-parameters-laid-out-from-their-declar
priority: p2
profile: implementation
objective: "Lands as feat(ui). src/js/ui/kinds/panel.js exports mountPanel(host, { id, title, sections, primary, summary }, { surface, density, values, commit, menu, expanded, onToggle }) -> { set, setDisabled, setModulation, setAutomation, setExpanded, destroy }. For a node the group is V619's face declaration (sections holding every parameter, at most three primary) and defineNode's summary; for a lab or settings form it is authored. Each section is a Pro card whose header is a disclosure button with aria-expanded and aria-controls; Expand all and Collapse all sit in the panel header; collapsed shows title, summary, the primary controls (live) and the jacks, expanded every section, so every parameter (owner decision Q031). Layout is designed at 390x844 first: one column of sections, knobs in grid-cols-3 (about 119 px a cell), sm:grid-cols-4, lg:grid-cols-6, slider rows full width, no horizontal scroll; 44 px targets on a coarse pointer. The panel stores nothing: the box's folding is V622's node presentation state (saved, undoable, never hashed), a Synth card's is K062's view state (never in history or the hash); the two projections of one node fold independently, which project.studio-model-is-canonical allows and both docs state. Consumers: V620 (box face), K062 (Synth cards), K096 (Inspector), F003 (Playground-family labs). Before: VERIFIED every surface lays out its fields by hand (inventory C5). After: one panel. Negative cases: a node type whose expanded panel misses a parameter, a panel that writes its folding, 390 px with horizontal scroll, a collapsed primary that is not operable. Rollback: revert. Merged plan of the component follow-up (2026-10-30): Wave 1: it needs F001, not F002. Its disclosure buttons and cards carry explicit utilities that do not rely on preflight, so F002 turning preflight on changes nothing the visual gate sees; the knob view appears in the Inspector's panel through K096 under Q020's answer."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, KB and interlinking; full DAW, full sequencer, full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels in one generic way, integrated with Majordomus; every element tweakable; mobile first; the landing easy to use, easy to extend and open to hack. Owner decisions: knobs that always show value and unit (D11, Q018, the ADR 0058 note of 2026-10-29), every parameter on the box face (Q031), the generator in its own workspace (Q033). Design: the params-controls part of the component follow-up of 2026-10-29 (scratchpad components-followup/params-controls.md), checked against origin/main b67d1e58 and the head of plan pull request #285 (c0a631b2)."
