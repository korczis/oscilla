acceptance_criteria:
- "tests/unit/control-panel.test.mjs fails on the merge base: for every NODE_REGISTRY type the expanded projection has exactly one control per parameter and the collapsed one exactly the primary controls; the panel module calls onToggle and writes no folding (static scan and a recording owner)."
- "Definition of done, tested: tests/browser/v31-studio-graph.cjs mounts the Inspector's parameters as a panel at 390x844 and 1536x1024, toggles a section by click, Enter and a hasTouch tap, uses Expand all and Collapse all, and waits with until() (deadline 'panel folded', 2 s) for aria-expanded, the visible control count and the owner's recorded state to agree; document.scrollingElement.scrollWidth equals clientWidth at 390. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), runs at 390x844 and at 1536x1024, adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, extends: V619's face sections and the Inspector's parameter list."
- "Definition of done, interlinks: each section header is addressable (c=<panel>#<section>), and each control keeps its data-osc-param."
- "Definition of done, interactivity: sections fold and unfold by pointer, keyboard and touch; every control inside stays live."
- "Definition of done, docs, menus and routes: docs/ui-catalog.md (N010) documents the panel; EXTENDING.md says a face section is all a node author writes. tests/README.md has a row for each new test; the parameter's or view's catalogue entry names its docs, links and tests (G001 trace part); dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "After F001 (Tailwind compiled, preflight off until F002): its chrome is markup adapted from the matching Flowbite Pro block (named by its flowbite-pro reference.md section) with Tailwind class lists only; the knob arc and the band are inline SVG with Tailwind utilities under the ADR 0061 resolution note of K058; it adds no osc-* class token, no legacy vocabulary use and no selector, and the domain views' stylesheets gain nothing; the record's debt does not rise (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 1.5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the line's sum stays within its row of the cap Q037 records, under the 1.2 MB gzip budget of scripts/build-config.mjs (project.single-file-deliverable)."
