objective: "The continuous-repeat scheduler skips every cycle that starts before _soon, to keep the grid after a stalled top-up. _soon is aligned to the render quantum, so at play (t0 = currentTime + START_OFFSET_S, off the quantum grid in every browser) cycle 0 was skipped too: a continuous segment sweep began with one period of silence (10 s for the default sweep), and a ping-pong with a held tone. Present since V1 a7b7a23 (frozen in the golden file) and confirmed on the live v3.1.0 page in chromium. Skip only in top-ups."
