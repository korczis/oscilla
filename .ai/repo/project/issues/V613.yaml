id: V613
milestone: M080
serves:
- "studio-box-system#wiring-gestures"
title: Alt-drag duplicates a cable and Shift-drag fans one output out to several inputs
slug: alt-drag-duplicates-a-cable-and-shift-drag-fans-one-output-o
priority: p2
profile: implementation
objective: "P04 slice C (typed edge UX). Lands as feat(studio-ui). Alt-dragging the input end of an existing cable leaves it in place and draws a new cable from the same source to the drop target (one EDGE_ADD). Shift held while a cable from an output is dropped keeps a new cable live from the same output after each connection, until Shift is released, Escape is pressed or the pointer is released over empty canvas; all connections of the gesture are one batch and one history entry 'Connect Oscillator 1 to 3 inputs'. Each connection goes through canConnect; a refused one in the middle is announced and skipped, and the batch keeps the accepted ones, saying how many were refused. On the keyboard, the connection dialog takes several inputs with Space to mark and Enter to connect them as one batch."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
scope:
- src/js/ui/studio/graph-wire.js
- src/js/ui/studio/graph-gestures.js
- src/js/ui/studio/graph-picker.js
- tests/unit/studio-graph-fanout.test.mjs
