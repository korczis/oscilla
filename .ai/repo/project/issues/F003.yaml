acceptance_criteria:
  - "ui-flowbite-pro.cjs asserts, for the Playground at both sizes (the one workspace left to this issue by Q112), that every panel is a Pro card in the shell's page body and that the ratchet lists every one of their surfaces as migrated; it passes in every gate browser from file:// and the sub-path."
  - "npm run test:engine, test:labs, test:sequencer and test:browser pass with no behaviour check changed; the default workspace and its arrangement are unchanged."
  - "The Playground --play reference is updated through the visual gate with the reason; the ratchet baseline's debt is lower (the surfaces migrated move from surfaces.pending to surfaces.migrated and the primitive uses removed leave the counts); dist's size is stated and within BUDGET."
  - "The class tokens tests/browser/live-smoke.cjs reads after every Pages deploy (.osc-statusbar .osc-sb-name, .osc-sb-version, .osc-sg-node, .osc-sg-title, .osc-sg-cat, .osc-sg-edge-line, .osc-block-name, .osc-stl-hrow--track) stay on their elements, unstyled if need be, until F011 moves the smoke to data-osc hooks; the smoke passes against the built file."
