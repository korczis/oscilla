title: "Playground on Pro components (Synthesis and Sequencer moved to U069 and U074, Presets landed)"
slug: playground-synthesis-sequencer-and-presets-on-pro-components
priority: p2
profile: implementation
objective: "Rebuild the Playground (generator, device panel, microphone analyzer, the five labs and the compact Studio widget), Synthesis, Sequencer and Presets from Pro components: each panel a Pro card (reference.md section 6) with its title row and actions, the controls Pro form controls (section 13: inputs, selects, toggles, range sliders), the buttons the Pro primary and secondary buttons, the preset list a Pro compact list or table (section 9) with badges, empty states the in-card variant of section 12. Keep today's Playground arrangement: the first screen's layout is the owner's choice on Q004, so this issue changes the components, not what the first screen shows. The waveform, spectrum, spectrogram, Lissajous, envelope and sequencer grid keep their drawing and the signal palette inside the cards. Remove the legacy primitives and selectors these workspaces no longer use, lower the ratchet baseline by the surfaces migrated and the primitive uses removed, keep every data-osc hook and id."
why: "Owner, 2026-10-28: the whole interface on Flowbite Pro. These four workspaces share the V1 instrument markup and land together."
current_state: "Narrowed on 2026-11-18 by the plan triage the owner approved in bulk (Q112: 'schvaluji vse', 2026-11-18T02:27Z, Claude Code session 980e22ee-d9d4-4dd0-8318-8b727f127ce9, oscilla-e5; triage derived from origin/main 4682eea4): this issue keeps the Playground (fifteen dependants wait on it). The Presets part landed in 41733d8f (feat(ui): Presets on Flowbite Pro components) and U070 folds Presets into the library; the Synthesis and Sequencer parts moved to U069 and U074, which fold those pages into Synth and the step sequencer and now carry the Pro form in the new home as a 'From F003' criterion, so a page that is being removed is not migrated twice. The objective's Synthesis, Sequencer and Presets clauses stand as history; the criteria apply to the Playground. Undo: restore the title and the four-workspace criterion and drop the 'From F003' criteria of U069 and U074."
