depends_on:
  - "C007"
acceptance_criteria:
  - "A unit test of retargetSustain against valueAtTime during sustain and during decay: the target is reached in at least MIN_SEGMENT_S and the value never exceeds 1; it fails on the merge base."
  - "Browser check `env-sustain-held-note` in tests/browser/app.cjs: on a latched 1 kHz note, typing 0.1 into #osc-env-sustain-value lowers the output by 14 to 17 dB within a named deadline, and #osc-env-enable off brings it to the envelope-off level within 1 dB."
  - "Browser check `signal-path-sounding-envelope` in tests/browser/app.cjs: latch a sine with the Envelope off, switch it on and change attack while it sounds: the envelope stage still reads the voice's 'A 10 ms · R 30 ms' with a 'next note' annotation; a cutoff change while sounding does change the filter stage; after release and a new note the ADSR stage is the drawn one."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "engine.activeNodeCount returns to 0 after every stop in the new checks, in Chromium, Firefox and WebKit (project.audio-engine-discipline v2)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/audio and src/js/studio (project.review-verdict); the builder never writes it."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/engine.test.mjs"
  - "node tests/browser/app.cjs"
  - "npm test"
evidence_required:
  - "verified"
