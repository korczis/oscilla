id: C008
milestone: M090
serves:
  - "coherent-state#live-edits-reach-the-voice"
  - "coherent-state#views-describe-what-sounds"
title: "Envelope sustain and power reach a held note, and the Signal Path shows the envelope that sounds"
slug: envelope-sustain-and-power-reach-a-held-note-and-the-signal
priority: p1
profile: implementation
objective: "Lands as fix(audio). Findings dead-controls-3, control-census-3 and vis-divergence-5. labs.envelope.onChange only runs syncLabFlags and vizLabsChanged: on a held sine, Sustain 0.60 -> 0.10 moves the output by -0.007 dB (about -15.6 dB expected) and switching the envelope off by +0.008 dB, while the Signal Path, captioned 'Active Web Audio processing graph', redraws from the lab state (docs/v31/signal-path.md: the path shows what plays). The Filter, Additive and Phase labs already reach a sounding voice; the envelope is the only one that does not, and the header of src/js/labs/envelope.js says the engine follows its edits. Add retargetSustain(param, t, s) to src/js/audio/envelope.js (the value at t from the recorded schedule, anchored with setValueAtTime, an exponential ramp of at least MIN_SEGMENT_S to max(s, ENVELOPE_FLOOR); in attack or decay it re-ends the decay at the new target) and one engine method beside setPeriodicWave and setDualPhase that glides the tracked eg to the new sustain, or to 1.0 when the envelope is switched off, never above 1.0, and updates v.adsr and v.opts.adsr so _restart and top-ups follow. main.js writes no voice param. Attack and decay changes stay next-note: labVizInputs draws the envelope stage from the sounding voice's own adsr, attack and release as plain values and shows a differing lab setting as a 'next note: ...' annotation, re-synced when the voice ends; the Filter, Additive and router stages keep coming from the lab state because those labs are live. Correct the header comments of src/js/labs/envelope.js and src/js/audio/audio-engine.js."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
scope:
  - "src/js/audio/envelope.js"
  - "src/js/audio/audio-engine.js"
  - "src/js/labs/envelope.js"
  - "src/js/main.js"
  - "src/js/studio/playground-voice.js"
  - "src/js/visualization/signal-path.js"
  - "src/js/visualization/visualization-bridge.js"
  - "tests/unit"
