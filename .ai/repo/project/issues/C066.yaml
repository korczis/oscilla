title: "A tempo change keeps each tempo-locked block's beats; only the derived duration is clamped"
slug: tempo-change-keeps-locked-beats
priority: p2
profile: implementation
objective: "setTempo (src/js/sequencer/model.js:735-748) clamps a tempo-locked block's duration to its type's bounds and then re-derives beats from the clamped duration, so the block's length in beats is lost. Before (reproduced on a7102358): a tempo-locked chirp of 8 beats at 120 BPM (4000 ms) becomes 5 beats at 60 BPM (5000 ms, the chirp's cap) and returns to 120 BPM as 2500 ms. After: beats stay the block's own value; only the sounding duration is clamped, and a round trip restores 4000 ms."
why: "Review-findings audit of 2026-11-10, P3 pass (oscilla-ce, ordered by the integrator oscilla-43, format agreed with oscilla-c3; record .ai/repo/reviews/audit-2026-11-10-p3.yaml): 266.yaml#R-3 (P3), still open on main a7102358, checked by reading the code and, where noted, a probe or unit run; not re-measured in a browser."
