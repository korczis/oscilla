acceptance_criteria:
  - "CC 64 at 64-127 holds every key of its input and channel whose Note Off arrives while it is down; below 64 it releases them; a key pressed again meanwhile sounds until its own Note Off; a forced stop, All Notes Off and silence() are never held."
  - "Every CC of CC_SLOTS (src/js/synth/midi-cc.js) names a knob or an amount on the Synth panel's face (a unit test reads the panel declaration), and on the Engines tab the filter-envelope faders play the chosen engine's own envelope."
  - "A CC value v is the control's value at position v / 127 along its own scale (a log cutoff: 0 -> 10 Hz, 127 -> 20 kHz, the middle the geometric mean), set through the panel's setControl; a run of messages on one control is one undo entry, closed GESTURE_IDLE_MS after its last message or by another control."
  - "A CC moves no panel control outside the Synth workspace; in it the Synth's status line names the CC and the control, at most every CC_STATUS_MS for the same control."
  - "tests/browser/midi.cjs midi-seam-cc proves the pedal and CC 74 through the stub device; ADR 0058 records the V506 note; docs/midi.md documents the layout and its derivation."
validation:
