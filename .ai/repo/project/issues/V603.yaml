profile: implementation
objective: "Zoom the timeline with a two-pointer pinch anchored between the pointers, matching the keyboard zoom's levels and limits, by reusing the graph's pinch about the midpoint (V429; src/js/ui/studio/graph-geometry.js) and its unit test rather than writing a second pinch. Playwright has no multi-touch API, so the browser check dispatches synthetic PointerEvent pairs: it proves the handler, not a real gesture, and the issue says so. The timeline's pinch lives in src/js/ui/studio/timeline-editor.js and needs nothing from the workspace orchestrator, so it does not wait on E003; it waits on V431 because #197 changes timeline-editor.js."
why: "V3.1 Studio specification (docs/specs/oscilla-v3.1-studio.md); .ai/repo/features/studio.md, \"What it does not do\". Pinch cannot be driven as a real gesture in the gate (critique studio-completion, pinch-cannot-be-driven-in-the-gate)."
