id: J007
milestone: M118
serves:
- "component-system#majordomus-served"
title: "Each component says where its knowledge lives: the catalogue, the traceability chain, the explain panel and the extending guide"
slug: each-component-says-where-its-knowledge-lives-the-catalogue
priority: p2
profile: implementation
objective: "Lands as feat(ui). docs/ui-catalog.md and docs/ui-traceability.md (G014, G017) gain a column with each component's knowledge record id and the commands that read it (majordomus knowledge show <id>, knowledge related <id>, trace_issue <issue>). The What is this panel of G015, under ?debug=1, shows the record id, derived from the declaration id by the slug rule at run time (no per-component bytes), and a Copy button that copies the majordomus knowledge show command. docs/EXTENDING.md gains the section 'Add a component': declare it, write its trace entry, run npm run kb:components, read what npm test says is missing. Before: nothing in the app or the docs names a component's knowledge record. After: the catalogue, the chain, the panel and the guide do. Negative cases: a declaration whose slug collides (refused by J003, so the panel never shows two); ?debug=1 absent (no record id shown). Rollback: revert; the panel's debug row goes, nothing is saved."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs and knowledge base, interlink them and add more; knobs, sliders and control panels in one generic way, Majordomus integrated: each component and parameter declaration carries its intent, issue and rule ids, a deterministic generator projects the registry into .ai/repo/knowledge so that Majordomus serves it (context resolve, why, traceability), and a check fails when a component has no plan or knowledge link. Design: components-followup/majordomus-kb-adr.md of this plan change, measured with Majordomus 1.0.0-alpha.1 (the CI pin) and 1.0.0-alpha.8 on a throwaway copy of origin/main cdda563c."
scope:
- scripts/ui-catalog.mjs
- docs/ui-catalog.md
- docs/ui-traceability.md
- docs/EXTENDING.md
- src/js/ui/catalog/explain.js
- tests/unit/ui-catalog-explain-kb.test.mjs
