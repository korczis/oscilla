acceptance_criteria:
- "tests/unit/ui-catalog-explain-kb.test.mjs fails on the merge base: the run-time slug of every declaration id equals the file name J003 generated for it."
- "A browser check in tests/browser/ui-catalog-explain.cjs fails on the merge base: with ?debug=1 the panel of the Filter Lab cutoff shows component-panel-filter-lab and its Copy button copies the command, by pointer, keyboard and touch, at 390x844 and at 1536x1024; without ?debug=1 no record id is shown. It runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate, and adds nothing to tests/browser/timing-baseline.json (project.suite-harness, project.bounded-test-timing)."
- "Its chrome is the Pro markup of G015's drawer; it adds no osc-* name, legacy selector, inline style or stylesheet, and the ratchet stays equal or falls (project.ui-uses-flowbite-pro, ADR 0061)."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "scripts/size-report.mjs shows at most 0.3 KB gzip added, with the base and head figures in the pull request body, inside the line's cap (Q037) under the 1.2 MB budget (project.single-file-deliverable)."
- "tests/README.md has a row for each new test. dist is rebuilt and npm run build:check passes."
- "Definition of done, extends: the explain panel (G015) and the generated documents (G014, G017) gain the knowledge link."
- "Definition of done, interlinks: every component's panel row links its record, its issues and its rule."
- "Definition of done, interactivity: the debug row and its Copy button, by pointer, keyboard and touch."
- "Definition of done, docs, menus and routes: docs/EXTENDING.md 'Add a component'; README.md links it; Help keeps 'What is this?'."
- "Definition of done, tested: the unit test and the browser check above."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
validation:
