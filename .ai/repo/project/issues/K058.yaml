title: "Knob: a flat rotary control that always shows its value and unit"
slug: knob-a-flat-rotary-control-that-always-shows-its-value-and-u
priority: p1
profile: implementation
objective: "Lands as feat(ui). The ADR 0061 resolution note for the instrument visuals is J001's (one note for every instrument kind; the domain-view exemption of project.ui-uses-flowbite-pro is not widened); the knob's control is a Pro range input (role=slider and keyboard natively) under its SVG arc. D11 (owner, AskUserQuestion, 2026-10-29, recorded by Q018): src/js/ui/kinds/param/knob.js holds only value-to-angle and the view, over G003's parameter model (parse, format, log mapping) and N002's interaction model (step, fine step, drag, reset), as a view of N003's control interface whose browser contract it runs: a flat 270-degree SVG arc with label and always-visible value and unit in tabular numerals. Vertical drag (200 px full range, Shift x 0.1), no wheel unless focused with Ctrl or Cmd; ArrowUp/Right and ArrowDown/Left one step, Shift a tenth, PageUp/PageDown 10 % of the range, Home/End the bounds; Enter or a long-press opens a typed entry that accepts unit forms and refuses an out-of-range value with validateParamValue's reason; double-click or double-tap resets to the registry default; the ContextMenu key opens the knob menu. role=slider with aria-valuenow as the position 0..1000 (N003), aria-valuetext with value and unit, aria-label naming module and parameter, aria-describedby for modulation and disabled reasons; at least 44 px on a coarse pointer; values never tween and the modulation dot hides under prefers-reduced-motion. Its first user is the Studio Inspector's panel (N008) through K096 when Q020 is answered (a); otherwise it reaches the page through K062. Before: no rotary control exists; D5 bans one. After: a flat knob that always shows value and unit, by drag, keys, touch and typed entry. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it. Merged plan of the component follow-up (2026-10-30): Wave 1: it needs F001, not F002 (the arc is inline SVG with literal Tailwind utilities; the range input under it is visually hidden, so F002's form base styles do not change it). The modulation dot is N006's (measured), never read from AudioParam.value; the band is N005's. Amended 2026-11-07 (chore/plan-m064-rescope, the M064 audit of origin/main 37c52bee): the knob shipped through #367 (11cc9fbc) and Train 6 #420 (e8d54f8c) as the one knob model src/js/ui/synth/knob.js, whose panel skin is src/js/synth/view/knob.js, by the DRY-families decision of 2026-11-05 (M123; G021, G022); src/js/ui/kinds/param/knob.js does not exist and is not built. Criteria 1, 2 and 8 are re-scoped onto that design and keep their old text in current_state."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
current_state: "Audited on 2026-11-07 against origin/main 37c52bee (oscilla-a3's M064 audit with the plan coordinator, tests run; chore/plan-m064-rescope). The core shipped through #367 (merge 11cc9fbc) and Train 6 #420 (e8d54f8c); #329 itself was never merged to main, its content landed through #367; .ai/repo/reviews/329.yaml, 367.yaml and 420.yaml say merge. Criterion by criterion: 1 re-scoped (the note is on main, but calls K058's component planned); 2 re-scoped onto the shipped tests (synth-knob 7/7, ui-synth-knob 98/98; they assert '40k' where the criterion said '30k', the same bound); 3 partial: no test that Escape cancels the typed entry (src/js/synth/ui.js:648-676); 4 partial: the out-of-range typed value has a unit test (synth-knob.test.mjs:47) and no browser check, the no-tween case holds (synth-knob.test.mjs:59), Escape in the typed entry is untested, and the wheel turns a knob without focus and leaves Ctrl or Cmd to the page (src/js/synth/gestures.js:58-79, asserted by tests/browser/synth.cjs s-feel), the opposite of the criterion, which no owner direction supersedes, so it is not re-scoped; 5 not met: tests/browser/knob.cjs does not exist, the Synth keeps nothing across a reload (s-dock asserts 'Reload keeps nothing'), no modulation dot or reduced-motion check, no touch drag; 6 met; 7 left as written: 'lands after F002' contradicts the objective's 'Wave 1: it needs F001, not F002' and no owner direction settles it; 8 re-scoped (the panel skin is guarded and the verdicts exist); 9 not proven per issue: #329's 23 381 B gzip is not split per plan id (K059's current_state), so the 3 KB cap binds the remaining builds; 10 met. Old text of the re-scoped criteria: criterion 1 was: \"J001's ADR 0061 resolution note is on main before any code of this slice lands, and tests/unit/ui-flowbite-pro.test.mjs passes with the knob added (no new stylesheet, selector or class name outside Tailwind and Pro).\"; criterion 2 was: \"tests/unit/knob.test.mjs, failing on the merge base: the value model round-trips value, angle and drag for linear and log parameters (a 1 px drag on a 20 Hz-20 kHz cutoff moves it by the same ratio anywhere on the range), Shift divides the step by 10, PageUp moves 10 %, Home and End reach the bounds, a typed '1.2k' on a Hz parameter is 1200 and '30k' is refused with the registry's reason, and formatting states the unit for every unit the registry uses today (none, cents, dB, Hz, logical gain, s, samples) and for each unit an instrument slice adds (semitones, octaves, %, ms), which that slice registers here.\"; criterion 8 was: \"Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first).\"; validation was: \"node --test tests/unit/knob.test.mjs\"."
