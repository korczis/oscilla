title: "Knob: a flat rotary control that always shows its value and unit"
slug: knob-a-flat-rotary-control-that-always-shows-its-value-and-u
priority: p1
profile: implementation
objective: "Lands as feat(ui). The ADR 0061 resolution note for the instrument visuals is J001's (one note for every instrument kind; the domain-view exemption of project.ui-uses-flowbite-pro is not widened); the knob's control is a Pro range input (role=slider and keyboard natively) under its SVG arc. D11 (owner, AskUserQuestion, 2026-10-29, recorded by Q018): src/js/ui/kinds/param/knob.js holds only value-to-angle and the view, over G003's parameter model (parse, format, log mapping) and N002's interaction model (step, fine step, drag, reset), as a view of N003's control interface whose browser contract it runs: a flat 270-degree SVG arc with label and always-visible value and unit in tabular numerals. Vertical drag (200 px full range, Shift x 0.1), no wheel unless focused with Ctrl or Cmd; ArrowUp/Right and ArrowDown/Left one step, Shift a tenth, PageUp/PageDown 10 % of the range, Home/End the bounds; Enter or a long-press opens a typed entry that accepts unit forms and refuses an out-of-range value with validateParamValue's reason; double-click or double-tap resets to the registry default; the ContextMenu key opens the knob menu. role=slider with aria-valuenow as the position 0..1000 (N003), aria-valuetext with value and unit, aria-label naming module and parameter, aria-describedby for modulation and disabled reasons; at least 44 px on a coarse pointer; values never tween and the modulation dot hides under prefers-reduced-motion. Its first user is the Studio Inspector's panel (N008) through K096 when Q020 is answered (a); otherwise it reaches the page through K062. Before: no rotary control exists; D5 bans one. After: a flat knob that always shows value and unit, by drag, keys, touch and typed entry. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it. Merged plan of the component follow-up (2026-10-30): Wave 1: it needs F001, not F002 (the arc is inline SVG with literal Tailwind utilities; the range input under it is visually hidden, so F002's form base styles do not change it). The modulation dot is N006's (measured), never read from AudioParam.value; the band is N005's."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
