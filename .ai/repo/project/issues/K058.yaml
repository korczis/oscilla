acceptance_criteria:
  - "ADR 0061's resolution note for the instrument visuals (its section of 2026-10-30) is on main, landed through #367 (11cc9fbc) with the knob rather than before it, and names the knob as shipped: src/js/ui/synth/knob.js is the one knob model and src/js/synth/view/knob.js its panel skin (the DRY-families decision of 2026-11-05: M123, G021, G022), where today it calls src/js/ui/kinds/param/knob.js K058's planned component; tests/unit/ui-flowbite-pro.test.mjs passes with the knob (no new stylesheet, selector or class name outside Tailwind and Pro)."
  - "The knob's value model is the one knob model src/js/ui/synth/knob.js (the DRY-families decision of 2026-11-05), proven by tests/unit/ui-synth-knob.test.mjs and tests/unit/synth-knob.test.mjs, which landed with it through #367 and #420, in place of a tests/unit/knob.test.mjs: value, angle and drag round-trip for linear and log parameters (on a log range equal ratios are equal norm distances, so a 1 px drag on a 20 Hz-20 kHz cutoff moves it by the same ratio anywhere on the range), Shift divides the step by 10, PageUp moves 10 %, Home and End reach the bounds, a typed '1.2k' on a Hz parameter is 1200 and an out-of-range value ('40k' on the 10-20000 Hz cutoff) is refused with the registry's reason, and the knob's text states the unit for every unit the registry uses today (none, cents, dB, Hz, logical gain, s, samples) and for each unit an instrument slice adds (semitones, octaves, %, ms), which that slice registers in those tests; the readout always shows the number (Q018, the owner: 'Knoby s číslem', knobs with a number shown)."
  - "A drag is one gesture: the knob emits one commit per pointer-up and only live previews in between; a key press or a typed commit is one commit; nothing commits while a typed entry is open and Escape there cancels the typing only, never the page's Escape meaning beyond it."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: an out-of-range typed value; a wheel event without focus and modifier; Escape in the typed entry; a value tween."
  - "A browser check in tests/browser/knob.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a knob mounted on a fixture parameter shows the value that the bound fixture store holds after reload. Real-time: aria-valuenow, aria-valuetext and the visible value text change together after a drag, a key press and a typed commit, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: pointer drag (with and without Shift), every key above and a synthesized touch drag each change the value; role=slider and its aria-valuetext with unit are asserted in the accessibility tree; under emulated prefers-reduced-motion the modulation dot is not rendered. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every string it adds passes tests/unit/synth-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "Its chrome uses the Flowbite Pro component where Pro has one (card, button, button group, input, dropdown, tabs, tooltip, popover), adapted from that block, lands after F002, is recorded as migrated (never pending) and lowers or keeps the ratchet; the instrument visuals Pro has no component for (the knob arc, the cable layer, the piano keys, the pad surface) are inline SVG and Tailwind utilities inside Pro cards, as the ADR 0061 resolution note of K058 records; it adds no osc-* class token, no legacy selector, no inline style and no stylesheet (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs); every continuous instrument parameter it shows is the knob of K058 (D11)."
  - "The knob's panel skin src/js/synth/view/knob.js is under a guarded path (src/js/synth/*, scripts/review-verdict.mjs GUARDED; project.review-verdict v2), so each pull request that changes it carries a reviewer's verdict: .ai/repo/reviews/329.yaml, 367.yaml and 420.yaml (each 'merge') judge what shipped; the core src/js/ui/synth/knob.js is not guarded; as a feat or fix change each carries a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
