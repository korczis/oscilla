id: N001
milestone: M111
serves:
- "parameter-controls#one-declaration"
title: "One parameter declaration: the section 79 descriptor plus id, state path, links, docs and a stated reason, derived for every registry parameter"
slug: one-parameter-declaration-the-section-79-descriptor-plus-id-st
priority: p2
profile: implementation
objective: "Lands as feat(ui). src/js/ui/catalog/param-spec.js exports paramSpec(descriptor, { id, state, links, docs, staticReason }), which freezes the section 79 descriptor of src/js/studio/nodes/common.js (key, label, type, min, max, step, unit, scale, options, default, softRange, automatable, modulatable, modDepth: unchanged, built only by numberParam, frequencyParam and the other constructors) with four new fields: a global id, a canonical state path in G001's sources grammar (documentation and tests only; nothing resolves it at run time), links (opens, related) as G007 addresses, and a one-sentence docs; staticReason is required exactly when a number or integer parameter is neither automatable nor modulatable (synth K105's rule, moved here so it lands in wave 1). specsOf(type) derives the spec of every NODE_REGISTRY parameter (id studio.param:<type>.<key>, state studio.param:<type>.<key>, links to its node, docs from the node's help); the only registry edit is staticReason on the parameters that need one. The parameter declarations of G018 and G019 (kind param) are paramSpec values; no third declaration exists. The ADR is J001's: its first decision states that a parameter is declared once and every control is a projection of it; this slice cites it and writes no ADR. Before: VERIFIED the descriptor has automatable and modulatable but no id, state, links, docs or reason; seven hand-built parameter fields declare nothing. After: one declaration per parameter, validated in Node. Negative cases: duplicate id, scale log with min <= 0, default outside the range, state not in sources, docs that repeats the label, a continuous parameter that is neither automatable nor modulatable without a reason. Rollback: revert the merge commit; nothing stored changes (the registry is not in the model, so no studioHash changes)."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, KB and interlinking; full DAW, full sequencer, full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels in one generic way, integrated with Majordomus; every element tweakable; mobile first; the landing easy to use, easy to extend and open to hack. Owner decisions: knobs that always show value and unit (D11, Q018, the ADR 0058 note of 2026-10-29), every parameter on the box face (Q031), the generator in its own workspace (Q033). Design: the params-controls part of the component follow-up of 2026-10-29 (scratchpad components-followup/params-controls.md), checked against origin/main b67d1e58 and the head of plan pull request #285 (c0a631b2)."
