acceptance_criteria:
- "tests/unit/param-spec.test.mjs fails on the merge base: every NODE_REGISTRY parameter has a derived spec that validates; each negative case above is refused with its reason; every spec id is unique across the registry and the catalogue; every state path satisfies sources.has()."
- "Definition of done, tested: No browser check is owed: the slice adds no rendered surface; the declarations are proven in Node, and N003 and N009 assert them in the browser."
- "Definition of done, extends: the section 79 descriptor and defineNode registry, unchanged in shape."
- "Definition of done, interlinks: every spec names its address and related views, which G016's link graph walks and G015's panel shows."
- "Definition of done, interactivity: none directly; N002 and N003 make every declared parameter operable the same way."
- "Definition of done, docs, menus and routes: docs/v31/studio-model.md states the four fields and the staticReason rule; the decision is J001's ADR, linked from the doc. tests/README.md has a row for each new test; the parameter's or view's catalogue entry names its docs, links and tests (G001 trace part); dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its scope includes guarded paths (src/js/studio/nodes; scripts/review-verdict.mjs GUARDED), so the pull request carries a reviewer's .ai/repo/reviews/<pr>.yaml written by a session that did not build it (project.review-verdict); as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; no module, listener or string it adds contains an osc- name; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 1.0 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the line's sum stays within its row of the cap Q037 records, under the 1.2 MB gzip budget of scripts/build-config.mjs (project.single-file-deliverable)."
