- "From K105 (merged by Q112): a browser check in tests/browser/synth.cjs, wired into npm run test:synth, fails on the merge base. Linked: a parameter's deep link opens the Studio with that node selected and that parameter focused in the Inspector, and Back returns to the card. Real-time: after the deep link, a knob turn on the card changes the focused Inspector value within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: every control of one card per node type is reached by Tab and operated by keyboard, pointer and touch, its role asserted. It runs inside tests/browser/lib/suite.cjs and adds nothing to tests/browser/timing-baseline.json."
- "From K105 (merged by Q112): every edit is one undoable dispatch through the one Studio store and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback); every link it adds is a row of tests/browser/integration-map.json walked by tests/browser/integration-map.cjs; every string it adds passes tests/unit/synth-wording.test.mjs; a change under src/js/studio carries a reviewer's verdict (project.review-verdict); scripts/size-report.mjs shows at most 1 KB gzip added within the cap Q023 records."
