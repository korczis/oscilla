profile: implementation
objective: "From the Signal Path view, open the Playground voice as an editable Studio project built from the derived graph that view draws (docs/v31/signal-path.md; src/js/studio/playground-voice.js, signal-path-projection.js). Schema 1 has no field for an additive oscillator's partial count or the dual B side's start phase, which travel as annotations the compiler does not read, so the Additive lab and a dual voice with a non-zero B phase cannot sound the same: refuse them with that reason unless this issue adds the fields with a schema bump and a migration. The covered configurations are listed in the test: the single and dual sources (B phase 0) and the sweep, each V1 pattern of src/js/data/presets.js (siren, wobble, AM, FM, sequence, pulse, octave, chirp) mapped onto Studio nodes and the timeline, or refused with the reason where it does not map. The open action lives in the file I/O and navigation module E003 splits out of workspace.js, which is why it waits on E003."
why: "Conversation 6abec18d, 2026-10-02T03:22:47Z: Signal Path becomes a main interaction, not only a visualization. The derived model was built for drawing (critique studio-completion, voice-model-cannot-sound-the-same)."
