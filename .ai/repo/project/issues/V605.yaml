acceptance_criteria:
  - "tests/unit/playground-voice-in-studio.test.mjs lists the covered configurations and, for each, the opened project's offline render matches the Playground voice's with a residual RMS at least 60 dB below the Playground render's RMS; each unsupported configuration is refused with its reason; it fails on the merge base."
  - "A browser check renders the listed configurations through OfflineAudioContext in Chromium, Firefox and WebKit, as tests/browser/v31-studio-offline.cjs does."
  - "Opening is one action that leaves the Playground unchanged and the Studio with one new unsaved project."
  - "The pull request carries a reviewer's verdict and, as a feat change, fail-first (project.review-verdict, project.fail-first; src/js/studio is guarded); a capped file it grows past its cap is split first or its raise is declared in tests/unit/source-size-baseline.json's raises ledger."
  - "tests/README.md has a row for each new test; V606 registers the claim; this issue does not edit docs/CLAIMS.yaml or the intent."
validation:
