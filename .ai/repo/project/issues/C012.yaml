acceptance_criteria:
  - "A unit test with a fake engine counting setMasterGain: the first ensureAudio writes once, a second on a running context writes nothing, and one after the context reports 'closed' writes again; it fails on the merge base."
  - "Browser check `studio-level-survives-gesture` in tests/browser/v31-studio-transport.cjs: subtractive-synth with Master level 0.02 playing, a pointerdown on a node title and a keydown leave engine.gainLevel and master.gain at 0.02, and STOP restores the Playground level."
  - "Browser check `status-bar-studio` in the same suite at 1536x1024: while only the Studio plays, [data-osc=\"status.state\"] reads PLAYING with is-playing and the gain readout shows the Master level (-26.0 dB for 0.05); the hidden status Play key keeps its instrument meaning."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/studio (project.review-verdict); the builder never writes it."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
