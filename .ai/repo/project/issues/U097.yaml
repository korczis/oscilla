objective: "Lands as fix(ui). Lane A's new check ui-current phone-whole-overlap-studio-320 (feat/a-connect-phone, #386) finds the docked keyboard's arm and octave buttons covering the Studio page header's actions at 320 x 568, on darwin as on linux. #386 records it as PHONE_WHOLE_DEBT '@320:studio:overlap' with the Studio lane as owner, so the train lands with the finding visible; this issue is the fix. The fix sits in the shell's dock placement or the Studio header's phone layout, in one place, not per control: at 320 x 568 either the dock yields the header row (the dock starts below the header's actions, or the actions move above the dock's reach) or the header's actions fold into the Studio's overflow menu on phones below 360 px; the check's debt entry is removed in the same change and the ledger shrinks by one."
why: "Owner order of 2026-11-02 (the whole interface mobile-first, the phone-whole criterion) and 2026-11-04 (no control hidden under another). Filed by a3 on 2026-11-05 at 21's request so the debt entry cannot vanish into the ledger; 320 x 568 is the smallest profile the phone-whole check covers (iPhone SE, first generation)."
