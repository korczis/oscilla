title: "Send the generator's signal to Studio, the Analyzer and MEASURE"
slug: send-the-generator-s-signal-to-studio-the-analyzer-and-measu
priority: p2
profile: implementation
objective: "Lands as feat(ui). Three actions in the Generator workspace: 'Open in Studio' opens the current pattern as a Studio project through V605's mapping, extended to the patterns K133-K135 add (noise to the Noise node, a two-tone to two Oscillators into a Mixer, a burst to an Oscillator with an event clip), refusing a pattern the Studio cannot represent with the reason and guarded by studioWhatWouldBeLost; 'Open in Analyzer' moves to the Analyze workspace with the requested-frequency markers of the plan; 'Use in MEASURE' hands a log sweep's start, end, duration and level to MEASURE's stimulus step (MEASURE measures with the log sweep only; any other pattern is refused with that reason)."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings G1-G14 measured on origin/main b67d1e58)."
