acceptance_criteria:
- "Before: VERIFIED (G11, G12): no hand-off from the generator to Studio, the Analyzer or MEASURE."
- "After and negative cases: as the objective and the criteria below state; the setpoint (what was requested) and the observation (what the analyser measured on the digital output, or the microphone on the room) are separate readouts with separate labels, and no readout claims the acoustic output."
- "Rollback: revert the merge commit. Nothing changes the schema, a studioHash, URL key meaning or stored preset, so documents saved while it was live load unchanged after the revert."
- "tests/unit/generator-handoff.test.mjs, failing on the merge base: each pattern maps to the Studio model V605 defines or to a refusal with the reason; the Studio render of the mapped patterns matches the Playground render with a residual at least 60 dB below its RMS (V605's bound); the MEASURE hand-off produces the stimulus spec the MEASURE workspace normalizes without clamping, or the refusal."
- "Definition of done, extends: V605's Playground voice in Studio and the MEASURE stimulus step."
- "Definition of done, cross-links: three links, each a round trip: Studio (open, Back), Analyzer (open, Back), MEASURE (open with the stimulus, Back). The link is a row of tests/browser/integration-map.json once that map (synth line K075) is on main."
- "Definition of done, dynamics: the Analyzer opens with the plan's markers live."
- "Definition of done, docs and routes: README.md's Playground feature list and docs/GLOSSARY.md where a term is new; .ai/repo/features/playground.md (or the feature record of the Playground) says what changed; the integration map rows of the three links. tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'handoff' in tests/browser/generator.cjs opens a two-tone in Studio by pointer and waits with until() (deadline 'two oscillators in Studio', 5 s) for the model; Back; hands a log sweep to MEASURE by keyboard and waits for its stimulus fields; opens the Analyzer by touch in a hasTouch context and waits for two markers; on the merge base the actions do not exist. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit and the completed evidence the release that carried it; E030's judge passes on the pull request once E030 is on main."
- "The pull request carries a reviewer's verdict (it touches a guarded path; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
- "Wave 2: its chrome is Flowbite Pro markup adapted from the matching Pro component, lands after F002, adds no osc-* class token or legacy selector, and studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration; the domain drawing stays OSCILLA's own inside Pro cards (project.ui-uses-flowbite-pro, project.visual-identity-lock v2; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 2 KB gzip added, with the base and head figures in the pull request body, within the owner's dist budget of 1 200 000 B gzip (decision of 2026-10-29, about 355 KB of headroom at origin/main b67d1e58); the ceiling of this line is 25 KB gzip in all (Studio boxes 35 KB, signal generator 25 KB), stated in the milestone (project.single-file-deliverable)."
validation:
- node --test tests/unit/generator-handoff.test.mjs
- node tests/browser/generator.cjs --only handoff
- npm test
evidence_required:
- verified
