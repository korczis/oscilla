  - "scripts/review-verdict.allowance.json"
  - "scripts/ratchet-history.mjs"
  - "scripts/ui-flowbite-pro-measure.mjs"
  - "tests/unit/review-verdict.test.mjs"
  - ".ai/repo/rules/project/review-verdict.v2.md"
  - ".ai/repo/rules/project/review-verdict.v3.md"
  - ".ai/repo/rules/project/README.md"
  - ".github/workflows/ci.yml"
  - "CLAUDE.md"
  - "tests/README.md"
depends_on:
  - "Q091"
  - "R029"
  - "R032"
acceptance_criteria:
  - "Fail-first: tests/unit/review-verdict.test.mjs runs the guard over a fixture diff touching src/js/ui/studio/x.js, src/index.html and a new file src/js/newdir/y.js with no verdict and expects a refusal naming each; on the merge base all three pass."
  - "The v2 assertion tests/unit/review-verdict.test.mjs:185-189 (src/js/main.js, src/index.html and src/js/ui/shell.js are not guarded) flips in the same change: the three are guarded, and the non-src negatives of that list (scripts/review-verdict.mjs.bak, docs/src/js/audio/x.md, docs/.github/workflows/ci.yml, .ai/repo/reviews/1.yaml) stay unguarded."
  - "A test enumerates git ls-files src and asserts every path is guarded or named in the allowance with a non-empty reason; the allowance at landing is [] (asserted)."
  - "Bypass: a fixture pull request that adds its own path to its checkout's scripts/review-verdict.allowance.json, with no verdict, is refused by the base program (which reads the base's copy), and the refusal also names the allowance file as a guarded change."
  - "Ratchet: the allowance is judged against every committed version on the base's first-parent chain from the fork through scripts/ratchet-history.mjs; a fixture whose branch adds an entry in one commit and judges it against that branch commit is still refused, an added entry without a raises entry naming the pull request fails, and the ui-flowbite-pro history tests pass unchanged on the factored helper."
  - "Every path v2 guards outside src/ is still guarded (the v2 list is a subset of v3's outside src/), asserted by a test."
  - "Release exemption: a chore(release) fixture whose only src changes are src/data/roadmap.json and the About station data file passes only if each equals the output of the base copy's scripts/roadmap.mjs and station step (R032) on the same inputs; a hand edit of either fails naming it; a non-release pull request touching either needs a verdict."
  - "review-verdict.v2.md is status deprecated; v3.md names its enforcement (project.rules-name-their-enforcement), the seats, the fallback and the expected load; .ai/repo/rules/project/README.md:65 and CLAUDE.md's rule line name v3."
  - "Guarded (.github/*, scripts/review-verdict.mjs, tests/unit/review-verdict.test.mjs): judged by v2's list from the base branch, so it needs a verdict from prismatic-majordomus-98, who builds none of it. Lane: oscilla-b0."
validation:
