objective: "Lands as docs(adr). ADR 0061's resolution note of 2026-10-30 (.ai/repo/adrs/0061-the-ui-is-built-on-flowbite-pro.md, 'the instrument visuals, and the Synth panel surface narrows the skeuomorphism ban') says K058's own component, src/js/ui/kinds/param/knob.js, remains planned work and that the Synth panel's knob is panel-local until it lands. The knob shipped instead as the one knob model src/js/ui/synth/knob.js with src/js/synth/view/knob.js its panel skin (#367, #420), and the DRY-families decision of 2026-11-05 (M123, G021, G022) makes that core the one knob. An appended resolution note says so and names G022 as the owner of any later split of the model; every section above it and the record's status stay unchanged. Before: the ADR names a planned component that will not be built. After: it names the knob that ships. Rollback: revert; records only."
why: "Gap of K058 (criterion 1) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): the ADR 0061 note on main calls K058's component planned, while the knob shipped as the one knob model. No owner direction re-scopes it, so it is its own issue and K058's criterion points here (chore/plan-m064-rescope). K058 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
