id: E062
milestone: M046
serves:
  - "engineering-integrity#queue-lands-tested-tree"
title: "fail-first: the base-tree run is retried, a test path runs literally, and its refusals say what to do"
slug: fail-first-retries-base-run-literal-paths
priority: p2
profile: implementation
objective: "Four limits of scripts/fail-first.mjs on main: (1) the run on the merge base's source runs once, so one load-induced failure counts as \"fails without the change\" (252 R2); (2) a test file is passed to node --test as a glob, so a file named with [ ] * ? is not found and a valid fix is refused (252 R3; on Node 22.20.0 \"a[1].test.mjs\" exits 1 \"Could not find\"); (3) a head failure that needs git history (tests/unit/about.test.mjs) gets the generic refusal with no pointer to the waiver (164 R2-P2-9); (4) the rule says every type other than feat and fix has nothing to prove, and nothing assigns checking the title to the reviewer (164 R3-P2-5). Retry the base-tree run as the head run is retried and count it as evidence only when it fails both times; run a test file by literal path; name the git-history case and the waiver in the refusal; state in rule project.fail-first (next version) that the title's type is the reviewer's to check, or compare it with the commits' types."
why: "Review-findings audit of 2026-11-10 (rev-seat-2 oscilla-c3, ordered by oscilla-43 with oscilla-c1; record .ai/repo/reviews/audit-2026-11-10.yaml): 252.yaml#R2, 252.yaml#R3, 164.yaml#R2-P2-9 and 164.yaml#R3-P2-5 (P2) still open on main b8bfd3b6."
scope:
  - "scripts/fail-first.mjs"
  - "tests/unit/fail-first.test.mjs"
  - ".ai/repo/rules/project"
  - ".ai/repo/project/issues/E062.yaml"
depends_on: []
acceptance_criteria:
  - "A base-tree failure that passes on its retry is not evidence; a test file whose name holds [ ] * ? runs; the git-history refusal names the waiver; the rule text states who checks the title type. Each has a unit case that fails on b8bfd3b6."
validation:
  - "node --test tests/unit/fail-first.test.mjs"
evidence_required:
  - "verified"
