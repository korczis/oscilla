title: "One control interface: mountControl, its pure attribute model and a shared browser contract every surface's suite runs"
slug: one-control-interface-mountcontrol-its-pure-attribute-model-an
priority: p2
profile: implementation
objective: "Lands as feat(ui). src/js/ui/kinds/param/control.js defines mountControl(host, spec, { view, surface, value, commit, menu, density }) -> { set, setDisabled, setModulation, setAutomation, focus, destroy, element }, the one interface the knob (K058), the slider and field of G008, the toggle and the choice implement; viewFor(spec, surface) picks the view deterministically (number and integer: knob on instrument surfaces, slider and field on forms, per D11; enum up to five options a button group, more a select; boolean a toggle; list a field; id readonly). commit(value, gesture) takes begin, update, end or once and returns true or { refused }; the control holds no value, resolves no state path, subscribes to nothing and evaluates no condition. controlAttrs(spec, view, state) is pure and gives role, name, aria-valuenow as the position 0..1000 (so a log parameter steps in its log domain and a value beyond the display range stays truthful in aria-valuetext), aria-valuetext with value and unit, aria-describedby ids for unit, modulation, automation, error and disabled reason, aria-disabled with the control still focusable, and the coarse-pointer target size. tests/browser/lib/control-contract.cjs exports assertControlContract(page, locator, spec, view): role, name, valuetext, the keys of N002, Shift fine, Home and End, double-click and double-tap reset, typed entry and its stated refusal, a touch drag where the view has one, the disabled reason, and 44 px on a coarse pointer. First subject after F001: the Studio Inspector's number field is adapted to the interface without markup change. Before: VERIFIED seven parameter-field variants with different labels, valuetext missing on two sliders (inventory C4, C5). After: one interface and one contract. Negative cases: a refused commit (the owner's value is shown again and the refusal stated), destroy leaving a listener behind, a view missing aria-valuetext or the disabled reason. Rollback: revert. Merged plan of the component follow-up (2026-10-30): The handle shape { element, set, setDisabled, destroy } and the commit result true or { refused } are the ones every kind of W001 uses, so the param kind is one kind among them; this slice adds the param kind record to W001's table. The views keep only transient interaction state (focus, an in-progress drag preview, an open typed entry), never readable from outside and never persisted. The slider and field views carry the Pro range and number-input class lists as literal Tailwind utilities (F001 compiles them; F002's form base styles then apply without change); no class name is built from a template literal and no view writes el.style. G008 mounts these views in the labs."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, KB and interlinking; full DAW, full sequencer, full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels in one generic way, integrated with Majordomus; every element tweakable; mobile first; the landing easy to use, easy to extend and open to hack. Owner decisions: knobs that always show value and unit (D11, Q018, the ADR 0058 note of 2026-10-29), every parameter on the box face (Q031), the generator in its own workspace (Q033). Design: the params-controls part of the component follow-up of 2026-10-29 (scratchpad components-followup/params-controls.md), checked against origin/main b67d1e58 and the head of plan pull request #285 (c0a631b2)."
