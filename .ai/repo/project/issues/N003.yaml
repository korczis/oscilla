acceptance_criteria:
- "tests/unit/control-contract.test.mjs fails on the merge base: for every view, controlAttrs over a table of specs and states (plain, beyond the display range, disabled, modulated, automated) gives the role, name, valuenow position, valuetext with unit and describedby ids; every view module exports the interface; a static scan finds no store subscription, state-path resolution or osc- name in src/js/ui/kinds/param."
- "Definition of done, tested: tests/browser/v31-studio-graph.cjs runs assertControlContract on the Inspector's cutoff field and slider of a Filter node, by keyboard, pointer and touch (hasTouch), waiting with until() (deadline 'control contract', 3 s) for each step; the harness itself has a unit self-test against a fixture that violates each clause. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), runs at 390x844 and at 1536x1024, adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, extends: G008's mountControl entry point, widened with modulation, automation and the gesture phases."
- "Definition of done, interlinks: every control carries data-osc-param with its spec id, which the census (N009), the explain panel (G015) and the link graph (G016) find."
- "Definition of done, interactivity: every control of every view has the same keys, drag, typed entry, reset and stated refusal."
- "Definition of done, docs, menus and routes: docs/ui-catalog.md (generated by N010) documents the interface; until then its section in docs/v31/user-guide.md. tests/README.md has a row for each new test; the parameter's or view's catalogue entry names its docs, links and tests (G001 trace part); dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "After F001: its views carry Pro class lists as literal Tailwind utilities only; it adds no osc-* class token, no legacy vocabulary use, no selector and no inline style, and removes legacy ones where it touches them, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 0.8 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the line's sum stays within its row of the cap Q037 records, under the 1.2 MB gzip budget of scripts/build-config.mjs (project.single-file-deliverable)."
