title: "A Studio document with a Clock plays until STOP, past its content, and its Clock keeps ticking"
slug: clock-only-document-ticks
priority: p2
profile: implementation
objective: "timelineEnd (src/js/studio/timeline.js) counts only clips and automation points, so a document with a Clock ended at its content (at 0 with no clips): the Clock's ticks stopped and the transport ended the run by itself. After (scope widened by the integrator oscilla-43 and restated per C1-K241-2): a live document with a Clock and no loop of the user's plays until STOP, past its content: it plays the content, then repeats the empty bar after it (clock.js freeRunLoop, applied by createAnchor for PLAY and every re-anchor), so the Clock keeps its grid; a clip added during the run plays and the run goes on; the playhead counts up. A document without a Clock ends at its content as before; an offline render ends at its content. The Clock's Czech help states this (CLOCK_FREE_RUN_TEXT). No template or panel ships a Clock, so existing documents are unaffected."
why: "Review-findings audit of 2026-11-10, P3 pass (oscilla-ce, ordered by the integrator oscilla-43, format agreed with oscilla-c3; record .ai/repo/reviews/audit-2026-11-10-p3.yaml): 509.yaml#K023-1 (P3), still open on main a7102358, checked by reading the code and, where noted, a probe or unit run; not re-measured in a browser."
current_state: "Built by oscilla-0b (session bbcd8e21-77c5-407d-b96e-e2451f1cdee9) on fix/k241-clock-only-ticks off train T5 192a21fa, commit 27ad5ce1 (clock.js freeRunLoop applied by createAnchor); for train T6, judged by oscilla-c1. Landed by PR #525 (db95130e, train T7a); done on 2026-11-11 after its builder re-checked every criterion on main 0e20f83c (evidence below)."
