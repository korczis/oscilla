id: U121
milestone: M054
serves:
  - "ui-current#phone-whole"
title: "On a phone the Synth's content ends above the docked keys (K247 parity), so no Synth control sits under the dock's buttons on the first screen"
slug: "synth-content-ends-above-dock"
priority: p3
profile: implementation
objective: "Lands as fix(ui). The Synth keeps the docked keyboard floating over its own content: its view reserves the dock's band with bottom padding (pb-[max(1.5rem,var(--osc-dock-h,20rem))]) while every other workspace ends <main> above the dock (K247, !mb-[dock-h - statusbar-h]). Whatever Synth control lies in the dock's button band on the first screen is measured as overlapped, so R375 and R320 of tests/browser/ui-current.cjs only move when the header moves. The fix gives the Synth K247's geometry: its content ends at the dock's top, so the dock covers nothing of it. It touches the Synth's scroll region (main's !block !pt-0 scroll-pt for the Synth's sticky section nav), src/js/synth/ui.js's nav room and src/js/midi/dock-yield.js."
why: "oscilla-0b measured a header-only fix on 2026-11-22 (darwin, chromium, firefox and webkit alike): with Open in Studio and Copy link as icons below sm, the chips at 375 x 667 cleared the dock (MARGIN -39 -> +13 px) but the next panel buttons took their place, 3 pairs 42 px deep instead of 6 pairs 30 px; at 320, 5 chip pairs at 11 px instead of Copy link at 25 px. That moves the debt, not shrinks it, so oscilla-43 (Q090, 2026-11-22) chose the structural fix and dropped the header change unless the structural fix still needs it."
current_state: "Re-scoped 2026-11-22 by oscilla-0b on oscilla-43's decision (Q090): first filed by oscilla-e5 with #601 as moving the chips or the docked padding; a header-only attempt was measured and dropped (see why). Design settled under Q090 by oscilla-d9 on 2026-11-22 against origin/main 6f5e9346: (a) K247 parity for the Synth only, the Studio stays; <main> drops the Synth exclusion from K247's margin, the Synth view's band padding becomes pb-6 and main's scroll-pb of --osc-dock-h is 0 on the Synth. (b) nav-room.js keeps C1-R2T51-2's fold invariance with a geometry-free rule: bottom = min(mainRect.bottom, innerHeight - dockedBand) (dockedBand = max(now, DOCKED) as today; no fixed dock: mainRect.bottom), avail = bottom - mainRect.top, sticks = avail - navH >= NAV_ROW_PX; navRoomOf({ mainTop, mainBottom, navH, dockTop }) stays pure, with unit cases for the old geometry (same as today), the new one docked (no double count) and the new one folded (sticks as docked); the module header loses its scroll-pb note. (c) Traps: U108 condition 4, the Synth's own-work share floor, is clipped to the viewport, not to main, so pb-6 can drop it under 2/3 on a tall phone with a short tab (390 x 844, XY or Drums): measure before and after at 320, 375 and 390; if it falls, the share is judged against main's rect (oscilla-c3's floor, asked of c3), never a new debt key. U100 and U107 (C3-539-2, in U108) carry no trap. Runs: synth-nav-room unit, xy-pad (phone-dock-se in webkit), synth, iphone and ui-current in three engines, and the SYN phone visuals in the noble container. Built by oscilla-0b on fix/u121-synth-k247-parity (2026-11-22) per that settlement: ui-current on darwin in chromium, firefox and webkit pays the Synth's @320, @375 and @390 overlap debts (0 pairs; they leave PHONE_WHOLE_DEBT and PHONE_WHOLE_PAIRS), the MARGIN line clipped to <main> reads 2, 2 and 18 px, the own-work share is unchanged (78.5, 81.7, 85.5 %). The trap oscilla-d9 named hit: webkit's iPhone SE (xy-pad x-dock-yields) left the XY pad under the sticky nav after an unfold; d9's discriminator ruled out the content slack, and the fix d9 proposed (dock-yield's settle re-places a surface a sticky bar hides, underStickyBar, narrowed to a top inside the scroller for R6) makes it pass. PRO.pageDocked now carries pb-6 like every view."
