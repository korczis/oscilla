acceptance_criteria:
- "tests/unit/ci-knowledge-job.test.mjs fails on the merge base: the new step exists, runs after doctor under the pinned version, has a timeout, and its verdict fails the fixture with a components finding and passes the fixture without one."
- "majordomus context for a task bound to a component issue prints a KNOWLEDGE POINTERS section that lists the component records in its scope, and stays inside context.builder_budget_lines (the line counts before and after are in the pull request body)."
- "majordomus doctor passes under the pinned version and the launcher's with the profile key (the key is in the profile schema of both, checked 2026-10-29)."
- "Its paths are guarded (.github/*): it needs a reviewer's .ai/repo/reviews/<pr>.yaml for the content it changes, written by a reviewer and never by its builder (project.review-verdict); as a ci change it is not owed a fail-first test, and it carries one anyway."
- "It adds no class token, selector, markup surface or inline style, so tests/unit/ui-flowbite-pro-baseline.json stays equal (node scripts/ui-flowbite-pro-record.mjs --check and node --test tests/unit/ui-flowbite-pro.test.mjs pass) (project.ui-uses-flowbite-pro, ADR 0061)."
- "scripts/size-report.mjs shows 0 B gzip added: nothing it adds is under src/ or bundled (project.single-file-deliverable)."
- tests/README.md has a row for each new test.
- "Definition of done, extends: the CI knowledge job judges the component projection with Majordomus's own validator."
- "Definition of done, interlinks: each task bound to a component issue is pointed to that component's record."
- "Definition of done, interactivity: none: CI and context (stated)."
- "Definition of done, docs, menus and routes: the project README states the scope convention; no route changes."
- "Definition of done, tested: the unit test over fixtures (no browser surface; stated)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
