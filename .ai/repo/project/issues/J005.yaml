id: J005
milestone: M118
serves:
- "component-system#majordomus-served"
title: Majordomus judges the projection in CI and points a task at the components it changes
slug: majordomus-judges-the-projection-in-ci-and-points-a-task-at
priority: p2
profile: implementation
objective: "Lands as ci(knowledge). The CI knowledge job gains a step after doctor that runs majordomus knowledge validate --json under the pinned version and fails on any finding whose source is under .ai/repo/knowledge/components/ (doctor reports a dangling edge as WARN only, and the doctor verdict fails on FAIL lines; measured 2026-10-29). The step is bounded, retried and pinned like its neighbours (project.ci-bounded). .ai/repo/profiles/implementation.yaml sets context.knowledge: true, so that majordomus context for a task bound to an issue prints its knowledge pointers: the issue, its milestone and every node in its scope, including the component records an issue names in scope (measured: a record named in an issue's scope is pointed to; one that only relates to the issue is not). .ai/repo/project/README.md gains the convention: an issue that changes a declaration names the records it rewrites in its scope. Before: a dangling component edge passes CI, and a task's context names no component. After: it fails, and the context points to them. Negative cases: a fixture validate output with a components finding fails the verdict; one with only findings elsewhere (the duplicate_id of project.visual-identity-lock v1 and v2 on main) passes it. Rollback: revert the step and the profile key."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs and knowledge base, interlink them and add more; knobs, sliders and control panels in one generic way, Majordomus integrated: each component and parameter declaration carries its intent, issue and rule ids, a deterministic generator projects the registry into .ai/repo/knowledge so that Majordomus serves it (context resolve, why, traceability), and a check fails when a component has no plan or knowledge link. Design: components-followup/majordomus-kb-adr.md of this plan change, measured with Majordomus 1.0.0-alpha.1 (the CI pin) and 1.0.0-alpha.8 on a throwaway copy of origin/main cdda563c."
scope:
- .github/workflows/ci.yml
- tests/unit/ci-knowledge-job.test.mjs
- tests/unit/fixtures/knowledge-validate-components.json
- .ai/repo/profiles/implementation.yaml
- .ai/repo/project/README.md
- tests/README.md
depends_on:
