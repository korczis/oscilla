objective: "decodeSynthLink accepts yc=vco1.audio>hpf.audio,vco2.audio>hpf.audio (and two gates into sh.trigger), and only the BATCH that applies it is then refused ('HPF audio input accepts one connection'); src/js/synth/link.js:92 linkOf encodes only panel cables, not Studio edges or open normals, and nothing tells the user. Before: a link decodes as ok and then fails, or drops what it cannot encode in silence. After: decode refuses a link whose cables cannot apply, naming the jack, and a link made from a patch with Studio edges or opened normals says what it leaves out."
