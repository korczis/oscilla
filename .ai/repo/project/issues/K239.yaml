current_state: "Built by oscilla-75 in task t-20261110071847-2fa7 on fix/k239-link-refused-at-decode from train/t6-sequencer 6c3b27df, on the coordinator's assignment (oscilla-43); unit side, for train T7. decodeSynthLink refuses, naming the jack, a link with two cables into an input that accepts one connection (the registry port is not multiple: hpf.audio, sh.trigger), a cable listed twice, and a cable canConnect refuses (a control into a trigger, which linkAction dropped in silence); its added sentences are Czech, and canConnect's own sentence is quoted inside one. link.js linkOmissions and linkOmissionText name what a copied link does not carry (Studio connections touching the panel, normals opened in the Studio), and Copy link says it after the copy. Language and apply time (task t-20261110073402-861b, after merging K238 cb4d2c20, which changes the same jackReason and patchCable lines): the decode, patchCable and jackReason refusals are Czech, xy.js compares the already-patched refusal by its constant ALREADY_PATCHED rather than its English words, linkPlan returns the skipped cables, and applyLink says them. The browser checks synth.cjs s-link and synth-engines.cjs read the Czech refusal; they were not run here (the synth browser suites wait for T5). Landed by #527 (verdict 527.yaml). Done on 2026-11-11 after oscilla-0b re-checked each criterion on main 04d33aaf (evidence below)."
