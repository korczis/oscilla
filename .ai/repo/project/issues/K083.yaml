  - "src/js/ui"
  - "src/js/synth"
  - "src/js/data"
  - "tests/browser/integration-map.json"
  - "tests/unit/lesson-instrument.test.mjs"
  - "tests/browser/navigation.cjs"
  - "tests/README.md"
  - "dist"
