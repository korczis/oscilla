title: "Cable probe: live level and a mini scope in the edge Inspector"
slug: cable-probe-live-level-and-a-mini-scope-in-the-edge-inspecto
priority: p2
profile: implementation
objective: "P04 slice C (typed edge UX). The Studio edge Inspector reads the one engine-owned probe tap of synth K064 (one AnalyserNode on one edge at a time, created and disposed inside the engine's accounting, project.audio-engine-discipline v2) through src/js/studio/probe.js: if K064 left the tap inside the Synth panel's code, this slice moves it there so both surfaces share one module and one test. The tap runs only while the edge is selected, the Inspector is visible and the transport plays. A new src/js/ui/studio/edge-probe.js draws on a canvas in the edge Inspector: sample peak and window RMS in dB relative to full scale (dBFS-like, 'relative, uncalibrated'), and a mini scope of the last 20 ms with the actual sample rate stated; a TRIGGER edge lists the last trigger times instead (TRIGGER edges carry no audio). Stopped, the card says 'Not running: press Play to probe this connection'. 'Pin as Scope node' adds a Scope node on that output through one EDGE_ADD batch. The draw is one rAF subscriber that stops when the card is hidden; when K036's frame loop is on main it subscribes there, else K036's census lists it by name."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
