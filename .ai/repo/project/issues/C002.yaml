title: "One output owner at a time: the sequencer claims the output before it schedules"
slug: one-output-owner-at-a-time-the-sequencer-claims-the-output-b
priority: p1
profile: implementation
objective: "Lands as fix(sequencer). Findings coupling-1, coupling-2 and coupling-3. The engine.play wrapper in src/js/main.js is the only output-ownership gate, and editor.play() schedules compileSequence into engine.master without it. The sequencer therefore plays during a MEASURE run (measureOwnsOutput() true, state PREFLIGHT; the sequence is captured through NOISE_CHECK into MEASURING), sounds together with the instrument in either order, and hands over with the Studio only through the 150 ms seqPlaying poll and Studio's $watch('seqPlaying'), so a Studio PLAY inside that window is the action that gets stopped. Add an optional claimOutput() to the sequencer editor's engine contract (sequencer-panel.js passes the adapter's), called by editor.play() before _stopVoices and the first _schedulePass and again in _pump before each loop pass; false refuses with editor.error set and nothing scheduled. main.js implements it from one output-owner table shared with the engine.play wrapper: refuse with 'Measurement in progress' while app.measureOwnsOutput(), otherwise stop the instrument and a playing Studio and set app.seqPlaying at once. The engine.play wrapper stops a playing sequence (editor.stop(), click-free) before an instrument voice starts. Whether Space in the Sequencer workspace stops a playing loop follows ADR 0050 and is written into it. If the owner prefers layering, that is stated in the UI and in docs/v31/signal-path.md and the views show both sources; silent summing is not an outcome."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
