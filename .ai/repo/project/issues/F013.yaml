acceptance_criteria:
  - "Every element is a pure function of its arguments and tokens returning a markup or class string: a unit test calls each with fixed inputs twice and gets the same string, and the module touches no DOM, store or engine at import or call (node --test on the layer's unit tests)."
  - "Colours come only from the --osc-* tokens through Tailwind theme keys or tokens read at run time: tests/unit/visual-identity-lock-v4.test.mjs passes and, because src/js/ui/synth/ now exists, judges it strictly (no VACUOUS line for it in the output), and every Tailwind colour key but primary is a var(--osc-*) token."
  - "The Flowbite Pro ratchet stays flat or falls: node scripts/ui-flowbite-pro-record.mjs --check passes and node --test tests/unit/ui-flowbite-pro.test.mjs passes; no osc-* class token, legacy selector, stylesheet or inline style is added."
  - "Contrast holds in both themes on the rendered page: every jack ring, cable, knob ring and LED at 3:1 or more on its card and every label and display text at 4.5:1 or more on its plate, in dark and light, by a browser check in the style of s-look in tests/browser/synth.cjs."
  - "LED and meter states bind to engine data: every data-led and data-needle element names an interpolated data-source and state (the v4 test), and a browser check shows a lamp lit and a meter moving only while the engine reports the state they name, and dark and still when it does not."
  - "Every display shows its unit and a relative/calibrated badge; dB SPL appears only under a valid level calibration (project.no-fake-science; tests/unit/no-fake-science.test.mjs and the v4 test's SPL guard pass)."
  - "The visual references of every re-skinned view are re-accepted through the visual gate with the reason recorded in the same pull request (npm run test:visual passes)."
  - "Wave W1 adds a SYN visual reference (scripts/visual-synth.mjs and tests/visual/synth/, in the pattern of scripts/visual*; built by p2, reviewed by dev-53): the Synth workspace at desktop 1536x1024 and phone 390x844, the Panel, Engines and XY tabs with a bay of six cables, in the dark and the light theme, on darwin-arm64 and linux-x64 (the container), at a 0.5 % tolerance, with every re-acceptance reasoned in the pull request body; and a layout check of the Synth workspace (b0, G2)"
