title: "One synth-theme layer: tokens, plates, labels, knob/fader/switch, jacks, cables, displays, buttons and meters as pure functions on Flowbite Pro, the only source of the app-wide old-school modular look"
slug: one-synth-theme-layer-on-flowbite-pro
priority: p1
profile: implementation
owner: "dev-53 (the layer); p2 builds knob.js, cable.js and tokens.js inside it"
objective: "Build the shared synth-theme layer that draws the app-wide hardware look the owner chose on 2026-11-02 (Q071, 'Celá appka jako synth') under rule project.visual-identity-lock v4, from the approved design of 2026-11-02 (dev-53, approved by b0; scratchpad synth-theme-layer-design.md). It lives in one directory, src/js/ui/synth/ (the cable core at src/js/ui/synth/cable.js), plus a Tailwind theme extension in tailwind.config.cjs whose new colour keys map only to the existing --osc-* custom properties, so the dark and light themes differ only in token values; no second kit, no new osc-* class, no new legacy CSS declaration. One module per element, each with one declaration in G001's catalogue: tokens.js (synthTokens(el), read at run time), plate (plateClasses({ density }) plus a tonal gradient, wrapping Flowbite cards, never replacing them), label (silk-screen typography, 4.5:1 on its plate), knob, fader and switch (SVG with a pure knobKey() and the lin/log, step and fine value mapping; the value ring in the accent token), jack (rings in the PORT_VISUALS shapes, a 44 px hit target), cable (cableSvg and cableCurve: catenary sag, soft shadow, dashed by signal type), display (a readout window with tabular numerals, the unit always shown and a relative/calibrated badge), button (the Flowbite button with plate variants, latch or momentary as aria-pressed) and meter (W003's level meter skinned, its data only from the engine). v4 also allows the elements the design held until Q071: LEDs, plugs, jack nuts, cable sheen, wood cheeks, screws and a subtle procedural texture, each drawn from tokens and never a bitmap. Every element is a pure function returning a markup or class string plus tokens; behaviour stays with its owner (StudioModel actions; keys through K153). The first pull request lands tokens, plate, label, jack and display with wave W1 on the Synth panel and p2's knob and cable; the other surfaces adopt the layer in later waves."
why: "The owner's decision Q071 of 2026-11-02 makes the old-school modular look app-wide and lists the hardware elements; project.visual-identity-lock v4 permits exactly what this layer draws and holds it by tests/unit/visual-identity-lock-v4.test.mjs. One layer keeps the look from forking per surface and keeps Flowbite Pro the component structure (ADR 0061)."
current_state: "Planned on 2026-11-02 with Q071 and rule project.visual-identity-lock v4, which land in the same pull request. src/js/ui/synth/ does not exist; until it does, the v4 test's theme-layer guards judge only src/js/synth/view/ and print that the layer's directories pass vacuously. Before this starts, p2 works only on pure modules with unit tests (knobKey and the value mapping, cableCurve) on a branch from main, claimed on the mesh, with no visual adoption."
