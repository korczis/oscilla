title: "Owner decision: the GL live views: raw WebGL or p5 WEBGL, GL by default, and what the visual references show"
slug: owner-decision-the-gl-live-views-raw-webgl-or-p5-webgl-gl-by
priority: p2
profile: routine
owner: repository owner
objective: "(1) The shipped p5@1.11.3 block already contains p5's WEBGL and WEBGL2 renderer (VERIFIED: 'webgl2' occurs in node_modules/p5/lib/p5.min.js and in dist/index.html), so using it adds no bytes, and the owner asked for p5.js. (a) Raw WebGL in src/js/charts/gl/ (about 3 KB gzip for the core), p5 kept for the conceptual views it draws today and as nothing more; (b) p5 WEBGL instances for the GL views; (c) raw WebGL for the data views and p5 WEBGL for new conceptual 3D views later. The plan recommends (a), to be confirmed by Y001's numbers: p5's immediate mode allocates per vertex call, which K032 and K034 are removing from the 2D views; each p5 instance holds its own canvas and loop outside the shared frame loop (ADR 0016's withdrawn acceptance); and ADR 0013's notes defer, not reject, replacing p5, so new code on p5 would raise the cost of that replacement. (2), folded from the withdrawn Q053: (a) Automatic: a view uses GL where the probe allows it without a major performance caveat on a renderer that is not a software rasteriser, and chart-cost measured it faster than Canvas 2D by more than the minimum detectable difference on every hardware leg (Y002's measure, amended 2026-11-01 after the critique of #363: a tie keeps Canvas 2D), Canvas 2D otherwise, with Settings 'Canvas 2D only' as the way out; (b) Canvas 2D by default and GL opt-in. (3) (a) The visual references of the GL hosts are taken on the Canvas 2D twin (?gl=0) and the GL output is proven by the pixel parity suite, because GL output varies with the GPU and driver; (b) GL references per environment as well. The plan recommends (1a), (2a) and (3a). The line's size is Q037's (amended), not a question of its own."
why: "The renderer layer of the G line waits on it (Y002). Asked by the GL live views plan (components-followup/render-gl.md, 2026-10-29). .ai/repo/project/README.md: work that waits on an answer names the Q issue in depends_on."
