id: G007
milestone: M085
serves:
- "component-system#interlinked"
title: "Every catalogued component has an address: #...&c=<id> opens its workspace, reveals it and focuses it, and an unknown id is refused and leaves the address"
slug: every-catalogued-component-has-an-address-c-id-opens-its-wor
priority: p2
profile: implementation
objective: "Lands as feat(ui). Today nothing below workspace level has a deep link (inventory 4.2). Q036 is answered (the owner, 2026-10-30, evidence recorded on Q036): (1a) a catalogued component is addressed by the hash key c=<id>; (2a) a Studio node only as st=<template>&c=studio.node:<node id> inside an unmodified shipped template, never inside a user's own document, because node ids are local to a document. src/js/core/url-state-catalog.js adds c as a fifth hash domain of ADR 0045's one dispatcher: HASH_DOMAINS of navigation.js (today ['instrument', 'measure', 'studio', 'records']) gains 'catalog' last, so c is applied after the studio domain's st applier has opened the template. decodeCatalogLink refuses a repeated, empty, over-long or unknown id as the other codecs do, and accepts exactly two forms: a declared catalogue id, and studio.node:<node id>, valid only with an st in the same address and only when <node id> is a node of that shipped template (getTemplate(st), a static table the decoder reads in Node), so the node form is not a catalogue id and the refusal of unknown ids is not weakened. Applying a component link opens the component's workspace (from its declaration's in chain), opens its panel or tab, scrolls it into view and focuses it. Applying a node link selects the node through SELECTION_CHANGE, the one write a link may make, and focuses its card, and only while the Studio document is still the template st opened, unmodified (the workspace's templateUnmodified, V422's dirty tracker against templateBaseline, which Copy link already uses); a document changed after st opened it refuses the node link with 'This node link needs the template <name> unmodified; the Studio document has changed since it opened.' A refused link is not kept (hashAfterRefusal), and the notice says so. Before: VERIFIED none. After: every declared component and every node of a shipped template has a link a test walks. Negative cases: c=bogus, c= twice, c=<300 characters>, a component of a workspace the link's m contradicts, c=studio.node:<id> without st, a node id of another template, a node link after the document was edited. Rollback: revert; the key is ignored again, nothing stored."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
