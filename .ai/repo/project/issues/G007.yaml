id: G007
milestone: M085
serves:
- "component-system#interlinked"
title: "Every catalogued component has an address: #...&c=<id> opens its workspace, reveals it and focuses it, and an unknown id is refused and leaves the address"
slug: every-catalogued-component-has-an-address-c-id-opens-its-wor
priority: p2
profile: implementation
objective: "Lands as feat(ui). Today nothing below workspace level has a deep link (inventory 4.2). src/js/core/url-state-catalog.js adds the key the owner chooses on Q036 (recommended: c) as a fifth hash domain of ADR 0045's one dispatcher (navigation.js HASH_DOMAINS): decodeCatalogLink refuses a repeated, empty, over-long or unknown id as the other codecs do; applying it opens the component's workspace (from its declaration's in chain), opens its panel or tab, scrolls it into view and focuses it; a refused link is not kept (hashAfterRefusal), and the notice says so. Studio node addressing waits on Q036's second part. Before: VERIFIED none. After: every declared component has a link a test walks. Negative cases: c=bogus, c= twice, c=<300 characters>, a component of a workspace the link's m contradicts. Rollback: revert; the key is ignored again, nothing stored."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
scope:
- src/js/core/url-state-catalog.js
- src/js/ui/navigation.js
- src/js/ui/catalog/registry.js
- tests/unit/url-state-catalog.test.mjs
- tests/unit/navigation.test.mjs
- tests/browser/navigation.cjs
- tests/browser/timing-baseline.json
- tests/unit/source-size-baseline.json
- tests/README.md
- dist
depends_on:
- G001
- Q036
acceptance_criteria:
- "tests/unit/url-state-catalog.test.mjs fails on the merge base: encode and decode round-trip every declared id; the negative cases are refused with one sentence; route precedence of navigation.js is unchanged for every existing route form of the deep-link inventory."
- "Definition of done, extends: ADR 0045's one hash dispatcher and its refusal semantics."
- "Definition of done, interlinks: every declaration gains an address the in-app panel (G015) and the link graph (G016) use."
- "Definition of done, interactivity: following a component link reveals and focuses the component."
- "Definition of done, docs, menus and routes: docs/v3/ui-integration.md lists the key; the deep-link inventory of tests/browser/navigation.cjs gains its forms. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: tests/browser/navigation.cjs follows c=filter.cutoff and c=studio.compact as a page load, as a link and through Back and Forward, and waits with until() (deadline 'component focused', 2 s) for focus on the component; c=bogus is refused and the address rewritten, in every gate browser from file:// and the sub-path. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
validation:
- node --test tests/unit/url-state-catalog.test.mjs tests/unit/navigation.test.mjs
- node tests/browser/navigation.cjs
- npm test
evidence_required:
- verified
