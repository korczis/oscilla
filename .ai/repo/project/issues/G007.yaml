acceptance_criteria:
- "tests/unit/url-state-catalog.test.mjs fails on the merge base: encode and decode round-trip every declared id and, for every shipped template, studio.node:<id> of each of its nodes with its st; the negative cases are refused with one sentence each; HASH_DOMAINS ends with 'catalog', after 'studio'; route precedence of navigation.js is unchanged for every existing route form of the deep-link inventory."
- "Definition of done, extends: ADR 0045's one hash dispatcher and its refusal semantics."
- "Definition of done, interlinks: every declaration gains an address the in-app panel (G015) and the link graph (G016) use, and G015's link to a component's Studio node uses the node form inside its shipped template."
- "Definition of done, interactivity: following a component link reveals and focuses the component."
- "Definition of done, docs, menus and routes: docs/v3/ui-integration.md lists the key; the deep-link inventory of tests/browser/navigation.cjs gains its forms. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: tests/browser/navigation.cjs follows c=filter.cutoff and c=studio.compact as a page load, as a link and through Back and Forward, and waits with until() (deadline 'component focused', 2 s) for focus on the component; st=filter-automation&c=studio.node:<a node id of that template> selects and focuses that card, and after an edit of that document the same link is refused with its sentence; c=bogus is refused and the address rewritten, in every gate browser from file:// and the sub-path. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
