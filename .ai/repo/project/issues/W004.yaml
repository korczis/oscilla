id: W004
milestone: M103
serves:
- "instrument-kinds#honest-observation"
title: "Mini-scope kind over the one scope readout: K016's node-card mini canvas becomes the kind, drawn on Canvas 2D and never on a GL context"
slug: mini-scope-kind-over-the-one-scope-readout-k016-s-node-card
priority: p2
profile: implementation
objective: "Lands as feat(ui). The scope kind over K032's src/js/charts/scope-readout.js and the Playground's trigger: src/js/ui/kinds/scope.js draws a time window from an owner-passed sampler into a preallocated buffer, rising-zero or free trigger, the scale stated (relative to full scale, or auto with its factor), clipped samples marked and never drawn as a plateau (p05 GEN-02). It draws on Canvas 2D only and never takes a WebGL context, because the minis are many and a page holds few live GL contexts (render-gl Trap 3, its section 3.5): min/max per pixel column from one preallocated Float32Array per reader, labelled min/max per pixel, and one frame-loop subscriber for every visible mini (K036 hosts and the IntersectionObserver flag), so a hidden or scrolled-off mini reads no analyser. K016's mini canvas on the Scope node card is converted to it, so the kind lands with two consumers. K064 (cable hover), V616 (cable inspector), G011 (cockpit) and V621 (box face) then mount it. Before: the scope drawing exists once per host. After: one mini scope. Negative cases: a TRIGGER cable (no trace, its times instead, K064); no signal; a hidden or scrolled-off host (unsubscribed, reads nothing). Rollback: revert. Merged plan of the component follow-up (2026-10-30): Its first consumer is the Studio workspace header's output mini-scope beside W003's meter; K016's node-card minis, G011's cockpit, V616, V621 and K064 then mount this kind (each of those depends on W004), so W004 no longer waits on K016 and its E004/F008 chain."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
