title: "A waveform change in the Studio Inspector while playing keeps the oscillator sounding"
slug: a-waveform-change-in-the-studio-inspector-while-playing-keeps
priority: p1
profile: implementation
objective: "Lands as fix(studio). In the default Basic Synth document, changing Oscillator 1's Waveform in the Inspector (#osc-si-osc-1-waveform) while the transport plays silences the oscillator for the rest of the clips already scheduled, instead of changing its timbre. 'waveform' is a structural key of the oscillator adapter (src/js/studio/adapters/nodes.js:116), so the runtime rebuilds the node; the rebuilt carrier is built held at ROUTE_FLOOR for its owner (src/js/studio/runtime.js header, :140-149) and the pattern owner's events stay on the disposed node (INFERRED; the cause is not located, and locating it is the first step). After the fix a structural rebuild of a node that a playing clip owns hands the owner's remaining scheduled events, and its held level, to the rebuilt node in the same crossfaded transaction (ADR 0035), so the Inspector path behaves as the patch-level waveformReplace check (section 45 of tests/browser/v31-studio-audio.cjs, click-free) already does. No dependency beyond main: a builder can start it at once."
why: "Repro dead-controls-9 of the G1 coherence contract of 2026-10-29 (scratchpad g1/coherence-contract.md, section 5 row 1.5; inventory g1/inventory.md; critique g1/critique.md), FAIL on main cdda563c: with the transport playing (Tone 220 Hz 0-1 s, Sweep 1-3 s), the samples after a waveform edit at 0.33 s read -106.7 dB at 0.80 s (the noise floor) while the control legs sound (no edit -31.7 to -32.3 dB; a Level edit -37.5 to -38.3 dB); the node counts stay 25 nodes and 4 sources, the model holds the new waveform, and no page error is raised. The suite's waveformReplace check covers the runtime patch, not the Inspector path."
