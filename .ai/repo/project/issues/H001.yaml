current_state: "Landed by the feature train #367 (11cc9fbc, 8ef29c6f, review fixes 78f224e4, verdict 367.yaml) with later seam tests (c1f39dd4). Criteria audit by oscilla-0b on main 04d33aaf (2026-11-11), not stamped: the substance is met but three criteria are not as written. (1) The named files do not exist: the unit cases are in tests/unit/v31-studio-transport.test.mjs (H001 at :568, :855, :875, :907, C1-H001-2 at :802; 52/52 pass) and the browser check is waveform-live in tests/browser/v31-studio-runtime.cjs, not tests/unit/v31-studio-structural-edit.test.mjs and tests/browser/v31-studio-audio.cjs. (2) That check plays the Subtractive Synth and measures the Tone 0.1 to 0.6 s after an edit at about 0.25 s; the criterion asks for the Basic Synth with square at about 0.33 s and every sample point above -60 dB to 3 s. (3) No case was found that asserts the negative cases (a Level edit unchanged, an edit while stopped schedules nothing, census 0 after stop, no extra click) for this edit. Either restate the criteria to the shipped checks, or add the missing cases."
acceptance_criteria:
  - "Fail-first: tests/unit/v31-studio-structural-edit.test.mjs drives the runtime on a fake context: a structural parameter set (waveform) on an oscillator that a playing pattern clip owns leaves every remaining event of that clip scheduled on the node that is connected after the rebuild, at the owner's level, never at ROUTE_FLOOR; it fails on the merge base."
  - "A check in tests/browser/v31-studio-audio.cjs plays the default Basic Synth document, selects square in #osc-si-osc-1-waveform at about 0.33 s and reads the output tap at every sample point to 3 s: each reads above -60 dB, and the model's waveform is square; the no-edit and Level-edit legs still sound."
  - "Negative cases, each asserted: a non-structural edit (Level) is unchanged; an edit while stopped schedules nothing; after stop the engine node census is 0 (project.audio-engine-discipline v2); the edit adds no click beyond the threshold of the existing waveformReplace check."
  - "The pull request touches the guarded src/js/studio and carries a reviewer-written .ai/repo/reviews/<pr>.yaml (project.review-verdict)."
  - "As a fix change it carries a unit test that fails on the merge base and passes on the head (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
