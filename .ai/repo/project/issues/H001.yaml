current_state: "Re-checked on main 8e087873 in the audit-and-stamp follow-up train (oscilla-d9, 2026-11-18). Criterion 1 is restated (amended in this record): its test file is tests/unit/v31-studio-transport.test.mjs (H001 cases at :568, :855, :875, :907; C1-H001-2 at :802; 52/52), whose H001 case fails on cdda563c (0/1) and passes at 8ef29c6f; tests/unit/v31-studio-structural-edit.test.mjs was never created, the cases landing in the transport test instead. Criteria 2 and 3 moved verbatim to H010 and H011; criteria 4-7 met; stamped done. Before this audit: Audit 2026-11-15 by oscilla-ff (session cae276ab-2d90-45d2-babb-a1f8023668d2) on main 474ce9c3, on the owner's order to finish unfinished work: landed but not done. Criteria 1-3 name checks that do not exist as written: tests/unit/v31-studio-structural-edit.test.mjs is absent (the substance is in v31-studio-transport.test.mjs, 52/52), v31-studio-audio.cjs has no such check (the real one is waveform-live in v31-studio-runtime.cjs, another patch and window), and no Level edit, stopped-schedules-nothing or census-0-after-stop case exists; 4, 6, 7 met, 5 (fail-first) not re-proven. Next: restate 1-3 to the shipped checks with a recorded reason, or add the missing cases. Earlier: Landed by the feature train #367 (11cc9fbc, 8ef29c6f, review fixes 78f224e4, verdict 367.yaml) with later seam tests (c1f39dd4). Criteria audit by oscilla-0b on main 04d33aaf (2026-11-11), not stamped: the substance is met but three criteria are not as written. (1) The named files do not exist: the unit cases are in tests/unit/v31-studio-transport.test.mjs (H001 at :568, :855, :875, :907, C1-H001-2 at :802; 52/52 pass) and the browser check is waveform-live in tests/browser/v31-studio-runtime.cjs, not tests/unit/v31-studio-structural-edit.test.mjs and tests/browser/v31-studio-audio.cjs. (2) That check plays the Subtractive Synth and measures the Tone 0.1 to 0.6 s after an edit at about 0.25 s; the criterion asks for the Basic Synth with square