title: "LLM decision: project.review-verdict v3 guards every tracked src path fail-closed, the rules' own enforcement, a generated About station, and a second seat for screens (af with b0, 2026-11-05)"
slug: llm-decision-review-verdict-v3-guards-every-tracked-src-path
priority: p1
profile: routine
owner: "af with b0, mesh 2026-11-05, owner order 'be llm autonomous'"
objective: "Record decision Q-A of the Total Coherence, Panel Excellence and Hardening packs, AGREED by af with b0 on the mesh (thread b0<->af, 2026-11-05 ~02:15Z). (1) project.review-verdict v3 guards every tracked path under src/ fail-closed: a path is guarded unless an allowance entry names it with a reason, and the allowance only shrinks by its git history, so a new src path is guarded the moment it exists (closing 'a new src path fails open'). (2) The rules' own enforcement tests, ratchet baselines and the flake ledger are guarded, the list derived from each rule's Enforcement section (Hardening gap 2). (3) The About station is generated: release:prepare writes the release station's derived fields into a data file, and the guard exempts a chore(release) pull request only for the outputs release:prepare writes under src/ (src/data/roadmap.json from scripts/roadmap.mjs, run by CI_PREPARE_COMMANDS at scripts/release-prepare.mjs:71-76, and the About station data file), each only when it equals what the base branch's copy of its generator writes; the allowance of part (1) is read from the base (it lives under scripts/, which .github/scripts/base-rule.sh:36 extracts from the base), never from the pull request's checkout. (4) A second reviewer seat judges src/* screens and routes: oscilla-af; prismatic-majordomus-98 keeps CI, release, rules and Studio; the fallback for a change a seat built, or a verdict not written within 4 hours, is the other seat, and with neither the pull request waits; the expected load is 4-6 verdicts a day (25 of the last 40 first-parent commits of main at a19f1ff6 touch a v3-guarded path, 13 under v2). The seat names, the fallback and the widened exemption were added on resolving af's critique of 96daa67b (b0, 2026-11-05) and are for af's confirmation in the next critique round. This reverses the deliberate exclusion of review-verdict.v2.md (UI markup, wiring and styles unguarded) and answers the open question E005 carries on guarding src/index.html."
why: "The owner's own words, relayed verbatim by af from the owner's paste: \"kazdy jeden screen / kazda jedna route musi byt reviewed\" (every single screen, every single route must be reviewed). Serves release-provenance#gate-runs-every-suite as the closest criterion of M011 (af noted the fit is weak: the decision is about review, not suites); no review criterion exists in an intent M011 serves, and none is invented here. Measured at main 68b117f3 (oscilla-b0 coherence audit, skeptic-verified): v2's GUARDED (scripts/review-verdict.mjs:76-112) leaves out src/index.html, src/js/main.js, src/styles/ (13 of 13 files), 72 of the 84 src/js/ui files and all of charts, labs, visualization, midi, sequencer and js/data; 65 of the 94 census surfaces have their state owner unguarded; 11 of the last 40 merges (5 release PRs, 6 product PRs including #384 phone audio) changed such paths with no independent verdict. Under src/* the same 40 merges would have needed 26 verdicts instead of 15. Decided under the owner's order of 2026-11-05 'discuss answers with other llms, do not wait for human, be llm autonomous'; the owner may override it."
current_state: "Decided (AGREED) by af with b0 on the mesh on 2026-11-05; attributed to the deciding sessions, not presented as the owner's words beyond the quoted line. The owner_decision evidence is recorded (oscilla-75, 2026-11-10, at main a7102358, criterion 2 re-checked there), so Q091 is DONE and R031, R032 and R033 no longer wait on it."
