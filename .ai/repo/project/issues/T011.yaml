title: "The microphone level states its scale, and a clipped input says so"
slug: the-microphone-level-states-its-scale-and-a-clipped-input-sa
priority: p2
profile: implementation
objective: "Truth-table rows SPC-07, MIC-04, MIC-13 (scratchpad p05/truth-table.md). Per Q041: either the sinusoid level is shown as levelDbfs with \"dBFS-like, uncalibrated\" and a \"single stationary tone\" caveat while the chart axis follows, or the readout keeps the analyser dB and says \"analyser dB\" in place. If Q041 asks for it, the time buffer the readout already receives is checked with the oscilla.clip.v2 rail rule (≥ 3 samples ≥ 0.98 within 1 ms, the helper T020 exports from capture-checks.js) and the readout appends \"INPUT CLIPPING: level and harmonics unreliable\"."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): The readout shows the raw analyser level at the peak (\"relative level -14 dB\" for a full-scale sine); a sine driven 12 dB over full scale and clipped at ±1 reads \"440 Hz ± 3 Hz (relative level -12 dB)\" with no clip state, suggesting headroom. The two audit passes disagree on whether this breaks ADR 0017 (see Q041)."
