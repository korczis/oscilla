acceptance_criteria:
  - "Fail-first fixture: tests/unit/readout-states-mic-level.test.mjs: a 4x sine clipped at ±1 (fixture F3) carries the clipping text; a full-scale sine reads the level the chosen scale defines (about 0 dBFS-like, or about -14 analyser dB with that name); a 0.5 sine carries no flag. Fails on the merge base."
  - "Negative cases, each asserted: A clean -20 dBFS sine has no flag; one isolated rail sample is not clipping (run rule); the frequency of a clipped tone still reads 440 Hz; no SPL wording appears anywhere in the lab."
  - "Revertible on its own: Revert: readout text and one helper call."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
  - "Any new visible element follows the Flowbite Pro components and the locked tokens (project.ui-uses-flowbite-pro, project.visual-identity-lock); npm run visual passes or the baseline change is declared."
  - "tests/README.md has a row for each new test; this issue does not edit docs/CLAIMS.yaml or the intent (T027 does)."
