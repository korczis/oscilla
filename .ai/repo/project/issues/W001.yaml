title: "Instrument kinds: defineKind, the generic contract test and the first declaration (step-grid); each further kind lands with its first consumer"
slug: instrument-kinds-one-definekind-declaration-per-kind-the-gen
priority: p1
profile: implementation
objective: "Lands as test(ui). src/js/ui/catalog/kind.js adds defineKind() and prop descriptors in the section 79 style; src/js/ui/catalog/kinds/ declares the instrument kinds of the design (readout, meter, scope, jack, edge, transport, piano, step-grid, xy-pad, piano-roll, clip-slot, scene, channel-strip, track-header), this slice only step-grid and each other kind in the slice of its first consumer as the amendment of 2026-11-07 below states, with props, io, events and what each emits, state path, links, aria, keys, pointer, touch, minimum target, the 390x844 layout rule, reduced motion, truth rows and impl modules; G001's kind list gains them. sources.js (G001) gains the rows studio.edge, studio.clip, studio.track, notes, observation and view with their persistence sentence. The trace part is scripts/ui-catalog/trace/kinds.mjs, outside src/. Before: VERIFIED no declaration of any instrument surface; three Studio transports disagree (inventory D1); no step editor, no meter kind, no piano range contract. After: twelve declarations a test holds to their contract. Negative cases: a kind without keys for a pointer event; a key map holding Space or a bare key used twice; an event emitting an action type the Studio does not export; a state path outside the grammar; a target under 44 px without an exemption of five words; a missing truth row; an instance whose props fail its kind; a declared shape changed without a version bump. Rollback: revert; nothing imports the declarations at run time yet. Merged plan of the component follow-up (2026-10-30): The ADR 0061 resolution note for the instrument visuals is J001's (Q061 is withdrawn: ADR 0061 decisions 1 and 3 already leave to OSCILLA's domain views the surfaces Pro has no component for). Five rules join the contract test: (1) no kind binds a bare letter key, because letters belong to the armed computer-keyboard piano (K026, W007) and the workspace shortcuts; a letter action is a visible button or an item of the kind's menu; (2) a view keeps only transient interaction state (focus, an in-progress drag preview, an open entry); selection, scroll, zoom, page, folding, markers, taps, holds and latches are passed in by the owner; (3) class names are literal strings (Tailwind's content scan sees them), sizes come from SVG attributes or literal utilities, and no view writes el.style or a style attribute; (4) every mount returns { element, set, setDisabled, destroy } plus its documented extras, and commit returns true or { refused } so the refusal sentence reaches the view; (5) no runtime module interprets a declaration: each view handles its own events and keys, and the contract test proves the view's behaviour equals the declaration with a recording owner. The truth rows are T026's docs/v3/readout-truth.yaml. The param kind (N003) and the panel kind (N008) add their records to this table. The pinned digest is a hash of the declarations serialised with sorted keys and no functions. Amended 2026-11-07 (Q103, the drum-view chain): was 'declares the twelve kinds of the design' in one slice before any view. Now: this slice lands defineKind(), the prop descriptors, the generic contract test with its eight negative cases and five rules, the digest pin, the trace file and the state-path rows studio.clip and notes, with one declaration, step-grid, whose view and first consumer are W008 and K222. Each other kind (readout, meter, scope, jack, edge, transport, piano, xy-pad, piano-roll, clip-slot, scene, channel-strip, track-header) adds its declaration and its state-path rows to the same contract test in the slice of its first consumer, so no declaration lands that nothing mounts (project.no-inert-surfaces). The step-grid declaration lands here as version 1 without the grid-change event, because the Studio exports no NOTES_GRID_SET yet; W008 adds that action and bumps the declaration to version 2 with the digest pin and there is one kind mechanism, G001's closed KINDS, never a second registry. The dependency on G001 is dropped with this reason: the catalogue modules W001 extends (src/js/ui/catalog/define.js, kinds.js, registry.js, sources.js) are on main since #386 (bc4b1545), and G001's open criteria (its trace and allowance work) do not gate a kind contract. J001 is done (ADR 0081 and the ADR 0061 instrument-visuals note on main)."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
