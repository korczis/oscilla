current_state: "Built by oscilla-75 (6bda0205, a7a82766 on fix/c068-additive-swap-dip) and taken out of train T7b on 2026-11-11 by oscilla-43 on oscilla-c3's review R2-C068-1 (P1): every live Additive edit of a held note dipped the level to GAIN_FLOOR for about 16 ms, and a slider drag (one edit per input event, unthrottled) held the note mostly at the floor (chromium below -20 dB for 251 of 412 ms, minimum -86 dB; main 0 ms). The click on one large jump that C068 targets is real on main (largest step 0.10-0.13 against 0.0029 steady). Open for the next owner: keep the level during edits (an equal-gain crossfade between old and new carrier over a few ms, or dip only on a large waveform change, or coalesce a drag into one dip after it settles), with a drag-rate burst test (the level never below about -12 dB re steady RMS) beside the existing large-jump step test. a7a82766's split of the wave switching into wave-switch.js may ride with it."
