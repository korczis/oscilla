objective: "setPeriodicWave (src/js/audio/audio-engine.js:1427-1432) calls v.carrier.setPeriodicWave(wave) on the sounding carrier with no dip, while clearPeriodicWave (:1439-1444) goes through _switchWaves; main.js calls it on every Additive lab change of a held note, so each edit is a step in the waveform (project.audio-engine-discipline). After: the swap goes through the same click-free dip as a waveform change."
