id: K217
milestone: M064
serves:
  - "connected-instrument#patch-cables"
title: "Patch bay cable list as a listbox: each cable an option, arrows select, Delete removes"
slug: patch-bay-cable-list-as-a-listbox-each-cable-an-option-arrow
priority: p1
profile: implementation
objective: "Lands as fix(synth). K063's criterion 3 says the cable list is a listbox in the accessibility tree; on main it is a <ul> of rows with Remove buttons (src/js/synth/ui.js:359-361, rendered at :268-292). The cables become a listbox, each cable an option named 'from to to'; the arrow keys move the selection, the selected cable is highlighted on the bay, and Delete removes it as one BATCH that restores its normals. The Restore normal, Restore module and Break normal rows hold buttons, which an option may not, so they stay a list beside it. Pro's list group markup is adapted (ADR 0061). Before: a plain list. After: a listbox a screen reader and the keyboard can walk. Rollback: revert the pull request; no saved state depends on it."
why: "Gap of K063 (criterion 3) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): the cable list is a <ul>, not a listbox. No owner direction re-scopes it, so it is its own issue and K063's criterion points here (chore/plan-m064-rescope). K063 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
scope:
  - "src/js/synth/ui.js"
  - "tests/unit/synth-patch-bay.test.mjs"
  - "tests/browser/synth.cjs"
  - "tests/unit/ui-flowbite-pro-baseline.json"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K215"
acceptance_criteria:
  - "tests/unit/synth-patch-bay.test.mjs, failing on the merge base (a <ul> there): the cable list renders role=listbox with an accessible name, one role=option per cable named by its two jacks, aria-selected on the selected one; ArrowDown and ArrowUp move the selection, Home and End reach the ends, and Delete dispatches one BATCH that removes the selected cable and restores its normals (project.fail-first)."
  - "A browser check in tests/browser/synth.cjs asserts the listbox and its options in the accessibility tree in every gate browser, and that Delete on a selected option removes the cable, within a named until() deadline. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Its chrome is the Flowbite Pro list group adapted, adds no osc-* class, legacy selector, inline style or stylesheet, and lowers or keeps the ratchet (project.ui-uses-flowbite-pro; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "src/js/synth is guarded (project.review-verdict v2): a non-builder's verdict; tests/README.md names the new checks; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/synth-patch-bay.test.mjs tests/unit/ui-flowbite-pro.test.mjs"
  - "node tests/browser/synth.cjs"
  - "npm test"
evidence_required:
  - "verified"
