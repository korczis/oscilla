  - "tests/unit/freeze.test.mjs (the V1 golden vectors, ADR 0014) passes unchanged; the pull request carries a reviewer's verdict (src/js/audio is guarded)."
  - "The copy says what listeners commonly report under controlled listening, with a citation, never what this listener hears; it passes tests/unit/no-fake-science.test.mjs, and the pull request states that whether a sentence still implies a perceptual effect was judged by the reviewer, since the scan has no perceptual-claim phrases."
  - "A browser check plays the demonstration through the AudioEngine with no console error, within the session safety limit, from file:// and the sub-path."
