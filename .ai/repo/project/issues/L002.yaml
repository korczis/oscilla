objective: "It starts only after Q001 is answered. If Q001 adopts sections 89-90, this lesson is the implementation of their 'Shepard tone educational demo'; if not, it is cancelled with Q001 as the reason. A lesson whose demonstration plays octave-spaced partials (8 to 10) under a fixed spectral envelope as a Shepard scale of twelve semitone steps whose partial set after one octave equals the initial one, short enough to play within the default session safety limit (src/js/core/instrument.js; ADR 0005); a continuous glide over several cycles plays only under the session's continuous permission, and the copy names the limit. The additive oscillator is one PeriodicWave with static partials (src/js/audio/additive.js), so the demonstration needs a graph builder inside the engine's track and source accounting (project.audio-engine-discipline) under the guarded src/js/audio. It follows L001 because both add a topic to src/js/data/learn.js and its demonstration path."
why: "Multi-page V1 specification sections 89-90 (docs/specs/oscilla-v1-sections-64-95.md), adopted or not by Q001; conversation 6abec18d, 2026-10-01T21:08:07Z (V2 roadmap item 9, a ChatGPT proposal). Default safety limit and Learn form (critique perception-lessons, shepard-vs-safety-limit, demonstrations-exceed-the-learn-form)."
