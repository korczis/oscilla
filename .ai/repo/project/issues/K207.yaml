title: "Contour node type: a gate-driven attack, hold and release control with invert, and tests/unit/synth-vco-contour.test.mjs"
slug: contour-node-type-a-gate-driven-attack-hold-and-release-cont
priority: p1
profile: implementation
objective: "Lands as feat(studio). K059 keeps the contour node a criterion (its amendment of 2026-11-03) and main has none: src/js/studio/nodes/instrument.js defines keys, vco and ring, and 'contour' is only an alias of the envelope node (src/js/studio/nodes/modulation.js:75). Adds the contour type of K059's objective in src/js/studio/nodes/instrument.js (attack, hold, release, invert; a gate TRIGGER input; a 0..1 CONTROL output from a ConstantSource ramped on the audio clock) with its adapter in src/js/studio/adapters/instrument.js, so that a quick-add search for 'contour' lists the new type. Before: no gate-driven control contour. After: a contour node that validates, compiles and schedules on the audio clock. Rollback: revert the pull request; a document saved with a contour node is then refused by the import pipeline with its unknown-type sentence, never dropped silently."
why: "Gap of K059 (criterion 1 and 9) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): the contour node type and tests/unit/synth-vco-contour.test.mjs do not exist on main. No owner direction re-scopes it, so it is its own issue and K059's criterion points here (chore/plan-m064-rescope). K059 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
