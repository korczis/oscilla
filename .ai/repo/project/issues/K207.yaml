  - "Negative cases, each asserted in that file: an attack, hold or release outside its declared range (NODE_PARAM_SET refused with the validator's sentence, model and history unchanged); an AUDIO edge into the gate TRIGGER input (refused by canConnect with its sentence; project.typed-ports)."
  - "Every pinned template studioHash is unchanged: it adds a node type only (D2, K022; tests/unit/synth-nodes.test.mjs:83)."
  - "Built by its adapter with track()/source() accounting, all timing on the audio clock, click-free ramps, the engine node census 0 after stop (project.audio-engine-discipline v2); every string it adds passes tests/unit/synth-wording.test.mjs (project.no-fake-science)."
  - "src/js/studio is guarded (project.review-verdict v2): a non-builder's verdict in .ai/repo/reviews/<pr>.yaml, the new one for the contour node that K059's verdict criterion asks for."
  - "scripts/size-report.mjs shows the bytes added, base and head figures in the pull request body, within K059's 4 KB gzip ceiling; tests/README.md has a row for the new test; dist is rebuilt and npm run build:check passes."
