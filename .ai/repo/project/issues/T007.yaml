acceptance_criteria:
  - "Fail-first fixture: tests/unit/readout-labels-mic-precision.test.mjs, deterministic (seeded PRNG): stationary tones at 55 and 100 Hz, 48 kHz, N = 8192, 20 dB SNR, 30 trials through estimateFrequency and detectedText. Under (a) no reading has a digit finer than the analysis resolution; under (b) every reading names the method and contains no bare \"±\". A copy test binds the dialog and module header text to the chosen policy and forbids \"sees the raw input\". Fails on the merge base under either policy."
  - "Negative cases, each asserted: FFT-path readings at or above 1 kHz keep \"1.000 kHz ± 3 Hz\"; silence and noise keep \"no clear peak\"; analysis-peak.test.mjs (interpolation error ≤ 0.0066 bin) passes unchanged."
  - "Revertible on its own: Revert: display rounding and copy; the estimator is unchanged."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
  - "The pull request touches a guarded path and carries a reviewer-written .ai/repo/reviews/<pr>.yaml (project.review-verdict)."
  - "Any new visible element follows the Flowbite Pro components and the locked tokens (project.ui-uses-flowbite-pro, project.visual-identity-lock); npm run visual passes or the baseline change is declared."
  - "tests/README.md has a row for each new test; this issue does not edit docs/CLAIMS.yaml or the intent (T027 does)."
