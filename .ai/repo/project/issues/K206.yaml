acceptance_criteria:
  - "A browser check in tests/browser/knob.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base (the file does not exist there) and proves the knob linked, real-time and interactive. Linked: a knob mounted on a fixture parameter shows the value that the bound fixture store holds after reload. Real-time: aria-valuenow, aria-valuetext and the visible value text change together after a drag, a key press and a typed commit, each within a named until() deadline. Interactive: pointer drag (with and without Shift), ArrowUp/Right, ArrowDown/Left, PageUp, PageDown, Home, End and a synthesized touch drag each change the value; role=slider and its aria-valuetext with unit are asserted in the accessibility tree. The reduced-motion clause (the modulation dot not rendered under emulated prefers-reduced-motion) is not K206's: N006 draws the dot and its first criterion asserts that clause; moved there on 2026-11-09 by the integrator oscilla-43 (a check against a page with no dot is vacuous). Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The fixture mounts the shipped knob (src/js/ui/synth/knob.js, src/js/synth/view/knob.js) and builds no second knob (M123: one implementation per control kind)."
  - "tests/README.md has a row for the new suite; package.json's test:synth names it."
validation:
