acceptance_criteria:
  - "Fail-first unit: with REC armed and the transport playing, a pad L gesture writes points of lanes xyl.x and xyl.y at the audio-clock playhead positions of the take, in one BATCH and one undo entry; REC off writes nothing; a take while stopped is refused with its sentence (Czech)."
  - "Hash (oscilla-43 (1), oscilla-c1 1): x and y at their default 0 are elided from the serialised model and the hash, so every pinned template and every epoch-3 record hashes unchanged and no epoch 4 is needed; a unit test proves an untouched pad hashes as on the base; the C1-HE3-1 guard test (registered params only) stays green."
  - "Touch over lane (oscilla-43 (2), oscilla-c1 2): while a touch is held it overrides the lanes; on release the outputs return to the lanes' value through the same glide as today's pad release (no step on cutoff or peak); a unit test pins it at 44100 and 48000 Hz."
  - "A take (oscilla-c1 3): points outside the armed span are dropped (as C1-K223-1); a re-take replaces the take's span on each lane and keeps the rest; points are thinned to a stated step on the audio clock, never one per pointermove."
  - "Replay (oscilla-c1 4): the lanes move the pad's outputs through whatever normals or cables pad L feeds, a re-patch after the take included, and the offline render plays them too."
  - "One recorder (oscilla-43 (3), oscilla-c1 5): studio/notes-record.js generalised, the same 'take' event and Czech sentence; every K223 test green unchanged; undo and redo restore the exact serialized model."
  - "Browser (chromium, firefox, webkit), through tests/browser/lib/suite.cjs and wait.cjs until(): a recorded take replays (the pad's lane drives the target on the next pass); a phone check with the gesture rule on; the suite pace declared."
  - "Guarded (src/js/synth, src/js/studio, src/js/audio): a non-builder verdict; the PR says what the xy-pad realisation change touches (oscilla-c1 6)."
