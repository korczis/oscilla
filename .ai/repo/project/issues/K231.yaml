title: "REC on the Synth's pad L: a take of its X and Y written into an automation clip at the playhead, one undo per take"
slug: rec-on-the-synth-pad-l
priority: p2
profile: implementation
objective: "Lands as feat(synth). Split from K220 on 2026-11-09 (the coordinator oscilla-43): K220 lands the two performance pads under the Synth face; this slice adds REC on pad L. With REC armed and the Studio transport playing, a take of pad L's X and Y is written as automation of the pad's own X and Y (two automatable parameters of the xy-pad node, x and y, default 0, the outputs' value at rest, elided from the serialised model and the hash while at that default) at the playhead, one undo entry per take, through the one record path K223 built for live pad and key hits (studio/notes-record.js, generalised: an armed take collects notes for a notes clip or pad points for lanes), so pads, keys and the pad's automation share one recorder. On replay the lanes move the pad's outputs, and whatever normals or cables pad L feeds (LPF cutoff and peak by default) carry them, so the mapping stays the edge's and a re-patch after the take re-targets it; a live touch overrides the lanes while held and the outputs glide back to them on release. Before: pad L plays its targets live only. After: a take replays from the timeline. Rollback: revert; the take's lanes stay valid model data."
why: "Owner direction Q103 and the owner's screenshots of 2026-11-09 (an integrated performance pad with record); K220's objective names recording, split out so the pads land first. Coordinator decision (oscilla-43, 2026-11-10), verbatim: 'Option A, decided. Record it in K231 verbatim as the coordinator's decision with its reason (§103-104: automation authors the base and modulation stays the edge's; a take of the pad's own X and Y survives a re-patch).' Option B, lanes on the targets (lpf.frequency, lpf.peak) as the first text said, would author the base from the edge's mapping, against studio/automation.js §103-104, and go stale on every re-patch; the review seat oscilla-c1 accepted A with conditions (the acceptance criteria below)."
current_state: "Built by oscilla-d9 in task t-20261110045417-5059 (continued as t-20261110052324-7f77 after a scope widening) on feat/k231-pad-l-rec from train T5 91838acb (K220 in T5, K223's record model on main); goes into T6, judged by oscilla-c1. Studio's own transport toggle left to G001 (oscilla-43, 2026-11-10: a different control, with no Record beside it). At 14901b3b: npm test 5623/0; xy-pad.cjs x-padrec chromium desktop and phone-cold PASS; drums.cjs chromium 10/10 on both legs; the full test:synth and test:studio pass in two browsers waits until T5 is out (oscilla-43)."
