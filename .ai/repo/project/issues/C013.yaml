title: "Scope and Spectrum follow the output owner: a live trace and requested marker for the sequencer and the Studio"
slug: scope-and-spectrum-follow-the-output-owner-a-live-trace-and
priority: p1
profile: implementation
objective: "Lands as fix(visualization). Findings vis-divergence-1 and vis-divergence-4. The scope decides live on st.playing, copied from the instrument only (p5-views.js:128): while the Studio or the sequencer sounds through the same engine.analyser (peak 0.053 and 0.080) it draws a computed 440 Hz sine labelled 'not playing · computed ... press Hold to Play', its aria label says the same, and under reduced motion the bridge loop stops. adapter.requestedFrequency() returns app.dualFa or app.metricFrequency, so during sequencer play the Spectrum marks '250 Hz / < -100 dB' beside the real 440 Hz peak while the status bar says 'sequence'; the same adapter's isPlaying already counts the sequencer. Derive outputOwner ('instrument' | 'sequencer' | 'studio' | null) in main.js from the owner table of C002, reading the Studio through its public transport, and pass it to the bridge as a plain string through bridge.setOutputOwner(owner), called on sequencer play and stop and on a Studio transport change. The scope is live when there is an owner; instrument frequency and gain set the window and scale only for the instrument, otherwise full scale with the label 'output analyser · sequencer' or '· Studio · relative to full scale'; updateLoop and the aria label use the owner. requestedFrequency returns the instrument's while it plays, else labs.sequencer.editor.currentFrequency() while the editor plays (null in a gap hides the marker and chip), else today's value; read editor.playing, not the 150 ms copy. A Studio requested frequency is not part of this issue."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
