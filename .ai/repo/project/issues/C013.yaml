  - "Browser check `scope-follows-owner` in tests/browser/app.cjs: sequencer Play and Studio compact Play each give the scope label 'output analyser · sequencer' and '· Studio' and a matching canvas aria label, never 'not playing', including with reduced motion emulated."
  - "Browser check `spectrum-marker-follows-sequence` in tests/browser/app.cjs: instrument at 250 Hz not played, sequencer Play, during block 0 chart.options.requested equals editor.currentFrequency() (440) and is null in a gap."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
