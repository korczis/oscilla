objective: "Lands as fix(ui). Panel Excellence criterion 3 (composition honesty). At main 68b117f3, at 1536x1024 Compare hides Source and Dual (src/styles/integration.css:591-597, src/styles/instrument.css:343-351), yet the pan reason points to Dual (src/index.html:1678) and a Bioacoustics row rewrites the hidden Source range (src/js/main.js:483-485); on the phone, Source and Analysis are shown on Filter Lab, Compare and Analyzer (src/styles/responsive.css:259), so the panel sets differ by viewport with no declaration. After: each workspace's panel set at 1536x1024 and 390x844 is declared in tests/unit/surface-census.json; a reason text names only a panel visible in that workspace (or the workspace that holds it, as a link); a handler that writes another panel's state does so only when that panel is visible or names the change where the user acted."
why: "af's Panel Excellence synthesis (2026-11-05, snapshot 68b117f3): criterion 3 and the Composition findings (Compare at 1536, the phone panel set)."
