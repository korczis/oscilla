  - "A leg of tests/browser/app.cjs visits every workspace at 1536x1024 and 390x844 and asserts that the visible panel set equals the census declaration and that no visible reason text names a panel that has no client rects in that view. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
