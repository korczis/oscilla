current_state: "Relates to, and does not wait for, V616 (the probe tap, oscilla-26: the shell runs on a local mirror of its createProbeStub, and the one marked import line in src/js/main.js swaps in src/js/studio/probe.js when it lands) and W004 (the scope view, b0: setPeeperView replaces the placeholder line), and rides on G001's catalogue and frame (rule project.visual-components-framed) and K153's key registry. None is a depends_on: the shell is built and tested against the stub, so a dependency would only block it. Built on feat/a5-frame-peeper; the pull request is not open yet."
acceptance_criteria:
  - "On every page: the page header's action [data-osc=\"peeper.toggle\"] opens the peeper, and the browser leg peeper of tests/browser/ui-flowbite-pro.cjs opens it on the Playground and keeps it on Measure and About; the unit test finds the action inside the page actions of the registry-driven header and the section docked between <main> and the status bar."
  - "The pin persists across route changes and is never in the hash or the history: pinned, a route change keeps it open and retargets its lease (unit and browser); the stored value is localStorage oscilla.peeper; no peeper module writes location.hash, pushState or replaceState (unit), and the browser leg reads no peeper or pin key in the address."
  - "The tap list is derived from probe.points(): the select renders peeper.points from the model, the page lists no tap point of its own (unit), and the browser leg reads the select's options equal to the points."
  - "peep(target) opens the peeper on a point id, { nodeId } or { edgeId } (unit)."
  - "Release on hide, and active() 0/0 after Stop: close, hide, collapse and Stop release the lease (unit), and in the browser playing taps one lease and Stop returns active() to { analysers: 0, leases: 0 }; opening it starts no audio."
  - "live: false shows a reason and never a fake frame: stopped, the peeper reads { live: false, reason: 'stopped' } and the page shows the sentence; over budget the probe reads live: false, reason 'budget', frame null (unit and browser)."
  - "On a phone (390x844, touch) it is a bottom sheet in the flow: the browser leg measures no overlap with <main>, every control at least 44 x 44 px, and the collapse."
  - "Backquote goes through the key registry: ui.js binds { id: 'peeper.toggle', keys: ['Backquote'], scope: { workspace: '*' } } through the page's one registry and adds no key listener of its own (unit; the key-listener ratchet of tests/unit/keys-registry.test.mjs); the binding never resolves in a text field or a dialog (unit), and the browser leg toggles it with Backquote and not inside the search field."
  - "The window is asked with windowMs only and the actual window is shown: the unit test spies the tap call ({ windowMs: 20 }) and reads window and windowMs from the reading at 44.1 and 48 kHz; the browser leg reads 'ms · samples at kHz' consistent with the samples and the rate."
