title: "The signal peeper on every page: a framed, switchable, pinnable view of one probe tap point"
slug: the-signal-peeper-on-every-page-a-framed-switchable-pinnable
priority: p2
profile: implementation
objective: "Lands as feat(ui) on branch feat/a5-frame-peeper. The peeper shell in src/js/ui/peeper: model.js (pure: the view state and the probe lease), ui.js (the Alpine part composed into the ONE component), view.js (one swappable draw function, the placeholder line until W004's scope replaces it through setPeeperView) and probe-stub.js (a local mirror of the probe tap API stub of V616, createProbeStub, windowSamples and windowMsOf, swapped for src/js/studio/probe.js by one marked import line in src/js/main.js). It opens on every workspace from the page header's action (peeper.toggle, in the page actions of the registry-driven header) and from Backquote, bound through the one key registry of src/js/ui/keys (K153). It is a visual component of the UI catalogue (decl/visual.js, rule project.visual-components-framed), so the one frame gives it full screen; its controls are declared in decl/peeper.js. It docks below the workspace in the content column's flow, so it covers nothing at any width, and on a phone it is a bottom sheet that collapses to its header. The tap list is probe.points(), derived by the probe from the port declarations and never placed per page; peep(target) ({ id } | { nodeId } | { edgeId } | 'id') is the one API the patch bay and the Studio graph call. It asks the probe with windowMs only and shows the window it got (samples and actual ms at the probe's rate). Pinned, it survives route changes and retargets its lease; the pin is view state, kept in local storage (oscilla.peeper) and never in the hash or the history. A lease is held only while it is open and expanded, the output plays and the page is visible: close, hide, collapse and Stop release it, and it never starts audio. A reading with live: false shows its reason and never a fake frame; the stub's signal is marked STUB SIGNAL."
why: "Owner order (2026-11-02 16:31Z, relayed via 1d), verbatim: \"vzdu musi byt oscillosope like komponenta (genericka / derived / infered - na vsech strankach; dost vymazlena, prepinatelna, pripnutelna) pro vizualizaci prubehu signalu kdykoliv a kdykoliv - anglicke kukatke - peeper\". No workspace let the signal be watched outside the Analyzer's own charts: the peeper makes it watchable from every page without leaving it, which is the connection between workspaces this intent asks for."
