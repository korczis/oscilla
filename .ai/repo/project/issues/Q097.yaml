objective: "Two questions with options, not decisions. Hardening S9, owner decisions 1 and 2. (1) Should the timing-allow markers in tests/browser (27 counted by the audit at 68b117f3) get a count ratchet like timing-baseline.json? (a) yes, a baseline that only shrinks; (b) no, keep reviewer judgement. b0's recommended default: (a). (2) contrast-axe never runs, because axe-core is not a dependency (tests/browser/qa-regressions.cjs:75-78 loads it only when installed), and contrast is Chromium-only with no recorded reason: (a) add axe-core as a devDependency so the axe pass gates; (b) delete the check; (c) keep it declared and record the reason. b0's recommended default: (a), and run contrast in all three engines."
