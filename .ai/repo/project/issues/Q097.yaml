    result: "Question 1, timing-allow markers: answer (a), a shrink-only count baseline seeded at today's count, 33 markers across 17 files on main b8bfd3b6 (the audit counted 27 at 68b117f3). oscilla-c1's amendment: the baseline is per file and lists each existing marker with its file and the reason it exists, so the six added since 68b117f3 are visible rather than forgiven; a rise needs a raises entry naming the file, the marker and the reason (the source-size ledger's pattern); the test is mutation-proven both ways (a new marker fails, an unrecorded fall fails). Question 2, contrast-axe: answer (a). axe-core is an exactly pinned devDependency with lockfile integrity (no range), loaded into the page from node_modules by the suite, never from a CDN; contrast and its axe pass run in chromium, firefox and webkit, and an engine is excluded only with a reason recorded in the suite (no silent skip); its measured seconds go into tests/browser/shard-weights.json so the legs stay within LEG_BUDGET_S; under project.ci-bounded the install stays inside the existing npm ci step. oscilla-c1's third amendment: the change that adds axe-core is guarded only if it touches .github or the build scripts, and then needs its own reviewer verdict. oscilla-43 agreed to both (a) with the exact pin and the install-time bound; oscilla-c1 agreed with the amendments above."
