id: K164
milestone: M080
serves:
- "studio-box-system#node-declaration"
title: "The patch contract coverage matrix, derived from the registry"
slug: the-patch-contract-coverage-matrix-derived-from-the-registry
priority: p1
profile: implementation
objective: "Owner program B (2026-11-03), slice B1. scripts/patch-contract.mjs reads NODE_REGISTRY and, for every node type, every port and every parameter, states each contract field as declared, defaulted (derived by the declaration, V619) or missing. Port fields: identity and owner node, direction, signal type, role, cardinality, required, channels, rate, unconnected behaviour, monitor and compact eligibility, version. Parameter fields: type, unit, default, range or options, mapping, automatable, modulatable, live-update timing (live). It writes the matrix as JSON and, with --write, docs/v31/patch-contract.md (a derived table that says so), and --check fails on a stale table. tests/unit/patch-contract.test.mjs pins the counts of missing fields per field in tests/unit/patch-contract-baseline.json, which only shrink: a new port or parameter without its contract fails, and a fall asks for the baseline to be lowered in the same change. Inventory at the planning head (2026-11-03): 36 node types, 94 ports, 145 parameters; ports declare id, direction, type, role, multiple, required, liveInput and param, parameters type, unit, default, step, scale, options, automatable, modulatable and softRange (min and max on 108 of 145); channels, rate, unconnected behaviour, monitor and compact eligibility, version and live are declared nowhere."
why: "The owner's program B of 2026-11-03 (patch bay: fully described, configurable, modular, live) asks for a plan-backed coverage matrix derived from the registry, never a hand-kept list, as the evidence that every port and parameter has an explicit contract. Split agreed on the mesh: dev-53 the matrix and the rendering, oscilla-26 the declaration (V619)."
scope:
- scripts/patch-contract.mjs
- docs/v31/patch-contract.md
- tests/unit/patch-contract.test.mjs
- tests/unit/patch-contract-baseline.json
- package.json
- tests/README.md
acceptance_criteria:
- "Before: VERIFIED: no script or table states the contract of every port and parameter; the registry declares 9 port fields and 18 parameter fields, and channels, rate, unconnected behaviour, monitor and compact eligibility, version and live are declared nowhere."
- "After: node scripts/patch-contract.mjs --check passes on a current docs/v31/patch-contract.md; the matrix lists every node type, port and parameter of NODE_REGISTRY, each field declared, defaulted or missing, defaulted counted apart from declared."
- "Negative cases: a fixture registry with a port lacking its direction, a parameter lacking its unit, or a field name the matrix does not know is reported by name; a stale table fails --check; a missing count above the baseline fails the unit test with the field and the types that grew."
- "Rollback: revert the merge commit; nothing in src/ changes."
- "tests/unit/patch-contract.test.mjs fails on the merge base (no script) (project.fail-first)."
validation:
- node --test tests/unit/patch-contract.test.mjs
- node scripts/patch-contract.mjs --check
evidence_required:
- verified
created_at: '2026-11-03'
updated_at: '2026-11-03'
