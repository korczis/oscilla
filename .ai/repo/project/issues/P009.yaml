objective: "For each library the owner named, measure in a scratch build outside the tree (nothing under src/, dist/ or package.json changes here): the pinned version and licence, the raw and gzip delta of a tree-shaken esbuild import against the current budget (scripts/build-config.mjs BUDGET.gzipBytes, 1 000 000 B on main; E027 proposes 1 200 000), the consumer it would serve (an M062 chart, a read-only relationship explorer, documentation diagrams), and its offscreen and accessibility cost; then write a recommendation to adopt or decline each, for the owner to decide in Q070. The measurements go into Q070's record as its options; an adoption gets an ADR next to ADR 0012 and ADR 0013, never a free-standing decision file."
why: "The pack names four engines; uPlot, p5 and the Studio renderer already exist and the owner deferred replacing p5 and changing the budget, so a library entering dist is the owner's call on measured numbers."
