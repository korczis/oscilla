objective: "Once every workspace is on Pro, regenerate every visual reference from the finished shell, each with its recorded reason: the Playground --play scene (tests/visual/reference.png, baseline.json, regions.json), Measure (tests/visual/measure), the Studio (tests/visual/studio), and new references for the workspaces that had none (Experiments, Analyzer, Filter Lab, Compare, Synthesis, Sequencer, Presets, Learn, About), in the dark and the light theme at 1536x1024 and 390x844, the linux-x64 images produced in the CI runner's container image and the darwin-arm64 ones on the Mac. Update tests/browser/live-smoke.cjs so the post-deploy smoke checks the Pro shell (navbar, sidebar, the active workspace, the compact Studio widget) instead of the legacy selectors it reads today. Run the whole visual gate and the live smoke against the built file."
why: "The intent is held only when a pixel regression of the Pro interface fails a gate; the per-issue reference updates of F002 to F010 leave gaps (both themes, workspaces without a reference)."
