title: "An unsaved sequence arms the unsaved-work guard"
slug: an-unsaved-sequence-arms-the-unsaved-work-guard
priority: p2
profile: implementation
objective: "Lands as feat(sequencer). Finding persist-7, its sequencer half: the lab settings are configuration and stay unguarded by design (ADR 0045 and the README Unsaved-work section list what the guard counts; 'With nothing to lose the page asks nothing'). Sequencer edits have no storage and no dirty flag, so a reload after an added block and a Tempo change discards them with no prompt (README:70 'Sequencer patterns are not guarded yet'; ADR 0045 left it as a follow-up). Using the editor's onChange from C004, keep a digest of serializeSequence(model) in reactive fields on the component (seqDigest and seqSavedDigest; a plain closure flag would never re-run the guard's Alpine.effect), add a fifth source to the guard that names 'Unsaved sequence' while they differ, set the saved digest at boot (the default sequence is not work), after an import and after a successful Export configuration, and show a per-domain indicator in the Sequencer panel. No localStorage draft (a second copy of state beside the export and the Studio model). Update README:70 and close the ADR 0045 follow-up."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
