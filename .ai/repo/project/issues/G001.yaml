acceptance_criteria:
- "tests/unit/ui-catalog.test.mjs fails on the merge base (the catalogue does not exist) and, with a fixture per clause, refuses an undeclared hook, a non-literal data-osc value without a pattern declaration, a declaration without docs or test, a docs sentence equal to its label or repeated, a test file that names the hook only in a comment or that no script runs, a state path sources.js does not resolve (an invented ui.* path included), state none on a kind that does not allow it or without a reason, an action or open declaration with state none and no effect, a dangling link and an invalid default, each with a message naming the id."
- "The no-inert-controls check of tests/browser/qa-regressions.cjs fails on a data-osc value of the running page that neither the registry nor the allowance holds (a fixture hook injected by the check proves it), in every gate browser."
- "No module under src/ imports the docs-only trace part, and no file of it lives under src/ (the unit test scans the imports)."
- "The undeclared section of the allowance lists exactly the hooks not yet declared, with a reason of at least three words per family; a hook declared in the same change leaves it; the test fails when an entry rises or an entry removed in an earlier commit returns."
- "Node face entries are derived from NODE_REGISTRY: adding a node type adds its entry with no edit under src/js/ui/catalog (shown by a fixture type)."
- "src/js/labs/lab-state.js holds the lab defaults unchanged (FILTER_DEFAULTS, ADSR_DEFAULTS, PHASE_DEFAULTS and the additive defaults), the labs re-export them, and npm run test:labs passes unchanged."
- "No input path of the build gains a components, widgets, ui-kit or design-system segment (the COMPONENT_LIBRARY check of scripts/ui-flowbite-pro-measure.mjs refuses it): the catalogue lives in src/js/ui/catalog."
- "Definition of done, extends: the section 79 parameter descriptor of src/js/studio/nodes/common.js and the defineNode registry (V411), which the catalogue reuses instead of a second schema."
- "Definition of done, interlinks: each declaration names its links and related views; the link graph (G016) and the generated catalogue (G014) read them."
- "Definition of done, interactivity: none yet: the catalogue is data; rendering from it starts in G008 (stated)."
- "Definition of done, docs, menus and routes: tests/README.md says what the catalogue test proves; .ai/repo/features gains no entry until G014 generates the catalogue. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: tests/unit/ui-catalog.test.mjs, and the hook census added to the no-inert-controls check of tests/browser/qa-regressions.cjs, which waits with until() (deadline 'hook census collected', 5 s) for each workspace's controls before it reads their hooks; no surface changes, so pointer, keyboard and touch paths are the existing checks'. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 2 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
- "The pull request states the gzip bytes per declaration of the part the runtime registry bundles (id, kind, label, state, links and the docs sentence): a fixture entry module importing the first declarations, built with the project's esbuild options and gzipped -9, divided by their count, beside the projection for every hook the census counts (584 distinct values on f887066f); Q037 is put to the owner with that figure."
validation:
- node --test tests/unit/ui-catalog.test.mjs
- "npm run test:labs"
- node tests/browser/qa-regressions.cjs --only no-inert-controls
- npm test
evidence_required:
