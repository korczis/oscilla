id: G001
milestone: M085
serves:
- "component-system#contract-and-registry"
title: "One declaration per UI component: the catalogue contract, its registry, its state sources and the test that refuses an undeclared, undocumented or untested component"
slug: one-declaration-per-ui-component-the-catalogue-contract-its
priority: p1
profile: implementation
objective: "Lands as feat(ui). Adds src/js/ui/catalog/ (never a components, widgets, ui-kit or design-system path, which the Flowbite Pro ratchet refuses): define.js with defineComponent(decl), which validates and freezes a declaration { id (the data-osc hook it owns, and hooks: [more hooks] when one component carries several), kind (param, switch, choice, transport, action, readout, empty, open, fullscreen, panel, workspace, node-face, edge, clip), label, param (a section 79 parameter descriptor built with the existing numberParam / frequencyParam / enumParam of src/js/studio/nodes/common.js: unit, min, max, step, scale, default, softRange), state (a canonical state path, never state of its own; or { none: '<reason of at least five words>' } for a component that owns no value, allowed only for the action, open, readout, panel and workspace kinds: 584 distinct hooks were measured on f887066f, most of them buttons, text, links and containers such as action.copyUrl, action.exportAudio and config.export, which change no state path), effect (what activating it does when it changes no state path: { route }, { dialog }, { download }, { command } or { focus }; required with state none on the action and open kinds, so a test can assert it), in (its container: a panel or workspace id), links ({ opens: [...], openedBy: [...] }), related ([...]), disabled ({ reason }: the sentence only; when a control is disabled stays decided by its owner's code, so the catalogue has no condition language), docs (one sentence shown in the app; long text in the docs-only part, kept outside src/ under scripts/ui-catalog/trace/ so the app cannot import it and the ratchet does not read it), trace ({ source, plan, intents, adrs, tests }, in that docs-only part) }; sources.js, the table of state owners measured in pack03/dataflow.md (instrument.<key> from INSTRUMENT_STATE_KEYS of src/js/core/config.js; lab.filter, lab.envelope, lab.additive, lab.phase from FILTER_DEFAULTS, ADSR_DEFAULTS, PHASE_DEFAULTS and HARMONIC_COUNT, moved unchanged into the pure src/js/labs/lab-state.js and re-exported by the labs, so the catalogue never imports a lab module and no import cycle forms once G008 makes the labs import the catalogue (the lab modules themselves load in Node after npm ci, measured 2026-10-29); sequencer.<key>; studio.model, studio.param (the node registry), studio.transport, studio.selection, studio.view; measure.<key>; ui.<key>; every family's keys are an enumerated list and none is a pattern or a catch-all, so an invented path such as ui.anything is refused), each with has(path) true only for a listed path, its persistence sentence and the name of its writer for the reader; the catalogue never reads, writes or subscribes to a value at run time (a surface that renders a declared control passes its own value and commit function, G008), so sources.js is a table, not a state layer; registry.js, which collects the declarations of src/js/ui/catalog/decl/*.js by static import (so the build bundles it into the single file once a runtime module imports it) and derives one node-face entry per NODE_REGISTRY type, never a second declaration of a node. The first declarations are the Studio transport and the embedded Studio (studio.compact.*, studio.tl.*, the Studio toolbar's play, stop, return and loop) and the Filter Lab parameters. tests/unit/ui-catalog.test.mjs: every data-osc hook of src/index.html and every data-osc value of src/js ('data-osc' keys, setAttribute('data-osc', ...) and dataset.osc assignments) is declared or listed in the undeclared section of tests/unit/ui-catalog-allowance.json, an allowance that only shrinks (an entry may never rise or return, as tests/unit/no-inert-surfaces-allowance.json). The file's shape is stated here once: a JSON object whose keys are sections (undeclared, opened by this slice; untraced, opened by J002; unlinked, opened by J004), each an array of { id, reason } sorted by id and judged on its own against the base branch's copy (its length only falls, a removed entry never returns); a missing section is one not yet opened, so the sections land in any order, and a section its owner closes refuses any entry; a value that is not a literal (a template such as studio.tl.${key}, or a variable such as the Inspector's dataOsc: 5 template and 7 variable sites, VERIFIED) must be declared as a hook pattern with its enumerated keys, or the scan fails, so a hook cannot escape the census by being built at run time; and the running page is censused too: the no-inert-controls check of tests/browser/qa-regressions.cjs, which already visits every workspace, Studio selection and node type, collects every data-osc value it meets and fails on one the registry and the allowance lack. Every declaration has a docs sentence of at least five words that is not its label and that no other declaration repeats, a source module that contains its hook, at least one test file that names its hook (inside a string literal, comments removed, in a file that npm test or a package.json script runs), a state path sources.js resolves or, for the five kinds that allow it, state none with its reason and, on the action and open kinds, its effect, link targets that resolve, and a parameter default that validateParamValue accepts. Naming a hook is recorded as NAMED, never as VERIFIED: it proves a test addresses the hook, not what the test asserts. Before: VERIFIED 576 distinct data-osc values, 313 named by a test, no declaration, no catalogue (inventory 4.1, 4.3). After: one declaration per component and a test that refuses drift. Negative cases: an undeclared new hook, a hook built from a variable with no pattern declaration, a hook only the running page shows, a declaration naming lab.filter.cutof, a ui.* path the table does not list, state none on a param, state none without a reason, an action with state none and no effect, a test file that names the hook only in a comment, a docs sentence equal to the label or copied from another declaration, a link to a missing id, a default outside its range; each is refused with the id. Rollback: revert the merge commit; nothing in the app imports the catalogue yet, so no behaviour or stored record changes."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
