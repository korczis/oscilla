  - "Browser check `pan-live-dual` in tests/browser/app.cjs: a dual mono voice started centred, #osc-stereo-pan moved to -1 while it sounds: the L/R balance exceeds 6 dB within a named deadline; a centred dual voice keeps its level within 0.5 dB of the merge base."
  - "Browser check `phase-stereo-import-sync` in tests/browser/labs.cjs: after importing phaseStereo { phaseDeg: 90, pan: 0.5 }, #osc-stereo-pan.value is 0.5 with a matching --osc-fill and aria-valuetext, and #osc-phase-offset reads 90."
  - "#osc-stereo-pan is disabled with its visible reason in Stereo output and for a single source (project.no-inert-surfaces), checked in the same suite."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "engine.activeNodeCount returns to 0 after every stop in the new checks, in Chromium, Firefox and WebKit (project.audio-engine-discipline v2)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/audio/audio-engine.js (project.review-verdict); the builder never writes it."
  - "The change adds no osc-* class token, stylesheet selector or inline style, so the Flowbite Pro ratchet only shrinks (node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
