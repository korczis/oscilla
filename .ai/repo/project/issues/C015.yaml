title: "The mic lab stops honestly when the engine discards its audio context"
slug: the-mic-lab-stops-honestly-when-the-engine-discards-its-audi
priority: p2
profile: implementation
objective: "Lands as fix(labs). Finding engine-sync-3. When the context closes from outside, _discardContext calls detachMicrophone('closed'), which stops the tracks and emits 'micAttachment' { attached: false }; nothing subscribes (cmp.onEngine has no such case) and MediaStreamTrack.stop() fires no 'ended', so the lab stays active with aria-pressed=true 'Stop microphone' and an analyser of the closed context, and after the next gesture rebuilds the context it is still on the old one. Include the detached analyser in the event (_emit('micAttachment', { attached: false, reason, analyser })), give the lab adapter onMicDetached(fn) fed from engine.on in main.js and passed through src/js/labs/index.js, and in src/js/labs/mic-analyzer.js react only when d.analyser is the lab's own: clear stream, attachment, estimate and comparison, reset the button and say 'The audio context was closed; the microphone was stopped.' Never stop on reason 'replaced', which attachMicrophone emits from inside the lab's own start() after the new stream is set."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
