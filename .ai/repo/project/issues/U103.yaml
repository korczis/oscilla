acceptance_criteria:
  - "Fail-first unit (tests/unit/u103-link-contrast.test.mjs, fails on the merge base): PRO.link's text colour, read from its classes and the Tailwind palette (never retyped), meets 4.5:1 on a Pro card and on the page in the dark and the light theme; on the merge base the dark card pair is 3.99:1."
  - "tests/browser/qa-regressions.cjs contrast passes in chromium, firefox and webkit with AXE_KNOWN empty: 0 colour-contrast violations over its axe runs and the 2:1 fixture flagged."
  - "The visual references (npm run test:visual) hold, or move with an accepted reference and its reason (project.visual-identity-lock)."
  - "tests/README.md has a row for the new test; dist is rebuilt and npm run build:check passes."
validation:
