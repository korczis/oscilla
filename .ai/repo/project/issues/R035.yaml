title: "The release cadence counts a recorded, deployed release, not a tag alone"
slug: the-release-cadence-counts-a-recorded-deployed-release
priority: p1
profile: implementation
objective: "Lands as fix(release). Hardening D3 (P2, observed): any merged v* tag counts (scripts/release-analyze.mjs:167) and the tag push closes the overdue issue (.github/workflows/cadence.yml:29, scripts/release-cadence.mjs:132-137), so a publish that fails after pushing its tag (release-publish.mjs:614-617) clears the cadence with no deploy and no Release. After: the cadence counts a release only when its tag has a GitHub Release and either a release record under .ai/repo/releases/ on main or an open record pull request (chore/release-record-vX.Y.Z, the flow's last step) younger than 24 hours, so a correct release whose record pull request is in flight raises no false overdue alarm; a tag without both leaves it overdue and says which is missing. lastReleaseTag (scripts/release-analyze.mjs:164) is shared with release:analyze (:189) and release:publish (:443), so the change is confined to release-cadence.mjs (:171 and the clearing at :132-137): it filters the tags lastReleaseTag returns, and lastReleaseTag itself is unchanged. Line numbers at origin/main a19f1ff6."
why: "af's Hardening proof-chain synthesis, defect D3 and smallest slice 6 (project.deploy-often). af's critique of 96daa67b (AMEND 6): lastReleaseTag is shared with analyze and prepare, and the record-PR window must not raise a false overdue."
