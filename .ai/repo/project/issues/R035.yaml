title: "The release cadence counts a recorded, deployed release, not a tag alone"
slug: the-release-cadence-counts-a-recorded-deployed-release
priority: p1
profile: implementation
objective: "Lands as fix(release). Hardening D3 (P2, observed): any merged v* tag counts (scripts/release-analyze.mjs:167) and the tag push closes the overdue issue (.github/workflows/cadence.yml:29, scripts/release-cadence.mjs:132-137), so a publish that fails after pushing its tag (release-publish.mjs:614-617) clears the cadence with no deploy and no Release. After: the cadence counts a release only when its tag has a GitHub Release and a release record under .ai/repo/releases/; a tag without both leaves it overdue and says which is missing."
why: "af's Hardening proof-chain synthesis, defect D3 and smallest slice 6 (project.deploy-often)."
scope:
