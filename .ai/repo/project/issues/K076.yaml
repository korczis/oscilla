id: K076
milestone: M067
serves:
  - "connected-instrument#modulation-everywhere"
title: "Modulate this knob: any knob of any instrument a destination, from the knob or by a drag"
slug: modulate-this-knob-any-knob-of-any-instrument-a-destination
priority: p2
profile: implementation
objective: "Lands as feat(synth). The knob menu item 'Modulate this knob' and an Alt-drag from a knob onto a source jack open K021's add-route row with the target filled; the route is one EDGE_ADD through canConnect, its depth an amount knob on the target's card and a row of the mod matrix. Sources listed: LFO (audio-rate after K010), mod-gen, Envelope, Contour, Random, Step Modulator, Macro (K013), and the sources later slices add (CV lanes K078, MIDI CC K077, Follower K080, XY K097). A knob with incoming CONTROL edges shows their band and a live dot (hidden under reduced motion). Before: modulation is added only in the Studio graph or the mod matrix. After: any knob is modulated from its own menu or a drag. User-value tier 3 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/ui/synth"
  - "src/js/ui/controls"
  - "src/js/ui/studio"
  - "tests/unit/ui-flowbite-pro-baseline.json"
  - "tests/browser/integration-map.json"
  - "tests/unit/synth-modulate.test.mjs"
  - "tests/browser/synth-modulation.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K021"
  - "K058"
  - "K062"
  - "Q023"
acceptance_criteria:
  - "tests/unit/synth-modulate.test.mjs, failing on the merge base: the menu and the drag each produce one EDGE_ADD whose target is the knob's PARAMETER port, a refused route changes nothing and shows the sentence, and the knob's band equals the sum of its edges' depths."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a route that closes a control cycle; a source of the wrong type."
  - "A browser check in tests/browser/synth-modulation.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a route added from a knob is the row the mod matrix shows and the edge the Studio graph shows at the same revision. Real-time: the modulated parameter's runtime value moves (sampled from the graph) while the LFO runs, and the knob's dot moves with it, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the route is added by the knob menu (pointer, ContextMenu key) and by Alt-drag (pointer and touch with the Alt toggle); the menu is role=menu. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every link it adds (open in, send to, a modulation route, a probe or a jump between views) is a row of tests/browser/integration-map.json, and tests/browser/integration-map.cjs walks it: the control works by pointer and by keyboard, the target shows the same Studio revision, focus lands on the target heading, and Back, Forward and reload keep the state."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "Its chrome uses the Flowbite Pro component where Pro has one (card, button, button group, input, dropdown, tabs, tooltip, popover), adapted from that block, lands after F008, is recorded as migrated (never pending) and lowers or keeps the ratchet; the instrument visuals Pro has no component for (the knob arc, the cable layer, the piano keys, the pad surface) are inline SVG and Tailwind utilities inside Pro cards, as the ADR 0061 resolution note of K058 records; it adds no osc-* class token, no legacy selector, no inline style and no stylesheet (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs); every continuous instrument parameter it shows is the knob of K058 (D11)."
  - "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the line's figures stays within the cap Q023 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/synth-modulate.test.mjs"
  - "node tests/browser/synth-modulation.cjs"
  - "npm test"
evidence_required:
  - "verified"
