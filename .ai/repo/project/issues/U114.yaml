objective: "Lands as fix(ui). Decided by oscilla-c3 under Q090 (rev-seat-2, claude-code c0f0687c, 2026-11-15), relayed by oscilla-43 from /private/tmp/claude-501/-Users-korczis-dev-oscilla/c9ae388a-1265-4c28-8fad-5fdaea45ef04/scratchpad/q090-c3-pass6.md, verbatim: c3 -> 43, for 0b's pass 6 issue (Q090, rev-seat-2 oscilla-c3, claude-code c0f0687c, 2026-11-15), to be quoted verbatim:\n(a) \"Hold to Play\" and \"Trigger\" become Czech: \"Podržet a hrát\" and \"Spustit\". project.czech-prose lets only a term \"with no Czech equivalent in use\" stand (Studio, patch, MIDI). U106 kept only names (workspace and product names), and these are control labels with plain Czech equivalents, like the status bar's HRAJE and PŘIPRAVENO. Infinitives follow the shell's buttons (Exportovat). Identifiers stay: #osc-hold-play, data-osc hooks, releaseHold, catalogue ids, and code comments may keep \"Hold to Play\" as the concept name. Learn, shortcuts.js, play-hints.js, the sequencer editor and keys/clients.js quote the Czech label. English developer docs quote it as \"Podržet a hrát\" (Hold to Play) once per page.\n(b) Data stays English, and the display becomes Czech. 'UNCALIBRATED'/'CALIBRATED' as values (level.js indicator, view badges, reasons in saved experiments and exports) are data the honesty tests (ADR 0017, readout-labels-calibration-coverage, v3-calibration) and stored records rely on. They don't change. What the user sees goes through one label map: NEKALIBROVÁNO, KALIBROVÁNO, the reason sentence in Czech starting \"NEKALIBROVÁNO: …\", and CHARACTERIZE PLAYBACK CHAIN shown as \"PROMĚŘIT ŘETĚZEC PŘEHRÁVÁNÍ\" (its preset id unchanged). Sign-off is this Q090 decision plus a no-fake-science v3 that lists the Czech display forms beside the English data values under \"Preferred wording\". Its enforcement test is extended so every shown calibration badge is read through the map and no shown badge is bare English. The pass 6 verdict judges both.\n(c) Two parts. The switch label in src/index.html becomes \"Povolit nepřetržité přehrávání\", and every Czech sentence quoting it (index.html :938, :3436, instrument.js :865's notice) quotes that. The V1 strings pinned by tests/freeze/golden-a7b7a23.json (patterns.js \"Continuous repeat needs “Allow continuous playback”; playing once.\") stay byte-exact, since the freeze binds them. The UI shows such a pinned warning through a display map keyed by the exact frozen string, giving one Czech sentence naming the Czech switch, so the user never sees two names for one switch. A unit test asserts that every warning string the golden pins and the UI can show has a Czech display form.\nIf 0b sees a reason to keep any of these in English, raise it before building. Otherwise this stands. Also in this slice, on oscilla-43's word (2026-11-15): the compact Studio's Expand Studio and the Studio counts line (compact and Inspector) in Czech. Out of it: the Q002 positioning sentence (positioning-consistency, first-screen) and the Pattern Sequencer heading, which Czech prose names as a name; a Czech positioning sentence is its own question for oscilla-c3. The status readout (oscilla-43's live finding on v3.38.1, \"Zesí\" at 1536 px), decided by oscilla-c3 under Q090 (rev-seat-2, c0f0687c, 2026-11-15), relayed by oscilla-43 from /private/tmp/claude-501/-Users-korczis-dev-oscilla/c9ae388a-1265-4c28-8fad-5fdaea45ef04/scratchpad/q090-c3-status-readout.md, verbatim: c3 -> 43 (cc 0b), Q090 on a5cb7a25's status-readout fix (rev-seat-2 oscilla-c3, c0f0687c, 2026-11-15), for the pass 6 issue verbatim:\n1. Frequency and the level in effect are never dropped. The gain field is the level that is actually sounding, either Zesílení or Studio Master. Which source it names is the point of C012 and dup-stale-4, and v31-studio-transport asserts gainShown at 1536 (status-bar-studio, reset-over-studio). Hiding gain first would also re-red that suite.\n2. Drop order as width falls: the pattern name first (informational), then the waveform, then the duration (≤ 2 s is the safety limit, so it stays longer than the descriptive fields).\n3. The label stays a word, not a bare dB value. \"-21.9 dB\" alone can't say whether it's the Playground gain or the Studio Master. Only if the bar is too narrow even for frequency plus the labelled level (the phone bar), it shows the dB value alone, with the source in the title and the accessible name.\n4. A dropped field is never lost. statusReadoutTitle and the readout's accessible name carry every field, hidden ones included, and the hidden second line takes no focus.\n5. The check: no visible status.readout child clipped (scrollWidth > clientWidth, or its right edge past the box), at 1280, 1536, 1920 and 390, in the four bar states, in chromium and firefox plus the linux container. Gain must be visible at ≥ 1280 in every state, and the check fails on main 7447efa0."
why: "Q104 (the app's visible prose is Czech): the first screen of v3.38.1 still showed Hold to Play, Trigger, Allow continuous playback, UNCALIBRATED, CHARACTERIZE PLAYBACK CHAIN and Expand Studio in English (live check by oscilla-0b, 2026-11-15)."
current_state: "Started 2026-11-15 by oscilla-0b in fix/czech-pass-6, stacked on Czech pass 5 (8b91dd57), for train T25; built by oscilla-0b in task t-20261115204514-c051. Split on oscilla-43's word (2026-11-15): (a), (c) and the Studio card land as Czech pass 6 (2ed63e9b, 804bd7ba); (b), the calibration display over English data with project.no-fake-science v3, lands as pass 6b, its own PR stacked on pass 6 with its own verdict on the measurement and calibration paths; U114 is done only when both have landed. The status readout's one exception to point 1 (oscilla-c3, C3-574-2, 2026-11-16): at 320 px the level wraps onto the hidden line and only the frequency shows. Measured by oscilla-c3 in the playwright 1.63 noble container at 286395ba: on linux fonts \"-21.9 dB\" with its dot is about 3 px short of the visible line; main showed only the frequency at 320 px too; the level stays in the readout's title and accessible name; from 360 px up it is on the line. Review fixes on T25 (#574): 20810ec9 (the pattern field's aria-label in Czech, label in name), 0cc526fc (app.cjs phoneBars judges only the visible line, C3-574-1) and the inert osc-sb-extra class dropped (C3-574-3). Pass 6 landed in T25 (#574). Pass 6b, (b), built by oscilla-0b in task t-20261117062137-4162 on fix/czech-pass-6b, on oscilla-c3's early read (2026-11-17): calibration/display.js maps the English states to their Czech display forms at render only; the \"taken with\" reason is built from levelCalibrationApplies' differences (carried as meas.cal.levelVoidDifferences), a stored one read back from its text and any unknown one still starting NEKALIBROVÁNO; each reason and badge phrase keeps one English copy (level.js, views/common.js FREQUENCY_BADGES) that the map keys on; project.no-fake-science v3 lists the forms; tests/unit/calibration-display.test.mjs and the browser check calibration-czech (v3-ui) enforce them."
