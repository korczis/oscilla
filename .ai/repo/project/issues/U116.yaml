title: "Czech pass 8: the Výuka and Předvolby display layer (Learn cards, live examples, preset categories, names, descriptions, Custom and History rows) in Czech over English data"
slug: czech-pass-8-learn-presets-display
priority: p2
profile: implementation
objective: "Lands as fix(ui). The JS data and display layer of the Výuka (#m=learn) and Předvolby (#m=presets) pages: the Learn card titles, bodies, demo and link labels, the live example line (topicExample), the way back to a lesson, the preset category labels, the 16 reference-note descriptions, the built-in preset names, descriptions and parameter lines, the Custom row (describeConfig and its saved date) and the History time, in cs-CZ. The frozen V1 data (LEARN_TOPICS, BUILTIN_PRESETS, PRESET_CATEGORIES, REFERENCE_NOTES, describeConfig, topicExample, pinned by tests/freeze/golden-a7b7a23.json) stays English: the page shows Czech display copies keyed by id (data/learn-display.js, data/presets-display.js), and a demo or a preset loads its data record by id. The literals of src/index.html (Relate to current settings, the Demo prefix, Load and its aria-label prefix, Reset to defaults, Clear history, Recall, Delete and Confirm, the Save preset dialog, Open the Synth and the History row label) are left for a markup slice, since two other branches rewrite that markup (F002, #597). Owner order 2026-11-17 (Výuka, Předvolby and Syntéza are half English), handed over by oscilla-0b, who owns the Czech passes U109-U115."
why: "Q104 (the app's visible prose is Czech): a Playwright audit of v3.41.3 on 2026-11-17 listed at least 167 English strings on Výuka, Předvolby and Syntéza, 56 of them on the Learn cards and 44 on Předvolby."
current_state: "Built by oscilla-e5's builder in task t-20261118014951-bb3b on fix/czech-pass-8."
