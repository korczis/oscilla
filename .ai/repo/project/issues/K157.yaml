id: K157
milestone: M120
serves:
  - "connected-instrument#riff-library"
title: "A content-rights check over what dist ships: original, MIT, method recorded, symbolic only"
slug: a-content-rights-check-over-what-dist-ships
priority: p2
profile: implementation
objective: "Add scripts/content-rights.mjs (R01 design), run by npm test through tests/unit/content-rights.test.mjs: it judges every entry of src/js/studio/riffs/library.js (dist is a clean rebuild of src, npm run build:check) with a fingerprint of its notes, scans dist/index.html for audio of any kind, and refuses an entry that is not original, not MIT, without a method, or carrying any audio or media payload (Q082), and any library data in dist that no entry accounts for."
why: "The owner chose original-only, MIT, method recorded and symbolic only (Q079-Q082); a choice without a check is a convention (R01 2026-11-02)."
scope:
  - "scripts/content-rights.mjs"
  - "tests/unit/content-rights.test.mjs"
  - "tests/README.md"
depends_on:
  - "K149"
acceptance_criteria:
  - "Shipped form (critique m120-content-rights-check-has-no-region-to-read, decided 2026-11-03): the check judges the evaluated library module, since dist is a clean rebuild of src (npm run build:check), and sweeps the whole of dist/index.html for audio media; no separate data region is added. Built as feat/k157-content-rights 99c71c02."
  - "Before: VERIFIED (R01): no check holds a library entry's rights."
  - "After: node scripts/content-rights.mjs passes on the built dist and names the entries it judged."
  - "Negative cases (synthetic fixtures built in the test): an unknown licence, a non-MIT licence, a missing method, an audio data: URI or base64 blob in an entry, a reference-only entry shipped in dist, a fingerprint mismatch are each refused; an entry copied from a recorded song and labelled original is K163's (Q083 denylist), since author, licence and origin are set by the library's factory for every entry with a reason; each refusal is mutation-proven."
  - "Fail-first: tests/unit/content-rights.test.mjs fails on the merge base."
validation:
  - "node --test tests/unit/content-rights.test.mjs"
  - "node scripts/content-rights.mjs"
evidence_required:
  - "verified"
created_at: 2026-11-02
