title: "Bioacoustics, additive and harmonics charts: every row shown, bar readouts, Nyquist stated"
slug: bioacoustics-additive-and-harmonics-charts-every-row-shown-b
priority: p2
profile: implementation
objective: "Lands as feat(charts). bio-chart.js: adaptive row height with a 14 px minimum, so all 7 rows show at the default 127 px (mouse and dolphin are cut today), or a \"+n more\" indicator; the crosshair reads \"8.0 kHz: within the cited hearing range of human, dog, cat, bat; outside elephant's\" from the cited data only; a marker at the generator's requested frequency, updated on change and not per frame; colours from K027. additive-chart.js: a bar tooltip in measured and requested terms only, \"H5 . 1.10 kHz requested . -14.0 dB rel . below the digital Nyquist limit (24.0 kHz)\" or \"H9 . 26.4 kHz requested . above the digital Nyquist limit (24.0 kHz): dropped by the browser\", with Nyquist from the live context; the internal audible flag of audio/additive.js visualCoefficients, which records only frequency < sampleRate / 2, is never shown as a word (\"audible\" would claim hearing and speaker output the page cannot know, project.no-fake-science v2: \"speaker output unknown\"); no easing of bar heights. The harmonic bars (createHarmonicBarsView in src/js/ui/p5-views.js, drawing the tables of visualization/harmonics.js, a view of the shared #osc-chart-waveform host): a bar readout, the dB rel unit on the grid and the Nyquist label in text colour with a labelled dashed line (1.9:1 today); the THEORETICAL badge stays. The kit's keyboard cursor: up and down move the bio row, left and right the bar. The bio host is K053's (done there); this slice keeps it passing."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
