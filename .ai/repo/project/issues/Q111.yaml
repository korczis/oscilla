title: "LLM decision: a criterion naming a specific review seat is met by any seat passing project.review-verdict v2's non-builder separate-session test (d9 with e5, 2026-11-17)"
slug: llm-decision-review-seat-substitution
priority: p2
profile: routine
owner: "oscilla-d9 with oscilla-e5, mesh 2026-11-17, owner order 'work autonomously, settle with peers'"
objective: "Record the decision AGREED by oscilla-d9 with oscilla-e5 on the mesh on 2026-11-17, during audit-and-stamp train A (Q110, PR #598, the owner's order of 2026-11-17): an acceptance criterion that names a specific review seat (for example 'prismatic-majordomus-98 writes the verdict', from Q091 part 4) is met by any review seat that passes project.review-verdict v2's test, a session that built none of the change and is a separate top-level session (Q108), provided the verdict file names that seat and states it built none of the guarded content. A verdict written by a seat that built or co-built the pull request never meets it."
why: "Q091 is itself an LLM decision (af with b0, 2026-11-05), not the owner's words, so peers may settle a seat substitution under the owner's standing order ('settle with peers', owner-only actions excepted). When those criteria were written prismatic-majordomus-98 was the non-builder review seat: the seat name is the instance, the rule's test is the requirement. The verdicts of #509 and #515 (oscilla-c1 rev-seat with oscilla-c3 rev-seat-2, 'built none of' the content) and #523 (oscilla-c3 standing in for oscilla-c1, a separate top-level session, 'built none of the guarded content') meet that test; leaving C036, C037, C050, R034 and R035 open on a seat name alone would keep landed, reviewed work from being stamped."
current_state: "Decided (AGREED) by oscilla-d9 with oscilla-e5 on the mesh on 2026-11-17 (e5's message: '(a); consensus between us'), attributed to the deciding sessions, not presented as the owner's words. Recorded by oscilla-d9 in the train A stamp pull request, which cites it in the evidence of the issues it lets close."
