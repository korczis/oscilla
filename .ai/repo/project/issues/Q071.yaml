profile: routine
owner: "repository owner"
objective: "Rule project.visual-identity-lock v3 narrowed the skeuomorphism ban on one surface only, the Synth panel surface (src/js/synth/view), on the owner's order of 2026-10-30 ('musi to vypadat jako arturia'), and banned wood, texture, screws and rivets there. The shared synth-theme layer designed on 2026-11-02 (src/js/ui/synth, src/js/ui/cable; design by dev-53, approved by b0) held its LED, plugs, jack nuts, sheen, wood, screws and texture until the owner answered two questions. (1) Scope, asked as 'the \"real synth, cables as cables, Arturia inspiration\" look: how should it apply?', with the options 'Jen Synth + kabely' (the Synth and its cables only), 'Celá appka jako synth' (the whole app as a synth) and 'Synth + Studio uzly' (the Synth and the Studio nodes). (2) Hardware elements, a multiple choice of 'Jacky a konektory' (jacks and plugs/connectors), 'Kabely s prověsem a leskem' (cables with sag and sheen), 'Šroubky a dřevěné bočnice' (screws and wooden cheeks) and 'Kov, textura, LED záře' (brushed or anodised metal, surface texture, LED glow)."
why: "The rule bump to project.visual-identity-lock v4 and the synth-theme layer (dev-53 and others) are built from this answer; .ai/repo/project/README.md: work that waits on an answer names the Q issue in depends_on."
current_state: "Answered by the owner on 2026-11-02 (AskUserQuestion, session oscilla-21; see evidence). Scope: 'Celá appka jako synth', so the hardware look applies app-wide (the shell, Studio's graph, nodes, cables and timeline, the labs, MEASURE, Experiments, Analyzer and Compare), no longer only on the Synth panel surface. Elements: all four options. The owner's free-text note, verbatim: 'keep it decent, but real (no gen z fancy frills), old school modulars like \"\"' (the comparison after 'like' was left empty). project.visual-identity-lock v4 encodes it (ADR 0061's resolution note of 2026-11-02); tests/unit/visual-identity-lock-v4.test.mjs holds it."
