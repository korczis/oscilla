priority: p2
profile: implementation
objective: "Chromium can glitch one render quantum when the automation of a param that is ramping is edited (proven during the sequencer stop fix, PR #20). The engine's release path (freezeParam / cancelAndHoldAtTime on the envelope) edits such params; no test has caught a click there, but it is exposed in principle. Move engine releases to a dedicated output-stage fade, as the sequencer now does, and prove click-free stops under injected main-thread lateness in chromium, firefox and webkit."
