title: "Replace on an occupied input, drag a cable off to re-route it or onto empty canvas to delete it"
slug: replace-on-an-occupied-input-drag-a-cable-off-to-re-route-it
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). A drop on an occupied input is refused today and a cable cannot be dragged off. A drop on an occupied input replaces its edge; dragging a connected cable end re-routes it; dropping it on empty canvas deletes it. Every step goes through canConnect."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
scope:
  - "src/js/ui/studio/graph-gestures.js"
  - "src/js/ui/studio/graph-view.js"
  - "tests/unit/studio-graph-gestures.test.mjs"
  - "tests/browser/v31-studio-graph.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K007"
acceptance_criteria:
  - "Each gesture is one history entry (EDGE_REMOVE then EDGE_ADD as one undo step)."
  - "A refused type or cycle leaves the model, history and runtime unchanged and shows the validator's sentence (project.no-silent-feedback, project.typed-ports)."
  - "No reviewer's verdict is needed (src/js/ui/studio is not a guarded path); as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first). It adds no markup, osc-* class token or stylesheet selector, so the Flowbite Pro ratchet stays flat (node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/studio-graph-gestures.test.mjs"
  - "node tests/browser/v31-studio-graph.cjs"
  - "npm test"
evidence_required:
