title: "Patch jack and cable kinds: glyph and stroke from PORT_VISUALS, compatibility only from canConnect, first on the Studio graph's port rows"
slug: patch-jack-and-cable-kinds-glyph-and-stroke-from-port-visual
priority: p2
profile: implementation
objective: "Lands as feat(ui). src/js/ui/kinds/jack.js and cable.js: a jack's type and role come from the registry, its glyph from PORT_VISUALS (studio/ports.js:55), its name from portAccessibleLabel (ports.js:154), its verdicts from canConnect only; a cable's stroke from G004's one edge-style table. Events: drag (preview with sag), drop (EDGE_ADD, or the batch with the normal it breaks once K061 lands), remove (EDGE_REMOVE), depth (EDGE_UPDATE), menu (the connection list of graph-picker.js). The Studio graph's port rows and cables render through the kinds; G010, K063 and V611 then mount them. Before: VERIFIED ports and cables drawn per editor (graph-view.js, compact.js). After: one jack and one cable kind. Negative cases: an incompatible drop (the sentence, nothing added); a feedback cable (no-silent-feedback sentence); an unknown port type (fails the test, never drawn as AUDIO); ten inputs on one node. Rollback: revert; presentation only."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
