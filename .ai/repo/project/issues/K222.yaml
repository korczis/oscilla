title: "Drums view: the perc engine's kit as rows of one notes clip on the step-grid kind, with six trigger pads, on the one transport"
slug: drums-view-the-perc-engines-kit-as-rows-of-one-notes-clip-on
priority: p1
profile: implementation
objective: "Lands as feat(synth), in the same pull request as W008 (the step-grid kind's first mounted consumer). The Drums view of the Synth workspace (sv=drums, the place Q019 decided): one perc-engine node (src/js/studio/nodes/engines.js, the voices of src/js/synth/perc-recipes.js) and one notes clip on its track; six rows, each a note number of PERC_KEYMAP whose name comes from the target's key map (ADR 0086 decision 5: a lane is a note number, never a drum engine or a steps clip of its own), the default rows kick, snare, clap, hat closed, hat open and tom mid as one exported constant, each row's voice a picker over PERC_VOICES that rewrites that lane's note numbers in one CLIP_UPDATE; sixteen numbered steps (the clip grid's steps: 16, stepBeats: 0.25, ADR 0086 decision 2), each step a key with an on-light, 8 per page at 390 px with the row's name above its steps (8 x 44 px fill the 358 px inside the gutters, so no name column fits beside them) and 16 at 1536 px with the name beside them; the rows' shown names are Czech (Q104), carried in the label field and never in the voice ids of perc-recipes.js: Kopák, Virbl, Tlesk, Hi-hat zavřený, Hi-hat otevřený, Tom střední (and Tom nízký, Tom vysoký for the picker); the first pad tap on a phone sounds (project.a-phone-sounds); the playing step from transport.playhead() through W008's one frame-loop subscriber; six trigger pads below the grid, one per row, that play the row's note live through the note router (src/js/studio/live-notes.js) on the same store and transport, by pointer, touch and keys; Play and Stop are the one transport's. Open in Studio selects the clip in the timeline at the same revision. Before: the perc engine plays only from the piano keys and the Studio timeline; there is no drum grid. After: a drum grid and pads in the Synth workspace on the one notes clip, the one transport and the one store. Negative cases: a voice picked for a row that another row already holds (refused with its sentence, model unchanged); an off-grid note in the clip (shown as off-grid, never moved); Space (the transport's). Rollback: revert the pull request; a saved notes clip stays valid model data that the timeline plays. Amended 2026-11-09 (the coordinator oscilla-43): W008 lands first, with the Studio Inspector as the step-grid kind's first mounted consumer; this slice lands after it in its own pull request and mounts the same kind in the Drums view, with the commit that lets a notes clip play on the percussion engine (ADR 0086 decisions 5 and 6). Restated 2026-11-09 by the builder (oscilla-ee) from what landed: the tab's address key is yt=drums, the Synth tabs' existing key (core/url-state-synth.js SYNTH_LINK_KEYS.tab; sv is the Studio's sub-view key, so 'sv=drums' would have collided with it). The tab drives the panel's percussion engine node (panels/engines.js perc) and makes its clip on request (Vytvořit bicí klip, one history entry) rather than on opening. A pad strikes its hit on pointer down and on Enter or Space through its own click (a percussion hit decays by itself), so the pads add no key listener to the ratchet. The integration-map row of Open in Studio and the phone proof in tests/browser/iphone.cjs are not yet built: the first needs a declared data-osc hook (catalogue, trace, contract row), the second the gesture-rule leg; both stay open criteria."
why: "Owner direction of 2026-11-07 recorded by Q103 (oscilla-2b's session): the groovebox views (a drum machine of 6 voice rows x 16 numbered steps with 6 trigger pads and a record button; the semi-modular Synth face with a step-sequencer strip; two XY pads), in OSCILLA's own look, with the binding constraint 'no one-offs: componentised, reused, DRY, all connectable, one living system over shared state'. Carved from K073 on 2026-11-07 by oscilla-21 (the sequencer line), agreed with oscilla-2b: the drum rows are notes of one notes clip on a voice node (ADR 0086), the grid is W008's one step-grid kind, and K073 keeps the patch-bay outs, flam, choke and the kit's mixer."
