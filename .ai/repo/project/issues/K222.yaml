acceptance_criteria:
  - "tests/unit/drum-view.test.mjs, failing on the merge base: the six default rows map to PERC_KEYMAP note numbers whose names are the key map's; toggling step i of a row builds one CLIP_UPDATE whose notes array gains or loses exactly the note at at = i x stepBeats with that row's note number and leaves every other note unchanged; a voice picker change rewrites only that lane's note numbers in one CLIP_UPDATE; the three negative cases of the objective, each refused or shown as stated."
  - "A browser check in tests/browser/drums.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: the grid's clip is the clip the Studio timeline shows at the same revision, and Open in Studio selects it; reload keeps sv=drums. Real-time: while playing, aria-current follows the transport and a step toggled sounds on its next pass (a gate onset in the runtime's debugInfo); a pad press sounds its row's voice; each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: steps by pointer, keyboard (W008's keys) and touch, pads by pointer, touch and keys; the grid is role=grid with gridcells named ('Kick, step 5, on'). It runs through tests/browser/lib/suite.cjs at 1536x1024 and 390x844, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The phone proof: tests/browser/iphone.cjs gains the Drums view (a step toggled and a pad pressed with the browser's gesture rule on sound within its deadline) (project.a-phone-sounds)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); a refusal shows the store's sentence once in the polite live region and leaves model, history and runtime unchanged (project.typed-ports)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Every link it adds (Open in Studio, the sub-view tab) is a row of tests/browser/integration-map.json, and tests/browser/integration-map.cjs walks it by pointer and keyboard with Back, Forward and reload."
  - "Its chrome (tabs, buttons, button groups, the voice picker's dropdown) is markup adapted from the matching Flowbite Pro block; the step keys and pads are a domain view under the ADR 0061 instrument-visuals note (inline SVG or literal Tailwind utilities inside a Pro card, no stylesheet, no osc-* token, no inline style); the ratchet does not rise (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "Every string it adds passes tests/unit/synth-wording.test.mjs: no product, brand or model name and no claim of a device it imitates (project.no-fake-science); the look is OSCILLA's own, no third-party trade dress (Q103)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a feat change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 4 KB gzip added with W008, compiled CSS included, with the base and head figures in the pull request body, under the gzip budget of scripts/build-config.mjs (project.single-file-deliverable)."
  - "Definition of done: tests/README.md has a row for each new test, the Keyboard shortcuts dialog lists the pads' keys, dist is rebuilt and npm run build:check passes; it lands by merge commit and ships in the next release (project.deploy-often); the verified evidence names the main commit."
