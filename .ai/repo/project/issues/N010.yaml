id: N010
milestone: M112
serves:
- "parameter-controls#documented-extensible"
title: "Control reference generated from the views, and 'Add a parameter' in the extending guide"
slug: control-reference-generated-from-the-views-and-add-a-parameter
priority: p2
profile: implementation
objective: "Lands as docs(ui). scripts/ui-catalog.mjs writes docs/ui-catalog.md from src/js/ui/kinds/param and src/js/ui/catalog: per view, its interface, the keys and gestures, the attributes controlAttrs gives, the contract clauses control-contract.cjs checks, and viewFor's table; npm run docs:controls writes it and --check, run by npm test, fails when it is stale. The authored part, the one sentence per view, stays authored. docs/EXTENDING.md (docs/extending-guide) gains 'Add a parameter or a control': a parameter is one constructor call in a node definition plus its face section; the face, the Inspector, the menu, the reference and the census follow; a new view implements mountControl and passes the harness. Help and the What is this panel (G015) link to the reference. Before: VERIFIED no document describes a control's keys or contract. After: one generated reference and one recipe. Negative cases: a view added without its sentence, a stale reference. Rollback: revert. Merged plan of the component follow-up (2026-10-30): The control reference is the Controls section of G014's one generated catalogue, written by scripts/ui-catalog.mjs from the declarations and the pure controlAttrs, never from a rendered page; npm run docs:ui -- --check covers it with the rest, sorted by code unit, LF, no clock, plan ids only."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, KB and interlinking; full DAW, full sequencer, full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels in one generic way, integrated with Majordomus; every element tweakable; mobile first; the landing easy to use, easy to extend and open to hack. Owner decisions: knobs that always show value and unit (D11, Q018, the ADR 0058 note of 2026-10-29), every parameter on the box face (Q031), the generator in its own workspace (Q033). Design: the params-controls part of the component follow-up of 2026-10-29 (scratchpad components-followup/params-controls.md), checked against origin/main b67d1e58 and the head of plan pull request #285 (c0a631b2)."
scope:
- scripts/ui-catalog.mjs
- docs/ui-catalog.md
- docs/EXTENDING.md
