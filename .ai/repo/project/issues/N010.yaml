acceptance_criteria:
- "tests/unit/ui-catalog-docs.test.mjs fails on the merge base: the generator is byte-stable over two runs, lists every view module, and --check fails on a fixture view without its sentence."
- "Definition of done, tested: No browser check is owed: the slice adds documents and a generator; the Help link it adds is walked by the link-integrity suite of the route-hygiene line."
- "Definition of done, extends: docs/EXTENDING.md's 'Add a Studio node' and the generated node reference of V619."
- "Definition of done, interlinks: the reference links each view to its Learn and Help entries, and Help links back."
- "Definition of done, interactivity: none; the documents describe the interactivity N002-N008 build."
- "Definition of done, docs, menus and routes: docs/ui-catalog.md, docs/EXTENDING.md and tests/README.md. tests/README.md has a row for each new test; the parameter's or view's catalogue entry names its docs, links and tests (G001 trace part); dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "It changes no markup, class token or stylesheet (tests and docs only), so the Flowbite Pro record is untouched (node scripts/ui-flowbite-pro-record.mjs --check passes)."
- "scripts/size-report.mjs shows no bundled byte added (tests, scripts and docs only), with the base and head figures in the pull request body (project.single-file-deliverable)."
validation:
