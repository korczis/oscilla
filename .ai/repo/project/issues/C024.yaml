acceptance_criteria:
  - "Fail-first: tests/unit/output-owner.test.mjs asserts that held notes alone make outputOwnerOf name the notes' owner and that the bridge's description names it; it fails on the merge base."
  - "A static scan finds no reassignment of cmp.vizInputs outside src/js/core/instrument.js; a mutation that restores the override fails."
  - "tests/browser/midi.cjs holds a computer key and waits with until() (deadline 'notes own the scope', 2 s) for the scope's description and the status bar to name the same owner the drawing shows, and for both to clear after release; through tests/browser/lib/suite.cjs, no fixed sleep, no assumed sample rate, nothing added to tests/browser/timing-baseline.json (project.suite-harness, project.bounded-test-timing)."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
  - "Not a guarded path unless its scope widens to src/js/audio/* or src/js/studio/*; then the pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml (project.review-verdict)."
  - "Lands after the feature train #367 (K026 keys, C013 output-owner views)."
