depends_on:
  - "K061"
  - "Q023"
acceptance_criteria:
  - "The ADR is recorded before any code of this slice lands."
  - "tests/unit/instrument-worklet.test.mjs, failing on the merge base: the processor's kernel samples its input at the trigger frame exactly; the module source is embedded once in dist; the instrument worklet is loaded from a data: URL (asserted on the addModule argument, since scripts/verify-dist.mjs allows blob: workers and worklets) and dist holds no fetch or module script."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: no audioWorklet (degraded, stated); an OfflineAudioContext without worklet support (measured)."
  - "A browser check in tests/browser/engines.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: the worklet S&H in the panel is the node the Studio graph shows. Real-time: an S&H of a ramp input steps at each trigger (runtime value read back) in each gate browser from file:// and the Pages sub-path, or shows the degraded status where the browser has no worklet, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the S&H module's knobs and jacks work by pointer, keyboard and touch. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Every pinned template studioHash is unchanged: it adds node types, ports, capabilities, enum options or clip kinds only, never a parameter on an existing node type (D2, K022)."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/audio and src/js/studio and scripts/build and scripts/verify-dist.mjs and scripts/review-verdict.mjs and src/js/synth is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 4 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the line's figures stays within the cap Q023 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
