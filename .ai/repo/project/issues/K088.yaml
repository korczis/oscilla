title: "Instrument DSP worklet from embedded source, with an input sample and hold"
slug: instrument-dsp-worklet-from-embedded-source-with-an-input-sa
priority: p3
profile: implementation
objective: "Lands as feat(audio). First an ADR (instrument DSP in one AudioWorklet module bundled as embedded source and loaded from a data: URL like src/js/measurement/capture.js, an AudioWorkletNode per node instance created by the engine adapter with track() accounting, the same module run by the OfflineAudioContext, a 'needs AudioWorklet' degraded status where audioWorklet is absent). Then the host and a first processor: sample and hold of an input signal at a trigger, which replaces the Wave 1 seeded S&H label. Support per gate browser and origin is measured, not assumed. Before: no instrument DSP runs on the audio thread. After: one worklet host from embedded source, with an input S&H. User-value tier 4 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node type is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/audio"
  - "src/js/studio/adapters"
  - "src/js/studio/nodes"
  - "src/js/studio/registry.js"
  - "scripts"
