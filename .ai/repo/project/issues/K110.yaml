title: "Input monitoring, honest about its latency"
slug: input-monitoring-honest-about-its-latency
priority: p3
profile: implementation
objective: "Lands as feat(audio). Under Q024's answer (input monitoring is refused today: project.no-silent-feedback rejects a live input with an AUDIO path to the output), an armed audio track may monitor its input only through the rule version Q024 records: an explicit per-session confirmation that headphones are used, monitor gain starting at the floor, the estimated round-trip latency (input and output latency the browser reports, plus one render quantum) shown, never persisted to storage or the address. Before: a live input to the output is refused. After: monitoring under a confirmed rule version with its latency stated. User-value tier 4 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - ".ai/repo/rules/project"
  - "src/js/studio/validate.js"
  - "src/js/studio/compiler.js"
  - "src/js/audio"
  - "src/js/ui/synth"
  - "tests/unit/v31-studio-model.test.mjs"
  - "tests/unit/input-monitoring.test.mjs"
  - "tests/browser/arrange.cjs"
