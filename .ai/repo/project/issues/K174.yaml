acceptance_criteria:
  - "Fail-first: a unit test on the fake transport arms the Synth, stops the transport from outside it and asserts the Synth reads armed false and that Disarm (or Arm) acts on the first press; it fails on the merge base (project.fail-first)."
  - "Browser (tests/browser/synth.cjs, every gate browser): Arm in the Synth, Studio Stop, back to the Synth: the button reads Arm and pressing it arms."
