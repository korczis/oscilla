title: "The Synth's Arm button reads the transport, never a stale copy (retroactive review S1)"
slug: the-synths-arm-button-reads-the-transport
priority: p1
profile: implementation
objective: "Lands as fix(synth). The Arm/Disarm button binds `synth.armed`, a copy that `refresh()` (src/js/synth/ui.js) sets only on store changes, so a transport stop or disarm made outside the Synth (Studio Stop, a measurement run, a page hide) leaves it true; `disarm()` then returns early without resetting it and the button reads Disarm and does nothing. `armed` is derived from the transport (a transport state subscription, or the template reads it), and the early-return path of `disarm()` resets the copy. Found by the retroactive review of src/js/synth at 447bb27b (docs/reviews/synth-retroactive-447bb27b.md, S1; K060)."
why: "Owner decision K060 ('Retroactive review', 2026-11-03): an independent review of the shipped Synth code; S1 breaks project.studio-model-is-canonical (a second copy of state) and project.no-inert-surfaces (a control that does nothing)."
