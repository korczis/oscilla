depends_on:
  - "V510"
acceptance_criteria:
  - "The decision is recorded as an ADR 0058 note before any code: the owner's order quoted verbatim as its reason, oscilla-c3's agreement under Q090 named, and what the consent prompt asks and when."
  - "If decided yes: SysEx is requested only on its own explicit action (never on load, never with Connect MIDI); refusing it leaves every V501-V510 behaviour unchanged (tests/unit/midi/support.test.mjs, tests/browser/midi.cjs)."
  - "Every message sent is a derived fact measured on the owner's device and recorded with its evidence (scripts/midi tooling, docs/midi-devices.md); none is copied from the maker's files (project.midi-profiles-derived)."
  - "The display shows what the workspace's transport and selected control are, and clears when MIDI disconnects (tests on the stub's output)."
validation:
