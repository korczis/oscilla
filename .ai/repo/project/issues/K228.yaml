title: "The Follower module conditions its input: a band-pass ahead of the detector and a gate threshold"
slug: the-follower-module-conditions-its-input-band-pass-and-gate-threshold
priority: p3
profile: implementation
objective: "Lands as feat(synth). The panel's Follower module (K080) gets an input stage: a band-pass ahead of its detector, built from the existing filter node with type bandpass (src/js/audio/filters.js FILTER_TYPES) as a normalled edge, so it is a cable a user can see and break, with Centre and Width knobs (D11; Width shown as Q with its -3 dB band in Hz derived from the running rate), and a gate Threshold knob (a level in dB relative to the follower's input, stated as such) that the gate detector compares the envelope with. The pitch CV (the frequency-to-voltage conversion), the envelope and the gate stay K080's; this adds only what conditions the signal before them. No new node type: the band-pass is a filter node, and the threshold is a parameter of K080's follower type, which does not exist on main yet (origin/main 7637039e). It joins that type before the type ships in a release (land it with K080 or right after, in the same release); once the follower has shipped, a new parameter on it waits for an epoch (D2) and this issue is restated to say so. Before: the follower reads the whole band, so a drum loop or a voice with hiss gives a jittering pitch CV and gate. After: the user narrows the band and sets the threshold, and the card says what band and threshold apply. Rollback: revert the pull request; a document with the input stage keeps its filter node and edges, which play as ordinary nodes."
why: "Owner direction of 2026-11-09, relayed by the integrator oscilla-43: the owner sent screenshots of a semi-modular tablet instrument and asked that it be split into independent functional components on OSCILLA's own model, functional only (no trade dress or labels, project.visual-identity-lock). Its external-signal section has a band-pass and a frequency-to-voltage converter: K080 covers the converter (pitch CV), the envelope and the gate, not the band-pass or a threshold, so only those are filed here. Checked against origin/main 7637039e."
