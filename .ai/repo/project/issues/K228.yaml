acceptance_criteria:
  - "tests/unit/synth-follower-input.test.mjs, failing on the merge base: the Follower module's declaration normals a bandpass filter node ahead of the detector (a derived edge, never a stored flag), its Centre, Width and Threshold knobs are declared with their units, and every pinned template studioHash is unchanged (D2); the detector's pure kernel opens the gate on a frame whose level is above the threshold and not on one below it, for a threshold set by the knob; the -3 dB band the card states equals the biquad's response computed at the running rate (44.1 kHz and 48 kHz)."
  - "tests/browser/instrument-dsp.cjs renders offline a 440 Hz tone with a 4 kHz tone 6 dB louder: with the band centred at 440 Hz and narrowed, the follower's pitch CV reads A4 within K080's stated uncertainty, and with the band open it does not; a level 6 dB under the threshold opens no gate; no sample rate assumed."
  - "A browser check in tests/browser/synth.cjs (run by npm run test:synth): breaking the band-pass normal by a cable and restoring it by pointer, keyboard and touch changes what the follower reads at the same revision in the Studio graph and the panel; turning Threshold changes whether a stated input opens the gate within a named until() deadline of tests/browser/lib/wait.cjs; inside tests/browser/lib/suite.cjs; tests/browser/timing-baseline.json does not grow."
  - "Every edit is one undoable dispatch through the one Studio store (project.studio-model-is-canonical); a path from the microphone to the output stays refused (K080's live-input-to-output); the band and the threshold are labelled as what they are, a setpoint, never as a measurement (project.no-fake-science)."
  - "Every string it adds is Czech (project.czech-prose) and passes tests/unit/synth-wording.test.mjs; scripts/size-report.mjs shows at most 1 KB gzip added; a reviewer's verdict for the guarded paths (project.review-verdict); tests/README.md has a row for each new test; dist is rebuilt."
validation:
