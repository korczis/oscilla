id: G006
milestone: M085
serves:
- "component-system#embedded-cockpit"
title: "The embedded Studio's transport is the Studio transport strip, and its clip strip is the built and tested timeline miniature"
slug: the-embedded-studio-s-transport-is-the-studio-transport-stri
priority: p2
profile: implementation
objective: "Lands as fix(studio-ui). D1, U7, U9 and U12: three implementations of the Studio transport over one store (the toolbar, transport-bar.js, compact.js:97-109), the embedded one without Return, title or shortcut and with a text Loop; a clip strip without ruler, lanes, markers or loop while compact-timeline.js (V430: tracks, automation lanes, markers, loop, playhead) is imported only by a unit test. The embedded Studio mounts mountTransportBar(host, ctx, { ownFrame: true, hookPrefix: 'studio.compact' }) (a new option that keeps the hooks studio.compact.play, .stop and .loop that the live smoke and the suites read) and renderCompactTimeline() in place of its strip; its own buttons and clip strip code and their osc-sc-* selectors are deleted. The miniature is read-only today (V430, spec sections 127 and 129: a role=img projection whose clips are plain elements without a hook or an id), while the strip it replaces offers clip selection and CLIP_MOVE by drag and arrow keys, and tests/browser/live-smoke.cjs (guarded; it runs after every Pages deployment) asserts that the compact Studio's [data-osc=\"studio.compact.clip\"] elements, by data-clip-id, are the model's clips. So renderCompactTimeline gains an opt-in interactive mode used only by the embedded Studio: the root becomes role=group with the summary as its accessible name (an interactive child inside role=img is not allowed), each clip is a focusable element carrying data-osc studio.compact.clip, its data-clip-id and aria-current when selected, and selection (SELECTION_CHANGE) and CLIP_MOVE by drag and arrow keys keep working, with a visible hint ('Drag or use the arrow keys to move a clip') bound by aria-describedby; the read-only mode stays the default. The live smoke's compact check then passes unchanged against the built file, which this slice shows; if it cannot, the slice widens to tests/browser/live-smoke.cjs and needs a reviewer's verdict. The transport sits at a fixed position whatever the document title's length. Before: VERIFIED (inventory 3.2, U7, U9, U12; compact-timeline.js and live-smoke.cjs read 2026-10-29). After: one transport, a real miniature that keeps every operation and hook of the strip. Negative cases: a model with no tracks, a loop longer than the content, a playhead past the end, a refused CLIP_MOVE while playing (admit) stated, a clip of a deleted node. Rollback: revert; no model or record change."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
