acceptance_criteria:
- "tests/unit/studio-compact-mount.test.mjs fails on the merge base: compact.js defines no transport button and no clip strip of its own, it mounts transport-bar.js and compact-timeline.js, and the hooks studio.compact.play, .stop, .loop and .clip (with data-clip-id) are kept; the interactive miniature's root is role=group, the read-only one's role=img."
- "tests/browser/live-smoke.cjs is not changed and its compact Studio check passes against the built file (node tests/browser/live-smoke.cjs --url pointed at the built dist, served locally, the clip set equal to the model's; the output is in the pull request), so no verdict is needed; a change to it moves this slice to guarded."
- "No class token or selector is added: the miniature's eight osc-stc* names are already in the record (inventory 3.5, VERIFIED) and the deleted osc-sc-* selectors lower it."
- "Definition of done, extends: transport-bar.js (V418, already built for a shell that mounts the strip on its own) and compact-timeline.js (V430)."
- "Definition of done, interlinks: the embedded transport is the full Studio's commands (transport-commands.js), so Play in either is the same action."
- "Definition of done, interactivity: Return is added; markers, loop and automation lanes are drawn and the playhead moves from the transport's own clock."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md says what the embedded Studio shows and that clips move there. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'compact-transport' in tests/browser/v31-studio-graph.cjs plays, stops and returns by pointer, by keyboard (Enter on each) and by a hasTouch tap, and waits with until() (deadline 'compact transport state', 2 s) for aria-pressed and the time to match the full Studio's after each; Filter Automation shows its lane and Measurement Sweep its three markers. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
