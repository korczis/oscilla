title: Every new graph gesture patches the running graph to what a fresh compile builds
slug: every-new-graph-gesture-patches-the-running-graph-to-what-a
priority: p2
profile: implementation
objective: "P04 slice E (compile and playback). Lands as test(studio) with any fix it forces as fix(studio). For each gesture V611-V614 add (capture connect, insert, fan-out, duplicate, box mute) applied while the transport plays, tests/unit/studio-gesture-runtime.test.mjs checks on the recording mock context that the incremental patcher (V415) leaves the same runtime nodes and connections as a fresh compile of the resulting model, and tests/browser/v31-studio-runtime.cjs checks the audible effect offline: inserting a Gain of 0.5 lowers the render by 6.02 dB within 0.1 dB, fan-out to two Spectrum nodes feeds both, a muted box contributes nothing, and the engine node census is 0 after stop."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
scope:
- tests/unit/studio-gesture-runtime.test.mjs
- tests/browser/v31-studio-runtime.cjs
- src/js/studio/runtime.js
- src/js/studio/compiler.js
- tests/README.md
- dist
depends_on:
- V612
