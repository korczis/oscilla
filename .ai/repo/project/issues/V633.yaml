acceptance_criteria:
- "Before: VERIFIED: v31-studio-compiler.test.mjs proves refusal before Web Audio and that a failed transaction leaks nothing; INFERRED: the incremental patcher (V415) has not been checked against the gestures V612-V614 add, because they do not exist yet."
- "After: after each new gesture while playing, the patched runtime graph equals a fresh compile of the same model, and the offline render shows the intended audio effect."
- "Negative cases: a gesture refused by validation leaves the runtime revision and node set unchanged; a muted box contributes nothing to the render; the engine node census is 0 after stop following every gesture."
- "Rollback: revert the merge commit. Nothing changes the schema, a studioHash or a stored record, so documents saved while it was live load unchanged after the revert."
- A refused gesture leaves the runtime revision and node set unchanged; a gesture whose patch fails keeps the last valid graph and leaks nothing (the V415 contract).
- "src/js/studio is guarded: a fix carries a reviewer's verdict and a unit test that fails on the merge base."
- "Definition of done: extends tests/unit/v31-studio-compiler.test.mjs; cross-links the graph gestures to the runtime and the offline render; dynamics: the probe (V616) reads the expected level after each gesture; docs: docs/v31/compiler.md lists the gestures the patcher is proven for; tested: the browser check drives each gesture by pointer, keyboard and touch while playing and waits with until() (deadline 'runtime revision after <gesture>', 5 s); deployed with the next release."
- "Wave 1: it adds no class token, selector, markup surface or inline style, so the Flowbite Pro record does not change: node scripts/ui-flowbite-pro-record.mjs --check passes with no rewrite and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro); live drawing is on a canvas, a domain view."
validation:
- node --test tests/unit/studio-gesture-runtime.test.mjs
- node tests/browser/v31-studio-runtime.cjs --only gestures
- npm test
evidence_required:
- verified
