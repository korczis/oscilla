  - ".github/workflows/ci.yml"
  - "tests/unit/size-report.test.mjs"
  - "tests/README.md"
  - "docs/CLAIMS.yaml"
acceptance_criteria:
  - "The CI step summary of a pull request shows the four numbers; a unit test of the script checks the arithmetic and the output on fixtures."
  - "The workflow change keeps project.ci-bounded (bounded, pinned, retried) and carries a review verdict (.github is guarded)."
  - "docs/CLAIMS.yaml gains the guaranteed claim `dist-size-delta-reported` naming the source and the test that prove it, and the intent criterion this issue serves names that claim as its evidence in place of the command."
