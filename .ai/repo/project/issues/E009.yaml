profile: implementation
objective: "Make the CI build job print, for dist/index.html, the raw and gzip size, the headroom to the budget of scripts/build-config.mjs and the change from the merge base's build, as a step summary; a pull request that adds more than a stated threshold names where the bytes come from in its body (a review convention, not a gate)."
why: "Conversation 6ac1beb8, 2026-10-04T02:55:11Z and prompt 1 section 22; scripts/verify-dist.mjs prints the size against the budget but no delta."
scope:
