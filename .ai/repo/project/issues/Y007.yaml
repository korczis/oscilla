title: "Markers: pinned chart markers with live readouts, linked across the spectrum, density, spectrogram 2D and 3D and XY views"
slug: markers-pinned-chart-markers-with-live-readouts-linked-acros
priority: p2
profile: implementation
objective: "Lands as feat(charts). Enter on a focused plot surface, or the Pin button of the readout, pins a marker at the cursor (the order's 'probe'; the word stays the Studio probe tap's, V616); up to four markers per quantity, numbered 1-4 on the plot and in a Pro table under the card. A frequency marker is published on K053's cursor bus (link.js, keyed by quantity), so a marker pinned on the spectrum appears on the density layer, the 2D and 3D spectrogram and the mic spectrum at the same frequency, and K025's shared tuning cursor is one of its readers. Each marker row shows its live readout, rewritten at most 4 times a second through K053's live-readout.js with the 'live' and 'held' markers: frequency with the bin resolution K030 prints, level dB rel, and per view what it measures (density %, age and quantized level of the newest column, L/R at an XY point). Delete on a focused marker or its row's remove button removes it; Copy readouts copies the table as text with the provenance line. Markers are ephemeral view state: not in the StudioModel, not in history, not in the URL, cleared by Clear markers and by a change of the analysis axes, which the state note states. Merged plan of the component follow-up (2026-10-30): The pinned markers are view state held by the workspace that shows them and passed to markers.js, which is pure (add, remove, readout rows); the cursor bus carries them and holds none, so no chart module owns marker state."
why: "Owner orders of 2026-10-29 (session oscilla-b0, in Czech): add p5.js, WebGL and interactivity and deploy; plan WebGL renderers for the scrolling spectrogram (with a 3D option), a phosphor XY scope and a live spectrum, falling back to canvas/p5 when WebGL is unavailable, one frame loop with no per-frame allocation, the single file and its gzip budget, axes and units from the analysis (no-fake-science). Built on the M062 charts plan (#269, merged as cdda563c): the frame loop K036, the interaction kit K053, the shared zoom K052, the level history K033 and the chart-cost check of K036 are reused, never duplicated (components-followup/render-gl.md)."
