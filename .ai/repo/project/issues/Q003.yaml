title: "Owner decision: whether OSCILLA becomes a product, for whom and with which offer"
slug: owner-decision-whether-oscilla-becomes-a-product-for-whom-an
priority: p2
profile: routine
owner: "repository owner"
objective: "Answer the questions the conversations left open (conversation 6abf3077, 2026-10-02T04:18:12Z, 04:21:01Z, 04:30:50Z, 04:31:55Z; conversation 6ac1beb8, 2026-10-04T03:30:06Z): (1) Is there a product path at all, or is OSCILLA an open instrument and a proof of method? (2) If yes, who pays: teachers and schools, speaker developers, room tuning, audio engineering, labs and R&D, or another buyer? (3) Which offer: ChatGPT proposed a paid teaching pack on top of the free lab (guided experiments with goals and steps, teacher materials, student questions, ready configurations, worksheets); the measurement segments would need another offer. (4) Which pilot comes first, with whom, and what would show demand? Demand is unproven next to free browser tools and REW. (5) The licence consequence: the licence is MIT (LICENSE) and the intent does not reopen it, so anyone may resell the core and revenue could rest only on content, services or support; record whether that consequence is accepted. (6) What must exist before a first sale (terms, privacy notice, support contact, tax handling)?"
why: "No intent, milestone, ADR or record names a buyer, an offer or a pilot, and none may be invented (knowledge records product-landscape-and-the-pigments-path, positioning-candidates)."
current_state: "Decided on 2026-10-18 by the coordinating Claude session under the owner's delegation of 2026-10-18 ('tak to vse pores', resolve all of it, given to that session together with the approval to accept implemented ADRs, enable strict branch protection and upload new ChatGPT project instructions); the owner may override it. These are not the owner's own words. Decision: no commercial path now. (1) OSCILLA stays a free, open instrument and proof of method. (2) No buyer is chosen. (3) No offer is built; the teaching-pack idea stays a recorded idea, not planned work. (4) No pilot. (5) The MIT consequence is accepted: anyone may resell the core; the licence is not reopened. (6) Nothing is prepared for a first sale, because none is planned. The question is not asked again before a v4.0.0 release exists (docs/v4/completion-ledger.md: not ready for v4.0); after v4.0 it returns as a new intent, not as a reopening of this issue. Reasoning: the owner's v4 steering puts depth over breadth and requires the meta-layer to pay rent (ADR 0051), and commercial work would add accounts, a backend or analytics that README's privacy section and the single-file deliverable exclude; demand is unproven next to free tools and REW, and no record names a buyer; v4.0, the generation the owner steers, is not complete. P004 writes this as an ADR with status proposed. The committer records this as owner_decision evidence after the branch lands on main."
scope:
  - ".ai/repo/project/issues/Q003.yaml"
acceptance_criteria:
  - "The decision is recorded as evidence on this issue (covers owner_decision), either in the owner's words with date and source, or as a decision of a coordinating session under an owner delegation it quotes with its date, stating its reasoning and that the owner may override it; a worker without such a delegation never answers it."
  - "Each of the six questions has an answer or an explicit \"not now\", and question (5) records whether the MIT consequence is accepted; the licence itself is not reopened by this issue."
