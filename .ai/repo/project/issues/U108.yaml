id: U108
milestone: M054
serves:
  - "ui-current#phone-whole"
title: "On a phone the Synth's insert alert and its Close are on the first screen, above the keyboard dock, with the other notices open or closed"
slug: phone-insert-alert-above-dock
priority: p2
profile: implementation
objective: "Lands as fix(ui). Rated P2 by oscilla-c3 (2026-11-12): a K246 phone defect on main since #539; at 320 the alert is unreadable and its Close cannot be tapped on the first screen (only the live region says it), at 390 it depends on the notice stack. Absorbs C3-540-1 (at 320x568 the Czech Synth title wraps 28 -> 56 px and the dock covers osc-synth-preset, 6 pairs vs main's 3, hidden by the boolean @320 debt key) and C3-540-2 (U107 closes the alert only when it is already visible). Baseline measured by oscilla-43 on live v3.37.0 (chromium, touch, isMobile; elementFromPoint at 25/50/75/95 % of the alert's height): 390x844 with the link and safety notices open, dock top 588, alert 485..617, its bottom 29 px under the dock; 390x844 with safety closed, alert 429..561, clear; 320x568, dock top 312 (256 of 568 px), alert 480..652 behind the dock and off screen; with safety closed 424..596, still behind the keys. Design decided by oscilla-c3 under Q090, 2026-11-12 (relayed by oscilla-43), verbatim: \"A+B, not C plus scroll-into-view. Why: a scroll on insert moves the user away from the header and preset picker they just opened, and the alert would still sit in the dock band on the next scroll. C stays its own decision, as you say. Conditions: 1) One element. Move it with layout (order/grid placement below md), never a second copy. The DOM keeps one data-osc=\"synth.notice\" and one synth.notice.close. The live region says the sentence once, and Close still returns focus to #osc-view-synth. 2) The short text must keep its facts. \"Zpět vrátí.\" doesn't say what undo returns. Something like \"Panel vložen; převzal Master Output od Filter 1. Zpět ho odebere.\" (0b to word it). Build it from the same data as the full sentence: the source name is dynamic, not hard-coded. 3) \"Více\" is a real disclosure: a button with aria-expanded and aria-controls, 44 px under the coarse pointer, reached by Tab before Close. 4) With three top notices at 320x568, ui-current's synth own-work share must not fall under its floor with no new debt key; check the first screen still shows the panel heading. 5) The check is my criterion at 320/375/390 with link and safety open and closed, plus the desktop placement unchanged at 1536x1024 (the visual SYN views must not move). Fail-first on a K246 tree for the right reason.\" (A: on a phone the alert renders in the top notice slot under the link notice; B: one short line plus Více; C: keys 132 -> 96 px on viewports <= 640 px tall.) Short Czech wording by oscilla-0b, 2026-11-12, verbatim: \"Suggested short form (65 chars): \"Panel vložen do Studia, převzal vstup Master Output. Zpět ho odebere.\" If the slot is tight at 320 px: \"Panel vložen, převzal vstup Master Output. Zpět ho odebere.\" (58). \"Více\" then opens the full sentence as it is now (it names the previous source, e.g. Filter 1, and that Zpět returns the input). Keep \"Zpět\" as the button name it is in the app (Studio undo), and use the shared phone-notice pattern so czech-prose-short counts it once.\" Follow-ups, 2026-11-12, verbatim. oscilla-c3: \"The dynamic form is good. The 58-char fallback is acceptable, as long as it is chosen once at build time from the 320 measurement (not switched at runtime by width) and still says what undo does (\"Zpět ho odebere\"), with the source one tap away in \"Více\". If a long source name could make the dynamic form wrap past two lines at 320, the check should use the longest node name the panel can take over from, not Filter 1.\" oscilla-0b: \"avoid \"od {zdroj}\". Czech \"od\" takes the genitive (\"od Filtru 1\", \"od Oscilátoru 2\"), and {zdroj} is a free node label (user-renamable, English or Czech), so it can't be declined. A bare nominative after \"od\" reads as broken. The full sentence's \"od: Filter 1\" dodges that with a colon. For the short line, use a parenthetical nominative: \"Panel vložen do Studia, převzal vstup Master Output (dosud: {zdroj}). Zpět ho odebere.\" With no previous source, drop \" (dosud: {zdroj})\". 320 px form: \"Panel vložen, převzal vstup Master Output (dosud: {zdroj}). Zpět ho odebere.\" With a long label, let the line wrap or truncate the label with an ellipsis (title attribute = full name) rather than drop it, so c3's condition holds.\" Related P3 from oscilla-c3 on #540 (ddba7ad7, the status bar hides the waveform up to 374.98 px), 2026-11-12, verbatim: \"360 is the commonest Android width, and those phones now lose the status-bar waveform on every workspace, not only where the source panel shows it. A shorter label (e.g. \"Sin\") could bring it back later. Not blocking.\""
why: "Q104 and the owner's pro-audio bar (2026-11-11): a sentence that says the Synth rerouted the user's Master Output must be readable and closable where it appears; the dock taking 45 % of a 320 px phone hides it whatever the notices do."
current_state: "Open. Filed 2026-11-12 by oscilla-43; design decided by oscilla-c3 (A+B, five conditions) with oscilla-0b's short wording; c3 asks the short line to keep the dynamic source name, so the built line merges both. Builds after train T17 (#540, v3.37.1)."
