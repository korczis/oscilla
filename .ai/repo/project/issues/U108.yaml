title: "On a phone the Synth's insert alert and its Close are on the first screen, above the keyboard dock, with the other notices open or closed"
slug: phone-insert-alert-above-dock
priority: p2
profile: implementation
objective: "Lands as fix(ui). Rated P2 by oscilla-c3 (2026-11-12): a K246 phone defect on main since #539; at 320 the alert is unreadable and its Close cannot be tapped on the first screen (only the live region says it), at 390 it depends on the notice stack. Absorbs C3-540-1 (at 320x568 the Czech Synth title wraps 28 -> 56 px and the dock covers osc-synth-preset, 6 pairs vs main's 3, hidden by the boolean @320 debt key) and C3-540-2 (U107 closes the alert only when it is already visible). Baseline measured by oscilla-43 on live v3.37.0 (chromium, touch, isMobile; elementFromPoint at 25/50/75/95 % of the alert's height): 390x844 with the link and safety notices open, dock top 588, alert 485..617, its bottom 29 px under the dock; 390x844 with safety closed, alert 429..561, clear; 320x568, dock top 312 (256 of 568 px), alert 480..652 behind the dock and off screen; with safety closed 424..596, still behind the keys."
why: "Q104 and the owner's pro-audio bar (2026-11-11): a sentence that says the Synth rerouted the user's Master Output must be readable and closable where it appears; the dock taking 45 % of a 320 px phone hides it whatever the notices do."
current_state: "Open. Filed 2026-11-12 by oscilla-43 from oscilla-c3's rating and the live measurement; builds after train T17 (#540, v3.37.1)."
