objective: "Lands as feat(experiments). COMPARE_ROLES maps experiments to semantic roles (C draws in the purple that elsewhere means CALIBRATED, D in the warning orange at 1.73:1 in light) and i % 4 repeats colours from the fifth experiment on. A categorical COMPARE_SERIES in src/js/measurement/views/common.js, separate from the semantic roles and registered in K027's palette: A green (the reference, observed), B blue, C magenta, D orange at the K027 values; a warning span always carries hatching and a label, so D's hue never signals a warning alone; entries after D are neutral and rely on their direct label. A letter label at the right end of each curve. The compare list's legend becomes Pro toggle buttons (aria-pressed) with inline SVG swatches drawn from the descriptor's stroke, emphasis and dash (K054), SVG attributes and not inline styles; it removes the osc-m-swatch use of the compare list (index.html:2156 on main; the list itself is osc-x-entries, and the MEASURE legend osc-m-legend is F004's). Hovering an entry focuses its curve (focus.alpha 0.4); hiding a curve hides its reliable and unreliable parts together and a badge counts hidden curves; overlay, delta and IR overlay share cursor.sync and the zoom of K038."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
