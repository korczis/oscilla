acceptance_criteria:
  - "Unit tests that fail on the merge base: A-D are distinct and pass tests/unit/chart-palette.test.mjs in both themes; entry 5 and later are neutral and labelled; a hidden curve hides both its reliable and unreliable descriptors; each swatch equals its mark."
  - "tests/browser/v3-ui.cjs: a legend toggle hides both descriptors and the badge counts them; overlay and delta cursors and zoom stay in sync. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer's verdict (src/js/measurement and src/js/ui/experiments.js are guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3) and after F005 placed the card it sits in; no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "Every osc-* use it removes leaves the record in the same change: tests/unit/ui-flowbite-pro-baseline.json is rewritten by node scripts/ui-flowbite-pro-record.mjs (osc-m-swatch falls by the compare list's use, 3 to 2 (K027 already moved the swatch colours onto palette classes)), and a selector left without a producer is deleted from src/styles/measure.css (tests/unit/css-producers.test.mjs); the pull request states by how much the debt fell."
  - "A new Experiments compare scene in scripts/visual-measure.mjs (desktop and phone, darwin-arm64 and linux-x64, in each theme that has references); accepting it is part of the review."
  - "scripts/size-report.mjs shows at most 2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
