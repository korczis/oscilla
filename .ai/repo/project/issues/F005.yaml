objective: "Rebuild Experiments and Findings from Pro components: the definitions, saved experiments and findings lists as Pro tables (reference.md section 9) with status badges, row actions and the sticky footer where a list pages, the detail pane as a Pro card with a description list (the Read Sections block), the comparison and export actions as Pro buttons and dropdowns, and the empty states as the in-card variant of section 12 with the slot U003 fills with its real example. Every stored record keeps its provenance and quality labels. Remove the legacy selectors these views no longer use, lower the ratchet baseline, keep every data-osc hook and id."
