objective: "Rebuild Experiments and Findings from Pro components: the definitions, saved experiments and findings lists as Pro tables (reference.md section 9) with status badges, row actions and the sticky footer where a list pages, the detail pane as a Pro card with a description list (the Read Sections block), the comparison and export actions as Pro buttons and dropdowns, the five dialogs (osc-dlg-exp-rename, osc-dlg-def and osc-dlg-exp-delete from src/js/ui/experiments.js; osc-dlg-finding and osc-dlg-finding-delete from src/js/ui/findings.js) on the Pro modal pattern F010 lands with their rows of its dialog table turned on, the deletes as its confirm variant, and the empty states as the in-card variant of section 12 with the slot U003 fills with its real example. Every stored record keeps its provenance and quality labels. Remove the legacy primitives and selectors these views no longer use, lower the ratchet baseline by the surfaces migrated and the primitive uses removed, keep every data-osc hook and id."
why: "Owner, 2026-10-28: the whole interface on Flowbite Pro. The audit (A03, A04) found these views two thirds empty; U003 fills them on this markup."
