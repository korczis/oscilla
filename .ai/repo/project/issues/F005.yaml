acceptance_criteria:
  - "ui-flowbite-pro.cjs asserts the Experiments and Findings views are Pro tables and cards with every surface listed as migrated by the ratchet at both sizes, in every gate browser from file:// and the sub-path, with an empty store and with saved records; the five dialogs carry the Pro modal structure with focus entry, Escape, focus return and an inert background."
  - "npm run test:measure (v3-ui) passes with no behaviour check changed; no record is created before the person acts."
  - "The references of the views changed are updated or added through the visual gate with the reason; the ratchet baseline's debt is lower (the surfaces migrated move from surfaces.pending to surfaces.migrated and the primitive uses removed leave the counts); dist's size is stated and within BUDGET."
  - "The pull request carries a review verdict (src/js/ui/experiments.js, findings.js and src/js/measurement are guarded)."
