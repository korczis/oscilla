- src/js/ui/studio/inspector.js
- src/js/ui/studio/inspector-multi.js
- src/js/studio/actions.js
- tests/unit/studio-multi-edit.test.mjs
- tests/browser/v31-studio-graph.cjs
- tests/unit/source-size-baseline.json
