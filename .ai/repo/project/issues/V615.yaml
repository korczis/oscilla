title: "Multi-selection edits: one change sets a shared parameter on every selected box"
slug: multi-selection-edits-one-change-sets-a-shared-parameter-on
priority: p2
profile: implementation
objective: "P04 slice D (editing and undo invariants). Lands as feat(studio-ui), in the Inspector module E004 creates for the multi view. The multi-selection Inspector lists the parameters the selected nodes share (same node type, or the same parameter id with the same unit and kind) with the common value or 'mixed'; an edit sets every selected node's value in one NODE_PARAM_SET batch and one history entry; a value a node refuses (out of its range) refuses the whole batch with the node's reason. Chrome is Pro form inputs."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings S1-S14 measured on origin/main b67d1e58)."
