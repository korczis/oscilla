objective: "Lands as fix(navigation). Moved out of C037 by af's critique of 96daa67b (BLOCKING 5: 'move the replaceState part to a URL-state issue'). Line numbers at origin/main a19f1ff6. Besides the dispatcher (src/js/ui/navigation.js:296, :415), four sites write the address themselves: src/js/core/instrument.js:1063, src/js/ui/measure/input.js:78, src/js/ui/measure/run.js:272 and src/js/ui/studio/workspace/navigation.js:178, so a link the user copies can name state the dispatcher never saw and Back/Forward can skip it (ADR 0045, one dispatcher). After: each of the four asks the dispatcher (its replace or push entry) with the key it owns; navigation.js is the only caller of history.replaceState and pushState."
