id: E010
milestone: M046
serves:
  - "engineering-integrity#flake-ledger"
title: "A ledger of CI checks that passed only on a re-run"
slug: a-ledger-of-ci-checks-that-passed-only-on-retry
priority: p2
profile: implementation
objective: "No browser suite or check is retried inside the harness today (tests/browser/lib/suite.cjs has no retry; .github/workflows/ci.yml retries only apt and the browser download), and adding one would hide failures and change project.suite-harness. So the ledger records re-runs: when a job runs with github.run_attempt above 1, a step reads the earlier attempts' job and step results of the same run from the GitHub API (permission actions: read, bounded and retried under project.ci-bounded) and records, for every check that failed on an earlier attempt and passed now, the check, the browser, both attempts' outcomes and a cause class (product, browser, infrastructure, test defect; unclassified until a person classifies it) in a CI artifact and the step summary. The ledger feeds one decision: whether a flaky check is fixed in the product, in the test, or recorded as infrastructure, against the recorded debt of tests/browser/timing-baseline.json."
why: "Conversation 6ac3ead5, 2026-10-05T18:32:06Z, sections 10 and 15.4. A re-run is the only way a check passes on retry today (critique engineering-integrity, flake-ledger-has-no-retry-to-record)."
scope:
  - "scripts/flake-ledger.mjs"
  - ".github/workflows/ci.yml"
  - "tests/unit/flake-ledger.test.mjs"
  - "tests/README.md"
depends_on:
  - "E009"
acceptance_criteria:
  - "Given fixture API responses of a run whose first attempt failed a suite and whose second passed it, the script writes a ledger entry with both outcomes; given a first attempt, it writes nothing; tests/unit/flake-ledger.test.mjs proves both and fails on the merge base."
  - "No retry is added to tests/browser/lib; project.bounded-test-timing and project.suite-harness hold; the workflow change keeps project.ci-bounded and carries a review verdict (.github is guarded)."
  - "It follows E009 because both change .github/workflows/ci.yml."
  - "tests/README.md has a row for the test (one appended row)."
  - "E015 registers the claim; this issue does not edit docs/CLAIMS.yaml or the intent."
validation:
  - "npm test"
evidence_required:
  - "verified"
