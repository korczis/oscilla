id: C053
milestone: M090
serves:
  - "coherent-state#one-output-owner"
  - "coherent-state#stops-are-immediate"
title: "The playback bus, slice 5: every refusal speaks the owner table's sentence, and one leave-workspace policy says what keeps sounding"
slug: bus-refusal-text-and-leave-workspace-policy
priority: p1
profile: implementation
objective: "Lands as fix(bus). Split from C037 by af's critique of 96daa67b (BLOCKING 5), and the coverage gap 'the leave-workspace policy and the acceptance of ADR 0063 have no issue'. Line numbers at origin/main a19f1ff6. Refusal sentences are written where they are raised: the riff audition's own text (src/js/studio/riffs/audition.js:72-81, 'A measurement is running: the riff plays after it.'), the MIDI refusal (src/js/midi/ui.js:51-57 ownedBy and its refused), and the output owner's notices (src/js/ui/output-owner.js). What happens to sound when the user leaves a workspace is decided per site: a measurement aborts (src/js/main.js:739-742), an armed-only Synth run disarms on leaving the Studio (src/js/synth/studio-sink.js:78-83), the lab microphone is not released (C040), and the instrument, the sequencer and the Studio transport keep sounding with no stated rule. After: every refusal the bus raises is the sentence of the refusing owner's row in C036's table (no copy at the raise site), and the bus holds one leave-workspace policy, a row per owner (keep, stop or disarm, with the sentence the status bar shows), applied on every workspace change; ADR 0063's open questions are answered in its resolution notes from what C002 (Q-a, newest action wins) and C018 (Q-b, presets and History) decided, and its status is left to the owner (.ai/repo/adrs/README.md says which ADRs the owner accepted)."
why: "af's critique of 96daa67b (BLOCKING 5 'refusal text plus the leave policy'; coverage gap 'every screen reviewed: the leave-workspace policy and the acceptance of ADR 0063 have no issue'). ADR 0063 (proposed, 2026-10-29) carries two open questions for the owner."
scope:
  - "src/js/core/output-bus.js"
  - "src/js/ui/output-owner.js"
  - "src/js/studio/riffs/audition.js"
  - "src/js/midi/ui.js"
  - "src/js/synth/studio-sink.js"
  - "src/js/main.js"
  - ".ai/repo/adrs/0063-one-output-owner-at-a-time-views-name-the-class-of-what-they-show-save-paths-state-their-scope.md"
  - "tests/unit/leave-policy.test.mjs"
  - "tests/browser/navigation.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "C050"
  - "C051"
acceptance_criteria:
  - "Fail-first, on seams of the merge base: tests/unit/leave-policy.test.mjs scans src/js for refusal sentences of the owners (a measurement, a reference capture, the Studio, the sequencer) outside src/js/ui/output-owner.js and fails naming audition.js:79 and the midi/ui.js copy; it also asserts that leaving the Playground while the instrument sounds applies a declared row, and fails on the merge base because no row exists."
  - "The leave policy is one table with a row per owner (instrument, sequencer, studio, synth, notes, audition, measure, reference, the lab microphone of C040); a workspace change applies it in the same event, and a mutation that removes a row or adds a leave handler outside the bus fails."
  - "tests/browser/navigation.cjs leaves each workspace while its owner sounds and asserts the row's effect and the status-bar sentence, with until() deadlines through the suite harness, in Chromium, Firefox and WebKit; tests/browser/touch-audio.cjs passes."
  - "ADR 0063's resolution notes name C002 for Q-a and C018 for Q-b with their evidence; its status stays proposed unless the owner accepts it (no Q id is minted here)."
  - "Guarded paths marked: src/js/studio/* and src/js/synth/* (v2, prismatic-majordomus-98); one lane owns src/js/midi/* while K178 is open; the rest is judged by the screens seat once R031 lands. Lane: dev-53."
validation:
  - "node --test tests/unit/leave-policy.test.mjs"
  - "node tests/browser/navigation.cjs"
  - "node tests/browser/touch-audio.cjs"
  - "npm test"
evidence_required:
  - "verified"
