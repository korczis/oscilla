objective: "Lands as refactor(charts), the entry slice of M062 and the first chart-line change to src/js/main.js: once F001, #266 and #261 land, main.js is at about 39 894 of its 40 000 B cap (tests/unit/source-size-baseline.json), so no other chart slice may add an import there first. src/js/charts/wire.js takes the chart theme and visibility wiring out of main.js. src/js/charts/motion-policy.js is the one matchMedia('(prefers-reduced-motion: reduce)') source and replaces the copies in main.js, src/js/visualization/p5-host.js, src/js/ui/studio/graph-dom.js and src/js/ui/app.js (line 313 on main): chrome fades at most 120 ms and zoom easing at most 150 ms, instant under reduce; data is never eased. It adds no markup, so it waits on no F issue."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
