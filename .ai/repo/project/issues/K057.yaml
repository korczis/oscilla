acceptance_criteria:
  - "tests/unit/studio-transport-tick.test.mjs: the tick subscribes as essential while the transport plays and unsubscribes on stop; with frames paused it still advances the time readout; it requests no rAF of its own."
  - "tests/browser/chart-cost.cjs: while the Studio transport plays, with and without Pause animation, at most one rAF chain is armed and studio.time advances; the Studio tick check passes and is no longer pending. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Its paths are not guarded (scripts/review-verdict.mjs GUARDED); as a perf change it is outside project.fail-first and still adds the tests above."
  - "Every file stays under its cap in tests/unit/source-size-baseline.json."
  - "No visual reference moves."
  - "scripts/size-report.mjs shows at most 0.5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
