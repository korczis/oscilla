title: "The Studio transport tick runs on the shared frame loop as an essential subscriber"
slug: the-studio-transport-tick-runs-on-the-shared-frame-loop-as-a
priority: p2
profile: implementation
objective: "Lands as perf(studio-ui), after E003, which splits src/js/ui/studio/workspace.js into modules under src/js/ui/studio/workspace/ (the precedent of E024: the change is made in whichever module the split leaves the transport in). The tick at workspace.js:661-681 on main re-arms its own requestAnimationFrame for as long as the transport plays; it becomes an essential frame-loop subscriber (K036) registered with both hosts that show the position, the Studio pane and the compact widget, so it runs while either is rendered and the transport plays, so Pause animation never freezes studio.time or the compact playhead while audio plays, and at most one rAF chain is armed while the Studio plays. It removes the Studio tick's pending entry from tests/browser/chart-cost-baseline.json. It adds no markup and changes no behaviour a user sees."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
