title: "The live Lissajous figure marks when it is drawn from too few samples per cycle"
slug: the-live-lissajous-figure-marks-when-it-is-drawn-from-too-fe
priority: p3
profile: implementation
objective: "Truth-table rows STP-09 (scratchpad p05/truth-table.md). Vertex generation moves to a pure lissajous-path module. Below a threshold derived from the chord error cos(π f / sr) and a declared tolerance of one plot pixel, the samples are drawn as dots with \"sampled: N.N samples/cycle at <sr> Hz\" (K034 labels the L and R axes)."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): At 18 kHz on a 48 kHz context each sample advances the phase by 135°, and joining samples with straight lines draws an octagram {8/3} instead of the quadrature circle; chord midpoints sit at radius cos(π f / fs) = 0.383. The correlation (0.00) stays right. The chart has no axis labels."
