acceptance_criteria:
  - "Fail-first fixture: tests/unit/readout-states-lissajous.test.mjs, fixture F4 (18 kHz quadrature at 48 kHz): the path reports the undersampled state and its label; fails on the merge base (no state, minimum chord radius 0.383)."
  - "Negative cases, each asserted: 440 Hz quadrature draws a polyline circle with no state; the threshold sits where cos(π f / sr) meets the declared pixel tolerance at both 44.1 and 48 kHz; the model figure is unchanged."
  - "Revertible on its own: Revert: drawing mode and labels."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
