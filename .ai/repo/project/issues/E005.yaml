title: "Assemble src/index.html from partials at build time"
slug: assemble-src-index-html-from-partials-at-build-time
priority: p2
profile: implementation
objective: "Split src/index.html (255 020 bytes on main at 044f98a, 255 382 at d4bd97f, where #197 merged; measure again at the start commit) into build-time partials under src/partials/ (one file per workspace and per dialog) that scripts/build.mjs concatenates in a fixed order; the output stays one file and is byte-identical to the build before the split. Every test and script that reads the shell (tests/unit/no-fake-science, about, css-producers, navigation, vocabulary, v3-ui, v4-shortcuts, v31-studio-self-knowledge, raw-retention, release-provenance and others; scripts/build-config.mjs, visual-compare.mjs, social-assets.mjs, pack-single-file.mjs) reads it through one shared reader of the assembled shell, never a single partial. Once this lands, issues that change shell markup name src/partials in place of src/index.html. If the owner has by then made src/index.html a guarded path (a follow-up question of #197), the guard moves to src/partials in the same change. It follows E002 and E004 because it rewrites every reader of the shell, including tests those splits change, and rebuilds dist; its source scope is the shell (src/index.html, src/partials) and the scripts, not the rest of src."
why: "Conversation 6ac1beb8, 2026-10-04T02:55:11Z and prompt 1 section 19 (218 kB then, 255 kB now)."
scope:
  - "src/index.html"
  - "src/partials"
  - "scripts"
  - "tests/unit"
  - "tests/README.md"
  - "dist"
depends_on:
  - "E001"
