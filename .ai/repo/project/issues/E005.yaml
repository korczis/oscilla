  - "E004"
acceptance_criteria:
  - "npm run build produces a dist/index.html byte-identical to the one built from the unsplit source at the same commit, and npm run build:check passes."
  - "tests/unit/shell-partials.test.mjs fails when a partial is missing or included twice, and fails when a test or script under tests/unit or scripts reads src/index.html directly instead of the shared reader; it fails on the merge base (no src/partials) and passes on the head."
  - "tests/unit/no-fake-science.test.mjs and every other reader of the shell still pass through the shared reader."
  - "Each partial is under 40 000 bytes, and src/index.html's cap in tests/unit/source-size-baseline.json is lowered or removed."
  - "The pull request carries a reviewer's verdict: scripts/build.mjs matches the guarded scripts/build* (project.review-verdict)."
  - "tests/README.md has a row for the new test (one appended row)."
  - "E015 registers the claim; this issue does not edit docs/CLAIMS.yaml or the intent."
