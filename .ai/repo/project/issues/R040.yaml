objective: "Lands as fix(verify-dist). Hardening S2, first half (P1, latent). At main 68b117f3 FORBIDDEN_JS in scripts/verify-dist.mjs (:56) misses five forms, each of which survived with rc=0: createElement('script').src = 'https://...', new Image().src = ..., new Audio(url), insertAdjacentHTML('<img src=https://...>') and a computed window['fe'+'tch']. Vendor scripts are exempt, and the p5@1.11.3 bytes carry an i18next HTTP backend loadPath on cdn.jsdelivr.net that is dead only because nothing calls its initialize() (inferred). Today's dist is clean. After: FORBIDDEN_JS catches first-party assignments of absolute http(s) URLs to .src, .href and srcset, absolute URLs passed to new Image, Audio or Video, absolute URLs inside HTML strings, and computed member access to fetch; a vendor test asserts each known network string in the vendor bytes stays unreachable from first-party code."
why: "oscilla-b0's hardening audit of origin/main 68b117f3 (v3.19.0), synthesis S2 (no existing plan coverage). Contract: project.single-file-deliverable v2."
