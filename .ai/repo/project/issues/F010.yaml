title: "Dialogs, settings, menus, toasts and the status bar on Pro components"
slug: dialogs-settings-menus-toasts-and-the-status-bar-on-pro-comp
priority: p2
profile: implementation
objective: "Land the Pro modal pattern once for every dialog, and rebuild the six shared dialogs on it: save preset (osc-dlg-save), headphones (osc-dlg-headphones), copy link (osc-dlg-copy), help (osc-dlg-help), microphone (osc-dlg-mic) and settings (osc-dlg-settings), opened through src/js/ui/dialogs.js and app.js. The pattern is the Pro modal markup of reference.md section 11 (header with title and close button, body, footer with the Pro primary and secondary buttons; the confirm variant for destructive actions) on the native <dialog> elements OSCILLA already uses, so the browser's focus trap, inert background and Escape keep working; Flowbite's modal script is not used for any dialog. tests/browser/ui-flowbite-pro.cjs gains a dialog table that lists all 22 <dialog> elements of the shell with the issue that owns each: F010 the six above; F004 osc-dlg-level-cal, osc-dlg-cal-convention and osc-dlg-recipe-link (src/js/ui/measure.js); F005 osc-dlg-exp-rename, osc-dlg-def, osc-dlg-exp-delete (src/js/ui/experiments.js), osc-dlg-finding and osc-dlg-finding-delete (src/js/ui/findings.js); F008 osc-dlg-studio-templates, -link, -add, -connect, -find, -render, -library and -patch (src/js/ui/studio/workspace.js). The table fails when the shell holds a <dialog> it does not list; from this issue on it checks focus entry, Escape, focus return and the inert background for every listed dialog (the native dialogs hold them today), and it asserts the Pro modal structure for every dialog the ratchet lists as migrated, so each owning issue turns its rows on. Settings become Pro form sections with toggles (the 2.x peer pattern) and selects; the context and overflow menus outside the Studio Pro dropdowns; transient messages Pro toasts with role=status; the status bar a Pro footer bar; the unsaved-work indicators Pro badges (the leave-page prompt is the browser's own beforeunload and stays). The headphones prompt's decision stays in src/js/core/safety.js and the stored settings in src/js/core/storage*, both guarded and both unchanged by this issue. Remove the legacy primitives and selectors these no longer use (osc-menu and its kin; the shared osc-dialog selectors leave with the last dialog that uses them, at the latest in F012), lower the ratchet baseline by the surfaces migrated and the primitive uses removed, keep every data-osc hook and id."
why: "Owner, 2026-10-28: the whole interface on Flowbite Pro; dialogs are shared by every workspace and carry the safety prompts (headphones), so they land once for all."
