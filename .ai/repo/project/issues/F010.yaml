acceptance_criteria:
  - "ui-flowbite-pro.cjs's dialog table lists all 22 dialogs with their owning issue (F004, F005, F008, F010) and fails, with a fixture case, on a <dialog> it does not list; it opens every dialog and asserts that focus moves into it, that Escape closes it and focus returns to the opener, and that the background is inert, and asserts the Pro modal structure for F010's six, in every gate browser from file:// and the sub-path."
  - "The pull request changes no guarded path: src/js/core/safety* (the headphones prompt's decision) and src/js/core/storage* (the stored settings) stay as they are. A change that must touch one widens the scope to it and carries a reviewer's verdict (project.review-verdict)."
  - "The headphones safety prompt still appears before any output that requires it; qa-regressions.cjs and no-inert-surfaces pass."
  - "The references of the changed views are updated through the visual gate with the reason; the ratchet baseline's debt is lower (the surfaces migrated move from surfaces.pending to surfaces.migrated and the primitive uses removed leave the counts); dist's size is stated and within BUDGET."
  - "The class tokens tests/browser/live-smoke.cjs reads after every Pages deploy (.osc-statusbar .osc-sb-name, .osc-sb-version, .osc-sg-node, .osc-sg-title, .osc-sg-cat, .osc-sg-edge-line, .osc-block-name, .osc-stl-hrow--track) stay on their elements, unstyled if need be, until F011 moves the smoke to data-osc hooks; the smoke passes against the built file."
