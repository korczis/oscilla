title: "LFO at audio rate, clamped at 0.95 x Nyquist"
slug: lfo-at-audio-rate-clamped-at-0-95-x-nyquist
priority: p1
profile: implementation
objective: "Lands as feat(studio). The LFO rate stops at 100 Hz (modulation.js:21), so Playground AM and FM voices with an audio-rate modulator do not validate. Widen the range to 0.95 x Nyquist, clamped through hooks.clampFrequency, in src/js/studio/nodes/modulation.js and the LFO adapter (its file after K005). A wider range on an existing parameter leaves every pinned hash unchanged. This removes the LFO obstacle of V605 (D10: M048 then narrows V605 to depend on E003 only)."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
scope:
  - "src/js/studio/nodes/modulation.js"
  - "src/js/studio/adapters"
  - "src/js/studio/playground-voice.js"
  - "tests/unit/studio-lfo-audio-rate.test.mjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K005"
acceptance_criteria:
  - "Pinned template hashes are unchanged."
  - "Playground AM and FM voice models with a 2 kHz modulator validate."
  - "An LFO at 440 Hz into an oscillator frequency on a log edge renders offline sidebands at fc +- 440 Hz, in a unit test that fails on the merge base."
  - "A rate above the clamp is clamped and stated, not silent (project.audio-engine-discipline)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first). It adds no markup, osc-* class token or stylesheet selector, so the Flowbite Pro ratchet stays flat (node --test tests/unit/ui-flowbite-pro.test.mjs). A capped file it grows past its cap is split first or its raise is declared in tests/unit/source-size-baseline.json's raises ledger."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/studio-lfo-audio-rate.test.mjs"
  - "node --test tests/unit/v31-studio-templates.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
