title: "LFO at audio rate, clamped at 0.95 x Nyquist"
slug: lfo-at-audio-rate-clamped-at-0-95-x-nyquist
priority: p1
profile: implementation
objective: "Lands as feat(studio). The LFO rate stops at 100 Hz (modulation.js:21), so Playground AM and FM voices with an audio-rate modulator do not validate. Widen the range to 0.95 x Nyquist, clamped through hooks.clampFrequency, in src/js/studio/nodes/modulation.js and the LFO adapter (its file after K005). A wider range on an existing parameter leaves every pinned hash unchanged. This removes the LFO obstacle of V605, which therefore depends on K010 (D10 as restated in the intent); V605's dependency on V604 stays until E003 names its modules (M048)."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
scope:
  - "src/js/studio/nodes/modulation.js"
  - "src/js/studio/adapters"
  - "src/js/studio/playground-voice.js"
  - "tests/unit/k010-k013-studio-voice-nodes.test.mjs"
  - "tests/unit/v31-studio-signal-path.test.mjs"
