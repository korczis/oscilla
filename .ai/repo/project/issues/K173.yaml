id: K173
milestone: M061
serves:
  - "playable-instrument#held-notes-safe"
title: "A note pressed twice across a re-route releases on both nodes it reached"
slug: a-note-pressed-twice-across-a-re-route-releases-on-both-nodes
priority: p2
profile: implementation
objective: "Lands as fix(keys). src/js/synth/studio-sink.js keeps held notes as a Map from note to the node id it went to (held.set(note, n.id), line 52 at 15d1bc67). When the same note is pressed again after the route changed (a second key source, MIDI and the on-screen keys, or a re-route between the presses), the second press overwrites the first node's id, and the first node never receives its note-off: the note hangs (prismatic-majordomus-98, review of #410 at 00108c87, R6). Hold a set of nodes per note, or count presses per node, so every note-on is matched by a note-off on the node that took it."
why: "project.no-silent-feedback and the held-notes-safe criterion: a note that cannot be released is the failure the instrument must never have."
scope:
  - "src/js/synth/studio-sink.js"
  - "tests/unit/"
current_state: "Landed in part by train 5 #413 (68b117f3, fix/studio-keyboard 2124f226: \"the same note pressed on another node first releases the old one (covers K173)\"). Criteria audit by oscilla-0b on origin/main 04d33aaf (2026-11-11): 1 of 2 met. Met: the unit behaviour, tests/unit/studio-sink.test.mjs:101 (\"a note pressed again on another node releases it on the first one\"; 10/10 pass): A gets its note-off at the second press, B at the release, one each; the test releases once, not twice as the criterion words it. Unmet: no browser check in tests/browser/midi.cjs proves that no voice is left sounding after the press, re-route, press, release sequence in chromium, firefox and webkit. That check is what is left before the stamp. The missing check is midi-seam-reroute in tests/browser/midi.cjs (test/k173-midi-reroute, oscilla-0b, 2026-11-11): all six legs pass, and it fails with the sink's re-press release removed. The stamp follows its landing. Done on 2026-11-11 on main 98e5a5ba (T12 #535 landed the check): both criteria met (evidence below)."
depends_on: []
