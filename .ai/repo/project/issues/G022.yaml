title: "One knob: the synth-theme core is the knob everywhere, the shipped view knob becomes its parameters"
slug: one-knob-the-synth-theme-core-everywhere
priority: p2
profile: implementation
objective: "Lands as refactor(ui). The knob's one implementation is the synth-theme core 98 builds and F013 W1b adopts (src/js/ui/synth/knob.js with feel.js: model, drawing, ARIA, feel); src/js/synth/view/knob.js stops being a second model and either disappears or keeps only the Synth face's parameters for the core. Any other knob in the app (the Studio Inspector's, a lab's, the landing's) renders through the same core with the Pro skin as a parameter. Coordinated with 98 and dev-53 (W1b) so no third knob is built (b0, 2026-11-04). Closes review finding S11 for good."
why: "Owner order of 2026-11-04 (M123): every control family unified, parametrized, reused, no parallel implementations."
scope:
  - "src/js/ui/synth"
  - "src/js/synth/view"
  - "src/js/ui/studio"
  - "src/js/ui/catalog"
  - "tests"
  - "dist"
depends_on:
  - "G021"
acceptance_criteria:
  - "The family has one implementing module, named in its catalogue declarations; its G021 baseline entries leave and the census passes with them gone (fail-first: the census fails on the merge base with the entries removed)."
  - "Every place the family appears renders through that module with its parameters (skin, size, range, labels); no behaviour, key binding or ARIA of any place changes except where the PR lists it with its reason; the visual references change only where the PR re-accepts them with the reason."
  - "Every gate browser, file:// and the /oscilla/ sub-path; the affected browser suites pass; a non-builder's verdict where a guarded path changes (project.review-verdict v2)."
validation:
  - "node --test tests/unit/ui-families.test.mjs"
  - "npm test"
  - "npm run test:browser"
evidence_required:
  - "verified"
