id: K103
milestone: M064
serves:
  - "connected-instrument#synth-panel"
  - "connected-instrument#one-transport"
title: "Gates along TRIGGER edges from any gate or trigger output, live and scheduled, with one ownership rule"
slug: gates-along-trigger-edges-from-any-gate-or-trigger-output-li
priority: p1
profile: implementation
objective: "Lands as feat(studio). Today only a pattern clip's source port 'trigger' gates Envelopes and clocks Random and Step Modulator (transport.js triggerEnvelopes and triggerClocks), event clips gate only Envelopes (clip-targets.js), and the live note router has no trigger fan-out. This slice makes one fan-out, shared by the transport and the note router (src/js/studio/live-notes.js), from any TRIGGER output port (keys gate, clock, sequence trigger, drum and follower gates) to every TRIGGER input it reaches (envelope and contour gates, random and step-modulator clocks, drum triggers), on the audio clock, and one ownership rule: while the transport plays, a gate input reached from a clip-driven source is owned by the timeline and a live gate on it is refused with a stated reason; while stopped, live gates own it. It builds on K023's Clock node and trigger event clips. Before: only a pattern clip's 'trigger' port gates Envelopes, and nothing live fans out. After: any gate or trigger output gates what it reaches, live and scheduled, with one ownership rule. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; TRIGGER edges stay valid model data that gate only through the old path. Amended 2026-11-03 after the M064 audit and the owner's decisions (oscilla-b0's AskUserQuestion): the router is src/js/studio/live-notes.js, whose live fan-out from keys and XY pad gates landed through #329, the browser check runs through tests/browser/synth.cjs under npm run test:studio, and src/js/synth is guarded once review-verdict v2 lands with Train 4, while the shared fan-out, the clock, sequence, drum and follower sources, the contour targets and the ownership rule stay criteria."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
current_state: "#329 added 23 381 B gzip (scripts/size-report.mjs, from its merge base) across its plan ids K058, K059 (part), K060, K061, K062, K063, K065, K066 (part), K103 (part), K104 and K106 (part); the figure is not split per issue. Q023 (answered by the owner on 2026-10-31: no line cap) sets no line cap, only the global gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29), and the aggregate is within it (dist/index.html 866 334 B gzip -9 at the head of #329); Q023 keeps each slice's own stated ceiling in force, so the per-issue cap is not proven for what shipped and applies to the remaining builds."
