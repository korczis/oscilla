acceptance_criteria:
  - "tests/unit/studio-trigger-fanout.test.mjs, failing on the merge base: a keys gate edge gates a contour and an envelope at the scheduled frame (StudioFakeContext); a clock edge steps a random node; a muted TRIGGER edge gates nothing; a live gate on a timeline-owned input while playing is refused with its reason and gates nothing; the old pattern-clip path keeps every existing test green."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a muted TRIGGER edge; a live gate on a timeline-owned input while playing (refused with its reason); a trigger into a node without a trigger input (refused by canConnect)."
  - "A browser check in tests/browser/synth.cjs (or a new suite added to the test:studio script of package.json), run by npm run test:studio (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a keys gate patched to an envelope in the Studio graph opens that envelope from the Synth piano and from a timeline clip, as the Studio graph shows. Real-time: a live note opens the envelope (runtime gate state in debugInfo), each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the gate edge is made by pointer, keyboard (connection dialog) and touch, and the refusal sentence is in the polite live region. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Each pull request of the slice carries a reviewer's verdict (src/js/studio is guarded, and src/js/synth once review-verdict v2 has landed with Train 4; project.review-verdict): .ai/repo/reviews/329.yaml and .ai/repo/reviews/367.yaml for the live fan-out that landed through #329 and #367, a new one for the remaining criteria; and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test (tests/unit/synth-live-notes.test.mjs in the synth-* unit row, tests/unit/studio-trigger-fanout.test.mjs its own); dist is rebuilt and npm run build:check passes."
validation:
