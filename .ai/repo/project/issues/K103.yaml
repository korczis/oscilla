id: K103
milestone: M064
serves:
  - "connected-instrument#synth-panel"
  - "connected-instrument#one-transport"
title: "Gates along TRIGGER edges from any gate or trigger output, live and scheduled, with one ownership rule"
slug: gates-along-trigger-edges-from-any-gate-or-trigger-output-li
priority: p1
profile: implementation
objective: "Lands as feat(studio). Today only a pattern clip's source port 'trigger' gates Envelopes and clocks Random and Step Modulator (transport.js triggerEnvelopes and triggerClocks), event clips gate only Envelopes (clip-targets.js), and the live note router has no trigger fan-out. This slice makes one fan-out, shared by the transport and the note router, from any TRIGGER output port (keys gate, clock, sequence trigger, drum and follower gates) to every TRIGGER input it reaches (envelope and contour gates, random and step-modulator clocks, drum triggers), on the audio clock, and one ownership rule: while the transport plays, a gate input reached from a clip-driven source is owned by the timeline and a live gate on it is refused with a stated reason; while stopped, live gates own it. It builds on K023's Clock node and trigger event clips. Before: only a pattern clip's 'trigger' port gates Envelopes, and nothing live fans out. After: any gate or trigger output gates what it reaches, live and scheduled, with one ownership rule. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; TRIGGER edges stay valid model data that gate only through the old path."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
scope:
  - "src/js/studio/transport.js"
  - "src/js/studio/runtime.js"
  - "src/js/studio/clip-targets.js"
  - "src/js/studio/adapters"
  - "src/js/synth/note-router.js"
  - "tests/unit/v4-clip-target-policy.test.mjs"
  - "docs/v31/timeline.md"
  - "tests/unit/studio-trigger-fanout.test.mjs"
  - "tests/browser/synth-nodes.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K060"
  - "K023"
acceptance_criteria:
  - "tests/unit/studio-trigger-fanout.test.mjs, failing on the merge base: a keys gate edge gates a contour and an envelope at the scheduled frame (StudioFakeContext); a clock edge steps a random node; a muted TRIGGER edge gates nothing; a live gate on a timeline-owned input while playing is refused with its reason and gates nothing; the old pattern-clip path keeps every existing test green."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a muted TRIGGER edge; a live gate on a timeline-owned input while playing (refused with its reason); a trigger into a node without a trigger input (refused by canConnect)."
  - "A browser check in tests/browser/synth-nodes.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a keys gate patched to an envelope in the Studio graph opens that envelope from the Synth piano and from a timeline clip, as the Studio graph shows. Real-time: a live note opens the envelope (runtime gate state in debugInfo), each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the gate edge is made by pointer, keyboard (connection dialog) and touch, and the refusal sentence is in the polite live region. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "The pull request carries a reviewer's verdict (src/js/studio and src/js/synth is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 2 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; it does not wait on Q023, and its figure joins the line's sum once Q023 records the cap, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/studio-trigger-fanout.test.mjs"
  - "node tests/browser/synth-nodes.cjs"
  - "npm test"
evidence_required:
  - "verified"
