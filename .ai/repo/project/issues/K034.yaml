  - "playable-instrument#chart-interaction"
title: "Phase and Lissajous views on Canvas 2D, drawn on change, static under reduced motion"
slug: phase-and-lissajous-views-on-canvas-2d-drawn-on-change-stati
priority: p2
profile: implementation
objective: "Lands as feat(charts). phase-view.js and lissajous.js move from the second p5 instance to Canvas 2D with preallocated paths (the CDP probe measured about 96-112 KB per frame plus the Lissajous allocation). They redraw only on a configuration change, new live L/R data or model drift (fA != fB); refreshTheme redraws while paused; the model is not computed while the view is hidden. Under reduced motion the model freezes, labelled \"model . frozen (reduced motion)\". Wave rows get ms ticks over the 2/fA window and +-1 relative, the Lissajous \"L ->\" and \"R ^\"; the comparison overlays (alpha 0.6 on main, 2.3-2.8:1) are drawn with faded colours registered in K027's palette at 3:1 in both themes; the kit's crosshair and keyboard cursor on the wave rows read t, A(t) and B(t); no estimated phase readout is added. The phase and Lissajous pending checks of tests/browser/chart-cost-baseline.json are removed. p5 stays bundled for the main visualizer, so gzip does not fall."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
