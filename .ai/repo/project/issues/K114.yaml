  - "src/js/ui/synth"
  - "src/js/studio/schema.js"
  - "src/js/studio/timeline-compiler.js"
  - "tests/unit/piano-roll-cc.test.mjs"
  - "tests/browser/session.cjs"
  - "tests/README.md"
  - "dist"
