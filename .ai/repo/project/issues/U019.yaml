acceptance_criteria:
  - "Fail-first: tests/unit/repeated-text.test.mjs reads src/index.html and the Studio modules and fails on the merge base. It checks that the Inspector's Studio header names no node or connection count, that the timeline legend and the retention text are not rendered as always-visible paragraphs, and that the Device & Limits callout and the banner do not both carry the speaker-output sentence at md and up."
  - "A check in tests/browser/v3-ui.cjs at 1536x1024 counts the visible occurrences of 'nodes · ' and the connection count in the Studio, the speaker-output statement in the Playground and the Analyzer, and the shortcut legend in the Studio. Each one is exactly 1, and no visible paragraph in these five workspaces is longer than 200 characters. At 390x844 the speaker-output statement is still reachable once."
  - "tests/browser/v31-studio-timeline.cjs asserts that [data-osc=studio.tl.root]'s aria-describedby resolves to non-empty KEY_HELP text and that [data-osc=studio.keys] opens a dialog listing every KEY_HELP key. Its contrast probe of .osc-stl-help (line 725) is replaced, not dropped."
  - "The §249 summary test in tests/unit/v31-studio-templates.test.mjs passes unchanged (the summary text is not edited), and the retention and Findings texts are byte-identical inside their disclosures."
  - "It adds no osc-* class, selector or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes) and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "Definition of done, extends: the Keyboard shortcuts dialog gains the timeline keys and the graph gains its accessible description."
  - "Definition of done, interlinks: the retention accordion and the Findings popover each name the workspace section they qualify, and the Device & Limits callout stays the one link target of the speaker-output statement."
  - "Definition of done, interactivity: the accordion, the popover and the shortcuts dialog open and close by mouse and keyboard (tests/browser/v3-ui.cjs)."
  - "Definition of done, docs, menus and routes: tests/README.md has a row for each new test; no route or menu changes (stated)."
  - "Definition of done, tested: npm test and the two browser suites above pass; dist is rebuilt and npm run build:check passes."
  - "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
