title: "Each count, shortcut legend and disclaimer appears once per screen, and long help sits behind a control"
slug: each-count-shortcut-legend-and-disclaimer-appears-once-per-scree
priority: p3
profile: implementation
objective: "Lands as fix(ui). Before: one viewport repeats itself. Studio: the node and connection count appears three times, in the graph header (src/js/ui/studio/workspace.js:632, 'counts'), the Inspector's Studio header (src/js/ui/studio/inspector.js:1201 and 1460) and the visible 177-character p.osc-si-summary [data-osc=studio.inspector.summary] (inspector.js:1228). The timeline's 219-character shortcut list p.osc-stl-help (src/js/ui/studio/timeline-editor.js:135, KEY_HELP of src/js/ui/studio/transport-view.js:101) is always visible inside [data-osc=studio.tl.root], although [data-osc=studio.keys] (src/index.html:2399) opens a Keyboard shortcuts dialog. Playground and Analyzer: the safety banner [data-osc=safety] (src/index.html:254-255) and the Device & Limits callout (src/index.html:744-747) both say speaker output is not guaranteed. Measure: p.osc-m-hint [data-osc=measure.retention] (src/index.html:1826) is 358 characters. Experiments: the Findings definition paragraph (src/index.html:1938) inside [data-osc=fnd.panel] is always shown. After: the graph header keeps 'N nodes · M connections'; the Inspector's Studio header keeps only clips and automation lanes; the summary text from summarizeStudio (src/js/studio/a11y.js, the §249 screen-reader summary) is unchanged but leaves the visible column and stays the graph's accessible description (Tailwind sr-only). The timeline legend stays the root's aria-describedby target with sr-only, and the shortcuts dialog lists every KEY_HELP key. The Device & Limits callout keeps the speaker-output statement. The banner's hardware sentence is md:hidden, so it is shown only below 768 px, where Device & Limits is hidden (src/index.html:281). The retention hint becomes one short sentence with the full text unchanged in a Flowbite Pro accordion. The Findings definition shows as the empty state and, once findings exist, in a Pro popover beside the heading. All of this uses Pro components and Tailwind utilities, with no new osc-* class and no inline style (project.ui-uses-flowbite-pro). Negative cases: no honesty label of section 73 and no privacy statement is removed or reworded, because each one is moved, not cut (project.no-fake-science). Every hidden text stays reachable by keyboard and assistive technology. The disclosure controls work (project.no-inert-surfaces). No CSS truncation hides text. Rollback: revert the commit (markup and text only; no stored state). Not this: S063 (V1 progressive disclosure, completed), Q004 and PR #278 (P002, which panels stay on the first Playground screen), W006 (shared transport labels and shortcuts), G015 ('What is this' panel), N008 (collapsible control panel)."
why: "Found by the S074 quality-bar review of 2026-10-30 at origin/main d9db6bdf, section 74 symptom 'excessive explanatory text: the same disclaimers and summaries repeat on one screen, and help text is permanently visible', and reproduced by an independent verifier. Evidence: the long-text probe in the review's scratchpad s074/dom.json (probe.cjs), plus the screenshots s074/d-studio.png (y=825-930 and 915), s074/d-playground.png (banner y=83, Device callout y=380-445) and s074/d-analyzer.png (y=83 and y=862). Severity P3."
