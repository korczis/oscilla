title: "The browser census opens every dialog and every non-Studio tab it lists and asserts each is visible and named"
slug: the-browser-census-opens-every-dialog-and-non-studio-tab
priority: p2
profile: implementation
objective: "Lands as test(browser). At main 68b117f3 tests/browser/surface-census.cjs never opens a dialog or a tab outside the Studio, so the 22 dialogs and the Analyzer, mic, phase, bio and presets subviews are listed but never shown by the census. After: for every census entry of kind dialog and subview the suite opens it through its reachedFrom opener (a click, never an internal call), waits with until() for it to be visible with its accessible name, and closes it; an entry that cannot be opened fails naming it."
why: "oscilla-b0 Total Coherence audit of main 68b117f3, slice A (uncovered: the browser census never opens dialogs or non-Studio tabs)."
scope:
