id: U079
milestone: M054
serves:
  - "ui-current#ui-audited"
title: "The browser census opens every dialog, menu and non-Studio tab through a declared opener, and reachedFrom is checked against those openers"
slug: the-browser-census-opens-every-dialog-and-non-studio-tab
priority: p2
profile: implementation
objective: "Lands as test(browser). Line numbers at origin/main a19f1ff6. tests/browser/surface-census.cjs never opens a dialog or a tab outside the Studio, so the 22 dialogs and the Analyzer, mic, phase, bio and presets subviews are listed but never shown; the census has no opener field, and reachedFrom on dialogs and routes is never checked (osc-dlg-help omits synth; af counts 4-5 dialogs whose reachedFrom disagrees with the markup, not one). After: every dialog and subview entry of tests/unit/surface-census.json gains an opener (a [data-osc] or #id selector of the control that opens it, per reachedFrom workspace where it differs); the unit test checks each opener exists in src/index.html and that reachedFrom equals the workspaces whose shown markup holds an opener (a workspace the entry omits fails, one it names with no opener fails); the suite opens each entry by clicking its opener, waits with until() for it to be visible with its accessible name, and closes it. Surfaces that need data are seeded through the UI: osc-dlg-exp-delete and the experiment dialogs through the Experiments import control with the existing fixture (tests/browser/v3-ui.cjs's fixtures.white.json), never through page.evaluate on window.OSCILLA. From U078 (removed): the reachedFrom check and the menus. Corrected 2026-11-05: folding U078's menus into af's U073 was wrong, because U073 is 'Analyzer is the one analysis page' and adds only a status-bar settings menu, so the four role=menu menus had no census coverage. Re-checked on main 2195a7a3, src/index.html holds four: #osc-overflow-menu (:188, opened by #osc-overflow), #osc-export-menu (:207, by #osc-export), #osc-seq-add-menu (:1332, by #osc-seq-add) and #osc-synth-pick-menu (:1887, by #osc-synth-pick); #osc-sb-actions is a role=group (:3124), not a menu. After: tests/unit/surface-census.json gains a 'menu' kind holding these four, each with its opener and reachedFrom, and the status-bar settings menu joins it when U073 lands it; a role=menu element in src/index.html without a menu entry fails."
why: "oscilla-b0 Total Coherence audit of main 68b117f3, slice A (the browser census never opens dialogs or non-Studio tabs; reachedFrom never checked). af's critique of 96daa67b (AMEND 21-22): the census has no opener field, the fixture seeding and the CI bound were unnamed, the suite needs its own page.evaluate scan, and 4-5 dialogs fail reachedFrom."
scope:
  - "tests/browser/surface-census.cjs"
  - "tests/unit/surface-census.test.mjs"
  - "tests/unit/surface-census.json"
  - "tests/README.md"
depends_on:
  - "U076"
acceptance_criteria:
  - "Fail-first: the unit check fails on the merge base because no dialog or subview entry has an opener, and its reachedFrom case names every dialog whose reachedFrom disagrees with the openers in the markup (osc-dlg-help and synth among them; the pull request lists all it finds)."
  - "In Chromium, Firefox and WebKit every dialog and subview entry opens by a click on its opener, shows its accessible name and closes, through tests/browser/lib/suite.cjs with named until() deadlines and nothing added to tests/browser/timing-baseline.json; the added time keeps the browser gate's 'npm run test:browser' step within its 45-minute bound (.github/workflows/ci.yml:345-351, job bound 65), with the measured WebKit time in the pull request body."
  - "Menus: the unit check fails on the merge base because tests/unit/surface-census.json has no 'menu' kind; after, it holds #osc-overflow-menu, #osc-export-menu, #osc-seq-add-menu and #osc-synth-pick-menu with their openers (#osc-overflow, #osc-export, #osc-seq-add, #osc-synth-pick, each with aria-haspopup=menu and aria-controls naming its menu), and a role=menu element in src/index.html with no entry, or an entry with no such element, fails (a mutation that adds an unlisted menu fails); the suite opens each menu by its opener, waits with until() for it to be visible with its accessible name, moves focus into it with the keyboard and closes it with Escape, focus returning to the opener."
  - "Its own scan: tests/unit/surface-census.test.mjs reads tests/browser/surface-census.cjs and fails on any page.evaluate that reaches window.OSCILLA.app or window.OSCILLA.experiments to open or seed a surface (the C035 pattern); a mutation that adds one fails."
  - "Not a guarded path under v2; R033 guards tests/browser files a rule's enforcement names (project.suite-harness, project.bounded-test-timing), and a critique from prismatic-majordomus-98 is asked for. Lane: oscilla-21."
validation:
  - "node --test tests/unit/surface-census.test.mjs"
  - "node tests/browser/surface-census.cjs"
evidence_required:
  - "verified"
