title: "The browser census opens every dialog and non-Studio tab through a declared opener, and reachedFrom is checked against those openers"
slug: the-browser-census-opens-every-dialog-and-non-studio-tab
priority: p2
profile: implementation
objective: "Lands as test(browser). Line numbers at origin/main a19f1ff6. tests/browser/surface-census.cjs never opens a dialog or a tab outside the Studio, so the 22 dialogs and the Analyzer, mic, phase, bio and presets subviews are listed but never shown; the census has no opener field, and reachedFrom on dialogs and routes is never checked (osc-dlg-help omits synth; af counts 4-5 dialogs whose reachedFrom disagrees with the markup, not one). After: every dialog and subview entry of tests/unit/surface-census.json gains an opener (a [data-osc] or #id selector of the control that opens it, per reachedFrom workspace where it differs); the unit test checks each opener exists in src/index.html and that reachedFrom equals the workspaces whose shown markup holds an opener (a workspace the entry omits fails, one it names with no opener fails); the suite opens each entry by clicking its opener, waits with until() for it to be visible with its accessible name, and closes it. Surfaces that need data are seeded through the UI: osc-dlg-exp-delete and the experiment dialogs through the Experiments import control with the existing fixture (tests/browser/v3-ui.cjs's fixtures.white.json), never through page.evaluate on window.OSCILLA. From U078 (removed in favour of af's U073 for the status-bar menu; #osc-sb-actions is a role=group, src/index.html:3124, not a menu): the reachedFrom check."
why: "oscilla-b0 Total Coherence audit of main 68b117f3, slice A (the browser census never opens dialogs or non-Studio tabs; reachedFrom never checked). af's critique of 96daa67b (AMEND 21-22): the census has no opener field, the fixture seeding and the CI bound were unnamed, the suite needs its own page.evaluate scan, and 4-5 dialogs fail reachedFrom."
scope:
  - "tests/browser/surface-census.cjs"
  - "tests/unit/surface-census.test.mjs"
  - "tests/unit/surface-census.json"
  - "tests/README.md"
depends_on:
