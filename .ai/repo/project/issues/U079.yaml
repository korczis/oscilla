acceptance_criteria:
  - "Fail-first: a unit check asserts every dialog and subview entry is opened by surface-census.cjs (by its locator); it fails on the merge base."
  - "In Chromium, Firefox and WebKit every dialog and subview entry opens by a click, shows its accessible name and closes, through tests/browser/lib/suite.cjs with named until() deadlines and nothing added to tests/browser/timing-baseline.json."
  - "No page.evaluate call reaches window.OSCILLA.app to open a surface (the C035 scan holds)."
  - "Not a guarded path under v2; tests/browser/* comes into scope with R033. Lane: oscilla-21."
