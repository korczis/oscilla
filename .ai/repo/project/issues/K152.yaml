id: K152
milestone: M067
serves:
- "connected-instrument#synth-scopes"
title: Every Synth plate draws what it does, redrawn while its knob moves
slug: every-synth-plate-draws-what-it-does
priority: p2
profile: implementation
objective: "Add src/js/synth/view/scopes.js and draw it on the plates: a VCO's one cycle (pulse at its width), a filter's magnitude response from 20 Hz to 20 kHz with its cutoff marked (the Web Audio biquad of the specification for the linear Q the Studio stores, shelves at S = 1), an envelope's attack, decay, sustain and release, an LFO's two cycles. Each scope is an image labelled with its values; a knob drag redraws it in the same frame (ui.js updateKnob). Computed from the parameters, so it is exact for what the node is set to and never claims to be a measurement. Each scope is also a handle for the parameter it draws (owner: every element clickable and interactive): a drag sets a filter's cutoff on the drawing's log axis, a pulse's width, an LFO's rate on its knob scale and an envelope's sustain, as one undo step, while the knob stays the keyboard control. The section jump moves from ui.js to view/faces.js (scrollToSection) so ui.js keeps headroom under its source budget. Above the tabs, the Synth shows its live output: the Playground's scope view in a second p5 host of the one visualization bridge, over the engine's analyser after the safety chain (no second analyser, no second state), drawing while the Synth owns the output."
why: "Owner direction of 2026-11-02, in Czech, on https://korczis.github.io/oscilla/#m=synth: \"pridej prubehy, visualizace, monityori, vlny, interatktivitu, vic to propoj\", \"vic visible\" and \"kazdy jeden element by mel byt klikatelny, interaktivni, propojeny, funkcni, zapojeny, otestovany\". A plate showed knobs and numbers only: a cutoff of 886 Hz said nothing about the curve it makes."
scope:
