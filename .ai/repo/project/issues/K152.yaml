id: K152
milestone: M067
serves:
- "connected-instrument#synth-scopes"
title: Every Synth plate draws what it does, redrawn while its knob moves
slug: every-synth-plate-draws-what-it-does
priority: p2
profile: implementation
objective: "Add src/js/synth/view/scopes.js and draw it on the plates: a VCO's one cycle (pulse at its width), a filter's magnitude response from 20 Hz to 20 kHz with its cutoff marked (the Web Audio biquad of the specification for the linear Q the Studio stores, shelves at S = 1), an envelope's attack, decay, sustain and release, an LFO's two cycles. Each scope is an image labelled with its values; a knob drag redraws it in the same frame (ui.js updateKnob). Computed from the parameters, so it is exact for what the node is set to and never claims to be a measurement."
why: "Owner direction of 2026-11-02, in Czech, on https://korczis.github.io/oscilla/#m=synth: \"pridej prubehy, visualizace, monityori, vlny, interatktivitu, vic to propoj\", and \"vic visible\". A plate showed knobs and numbers only: a cutoff of 886 Hz said nothing about the curve it makes."
scope:
- src/js/synth/view/scopes.js
- src/js/synth/view/face.js
- src/js/synth/ui.js
- tests/unit/synth-scopes.test.mjs
- tests/README.md
- .ai/repo/project/intents/connected-instrument.yaml
- .ai/repo/project/issues/K152.yaml
- dist
depends_on:
- K151
acceptance_criteria:
- "Before: VERIFIED: the Synth's VCO, filter, envelope and LFO plates show knobs and values only."
- "After: each draws its curve as a labelled image; a Butterworth low-pass reads -3.01 dB at its cutoff, a peaking filter its gain at its centre, a band-pass 0 dB at its centre, an all-pass flat; dragging a knob redraws the curve."
- "Negative cases: a module with no curve (mixer, noise, VCA) draws none; a bypassed filter says so in its label; no NaN on any value."
- "Rollback: revert the merge commit; no stored record or schema changes."
validation:
- node --test tests/unit/synth-scopes.test.mjs
- node tests/browser/synth.cjs
evidence_required:
- verified
created_at: '2026-11-02'
updated_at: '2026-11-02'
