acceptance_criteria:
- "Before: VERIFIED: the Synth's VCO, filter, envelope and LFO plates show knobs and values only."
- "After: each draws its curve as a labelled image; a Butterworth low-pass reads -3.01 dB at its cutoff, a peaking filter its gain at its centre, a band-pass 0 dB at its centre, an all-pass flat; dragging a knob redraws the curve; a drag across the LPF scope from 90 % to 50 % of its width sets 632.5 Hz in one undo step; the live monitor's canvas fills its box and its picture changes once a held key sounds."
- "Negative cases: a module with no curve (mixer, noise, VCA) draws none; a bypassed filter says so in its label; no NaN on any value."
- "Rollback: revert the merge commit; no stored record or schema changes."
validation:
- node --test tests/unit/synth-scopes.test.mjs
- node tests/browser/synth.cjs --only s-scope,s-monitor
evidence_required:
