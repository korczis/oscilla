acceptance_criteria:
  - "A unit test: the preflight with otherAudio set from a sequencer or Studio source raises OTHER_AUDIO, and a structural test keeps the owners named by stopPlayback and outputBusy the same set; it fails on the merge base."
  - "Browser check `preflight-other-audio` in tests/browser/v3-measure.cjs with ?measure=loopback: Check setup with the instrument, the sequencer and the Studio each playing shows OTHER_AUDIO in all three and leaves each source playing."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/ui/measure.js and src/js/measurement (project.review-verdict); the builder never writes it."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
