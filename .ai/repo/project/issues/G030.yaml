title: "One pad, the oscilla-pad: one two-parameter surface model, its Pro and hardware looks as skins"
slug: one-pad-the-oscilla-pad
priority: p2
profile: implementation
objective: "Lands as refactor(ui). The pad family of G021's census has one model, src/js/ui/kinds/xy-pad.js (createXyModel: the two declared parameters, the preview and commit, keys and ARIA), whose pointer maths is its part src/js/charts/drag-math.js (xyFromPoint). Every look of the pad is a skin of that model: the Pro surface of mountXyPad, the synth layer's hardware drawing src/js/ui/synth/xy.js (F013 W1b), the pad view 26 builds for K183 (touch point, trail, scale lines) and the live landing's hero (P012). A skin keeps its own geometry (a layout and the puck's travel) but maps a point to the pad's positions through the model's part, so src/js/ui/synth/xy.js's xyValue, which re-implements xyFromPoint over the skin's travel, calls it instead or goes. The pad is OSCILLA's own: no hardware pad's name, layout or look is copied (the owner's order of 2026-11-05; tests/unit/synth-wording.test.mjs and the product-name check hold)."
why: "Owner orders of 2026-11-05: \"no kaosspad (oscilla-pad)\" and \"vsechny komponenty abstrahuj, reuse, dry, parametrizuj\". On the tree merged with Train 6 the census of G021 finds two point-to-position mappings of the pad (charts/drag-math.js xyFromPoint, the kind's, and ui/synth/xy.js xyValue, the hardware skin's)."
depends_on:
  - "G021"
scope:
  - "src/js/ui/kinds/xy-pad.js"
  - "src/js/charts/drag-math.js"
  - "src/js/ui/synth/xy.js"
  - "src/js/synth/view"
  - "tests/unit/ui-families-baseline.json"
