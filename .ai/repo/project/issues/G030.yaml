title: "One pad, the oscilla-pad: one two-parameter surface model, its Pro and hardware looks as skins"
slug: one-pad-the-oscilla-pad
priority: p2
profile: implementation
objective: "Lands as refactor(ui). The pad family of G021's census has one model, src/js/ui/kinds/xy-pad.js (createXyModel: the two declared parameters, the preview and commit, keys and ARIA), whose pointer maths is its part src/js/charts/drag-math.js (xyFromPoint). Every look of the pad is a skin of that model: the Pro surface of mountXyPad, the synth layer's hardware drawing src/js/ui/synth/xy.js (F013 W1b), the pad view 26 builds for K183 (touch point, trail, scale lines) and the live landing's hero (P012). A skin keeps its own geometry (a layout and the puck's travel) but maps a point to the pad's positions through the model's part, so src/js/ui/synth/xy.js's xyValue, which re-implements xyFromPoint over the skin's travel, calls it instead or goes. The pad is OSCILLA's own: no hardware pad's name, layout or look is copied (the owner's order of 2026-11-05; tests/unit/synth-wording.test.mjs and the product-name check hold). The change in src/js/ui/synth/xy.js (26, 2026-11-05): xyValue keeps its contracts, travelOf's and coordinate()'s TypeError refusals, a NaN coordinate reading 0 and clean()'s 12 significant digits (the exact round trip of grid values its header promises), and delegates only the clamp and normalisation to xyFromPoint(px, py, { x: t.x, y: t.y, w: t.width, h: t.height }), whose y-up 1 - (py - y)/h equals (t.y + t.height - py)/t.height; NaN is read as 0 before the call, since xyFromPoint's clamp of NaN is not 0. What the pad family's model owns, so no skin re-derives it (26): (a) the pad's X and Y are performance outputs (K183: panels/xy.js adds x and y, normals.js addsFrom and addsEdge), so a pad cable sums into its target and never breaks the target's normals; (b) the pad plays notes only through the one Keys source ('kbd-xy', K178): the X cells of the consumer's scale, noteOn, legato across cells, noteOff, and a skin never opens a gate or a voice of its own, it reports fractions; (c) createTrail and the gate LED are pure parts of the model file, and Hold (Q099), K200 (an edit while touched keeps the note) and K097's scenes are model state. The pad view of #426 (mountXyPad) and K183 (#428) are in the model file and in the wiring, so they need no skin marker."
why: "Owner orders of 2026-11-05: \"no kaosspad (oscilla-pad)\" and \"vsechny komponenty abstrahuj, reuse, dry, parametrizuj\". On the tree merged with Train 6 the census of G021 finds two point-to-position mappings of the pad (charts/drag-math.js xyFromPoint, the kind's, and ui/synth/xy.js xyValue, the hardware skin's)."
