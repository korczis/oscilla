acceptance_criteria:
  - "Fail-first: the census unit test fails while a pad skin maps a point to positions by its own formula (skin-logic) and passes once it calls the model's part."
  - "One mapping: every pad surface (the Pro pad, the hardware skin, K183's view, the landing hero) maps a pointer to positions through charts/drag-math.js xyFromPoint, asserted by the census and by a unit check that a skin's positions equal the part's for the same point and travel."
  - "No behaviour change: tests/browser/xy-pad.cjs and the SYN visual reference pass unchanged in chromium, firefox and webkit."
  - "xyValue keeps its contracts: its TypeError refusals, NaN read as 0 and the exact round trip of grid values (tests/unit/ui-synth-xy.test.mjs's round-trip walk is the gate, unchanged)."
  - "The model owns the pad's behaviour: a census mutation that adds a gate, a voice or a cable rule to a pad skin fails (skin-logic), and the pad's X and Y cables sum into their targets with the targets' normals intact (K183's check, cited)."
  - "OSCILLA's own: the product-name and wording checks hold for every pad text and recipe."
  - "Standard: tests/README rows, size report, fail-first."
