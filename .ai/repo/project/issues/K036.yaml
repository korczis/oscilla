id: K036
milestone: M062
serves:
  - "playable-instrument#chart-cost"
title: "One frame loop for every continuous chart draw, the p5 fps cap kept, no work while hidden"
slug: one-frame-loop-for-every-continuous-chart-draw-the-p5-fps-ca
priority: p2
profile: implementation
objective: "Lands as perf(charts). frame-loop.onFrame(fn, { hosts, essential }) skips a subscriber when none of its hosts is rendered (display none or an inactive tab) and intersecting (one cached IntersectionObserver flag per host), so one subscriber can serve several views, and skips every non-essential subscriber while setFramesPaused (the Pause animation toggle) is on; an essential subscriber (a transport clock or a playhead) runs while paused, so a playing position is never shown stale. Its tick iterates a subscriber snapshot replaced only on subscribe and unsubscribe, so a tick allocates nothing (frame-loop.js:12 spreads [...subscribers] on every tick today). The main p5 visualizer runs noLoop and is redrawn from the frame loop through a time gate that keeps its 30 fps idle and 60 fps playing cap (p5-host.js:139 and :177), so a 120 Hz display does not double its draws; visualization-bridge updateLoop becomes a subscriber gate. One-shot rAFs that coalesce an edit (timeline-editor.js, graph-editor.js, visualization-bridge requestRedraw) are not loops and are listed by name. phase-stereo stops getData() while its tab hides the view; measure-charts redraw() sets a dirty flag while its host has no size; the spectrum setShow flags become a bitmask; the V1 wave and phase views leave createDefaultViews() (main.js never selects them) and the maths the tests import stays. It creates tests/browser/chart-cost.cjs with every check of intent criterion chart-cost, and tests/browser/chart-cost-baseline.json records the per-tick allocation ceiling and the checks still pending, which only shrink: scope vertex calls (K032), phase and Lissajous (K034), the hidden live RTA (K037) and the Studio transport tick, which K057 moves onto the loop after E003 splits workspace.js. It adds no markup, so it waits on no F issue."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
