acceptance_criteria:
  - "tests/unit/frame-loop.test.mjs: a subscriber whose hosts are all hidden is skipped and one with any host shown runs; no rAF is requested while every host is hidden; a non-essential subscriber is skipped while frames are paused and an essential one is not; the subscriber snapshot is the same object across ticks without a subscription change, and unsubscribing inside a tick is safe; the p5 time gate draws at most 30 per second idle and 60 playing with a fake clock at 60, 120 and 144 Hz."
  - "tests/browser/chart-cost.cjs wraps requestAnimationFrame and counts self-re-arming chains: at most one is armed while the Playground plays, the named one-shots excepted, and while the Studio transport plays once K057 removes its pending entry; p5 draws over a polled window stay at or below the cap times the measured elapsed time plus one; the draw hooks of hidden-tab hosts do not rise; in Chromium, the bytes allocated per frame-loop tick while a tone plays (CDP heap sampling over a polled window) are at or below the ceiling in tests/browser/chart-cost-baseline.json, with the before and after figures in the pull request, and the Firefox and WebKit legs skip that one check with the reason; the vertex and beginShape spy over the scope, phase and Lissajous views, the hidden live RTA check and the Studio tick check run and are recorded as pending; --require-complete fails while any check is pending or the ceiling is above 60 KB. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "package.json runs tests/browser/chart-cost.cjs in npm run test:browser, and README.md's Testing table names it, so CI and the release gate run it."
  - "tests/browser/perf-budgets.cjs (npm run test:perf, run by hand) keeps oscilla:ready within budget, stated in the pull request."
  - "The chart reads existing AnalyserNodes on the main thread only, creates no audio node and adds no work to the audio path, and no draw loop writes the DOM per frame (project.audio-engine-discipline v2)."
  - "Its paths are not guarded (scripts/review-verdict.mjs GUARDED); as a perf change it is outside project.fail-first and still adds the tests above."
  - "The visual references of the analysis region, if it moves, are re-accepted in darwin-arm64 and linux-x64, in each theme that has references (light ones exist once F011 lands), with the reason \"p5 driven from the shared frame loop\" in the pull request body (npm run test:visual)."
  - "scripts/size-report.mjs shows at most 0.5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
