objective: "Lands as feat(ui), amending U005 (shipped in 06e7d1fb, record open). Analyzer fills its workspace, has a visible Play (C030), feeds the spectrogram from the microphone or the output owner by a picker, and takes in Compare's panels (U072). Device & Limits, today shown only on Analyzer (src/index.html:698-699), is also reachable from a status-bar settings menu on every page. No loss before removal (Q090, b0's binding condition): the old page stays until everything it offers is live, reachable and sounding in its new home, proven by a browser check that walks each of the old page's controls to its new place in Chromium, Firefox and WebKit; only then is its #m= route redirected to the new home (the link keeps working, ADR 0045's one dispatcher) and its markup removed."
why: "af nav-pages audit wf_ed1cc8d6-3e8 and Play audit wf_99782352-a93 on origin/main 6d5efa89 (v3.19.0), after the owner's complaint in the af session 2026-11-04/05: views feel lost, Play does not work on most pages, nothing runs through one bus, engines are not wrapped, many top-nav pages are obsolete, unconnected, not realtime, poor. Decided by af and b0 on 2026-11-05 under the owner's order of that day 'discuss answers with other llms, do not wait for human, be llm autonomous' (Q090)."
