title: "One parameter model for the Inspector, the labs and the knob: parse, format, slider mapping and the stated refusal of an invalid entry"
slug: one-parameter-model-for-the-inspector-the-labs-and-the-knob
priority: p2
profile: implementation
objective: "Lands as fix(ui). D2 of the inventory, its pure half: formatParamValue, parseParamInput, sliderRange, valueToSlider and sliderToValue move unchanged from src/js/ui/studio/inspector.js into src/js/ui/catalog/param-model.js, over the section 79 descriptor, with the units of G002; the Inspector imports them (no behaviour change there), and Filter Lab, the envelope, the additive gain and the Synthesis (dual) fields parse and map their sliders through it. The three slider-fill helpers (ui/app.js sliderFill, labs/dom.js sliderFillPct, the inline :style) become one export. Filter Lab's invalid entry no longer reverts silently: it keeps the last value and states the refusal through the existing live region and toast (no new markup before Pro). The knob of the synth line (K058) is the rotary view of this same model: its knobModel adds angle and drag mapping on top of param-model.js, never a second parser. Before: VERIFIED seven hand-built variants; the Inspector states an invalid entry, Filter Lab reverts it silently (filter-lab.js:140-151); aria-valuetext missing on osc-filter-gain and osc-env-sustain. After: one model; every invalid entry is stated; every slider has aria-valuetext with value and unit. Negative cases: out of range, wrong unit, empty, 'NaN'. Rollback: revert; nothing stored changes."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
