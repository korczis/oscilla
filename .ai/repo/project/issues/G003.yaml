acceptance_criteria:
- "tests/unit/param-model.test.mjs fails on the merge base: one table of descriptors (log frequency, linear level, seconds, integer, enum) round-trips value, slider position and text, and refuses each negative case with validateParamValue's reason; the Inspector's existing tests pass unchanged."
- "src/index.html changes only aria-valuetext bindings on the two sliders that lacked them, which adds no class token, selector or inline style."
- "Definition of done, extends: the Inspector's numberField model (inspector.js:66-160), the most complete of the seven variants."
- "Definition of done, interlinks: the catalogue's param kind (G008) and the synth line's knob render from this model."
- "Definition of done, interactivity: an invalid typed value in Filter Lab is refused and announced instead of reverted."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md and the Filter Lab help say how a refused value is stated. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: tests/browser/labs.cjs types '30k' into the Filter Lab cutoff by keyboard and waits with until() (deadline 'cutoff refusal stated', 2 s) for the live region to state the refusal while the readout keeps its value; the same with a hasTouch tap and typing. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
