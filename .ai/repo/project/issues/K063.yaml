id: K063
milestone: M064
serves:
  - "connected-instrument#patch-cables"
title: "Patch bay: drag cables from typed jacks, with highlight, refusal, fan-out and normalling"
slug: patch-bay-drag-cables-from-typed-jacks-with-highlight-refusa
priority: p1
profile: implementation
objective: "Lands as feat(synth). The jack strips of the panel cards and one SVG cable layer over the panel: drag from any jack after the 4 px threshold with a live sagging cable (min(80, 0.25 x distance) px), compatible jacks highlighted and incompatible ones crossed with the validator's sentence in a Pro tooltip, judged once per drag by canConnect and full-model validation of the whole batch the drop would dispatch (the cable plus the normals it breaks, from normals.js), because connectionTargets' probe adds the trial edge without removing the normal and would show a single-input normalled jack as refused (no compatibility table of its own); drop to connect as one batch that breaks the jack's normal (K061); fan-out from outputs; single-input jacks replace (K008); click or tap selects a cable, Delete or a drag-off removes it and restores the normal; colour derived from the source module, pattern from the type; Enter on a focused jack opens the connection list of createConnectDialog (compatible targets, then refused ones with reasons, then Remove cable); tap-connect mode on touch; feedback refused with the cycle path highlighted. Before: cables exist only in the Studio graph. After: cables are dragged in the panel with highlight, refusal, fan-out and normalling. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it. Merged plan of the component follow-up (2026-10-30): Its jacks and cables are W005's kinds."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
