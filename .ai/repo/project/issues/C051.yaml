  - "tests/README.md"
  - "dist"
depends_on:
  - "C037"
acceptance_criteria:
  - "Fail-first, on seams of the merge base: tests/unit/playing-state.test.mjs builds the workbench state and the output owner as main.js does, starts and then stops the sequencer editor directly (editor.stop(), no poll tick) and asserts cmp.seqPlaying is false in the same event; on the merge base it stays true until the 150 ms poll (main.js:591-597) runs."
  - "A static scan finds no assignment to seqPlaying, studioPlaying, isSounding, anySounding or outputOwner outside the bus, and no setInterval that copies a playing state; a mutation that re-adds the poll or one assignment fails naming it."
  - "Each mirror is a read: a unit test asserts that claim and release change every mirror in the same event (no timer, fake clock)."
  - "tests/browser/app.cjs and tests/browser/v31-studio-transport.cjs show the status bar, the scope's owner and the Studio transport agreeing in the same frame after a hand-over, with until() deadlines, in Chromium, Firefox and WebKit."
  - "Guarded paths marked: src/js/synth/* (v2, prismatic-majordomus-98); src/js/ui/measure/session.js is read, not changed; the rest is judged by the screens seat once R031 lands. Lane: dev-53."
validation:
  - "node --test tests/unit/playing-state.test.mjs"
  - "node tests/browser/app.cjs"
  - "node tests/browser/v31-studio-transport.cjs"
  - "npm test"
evidence_required:
  - "verified"
