title: "The playback bus, slice 3: one observable 'playing' state, and every mirror of it becomes a read"
slug: one-playing-state-mirrors-become-reads
priority: p1
profile: implementation
objective: "Lands as fix(bus). Split from C037 by af's critique of 96daa67b (BLOCKING 5); C034's 'removing the duplicate state' slice. Line numbers at origin/main a19f1ff6. About 12 'is it playing' values coexist: cmp.playing; cmp.seqPlaying (src/js/ui/workbench.js:83) with three writers, the 150 ms poll (src/js/main.js:591-597), the output owner's stop (src/js/ui/output-owner.js:43-44) and its claim (:89-90); editor.playing; studio.playing and the studioPlaying getter (workbench.js:152); studioOwnsOutput() (src/js/ui/studio/workspace/runtime.js:277); cmp.synth.armed with four writers (src/js/synth/ui.js:416, :715, :750, :858); measureOwnsOutput() (src/js/ui/measure/session.js:460-462); isSounding (workbench.js:128); anySounding (:154); outputOwner (main.js:691); adapter.isPlaying (main.js:141). After: the bus holds one observable state {owner, since} that changes in the same event as claim and release; cmp.seqPlaying, studioPlaying, synth.armed's playing meaning, isSounding, anySounding and outputOwner are getters over it (never assigned), the 150 ms poll is deleted, and the Studio's $watch('seqPlaying') (workspace.js:490) becomes a bus subscription."
why: "af's Play audit (about 12 playing values, seqPlaying polled); oscilla-b0 Total Coherence audit of main 68b117f3 (seqPlaying has 3 writers); af's critique of 96daa67b (BLOCKING 5: the mirrors need their own slice with its own fail-first)."
scope:
  - "src/js/core/output-bus.js"
  - "src/js/ui/workbench.js"
  - "src/js/ui/output-owner.js"
  - "src/js/main.js"
  - "src/js/ui/studio/workspace.js"
  - "src/js/ui/studio/workspace/runtime.js"
