id: G029
milestone: M123
serves:
  - "component-system#one-implementation-per-family"
  - "component-system#one-modeler-per-curve"
title: "One modeler binding: an envelope or filter modeler edits its target through the owner's own write path, chosen by the one selection"
slug: one-modeler-binding-through-the-owners-write-path
priority: p1
profile: implementation
objective: "Lands as feat(ui), the first slice of G027 and G028. src/js/ui/modelers/binding.js defines the binding, not a parameter layer: { id, kind: 'envelope' | 'filter', owner, label, paramIds[] } plus the owner's existing write path. Units, ranges, steps, scale, defaults and the live-update rule come from the parameter declaration (component-system parameter-controls#one-declaration, K105's parameter contract), never from the binding, and the binding has no names of its own for them. Owners register bindings: every Studio node of type envelope or filter, written through the Studio store as one gesture (store.beginGesture on pointer-down, NODE_PARAM_SET or one BATCH while the edit settles, endGesture on release, cancelGesture on Escape or pointercancel; one undo step; project.studio-model-is-canonical); the Synth's EG and filter plates are the same Studio nodes, so the same binding with another owner label, never a second write path; the V1 Playground voice (labs/envelope.js lab.adsr, labs/filter-lab.js) as a transitional binding listed in tests/unit/ui-families-baseline.json with its removal condition (gone when the Playground voice is a Studio node: U069, U071, V605), so it only shrinks; a sequencer track's voice after K189 slice 3 (a durable track voice node id). Selection is the binding: the modeler binds through store.subscribe events of type 'selection' (one selected node of a modeler's kind; several selected bind nothing) and re-reads on 'model' (an undo that deletes the node drops the binding); no listener of its own. Binding plays nothing and changes nothing (project.no-silent-feedback)."
why: "Owner order of 2026-11-05 (in session oscilla-21), verbatim: \"must be connected with pannels, asdr envelope modeler, filter modeler / integrated into studio, sequencer ... / one way - dry - everything bus connected + integrated + mj way / deduplicate functionality / components - modularize / generalize - infer / derive\". Settled among the LLM sessions without the owner (the owner's order of the same day): af's critique (binding, not a parameter layer; the V1 voice transitional; computed vs live labelled), 26's answers (the store as the only write path through a gesture; bind on the store's selection change) and dev-53's (the sequencer target after K189 slice 3)."
