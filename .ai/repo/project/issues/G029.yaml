current_state: "Not started. Decided 2026-11-05 among af, 26 and dev-53; G021 (feat/g021-family-census c3b2bc99) already declares the envelope and filter-response families whose models are audio/envelope.js and audio/filters.js."
acceptance_criteria:
  - "Fail-first: tests/unit/modeler-binding.test.mjs fails on the merge base (no src/js/ui/modelers/binding.js)."
  - "A binding carries only { id, kind, owner, label, paramIds[] }: a unit check fails a binding that declares a unit, range, step, scale, default or live-update rule of its own (mutation)."
  - "A drag through a Studio binding is one undo step: the store's history grows by exactly one entry from pointer-down to release, Escape and pointercancel leave it unchanged (cancelGesture), and the model's other parameters are byte-equal."
  - "The Synth plate's binding for EG 1 and the Studio Inspector's binding for that node write the same node: an edit through one reads back in the other with no second state."
  - "Selection binds: SELECTION_CHANGE to one envelope node binds it, to two nodes binds nothing, and an undo that removes the bound node unbinds it (store event types 'selection' and 'model'); the binding adds no DOM listener (the key-listener ratchet of tests/unit/keys-registry.test.mjs does not rise)."
  - "The V1 Playground voice is the one transitional binding and is listed in tests/unit/ui-families-baseline.json with its removal condition; a second legacy binding fails the census."
  - "Binding plays nothing: AudioNode census and the URL state before and after a bind are equal."
  - "Standard: tests/README rows, size report with base and head figures, fail-first."
validation:
  - "node --test tests/unit/modeler-binding.test.mjs"
  - "node --test tests/unit/ui-families.test.mjs"
  - "npm test"
evidence_required:
