  - "package.json"
  - "tests/README.md"
  - "dist"
depends_on:
  - "K079"
  - "K102"
  - "K108"
acceptance_criteria:
  - "tests/unit/instrument-bar.test.mjs, failing on the merge base: the bar's view model is derived from the store, the transport and the router only (a test replaces each owner with a fake and the bar follows it; the bar module exports no setter that writes state of its own); BAR:PTN reads 1:1 at the start, the bar the transport is in during play and, in song mode, the pattern K079 says is playing; the Song / Pattern switch dispatches K079's own action as one history entry; each component names the workspace route the router serves; Save calls the project save the Projects and patches dialog calls."
  - "tests/browser/instrument-bar.cjs, a new entry suite added to npm run test:browser (so CI's legs and the release gate run it): from file:// and /oscilla/, in chromium, firefox and webkit, at 1024x768 touch and 390x844: the components switch walks Synth, Drums, Song and Mixer by pointer, keyboard and touch, each a history entry Back and Forward return through; BAR:PTN advances with PLAY on the transport and shows the pattern in song mode; a tempo or mode changed in the Studio shows in the bar, and the bar's change shows in the Studio, at the same revision; Keyboard and XY pads show and hide the dock and the pad, which keep their state; every touch target is 44x44 at least (tests/browser/layout.cjs's rule); every wait through tests/browser/lib/wait.cjs until() with a named deadline, inside tests/browser/lib/suite.cjs, tests/browser/timing-baseline.json does not grow."
  - "Every control is declared in the UI catalogue (src/js/ui/catalog) with its owner as its state path, and tests/browser/control-census.cjs drives or delegates every one of them (no inert surface, project.no-inert-surfaces)."
  - "Every string it adds is Czech (project.czech-prose) with no product, brand or model name; the UI is Flowbite Pro with no new legacy class (project.ui-uses-flowbite-pro); scripts/size-report.mjs shows at most 3 KB gzip added; tests/README.md has a row for each new test; dist is rebuilt."
validation:
  - "node --test tests/unit/instrument-bar.test.mjs"
  - "node tests/browser/instrument-bar.cjs"
  - "node tests/browser/control-census.cjs"
  - "npm test"
evidence_required:
  - "verified"
