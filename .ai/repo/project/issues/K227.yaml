id: K227
milestone: M071
serves:
  - "connected-instrument#session-and-midi"
  - "connected-instrument#daw-mixer"
  - "connected-instrument#one-transport"
title: "Instrument bar: session browse and save, the BAR:PTN position with the song/pattern switch, the component switch and the controllers, each bound to its existing owner"
slug: instrument-bar-session-position-component-switch-and-controllers
priority: p2
profile: implementation
objective: "Lands as feat(ui). One bar across the instrument workspaces (Synth, Drums, Song, Mixer), mobile-first (a tablet in landscape the reference; a phone stacks it), a Flowbite Pro toolbar. It owns no state: every part reads and writes an owner that exists. Session: Browse opens the Studio's Projects and patches dialog and K102's one patch browser, Save saves through the same project save (no second save path). Position: BAR:PTN reads the one Studio transport (the bar and, under K079's song mode, the pattern playing), and its Song / Pattern switch is K079's mode toggle, one undoable dispatch. Components: Synth, Drums, Song and Mixer switch the workspace through the one router (ui/navigation.js), each an address of its own, Back and Forward walk them. Controllers: Keyboard and XY pads show or hide the existing keyboard dock and XY pad (src/js/midi/keyboard-ui.js, src/js/ui/synth/xy.js), whose state stays theirs. Before: these live in four places with four looks, and the position and the song/pattern state are not shown together. After: one bar shows and drives them, and a change made elsewhere (the Studio transport, the router, the dock) shows in the bar at once. Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-11-09, relayed by the integrator oscilla-43: the owner sent screenshots of a semi-modular tablet instrument and asked that it be split into independent functional components on OSCILLA's own model, functional only (no trade dress or labels, project.visual-identity-lock). Its top bar (session, position, song/pattern, components, controllers) has no issue: K079 gives song mode, K102 the patch browser, K108 the mixer view and ui/navigation.js the workspaces, but nothing joins them. Bound to those owners on the integrator's condition: no second store. Checked against origin/main 7637039e."
scope:
