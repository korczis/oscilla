id: F012
milestone: M055
serves:
  - "ui-flowbite-pro#no-legacy-chrome"
  - "ui-flowbite-pro#pro-shell"
title: "Hold the Pro interface in the gate and register its claims"
slug: hold-the-pro-interface-in-the-gate-and-register-its-claims
priority: p2
profile: implementation
objective: "Make tests/browser/ui-flowbite-pro.cjs part of the release gate (package.json test:release) in every gate browser and origin; confirm the ratchet debt of tests/unit/ui-flowbite-pro-baseline.json is 0 and delete what is left of the legacy chrome (the base reset preflight replaced, unused tokens of src/styles/tokens.css that only chrome read); register the claims of ui-flowbite-pro in docs/CLAIMS.yaml (pro-build, pro-shell, no-legacy-chrome, pro-accessible, visual-references-pro, licence-clean) with the sources and tests that prove them; point the intent's criteria at those claims; add the browser suite to the rule's Verification section (F001 has already put the rule and ADR 0061 in the intent's governance). The evidence that OSCILLA is on Pro is this repository's own: the ratchet (tests/unit/ui-flowbite-pro.test.mjs) at debt 0 and the browser structure check (tests/browser/ui-flowbite-pro.cjs) asserting the Pro structure of the shell, of each of the twelve workspaces and of each of the 22 dialogs in the rendered page. The owner's verifier (~/.claude/skills/flowbite-pro/verify.mjs) is never evidence here: it lives outside the repository, changes without this repository's review, and on pull request #250's tree (2026-10-28) its S0 did not recognise src/index.html as a UI and reported 'PASS (no UI: S0 false, vacuous pass)'; a later copy (file dated 2026-10-28 23:01) recognises it and reports FAIL with 8 findings on the pre-Pro tree. That file belongs to the dev-68 session, so this plan records the gap and does not edit it. Its output may be quoted on the issue for information, next to the repository's evidence, never in its place."
why: "The intent is held only when a check fails on regression; the claims make the guarantee visible to the knowledge integrity test."
scope:
  - "package.json"
  - "src/styles"
  - "tests/unit/ui-flowbite-pro-baseline.json"
  - "tests/unit/ui-flowbite-pro.test.mjs"
  - "docs/CLAIMS.yaml"
  - ".ai/repo/project/intents/ui-flowbite-pro.yaml"
  - ".ai/repo/rules/project/ui-uses-flowbite-pro.v1.md"
  - "tests/README.md"
  - "dist"
depends_on:
  - "F011"
acceptance_criteria:
  - "npm run release-gate runs ui-flowbite-pro.cjs in every gate browser and origin and passes."
  - "The ratchet debt is 0 and tests/browser/ui-flowbite-pro.cjs asserts the Pro structure of the shell, of each of the twelve workspaces and of each of the 22 dialogs in every gate browser and origin (the intent's no-legacy-chrome command, which runs both, exits 0)."
  - "docs/CLAIMS.yaml names the six claims with their tests and every ui-flowbite-pro criterion points at its claim; knowledge-integrity passes; majordomus intent validate shows 0 failures."
  - "The issue's evidence is the ratchet and the browser structure check above; no criterion rests on ~/.claude/skills/flowbite-pro/verify.mjs, whose S0 once passed OSCILLA vacuously (no UI detected)."
validation:
  - "npm run release-gate"
  - "majordomus intent validate"
  - "node tests/browser/ui-flowbite-pro.cjs"
evidence_required:
  - "verified"
