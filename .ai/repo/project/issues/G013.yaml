title: "The Sequencer shows its whole pipeline in the cockpit: Open this sequence in Studio, one strip, and a played end-to-end scenario"
slug: the-sequencer-shows-its-whole-pipeline-in-the-cockpit-open-t
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). U8 and links.md P4, and the relayed request of 2026-10-29 for 'the sequencer, the whole pipeline with some song': the Sequencer workspace stacks two clip strips with different looks for different documents, and its pattern reaches the Studio only by export and import. As Q035 decides (recommended: the cockpit stays and the stacked strip goes), the Sequencer header gains 'Open this sequence in Studio', which takes serializeSequence(current), the strict importSequence that #264 landed (K004 part) and openDocument, guarded like a template link when the Studio has unsaved changes; the cockpit then shows that pipeline (sequence track, voice, filter, master, analysis) and plays it with the meter, scope and playhead moving. The scenario test plays a short riff written for OSCILLA in the style the request named (an octave-spanning stomp riff), never the notes of a published song, end to end: pattern, Studio, play, level, stop, census 0. The sequencer's pattern stays owned by the sequencer (config file); the Studio document is a copy made at that moment, not a live view of it: the cockpit's header names its origin ('From the Sequencer, 21:04') and, after any later edit in the sequencer, states 'The Sequencer has changed since this was opened' with 'Open again' (the same guarded path), so the Sequencer workspace never shows two versions of the pattern as if they were one; nothing flows back from the Studio to the sequencer. Before: VERIFIED (sequencer-with-compact-1536-dark.png; links.md P4). After: one sequencer view and one pipeline view of a stated copy of the pattern. Negative cases: an empty sequence (the button states why it is disabled), a sequence the importer refuses (its sentence shown, the Studio unchanged), unsaved Studio work (the Templates dialog's guard), an edit in the sequencer after opening (the stale notice, never a silent mismatch). Rollback: revert; a document opened this way is an ordinary unsaved Studio document."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
