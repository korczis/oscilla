acceptance_criteria:
- "tests/unit/studio-open-sequence.test.mjs fails on the merge base: a sequence opens as a Studio document whose compiled pattern equals the sequencer's (same block times and frequencies), an empty sequence is refused with its reason, unsaved Studio work is never replaced, and an edit of the sequence after opening makes the cockpit's origin line state the copy is older (the sequence's serialized form differs from the one the sequencer panel kept in memory at opening; neither the Studio model nor the config file gains a field, and after a reload the notice is absent, which the help text states) while the Studio document is unchanged."
- "No file under src/js/studio changes; if one must, the scope widens to it and a reviewer's verdict is required (project.review-verdict)."
- "Definition of done, extends: the strict sequence import of K004 (#264) and the cockpit of G011."
- "Definition of done, interlinks: the Sequencer and the Studio are linked both ways: 'Open this sequence in Studio' and Back to the Sequencer (G012)."
- "Definition of done, interactivity: the pipeline plays with level, scope and playhead live."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md and the Sequencer help describe the path; the Learn entry for the sequencer names it. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'song-pipeline' in tests/browser/studio-cockpit.cjs writes the riff into the sequencer by keyboard, opens it in Studio by pointer, Enter and a hasTouch tap, plays, waits with until() (deadline 'pipeline sounding', 3 s) for the meter to move and the playhead to pass the second block, stops, and asserts the node census is 0. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (the template names its flowbite-pro reference.md section), recorded as migrated, never pending; it adds no osc-* class token, no legacy vocabulary use and no selector, removes the legacy ones it replaces, and the domain views' stylesheets gain nothing (compact density is Tailwind utilities on the domain view's own elements); the record's debt falls (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 2 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
