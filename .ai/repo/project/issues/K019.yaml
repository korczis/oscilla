current_state: "Built by oscilla-43 in task t-20261111123655-a2c2 (2026-11-11). E004 dropped from depends_on with this reason (principle 14): the bars live in the step-grid kind (src/js/ui/kinds/step-grid.js), not in inspector.js, so the inspector split E004 is no precondition; E004 stays in M046 as L work. The Step Modulator's steps were already edited through K221's param-list lane (one NODE_PARAM_SET per gesture, a vertical drag sets a value) but drawn only as on/off tones; K019 draws each step as a bar of its value."
