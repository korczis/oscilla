title: "Předvolby speaks Czech: its buttons, their accessible names, the empty history row, its Playground links and the notices of its own actions"
slug: presets-page-czech
priority: p2
profile: implementation
objective: "Lands as fix(ui). The Předvolby page (src/index.html #osc-view-presets) shows Obnovit výchozí, Vymazat historii, Načíst (aria-label 'Načíst předvolbu <name>'), Smazat / Potvrdit smazání (aria-label with the name), Vyvolat, the tab list's 'Kategorie předvoleb', the empty history row and its two Playground links in Czech; the notices of its own actions (src/js/core/instrument.js: Načteno, Předvolba není dostupná, Předvolba použita jen zčásti, Vyvoláno, Historie se neuložila) are Czech at their source. The frozen V1 reset notice ('Defaults restored' and its sentence, pinned in tests/freeze/golden-a7b7a23.json) and the 'Preset saved' title stay byte-exact as data and are shown in Czech through src/js/core/frozen-display.js (U114). Ids, data-osc hooks and stored records stay."
why: "Q104 (the app's visible prose is Czech): oscilla-43's live check of v3.42.0 (2026-11-22) found English 'Load' on every preset card and 'Reset to defaults' beside 'Uložit aktuální…'; pass 8 (U116) translated the built-in presets through data/presets-display.js but not the page around them. Assigned to oscilla-0b by oscilla-43 as U122."
current_state: "Built by oscilla-0b in task started 2026-11-22 on fix/u122-presets-czech. Left for a follow-up: the save notice's message ('“<name>” is in Presets → Custom.') is a frozen V1 string that carries the user's own name, so FROZEN_DISPLAY (exact strings only) cannot show it in Czech until it gains a pattern form."
scope:
  - "src/index.html"
  - "src/js/core/instrument.js"
  - "src/js/core/frozen-display.js"
  - "src/js/ui/catalog/decl/cross-links.js"
  - "tests/unit/presets-czech.test.mjs"
depends_on: []
acceptance_criteria:
  - "The Předvolby page shows the Czech texts named in the objective; each button's aria-label starts with its visible text (WCAG 2.5.3); hooks unchanged."
  - "tests/unit/presets-czech.test.mjs reads the Czech forms as positives and fails on the base; the frozen golden still holds the V1 reset notice and shownText gives its Czech form."
  - "Both czech-prose ratchets fall in total; every browser suite that reads a changed string (app, control-census, cross-links, journeys, navigation, ui-current, first-screen, ui-flowbite-pro) passes."
validation:
