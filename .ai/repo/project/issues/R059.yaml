acceptance_criteria:
- "The rendered About timeline is byte-identical: the <ol class=\"osc-about-timeline\"> element of dist/index.html (src/index.html:2714-2884 at a19f1ff6) is extracted before and after the move and compared byte for byte for every existing station, in tests/unit/about-current.test.mjs."
- "(added) The 'before' side is a committed fixture from dist/index.html at ef959f5b, never git history at test time; a mutation (one character of a pre-move title, or a dropped attribute) fails the test."
- "(added) If byte identity is not reproduced, a recorded decision amends the criterion to whitespace-normalised equality and the test asserts that form; the test fails on its merge base."
