objective: "Lands as test(about), or fix(about) if the renderer changes. The pre-move <ol class=\"osc-about-timeline\"> from ef959f5b's dist/index.html is committed as a fixture under tests/unit/fixtures/; tests/unit/about-current.test.mjs compares the first 25 rendered stations against it, every attribute except the derived data-state of the station that was current then. Either renderStations reproduces the old wrapping of <time> so the comparison is byte for byte, or a recorded decision amends the criterion to equality after whitespace normalisation. The test never reads git history, so it runs in a shallow CI clone."
why: "Split from R032 (criteria 4, copied verbatim) by the audit-and-stamp follow-up train of 2026-11-18 (oscilla-d9, under the triage the owner approved on 2026-11-18, relayed by oscilla-e5, Q112). Re-run on main 8e087873: no such comparison exists in about-current.test.mjs. Measured: the dist <ol> at ef959f5b and at 7ec17bf1 is 8454 bytes in both, byte-equal false, equal after whitespace normalisation (each <time> used to wrap over two lines); today 24 of the 25 pre-move stations are whitespace-equal and the 25th differs only by data-state current to done."
current_state: "Filed 2026-11-18 by oscilla-d9 in the audit-and-stamp follow-up train; not started."
