objective: "Lands as feat(studio). Six templates under src/js/studio/templates: a filter-envelope synth on the existing Envelope CONTROL output, an FM bell (K010), a ring-mod (a Gain with a bipolar audio-rate LFO edge, K010), a drive lead (K012), a macro pad (K013) and a step-modulator bass (the existing Step on a log edge). No template names a commercial product or claims analog modelling (D1). The six land together after K010, K012 and K013; the filter-envelope synth and the step-modulator bass need nothing new but ride with the pack, so the templates are pinned and re-pinned (K022) once."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
