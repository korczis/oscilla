acceptance_criteria:
  - "F2 remainder: an automation lane that owns the Y target is reflected in the Y readout, or the readout says the lane owns it; a unit test fails first."
  - "F4: the Y ends refresh during a knob drag on the target, not only on a rate change, with no layout read while drawing; a unit test fails first."
  - "F5: the phone readout does not clamp or clip at 320 and 375 px with the longest target and the held label, checked in tests/browser/xy-pad.cjs through the suite harness with wait.cjs deadlines."
  - "F6: the ring and readout numbers use tabular-nums through the existing Tailwind or Flowbite class, so they keep their width as values move; the Flowbite Pro baseline does not grow."
  - "F7: the dead model.key('Home') call in tests/unit/xy-wiring.test.mjs is removed, with a test that would catch a no-op key line."
  - "The pad stays a consumer of the shared control families (M123 G021-G026); no parallel widget."
  - "The pull request carries a reviewer's verdict (src/js/synth is guarded); done only after each criterion is re-checked on a main commit."
validation:
