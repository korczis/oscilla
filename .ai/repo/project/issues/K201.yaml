objective: "Lands as fix(synth), built by 26 after the pad view (#426). af's review of #426 left five P3 findings as follow-ups (F2 remainder, F4, F5, F6, F7); after this the pad's readouts are true whatever sets their target, keep their width, fit narrow phones, and their tests have no dead lines."
why: "af's independent review of OSCILLA #426 (2026-11-05, workflow wf_bd31b32f-824) and 26's proposal of this record; the owner's 'no kaosspad' and 'arturia like or ims20 like is the target' orders."
