id: K154
milestone: M120
serves:
  - "connected-instrument#riff-library"
title: "Audition a library entry through the one engine and its output owner, before it is inserted"
slug: audition-a-library-entry-through-the-one-engine
priority: p2
profile: implementation
objective: "Add Audition to each entry of the patch library's Riffs category: it plays the entry through the one AudioEngine as Q032's ephemeral audition (a banner names what is heard; it ends on Escape, Stop, any edit or another entry; it is never saved, hashed or recorded in provenance) and takes the output owner like any other source, so it is refused while MEASURE holds the output."
why: "A user cannot hear a riff before inserting it (R00: no preview anywhere); the owner's pack asks for a real preview through the same engine, never a decorative waveform."
scope:
  - "src/js/studio/riffs"
  - "src/js/ui/patch-browser.js"
  - "tests/unit/riff-audition.test.mjs"
  - "tests/browser/synth.cjs"
  - "dist/index.html"
  - "tests/README.md"
depends_on:
  - "K149"
acceptance_criteria:
  - "Before: VERIFIED (R00 audit 2026-11-02): the Riffs category has Insert only; no entry can be heard before it is inserted."
  - "After: Audition plays the entry; the engine's spectral peak at the first note matches the entry's first pitch within one semitone (synth.cjs s-riff-hear, chromium, firefox, webkit, file:// and /oscilla/); Stop, Escape or opening another entry leaves 0 active sources within 1.5 s; the Studio document's hash is unchanged by an audition."
  - "Negative cases: an unknown entry id, an audition while MEASURE owns the output, and a second audition while one plays (the first ends) are refused or handled with a stated reason; no AudioContext is created by a bare click (rule project.a-phone-sounds)."
  - "Fail-first: tests/unit/riff-audition.test.mjs fails on the merge base (no audition module)."
validation:
  - "node --test tests/unit/riff-audition.test.mjs"
  - "node tests/browser/synth.cjs --only s-riff-hear"
evidence_required:
  - "verified"
created_at: 2026-11-02
