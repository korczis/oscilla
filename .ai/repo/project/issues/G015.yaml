id: G015
milestone: M087
serves:
- "component-system#in-app-explain"
title: "What is this: one panel says what a component does, where else it is used and opens its related views"
slug: what-is-this-one-panel-says-what-a-component-does-where-else
priority: p2
profile: implementation
objective: "Lands as feat(ui). A Pro drawer, src/js/ui/catalog/explain.js, reads the bundled registry: the component's label and one-sentence docs, its unit, range and default, who owns its value and where it is kept (sources.js: 'This Filter Lab setting is saved in a configuration file only'), the other places it appears (each a component address, G007), and its related views (each a link: its lab, its Studio node, its Learn topic); with ?debug=1 also its source module, tests and plan ids. It opens from the context menu of any catalogued control (and the knob and box menus of the synth and Studio lines), from Help > What is this? (the next activation explains instead of acting; Escape leaves), and by a key chosen under ADR 0050 and listed in the Keyboard shortcuts dialog. Before: VERIFIED no such surface; help is per workspace text. After: every component explains itself from the same declaration the docs come from. Negative cases: a component without related views (the panel says so, never an empty list), What is this? on a disabled control (it states the reason), an open dialog (the drawer stacks above with focus trapped and returned). Rollback: revert; no state."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
