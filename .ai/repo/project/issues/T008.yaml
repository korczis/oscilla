acceptance_criteria:
  - "Fail-first fixture: tests/unit/readout-labels-spectrogram.test.mjs: the key end ticks equal the view minDb and maxDb and the key text contains \"uncalibrated\"; the time tick at the right edge is \"now\" and at the left \"-<span> s\"; after freeze then unfreeze the renderer reports one marker column. Fails on the merge base."
  - "Negative cases, each asserted: Every existing analysis-spectrogram.test.mjs case passes (same colour for each dB value, row maps, silence gives the floor); the frequency axis is unchanged; claim spectrogram-mapping still holds."
  - "Revertible on its own: Revert: view code and markup; stored data unaffected (nothing is stored)."
  - "Fail-first (project.fail-first): the named unit test fails on the merge base and passes on the head."
