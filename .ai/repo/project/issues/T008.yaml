title: "Every spectrogram time axis is anchored at now and marks its pauses, and every colour key names the analyser scale"
slug: every-spectrogram-time-axis-is-anchored-at-now-and-marks-its
priority: p2
profile: implementation
objective: "Truth-table rows SPC-10, SPC-11, SPC-12, MIC-22 (scratchpad p05/truth-table.md). K033 (M062) generates the colour key of all three hosts from minDb and maxDb; this issue makes its visible text say \"dB rel. analyser, uncalibrated\". Time ticks read \"-10 s … now\", the aria-label says so, and the first column after a pause is a marker column the view labels. The data and the LUT mapping are unchanged (P05 non-goal: no DSP change for chart cosmetics)."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): The Spectrogram panel colour bar reads \"0 dB … -100\" in raw analyser dB, the alternative ADR 0017 rejected, and its top 7.5 dB cannot be reached (a full-scale sine sits at -13.5 dB). The Analysis-tab and microphone spectrograms have no key at all. \"0s\" labels the oldest column, so an event drawn at \"8s\" happened about 2 s ago, and a Freeze or hidden tab joins columns with no mark."
