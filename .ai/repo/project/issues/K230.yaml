title: "The envelope node gets a delay and a hold stage (DADSR, AHDSR); EG 1 shows Delay and EG 2 Hold on the Synth panel"
slug: the-envelope-node-gets-a-delay-and-a-hold-stage
priority: p2
profile: implementation
objective: "Lands as feat(studio). The Studio envelope node (nodes/modulation.js envelope, compiled by audio/envelope.js applyAdsr) gets two declared parameters: delay (0 to 10 s, default 0: the time from the gate to the start of the attack) and hold (0 to 10 s, default 0: the time the envelope stays at its peak before the decay). With both at 0 the envelope is exactly today's ADSR, so the defaults leave every sound unchanged. They are new parameters on an existing type, so they land in hash epoch 3 (schema.js HASH_EPOCH_PARAMS, STUDIO_HASH_VERSION 3) together with K229's LFO parameters, in one release (D2: every new parameter on an existing type lands in one epoch); a record hashed under epoch 2 still verifies while both are 0. Every place that reads the envelope's length reads the new stages: the gate unions and release of the transport, a trigger's pulse (transport.js pulseS: delay + attack + hold + decay), the live router's gates and the offline render. A gate that ends inside the delay releases without an attack, one that ends inside the hold releases from the peak. On the Synth panel EG 1 shows Delay and EG 2 shows Hold (D11 knobs, Czech labels), each with its range declared; the other stage stays at 0 and hidden on that module, by declaration. Before: the envelope is ADSR only, so a delayed attack or a held peak needs a second node. After: one envelope plays DADSR and AHDSR. Rollback: revert the pull request; a document saved with a delay or a hold is then refused by the import pipeline with its sentence, so after a release the epoch stays and only the panel knobs are removed."
why: "Owner direction of 2026-11-09, relayed by the integrator oscilla-43: three more screenshots of the semi-modular tablet instrument the owner asked to split into functional components show its EG 1 with a delay stage and its EG 2 with a hold stage; functional only, no trade dress or labels (project.visual-identity-lock). The Studio envelope is ADSR only (nodes/modulation.js) and no issue adds the stages. Checked against train/t4-sequencer 0f9403d8."
