acceptance_criteria:
  - "tests/unit/studio-envelope-delay-hold.test.mjs, failing on the merge base: the envelope type declares delay and hold (0 to 10 s, default 0) in hash epoch 3, and every record hashed under epoch 2 verifies through studioHashAt while both are 0; every pinned template studioHash is unchanged; with delay 0 and hold 0 the scheduled events equal today's ADSR events exactly; a delay of 0.2 s moves the attack's start 0.2 s after the gate, a hold of 0.3 s keeps the peak 0.3 s before the decay; a gate ending inside the delay schedules no attack and a release, one ending inside the hold releases from the peak; a trigger pulse holds delay + attack + hold + decay; the gate union of overlapping gates (V272 B9) still holds with both stages."
  - "tests/browser/instrument-dsp.cjs renders offline at 44.1 kHz and 48 kHz an EG with delay 0.1 s and hold 0.2 s: the level is below -60 dB for the delay, at the peak within 0.5 dB for the hold, and the stages start within one frame of their computed times; no sample rate assumed."
  - "A browser check in tests/browser/synth.cjs (run by npm run test:synth): EG 1's Delay and EG 2's Hold turn by pointer, keyboard and touch; each shows in the Studio graph and Inspector at the same revision; a key held through a delay sounds only after it, within a named until() deadline of tests/browser/lib/wait.cjs; inside tests/browser/lib/suite.cjs; tests/browser/timing-baseline.json does not grow."
  - "Every edit is one undoable dispatch through the one Studio store (project.studio-model-is-canonical); envelopes stay click-free (segments at least 1 ms, ramps never reach exactly zero) and all timing is on the audio clock (project.audio-engine-discipline)."
  - "Every string it adds is Czech (project.czech-prose) and passes tests/unit/synth-wording.test.mjs (no product, brand or model name); the UI is Flowbite Pro and the D11 knob; scripts/size-report.mjs shows at most 1 KB gzip added; a reviewer's verdict for the guarded paths (project.review-verdict); tests/README.md has a row for each new test; dist is rebuilt."
