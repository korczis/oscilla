acceptance_criteria:
  - "tests/unit/synth-mg-sync-morph.test.mjs, failing on the merge base: the LFO type has a reset TRIGGER input, a 'morph' shape option and a morph parameter listed in hash epoch 3; every record hashed under epoch 2 still verifies through studioHashAt while morph is at its default, and every pinned template studioHash is unchanged; a Keys gate fanned to mg.reset restarts the phase at the gate's audio time (the scheduled phase reset lands at that time, on a Clock-driven gate and on a live key alike); the panel's Key sync switch adds and removes the Keys Gate to mg.reset normal as one history entry, undo restores the model exactly; the panel no longer fixes sync and its MG declares the sync divisions; the morph curve at 0, 0.25, 0.5, 0.75 and 1 equals triangle, the triangle-saw mix, sawtooth, the saw-square mix and square within a stated tolerance."
  - "tests/browser/instrument-dsp.cjs renders offline at 44.1 kHz and 48 kHz: an MG synced to 1/4 at 120 BPM has a 0.5 s period within one frame; key-synced, two notes 0.3 s apart start the MG at the same phase; morph 0 and 1 give a triangle's and a square's odd-harmonic ratios within a stated tolerance; no sample rate assumed."
  - "A browser check in tests/browser/synth.cjs (run by npm run test:synth): Key sync, the sync division and the Morph knob work by pointer, keyboard and touch; each shows in the Studio graph and Inspector at the same revision; a key pressed twice restarts the MG audibly in the scope probe within a named until() deadline of tests/browser/lib/wait.cjs; inside tests/browser/lib/suite.cjs; tests/browser/timing-baseline.json does not grow."
  - "Every edit is one undoable dispatch through the one Studio store (project.studio-model-is-canonical); every node it plays is built through the engine with track()/source() accounting, all timing on the audio clock, census 0 after stop (project.audio-engine-discipline)."
  - "Every string it adds is Czech (project.czech-prose) and passes tests/unit/synth-wording.test.mjs (no product, brand or model name); the UI is Flowbite Pro and the D11 knob; scripts/size-report.mjs shows at most 2 KB gzip added; a reviewer's verdict for the guarded paths (project.review-verdict); tests/README.md has a row for each new test; dist is rebuilt."
