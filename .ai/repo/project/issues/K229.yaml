title: "The Synth panel's MG gets key sync, tempo sync and a continuous waveform morph"
slug: the-synth-panel-mg-gets-key-sync-tempo-sync-and-a-waveform-morph
priority: p2
profile: implementation
objective: "Lands as feat(synth). Three things the panel's MG (an LFO node, src/js/synth/panels/semi-mono.js) lacks. (1) Key sync: the LFO node gets a reset TRIGGER input (a new port, which leaves every pinned studioHash unchanged, D2); a trigger on it restarts the LFO's phase at that time on the audio clock. On the panel a Key sync switch (Czech label) adds or removes the normal from the Keys Gate to mg.reset, one undoable dispatch, so each note-on restarts the MG; a cable the user patches into the jack does the same. (2) Tempo sync: the panel stops fixing sync to 'off' and shows K022's sync divisions (syncParam, 1/1 to 1/32 of transport.tempo) beside the rate, so the MG follows the one transport; free (off) stays the default. (3) A continuous morph: the LFO node gets a shape option 'morph' (a new enum option, no epoch) and a morph parameter (0..1, triangle at 0, sawtooth at 0.5, square at 1, linear crossfade between neighbours, modulatable through a CONTROL input). The parameter is new on an existing type, so it lands in hash epoch 3 (schema.js HASH_EPOCH_PARAMS, STUDIO_HASH_VERSION 3) together with K230's envelope parameters, in one release (D2: every new parameter on an existing type lands in one epoch). The panel's MG shows the Morph knob in place of the two-shape enum. Before: the MG free-runs from PLAY, cannot follow the tempo and has two shapes. After: it restarts on each note when asked, follows a tempo division and morphs continuously. Rollback: revert the pull request; a document saved with morph, the new shape or a reset edge is then refused by the import pipeline with its sentence, so after a release the epoch stays and only the panel controls are removed."
why: "Owner direction of 2026-11-09, relayed by the integrator oscilla-43: three more screenshots of the semi-modular tablet instrument the owner asked to split into functional components show its modulation generator with key sync, tempo sync and a continuous waveform morph; functional only, no trade dress or labels (project.visual-identity-lock). Today the panel fixes the MG's sync to 'off' (K022-3) and offers two shapes. No issue covers it (K092's morph is the wavetable engine's). Checked against train/t4-sequencer 0f9403d8."
