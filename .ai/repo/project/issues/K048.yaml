title: "Studio inspector plots for the Filter, Envelope, Sweep and LFO nodes"
slug: studio-inspector-plots-for-the-filter-envelope-sweep-and-lfo
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). A new src/js/ui/studio/inspector-plots.js with a hook of under 1 KB in the inspector (inspector.js is 73 184 of 81 000 B; E004 splits it). It lands after K016 and K019, which add the live-view and Step-bar cards to the same inspector, so the cards stack in one order. Filter: filter-chart.js from handle.info.stage.getResponse while running, captioned \"browser response\"; while stopped, what Q011 (OD4) decides: the plan recommends a new src/js/charts/biquad-response.js (the biquad formulas the Web Audio specification defines for BiquadFilterNode, with the dB-valued Q of low- and high-pass), captioned \"computed (Web Audio biquad formulas)\", because no probe node may be created outside the engine; a modulated cutoff shows modulationRange as a shaded \"cutoff sweep range\". Envelope: envelope-graph.js with the K045 axes. Sweep: \"REQUESTED INSTANTANEOUS FREQUENCY\" from visualization/motion.js and audio/patterns.js planFreqAt. LFO: two periods of shape x depth in the target's unit when a MOD edge exists, captioned \"ideal shape; the browser oscillator is band-limited\". Each plot is a kit host with the keyboard cursor and announced readout. Every drag previews and dispatches one store action at pointerup; Escape and pointercancel revert the drag and Escape still propagates; the numeric fields stay the editing keyboard path (project.studio-model-is-canonical). Random is out (it would need adapter changes)."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
