acceptance_criteria:
- "tests/unit/ui-link-graph.test.mjs fails on the merge base, and fixtures make it fail on a related view three steps away, a related view reachable only through the What is this panel or the navigation, a relation rule whose join yields nothing, an undeclared producer and an exemption that rises or returns; the real graph passes with its exemptions listed."
- "A declared link counts as an edge only with the control that realises it: each row of the generated map names that control's hook, the unit test refuses a link whose row names none, and the browser walk fails a row whose control is missing or hidden."
- "The browser walk runs in Chromium, Firefox and WebKit from file:// and the sub-path through npm run test:browser; the pull request states the wall time the walk adds per browser and origin, and if test:browser would then exceed 10 of the 15 minutes its CI step allows per browser, the walk moves to its own npm script and CI step, the scope widens to .github/workflows/ci.yml and a reviewer's verdict is required; otherwise no workflow file changes and no .github verdict is needed."
- "Definition of done, extends: the declarations of G001, the addresses of G007 and the link-integrity crawl of links.md; the integration map of K075."
- "Definition of done, interlinks: it is the check of 'everything interlinked with everything'."
- "Definition of done, interactivity: every edge is activated by pointer, keyboard and touch."
- "Definition of done, docs, menus and routes: docs/ui-catalog.md gains the link section, generated. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: tests/browser/ui-link-graph.cjs, as described, each wait an until() with a named deadline ('link target focused', 2 s). The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no verdict is needed unless its scope widens to one; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "Before Pro (it may land before F001): it adds no class token, selector, markup surface or inline style and only removes legacy ones, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls (node scripts/ui-flowbite-pro-record.mjs --check passes, rewritten only where a count fell) and node --test tests/unit/ui-flowbite-pro.test.mjs passes; studio.css, studio-timeline.css, charts.css and tokens.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock v2)."
- "scripts/size-report.mjs shows at most 0 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
