id: G016
milestone: M087
serves:
- "component-system#interlinked"
title: "Everything interlinked, checked: the link graph is generated from the declarations and every component reaches its related views in at most two steps"
slug: everything-interlinked-checked-the-link-graph-is-generated-f
priority: p2
profile: implementation
objective: "Lands as feat(test). The link graph's nodes are the workspaces, panels and catalogued components; its edges are containment (a component is shown in its panel and workspace) and the declared links, each realised by an in-content control (neither the global navigation nor the What is this panel of G015 counts: the navigation reaches every workspace in one step, as links.md's reachability matrix notes, and the panel lists every related view of every component, so either would make the property true by construction). A step is one activation (a click, Enter, a tap) of a visible control that is not inside the navigation or that panel; scrolling and focus moves are not steps. Derived relations are computed by rules listed in one table, src/js/ui/catalog/links.js RELATION_RULES, each with its registry and its join key, and a unit test that prints the relations each rule yields: a lab parameter relates to the Studio node type whose parameter shares its section 79 unit and its role, from an explicit pairs list where the join is not unique (Filter Lab cutoff to the Filter node's frequency), a Studio node type to its lab (links.md P7), a Learn topic to its tool (P5, LEARN_TOPICS.tool), a lab to its template (P3); a hand-listed related entry is allowed but counted apart, so the generated catalogue shows how much of the graph is derived. tests/unit/ui-link-graph.test.mjs fails when a component's derived or declared related view is more than two in-content activations away and it carries no exemption (a reason of at least three words, in an exemption list that only shrinks), and when a producer of a link (a data-osc-link attribute, an open-kind declaration, an href to a route) has no declaration. The integration map of the synth line (tests/browser/integration-map.json, K075) is this graph's generated output when K075 is on main, not a second table; K075 has no dependency and lands first in every order the plans allow, so it owns the file and this slice converts it: a K075 row whose producer is not yet declared is kept as a hand row until its declaration exists, and no row leaves the map in the conversion. The property is judged over the whole catalogue, so this slice waits for G018 and G019 (every hook declared); before them a related view of an undeclared component cannot be checked. If K075 has not landed, this slice defines the data-osc-link marker K075 describes. tests/browser/ui-link-graph.cjs (reusing the link-integrity crawl of links.md section 6 where it has landed) walks every edge by pointer, Enter and a hasTouch tap and checks focus on the target heading, Back and Forward. Before: VERIFIED 17 controls switch workspace, 6 are one-way, P1-P11 missing (links.md). After: a property the gate checks. Negative cases: a removed link control, a target refused by the router, a new producer without a row. Rollback: revert; tests and data only."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
