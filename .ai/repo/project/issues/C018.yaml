id: C018
milestone: M090
serves:
  - "coherent-state#saved-state-is-honest"
title: "Presets, History and the config link restore the lab settings they claim"
slug: presets-history-and-the-config-link-restore-the-lab-settings
priority: p2
profile: implementation
objective: "Lands as feat(config). Finding persist-3. Custom presets, History entries and Copy config link store serializeConfig, which holds only instrument keys, so the Filter, Envelope, Additive and Phase & Stereo state is lost on every one of them while the link toast says 'The link restores these settings'; only the config file carries them. The V1 serializeConfig, serializeHash, restoreFromHash and the preset schema v1 cfg stay unchanged (ADR 0014 golden vectors, ADR 0045). Add an optional sibling labs on preset and History records holding the four lab sections built as buildConfigExport builds them, applied through one function extracted from applyImport (so the limits of C017 are reported here too); a record without labs behaves exactly as now. History snapshots the labs at play time. The sequence stays out of presets and History. For the link, src/js/ui/navigation.js configLinkHash adds one compact key outside INSTRUMENT_HASH_KEYS (for example lab=, base64url JSON of the four lab sections, no sequence, per section 200 'no huge state in URLs'), registered as a hash domain in the ADR 0045 dispatcher so that a refused value is named; the gain cap still applies. The link toast and the save dialog say what is included and that the sequence travels in the config file."
why: "Owner brief OSCILLA PACK 03, 'One Instrument, One Coherent State' (2026-10-29): every control must provably reach its subsystem and every view that reflects it, and be covered by a test (owner: 'filters, sequencer, bpm and many other interactive knobs / sliders / control elements are not reflected / working / tested'). The findings named here were reproduced by an independent skeptic on a fresh export of origin/main b67d1e58 (v3.13.0)."
