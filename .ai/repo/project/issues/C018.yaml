acceptance_criteria:
  - "A unit test: a preset saved with filter 300 Hz Q 4, ADSR a 0.5, Additive on and pan 0.5 restores those labs after they were changed, and a v1 record without labs loads as on the merge base; it fails on the merge base."
  - "Browser check `lab-state-round-trip` in tests/browser/navigation.cjs: the preset, the History recall and the copied link opened in a fresh page each restore the Filter, Envelope, Additive and pan settings, and the link toast names what it restores and that the sequence is not included."
  - "node --test tests/unit/freeze.test.mjs tests/unit/freeze-guard.test.mjs passes unchanged (V1 hash, presets and storage migration)."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/core/storage.js (project.review-verdict); the builder never writes it. This applies only if storage.js changes."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node tests/browser/navigation.cjs"
  - "node --test tests/unit/freeze.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
