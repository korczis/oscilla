title: "The response cursor names its spread statistic and shows the SNR floor as a floor"
slug: the-response-cursor-names-its-spread-statistic-and-shows-the
priority: p2
profile: implementation
objective: "Truth-table rows MSR-19, MSR-21, MSR-12 (scratchpad p05/truth-table.md). The cursor says \"±x dB (1 SD, N runs)\" for mean aggregation and \"MAD x dB (unscaled), p10-p90 lo…hi dB\" for median, the limits taken from the drawn envelope; a floored point reads \"SNR ≤ −60 dB (not above the noise estimate)\"; the spread uses the table's round-up rule. Stored values keep the -60 encoding (ADR 0024)."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): With median aggregation the cursor prints the unscaled MAD as \"Run spread ±0.3 dB (5 runs)\" beside a drawn p10-p90 envelope of -0.84/+0.98 dB. Where band power does not exceed the noise estimate the per-point SNR is stored as the -60 dB floor and printed as \"SNR −60 dB\" (58 of 479 points in fixture F2). The same data reads \"±0.0 dB\" at the cursor and 0.1 dB in the table."
