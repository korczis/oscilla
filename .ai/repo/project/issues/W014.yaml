title: "Track header kind: name, kind, target and clips on every Studio track, rename by TRACK_UPDATE, mute, solo and arm only where they exist"
slug: track-header-kind-name-kind-target-and-clips-on-every-studio
priority: p2
profile: implementation
objective: "Lands as feat(studio). src/js/ui/kinds/track-header.js renders the Studio timeline's track headers (role=rowheader, named 'Bass, instrument track, plays Synth 1, 4 clips'); F2 renames through a new TRACK_UPDATE { name } action in src/js/studio (reduced, validated, undoable; no rename exists today, VERIFIED by the action names under src/js/studio); Enter selects (SELECTION_CHANGE); the target opens its node in the graph; mute and solo appear only on a track with a channel node (K107), arm only once recording exists (K113), collapse is view state; 120 px headers with 44 px buttons at 390 px. K111 then renders the arrangement's headers through it. Before: headers show name, kind, target and count with no action. After: a track header kind. Negative cases: an empty or 200-character name (refused with a sentence); arm in the model or the hash (never); mute without a channel (absent). Rollback: revert; a saved name change is an ordinary track name. Merged plan of the component follow-up (2026-10-30): Mute, solo and arm are buttons (no M, S or R key); F2 renames. K111 depends on W014."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
