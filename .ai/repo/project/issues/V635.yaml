id: V635
milestone: M054
serves:
- "ui-current#phone-whole"
title: The Synth's dock never buries its panel on a phone, and its text is readable
slug: the-synths-dock-never-buries-its-panel-on-a-phone
priority: p1
profile: implementation
objective: "Make the Synth workspace usable on a phone (390x844, coarse pointer). Below sm the dock fixed over the view shows its keys and the Octave buttons; its instrument row, Arm and Velocity unfold from a More button (aria-expanded), so the dock is about 200 px instead of most of the screen. The Synth view pads its bottom by the band the dock covers, --osc-dock-h (the synth train's one writer), so its last control scrolls clear of the dock at every width. The Synth's text classes under 12 px apply from xl only, with text-xs (12 px) below, so a phone reads 12 px and the desktop keeps its size."
why: "Owner direction of 2026-11-02, in Czech: \"vyrazne vymazli to ui, ty synths, musi fungovat suprove i na mobile phone\" and \"musi fungovat klavesnice\". Measured on v3.14.1 under iPhone 13 emulation: the Synth dock covered Arm, Open in Studio, Copy link and the Panel, Engines and XY tabs (elementFromPoint), and 172 text runs were under 12 px."
