acceptance_criteria:
- "Before: VERIFIED: at 390x844 under touch the Synth dock covers the view's actions and tabs, and 172 text runs are under 12 px."
- "After: the dock shows the keys and Octave with More, the view's actions and tabs show above it, and no Synth text outside the patch bay's SVG drawing is under 12 px."
- "Negative cases: from sm up the dock shows every row as before and More is hidden; from xl the Synth's small labels keep their measured sizes."
- "Rollback: revert the merge commit; no stored record or schema changes."
