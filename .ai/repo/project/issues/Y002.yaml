title: "GL core: capability probe, WebGL 2 or 1 or Canvas 2D per view, a context budget, loss fallback and the GL test harness"
slug: gl-core-capability-probe-webgl-2-or-1-or-canvas-2d-per-view
priority: p2
profile: implementation
objective: "Lands as feat(charts). New modules under src/js/charts/gl/ (never a components, widgets, ui-kit or design-system path): caps.js probes once, lazily on the first GL host, WebGL 2 then WebGL 1 with failIfMajorPerformanceCaveat true, premultipliedAlpha and preserveDrawingBuffer false, and returns a frozen capability record (version, R8 or LUMINANCE level textures, vertex texture units, a float or half-float colour buffer, element_index_uint, MAX_TEXTURE_SIZE); choose.js is pure: from a view's declared needs, the record, the ?gl= override (auto, 2, 1, 0; 'sw' accepts a major performance caveat, for CI legs Y001 found on a software rasteriser only) and the stored renderer preference it returns { backend, reason } with the reason as a sentence ('WebGL 2', 'WebGL 1: no float colour buffer, persistence quantized', 'Canvas 2D: WebGL unavailable', 'Canvas 2D: ?gl=0'); pool.js holds at most the context budget Y001 measured (default 4, under every observed browser limit), hands a context to the views in host order and gives the rest Canvas 2D with the reason 'Canvas 2D: GL context budget in use'; program.js compiles and links a shader pair from string literals with the info log in the error; view.js is the one renderer contract, createLiveView(host, { kind, needs, axes, gl, fallback }), whose gl and fallback objects expose mount, resize, frame(now), drawOnce and destroy, so every GL view has a Canvas 2D twin that draws the same data. A webglcontextlost event is preventDefault-ed, the view switches to its 2D twin within one frame keeping its CPU-held data, and webglcontextrestored re-uploads once and switches back. Resize follows the host's ResizeObserver at devicePixelRatio capped at 2. Every GL view is a frame-loop subscriber with its host (K036) and allocates nothing per tick: typed arrays, uniform locations and matrices are made at mount, no getParameter, getError or readPixels runs per frame, and WebGL 1 uploads from a preallocated column buffer instead of subarray(). axes.js defines axesOf(source), the frozen descriptor every GL view draws its axes from (sampleRate, fftSize, binHz, minHz, maxHz, scale, minDb, maxDb, column period, level unit), read from the analysis objects and never from constants. window.OSCILLA gains the observe member charts.renderers(), one { host, kind, backend, reason } per mounted view (ADR 0052, observe kind), registered from src/js/charts/wire.js (K028) so src/js/main.js gains no byte. Tests: tests/unit/gl-caps.test.mjs (the choose() decision table, the override parser, the pool, the loss state machine with a fake context), tests/browser/lib/gl.cjs (forces a backend, counts live contexts, spies drawArrays, drawElements and texSubImage2D, loses and restores a context through WEBGL_lose_context, reads pixels) and tests/browser/gl-renderers.cjs over a fixture view; chart-cost.cjs gets its GL section. It writes the ADR 'Live views draw on WebGL where it pays; Canvas 2D is the reference and the fallback' (status proposed, number assigned at landing) and docs/renderers.md, the renderer contract and the 'add a live view' guide."
why: "Owner orders of 2026-10-29 (session oscilla-b0, in Czech): add p5.js, WebGL and interactivity and deploy; plan WebGL renderers for the scrolling spectrogram (with a 3D option), a phosphor XY scope and a live spectrum, falling back to canvas/p5 when WebGL is unavailable, one frame loop with no per-frame allocation, the single file and its gzip budget, axes and units from the analysis (no-fake-science). Built on the M062 charts plan (#269, merged as cdda563c): the frame loop K036, the interaction kit K053, the shared zoom K052, the level history K033 and the chart-cost check of K036 are reused, never duplicated (components-followup/render-gl.md)."
