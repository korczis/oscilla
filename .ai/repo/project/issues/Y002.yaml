acceptance_criteria:
- "As a feat change it carries tests/unit/gl-caps.test.mjs: WebGL 2 is chosen when present, WebGL 1 when only it is, Canvas 2D when neither is, when a major performance caveat is reported (this branch is proven by this unit test only, against a fake context, because no gate leg reports the caveat: Y001), and in auto mode when the renderer string names a software rasteriser, which ?gl=2 overrides; a view needing vertex textures gets Canvas 2D with that reason on a WebGL 1 record with none; ?gl=0, 1 and 2 parse and an unknown value, sw included, is refused and named; the pool gives Canvas 2D beyond its budget; a lost context switches to the twin and a restored one switches back; and tests/unit/gl-view-contract.test.mjs: a fixture view written from docs/renderers.md mounts on both backends and its 2D twin draws the same data, which fails on the merge base (project.fail-first)."
- "tests/browser/gl-renderers.cjs: OSCILLA.charts.renderers() names the backend and reason of the fixture view; WEBGL_lose_context.loseContext() switches it to Canvas 2D within a named deadline with its data kept and restoreContext() returns it to GL; the live context count never exceeds the budget with more GL views mounted than the budget, the view the user opens gets GL while hidden views hold none, and across 20 cycles of mount, destroy, the ?gl toggles and the Settings switch the count stays within the budget with zero console errors in every engine (WebKit logs the 17th live context as an error, Y001); ?gl=0 mounts no GL context at all. Every GL check states per gate browser and OS whether it drew on WebGL 2, WebGL 1 or was skipped and the renderer string it observed, and asserts the observed backend against the expectation table of tests/browser/lib/gl.cjs, taken from the record webgl-in-the-gate-browsers, failing on a mismatch, so a leg that stops drawing GL or a skip the runner did not need is caught (no leg claims a GL path it did not draw); Y001 probed linux in the Playwright image, not on the ubuntu-latest runner, so this slice's first run on the runner confirms the table or corrects the record in the same pull request; the evidence names which legs ran parity on a hardware GPU: none in CI (linux and darwin Chromium headless are SwiftShader, linux Firefox has no context, linux WebKit's rasteriser is unidentified), so hardware parity is the darwin Firefox and WebKit legs of a local release-gate, and the same check runs with ?gl=0 on every leg and passes on the Canvas 2D path. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
- "tests/browser/chart-cost.cjs gains the GL core rows: its GL subscriber is a frame-loop subscriber with its host (K036) and allocates nothing per tick, shown by a differential figure because a page-wide ceiling cannot see one view (Y001 measured a 300 to 380 B per frame baseline the browser allocates whatever draws, and dist inlines every module into one script, so samples cannot be attributed by script as the spike's separate files allowed): Chromium CDP heap sampling at a 128 B interval over the same page and 300-frame window, three times each with the view on GL, on ?gl=0 and unmounted, interleaved; the view's increment, the median of mounted minus unmounted per frame, is at most 128 B per frame on each backend, a fixture view that allocates one 1 KB Float32Array per frame fails the check (the mutation is shown in the pull request), and the page-wide per-tick ceiling of tests/browser/chart-cost-baseline.json is not raised either; its draw calls per frame are counted by the gl.cjs spy and stay at the stated figure; its cost is the measure this slice defines for every Y view (gl-cost): per backend, five windows interleaved with the other backend's (GL, 2D, GL, ...), each 300 consecutive frame(now) calls of the subscriber after 60 warm-up calls, timed as one interval with two performance.now() reads, so the per-frame figure resolves to the leg's timer tick divided by 300 whether or not the page is crossOriginIsolated (the gate's python3 -m http.server sends no COOP or COEP header, so ticks are 100 us in Chromium and coarser elsewhere; the tick is measured at run time as the smallest non-zero step of performance.now() and recorded); beside it the synced figure, the same windows with a 1-pixel readback after each call so GPU and raster work count (Y001 found the ranking reversed there: raw GL ring 1.295 ms against Canvas 2D 0.24 ms synced in Chromium), and the live figure, the median rAF interval and the count of frames longer than 1.5 times the display's median interval over 300 live frames with the view drawing; the minimum detectable difference is the larger of 2 ticks / 300 and the spread (largest minus smallest) of either backend's five windows, and a smaller difference is a tie; the per-frame medians, the tick, the difference and the leg's renderer string are recorded for the GL and the Canvas 2D path in tests/browser/chart-cost-baseline.json, with the figures in the pull request; the GL path is the automatic choice for the view only where, on every hardware leg (darwin Chromium headed on ANGLE Metal, darwin Firefox and darwin WebKit, run one browser at a time on the Mac below OSC_LOAD_MAX by node tests/browser/chart-cost.cjs --legs hardware), it is faster than the 2D path by more than the minimum detectable difference in both the main-thread and the synced figure and has no more long frames; a tie, a loss or a missing hardware figure keeps the 2D path automatic and the baseline says why; the CI legs (SwiftShader Chromium, linux Firefox without GL, linux WebKit) record their figures and never decide; nothing is drawn while the host is hidden or Pause animation is on."
- "Shaders are string literals in the bundle: no fetch, no module script, no worker or worklet from a path, no new vendor library; npm run verify-dist passes and the page opens from file:// and the Pages sub-path with zero console errors on the Canvas 2D and the GL path (project.single-file-deliverable, ADR 0012)."
- "The view reads existing AnalyserNodes or the CPU-held analysis data on the main thread only, creates no audio node, adds no work to the audio path and writes no DOM per frame (project.audio-engine-discipline v2)."
- "It adds no markup, class name or stylesheet rule, so the Flowbite Pro ratchet is unchanged (node --test tests/unit/ui-flowbite-pro.test.mjs and node scripts/ui-flowbite-pro-record.mjs --check pass with the record untouched), and no new string or module name carries an osc- prefix (ADR 0061)."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed. It adds the observe member only and no drive or inject member (ADR 0052)."
- "The ADR names its related rules (single-file-deliverable, audio-engine-discipline, no-fake-science, visual-identity-lock) and ADRs 0012, 0013, 0016, 0052 and 0061, and passes majordomus adr check; docs/renderers.md is linked from README.md and from docs/EXTENDING.md where that guide exists."
- "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the Y line's figures stays within the component line's cap Q037 records, under the gzip budget of scripts/build-config.mjs (1 200 000 B since #279 landed, BUDGET.gzipBytes of scripts/build-config.mjs; dist measured 825 984 B gzip at f887066f; project.single-file-deliverable)."
- "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
