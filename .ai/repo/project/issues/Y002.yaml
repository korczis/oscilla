acceptance_criteria:
- "As a feat change it carries tests/unit/gl-caps.test.mjs: WebGL 2 is chosen when present, WebGL 1 when only it is, Canvas 2D when neither is or a major performance caveat is reported without ?gl=sw; a view needing vertex textures gets Canvas 2D with that reason on a WebGL 1 record with none; ?gl=0, 1, 2 and sw parse and an unknown value is refused and named; the pool gives Canvas 2D beyond its budget; a lost context switches to the twin and a restored one switches back; and tests/unit/gl-view-contract.test.mjs: a fixture view written from docs/renderers.md mounts on both backends and its 2D twin draws the same data, which fails on the merge base (project.fail-first)."
- "tests/browser/gl-renderers.cjs: OSCILLA.charts.renderers() names the backend and reason of the fixture view; WEBGL_lose_context.loseContext() switches it to Canvas 2D within a named deadline with its data kept and restoreContext() returns it to GL; the live context count never exceeds the budget with more GL views mounted than the budget; ?gl=0 mounts no GL context at all. Every GL check states per gate browser and OS whether it drew on WebGL 2, WebGL 1 or was skipped, with the reason Y001 recorded for that leg (no leg claims a GL path it did not draw), and the same check runs with ?gl=0 on every leg and passes on the Canvas 2D path. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
- "tests/browser/chart-cost.cjs gains the GL core rows: its GL subscriber is a frame-loop subscriber with its host (K036) and allocates nothing per tick (Chromium CDP heap sampling over a polled window, the per-tick ceiling of tests/browser/chart-cost-baseline.json not raised); its draw calls per frame are counted by the gl.cjs spy and stay at the stated figure; its main-thread time per frame (median and p95 of performance.now() around the subscriber) is recorded for the GL and the Canvas 2D path in tests/browser/chart-cost-baseline.json, with both figures in the pull request; the GL path is the automatic choice only where its median is not above the 2D path's, otherwise the 2D path stays automatic and the baseline says why; nothing is drawn while the host is hidden or Pause animation is on."
- "Shaders are string literals in the bundle: no fetch, no module script, no worker or worklet from a path, no new vendor library; npm run verify-dist passes and the page opens from file:// and the Pages sub-path with zero console errors on the Canvas 2D and the GL path (project.single-file-deliverable, ADR 0012)."
- "The view reads existing AnalyserNodes or the CPU-held analysis data on the main thread only, creates no audio node, adds no work to the audio path and writes no DOM per frame (project.audio-engine-discipline v2)."
- "It adds no markup, class name or stylesheet rule, so the Flowbite Pro ratchet is unchanged (node --test tests/unit/ui-flowbite-pro.test.mjs and node scripts/ui-flowbite-pro-record.mjs --check pass with the record untouched), and no new string or module name carries an osc- prefix (ADR 0061)."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed. It adds the observe member only and no drive or inject member (ADR 0052)."
- "The ADR names its related rules (single-file-deliverable, audio-engine-discipline, no-fake-science, visual-identity-lock) and ADRs 0012, 0013, 0016, 0052 and 0061, and passes majordomus adr check; docs/renderers.md is linked from README.md and from docs/EXTENDING.md where that guide exists."
- "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the Y line's figures stays within the component line's cap Q037 records, under the gzip budget of scripts/build-config.mjs (1 000 000 B on main at b67d1e58, 1 200 000 B once #279 lands; project.single-file-deliverable)."
- "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
