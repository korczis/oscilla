profile: implementation
objective: "Truth-table rows MSR-26 (scratchpad p05/truth-table.md). For full-overlap-tail the summary reads \"tail level ≤ X dB re peak (noise or unfinished decay)\" and the note gives the window it used (T1 to T2 ms after the peak) and says a decay still running there counts as noise, so lengthen the post-roll. No decay detector and no confidence figure."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): For a noise-free system whose decay outlasts the post-roll (T60 2 s, 0.5 s post-roll) the summary says \"noise tail −52 dB re peak\" and the note only \"Noise tail estimate: full-overlap-tail.\" The upper-bound caveat lives in impulse-response.js:53-55 and docs/v3/algorithms.md:800-802."
