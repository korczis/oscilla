acceptance_criteria:
  - "A browser check in tests/browser/synth-patch-bay.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base (the file does not exist there). Linked: a cable patched in the Synth panel is the edge the Studio graph shows at the same revision, and undo in the Studio removes it from the panel. Real-time: a dropped cable appears in the runtime's edge list and the destination's input level (a meter tap) rises; an audio cable dropped on a trigger jack adds no edge and announces 'Audio output cannot connect to a trigger input.', each within a named until() deadline. Interactive: connect and remove by pointer drag, by keyboard (Enter on a jack, choose from the list) and by touch tap-connect each run; jacks are buttons with accessible names and the cable list is a listbox in the accessibility tree. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "tests/README.md has a row for the new suite; package.json's test:synth names it."
