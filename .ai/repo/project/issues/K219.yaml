objective: "Lands as test(synth). K063's criterion 3 names tests/browser/synth-patch-bay.cjs, which does not exist. After K215-K218, the suite proves the bay linked to the Studio graph, real-time against the runtime and interactive by pointer, keyboard and touch, wired into npm run test:synth. Rollback: revert; tests only."
