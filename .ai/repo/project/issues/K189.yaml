acceptance_criteria:
  - "Slice 1 fail-first: tests/unit/engine-contract.test.mjs walks every registry type with notes or hits and fails on the merge base (capabilities.offline false, parameters without a unit or an automatable/modulatable answer, perc-voice's own envelopes); it checks census 0 after allOff, peak at or below the ceiling at full polyphony, no energy above Nyquist, a click-free largest sample step at on, off, steal and choke, and face keys equal to the declared keys."
  - "Slice 2: canConnect refuses an engine connection whose port type or direction the declaration does not allow, leaving the model unchanged; one case per engine (project.typed-ports, project.no-silent-feedback)."
  - "Slice 3: a static scan finds no createOscillator, voice allocator or inline ADSR outside studio/adapters/engine-hooks.js, audio/envelope.js and the voice host (sequencer/compiler.js and the V1 plan player import them); MIDI and Playground notes and the riff audition play through an engine node; the voice cap is one number with the Q021 law; K188's instance checks stay green; every offline render passes the engine ceiling chain."
  - "Slice 4: every engine preset names its type and scope, and applying one of node scope leaves sibling modules deep-equal; the runtime trace reports applies-now or next-note per parameter."
  - "The V1 freeze golden vectors (tests/unit/freeze.test.mjs) are unchanged with the labs off (ADR 0014)."
  - "Guarded paths (src/js/audio/*, src/js/studio/*, src/js/synth/*): every slice carries a verdict by prismatic-majordomus-98; oscilla-21 checks the synth values. Lanes: oscilla-26 (declaration, wiring, presets) and dev-53 (instantiation of A1-A3)."
validation:
