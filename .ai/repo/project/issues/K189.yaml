acceptance_criteria:
  - "Fail-first (declaration): tests/unit/engine-declaration.test.mjs walks every registry type with notes or hits and fails on the merge base where a declaration lacks capabilities {notes, hits, poly, offline}, a pitch/gate/velocity input or a chain port, or where face keys differ from the declared keys; the offline-render, perc-envelope and full-polyphony checks of 96daa67b moved to K191, which can make them pass."
  - "Fail-first (layers): tests/unit/engine-layers.test.mjs reads the import graph of the declaration, wiring, instantiation, preset and runtime modules and fails on the merge base naming src/js/studio/nodes/engines.js's import of src/js/synth/voice-pool.js (a declaration importing instantiation); this slice asserts the declaration layer, and K190-K192 each add their layer's case, so the four layers are proven separate when K192 lands."
  - "Parameters come from K105's contract: the test asserts every engine parameter's unit, range, default, mapping and automatable/modulatable answer is read from K105's declaration, with no second parameter table in this slice."
  - "Controls: the engine faces consume M123's one knob, switch and slider (G022, G023; component-system#one-implementation-per-family, origin/chore/plan-unified-controls) and add no parallel widget; Arturia and iMS-20 are a quality bar, not a look, and project.visual-identity-lock holds (owner, relayed by af 2026-11-05)."
  - "The V1 freeze golden vectors (tests/unit/freeze.test.mjs) are unchanged with the labs off (ADR 0014)."
  - "Guarded paths (src/js/studio/*): prismatic-majordomus-98 writes the verdict; oscilla-21 checks the synth values. Lane: oscilla-26."
validation:
  - "node --test tests/unit/engine-declaration.test.mjs tests/unit/engine-layers.test.mjs tests/unit/freeze.test.mjs"
  - "npm test"
evidence_required:
