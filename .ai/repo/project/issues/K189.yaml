title: "One voice wrapper over the five voice systems: declaration, wiring, instantiation, presets and runtime as separate contracts"
slug: one-voice-wrapper-over-the-five-voice-systems
priority: p0
profile: implementation
objective: "Lands as fix(engines) in four slices, each fail-first, following pack 06's split. af's engines audit of main 6d5efa89 found sound coming from five separate voice systems with no shared voice abstraction, polyphony model or note interface: (A1) the V1 plan player (audio-engine.js:503-629), (A2) the V1 note voices with their own 8-voice allocator and inline envelope (audio-engine.js:1071-1150), (A3) the sequencer compiler with its own createOscillator and LFO (sequencer/compiler.js:680, 933), (A4) the mono panel and XY pad (studio/adapters/instrument.js:48-230), (A5) the Synth engines on the voice host (studio/adapters/engines.js, voices.js:56-197); the riff audition and three templates rebuild engines from plain nodes. The seam is studio/nodes/engines.js:53-65 (the engine() declaration) and studio/adapters/voices.js (the host). Slice 1, DECLARATION: one engine declaration carries params (unit, range, default, mapping, automatable and modulatable or the reason not), ports (chain in, audio out, pitch/gate/velocity CV in) and capabilities {notes, hits, poly, offline}; the note interface noteOn/noteOff/allOff/hit is declared in studio/adapters/nodes.js. Slice 2, WIRING: every engine's ports are typed and validated by canConnect, and the panel's series chain gives way to declared jacks (the mixer stays K108). Slice 3, INSTANTIATION: the host provides allocation (synth/voice-pool.js, mono and legato through note-stack's mode), voicePeak, census through acct, Nyquist through safeMaxFor and the offline render through the ceiling chain; A2 notes and the riff audition move onto a default engine node; A3 and A1 import the shared primitives and keep their compilers; MEASURE stays outside by design. Slice 4, PRESETS AND RUNTIME: engine presets carry their type and scope (node, engine tab, panel), and the runtime reports per update whether it applies now or from the next note (K185's verbs)."
why: "The owner's complaint of 2026-11-04 (af session, Czech): 'the synthesis engines aren't pimped and formalized; they aren't wrapped in a single wrapper; not everything is connected as it should be; there is a lot of duplication'. af's engines audit wbukwud0a (inventory, contract audit and synthesis on origin/main 6d5efa89), and the oscilla-b0 Total Coherence pack 06 (Declaration, wiring, instantiation, presets, runtime). af's critique B2 (mesh, 2026-11-05) names the voice wrapper one of the two unminted core items. Related and cross-referenced, not re-derived: K105 (BLOCKED, engine parameter declarations), K090-K092 (derived BLOCKED although shipped in 2126f83b, #332; af's evidence work), K180 (the Q021 voice cap, origin/chore/plan-nav-folds), K071/K072 (to be re-scoped as perc-voice presets and outputs), K093-K095 and K088 (later engines onto the same contract)."
