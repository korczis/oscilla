objective: "Lands as test(browser). tests/browser/v3-ui.cjs:1432-1433 clicks [data-osc=\"exp.repeat\"] and, when the click throws, calls window.OSCILLA.app.experimentsRepeat(id) instead, so a dead, hidden or disabled button passes; tests/browser/control-census.cjs:1605 counts exp.repeat as driven by delegation to that check. The exp.select checkbox is never clicked. After: both are clicked, the effect is asserted at the experiments store and at the view, and a unit scan refuses any page.click(...).catch(() => page.evaluate(... OSCILLA.app.* ...)) pattern in tests/browser."
why: "oscilla-b0 Total Coherence audit of main 68b117f3, slice E, skeptic-verified (journeys gap 1, severity high): the only click-then-app-call fallback in tests/browser. C022 (BLOCKED) owns the control-drive ratchet as a whole; this slice is filed separately because C022's blocker forbids partial evidence."
