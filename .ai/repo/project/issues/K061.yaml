title: "Synth panel model: panel definition, normalling that a cable breaks and its removal restores"
slug: synth-panel-model-panel-definition-normalling-that-a-cable-b
priority: p1
profile: implementation
objective: "Lands as feat(studio). src/js/synth/panels.js defines the semi-modular voice (modules, their Studio node types and the normalling table N1-N15 of the design) as frozen registry-side data; src/js/synth/normals.js is pure: which jacks are normalled, which normal edges are present, the batch that patches a cable (EDGE_ADD plus EDGE_REMOVE of the jack's normals) and the batch that removes the last cable (EDGE_REMOVE plus EDGE_ADD of its normals), with deterministic normal ids <panel>-n<k>. 'New Synth voice' is one PATCH_INSERT. normalizeStudio, the import structure check of validate.js (node metadata allows only name today) and patches.js keep an optional presentation field metadata.panel = { id, module }, omitted when absent and excluded from executionState and studioHash; PATCH_INSERT of a panel gives it a new panel id, PASTE and DUPLICATE drop it (a copied module is a free node). A new guarded BATCH action reduces a list of edge actions, validates the result as a whole, passes transport.admit once and is one history entry, so patching over a normal while playing applies no in-between model (the store has no batch today; #268's handle.hold only merges change events). The normal invariant is a Synth projection, never a repair: the panel writes normals only through its own batches, and a normal deleted in the Studio graph stays deleted, the panel showing that jack 'open: normal removed in Studio' with a Restore normal action (one BATCH). Before: a voice must be patched by hand from empty. After: New Synth voice sounds with no cable; a cable breaks a normal and its removal restores it. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; an older normalizeStudio drops metadata.panel and keeps the nodes and edges, so only the grouping is lost."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
