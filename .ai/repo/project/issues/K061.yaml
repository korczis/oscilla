title: "Synth panel model: panel definition, normalling that a cable breaks and its removal restores"
slug: synth-panel-model-panel-definition-normalling-that-a-cable-b
priority: p1
profile: implementation
objective: "Lands as feat(studio). src/js/synth/panels.js defines the semi-modular voice (modules, their Studio node types and the normalling table N1-N15 of the design) as frozen registry-side data; src/js/synth/normals.js is pure: which jacks are normalled, which normal edges are present, the batch that patches a cable (EDGE_ADD plus EDGE_REMOVE of the jack's normals) and the batch that removes the last cable (EDGE_REMOVE plus EDGE_ADD of its normals), with deterministic normal ids <panel>-n<k>. 'New Synth voice' is one PATCH_INSERT. normalizeStudio, the import structure check of validate.js (node metadata allows only name today) and patches.js keep an optional presentation field metadata.panel = { id, module }, omitted when absent and excluded from executionState and studioHash; PATCH_INSERT of a panel gives it a new panel id, PASTE and DUPLICATE drop it (a copied module is a free node). A new guarded BATCH action reduces a list of edge actions, validates the result as a whole, passes transport.admit once and is one history entry, so patching over a normal while playing applies no in-between model (the store has no batch today; #268's handle.hold only merges change events). The normal invariant is a Synth projection, never a repair: the panel writes normals only through its own batches, and a normal deleted in the Studio graph stays deleted, the panel showing that jack 'open: normal removed in Studio' with a Restore normal action (one BATCH). Before: a voice must be patched by hand from empty. After: New Synth voice sounds with no cable; a cable breaks a normal and its removal restores it. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; an older normalizeStudio drops metadata.panel and keeps the nodes and edges, so only the grouping is lost. Amended 2026-11-07 (chore/plan-m064-rescope, the M064 audit of origin/main 37c52bee): the panel shipped through #367 (11cc9fbc) and Train 6 #420 (e8d54f8c) as one fixed instance, semi-mono-1 (src/js/synth/panel.js:81), inserted by one BATCH 'Insert <panel title>' (panel.js:228-243, src/js/synth/insert.js), not a PATCH_INSERT that renumbers it, because the one Synth workspace holds the one mono semi-modular panel (Q019; Q018, the owner's 'Nový workspace Synth'); PATCH_INSERT, PASTE and DUPLICATE drop metadata.panel (src/js/studio/actions.js:21; src/js/studio/patches.js copies only metadata.name). Criterion 1's PATCH_INSERT clause is re-scoped onto that design and keeps its old text in current_state."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
current_state: "Audited on 2026-11-07 against origin/main 37c52bee (oscilla-a3's M064 audit with the plan coordinator, tests run; chore/plan-m064-rescope). The core shipped through #367 (merge 11cc9fbc) and Train 6 #420 (e8d54f8c); #329 itself was never merged to main, its content landed through #367; .ai/repo/reviews/329.yaml, 367.yaml and 420.yaml say merge. Met on main: the inserted panel validates and its live model compiles (tests/unit/synth-panel.test.mjs:55); a cable into a normalled jack is one BATCH that breaks the normal, and removing it restores the normal with its id (synth-normals.test.mjs:14); a loop is refused with the feedback sentence (synth-normals.test.mjs:31); a normal removed in Studio stays removed and Restore is explicit (synth-normals.test.mjs:40); metadata.panel is kept by NODE_ADD and normalize, ignored by studioHash, checked on import and dropped by PASTE and DUPLICATE (synth-metadata-panel.test.mjs:17,33,47); a BATCH is one revision, one history entry and one gate call, and a refused step refuses it whole (studio-batch-action.test.mjs:17,34); the engine census is 0. Not met: tests/unit/synth-panel-normals.test.mjs does not exist (the cutoff cable in one history entry and its undo, a wrong-type cable, a deleted normal under an occupied jack, a panel BATCH whose second step is refused, a PATCH_INSERT that drops the tag); no offline non-silent render (tests/browser/instrument-dsp.cjs exists only on K060's unmerged branch); no browser check of Restore normal, the patches-dialog insert, the runtime's edge list (debugInfo) or the polite live region. The design's N12 ('Low-pass cutoff') is numbered differently in the shipped table (src/js/synth/panels/semi-mono.js): n12 is hpf.audio into lpf.audio, and the cutoff jack's normals are n21 and n22. Re-scoped: criterion 1's PATCH_INSERT clause, which was: \"PATCH_INSERT renumbers the panel id and PASTE and DUPLICATE drop it;\" (criterion 1 in full was: \"tests/unit/synth-panel-normals.test.mjs, failing on the merge base: the inserted panel validates, and with no user cable and one held note it renders non-silent in tests/browser/instrument-dsp.cjs on a real OfflineAudioContext (peak at or below the ceiling); a cable into Low-pass cutoff removes N12 in the same history entry and its undo restores it; removing that cable restores N12 with its id; a cable that closes an audio loop is refused whole with the no-silent-feedback sentence and leaves the normals as they were; every pinned template hash and every template's serialization are unchanged, and a model with metadata.panel round-trips through serialize, parse and the import pipeline; PATCH_INSERT renumbers the panel id and PASTE and DUPLICATE drop it; a BATCH that patches over a normal while playing calls transport.admit exactly once and a BATCH whose second step is refused leaves model, history and runtime unchanged.\")."
