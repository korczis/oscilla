title: "Node groups with exposed ports"
slug: node-groups-with-exposed-ports
priority: p2
profile: implementation
objective: "ADR 0030 records 'Groups and subgraphs: in neither 3.1.0 nor 3.2.0' and that adding them later needs a schema version bump and a migration (ADR 0023), with the release not decided. Before code, append a resolution note to ADR 0030 that says which release takes groups and how studioHash (src/js/studio/schema.js) treats them: a group is a model record that changes the hash, or view state that does not; the note records the choice and its consequence for an experiment that stored a Studio hash. Then group selected nodes into a collapsed node whose exposed ports are the connections that cross the group; enter it by double-click or keyboard, leave it, ungroup it; each is one undoable action of the StudioModel; the group record raises STUDIO_SCHEMA_VERSION with a migration (src/js/studio/migrate.js), import validation and limits (src/js/studio/validate.js), and round-trips through save, load and patch paste (specification sections 116-117). The group commands go through the graph module E003 splits out of workspace.js and the node panel E004 splits out of inspector.js, which is why it waits on both."
why: "V3.1 Studio specification (docs/specs/oscilla-v3.1-studio.md); .ai/repo/features/studio.md, \"What it does not do\". ADR 0030 decided against groups for 3.1 and 3.2 (critique studio-completion, groups-contradict-adr-0030)."
