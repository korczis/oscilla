acceptance_criteria:
  - "ADR 0030 carries the dated resolution note on the release and the hash before any group code lands; its sections above and its status stay as written."
  - "tests/unit/studio-node-groups.test.mjs: grouping, entering, leaving and ungrouping are each one undo step and undo restores the exact previous model; a schema-1 project migrates and loads; the compiled topology and the offline render of a graph are identical before and after grouping; it fails on the merge base."
  - "A connection that would cross a group boundary with mismatched types or form a feedback cycle is refused with the reason, as outside a group."
  - "studioHash follows the decision of the ADR 0030 note, and a test pins it."
  - "The pull request carries a reviewer's verdict and, as a feat change, fail-first (project.review-verdict, project.fail-first; src/js/studio is guarded); a capped file it grows past its cap is split first or its raise is declared in tests/unit/source-size-baseline.json's raises ledger."
