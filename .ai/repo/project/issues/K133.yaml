acceptance_criteria:
- "Before: VERIFIED (G5): no noise in the Playground; the Studio Noise node has white and pink."
- "After and negative cases: as the objective and the criteria below state; the setpoint (what was requested) and the observation (what the analyser measured on the digital output, or the microphone on the room) are separate readouts with separate labels, and no readout claims the acoustic output."
- "Rollback: revert the merge commit. Nothing changes the schema, a studioHash, URL key meaning or stored preset, so documents saved while it was live load unchanged after the revert."
- "Scientific-truth rows (Quantity | Unit | Source | Algorithm | Resolution | Calibration | Limitations | Tests | UI label) are added to T026's canonical readout table docs/v3/readout-truth.yaml and checked by T026's tests/unit/readout-provenance.test.mjs, which this issue extends so that each UI label's text is in the source, each Tests path exists, and a setpoint row never shares its label with an observed row: Noise RMS level (setpoint) | dBFS-like | plan | RMS normalisation of the seeded buffer (audio/noise.js normalizeRms) | 0.1 dB | none; SPL only under a valid LevelCalibration | before the -3 dBFS limiter and the output ceiling; statistical | tests/unit/generator-noise.test.mjs | Noise -20.0 dBFS RMS (requested) || Noise spectral slope (observed) | dB per octave | output AnalyserNode (digital, post-limiter) | average of N analyser frames, least-squares slope over log frequency | +-1 dB after N frames, N stated | uncalibrated | of the generated digital signal; the speaker and room change it | tests/unit/generator-noise.test.mjs | Slope -3.0 dB/oct (digital output, N frames)"
- "tests/unit/generator-noise.test.mjs, failing on the merge base: offline renders of each colour at 44.1 and 48 kHz have the stated RMS within 0.2 dB and slopes of 0, -3 and -6 dB per octave within 1 dB over 100 Hz-10 kHz (Welch average); the same seed renders the same samples; the voice's node census is 0 after stop."
- "Definition of done, extends: the pattern engine of S013 and the Studio Noise node (the same audio/noise.js)."
- "Definition of done, cross-links: the noise pattern survives a copied URL (round trip through url-state) and is shown as one source in the Signal Path tab. The link is a row of tests/browser/integration-map.json once that map (synth line K075) is on main."
- "Definition of done, dynamics: the spectrum shows the slope live while it plays."
- "Definition of done, docs and routes: README.md's Playground feature list and docs/GLOSSARY.md where a term is new; .ai/repo/features/playground.md (or the feature record of the Playground) says what changed; tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'noise' in tests/browser/generator.cjs selects Pattern, then Noise by keyboard, sets Colour to pink by pointer, presses Hold to Play by touch in a hasTouch context and waits with until() (deadline 'pink slope within 1.5 dB', 8 s) for an averaged analyser slope between -4.5 and -1.5 dB per octave over 200 Hz-5 kHz; copies the URL, reloads it and waits for the same pattern and colour; on the merge base the pattern does not exist. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit and the completed evidence the release that carried it; E030's judge passes on the pull request once E030 is on main."
- "The pull request carries a reviewer's verdict (it touches a guarded path; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
- "Wave 1: it adds no class token, selector, markup surface or inline style, so the Flowbite Pro record does not change: node scripts/ui-flowbite-pro-record.mjs --check passes with no rewrite and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro); live drawing is on a canvas, a domain view."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, within the owner's dist budget of 1 200 000 B gzip (decision of 2026-10-29, about 355 KB of headroom at origin/main b67d1e58); the ceiling of this line is 25 KB gzip in all (Studio boxes 35 KB, signal generator 25 KB), stated in the milestone (project.single-file-deliverable)."
