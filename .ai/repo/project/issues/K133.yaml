title: "Noise in the Playground: white, pink and brown, seeded, with its RMS level stated"
slug: noise-in-the-playground-white-pink-and-brown-seeded-with-its
priority: p1
profile: implementation
objective: "Lands as feat(audio). A pattern 'Noise' in the Tones group (src/js/audio/patterns.js), kind open, with Colour (white, pink, brown), Seed and RMS level in dBFS-like units; the existing pattern form renders its fields (no markup change). The engine plays it through createNoiseSource (audio/noise.js) inside its accounting, with the plan's release, the limiter and the output ceiling as for every voice. The help and the description say 'the spectral slope of the generated digital signal; the speaker and room change it'. URL state carries the pattern like every other."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings G1-G14 measured on origin/main b67d1e58)."
