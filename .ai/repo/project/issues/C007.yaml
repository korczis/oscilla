acceptance_criteria:
  - "A unit test with a mock engine: play with Additive and Envelope on, switch both off, _restart: the second play() receives adsr null and periodicWave null, and a dual voice restarted into a plan that needs no router receives dualRouter null; it fails on the merge base."
  - "A unit test: setPeriodicWave on a dual voice returns false and leaves both oscillator types unchanged; browser check `additive-skips-dual` in tests/browser/app.cjs toggles #osc-add-enable during a dual hold and finds both types unchanged."
  - "A unit test of scheduleAdsrStep: with s=0.1 the gain holds 0.1 mid-step for steps and finite const plans, and attack+decay+release fit inside a 10 ms step; browser check `adsr-reaches-programmed` in tests/browser/app.cjs: Sustain 0.10 typed into #osc-env-sustain-value gives -20 dB within 1.5 dB, 1 s into a finite tone and into a steps pattern, against the Envelope off."
  - "node --test tests/unit/freeze.test.mjs tests/unit/freeze-guard.test.mjs passes unchanged."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "engine.activeNodeCount returns to 0 after every stop in the new checks, in Chromium, Firefox and WebKit (project.audio-engine-discipline v2)."
  - "The pull request carries a reviewer-written .ai/repo/reviews/<pr>.yaml because it changes src/js/audio (project.review-verdict); the builder never writes it."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
