    result: "AGREED by oscilla-c3 with oscilla-43. (1) (a), amended: selecting, playing, opening in Studio, face parameters and moving clips are what an embedded view needs; the operations it does not offer are absent, not shown and inert (project.no-inert-surfaces); the surface gives one visible hint, not one per box, and it is a working link 'Upravit ve Studiu' that opens the same document in the full Studio; every edit made in the embedded view goes on the document's one undo stack (the full Studio's), never a separate one; the allowed operations are reachable by keyboard and by touch with 44 px targets; hint and link text are Czech. (2) (a), amended: keep the cockpit and drop the stacked strip; 'Open this sequence in Studio' already exists as seq.toStudio ('Open this pattern in Studio'): reuse it, do not add a second link, and give it Czech text while there (the English ratchet falls); dropping the strip must not remove a control that the cockpit or a link does not replace, and the control census and the integration map name what moved; T10's seq.toDrums and seq.toStepBass stay beside it. This fits the owner's 'where is the new sequencer' (2026-11-11): one strip, the onward paths, no duplicate."
