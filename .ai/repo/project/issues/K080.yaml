acceptance_criteria:
  - "tests/unit/synth-follower.test.mjs, failing on the merge base: the detector's pure kernel turns a 440 Hz frame into A4 within its stated uncertainty and schedules the gate at currentTime plus the stated latency; an offline compile states 'live only' for gate and pitch; tests/browser/instrument-dsp.cjs renders the envelope offline and checks that it follows a 20 dB step within its stated time constant, and tests/browser/synth-modulation.cjs checks the live gate and pitch with a digital source; a model connecting the microphone through the follower's audio path to the output is refused with the rule's sentence."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: microphone to output (refused); silence (no gate)."
  - "A browser check in tests/browser/synth-modulation.cjs, wired into npm run test:synth (so CI and the release gate run it), fails on the merge base and proves the slice linked, real-time and interactive. Linked: a drum out patched into the follower drives the synth's gate in the Studio graph and the panel at the same revision. Real-time: a TEST CONTEXT-like digital source into the follower opens the synth's gate and the latency figure is shown, each within a named until() deadline of tests/browser/lib/wait.cjs. Interactive: the follower is patched by pointer, keyboard and touch; its latency text is in its card's accessible description. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every edit is one undoable dispatch through the one Studio store (a continuous gesture is one history entry, undo and redo restore the exact serialized model) and the model holds plain data only (project.studio-model-is-canonical); every connection goes through canConnect and full-model validation, and a refusal shows the validator's sentence and leaves model, history and runtime unchanged (project.typed-ports, project.no-silent-feedback)."
  - "Every node it plays is built by an engine adapter with track()/source() accounting, all timing is on the audio clock (no timer or rAF times audio), envelopes are click-free, frequencies stay below 0.95 x Nyquist of the running context, the peak stays at or below the output ceiling and the engine node census is 0 after stop (project.audio-engine-discipline v2)."
  - "Every pinned template studioHash is unchanged: it adds node types, ports, capabilities, enum options or clip kinds only, never a parameter on an existing node type (D2, K022)."
  - "Every string it adds passes tests/unit/instrument-wording.test.mjs (added by K059): no product, brand or model name, no analog-modelling or vintage claim, and every approximation it makes labelled where it is shown (project.no-fake-science)."
  - "The pull request carries a reviewer's verdict (src/js/analysis and src/js/studio and src/js/synth is guarded; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
  - "scripts/size-report.mjs shows at most 3 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the line's figures stays within the cap Q023 records, under the gzip budget of scripts/build-config.mjs (1.2 MB by the owner's decision of 2026-10-29) (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
