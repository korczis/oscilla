title: "Follower: an audio-band signal to envelope, gate and pitch CV, labelled with its latency"
slug: follower-an-audio-band-signal-to-envelope-gate-and-pitch-cv
priority: p2
profile: implementation
objective: "Lands as feat(studio). A follower node type: a TAP audio input; an envelope CONTROL output at audio rate (rectifying WaveShaper and a low-pass, attack and release stated); a gate TRIGGER output and a pitch CONTROL output detected on the main thread from an AnalyserNode every analysis frame and scheduled at currentTime plus the stated latency (frame length and hop at the running rate), with the pitch uncertainty from the mic analyzer's estimator shown on the card; gate and pitch are live only: an offline render compiles them to a stated 'live only' status (the envelope renders offline), and moving the detector onto the K088 worklet is what would make them render offline. The microphone may feed it; a path from the microphone to the output stays refused (live-input-to-output); drum and synth outputs may feed it. It becomes the panel's Follower module. Before: an outside signal cannot play the synth. After: a follower gives envelope, gate and pitch CV with its latency stated. User-value tier 3 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node type is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
