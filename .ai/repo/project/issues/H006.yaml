objective: "Lands as docs. D1: CLAUDE.md:14 says the ADRs are 'all proposed', while the ADR README records the owner's acceptance of 2026-10-18 and many carry status accepted; the sentence points to the ADR README instead of stating a status. D2: README.md's Studio 'Not yet built' list names a minimap and pinch zoom on the timeline, which ship; both leave the list. D3: README.md's Sequencer line claims tempo-locked durations, which the interface does not offer; it says what ships until K002 and K017 land. D4: README.md says Studio and Playground output are exclusive, while the instrument and the sequencer sum and the sequencer overlaps the Studio until a 150 ms poll; it states the current behaviour until the output-owner fix of ADR 0063 lands. A check in tests/unit/docs-derived.test.mjs keeps D1 and D2 from coming back."
why: "Doc drift D1-D4 of the G1 coherence contract of 2026-10-29 (scratchpad g1/coherence-contract.md, section 5 row 6.6; inventory g1/inventory.md; critique g1/critique.md) (VERIFIED on main cdda563c); the README rows that change behaviour are changed again by the issues that change it."
