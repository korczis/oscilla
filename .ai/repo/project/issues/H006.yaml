acceptance_criteria:
  - "tests/unit/docs-derived.test.mjs fails on the merge base: CLAUDE.md and AGENTS.md state no ADR status that contradicts the ADR front matter (no 'all proposed' while an ADR is accepted), and README.md's 'Not yet built' list names no feature whose unit test exists and passes (the minimap and timeline pinch tests)."
  - "README.md's Sequencer and Studio output sentences describe the behaviour on main at the commit they land on, each with the plan id that will change it."
  - "No count of ADRs, apps or tests is written by hand (CLAUDE.md, Plan: ranges written here go stale)."
  - "tests/README.md has a row for each new test."
validation:
