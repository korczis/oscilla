objective: "Lands as feat(presets). src/js/data/presets.js gains a 'Test signals' group: 1 kHz at -20 dBFS, 440 Hz reference, SMPTE two-tone, CCIF two-tone, pink noise at -20 dBFS RMS, 20 Hz-20 kHz log sweep, octave steps 125 Hz-16 kHz, and a 10-cycle 1 kHz tone burst; each opens from the Presets workspace and from a Pro dropdown in the Generator workspace, and a user preset saves every generator field. Preset names state the signal, never an effect."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings G1-G14 measured on origin/main b67d1e58)."
