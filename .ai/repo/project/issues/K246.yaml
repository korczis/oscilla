title: "The Synth's insert sentence is a dismissible Pro info alert, shown once per insert, not a status line on every tab"
slug: synth-insert-notice
priority: p2
profile: implementation
objective: "Lands as fix(synth). The owner-ordered live visual audit of v3.35.0 (2026-11-11, finding 3) found synth.status ('Inserted the Semi-modular mono voice into the Studio document; it took Master Output from Filter 1. Undo removes the panel...') visible on every Synth tab. Decided by oscilla-c3 under Q090 (relayed by oscilla-43, 2026-11-11), verbatim: '(2b) synth.status: amend. Don''t make it a toast. The sentence reports a change the Synth made to the user''s own Studio document: it inserted the panel, took Master Output from Filter 1, and says how to undo that. The insert happens on opening the Synth, not by the user''s own action. A toast that vanishes would let a rerouted master go unseen (the no-silent spirit). It shouldn''t sit on every tab forever either. So: Make it a dismissible Pro alert (info, with a close button) under the Synth header, shown once per insert. It stays until the user closes it or undoes the insert, and doesn''t return for the same insert after it''s closed. Say it once in the live region as it appears. Czech text: 0b''s pass should give the alert its Czech wording.' Before: the sentence on the status line of every tab. After: a closable Pro info alert under the Synth header, keyed per insert, said once."
why: "The owner's bar of 2026-11-11 (verbatim, loop prompt): 'vse at vypada profi, hezky, luxusne, detailne, production grade, proste profi autio nastroj'; a developer-worded sentence on every tab reads as unfinished, and the reroute must not go unseen."
current_state: "Filed 2026-11-12 by oscilla-43 from oscilla-c3's decision. Built by oscilla-d9 in task t-20261112034159-d6a2 (continuing t-20261112011320-25dd) on feat/synth-status-alert (the Czech pass 74e16d03 with main 3dfe1985 merged): synth/insert-notice.js; ui.js ensurePanel and the dock's New Synth voice report an insert to it, refresh() hides the alert when the panel is gone; a Pro info alert (synth.notice, close synth.notice.close, PRO.alertInfo/alertClose) between the Synth header and its tabs. Keying: only a real insert calls inserted(), since a re-insert reuses the panel's deterministic ids (semi-mono-1-keys), so the Keys id only says when the panel is gone; a redo restores the panel without an insert and never brings the alert back. synth-insert-notice 7/7 (fails on the base), npm test 5782/0, synth.cjs s-notice and the Synth suites exit 0 in chromium and webkit. Visual: the six linux-x64 desktop tab views (panel, engines, xy; dark, light) move with the alert; the phone and bay views fail identically on 74e16d03 (the Czech pass, re-accepted by oscilla-0b in T15), so the six are re-accepted after T15 lands."
scope:
