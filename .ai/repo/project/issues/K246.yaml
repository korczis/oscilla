acceptance_criteria:
  - "The insert sentence shows as a Flowbite Pro info alert with a close button under the Synth header, once per insert (keyed by the inserted panel's Keys node id); closing hides it for good, an undo hides it, a redo of a closed insert does not bring it back, a fresh insert shows it again; a unit test fails on the merge base."
  - "The sentence is said once in the live region as the alert appears, and the status line does not repeat it."
  - "A browser check drives Close in the gate browsers; the Pro record does not rise; a reviewer's verdict (src/js/synth is guarded)."
validation:
