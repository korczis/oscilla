title: "midi.cjs's focusOffEditors blurs the editors instead of force-clicking a readout 2000 px down the Playground"
slug: midi-focus-off-editors-blur
priority: p3
profile: implementation
objective: "midi.cjs's focusOffEditors takes the focus out of the editors by force-clicking keyboard.readout; on the Playground at 1280x720 that readout sits about 2000 px down #osc-app (2706..2721, inside the static keyboard 2646..2869), so the click depends on Playwright scrolling it into view. #547's run 43646763226 attempt 1 failed [firefox/file] midi-run with 'locator.click: Element is outside of the viewport' (scrolling into view if needed / done scrolling), attempt 2 passed. oscilla-c3's classification (2026-11-15), verbatim: \"midi-run [firefox/file], 'Element is outside of the viewport', is undetermined and not attributed to T20: Linux container, CI's null audio sink, midi.cjs --browsers firefox --origins file, alternating: T20 14/14 ALL PASS and main 14/14 ALL PASS. That's 6 rounds quiet (load ~1.5) and 8 with the 6-CPU VM saturated (load ~9-10). The readout's geometry is the same on both trees on the Mac. On CI it's seen once in 7 firefox legs that ran midi. No control failed in any round, so by my own rule this doesn't prove a pre-existing race either.\" Its flake ledger row: run 43646763226, Browser leg 1 (firefox), 1: failure, 2: success; its cause is this issue."
why: "A required firefox leg failed once on a click that depends on scrolling an off-screen readout into view; the function already has a blur branch that needs no scroll."
current_state: "Re-checked on main 8e087873 in the audit-and-stamp follow-up train (oscilla-d9, 2026-11-18). Stamped done in this train; the evidence names what was re-run and which criteria moved to which follow-up issue. Before this audit: Open. Filed 2026-11-15 by oscilla-43 from oscilla-c3's classification on #547; the midi suite's owner builds it, not train T20. Built by oscilla-ff (session cae276ab-2d90-45d2-babb-a1f8023668d2) on fix/e073-midi-focus-off-editors from #560's head, on the owner's order of 2026-11-15, verbatim: \"pokracuj s implementaci dalsich nedokoncenych veci - trains/prs/issuessession-contexts\": focusOffEditors clicks the readout only where it is wholly inside the viewport and blurs otherwise, and throws if a click scrolled the page; midi.cjs in chromium, firefox and webkit, file and http, 733 checks passed, the 3 failures the hardware ones on the Mac (as on main)."
