acceptance_criteria:
  - "F1, tests/unit/keyboard-dock-yield.test.mjs failing on the merge base: a Studio whose room folds the keys never applies 'docked' before 'collapsed' on its first evaluation; the state machine is given a band before the keys draw (the dock's declared docked height or a measurement that does not paint the keys), and an unmeasurable band still docks (the K171 rule: unknown input never folds)."
  - "F2, the same test: after a width change while folded, the room is judged from the band the keys take at the new width (re-measured without showing them, or derived from the new width), not from the band last measured docked; a fold the user undid stays undone (the session-only expansion of #444)."
  - "Browser: tests/browser/ui-current.cjs or layout.cjs at 375x667 and 1024x768 in chromium: from the first frame after load the Studio's toolbar is clear of the keys (no frame shows the keys docked over it), asserted by a condition poll with a named deadline (project.bounded-test-timing, project.suite-harness)."
  - "A fix change carries a unit test that fails on the merge base (project.fail-first); no guarded path is expected (src/js/midi), and a reviewer's verdict is attached if one is touched (project.review-verdict)."
  - "tests/README.md rows extended for the changed tests; dist is rebuilt and npm run build:check passes."
validation:
