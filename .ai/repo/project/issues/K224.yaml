title: "The Studio's room fold holds from the first frame, after a rotation and without requestAnimationFrame (P3s of #444's reviews)"
slug: the-studio-room-fold-holds-from-the-first-frame-and-after-a-rotation
priority: p3
profile: implementation
objective: "Lands as fix(keys). #444 folds the docked keys to their handle where they would take the Studio's toolbar or editor (src/js/midi/routes.js keepsRoom and roomFolds, applied by src/js/midi/dock-yield.js; Q105 keeps the keys armed). oscilla-21's review of fix/444-dock-studio-layout (52ded518) left two P3s that this issue closes. F1: the room needs the band the keys take while docked, which dock-yield.js measures only once the keys have drawn (its ResizeObserver), so a short Studio's first frame shows the keys docked and then folds them: a band-high flash on load at 375x667 and 1024x768. F2: while folded, the band measured when the dock was last docked is reused, so after a rotation or a resize that changes the keys' docked height, roomFolds judges from a stale band until the dock is docked again. After: the fold is decided before the first frame that would show the keys docked, and a width change while folded judges from the band the keys would take at the new width, without unfolding them on screen. prismatic-majordomus-7b's verdict on #444 (dceae127) adds two more P3s, closed here as well. K-2: dock-yield.js asks for the room's re-judgement in an animation frame and skips it where requestAnimationFrame is missing; it should defer through a fallback (a zero timeout) rather than not judge. K-3: tests/browser/midi.cjs keyboard-everywhere clicks the dock's handle whenever it is visible; it should unfold only a folded dock (data-dock-state collapsed), so an already docked dock is not folded by the check."
why: "Review of #444 by oscilla-21 (2026-11-08, P3 findings F1 and F2) and prismatic-majordomus-7b's verdict on #444 (K-2, K-3), filed by oscilla-a3 at oscilla-2b's request so the follow-up is tracked; kept out of the keys+pad train so it does not move again."
