  - "src/js/midi/dock-yield.js"
  - "src/js/midi/routes.js"
  - "src/js/midi/keyboard-ui.js"
  - "tests/unit/keyboard-dock-yield.test.mjs"
  - "tests/browser/ui-current.cjs"
