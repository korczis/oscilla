title: "The Studio's room fold holds from the first frame and after a rotation (21's F1 and F2 on #444)"
slug: the-studio-room-fold-holds-from-the-first-frame-and-after-a-rotation
priority: p3
profile: implementation
objective: "Lands as fix(keys). #444 folds the docked keys to their handle where they would take the Studio's toolbar or editor (src/js/midi/routes.js keepsRoom and roomFolds, applied by src/js/midi/dock-yield.js; Q105 keeps the keys armed). oscilla-21's review of fix/444-dock-studio-layout (52ded518) left two P3s that this issue closes. F1: the room needs the band the keys take while docked, which dock-yield.js measures only once the keys have drawn (its ResizeObserver), so a short Studio's first frame shows the keys docked and then folds them: a band-high flash on load at 375x667 and 1024x768. F2: while folded, the band measured when the dock was last docked is reused, so after a rotation or a resize that changes the keys' docked height, roomFolds judges from a stale band until the dock is docked again. After: the fold is decided before the first frame that would show the keys docked, and a width change while folded judges from the band the keys would take at the new width, without unfolding them on screen."
why: "Review of #444 by oscilla-21 (2026-11-08, P3 findings F1 and F2), filed by oscilla-a3 at oscilla-2b's request so the follow-up is tracked; kept out of the keys+pad train so it does not move again."
