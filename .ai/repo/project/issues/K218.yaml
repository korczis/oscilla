acceptance_criteria:
  - "tests/unit/synth-patch-bay.test.mjs, failing on the merge base: a feedback drop is refused with the no-silent-feedback sentence, the model and history are unchanged, and the bay's drawing marks exactly the edges and jacks of the cycle analyzeCycles reports, by a dash pattern or outline as well as colour; the next drag clears the mark (project.fail-first)."
  - "A browser check in tests/browser/synth.cjs, in every gate browser: a feedback cable dropped by pointer is refused, the sentence is in the live region and the cycle's cables carry the mark, within a named until() deadline. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs until() with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "src/js/synth is guarded (project.review-verdict v2): a non-builder's verdict; tests/README.md names the new checks; dist is rebuilt and npm run build:check passes."
validation:
