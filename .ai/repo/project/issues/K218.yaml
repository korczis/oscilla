title: "Patch bay: a refused feedback cable highlights its cycle path on the bay"
slug: patch-bay-a-refused-feedback-cable-highlights-its-cycle-path
priority: p1
profile: implementation
objective: "Lands as feat(synth). K063 refuses feedback 'with the cycle path highlighted'; on main a feedback drop is refused with the store's sentence and nothing on the bay shows the loop. The bay highlights the edges and jacks of the cycle the validator found (analyzeCycles' cycles[].edges, src/js/studio/validate.js) by pattern and outline, not by colour alone, until the next drag or Escape. Before: the sentence names a loop the bay does not show. After: the loop is visible where it would close. Rollback: revert the pull request; no saved state depends on it."
why: "Gap of K063 (criterion 2) found by the M064 audit of origin/main 37c52bee (oscilla-a3 with the plan coordinator, 2026-11-07, tests run): a refused feedback cable does not highlight its cycle path. No owner direction re-scopes it, so it is its own issue and K063's criterion points here (chore/plan-m064-rescope). K063 rests on the owner direction of 2026-10-29 (the connected instrument) and Q018 (knobs with a number shown, a new Synth workspace)."
