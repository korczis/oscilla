objective: "The build is 820 005 B gzip of the 1 000 000 B budget at origin/main b67d1e58 (pull request #279, E027, open on 2026-10-29, raises the budget to 1 200 000 B on the owner's decision of that day; the cap asked here is this line's share either way), and the charts (Q014), synth (Q023) and Studio boxes (Q030) lines also draw on what is left. (a) 14 KB in all (catalogue runtime 6 KB, renderer 3 KB, cockpit 5 KB), measured per pull request by scripts/size-report.mjs, with trace fields and long docs kept out of the bundle; (b) another figure. The plan recommends (a). Merged plan of the component follow-up (2026-10-30): It now also covers the follow-up lines, which ask no cap of their own (Q052 and Q061 part 2 are withdrawn): parameters and controls N001-N010 about 8 KB, instrument kinds W001-W016 about 36 KB, GL live views Y002-Y008 about 18 KB, J007 0.3 KB, from their slices' ceilings. (a) 14 KB for the catalogue line as above plus 66 KB for the follow-up, 80 KB in all, each slice's base and head size-report figures in its pull request and the line stopping for a decision before a pull request would pass the cap; (b) another figure. The plan recommends (a). Amended 2026-11-01 (critique of #363): the catalogue slices' own ceilings add up to 25 KB, more than (a)'s 14 KB, and the runtime registry G007 and G015 bundle is estimated, unmeasured, at more than 20 KB gzip for every hook (about 150 to 250 B minified per declaration); G001 measures the bytes per declaration, and this question is put to the owner with that figure, the sum of the ceilings and the dist size measured then (825 984 B gzip of the 1 200 000 B budget at f887066f) before G007, the first slice that bundles the registry, lands."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
current_state: "Open on 2026-10-29. The plan's recommendation is not an answer. G007, G008, G010 and G015 name this issue in depends_on, so majordomus plan next does not hand them out before it is answered."
