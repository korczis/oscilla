current_state: "Not started. The graph is used by labs/envelope.js only (charts/envelope-graph.js); the Studio envelope node and the Synth's EG plates have numbers and knobs, no curve editor. K152 (Train 7 prep) draws a second ADSR curve in synth/view/scopes.js (envelope(p)); G021's census flags it; dev-53 asked to draw it from envelopePoints."
acceptance_criteria:
  - "Fail-first: tests/unit/envelope-modeler.test.mjs fails on the merge base."
  - "One law: every envelope curve the app draws (lab, Inspector, Synth plate, scopes) is envelopePoints of audio/envelope.js; G021's envelope family has no listed duplicate."
  - "Per target kind (Playground voice, Studio envelope node, Synth EG 1), in chromium, firefox and webkit: a handle drag and a keyboard step change the target, read back from its owner (the Studio model or the V1 lab state), and the sounding note's envelope follows through the owner's live-update rule."
  - "Locked: a K187-fixed parameter shows its reason and a drag on it changes nothing."
  - "Phone 390x844 touch: every handle is at least 44 x 44 px, and a trusted touch drag moves it without scrolling the page."
  - "No loss: the lab page stays until the three-engine walk of its controls passes in their new homes; then its route redirects there (ADR 0045)."
  - "Standard: Pro card and toast blocks with the ui-flowbite-pro ratchet not rising, tests/README rows, size report, fail-first."
