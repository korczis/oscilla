title: "One ADSR envelope modeler: the lab graph is the envelope editor of the Studio, the Synth, the sequencer and the labs"
slug: one-adsr-envelope-modeler-everywhere
priority: p1
profile: implementation
objective: "Lands as feat(ui) after G029. The envelope family's model is the law the voice schedules, src/js/audio/envelope.js (adsrEvents, envelopePoints; the V1 voices, the Studio voices and the Studio envelope node already schedule through it), and its one editor skin is the lab's graph (src/js/charts/envelope-graph.js with charts/drag-math.js), bound through G029. Surfaces: the Envelope lab page becomes the full-size modeler with a target picker (the Playground voice while it is transitional, every Studio envelope node, the Synth's EG 1 and EG 2); the Studio Inspector and the Synth's EG plates embed the same modeler bound to their node, so no third ADSR graph or curve exists. Its handles are at least 44 x 44 px, keyboard steps, fine adjust, reset and typed entry come from the knob family's interaction model (G022), reduced motion is honoured, and a parameter a panel fixes (K187) shows locked with its reason and refuses a drag. It absorbs U069's move of the envelope chart into the Synth the way U071 is absorbed for the filter: the lab page stays until a three-engine walk proves each of its controls in its new home."
why: "Owner order of 2026-11-05 (in session oscilla-21), verbatim: \"must be connected with pannels, asdr envelope modeler, filter modeler / integrated into studio, sequencer ... / one way - dry - everything bus connected + integrated + mj way / deduplicate functionality / components - modularize / generalize - infer / derive\". Settled among the LLM sessions without the owner (the owner's order of the same day): af's critique (binding, not a parameter layer; the V1 voice transitional; computed vs live labelled), 26's answers (the store as the only write path through a gesture; bind on the store's selection change) and dev-53's (the sequencer target after K189 slice 3)."
