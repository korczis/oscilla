acceptance_criteria:
  - "Fail-first unit (tests/unit/synth-contour-forced-off.test.mjs, fails on the merge base): on the recording fake context a Contour with Attack 2 s, Hold 0.5 s and Release 0.3 s is gated at t; an all-off at t + 0.5 (forced) schedules its release from t + 0.5, so the level is below the envelope floor by t + 0.5 + Release, never reaching 1; an ordinary key-up at t + 0.5 still releases at t + Attack + Hold (K207's rule unchanged)."
  - "The forced flag reaches the release through the one fan-out: Escape, a page hide and the bus's stopAll while armed each release a Keys-gated Contour at once (a unit case per path through live-notes.js); an Envelope's schedule under the same forced release is unchanged."
  - "Guarded (src/js/studio): a non-builder's verdict in .ai/repo/reviews/<pr>.yaml (project.review-verdict v2); every string it adds is Czech (project.czech-prose)."
  - "tests/README.md has a row for the new test; dist is rebuilt and npm run build:check passes."
validation:
