title: "Live views of the Scope, Spectrum, Spectrogram, Meter and RTA nodes"
slug: live-views-of-the-scope-spectrum-spectrogram-meter-and-rta-n
priority: p1
profile: implementation
objective: "Lands as feat(studio-ui). Wave 2, first: the largest inert surface. Each analysis node paints live from its adapter's info.reader into an Inspector Pro card and a mini canvas on its node card, as one subscriber of src/js/charts/frame-loop.js over visible nodes only, and says \"No signal\" and \"Live only\" where that is the truth. It waits on F002 and F008 of #251 (intent ui-flowbite-pro; F002 needs F001), on E004, which splits the inspector, on K053 of M062, the chart interaction kit whose census, keyboard cursor and readouts its views use, and on K036 of M062, whose frame loop takes a host and an essential flag; the plan change that added M062 named these edges. Through K053 and K028 it also waits on the charts owner decisions Q014 (the gzip cap) and Q016 (the home of M062) of M063. Its loop is a subscriber of src/js/charts/frame-loop.js registered with its views' hosts, not a rAF chain of its own (playable-instrument#chart-cost)."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
