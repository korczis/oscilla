title: "Live views of the Scope, Spectrum, Spectrogram, Meter and RTA nodes"
slug: live-views-of-the-scope-spectrum-spectrogram-meter-and-rta-n
priority: p1
profile: implementation
objective: "Lands as feat(studio-ui). Wave 2, first: the largest inert surface. Each analysis node paints live from its adapter's info.reader into an Inspector Pro card and a mini canvas on its node card, in one rAF loop over visible nodes only, and says \"No signal\" and \"Live only\" where that is the truth. It waits on F001, F002 and F008 of plan pull request #251 (intent ui-flowbite-pro), which are not on main yet; depends_on names them in the plan change after #251 lands. It also waits on E004, which splits the inspector."
why: "Owner direction of 2026-10-29 (session oscilla-b0): OSCILLA becomes a playable, patchable instrument and an audio-band signal lab; the plan checked every fact it relies on against main at 8b5792cd, and the sizes it quotes are unchanged at e2720e07."
scope:
  - "src/js/ui/studio"
  - "src/js/studio/adapters"
  - "src/index.html"
  - "src/partials"
  - "tests/unit/studio-live-views.test.mjs"
  - "tests/browser/v31-studio-runtime.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
  - "E004"
acceptance_criteria:
  - "A unit test, failing on the merge base, shows one rAF loop painting only visible analysis nodes and stopping when none is visible."
  - "A browser check shows each of the five node kinds painting during play and stating \"No signal\" when stopped. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac) (project.suite-harness, project.bounded-test-timing)."
  - "Any new chrome is Flowbite Pro markup adapted from the matching Pro block and lowers or keeps the ratchet (project.ui-uses-flowbite-pro, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs); controls are Pro range sliders with number inputs, never a custom rotary knob (D5)."
  - "A reviewer's verdict is needed if it touches src/js/studio (project.review-verdict); fail-first holds."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
  - "node --test tests/unit/studio-live-views.test.mjs"
  - "node tests/browser/v31-studio-runtime.cjs"
  - "npm run release-gate"
evidence_required:
  - "verified"
