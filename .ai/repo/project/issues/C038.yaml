depends_on: []
acceptance_criteria:
  - "Fail-first: tests/unit/osc-events.test.mjs fails on the merge base naming osc:range (dispatched, no listener)."
  - "Every osc:* event and every osc:ui (kind, key) pair is declared once with its detail shape and listener; a mutation that emits an undeclared pair, dispatches an undeclared event, or removes the only listener branch of one, fails."
  - "osc:range's dispatch and its header sentence are removed; choosing a Bioacoustics row still sets the explorer range through onSelectRange, asserted by its effect in tests/unit/bioacoustics.test.mjs."
  - "Not a guarded path unless the scope widens to src/js/studio/* or src/js/audio/*; then prismatic-majordomus-98 writes the verdict. Lane: dev-53."
validation:
