  - "After it lands exactly one owner table and one claim API exist: the test imports every former table site (ui/output-owner.js:16-22,55-62; visualization/output-owner.js:12,24-29; midi/ui.js:51-57; ui/shortcuts.js:29; core/instrument.js:1191, line numbers at main 68b117f3) and asserts each is gone or derived from the one table, so C024's notes owner is a row of it and not a sixth claim path (af N1 condition, mesh 2026-11-05)."
