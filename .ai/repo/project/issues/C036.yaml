objective: "Lands as fix(output-owner). The first step of the bus (C037). At main 68b117f3 who owns the output is decided in three tables that disagree, plus a fourth refusal: src/js/ui/output-owner.js SOURCES (:55-63, :80-94), src/js/visualization/output-owner.js outputOwnerOf on the polled seqPlaying (:11, :24-29), src/js/midi/ui.js ownedBy with 'reference' (:51-57), and the riff audition's own refusal text (src/js/studio/riffs/audition.js:75-81). af's Play audit counts five, adding the SPACE_OWNER map of src/js/ui/shortcuts.js:29. During a mic level-reference capture MIDI and keys are refused (src/js/ui/measure/session.js:460-462) but claimOutput('instrument') returns true and the audition plays; the audition is counted as 'instrument' (engine 'play' to cmp.playing). After: one table in src/js/ui/output-owner.js declares every owner (instrument, sequencer, studio, synth, notes, audition, measure, reference) with its refusal rule and its sentence; every other site imports it or derives from it."
why: "oscilla-b0 Total Coherence audit of main 68b117f3, slice D (state-events gap 1, severity high), and af's Play audit wf_99782352-a93 (five output-owner tables, measurement refusal checked in nine places). af's critique N1 (mesh, 2026-11-05): the one-table test must assert that the other tables are gone or derived, not only that the new one answers. C024 (READY) makes held notes an owner of the same computation; this issue makes the computation one table."
