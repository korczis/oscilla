acceptance_criteria:
  - "tests/unit/studio-view-zoom.test.mjs, failing on the merge base: after a fresh Studio's first fit the model's graph zoom equals the editor's applied zoom, studioHash and the undo depth are unchanged and the document is not dirty; a later zoom gesture still commits as today."
  - "Negative cases, each asserted by a test that fails on the merge base where the behaviour is new: a saved document with an explicit zoom opens at that zoom (not refitted); a document saved before the change loads with its hash unchanged."
  - "A dock or viewport resize re-fits a view that is still in fit mode and leaves a user's own zoom alone: toggling Arm (the keys show only while armed in the Studio, M086) or resizing the window re-fits a fitted graph within a named until() deadline, and after a zoom gesture neither changes the zoom (a test that fails on the merge base; oscilla-b0, 2026-11-03, after Frame All landed at 110 % or 116 % run to run on darwin once the dock height began to change with Arm)."
  - "A browser check in tests/browser/v31-studio-graph.cjs, failing on the merge base: at 1536x1024 and 390x844, with and without the keys docked, the model's zoom equals --osc-sg-z on the graph's world element within a named until() deadline of tests/browser/lib/wait.cjs after load, inside tests/browser/lib/suite.cjs (project.suite-harness, project.bounded-test-timing)."
  - "The pull request carries a reviewer's verdict (src/js/studio is guarded; project.review-verdict) and, as a fix change, a unit test that fails on the merge base (project.fail-first). It adds no markup, class token or stylesheet (project.ui-uses-flowbite-pro)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
