title: "The Studio model's graph zoom is the zoom the editor shows, from load"
slug: the-studio-models-graph-zoom-is-the-zoom-the-editor-shows-from-load
priority: p2
profile: implementation
objective: "Lands as fix(studio). Found by oscilla-26's bisect of the control census on Train 4 (2026-11-03): on a fresh Studio, OSCILLA.studio.model.view.graph.zoom reads 1 while the graph editor shows its fitted zoom (74 % at 1536x1024 with the keys docked; src/js/ui/studio/graph-editor.js about line 167 commits its view only after a change, VIEW_COMMIT_MS), so the view state does not describe what is shown and any reader of the model (links, the Inspector, saved view state, tests) sees a zoom the screen does not have. The model and the editor's applied zoom (--osc-sg-z) agree from load: either the model states the zoom as fitted (a 'fit' value whose number the editor derives and reports) or the editor's first fit commits as a presentation-only change that is outside studioHash, adds no undo entry and does not make the document dirty. Before: model 1, editor 0.735. After: one zoom, from the first frame."
why: "Owner's coherence program (M090, coherent-state#views-describe-what-sounds: views describe what is shown and sounds); oscilla-b0 asked for the issue after the census row studio.graph.zoomIn.pointer passed only by luck (model 1 vs fitted 0.914) and failed once the docked keys moved the fit below 1 (c4042d7c on int/train-4)."
