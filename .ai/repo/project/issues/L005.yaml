acceptance_criteria:
  - "tests/unit/learn-equal-loudness.test.mjs: the contours are drawn from the embedded cited table, checked at three points against it; it fails on the merge base."
  - "The evidence records the data source, its licence and why it may be embedded under MIT."
  - "No control, text or stored value describes the listener's hearing, and the copy names the playback-chain caveat."
  - "The copy says what listeners commonly report under controlled listening, with a citation, never what this listener hears; it passes tests/unit/no-fake-science.test.mjs, and the pull request states that whether a sentence still implies a perceptual effect was judged by the reviewer, since the scan has no perceptual-claim phrases."
  - "A browser check plays the demonstration through the AudioEngine with no console error, within the session safety limit, from file:// and the sub-path."
  - "A capped file it grows past its cap is split first or its raise is declared in tests/unit/source-size-baseline.json's raises ledger."
  - "tests/README.md has a row for the new test; L006 registers the claim; this issue does not edit docs/CLAIMS.yaml or the intent."
