title: "Learn: equal-loudness contours as published data"
slug: learn-equal-loudness-contours-as-published-data
priority: p3
profile: implementation
objective: "It starts only after Q001 is answered. If Q001 adopts sections 89-90, this lesson is the implementation of their 'equal-loudness educational explanation'; if not, it is cancelled with Q001 as the reason. A lesson that draws published equal-loudness contours with their citation and lets the user play tones across frequency at one relative level, without computing or reporting anything about the listener. ISO 226 tables are copyrighted, and specification section 93 (docs/specs/oscilla-v3-measure.md) refuses embedded third-party data without licence and provenance: the data comes from a source whose redistribution in an MIT build is checked and recorded in the issue's evidence (for example the underlying published studies, or the ISO 226 formula with its cited parameters if their licence permits), and is not embedded otherwise. The copy says the difference a user hears through an unknown playback chain comes from the speaker as much as from the ear. It follows L002 because both add a topic to src/js/data/learn.js."
why: "Multi-page V1 specification sections 89-90 (docs/specs/oscilla-v1-sections-64-95.md), adopted or not by Q001; conversation 6abec18d, 2026-10-01T21:08:07Z (V2 roadmap item 9, a ChatGPT proposal). Data licence and speaker caveat (critique perception-lessons, equal-loudness-data-licence)."
