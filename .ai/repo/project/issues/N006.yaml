id: N006
milestone: M113
serves:
- "parameter-controls#honest-modulation-automation"
title: "Live modulated value: a dot drawn only from a measured tap of the modulation signal, never from AudioParam.value"
slug: live-modulated-value-a-dot-drawn-only-from-a-measured-tap-of-t
priority: p2
profile: implementation
objective: "Lands as feat(studio). Measured on 2026-10-29 in Chromium, Firefox and WebKit (Playwright builds): AudioParam.value returns the intrinsic value without connected inputs (0.25 for a gain whose ConstantSource input makes the output 0.75), so a dot read from it would show the unmodulated value as modulated (project.no-fake-science). The dot instead comes from one AnalyserNode that sums the CONTROL edges into the parameter, created and disposed inside the engine's accounting (project.audio-engine-discipline v2) through the probe module of V616 and K064 (src/js/studio/probe.js), only for a focused or hovered control and at most four visible modulated controls (a stated cap), only while the transport plays; it is read once per frame through K036's frame loop as a non-essential subscriber into a preallocated Float32Array(128) (no allocation per frame), and drawn at intrinsic + mean of the last block (intrinsic: laneValueAt under a lane, else the base), labelled 'measured from the modulation signal', hidden under prefers-reduced-motion. No tap (cap reached, transport stopped, context closed): no dot and no claim; the band of N005 stays. Before: K058, V620 and K076 describe a dot 'read from the runtime' that has no source. After: a measured dot or none. Negative cases: a fifth modulated control (no tap, no dot), transport stopped, the census 0 after stop, the dot never equal to the intrinsic value while modulation is non-zero. Rollback: revert; no saved state depends on it."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, KB and interlinking; full DAW, full sequencer, full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels in one generic way, integrated with Majordomus; every element tweakable; mobile first; the landing easy to use, easy to extend and open to hack. Owner decisions: knobs that always show value and unit (D11, Q018, the ADR 0058 note of 2026-10-29), every parameter on the box face (Q031), the generator in its own workspace (Q033). Design: the params-controls part of the component follow-up of 2026-10-29 (scratchpad components-followup/params-controls.md), checked against origin/main b67d1e58 and the head of plan pull request #285 (c0a631b2)."
