acceptance_criteria:
- "tests/unit/modulation-tap.test.mjs fails on the merge base: the tap planner opens at most four taps, closes each on blur, stop and context close, and computes intrinsic + mean from a supplied block; the frame subscriber allocates nothing per call (a counted-allocation fake)."
- "Definition of done, tested: tests/browser/v31-studio-graph.cjs builds a fixture (a Constant source at 0.5 routed to a gain at 0.25), plays, focuses the gain, and waits with until() (deadline 'modulated dot measured', 3 s) for the dot's described value to read 0.75 within 1 % in every gate browser; it fails if it reads 0.25; after stop the engine's node census returns to 0. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), runs at 390x844 and at 1536x1024, adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, extends: V616's probe tap and K036's frame loop, used for one more reader."
- "Definition of done, interlinks: the dot's description names the measured route sum and opens the probe view of V616."
- "Definition of done, interactivity: the dot moves with the sound while playing, by any input that changes the routes."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md states that the dot is measured, its cap of four and when it is absent. tests/README.md has a row for each new test; the parameter's or view's catalogue entry names its docs, links and tests (G001 trace part); dist is rebuilt and npm run build:check passes."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "Its scope includes guarded paths (src/js/studio, src/js/audio; scripts/review-verdict.mjs GUARDED), so the pull request carries a reviewer's .ai/repo/reviews/<pr>.yaml written by a session that did not build it (project.review-verdict); as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (named by its flowbite-pro reference.md section) with Tailwind class lists only; the knob arc and the band are inline SVG with Tailwind utilities under the ADR 0061 resolution note of K058; it adds no osc-* class token, no legacy vocabulary use and no selector, and the domain views' stylesheets gain nothing; the record's debt does not rise (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 0.8 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the line's sum stays within its row of the cap Q037 records, under the 1.2 MB gzip budget of scripts/build-config.mjs (project.single-file-deliverable)."
