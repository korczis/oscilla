current_state: "Not started. The chart is used by labs/filter-lab.js only; K152 (Train 7 prep) computes a second response in synth/view/scopes.js (biquadDb); G021's census flags it."
acceptance_criteria:
  - "Fail-first: tests/unit/filter-modeler.test.mjs fails on the merge base."
  - "One response: the computed curve equals the live getFrequencyResponse of the same biquad within 0.1 dB from 20 Hz to 20 kHz (OfflineAudioContext, every filter type), and G021's filter-response family has no listed duplicate."
  - "Labelled: with the stage running the chart reads live, with none it reads computed, asserted in both states in chromium, firefox and webkit."
  - "Per target kind (Playground voice, Studio filter node, Synth LPF): a cutoff drag and a keyboard step change the target, read back from its owner, and the sounding note follows through the owner's live-update rule."
  - "Locked: a K187-fixed parameter shows its reason and refuses the drag."
  - "No loss (U071): the Filter Lab page stays until the walk of its controls passes in their new homes, then redirects."
  - "Standard: Pro blocks with the ratchet not rising, tests/README rows, size report, fail-first."
