title: "Owner question: does a reviewer subagent of the builder's own orchestrating session count as an independent reviewer?"
slug: owner-question-subagent-reviewer-independence
priority: p2
profile: routine
owner: "repository owner"
objective: "Question for the owner, to be put by the integrator oscilla-43. Rule project.review-verdict (v2, line 94) asks for a reviewer in \"a session other than the one that built the change\", and .ai/repo/reviews/README.md says the program cannot tell a reviewer from a builder. 19 of 96 verdicts on main b8bfd3b6 name a reviewer that was a subagent of the same orchestrating session as the builders (e.g. sessions d563bebc and e4a1ac78; trains #164, #174, #179, #197 and #198-#232, the latest such verdict 433.yaml of 2026-11-05); four open P2 findings ask the owner to decide whether that satisfies the rule (164 V-2, 174 V-1, 179 V-1, 197 R-3). The exact question: \"Does a review written by a subagent of the builder's own orchestrating session count as the independent review that project.review-verdict requires?\" Options: (A) No: the reviewer must be a separate top-level session (today's practice since #232); the rule says so, and the past verdicts stand as history with this record naming them. (B) No, and the past verdicts are re-reviewed by a separate session where their content is still on main. (C) Yes, if the subagent has no write access to the change and its verdict names the orchestrating session; the rule says so."
why: "Review-findings audit of 2026-11-10 (rev-seat-2 oscilla-c3, ordered by oscilla-43 with oscilla-c1; record .ai/repo/reviews/audit-2026-11-10.yaml): 164.yaml#V-2, 174.yaml#V-1, 179.yaml#V-1 and 197.yaml#R-3 (P2); no owner or LLM decision record settles it (Q091 part 4 adds named seats but not this) still open on main b8bfd3b6."
current_state: "Decided 2026-11-10 ~01:05Z: A. Asked by oscilla-43 (Claude Code session c9ae388a-1265-4c28-8fad-5fdaea45ef04) via AskUserQuestion. Question (verbatim): 'Q108 (from the review audit): does a reviewer subagent of the builder's own orchestrating session count as an independent reviewer? The project.review-verdict rule asks for a reviewer in \"a session other than the one that built the change\". 19 of 96 verdicts on main name a reviewer that was a subagent of the same orchestrating session as the builder.' Options (verbatim): 'A: separate session only (Recommended)' - 'No: the reviewer must be a separate top-level session (practice since #232). The rule says so explicitly; past verdicts stand as history and this record names them.'; 'B: separate + re-review' - 'No, and past verdicts by a subagent are re-reviewed by a separate session where their content is still on main.'; 'C: subagent is enough' - 'Yes, if the subagent has no write access to the change and its verdict names the orchestrating session; the rule says so.' Answer (verbatim): 'A: separate session only (Recommended)'. Relayed to rev-seat-2 oscilla-c3 to record. The owner_decision evidence entry is recorded at a commit of main after #519 lands (.ai/repo/workflows/plan.md, Evidence names a commit of main); the rule's next version stating it is R054."
