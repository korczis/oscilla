objective: "Let \"Characterize playback chain\" save its observed response as a named chain profile with its setup (the hashed device id of src/js/calibration/device-id.js, never the device labels, which an exported record would share; sample rate, level, notes), labelled \"observed chain response under this setup\", separate from the digital capability of Device & Limits; a later measurement can be compared against a stored profile; a profile is never applied as a calibration. A saved profile is a new persisted record: add it as a store of oscilla-experiments with a DB_VERSION bump (src/js/experiments/store.js) rather than a second database, and update the README storage table, tests/unit/storage-inventory.test.mjs and, where it says what is kept, ADR 0049's record by a resolution note. It follows V397 because both change the Measure views."
why: "Conversation 6abec18d, 2026-10-02T03:15:06Z, item 6; today the workflow saves an experiment, not a reusable profile. README says calibration profiles are kept in page memory only and lists the one database it holds (critique measurement-extensions, chain-profile-storage-and-privacy)."
