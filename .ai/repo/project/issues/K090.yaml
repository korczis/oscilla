  - "src/js/studio/nodes"
  - "src/js/studio/registry.js"
  - "src/js/studio/adapters"
  - "src/js/audio"
  - "src/js/ui/synth"
  - "tests/browser/instrument-dsp.cjs"
  - "tests/unit/engine-fm.test.mjs"
  - "tests/browser/engines.cjs"
