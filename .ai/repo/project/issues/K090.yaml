title: "FM engine: 2-4 operators and an algorithm table"
slug: fm-engine-2-4-operators-and-an-algorithm-table
priority: p3
profile: implementation
objective: "Lands as feat(studio). A fm-voice node type with the notes (or, for the modal drum, hits) capability: operators 2-4 with ratio, level and their own envelopes, an algorithm table of fixed operator routings, linear frequency modulation into the carriers' frequency (the index stated), voices as Q021 records; operator self-feedback is refused until K094. It renders natively in Web Audio and appears as a panel in the Synth workspace's Engines sub-view and in the instrument picker. Before: no FM instrument. After: an FM engine. User-value tier 4 of 4 (synth-design.md section 17). Rollback: revert the pull request; a document saved with the new node type is then refused by the import pipeline with its unknown-type sentence, never dropped silently, so a revert after a release ships it keeps the registry entry and removes only the UI."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
