acceptance_criteria:
  - "A unit test reads src/index.html: the element bound as loopBtn uses a loop glyph and a Loop title and not #i-record; it fails on the merge base."
  - "Browser check `seq-add-menu-pointer` in tests/browser/sequencer.cjs: at 1536x1024, 1920x1080 and 1280x800, elementFromPoint at the centre of every Add-menu item returns that item and a mouse click adds a block of that type, Tone and Silence included."
  - "The change adds no osc-* class token, stylesheet selector or inline style, so the Flowbite Pro ratchet only shrinks (node --test tests/unit/ui-flowbite-pro.test.mjs)."
  - "npm run visual passes after the seqTransport region is re-accepted with its reason."
  - "fail-first holds: the unit test or browser check named above fails on the merge base (project.fail-first)."
  - "Every new browser check runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named wall-clock deadline; tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
validation:
