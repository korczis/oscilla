id: V509
milestone: M045
serves:
  - "midi-jam-companion#midi-device-map"
title: "The MIDI instruments section: each connected known controller shown from its derived profile, every control lit as it sends and naming what it moves"
slug: midi-device-map
priority: p1
profile: implementation
objective: "Lands as feat(midi). The Settings dialog's MIDI section gains, for each connected input of a known device (devices.js recognise), a view of that device laid out from its derived profile in src/data/midi-devices.json: its encoders, faders, pads, buttons and keys in the profile's own groups, each with its control label (devices.js controlLabel). A control lights while it sends (the same decoded message the monitor shows, message.js decodeMidi, through the monitor's own flush), and names the OSCILLA control it moves, taken from the one source that moves it: synth/midi-cc.js CC_SLOTS through ccEdit for the Synth panel, transport.js MCU_BUTTONS for the DAW port, the notes for the keys; a control none of them reads is shown as acting on nothing. An unknown input shows the monitor only. Built on Flowbite Pro (ADR 0061), Czech copy (Q104), every control catalogued (decl + trace + contract row)."
why: "The owner's order of 2026-11-15 in session cae276ab-2d90-45d2-babb-a1f8023668d2 (Claude Code), verbatim in part: \"pridej sekci midi nastroju\", \"mapping midi, features , protocol ...\", \"napoj cely midi stack\", \"midi instrumenting\", \"dotahni veskere issues souvisejici s midi, napoj na ui, otestuj, vyzkousej, over, ze funguje, ne roubovani, ale realne napoejni , ciste\". V507 lists the devices and their port roles and shows the messages, but the player cannot see their controller's own layout or which knob drives what; the profile already holds the layout (derived, never hand-typed), so the section needs no new data, only a view over it."
current_state: "Planned 2026-11-15 by oscilla-ff (session cae276ab-2d90-45d2-babb-a1f8023668d2) after T22 (PR 555, v3.38.0) landed V506-V508; scope agreed with oscilla-43 the same day (one source for the control names, CC_SLOTS / controlOf, is an acceptance criterion). Built after Czech pass 5 (oscilla-0b), which edits the same Settings MIDI section."
