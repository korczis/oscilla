acceptance_criteria:
  - "Each connected input of a known device has a view in the MIDI section laid out from its profile's own groups (src/data/midi-devices.json): no control name, number or position is typed in src/js or src/index.html (a unit test derives the view from the profile and finds every profile control in it)."
  - "What a control moves is read from the one source that moves it (CC_SLOTS through ccEdit, MCU_BUTTONS, the notes): a unit test changes a CC_SLOTS entry and the view's name for that control follows; a control none of them reads says it acts on nothing."
  - "A control lights while it sends, from the monitor's decoded message, redrawn at most every MONITOR_FLUSH_MS (tests/browser/midi.cjs midi-seam-device-map: a stub KeyLab mkII's CC 74 lights Encoder 1 and names LPF Cutoff)."
  - "Flowbite Pro markup, Czech copy, every new control catalogued; the UI catalog, Czech prose and Flowbite ratchets do not rise."
validation:
  - "node --test tests/unit/midi/*.test.mjs"
  - "node tests/browser/midi.cjs"
  - "npm run verify"
evidence_required:
  - "verified"
