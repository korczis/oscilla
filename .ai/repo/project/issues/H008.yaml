title: "A live Studio edit leaves no gap when the main thread stalls between the runtime crossfade and the continuation"
slug: studio-live-edit-no-gap-after-a-stall
priority: p2
profile: implementation
objective: "In src/js/studio/transport.js applyEdit (about :1284-1288 on main) the continuation's start resumeAt() is max(hooks.soon(), the horizon quantum), computed after runtime.apply began the crossfade, and continueVoice starts there (:729); a main-thread stall between the two starts the continuation late against old routes already fading from the crossfade time: a dip, and silence once it passes STUDIO_XFADE_S (320 R4, seen by the browser then). Known limit: a stall longer than the crossfade lead (SCHEDULE_LEAD_S less one render quantum) carries the audio clock past the crossfade time, whose rendered fade no later schedule undoes (H009). Start the continuation at the crossfade's own time, or hold the old routes until it resumes."
why: "Review-findings audit of 2026-11-10 (rev-seat-2 oscilla-c3, ordered by oscilla-43 with oscilla-c1; record .ai/repo/reviews/audit-2026-11-10.yaml): 320.yaml#R4 (P2); the code is unchanged since 8ef29c6f still open on main b8bfd3b6. Objective and criterion amended 2026-11-10 at oscilla-c1's review of the fix (fix/h008-continue-at-crossfade 1866f616, train T5 dd420718): a stall past the crossfade lead is not recoverable by any later schedule, so it is H009. Second criterion added at oscilla-c1's finding C1-H008-1 on 1866f616 (currentTime frozen within a Firefox task, V249)."
scope:
  - "src/js/studio/transport.js"
  - "tests/unit"
  - "tests/browser"
  - ".ai/repo/project/issues/H008.yaml"
depends_on: []
acceptance_criteria:
  - "A unit case with a simulated stall shorter than the crossfade lead (SCHEDULE_LEAD_S less one render quantum) between apply and the continuation finds no gap in the scheduled output, at 44100 and 48000 Hz; it fails on dd420718."
  - "A stall past the crossfade time, including one where currentTime stands still while the performance clock moves on (Firefox within a task), never starts the continuation before the time the engine has rendered (engine._rendered / hooks.soon); at 44100 and 48000 Hz; it fails on 1866f616."
validation:
