profile: implementation
objective: "Lands as fix(engines). Slice 3 (INSTANTIATION) of the voice wrapper split from K189 by af's critique of 96daa67b (BLOCKING 6). Line numbers at origin/main a19f1ff6. After: the voice host (src/js/studio/adapters/voices.js:56-197) provides allocation (src/js/synth/voice-pool.js, mono and legato through src/js/synth/note-stack.js's mode), voicePeak, census through acct, Nyquist through safeMaxFor and the offline render through the engine ceiling chain; the A2 note voices (src/js/audio/audio-engine.js:1071-1150) and the riff audition (src/js/studio/riffs/audition.js) play through a default engine node; A3 (src/js/sequencer/compiler.js) and A1 (audio-engine.js:503-629) import the shared primitives (K193) and keep their compilers; MEASURE stays outside by design (its stimuli are measurement sources, not voices). The voice cap is not decided here: K180 (af, origin/chore/plan-nav-folds) fixes it at the owner's Q021 law of 8 voices at 1/8 gain (src/js/synth/voice-pool.js:20 says 16 today), and this slice consumes K180's MAX_VOICES."
why: "af's critique of 96daa67b (BLOCKING 6): slice 1's fail-first (offline false, perc envelopes, peak at full polyphony) could pass only after the instantiation work, so those checks live here; slice 3 re-decided the voice cap K180 already fixes, so K180 is a precondition."
