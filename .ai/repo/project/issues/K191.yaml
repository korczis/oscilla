acceptance_criteria:
  - "Precondition (K180, af, origin/chore/plan-nav-folds): this slice starts only after K180 is DONE on main; plan validate refuses a depends_on edge to an id not on this branch, so the edge is added in the first plan change after K180 reaches main. The voice cap here is K180's number, never a second one."
  - "Fail-first: tests/unit/engine-instantiation.test.mjs walks every registry type with notes or hits (the checks moved from 96daa67b's slice 1) and fails on the merge base: capabilities.offline false where the engine renders offline, perc-voice's own envelopes outside src/js/audio/envelope.js, the peak above the engine ceiling at full polyphony; it also checks census 0 after allOff, no energy above the safe maximum and a click-free largest sample step at on, off, steal and choke, at 44.1 and 48 kHz."
  - "MIDI and Playground notes and the riff audition play through an engine node: a static scan finds no voice allocator or inline ADSR outside src/js/studio/adapters/voices.js, src/js/synth/voice-pool.js and src/js/audio/envelope.js; a mutation that re-adds one fails."
  - "K188's instance checks (tests/unit/engine-instances.test.mjs, K188's test, not in this scope) stay green; tests/unit/engine-layers.test.mjs gains the instantiation case (it imports the declaration and src/js/audio/ primitives, never presets or runtime)."
  - "Browser: tests/browser/synth-engines.cjs, tests/browser/midi.cjs, tests/browser/engine-v1port.cjs and tests/browser/touch-audio.cjs (project.a-phone-sounds, gesture rule on) pass in Chromium, Firefox and WebKit; scripts/size-report.mjs's gzip delta is in the pull request body."
  - "The V1 freeze golden vectors (tests/unit/freeze.test.mjs) are unchanged with the labs off (ADR 0014)."
  - "Controls: the XY pad stays what K183 decided (option B, af with oscilla-26: the pad is a note input of K178's Keys source and Y is a visible CONTROL cable; int/plan-train-5 e742d79d), cross-referenced, not re-decided; it consumes M123's control families and adds no parallel widget. project.visual-identity-lock holds. Arturia and iMS-20 are a quality bar, not a look (owner, relayed by af 2026-11-05)."
  - "Guarded paths (src/js/audio/*, src/js/studio/*, src/js/synth/*): prismatic-majordomus-98 writes the verdict; oscilla-21 checks the synth values; one lane owns src/js/midi/* while K178 is open. Lane: dev-53 with oscilla-26."
