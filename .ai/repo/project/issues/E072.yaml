acceptance_criteria:
  - "s-feel drives the wheel notch with the knob's own WheelEvent, as its burst does, and waits on the knob's value through tests/browser/lib/wait.cjs with a load-scaled deadline (project.bounded-test-timing)."
  - "A container A/B under the same load: T16 da54bdc8, main and the fix, alternating, at least 20 runs each; the fix fails none, and the round counts only when main reproduces in it (at least 3 fails); otherwise it is rerun under load (a parallel CPU hog or the full synth suite), with the load averages recorded beside each round (oscilla-c3)."
  - "A reviewer's verdict."
