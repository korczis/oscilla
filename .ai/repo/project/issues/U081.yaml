objective: "Lands as fix(ui). Panel Excellence criterion 8. At main 68b117f3 'Compare' means four things (src/index.html:148, :666, :2021, :2274), Synth has two 'Arm' controls, the transport (src/js/synth/ui.js:851) and the computer keys (src/js/midi/keyboard-ui.js:236), 'Library' names two things (:2475, :2636), and the 'Microphone settings' gear (:651-653) opens a dialog with only text and Close (:3247-3262). After: each of these is renamed (not merged: the two Arms have different owners, af's 'Must not unify'); docs/GLOSSARY.md lists Compare, Arm, Library and graph with one concept each; the gear is renamed to what it opens or the dialog gains its settings; auditControls (tests/browser/app.cjs:294) checks unique names per panel."
why: "af's Panel Excellence synthesis (2026-11-05, snapshot 68b117f3): criterion 8, the Naming findings and ranked follow-up 8."
