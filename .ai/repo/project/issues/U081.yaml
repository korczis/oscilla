acceptance_criteria:
  - "Fail-first: tests/unit/glossary-labels.test.mjs reads docs/GLOSSARY.md and the visible labels of src/index.html and the Synth view modules and fails on the merge base on 'Compare' (four concepts), 'Arm' (two) and 'Library' (two)."
  - "auditControls in tests/browser/app.cjs fails when two controls of one panel share an accessible name, with an allowance that only shrinks; an in-page fixture with a duplicate name proves it fails. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline, assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac), and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "A control whose accessible name contains 'settings' opens a surface that holds at least one input, select or switch (asserted in the browser leg)."
  - "src/js/synth/* is guarded: oscilla-21 reviews the synth labels and writes the verdict for that path (project.review-verdict); the other paths are unguarded under v2."
