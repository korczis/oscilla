title: "Collapse and fullscreen chrome tells the true state, and no tab panel shows without its tab list"
slug: collapse-and-fullscreen-chrome-tells-the-true-state-and-no-tab
priority: p2
profile: implementation
objective: "Lands as fix(ui). Panel Excellence criteria 12 and 13, in one issue because one test decides both: a DOM walk of every workspace at 1536x1024, 768 and 390x844 that reads each piece of chrome claiming a state (a collapse or fullscreen button's name, aria-expanded or aria-pressed and icon; a tab panel's tab list) and compares it with the region's real state. At main 68b117f3 collapseButton (src/js/ui/app.js:601-609) binds only aria-expanded, so the Device & Limits label and icon never change (src/index.html:708-713), the Envelope fullscreen label is static, and Studio tabpanels are shown without their tablist at 768 px and above (src/styles/studio.css:234-237). After: collapseButton and the fullscreen binder set the name and icon from the state, and a role=tabpanel is visible only with its role=tablist."
why: "af's Panel Excellence synthesis (2026-11-05, snapshot 68b117f3): criteria 12 and 13 and the Device & Limits, Envelope and Studio Inventory rows."
