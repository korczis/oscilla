id: V604
milestone: M048
serves:
  - "studio-completion#draft-recovery"
title: "Autosave of the working draft and crash recovery"
slug: autosave-of-the-working-draft-and-crash-recovery
priority: p2
profile: implementation
objective: "Save the working Studio draft to IndexedDB as it changes (debounced), and after a reload or a crash offer it back with its time; accepting restores it as an unsaved draft, declining discards it; a saved project is never overwritten by a draft; without IndexedDB the Studio says no draft is kept (specification sections 155 and 157)."
why: "V3.1 Studio specification (docs/specs/oscilla-v3.1-studio.md); .ai/repo/features/studio.md, \"What it does not do\"."
scope:
  - "src/js/studio"
  - "src/js/ui/studio"
  - "src/styles"
  - "tests/unit"
  - "tests/browser"
  - ".ai/repo/features"
  - "dist"
  - "src/js/core"
  - "docs/CLAIMS.yaml"
depends_on:
  - "E003"
acceptance_criteria:
  - "A draft edited, followed by a reload, is offered back and restores the exact model."
  - "A saved project is unchanged by any draft operation."
  - "With IndexedDB unavailable the Studio states that no draft is kept, and nothing claims recovery."
  - "The unsaved-work guard (ADR 0045) still protects the draft."
  - "docs/CLAIMS.yaml gains the guaranteed claim `studio-draft-recovery` naming the source and the test that prove it, and the intent criterion this issue serves names that claim as its evidence in place of the command."
validation:
  - "npm run release-gate"
evidence_required:
  - "verified"
created_at: 2026-10-18
