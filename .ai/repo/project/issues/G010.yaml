acceptance_criteria:
- "tests/unit/studio-compact-density.test.mjs fails on the merge base: compact.js defines no node or cable renderer; the embedded view is createGraphEditor with density compact; for each shipped template the laid-out cards do not overlap and fit 576 x 136 px (the half-width card at 1536 px with F002's sidebar open, less a margin) and 342 x 260 px (phone, transposed); a card's text is at least 11 px; a fixture node with ten inputs gets an 88 px card and ten distinct anchors; in density compact no anchor reads a port row's offsetTop; a fixture user document wider than the box selects the overview."
- "With density compact, a fixture store records every dispatched action through a drag on a card, a drag on the canvas, a wheel turn, a drag from a port and Delete: only SELECTION_CHANGE (and NODE_PARAM_SET from a face parameter if Q035 allows it) is dispatched, the model's node positions and view.graph are unchanged, and each refused gesture states 'Open in Studio to edit the graph'."
- "tests/browser/live-smoke.cjs keeps finding the embedded Studio after the change; the change to what it reads is guarded and carries a reviewer's verdict."
- "Definition of done, extends: graph-editor.js, graph-view.js nodeCard and edgeView, and compactLayout, which exist; no second renderer remains."
- "Definition of done, interlinks: a card's double-click or Enter opens the node in the full Studio (G012); the card's category links to its node reference once V619 generates it."
- "Definition of done, interactivity: category, state and selection are drawn from the model and the runtime truth, live."
- "Definition of done, docs, menus and routes: docs/v31/user-guide.md and docs/ui-audit.md describe the embedded Studio as it is; the V632 text names Playground and Sequencer as its hosts. tests/README.md has a row for each new test; the component's catalogue declaration (G001) names its docs, links and tests; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: tests/browser/studio-cockpit.cjs (new, wired into npm run test:studio) opens every shipped template by link, measures every card's text size, overlap and clipping inside the card as rendered (its width read from the page, never assumed) at 1536x1024 and 390x844 in both themes, selects a card by pointer, keyboard and a hasTouch tap, and waits with until() (deadline 'compact card selected', 2 s) for the same selection in the full Studio's store. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit, and the release that carried it is recorded when the milestone is verified."
- "The pull request carries a reviewer's verdict for the guarded paths it touches (project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
- "On Pro (after F002): its chrome is markup adapted from the matching Flowbite Pro block (the template names its flowbite-pro reference.md section), recorded as migrated, never pending; it adds no osc-* class token, no legacy vocabulary use and no selector, removes the legacy ones it replaces, and the domain views' stylesheets gain nothing (compact density is Tailwind utilities on the domain view's own elements); the record's debt falls (project.ui-uses-flowbite-pro, project.visual-identity-lock v2, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs)."
- "scripts/size-report.mjs shows at most 3 KB gzip added, with the base and head figures in the pull request body, inside the cap Q037 records (project.single-file-deliverable)."
