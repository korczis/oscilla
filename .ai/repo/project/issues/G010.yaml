title: "The embedded Studio draws with the full Studio's renderer at a readable compact density"
slug: the-embedded-studio-draws-with-the-full-studio-s-renderer-at
priority: p2
profile: implementation
objective: "Lands as feat(studio-ui). D7, U2-U6 and U15, and the identity P04 slice B asks for: the embedded Studio has its own renderer, its chips are 10 px uppercase cut at 14 characters ('TRANSFER ANAL...' in a shipped template), all one grey (osc-sc-node--<category> has no rule), with no state. createGraphEditor gains svc.density ('full' | 'compact') and svc.layout (a pure layout provider): the embedded Studio mounts the same editor on the same store with density compact and the existing compactLayout (the Signal Path's left to right order; its top-to-bottom form below 640 px is new, a transposition option of compactLayout in graph-layout.js, because the function has no orientation today), so the same nodeCard and edgeView projections draw a 120 x 40 px card (title in mixed case at 12 px; one line at 11 px with the category label as text, as on the full card, and the summary (spec sections 32 and 167: text, never colour alone; no new category colour); the status flags of nodeCard: unconnected, error, offline, bypassed, selected) and the typed ports of project.typed-ports on its edges, with G004's edge table. A compact card renders no port rows, so in density compact the editor never anchors a cable at a measured port row (offsetTop would read 0 and every cable would meet the card's top edge, the U5 defect): edgeView takes its end points from G004's pure portAnchor of graph-geometry.js (inputs on the left edge, outputs on the right, at (index + 1) / (count + 1) of the card's height, a PARAMETER port at its parameter's index), and a card is max(40 px, 8 px x (port count + 1)) tall, the port count the larger of its inputs and outputs in NODE_REGISTRY (the Filter's four inputs give 40 px; ten give 88 px), compactLayout's row pitch following the tallest card of the row. Measured in Node on the six shipped templates: compactLayout needs at most 4 columns x 2 rows, 552 x 104 px at 120 x 40 cards with 24 px gaps (two 40 px rows and one 24 px gap; 88 was a miscount, corrected 2026-11-01); once F002's sidebar (w-64, open at 1536 px) and P002's two-column bottom row are in place, the half-width card's inner width is about 584 px, so the graph spans the card and the level and scope sit in the toolbar row (G011): a meter column beside the graph would leave about 392 px and 4 of the 6 templates would not fit (the design's compact-fit-shell measurement in Node, 2026-10-29). In compact density the editor's projection reads layout positions that are never written: it dispatches SELECTION_CHANGE, and NODE_PARAM_SET only for the face parameters Q035 allows, and never NODE_MOVE, VIEW_SET, EDGE_ADD, EDGE_UPDATE, EDGE_REMOVE, NODE_ADD, NODE_REMOVE or NODE_RENAME (spec section 150: an automatic layout never moves a user graph, and the full Studio's stored view.graph is not the embedded view's); drag, rubber-band selection, cable drawing, quick-add, wheel pan and zoom are off there, and a gesture that would need one says 'Open in Studio to edit the graph'. compact.js's chip renderer and its osc-sc-* node and link selectors are deleted; compact density is Tailwind utilities on the editor's own elements, because studio.css may not gain a rule. When V619's face declarations are on main, the card's summary leads with the first face parameter. Before: VERIFIED (inventory 3.2, 3.4). After: one renderer, a readable card with category and state. Negative cases: a graph whose laid-out cards do not fit the card's measured inner box (half width at 1536x1024, or 390x844 transposed), whatever its node count and whether it is a shipped template or a user's document (a 40-node graph is one such case): the card shows an overview with the count and Open in Studio, never overlapping or clipped cards; a 60-character name (ellipsis with the whole name in the accessible name), an unknown node type (drawn as unknown, stated). Rollback: revert the merge commit; the model is untouched."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: \"the embedded Studio is ugly as hell\"; components in general must be generic, linkable, traceable, composable, unified, documented, dynamic, generated and interlinked; \"everything must be interlinked with everything\"; improve the main page and the first experience, deploy often. The owner's evolution prompt pack (MASTER, P02, P04, P06) binds it: the dark technical cockpit is locked, shared primitives only where duplication is proven, no new framework, generated docs only where deterministic, no decorative wires. Findings: the UI component inventory of 2026-10-29 (D1-D14 duplication, U1-U15 on the embedded Studio, measured on origin/main b67d1e58, v3.13.0); design: the component-system design of 2026-10-29 (scratchpad components/design.md)."
