objective: "Lands as test(studio). sk-linked in tests/browser/studio-keys.cjs compares the note router's routed node with the id from someKeys (today it checks only !!studioSink(), :226-231) and sk-live matches that id (today its first match takes any row with note 69, :249-250); tests/unit/synth-wording.test.mjs adds src/js/studio/clip-targets.js, transport.js and runtime.js to its SOURCES (their #447 strings are clean by its own patterns, 0 hits on 8e087873). About four lines, no guarded path."
