title: "Readout with provenance: every number names its source, unit, algorithm, window and calibration, first on the Playground frequency readouts"
slug: readout-with-provenance-every-number-names-its-source-unit-a
priority: p1
profile: implementation
objective: "Lands as feat(ui). src/js/ui/kinds/readout.js and its pure view model: a value and unit through G002, a source of setpoint, observed-digital, observed-acoustic, computed or cited, an algorithm id of src/js/measurement/algorithms.js or none, the window when observed, the calibration state (n/a, UNCALIBRATED, CALIBRATED) and a truth row; Enter, the ContextMenu key or a tap opens a Pro popover with the row (source, algorithm, resolution, calibration, limitations) and links to MEASURE calibration and the docs. First consumers: the Playground frequency readouts (p05 GEN-06, GEN-07, GEN-08). Creates tests/browser/ui-kinds.cjs, the suite every kind adds a def() to. Before: VERIFIED 12 osc-metric pairs, 8 outputs and 4 clock formatters with no stated source (inventory R1-R3). After: one readout kind whose provenance is one tap away. Negative cases: dB SPL without CALIBRATED; a setpoint and an observation sharing a label; a stale observed window not saying held; a missing truth row. Rollback: revert; the readouts return to their text. Merged plan of the component follow-up (2026-10-30): Its truth rows are T026's table (docs/v3/readout-truth.yaml), which K136 also extends, so it waits on T026 rather than on the generator line."
why: "Owner direction of 2026-10-29, in Czech, relayed by the coordinator: improve the components, their interfaces, ADRs, knowledge and interlinking, and add more; add p5.js, WebGL and interactivity, and deploy; a full DAW, a full sequencer and a full piano, everything interlinked, clickable, parameterized and joined; knobs, sliders and control panels done one generic way, integrated with Majordomus; the landing easy to use, easy to extend and open to hack; mobile first. The architecture still binds: one AudioEngine, the Studio model canonical, typed ports, one offline file under the 1.2 MB gzip budget, the cockpit identity, no fake science, Flowbite Pro (ADR 0061). Design: the instrument-kinds design of 2026-10-29 (scratchpad components-followup/components-new.md), on the component-system design (G001-G019) and the synth and studio-siggen drafts of the same day, facts checked against origin/main cdda563c."
