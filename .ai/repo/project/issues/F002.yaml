id: F002
milestone: M055
serves:
  - "ui-flowbite-pro#pro-shell"
  - "ui-flowbite-pro#pro-accessible"
title: "The Pro admin shell replaces the header and the tab bar"
slug: the-pro-admin-shell-replaces-the-header-and-the-tab-bar
priority: p1
profile: implementation
objective: "First commit, as its own change, tests/browser/ui-flowbite-pro.cjs (through tests/browser/lib/suite.cjs, bounded waits) with a table-driven deep-link inventory that passes on the current interface: every #m=<workspace> route of the navigation, the V1 'm' mode ids (playground, sweep, dual, presets, learn), ?mock=1, the Studio links of tests/browser/v31-studio-links.cjs, the hash dispatcher of ADR 0045 and the instrument's direct path. Then replace the osc-header, the osc-nav tab bar and its Analyze and Synthesis menus with the Pro admin shell adapted from the Admin Dashboard's index.html (reference.md sections 2 to 5): the fixed navbar with the OSCILLA logo, the workspace search, the theme toggle wired to the existing three-state theme and the help action; the sidebar drawer with the workspaces in their groups (Analyze and Synthesis as collapsible groups), the active workspace held in bg-gray-100 dark:bg-gray-700 plus aria-current=\"page\", collapsible to icons on desktop and a backdrop drawer on phones, its collapse written in OSCILLA's own Alpine code (the dashboard's sidebar.js is Pro source and stays out); a page header per workspace with breadcrumb, H1 and an actions slot that U006's Related links and the workspace issues fill. Enable Tailwind preflight here and adjust the legacy base styles so the workspaces keep their layout (preflight makes svg, canvas and img display:block and resets headings, lists, buttons and form controls: the inline Lucide icons, the uPlot and p5 canvases and the native dialogs are checked for it), keep every data-osc hook and id the suites address (nav.<workspace>, nav-group.<group>, header.theme, header.help), keep the landmarks the ratchet identifies its surfaces by (role="banner" on the navbar, aria-label="Workspace" on the sidebar, <main>, aria-label="Status and actions" on the footer), and lower the ratchet baseline by the navbar and sidebar surfaces migrated and the osc-tab and osc-menu uses removed. The suite also asserts the accessibility criteria for the shell: keyboard reach, visible focus, Escape closing the drawer and menus with focus returned, and contrast of at least 4.5:1 in both themes."
why: "The shell is what every workspace issue and every M054 issue that builds interface sits in; building either before it means building twice."
