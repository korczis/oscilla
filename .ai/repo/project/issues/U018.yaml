depends_on: []
acceptance_criteria:
  - "Fail-first: tests/unit/v3-views.test.mjs fails on the merge base and passes on the head. qualityBarView(initialQualityBar()) gives every item status 'unknown' and none 'pending'. After a reduceQualityBar transition into an active state (setup check, noise check, armed, stimulus, analysis), that item is 'pending'. safetyNotes() gives conservative, stop and low-frequency severity 'caution', headphones 'warn' and high-frequency 'info'. Every chip and note text equals the merge base."
  - "tests/unit/v3-ui.test.mjs reads src/index.html: the Safety notes list maps 'caution' to a sprite symbol that is neither q-info nor q-pending, and that symbol exists in the sprite with an @icon marker."
  - "A check in tests/browser/v3-ui.cjs opens Measure from dist in every gate browser and asserts the idle [data-osc=measure.bar] items use '#q-unknown', not '#q-pending', and that each Stimulus safety note whose text is a caution uses the caution symbol, not '#q-info'. It runs through tests/browser/lib/suite.cjs and waits only through tests/browser/lib/wait.cjs with a named deadline (project.suite-harness, project.bounded-test-timing)."
  - "It adds no class token, selector, markup surface or inline style, so tests/unit/ui-flowbite-pro-baseline.json stays equal or falls: node scripts/ui-flowbite-pro-record.mjs --check passes, and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro, project.visual-identity-lock)."
  - "src/js/measurement is guarded, so the pull request carries a reviewer's .ai/repo/reviews/<pr>.yaml (project.review-verdict). As a fix change, its unit test fails on the merge base (project.fail-first)."
  - "Definition of done, extends: the quality-bar and safety-note view models gain a 'not yet' versus 'in progress' split and a caution severity; F004 builds its Pro status badges on these."
  - "Definition of done, interlinks: the objective names G009, T016, V375 and F004 by plan id; the caution severity is documented in the safetyNotes() JSDoc and in STATUS_PRESENTATION."
  - "Definition of done, interactivity: none added, and no control changes (stated); the glyphs stay aria-hidden and the text carries the meaning."
  - "Definition of done, docs, menus and routes: tests/README.md rows for v3-views.test.mjs, v3-ui.test.mjs and v3-ui.cjs name the new assertions; no route or menu changes."
  - "Definition of done, tested: the unit and browser checks above; dist is rebuilt and npm run build:check passes."
  - "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit."
