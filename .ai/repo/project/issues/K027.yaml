acceptance_criteria:
  - "tests/unit/chart-palette.test.mjs, failing on the merge base, checks every role set of the registry in both themes: marks at least 3:1 and text at least 4.5:1 (WCAG 2.x relative luminance) on --osc-surface-0 and --osc-surface-1, a faded mark at the alpha it is drawn at; adjacent categorical colours at least CIEDE2000 8 apart after the Machado, Oliveira and Fernandes (2009) simulation at severity 1.0 for deuteranopia, protanopia and tritanopia (6-8 only for a set declared direct-labelled, such as the bio ranges, whose rows are named); CIE L* strictly monotonic along each theme's spectrogram LUT; the exceptions Q009's answer keeps (dark text-dim and the dark faded lines under (a)) and the inactive exemptions listed by name."
  - "The same test refuses a hex colour literal in src/js/charts, src/js/visualization, src/js/ui/p5-views.js, src/js/ui/studio, src/js/labs, src/js/sequencer and src/js/measurement/views, and asserts that each legend swatch resolves to the colour of its mark."
  - "A check in tests/browser/qa-regressions.cjs reads chartTheme() in both themes and finds every registry mark colour at or above 3:1 on the plot surface. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Chart chrome (legend, toolbar, toggle, badge, tooltip, readout row) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles (the border trap of review #253, R-3); no osc-* class token or legacy selector is added and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs). The swatch colour classes are the only markup it adds."
  - "Every osc-* use it removes leaves the record in the same change: tests/unit/ui-flowbite-pro-baseline.json is rewritten by node scripts/ui-flowbite-pro-record.mjs (the colour modifiers osc-legend-dot--purple and --blue and the osc-m-swatch .is-* modifiers leave), and a selector left without a producer is deleted from src/styles/components.css (:672-673 on main) and src/styles/measure.css (tests/unit/css-producers.test.mjs); the pull request states by how much the debt fell."
  - "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed; as a feat or fix change it carries a unit test that fails on the merge base (project.fail-first)."
  - "Dark references move only for the values Q009 lets move, re-accepted in darwin-arm64 and linux-x64 with the reason \"dark values moved under Q009\" (npm run test:visual); light references, where F011 has added them, are re-accepted with the reason \"validated light chart roles\"."
  - "scripts/size-report.mjs shows at most 1.5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of M062's figures stays within the cap Q014 records, under the 1 000 000 B gzip budget (project.single-file-deliverable)."
  - "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
