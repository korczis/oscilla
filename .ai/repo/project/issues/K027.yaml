title: "Chart role palette validated in both themes, legend and mark from one source"
slug: chart-role-palette-validated-in-both-themes-legend-and-mark
priority: p1
profile: implementation
objective: "Lands as feat(charts). One source per theme for every chart role colour, as Q008 decides (OD1; the plan recommends role pairs in tailwind.config.cjs theme.extend.colors.viz, legend swatches as bg-viz-* and stroke-viz-* classes, and src/js/charts/palette.js reading the computed colour of one hidden probe per theme event). palette.js exports the registry of every role set a chart draws with: the measurement roles, compare A-D and the neutral entries after them, the bio ranges, phase A/B, the spectrum stroke and fill, the spectrogram LUT of each theme, the Studio node families (K046), the envelope and filter handles (K043, K045) and the level-meter states (K049); a slice that adds a role adds it here. Light gets its own values where they are missing or fail today (orange 1.73-1.88:1, red, green-2, the five bio ranges, light text-dim, the spectrum gradient end hard-coded as #fff2a8); the values in the plan are candidates, and the numbers that count are the validator's output, stated in the pull request; the colour-vision simulation applies the Machado matrices in linear RGB. A faded or inactive set enters the registry in the slice that owns its drawing: the MEASURE faded lines in K054, the phase comparison overlays in K034, the filter's bypassed trace in K043, and the disabled envelope in K045 as an inactive exemption (WCAG 1.4.11 exempts inactive components), named in the test. The existing HTML legend swatches (the spectrum legend dots at index.html:587-588, the MEASURE legend swatches at :1576 and :1578 and the compare swatch at :2156 on main) get their colour from the palette's swatch classes: K027 replaces only their colour modifiers (osc-legend-dot--purple and --blue, the osc-m-swatch .is-* modifiers) and keeps the swatch shapes that K030, K041 and F004 rebuild; each swap is one attribute of an element inside a card F004, F005 or F006 rebuilds, so whichever lands second rebases it. The light spectrogram LUT (--osc-lut-0..17 in src/styles/tokens.css) runs L* 98 to 38, back to 70 and down to 39, so a mid level and the top look equally dark: its stops are re-chosen so CIE L* falls monotonically, by editing values only (tokens.css gains no declaration). Dark values stay, except what Q009 (OD2) lets move: the plan recommends moving dark text-dim (#66798d, 4.43:1 on surface-0 and 4.24:1 on surface-1) only, and keeping the dark trace set. The faded MEASURE lines are not changed here: their alpha lives in the guarded src/js/measurement/views/common.js and K054 changes it there. The screenshot background reads --osc-surface-0 instead of '#020a16' (src/js/ui/exporters.js)."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
