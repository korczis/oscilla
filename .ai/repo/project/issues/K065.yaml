title: "Piano keyboard on the Keys node: glissando, multi-touch, two-row keys, MIDI, lights from every source"
slug: piano-keyboard-on-the-keys-node-glissando-multi-touch-two-ro
priority: p1
profile: implementation
objective: "Lands as feat(synth). Extends K026's keyboard component (src/js/midi/keyboard.js, keyboard-view.js and keyboard-ui.js, built there for the V502 voices of the Playground and the Studio) and binds it in the Synth workspace's bottom dock and in the Studio to the Keys node through the note router (K060): pointer glissando (one note per pointer, moving with it), multi-touch (one note per pointerId), the two-row computer layout (A W S E D F T G Y H U J K from C), Z and X octave, C and V velocity in 0.1 steps shown, MIDI in through V501 and V502 routed to the same Keys node while the Synth workspace is armed, sustain by MIDI CC64 and a Sustain toggle (never Space, which is the transport), an octave scroll (buttons and a role=slider), scale highlight from the focused pattern's scale and root, and keys lit for every source that holds them (pointer, keys, MIDI, the sequencer at its scheduled times) with the source in the key's accessible description. One arming rule: the computer keys play only while focus is inside the piano dock or its Arm keys toggle is on, never while a text field, a dialog, the Studio graph or the step grid has focus, so they never collide with the graph's bare keys (A, F, T, C in graph-keys.js) or K069's grid keys (A, S, 1-4); the key table is recorded in ADR 0050's Synth row. Before: no keyboard plays the Studio. After: one piano plays the Keys node by pointer, touch, computer keys and MIDI, lit from every source. User-value tier 1 of 4 (synth-design.md section 17). Rollback: revert the pull request; no saved state depends on it."
why: "Owner direction of 2026-10-29, relayed by the coordinator in English from the owner's Czech: a proper sequencer, a semi-modular synth of the genre the owner named with everything, dragging patch cables, maximally friendly; then every kind of synthesis, a beat machine, an XY performance pad, clip-based MIDI arrangement, a piano keyboard, all interlinked, connected to the LFO, the labs and the visualizations, linked, real-time, interactive and covered by tests. Rotary knobs (D11) and a new Synth workspace on the Studio model were answered by the owner through AskUserQuestion (Q018). Design: the connected-instrument spec of this plan change (synth-design.md), facts checked against the head of plan pull request #269 (a655cb1c) and the branches of #266, #267 and #268."
