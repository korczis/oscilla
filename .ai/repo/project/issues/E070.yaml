id: E070
milestone: M046
serves:
  - "engineering-integrity#browser-suites-harnessed"
title: "xy-pad.cjs x-pointer's 'Y at the top opens the LPF' settles in WebKit instead of timing out"
slug: x-pointer-lpf-band-settles-in-webkit
priority: p3
profile: implementation
objective: "x-pointer intermittently fails in WebKit with 'Y at the top opens the LPF: the 10000-16000 Hz band 14.6 dB up: not reached within 8000 ms'. oscilla-c3's control (2026-11-11, 10 runs each, --only x-pointer): main db95130e failed 2 of 10, T7b 1 of 10, the same signature. Find whether the band reading or the pad's gesture is late (log the band level per poll and the pad's Y reaching the engine), and make the step wait on the applied parameter before reading the band."
why: "An existing flake on main costs a rerun whenever it lands on a train's leg."
current_state: "Built by oscilla-43 in task t-20261111082332-bfbd. Instrumented cause, two parts: (1) the band reference (base) was one read taken as soon as Eb4 sounded, while EG 2 was still decaying to the sustain the derivation assumes: the band relative to Eb4 fell -25.8 -> -36.3 dB over six reads, and the failing run (Mac WebKit, 1 of 8) took its base at -25.8, which left the derived 14.6 dB rise unreachable for the whole wait; the base is now read once three reads agree within 0.5 dB. (2) Under load in linux WebKit, padPoint read the surface's box once and got null ('Cannot read properties of null'; main 3 of 10, interleaved in the same container); it now waits through until() for a box two reads agree on that elementFromPoint puts on the pad. After: Mac WebKit 10 of 10; native linux/arm64 WebKit with 10 busy loops 10 of 10 (main 7 of 10); the whole xy-pad suite passes on the Mac in all three engines and in linux Chromium. Linux WebKit's x-padrec ('the Record switch is on') fails 1 of 5 on main and on the fix alike: a separate cause, not E070's. Firefox in the arm64 container is silent in every check (environment). No sleep or frame count added."
scope:
  - "tests/browser/xy-pad.cjs"
depends_on: []
acceptance_criteria:
  - "xy-pad.cjs --browsers webkit --only x-pointer passes 10 of 10 on the fixed head, and the late signal is named."
validation:
  - "node tests/browser/xy-pad.cjs --browsers webkit --only x-pointer"
evidence_required:
  - "verified"
