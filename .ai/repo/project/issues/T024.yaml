title: "Render WAV says when the file it wrote is clipped"
slug: render-wav-says-when-the-file-it-wrote-is-clipped
priority: p2
profile: implementation
objective: "Truth-table rows LAB-16 (scratchpad p05/truth-table.md). When clippedSamples > 0 the workspace sets a visible warning (\"Rendered with clipping: N samples over full scale were clamped in the 16-bit WAV (peak +13.2 dBFS). Lower Master or the gain before it.\") and announces it; a positive peak prints with \"+\" here and in the sequencer export; the constraint text says the live ceiling applies only to playback."
why: "P05 audit of origin/main b67d1e58 (v3.13.0): The offline chain has no limiter; a Filter at peaking +40 dB with Master 0.25 renders a peak of 4.56 (13.17 dBFS) with 16008 clipped samples, and 16008 of 48000 int16 codes sit at the rails. bufferStats counts clippedSamples but nothing reads it; the only output is a screen-reader announcement \"peak 13.2 dBFS\" with no sign. processing.js:53 says the output ceiling still applies at Master, which is false for Render WAV."
