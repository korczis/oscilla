id: K031
milestone: M062
serves:
  - "playable-instrument#chart-interaction"
title: "Spectrum zoom and pan: honest about bin resolution, keyboard and button paths"
slug: spectrum-zoom-and-pan-honest-about-bin-resolution-keyboard-a
priority: p2
profile: implementation
objective: "Lands as feat(charts). The spectrum uses the shared zoom of K052: x zoom rebuilds buildPixelMap over the window, so zoom adds real resolution down to the bin width; below 2 px per bin the bins are drawn as steps under the badge \"bin width 11.7 Hz: finer zoom adds no detail\" (the width from the live sampleRate); the live dB y axis stays fixed. Zoom has a keyboard path (+ and - about the cursor, Shift + arrows pan, 0 resets) and a single-pointer path (Zoom in, Zoom out and Reset as a Pro button group); a plain wheel never zooms, focused or not, so a click followed by a wheel scrolls the page; Ctrl or Cmd + wheel and a pinch zoom; a mouse or pen drag brushes, a one-finger touch drag scrolls (touch-action pan-y) and a tap pins the cursor; the zoom badge is a Pro badge with a dismiss button; easing of at most 150 ms only when motion is allowed."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
scope:
  - "src/js/charts/spectrum-chart.js"
  - "src/js/charts/spectrum-data.js"
  - "src/index.html"
  - "src/partials"
  - "tests/browser/charts-interaction.cjs"
  - "tests/README.md"
  - "dist"
depends_on:
