acceptance_criteria:
  - "scripts/midi/derive-devices.mjs --check passes on the owner's Mac (the committed profile and docs region equal a fresh derivation) and passes, saying so, where the install is absent; its unit test derives a synthetic fixture and proves that no key, image or layout field reaches the output."
  - "recognise() names the device and port role of the owner's port names (KeyLab mkII 61 MIDI / DAW, the BeatStep Pro's play and editor ports) and leaves an unknown name playing; controlOf() names Encoder 1 for CC 74, Fader 9 for CC 85 and Pad 1 for note 36 on channel 10 of a KeyLab mkII."
  - "A DAW-control or editor port of a known device sounds no note; a play port and every unknown input play as before (tests/browser/midi.cjs)."
  - "The Settings dialog lists each connected input with its device and port role, and the monitor shows each message newest first with the control that sent it, redrawn at most every MONITOR_FLUSH_MS; Vymazat empties it (tests/browser/midi.cjs midi-seam-monitor)."
  - "Rule project.midi-profiles-derived holds, enforced by tests/unit/midi/devices.test.mjs; the procedure is .ai/repo/workflows/midi-device-import.md."
