title: "Live spectrum density layer: how often each level occurred per frequency, under the uPlot spectrum and its scales"
slug: live-spectrum-density-layer-how-often-each-level-occurred-pe
priority: p2
profile: implementation
objective: "Lands as feat(charts). The slice begins by measuring the layer's GL and Canvas 2D paths under Y002's measure on the hardware legs; where GL does not pay, the layer ships on Canvas 2D with GL opt-in by ?gl=2 or the Settings choice. The live spectrum line stays uPlot's (K030 readout, K031 zoom, K052 keys), because a line of one point per pixel column is cheap and its axes, cursor and zoom already exist; Y001's measured uPlot draw time is quoted to say so. What WebGL adds is a layer uPlot cannot draw cheaply: a density histogram of level per pixel column, drawn on a GL canvas aligned to uPlot's plot box under its series and taking x and y from uPlot's own scales (u.bbox, valToPos), so the layer cannot disagree with the axes. The counts are accumulated once, on the CPU, in one preallocated Float32Array of pixel columns x level rows owned by the layer, for both backends: each frame the spectrum the chart already read (no second getFloatFrequencyData) adds one count per pixel column at its level row; the counts decay with exp(-dt / T), T a Pro button group 1 | 2 | 5 s, and brightness is the fraction of frames over T, through a K027 LUT. A K031 zoom or a scale change clears the layer and says 'Density cleared by a zoom' through K053's state note. The readout gains '38 % of the last 2.0 s at -32 dB rel' at the cursor cell. The GL path uploads the buffer as a texture (R32F sampled NEAREST on WebGL 2, quantized to LUMINANCE on WebGL 1) and colours it through the LUT, the Canvas 2D twin puts the same buffer with putImageData, so the GPU computes no statistic (invariant 1), a context loss loses no count and the readout reads the CPU buffer on either backend; the GL path is automatic only where chart-cost measures it faster. The layer is off by default and toggled with a Pro switch 'Density' on the analysis spectrum card; the mic spectrum gets it for the microphone trace only."
why: "Owner orders of 2026-10-29 (session oscilla-b0, in Czech): add p5.js, WebGL and interactivity and deploy; plan WebGL renderers for the scrolling spectrogram (with a 3D option), a phosphor XY scope and a live spectrum, falling back to canvas/p5 when WebGL is unavailable, one frame loop with no per-frame allocation, the single file and its gzip budget, axes and units from the analysis (no-fake-science). Built on the M062 charts plan (#269, merged as cdda563c): the frame loop K036, the interaction kit K053, the shared zoom K052, the level history K033 and the chart-cost check of K036 are reused, never duplicated (components-followup/render-gl.md)."
