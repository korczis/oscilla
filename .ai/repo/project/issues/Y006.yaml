acceptance_criteria:
- "As a feat change it carries tests/unit/gl-density.test.mjs: a constant spectrum gives 100 % at its rows after T; two alternating spectra give 50 % each within the quantization stated; the decay over T at 60, 120 and 144 Hz frame intervals; a scale change clears the counts; the row of a level uses uPlot's y scale, which fails on the merge base (project.fail-first)."
- "tests/browser/gl-parity.cjs: with a steady test tone the GL and 2D layers give the same density at the tone's column within the stated quantization; after a K031 zoom the state note reads 'Density cleared by a zoom'. Every GL check states per gate browser and OS whether it drew on WebGL 2, WebGL 1 or was skipped and the renderer string it observed, and asserts the observed backend against Y002's expectation table, failing on a mismatch (no leg claims a GL path it did not draw), and the same check runs with ?gl=0 on every leg and passes on the Canvas 2D path. Browser checks run inside tests/browser/lib/suite.cjs, wait through tests/browser/lib/wait.cjs with a named deadline and assume no sample rate (44.1 kHz in CI, 48 kHz on the Mac); tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
- "tests/browser/chart-cost.cjs gains the spectrum density rows: its GL subscriber is a frame-loop subscriber with its host (K036) and allocates nothing per tick (Y002's differential figure: Chromium CDP heap sampling over the same window with the view on GL, on ?gl=0 and unmounted, the view's increment at most 128 B per frame on each backend; the page-wide per-tick ceiling of tests/browser/chart-cost-baseline.json not raised); its draw calls per frame are counted by the gl.cjs spy and stay at the stated figure; its cost is measured by Y002's measure (five interleaved windows of 300 frame calls per backend timed as one interval, the synced figure and the live rAF figure, the minimum detectable difference and the hardware legs that decide) and recorded for the GL and the Canvas 2D path in tests/browser/chart-cost-baseline.json, with the figures in the pull request; the GL path is the automatic choice only where it is faster beyond that difference on every hardware leg, and a tie or a loss keeps the 2D path automatic, the baseline saying why; nothing is drawn while the host is hidden or Pause animation is on."
- "Its chart hosts enter tests/unit/chart-host-census.json as done in this change, each carrying data-osc-chart and its backend list, and the table-driven pass of tests/browser/charts-interaction.cjs holds for each (role=group host with the summary and the snapshot data table, role=application plot surface with aria-roledescription \"interactive chart\", visible focus ring, ArrowRight moves the cursor one step and the polite region announces once after the keys settle, Escape clears the cursor and still reaches the page's stop, Space keeps its workspace meaning (ADR 0050), a tap pins the cursor on touch); the GL canvas is aria-hidden like every drawing canvas (K053). The density layer is part of the spectrum host's entry, not a host of its own."
- "Levels say dB relative (dBFS-like) unless a valid LevelCalibration applies; every axis, tick, unit and caption comes from the analysis descriptor axesOf() and never from a constant (the static scan of tests/unit/gl-views-wording.test.mjs finds no sample-rate, Nyquist or dB-range literal under src/js/charts/gl); no data value is tweened or eased; every string it adds is registered in its chart's wording table and passes tests/unit/charts-readout-wording.test.mjs; the word waterfall is never displayed (D7; it stays a search alias only) (project.no-fake-science)."
- "Chart chrome (toolbar, toggle, badge, tooltip, readout row, marker table) is Flowbite Pro markup adapted from the matching Pro component and lands after F002 turned on preflight and the form base styles and after the card issue of its workspace placed the card; no osc-* class token or legacy selector is added, no name of the new modules or strings carries an osc- prefix, and src/styles/tokens.css, charts.css, measure.css, studio.css and studio-timeline.css gain no selector or declaration (project.ui-uses-flowbite-pro, project.visual-identity-lock, ADR 0061; node --test tests/unit/ui-flowbite-pro.test.mjs and node scripts/ui-flowbite-pro-record.mjs --check). The GL canvas is a domain view inside the card."
- "The view reads existing AnalyserNodes or the CPU-held analysis data on the main thread only, creates no audio node, adds no work to the audio path and writes no DOM per frame (project.audio-engine-discipline v2)."
- "Its paths are not guarded (scripts/review-verdict.mjs GUARDED), so no review verdict is needed."
- "The owner's definition of done, one item each: extends the live spectrum with a density view; interlinks the K025 shared frequency cursor and the K031 zoom act on the layer (markers join in Y007); interactive: the density readout at the cursor, the T choice, the switch; docs, menus and routes: the analysis card's toolbar, docs/renderers.md, README's feature list; tested with pointer, keyboard and touch; deployed by merge commit under project.deploy-often (Pages deploys on the merge)."
- "Designed at 390x844 first: every check runs at 390x844 and at 1536x1024, touch targets are at least 44 px, and each gesture has a pointer, a keyboard and a touch path."
- "scripts/size-report.mjs shows at most 2.5 KB gzip added, compiled CSS included, with the base and head figures in the pull request body; the sum of the Y line's figures stays within the component line's cap Q037 records, under the gzip budget of scripts/build-config.mjs (1 200 000 B since #279 landed, BUDGET.gzipBytes of scripts/build-config.mjs; dist measured 825 984 B gzip at f887066f; project.single-file-deliverable)."
- "tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
