objective: "Once V391-V398 have landed, add tests/browser/v3-measure-extensions.cjs, run through tests/browser/lib/suite.cjs (project.suite-harness, project.bounded-test-timing), which asserts that each new figure (EDT, T20 and T30; C50, C80 and D50; THD and THD+N; the chain delay; phase and group delay; run-to-run consistency), each context overlay and the chain profile view is visible, or refused with its reason, on every leg: Chromium, Firefox and WebKit, each from file:// and from http /oscilla/. Add it to npm run test:measure. Then register one guaranteed claim per criterion in docs/CLAIMS.yaml (measurement-figure-contract, room-decay-metrics, clarity-definition-metrics, distortion-thd, chain-delay, phase-group-delay, run-consistency, response-context-overlays, chain-profile, measure-extensions-render), naming the source and the test that prove each, and change each criterion of .ai/repo/project/intents/measurement-extensions.yaml whose figure V391-V398 built from its command to evidence claim with that id. This issue changes no product code: a figure that fails a leg, or cannot be observed without a test seam, is fixed or given the seam in a pull request of its own V39x issue."
why: "Audit idd-dispatch F8: the cross-browser criterion covers every new figure, while only V391 served it; audit F1 and F5: one closing issue keeps docs/CLAIMS.yaml and the intent out of the other M047 scopes."
