id: K132
milestone: M082
serves:
- "signal-generator-lab#pitch-entry"
title: Note names and Hz both ways wherever a frequency is typed
slug: note-names-and-hz-both-ways-wherever-a-frequency-is-typed
priority: p1
profile: implementation
objective: "Lands as feat(core). src/js/core/music.js gains parsePitch(text, a4): Hz and kHz forms (the S009 forms of parseFrequency) and note names with an optional octave and cents offset ('A4', 'C#3', 'Bb2+15c', 'G5 -7 ct'), returning { ok, value, note, cents } or a readable error, and formatPitch(f, a4) for the other form. Every typed frequency field uses it: the Playground pattern parameters and frequency lists (User sequence, Octave steps, Alternating), the sweep fields, the Studio Inspector frequency fields, and the MEASURE stimulus start and end. Each field's echo (the existing aria-valuetext or note line) gives the other form ('A4 = 440.00 Hz', '1.5 kHz = F#6 -14 ct'). Wave 1 changes no markup; the Playground's own typed frequency box is K138."
why: "Owner direction of 2026-10-29, relayed in Czech by the coordinator: \"polish Studio and the signal generator lab, make it the best it can be\" and \"make wiring the boxes much better, and their features, their options, knobs and so on, ergonomics, UI/UX/DX\". Findings and design: the Studio and signal generator design draft of 2026-10-29 (findings G1-G14 measured on origin/main b67d1e58)."
scope:
- src/js/core/music.js
- src/js/core/frequency.js
- src/js/core/instrument.js
- src/js/ui/workbench.js
- src/js/ui/studio/inspector.js
- src/js/measurement/views
- tests/unit/pitch-entry.test.mjs
- tests/browser/generator.cjs
- tests/README.md
- dist
- docs/v3/readout-truth.yaml
acceptance_criteria:
- "Before: VERIFIED (G3, G4): no visible typed frequency field; frequency lists accept Hz only; Note mode only echoes the note."
- "After and negative cases: as the objective and the criteria below state; the setpoint (what was requested) and the observation (what the analyser measured on the digital output, or the microphone on the room) are separate readouts with separate labels, and no readout claims the acoustic output."
- "Rollback: revert the merge commit. Nothing changes the schema, a studioHash, URL key meaning or stored preset, so documents saved while it was live load unchanged after the revert."
- "Scientific-truth rows (Quantity | Unit | Source | Algorithm | Resolution | Calibration | Limitations | Tests | UI label) are added to T026's canonical readout table docs/v3/readout-truth.yaml and checked by T026's tests/unit/readout-provenance.test.mjs, which this issue extends so that each UI label's text is in the source, each Tests path exists, and a setpoint row never shares its label with an observed row: Requested frequency (setpoint) | Hz | instrument state frequency | none (the value the user set, clamped below 0.95 x Nyquist) | display to 4 significant figures | not applicable (digital setpoint) | not what a speaker emits; clamped to the running context | tests/unit/pitch-entry.test.mjs | Requested 440 Hz || Note of the setpoint | note, cents | derived from the setpoint and A4 | 12-TET nearest note, cents = 1200 log2(f / f_note) | 1 cent | not applicable | equal temperament at the set A4 only | tests/unit/pitch-entry.test.mjs | A4 +0 ct (12-TET, A4 = 440 Hz)"
- "tests/unit/pitch-entry.test.mjs, failing on the merge base: every S009 form parses as before; note names with sharps, flats, octaves -1 to 9 and cents offsets parse at a4 = 440 and 432; malformed input gives an error and never NaN; parse(format(f)) returns f within 0.01 cent over 20 Hz-20 kHz; values above 0.95 x Nyquist are refused by the field's existing limit with its sentence."
- "Definition of done, extends: parseFrequency of S009, the note mode of S011 and the frequency fields of the Studio Inspector."
- "Definition of done, cross-links: a note typed in the Studio Inspector and the same note typed in a Playground list give one frequency; the Studio Oscillator node and the Playground voice it was typed for both play it (round trip through the model and the instrument state). The link is a row of tests/browser/integration-map.json once that map (synth line K075) is on main."
- "Definition of done, dynamics: the echo line shows the other form as the user types."
- "Definition of done, docs and routes: README.md's Playground feature list and docs/GLOSSARY.md where a term is new; .ai/repo/features/playground.md (or the feature record of the Playground) says what changed; docs/v31/user-guide.md for the Inspector fields. tests/README.md has a row for each new test; dist is rebuilt and npm run build:check passes."
- "Definition of done, tested: A check 'note-entry' in tests/browser/generator.cjs types 'A4, C5, 1k' into the User sequence field by keyboard, presses Hold to Play by pointer and waits with until() (deadline 'second step at 523.25 Hz', 5 s) for the engine's requested frequency of step two; types 'C4' into the Studio Oscillator's frequency field and waits for 261.63 Hz in the store; taps the sweep end field and types 'A5' in a hasTouch context and waits for 880 Hz; on the merge base 'A4' is refused and the check fails. The browser check runs through tests/browser/lib/suite.cjs, waits only through tests/browser/lib/wait.cjs until() with a named wall-clock deadline, assumes no sample rate (44.1 kHz in CI, 48 kHz on the Mac), adds nothing to tests/browser/timing-baseline.json, and fails on the merge base (project.suite-harness, project.bounded-test-timing)."
- "Definition of done, deployed: it lands by merge commit and ships in the next release under project.deploy-often; the verified evidence names the main commit and the completed evidence the release that carried it; E030's judge passes on the pull request once E030 is on main."
- "The pull request carries a reviewer's verdict (it touches a guarded path; project.review-verdict) and, as a feat or fix change, a unit test that fails on the merge base (project.fail-first)."
- "Wave 1: it adds no class token, selector, markup surface or inline style, so the Flowbite Pro record does not change: node scripts/ui-flowbite-pro-record.mjs --check passes with no rewrite and node --test tests/unit/ui-flowbite-pro.test.mjs passes (project.ui-uses-flowbite-pro); live drawing is on a canvas, a domain view."
- "scripts/size-report.mjs shows at most 1 KB gzip added, with the base and head figures in the pull request body, within the owner's dist budget of 1 200 000 B gzip (decision of 2026-10-29, about 355 KB of headroom at origin/main b67d1e58); the ceiling of this line is 25 KB gzip in all (Studio boxes 35 KB, signal generator 25 KB), stated in the milestone (project.single-file-deliverable)."
validation:
- node --test tests/unit/pitch-entry.test.mjs
- node tests/browser/generator.cjs --only note-entry
- npm test
