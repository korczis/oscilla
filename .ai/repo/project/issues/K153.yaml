acceptance_criteria:
- "Before: VERIFIED: 24 keydown listeners in 15 files on main 66635acc, no registry, no conflict check."
- "After: a binding resolves to its most specific owner; a second owner of a chord in the same scope throws; the dispatcher runs an owner once per press with one paired up(), swallows repeats unless asked and releases holds on blur; the ratchet holds the listener counts."
- "Negative cases: IME composition, a focused text field, Space or Enter on a focused button or ARIA widget, an open modal and an unowned chord (Ctrl+Q when only Q is bound) all pass through untouched."
- "Rollback: revert the merge commit; nothing binds to it yet."
validation:
