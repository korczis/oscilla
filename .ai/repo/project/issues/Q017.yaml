objective: "No light design image exists: tests/visual/reference.png is dark, and the light references of F011 and K050 are captures of the page, which pin the light theme but do not show it was designed. K050 produces a per-chart-host light reference for every chart host, its mark colours sampled against frozen expected values. Accept those images as the light design reference of the charts, or name what to change first. A change request is recorded in this issue's current_state and planned as follow-up issues under M062, which the same change adds to this issue's depends_on and to M062's acceptance; this issue stays open until a set is accepted, so DONE means accepted. A later change to a light reference is accepted through a new Q issue under M063, which the slice making the change opens (M063)."
