priority: p0
profile: implementation
objective: "Lands as fix(measure). The audit found MEASURE's Check setup emits nothing ('no input signal'), Start and Measure again are silent with a fake microphone, on file:// with a granted fake mic the page says 'Microphone input is not available here' (wrong), and Firefox announces nothing (src/js/measurement/capture.js:349-477, src/js/ui/measure/run.js:73, src/js/ui/measure/session.js:460, src/js/measurement/views/announcements.js:42; the cause is not yet pinned to a line). After: the setup check and the run produce the stimulus at the output, and every refusal is announced in all three engines with its true reason."
why: "The owner, in the af session on 2026-11-04 ~23:3xZ: 'play na vetsine stranek nefunguje / neni to centralne propojene pres bus / dupliukuje se to / nefunguje to jak ma, jak popsano v .ai/' (Play does not work on most pages; not centrally connected through a bus; duplicated; not working as .ai/ describes). Measured by af's audit workflow wf_99782352-a93 on origin/main 6d5efa89 (v3.19.0) and the live site, in Chromium, Firefox and WebKit, desktop 1536x1024 and WebKit 390x844: the engine is sound (one AudioContext, no errors, every Stop silent within 0.2-1.2 s), but 8 of 13 workspaces have no working visible Play on desktop."
scope:
  - "src/js/measurement"
  - "src/js/ui/measure"
  - "tests/unit/measure-stimulus-emits.test.mjs"
  - "tests/browser/v3-measure.cjs"
  - "tests/README.md"
  - "dist"
acceptance_criteria:
  - "tests/unit/measure-stimulus-emits.test.mjs: the run path schedules the stimulus on a stub context's destination, and the file:// microphone message is the true one when a microphone is granted."
  - "A browser check with a fake microphone in all three engines: during the setup check the destination tap is above -60 dBFS within a named deadline, and in Firefox the refusal or result is announced."
  - "The pull request carries a reviewer's verdict (src/js/measurement and src/js/ui/measure are guarded; project.review-verdict)."
  - "Fail-first: the unit test and the browser check named below fail on the merge base (project.fail-first)."
  - "Browser checks run through tests/browser/lib/suite.cjs with tests/browser/lib/wait.cjs until() deadlines, assume no sample rate, and tests/browser/timing-baseline.json does not grow (project.suite-harness, project.bounded-test-timing)."
  - "Every string it adds passes the wording tests; its chrome is Flowbite Pro and tests/unit/ui-flowbite-pro-baseline.json only falls (project.ui-uses-flowbite-pro); the iphone.cjs census reach does not fall."
  - "Done only when each criterion above is re-checked on a main commit, not by a merge verdict alone (b0's rule of 2026-11-05)."
validation:
