title: "SNR over frequency: the reliability criterion of a measurement as a plot"
slug: snr-over-frequency-the-reliability-criterion-of-a-measuremen
priority: p3
profile: implementation
objective: "Lands as feat(measure). A new buildSnrView(source) in src/js/measurement/views reuses the quality.js pooling (smoothFractionalOctave, 1/6 octave) and reliableMinSnrDb = VALID_MIN_SNR_DB, exported rather than copied. The plot shows the pooled SNR as the primary series, labelled \"SNR . dB (signal re measured background), 1/6-octave pooled: the reliability criterion\", the per-point transfer.snrDb as context, a threshold line whose label is generated from the constant, and the unreliable spans hatched exactly as on the response chart, synced with the response cursor and the zoom of K038. A null SNR shows \"SNR NOT MEASURED\" with its reason; nothing is guessed. It is placed where Q013 (OD6) decides; the plan recommends a collapsed Quality section of the response card, so the default references do not move. A live capture-level sparkline is out of scope: it needs per-chunk levels in capture.js."
why: "Owner order of 2026-10-29: \"make the charts really sexy, modern, interactive\", for all charts; reviewer f3 scoped it to every surface that draws data. Revised after f3's review of the plan (CHANGES-REQUESTED, 2026-10-29): owner decisions are Q issues under M063, Pro chrome waits on F002 and on the card issue of its workspace, every chart that claims chart-interaction delivers the keyboard cursor and the announced readout, chart keys never take Escape or Space; revision 3 answers f3's delta review. Facts checked against origin/main at e2720e07 and the branches of #251, #253, #263 and #265 (charts-plan.md, charts-plan-changes.md)."
