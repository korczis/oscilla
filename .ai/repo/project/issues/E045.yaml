acceptance_criteria:
  - "ci.yml starts on pull_request and merge_group only; a merge_group run is never cancelled in progress; fail-first and review-verdict read the pull request from .github/scripts/queued-pr.sh (the event's on pull_request, the queue ref's N on merge_group, a malformed ref refused) and judge it through the base branch's program, review-verdict against HEAD^1 on merge_group."
  - "project.ci-bounded v2 (scripts/ci-workflow-rules.mjs `triggers`) refuses workflow_dispatch, push and merge_group alone, and accepts pull_request with or without merge_group; tests/unit/ci-workflows.test.mjs proves each."
  - "The release CI receipt (project.release-receipt-binds-gate v3) verifies a green newest merge_group run on main's HEAD from gh-readonly-queue/main/pr-<N>- of the merged pull request N, and refuses a run on another sha, from another pull request's queue ref, an older green run behind a red one, a queue group of two (HEAD^1 not in the head), and a skipped or missing job; the pull request's own run still verifies alone (tests/unit/release-ci-receipt.test.mjs)."
  - "ADR 0083 is accepted with the owner's decision recorded; the pull request body gives the owner the exact ruleset change to make after it lands."
  - "Fail-first: the new receipt and trigger tests fail on the merge base (the merge_group path and trigger are absent) and pass on the head (project.fail-first); the guarded paths (.github/*, scripts/release-*) carry a reviewer's verdict (project.review-verdict)."
validation:
  - "node --test tests/unit/ci-workflows.test.mjs tests/unit/release-ci-receipt.test.mjs tests/unit/ci-gates-model.test.mjs tests/unit/knowledge-integrity.test.mjs"
  - "npm test"
evidence_required:
  - "verified"
