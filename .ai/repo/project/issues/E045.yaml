id: E045
milestone: M046
serves:
  - "engineering-integrity#queue-lands-tested-tree"
title: "Pull requests land through a merge queue: CI on merge_group, the rules judge the queued pull request, the release receipt accepts the queue's run"
slug: pull-requests-land-through-a-merge-queue
priority: p1
profile: implementation
objective: "Owner decision 2026-11-02 (AskUserQuestion in the session of oscilla-b0, ~22:35Z: 'Yes, implement it (Recommended)': accept ADR 0083; oscilla-26 implements the workflow and script changes in a pull request, oscilla-af reviews, then the owner switches the ruleset to require the queue). Before: strict protection plus armed auto-merge make every landing put the other armed pull requests BEHIND; #385 lost three of its seven CI rounds to that on 2026-11-02, one of them green. After: ci.yml also runs on merge_group; .github/scripts/queued-pr.sh names the pull request of a queue ref; fail-first and review-verdict judge it through .github/scripts/base-rule.sh, review-verdict measuring HEAD^1..HEAD; project.ci-bounded v2 admits merge_group beside pull_request and nothing else; the release CI receipt (project.release-receipt-binds-gate v3) also accepts the newest merge_group run on main's HEAD from that pull request's queue ref. The ruleset switch itself is the owner's act after this lands. Rollback: revert the merge commit; with the queue not yet required, nothing changes until the owner switches it."
why: "The owner's landing-throughput order (2026-11-01: at least one landing per 30 minutes) is defeated by BEHIND races under strict protection; the merge queue keeps strictness (what lands is what was tested) without the races."
current_state: "Done on main cfd87133 (#433) on fixture evidence, every criterion re-checked by af on 2026-11-05. Live proof pending the owner's O1 ruleset flip: the first merge-queue entry's run must show the merge_group trigger and the release receipt accepting it; if it does not, this issue reopens through a new record citing that run."
scope:
  - ".github/workflows/ci.yml"
  - ".github/scripts/queued-pr.sh"
  - ".github/scripts/ci-changes.mjs"
  - "scripts/ci-workflow-rules.mjs"
