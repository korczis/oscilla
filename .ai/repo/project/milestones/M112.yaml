id: M112
title: "Parameters and controls, wave 2: the menu, the band, the automation hook and the reference, on the Pro shell"
slug: parameters-and-controls-wave-2-the-menu-the-band-the-automation
order: 92
priority: p2
problem: Modulation and automation are visible only as Inspector text; no control offers reset or a link; every surface lays out its fields by hand; no document says how a control behaves or how to add one.
outcome: "Every control has one menu, shows the computed range of its routes and whether a lane overrides it, opens its lane and comes back; parameter groups render as panels that fold, with every parameter on the expanded face; a generated reference and an extending recipe describe it."
