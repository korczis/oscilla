id: M058
title: "Synth voice: audio-rate modulation, drive, macros, filters, templates, presets, mod matrix and one hash epoch"
slug: synth-voice-audio-rate-modulation-drive-macros-filters-templ
order: 58
priority: p1
problem: "The LFO stops at 100 Hz (src/js/studio/nodes/modulation.js), so FM and AM Playground voices with an audio-rate modulator do not validate; there is no drive, macro, shelf or allpass filter, no unison and no slope; and the templates do not show what the graph can do. The Envelope already has a CONTROL output, so a filter envelope needs only a template."
outcome: "Nodes: audio-rate LFO, Drive, Macro, filter types and brown noise; a hash epoch for unison, slope, sync, quantize and bypass; a template pack and node presets, a mod-matrix table and, in Wave 3, an instrument panel as projections of the model; everything bounded by the output ceiling with a node census of 0 after stop."
acceptance_criteria:
  - "K010 to K014 and K020 to K022 are done with their evidence; npm run release-gate passes at the last one."
validation:
  - "npm run release-gate"
evidence_required:
  - "milestone_verified"
risks:
  - "A new parameter on an existing node type changes every saved studioHash (normalizeStudio fills defaults, schema.js:210, and executionState hashes n.params with schemaVersion and STUDIO_HASH_VERSION); omitting a default from the canonical form is itself a change to the canonical form. K010 to K014 add only types, ports, enum options and a wider range, which leave pinned hashes unchanged; every new parameter waits for K022 (D2)."
  - "Every issue here touches src/js/studio or src/js/audio and needs a reviewer's verdict."
  - "The bundle budget is 1 000 000 B gzip (scripts/build-config.mjs) with about 183.6 KB free on main and about 171 KB after F001; each issue reports its gzip delta."
  - "The instrument view (sv=instrument) is Wave 3 and not issued: it waits on D3, D4, D8, E003 and E004."
  - "ADR 0058 line 37: OSCILLA is not to become a copy of a commercial synthesizer; D1 reads \"Arturia-like\" as front-panel ergonomics only, so no product name, trade dress or analog-modelling claim appears in any string."
