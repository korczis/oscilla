problem: "The interface is built four ways with no declaration of any component: 576 data-osc hooks, 313 named by a test; 14 semantics implemented several ways that already disagree (D1-D14); the embedded Studio's cables blur modulation into signal and its transport is a third copy (inventory of 2026-10-29)."
outcome: "Every component can be declared once and a test refuses drift; units, the parameter model, the clip face, the counts and the cable styles exist once; the embedded Studio's transport and timeline are the Studio's own; every component has an address. Nothing grows the Flowbite Pro ratchet."
