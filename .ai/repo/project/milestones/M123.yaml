id: M123
title: "Unified controls: one parametrized implementation per control family, no parallel ones"
slug: unified-controls-one-parametrized-implementation-per-control-family
order: 88
priority: p1
problem: "The owner ordered on 2026-11-04 (in session oscilla-af, routed to the component-system lane): \"unifikuj ui, knobs, sliders, switches, patchbays, keyboards, app shells, vse unified, parametrized, reuzsed, no parallel implementations\". At main 76bfc300 the knob has two implementations (src/js/ui/synth/knob.js, the knob and feel core, and src/js/synth/view/knob.js, the one that ships; review finding S11), switches and sliders have no shared module (ad hoc in src/index.html, the Studio Inspector and the Synth face), and nothing refuses a second implementation of a control family."
outcome: "Each control family (knob, slider, switch, patch bay, keyboard, app shell) has one implementation, parametrized for its places (the Pro skin of the app and the hardware skin of the synth layer are parameters of one model, never two models), declared in the UI catalogue; a census test refuses a second implementation of a family, and its baseline of today's duplicates only shrinks to empty."
acceptance_criteria:
  - "G021 to G026 are done with their evidence; the duplicate baseline of G021 is empty."
  - "G027 to G029 are done with their evidence: one envelope modeler and one filter modeler, each bound through G029 to every envelope and filter (owner order of 2026-11-05)."
  - "G030 is done with its evidence: one pad, the oscilla-pad, its looks skins of one model (owner order of 2026-11-05)."
validation:
  - "npm run release-gate"
evidence_required:
  - "milestone_verified"
risks:
  - "The knob's one implementation is the synth-theme core 98 builds (src/js/ui/synth/knob.js, adopted by F013 W1b); G022 migrates the rest onto it and builds no third (b0, 2026-11-04)."
  - "A skin is a parameter, not a fork: a family's hardware look (visual-identity-lock v4, synth layer only) and its Pro look share one model, its keys and ARIA."
