problem: "The README opens on the right sentence but has no tagline, no artwork of its own and no diagram; the repository has no custom social preview; and the owner named four visualization libraries nobody has measured against uPlot and p5 (owner prompt pack, 2026-10-29)."
outcome: "README works as a GitHub front page with original art and a native diagram, GitHub's shell matches it, and the owner adopts or declines each named library on measured numbers (Q070)."
acceptance_criteria:
  - "P006, P007, P009 and Q070 are done with their evidence."
validation:
  - "npm test"
evidence_required:
  - "milestone_verified"
risks:
  - "README is touched by about thirty open pull requests; P006 lands on top of E028 (#286), which already rewrote the top of README."
  - "P007's social preview is set in the repository settings by hand; gh cannot upload it, so its evidence is the owner's action read back through gh, and the card goes stale whenever the first screen changes (P007 waits for P002)."
