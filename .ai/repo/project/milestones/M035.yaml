id: M035
title: "Train 2 deployed and 3.11 verified live"
slug: train-2-live
order: 44
priority: p0
problem: "Pages has served main 964e25d since 2026-10-13 under the v3.10.3 label while 100+ releasable commits waited unreleased (node scripts/release-cadence.mjs: OVERDUE), and train 2 (#179) is not on main."
outcome: "Train 2 is on main and deployed; OSCILLA 3.11.0 is released through the gated flow, its own Pages run proved at release time that the public page carried the release version, commit and artifact in three browsers, and its release record has landed."
acceptance_criteria:
  - "Train 2 (#179) is merged to main by merge commit and the Pages deployment of that commit passes verify-deploy and test:live in chromium, firefox and webkit."
  - "v3.11.0 is tagged, released and deployed from a gate receipt that binds the released tree (project.release-receipt-binds-gate)."
  - "At release time the Pages run of the release commit (39097666998, 2b63ec3) proved the public page carried 3.11.0 and that commit and matched the released artifact, and the live smoke passed in three browsers. That is a point-in-time proof: Pages deploys every push to main, so a later commit replaces the page; since ADR 0059 such a page names itself 3.11.0+<distance>.g<short>, not 3.11.0."
  - "The v3.11.0 release record has landed on main."
validation:
  - "gh run view 39084400974 --json conclusion,headSha --jq '.conclusion + \" \" + .headSha' | grep -qx 'success ee70a21f6a4e52bac066828a2224007cc12b17d2'"
