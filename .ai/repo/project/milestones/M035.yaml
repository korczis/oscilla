  - "npm run release:record -- --version 3.11.0 --check"
  - "npm run release:verify-deploy -- --commit 2b63ec382d4d4c49efa2553a2a6368cb41068fe2 (in a checkout of 2b63ec3; fails once Pages serves a later commit, which is the truth of a point-in-time claim)"
