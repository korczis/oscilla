risks:
  - "A split that changes behaviour hides inside a refactor: each split keeps the suites and the visual references unchanged, and anything else is a separate issue."
  - "The splits touch the files other work also edits (Measure, Studio): land them first and small, which is why M047 and M048 depend on them."
