problem: "The owner found the live Studio, About and, in their view, the whole interface outdated at v3.13.0 (2026-10-28). About opens on the first night alone; Experiments, Filter Lab and the Analyze views are isolated or half-empty panels that do not lead to the workspaces doing the same thing in depth."
