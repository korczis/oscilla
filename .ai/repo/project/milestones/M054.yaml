  - "src/index.html is shared with E005 (partials), P002, S083 and MIDI V504: every U issue that edits it lands in its own train round with one rebuild."
  - "About's pace statement was kept by Q005's delegated decision; the owner's 2026-10-28 statement that About is outdated overrides it, so U002 changes about-origin.test.mjs with that reason."
