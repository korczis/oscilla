order: 69
priority: p3
problem: "There is no performance pad, no note clip or piano roll, no MIDI recording into clips, no MIDI output and no clip-launch grid. (Stated 2026-10-29. Amended 2026-11-05: the performance pad and a data-only notes clip kind now exist on main; the rest of the statement still holds; current_state says what exists and what is unmet.)"
current_state: "Updated 2026-11-05, re-checked on main 2195a7a3 (records, derived status and the code and tests on main; derived, not stamped). Foundation exists; the milestone is not met: K097-K102 all derive BLOCKED and none carries evidence. Built ahead of its order: K097, the XY pad (src/js/ui/kinds/xy-pad.js, the pad kind over charts/drag-math.js and the knob value model; src/js/synth/xy.js, synth/panels/xy.js and synth/view/xy-tab.js, the Synth XY tab, its xy-pad node type and its presets as ordinary patches of category xy; live notes through src/js/studio/live-notes.js; tests/unit/xy-pad.test.mjs and tests/browser/xy-pad.cjs, run by test:studio), blocked on K060, K062, K104 and W010; and K102, the one patch library (src/js/studio/patch-catalog.js, src/js/ui/patch-browser.js, synth/library.js listing the XY presets; tests/unit/patch-browser.test.mjs, s-library and s-libxy in tests/browser/synth.cjs), blocked on K066 and K020. K099 has its first part only: the notes clip kind as data (ADR 0084; tests/unit/studio-notes-clip.test.mjs), which the transport and the offline render report notes-unplayed; there is no piano roll. Unmet: the XY loop recorder and gate arpeggio (K098; xy-tab.js mounts the pad without onCommit), notes clips that play and a piano-roll editor (K099), MIDI recorded into clips and MIDI output (K100; src/js/midi has no output path), the session grid of tracks by scenes (K101; no session or scene model in src/js/studio). The acceptance criterion names npm run test:synth and node tests/browser/integration-map.cjs, neither of which exists on main (package.json has no test:synth; tests/browser/integration-map.json and .cjs do not exist), so the criterion cannot pass as written until they land or it is restated. This text records state only: no issue is marked done and no evidence is added by it."
outcome: "An XY pad with scale-quantised pitch, a loop recorder and a gate arpeggio; notes clips with a piano roll; MIDI recorded into clips and sent out where permitted; a session grid of tracks by scenes launched on the bar; one patch browser across instruments."
acceptance_criteria:
