risks:
  - "ADR 0058 line 92 rejects turning the block sequencer into a MIDI sequencer: note-name entry and tempo are block parameters, not a piano roll."
  - "The V1 freeze and golden tests may move when K002 makes beats the default: the change to them is stated in the pull request, never silent."
  - "K003 and K017 both edit src/js/sequencer/editor.js; K017 waits on F003 of #251."
  - "Step quantize is a new parameter on an existing type, so it lands in K022's epoch and K023 follows K022."
