problem: "The tempo select changes nothing you can hear (design gap G1); the V2 editor has no undo, copy or Space; its nodes are outside engine accounting (src/js/sequencer/editor.js:317 calls compileSequence without track or source); the Studio has no clock, so there is no quantised step."
outcome: "V2: audible tempo, keyboard editing and engine accounting within ADR 0058; Studio: a Clock node, Step quantize with a trigger out and trigger clips; a step-bar editor."
