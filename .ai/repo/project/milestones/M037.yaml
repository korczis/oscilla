problem: "The V431 independent architecture, UX and adversarial reviews of the Studio (docs/v31/review-v431.md) found 30 findings (19 defects, 2 risks, 9 nits); MEASURE labels claimed more than the response, CSV and Expert table showed; and the eight-entry navigation (V371) was unreleased. No milestone recorded the release line that shipped the fixes."
outcome: "Releases 3.3.0 to 3.3.3 shipped eight top-level navigation entries with Analyze and Synthesis groups (V371, #71); every V431 finding fixed with a test that fails before the fix (#75, #76, #77, #78, #80, #86, #89); MEASURE labels that state the basis of clipping, aggregation and levels, with SPL labels agreeing with the levels behind them (#66, #68; V383, #65); saved experiments no longer pinned in memory (#67); a public smoke that opens MEASURE (#72); and the Studio self-knowledge test (#73)."
current_state: "Shipped and retrospectively recorded: the work was executed under M019, M020 and M032, and this milestone records the release line that carried it."
acceptance_criteria:
