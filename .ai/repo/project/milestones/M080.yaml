problem: "Studio wiring is node-level and exact-hit (findings S2, S6, S13), the multi selection only duplicates or deletes (S5), nothing moves while it plays (S7), the edge Inspector has no signal (S8), there is no first-patch template (S9), and nothing measures a graph above 100 nodes (S14)."
outcome: "Wiring captures, explains refusals, inserts, duplicates and fans out in one undo step each; search is fuzzy; selections align and boxes mute; a cable shows its signal; a first patch teaches the gestures; 300-node graphs stay within budget; a node is one declaration with a generated reference. Nothing grows the Flowbite Pro ratchet."
