risks:
  - "The composition declaration grows into a layout engine: it owns membership, order, phone primary and open state only; CSS keeps geometry (07 section 4.1)."
  - "The probe shows a computed view as the sound: only observed views of the output after the ceiling, labelled, unless the subject is the V1 instrument (ADR 0063, project.no-fake-science)."
  - "Pages retired before their replacement sounds: Q090's no-loss condition binds U132 and U137."
  - "The shared machine and the CI cap: slices stay small and land through the merge queue (ADR 0083)."
