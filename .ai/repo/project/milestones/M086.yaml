problem: "The embedded Studio is unseen on the first screen, mostly empty, set in 10 px uppercase, without category, state or meaningful cables (U1-U15); seven parameter fields, two switch forms and inline choice copies drift (D2, D4, D8); empty states lead nowhere and one icon means five things (D9, D10)."
