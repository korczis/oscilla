id: M045
title: "MIDI jam companion: first usable version"
slug: midi-jam-companion
order: 45
priority: p2
problem: "OSCILLA can sound, analyse and measure, but it cannot play with a musician: there is no MIDI input, so a player cannot jam with it and see what their playing does to the sound."
current_state: "Updated 2026-11-05, re-checked on main 2195a7a3 (records, derived status and the code and tests on main; derived, not stamped). Foundation exists; the milestone is not met: two of its five exit criteria have a done issue, three have none. (1) Support state (V501, derived DONE; V500, its decision, DONE as the resolution note of ADR 0058): src/js/midi/support.js states the thirteen states of the ADR table with its copy and requests access only on Connect MIDI; tests/unit/midi/support.test.mjs, tests/unit/midi/wiring.test.mjs and tests/browser/midi.cjs (measured and seam checks over tests/browser/lib/midi-stub.cjs, wired into test:browser and so the release gate) prove it. (2) Notes sound (V502, derived DONE, #367): src/js/midi/notes.js maps Note On/Off and velocity to the engine's note voices under its level cap, NOTE_POLYPHONY and the 0.95 x Nyquist bound; tests/unit/midi/notes.test.mjs and midi-seam-notes in tests/browser/midi.cjs. Beside the milestone, K026 added the computer and on-screen keyboard on the same note path (src/js/midi/keyboard.js, keyboard-ui.js, keyboard-view.js, tests/unit/midi/keyboard.test.mjs), and src/js/midi/ui.js composes the layer. (3) Response mode (V503, derived READY): unmet; no response rule exists under src/js/midi. (4) Notes visible beside the spectrum and waveform (V504, derived BLOCKED on V503): unmet; the on-screen keys light whichever source plays them, a MIDI input included, but no view shows incoming and generated notes with name and velocity beside the spectrum and waveform, and src/js/ui/midi and src/styles/midi.css do not exist. (5) A jam records into an editable track (V505, derived BLOCKED on K099, V503, V504): unmet; the notes clip kind it records into exists as data only (K099 part 1, ADR 0084, tests/unit/studio-notes-clip.test.mjs; the transport reports a notes clip notes-unplayed), and nothing records MIDI. ADR 0058 is still proposed. This text records state only: no issue is marked done and no evidence is added by it; closing V503-V505 and the milestone needs criterion-by-criterion verification by someone who did not build them."
outcome: "A player connects a MIDI keyboard; OSCILLA shows incoming notes, sounds them through its engine, answers in one bounded deterministic response mode, shows incoming and generated notes beside the spectrum and waveform, and records the jam into an editable event track; without Web MIDI, OSCILLA is unchanged (ADR 0058)."
acceptance_criteria:
  - "The MIDI support state is detected and stated, and its absence changes nothing else (V501)."
  - "MIDI notes sound through the AudioEngine within its safety limits (V502)."
  - "One deterministic response mode plays on the audio clock (V503)."
  - "Incoming and generated notes are visible beside the spectrum and waveform (V504)."
  - "A jam records into an editable event track that saves, reloads and replays identically (V505)."
validation:
  - "npm run release-gate"
evidence_required:
  - "milestone_verified"
created_at: 2026-10-18
