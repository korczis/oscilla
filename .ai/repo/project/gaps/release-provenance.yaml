conditions:
  - criterion: one-version-authority
    state: conflicting
    because: "version:check passes, but it excludes the whole of .ai/, where the literal current version appears in two ADRs and two rules; and the one version string 3.10.3 names both the v3.10.3 release and the different artifact Pages serves."
    observations:
      - verify-at-head
      - version-in-ai
      - release-tag-vs-page
  - criterion: deterministic-build
    state: satisfied
    because: "build:check rebuilt the source and matched the committed dist at 62cccb3, locally and in CI; the claim's own test is a toy and is not what shows it."
    observations:
      - verify-at-head
      - ci-at-head
      - determinism-test
  - criterion: fatal-deploy-verification
    state: conflicting
    because: "A mismatch against the deployed commit is fatal (pages.yml; verify-deploy fails, as it did at 62cccb3). But Pages serves 964e25d, which is not the released v3.10.3 artifact, and no deployment failed: the check compares the page with the commit deployed, never with the release whose version the page carries."
    observations:
      - pages-workflow
      - deploy-at-head
      - release-tag-vs-page
  - criterion: gate-runs-every-suite
    state: satisfied
    because: "test:release runs every browser suite except test:live (post-deploy by project.release-flow-complete) and test:perf (a diagnostic by a classification in docs, contested by the critique)."
    observations:
      - gate-composition
      - perf-is-diagnostic
      - ci-at-head
  - criterion: majordomus-knows-the-product
    state: satisfied
    because: "Read literally (the layer reports no failure): doctor reports 0 failures at 62cccb3. It does not show the layer answers what OSCILLA is: eight records are invalid strict YAML and no ADR is accepted."
    observations:
      - verify-at-head
      - strict-yaml
      - adrs-proposed
  - criterion: public-release-verified
    state: conflicting
    because: "The page carries version 3.10.3 and commit 964e25d, but that commit is 155 commits after the v3.10.3 tag, so the page does not match the release artifact its version names; test:live was not run here (no browser suites in this review)."
    observations:
      - deploy-at-head
      - release-tag-vs-page
      - cadence-overdue
      - tags
risks:
  - "The version on the public page stops identifying an artifact: while releases are overdue, every main merge is public under the last release's version, and a user reporting version 3.10.3 can be on any of more than 155 commits."
  - "No criterion of this intent can ever be met under Majordomus 0.29: its satisfaction is decided by CI runs nobody records, until the post-alpha request for node --test and Playwright evidence lands."
  - "A stricter YAML reader in a future Majordomus, or in any other tool, would refuse seven plan records and the claims matrix."
  - "The release cadence rule (blocking) has been red for days; a red check that nobody clears teaches that red checks are ignorable."
  - "Update 2026-10-18 (coordinating Claude session, not the critic): at 044f98a the cadence risk above no longer holds (release-cadence ok; v3.11.0 released by M035), and the page served under 3.11.0 is the v3.11.0 artifact (update-2026-10-18-deploy). The version-identity risk is answered on main by ADR 0059, landed by #197 (d4bd97f): a build after its version's tag is served as v<version>+<distance>.g<short> and verify-deploy checks that release state; whether the risk is closed is the critic's re-derivation."
work:
  - id: release-the-backlog
    title: "Ship the overdue minor release through release:prepare, publish and record, so the public version names the served artifact again"
    serves:
      - public-release-verified
      - one-version-authority
    why: "120 releasable commits are public under 3.10.3; project.deploy-often is red."
    evidence: "node scripts/release-cadence.mjs reports on time; npm run release:verify-deploy passes at the release tag; release:record --check passes"
    issue: "R020"
  - id: criterion-on-release-record
    title: "Decide public-release-verified by comparing the served page with the release/v1 record of the version it names (ADR 0057)"
    serves:
      - public-release-verified
      - fatal-deploy-verification
    why: "test:live and verify-deploy both accept an unreleased main commit under a release version."
  - id: build-check-as-evidence
    title: "Name npm run build:check (or a claim whose test runs a real rebuild) as the evidence of deterministic-build"
    serves:
      - deterministic-build
  - id: strict-yaml-records
    title: "Quote the seven plan records and the CLAIMS.yaml note so that a conforming YAML parser reads them"
    serves:
      - majordomus-knows-the-product
