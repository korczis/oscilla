  - id: repeat-click-fallback
    statement: "tests/browser/v3-ui.cjs:1432-1433 falls back to window.OSCILLA.app.experimentsRepeat when the Repeat click throws, and control-census.cjs:1605 counts exp.repeat as driven by delegation to it; exp.select is never clicked."
