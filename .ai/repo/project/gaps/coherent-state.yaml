observations:
  - id: census-link-debt-is-47-not-46
    statement: "The Total Coherence pack says 46 census surfaces have no deep link; measured 47 (25 subviews, 22 dialogs) at all five census commits, each with a deepLinkWhyNot. The pack's figure is refuted. The census holds 94 surfaces (workspace 13, panel 20, subview 32, dialog 22, route 7); 8 have no test; the debt ratchet counts the union, 47 (U075)."
    source: "file:tests/unit/surface-census.json"
  - id: census-unreasoned-links-refuted
    statement: "Refuted: that the 8 untested and 47 unlinked census entries have no issue that decides them or records why. Every unlinked entry carries a deepLinkWhyNot from 8 distinct reasons (22 dialogs share one, U078), the census refuses a null deepLink without a reason of five words or more (surface-census.test.mjs:308-313), and each untested entry names a plan issue that is not DONE."
    source: "test:tests/unit/surface-census.test.mjs"
  - id: census-keyboard-and-records-refuted
    statement: "Refuted in part: '#osc-keyboard is a surface the derivation does not see' (it is route:keyboard, deepLink '#m=playground&kbd=1'; only the dock element has no panel entry) and 'the records route lists only exp' (DOMAIN_KEYS.records holds exp, def and finding; only the sample deepLink uses exp)."
    source: "file:src/js/core/url-state-records.js"
  - id: audition-mislabelled-not-missing
    statement: "Refuted in part: 'the riff audition is in none of the view tables'. It plays through engine.play, the engine emits 'play' and cmp.playing follows, so the audition is counted as 'instrument' in SOURCES and in the workbench outputOwner: mislabelled, not missing (C036)."
    source: "file:src/js/studio/riffs/audition.js"
  - id: storage-claims-refuted
    statement: "Refuted in part: 'STORAGE_KEYS.theme is dead' (vocabulary.test.mjs:84 pins it and storage-inventory.test.mjs:207 uses it as a mutation probe, so removing it is a test change) and 'browser storage only through core/storage.js' (the storage inventory declares ui/app.js as an owner). No issue is planned for either."
    source: "test:tests/unit/storage-inventory.test.mjs"
  - id: synth-insert-announced
    statement: "Refuted: the Synth workspace does not insert its panel silently; it announces it (SYNTH_TEXT.inserted/took) as #329 intended. The finding is kept only for arming the unsaved guard on a plain visit, decided by Q093 and planned as C039."
    source: "file:src/js/synth/ui.js"
  - id: measure-repeat-chain-ui-driven
    statement: "Refuted in scope: the Measure-side save, Repeat and provenance.repeatOf chain is UI-driven at tests/browser/v3-ui.cjs:485-505. The journey gap is narrowed to the Experiments-side Repeat and select (C035); K041 and K168 do not cover it (their titles are the compare chart presentation and the structured graph summary)."
    source: "file:tests/browser/v3-ui.cjs"
  - id: fm-edges-kept-tested
    statement: "Refuted: 'no test shows an FM algorithm change leaves Studio edges unchanged'; tests/unit/studio-node-presets.test.mjs:46-78 proves it for node presets. Not shown: a whole-panel preset leaving the engine-tab nodes alone, and two fm-voice instances independent (K188)."
    source: "test:tests/unit/studio-node-presets.test.mjs"
  - id: f001-not-stamp-lag
    statement: "Refuted: 'F001 is DONE while its PR #253 is open' as an instance of plan-stamp lag; F001 landed in merge train #367 with evidence citing .ai/repo/reviews/367.yaml, and #253 is a stale open PR. The stamp lag that holds (E003, C027, K164, K168, K169, V638 from #413; C021 from #331; E010 from #410) is af's evidence lane and is not planned here."
    source: "file:.ai/repo/project/issues/F001.yaml"
  - id: owner-tables-disagree
    statement: "Who owns the output is decided in three tables that disagree (ui/output-owner.js SOURCES :55-63; visualization/output-owner.js outputOwnerOf on the polled seqPlaying :11, :24-29; midi/ui.js ownedBy :51-57) plus the audition's own refusal; af's Play audit counts five with ui/shortcuts.js SPACE_OWNER. During a level-reference capture MIDI and keys are refused (ui/measure/session.js:460-462) but claimOutput('instrument') returns true and the audition plays."
    source: "file:src/js/ui/output-owner.js"
  - id: no-bus
    statement: "af's Play audit of main 6d5efa89: 8 players start and claim the output through 5 mechanisms, about 12 'is it playing' values exist (cmp.seqPlaying a 150 ms poll with 3 writers), 5 window-level Stop/Escape handlers and 4 history.replaceState writers outside navigation.js; on desktop 8 of 13 workspaces have no working visible Play."
