    source: "command:node scripts/verify-deploy.mjs --commit 044f98a6a3f74ebe4471404eedaea5ec91ce97ae --attempts 2 --delay 5"
  - id: update-2026-10-29-p05-readout-audit
    statement: "Update 2026-10-29, appended by the P05 audit session (not the critic), observed at main b67d1e58 (v3.13.0); the observations above are kept as they were made. A readout audit traced 126 readouts of the Playground, Synthesis, Analyzer, Filter Lab, MEASURE and Studio with an adversarial second pass: 41 defects survived and one is contested; out-of-range, clipped and absent signals are shown as ordinary readings (output ceiling, scope clamp, live RTA, quality bar at the rail, Render WAV), several labels name the wrong quantity or scale, several controls show a value not in effect, and no test binds a readout to its provenance. M073 plans the fixes."
