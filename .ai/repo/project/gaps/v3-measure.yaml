risks:
  - "The v4.0 fixes to V3 truth (C1, D1/D2, D4, W7f) are held by claims no intent reads; a regression of them would leave every criterion of this intent met, as the original defects did."
  - "No acoustic measurement is ever automated, so latency, drift and room noise are untested inputs to a quality model that claims to say how far results can be trusted."
  - "V386 cannot become DONE as written (rc-first is impossible) and its remaining part needs the owner's approval to modify a published release."
