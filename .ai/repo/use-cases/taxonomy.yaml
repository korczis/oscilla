# The categories use cases are filed under: presentation metadata, nothing else. Which use
# cases a category holds is each use case's own `category`; every count, index page and
# facet is derived from that. Add a category here before filing a use case under it.
version: 1

categories:
  - id: adoption
    title: Getting started and adoption
    summary: Bringing the tool into a repository, new or old, without losing what people already wrote.
    order: 10
  - id: continuity
    title: Sessions and handover
    summary: Stopping and resuming work across sessions and workers from durable state.
    order: 20
  - id: workers
    title: Parallel workers
    summary: "Several agents or people on one repository: claimed scopes, overlap, who touched what."
    order: 30
  - id: policy
    title: Policy and enforcement
    summary: Declaring rules, proving they are wired, reproducing a finding.
    order: 40
  - id: completion
    title: Completion and quality gates
    summary: Deciding whether work is finished, with a contract every line of which passes or fails.
    order: 50
  - id: drift
    title: Drift and reconciliation
    summary: Detecting that policy, projections, state and git disagree, and putting them back in step.
    order: 60
  - id: knowledge
    title: Repository knowledge
    summary: What the repository declares about itself, and the plan, searched and validated.
    order: 70
  # OSCILLA Studio (V3.1) acceptance, specification section 14 UC1-UC14. Each use case
  # names the claims of docs/CLAIMS.yaml that prove it; its scenario checks that a
  # guaranteed claim's implementation and test, or a planned claim's specification, are
  # tracked and wired.
  - id: studio
    title: Studio signal programming
    summary: Building, sequencing, automating and measuring with the OSCILLA Studio graph and timeline.
    order: 250
  - id: extension
    title: Extension
    summary: Adding a rule, a command or a use case as data, with the checks that follow from it.
    order: 100

  # OSCILLA product acceptance. Each use case below names the claims of docs/CLAIMS.yaml
  # that prove it; its scenario checks that the claim's implementation and test are
  # tracked and wired, and the named npm script runs the test itself.
  - id: generate
    title: Generating sound
    summary: Tones, sweeps and two-oscillator signals from the signal generator.
    order: 200
  - id: analyse
    title: Seeing and analysing sound
    summary: Waveform, spectrum, spectrogram and the microphone analyzer, all relative and uncalibrated.
    order: 210
  - id: shape
    title: Shaping and synthesis
    summary: Sequencer, filters, envelope and additive synthesis.
    order: 220
  - id: measure
    title: Measuring the playback and capture chain
    summary: Calibration, sweep transfer function, impulse response, band levels and repeats in the V3 Measure workspace, with quality and reasons.
    order: 224
  - id: experiments
    title: Experiments
    summary: Saving, reloading, exporting and comparing recorded measurements in the V3 Experiments workspace.
    order: 226
  - id: share
    title: Export and sharing
    summary: WAV files, configuration files, links and presets.
    order: 230
  - id: run
    title: Running OSCILLA
    summary: The one self-contained page, from file:// or from GitHub Pages.
    order: 240
  - id: about
    title: About the project
    summary: What OSCILLA is, how it was built and where its source lives.
    order: 250
