# Publish OSCILLA to GitHub Pages. The site is dist/index.html, the same file that is committed
# and that CI gated on the pull request, with only its metadata region stamped with this commit
# (scripts/stamp-build.mjs); repository tooling is never served. The deployment is verified
# after deploy-pages and any mismatch fails the workflow (scripts/verify-deploy.mjs).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Committed dist/index.html matches a clean rebuild
        run: npm run build:check
      - run: npm run verify-dist
      - name: Product version and its projections agree
        run: npm run version:check
      - name: Stage the single-file site, stamped with this commit
        run: |
          mkdir -p _site
          # Rewrites ONLY the metadata region (commit, channel production, sourceDate,
          # artifactSha256 of the committed dist); verify-deploy reverses it byte for byte.
          node scripts/stamp-build.mjs dist/index.html _site/index.html --commit "$GITHUB_SHA"
          # Crawler-only share assets: the page never loads them (project.single-file-deliverable).
          cp site/og-image.png site/apple-touch-icon.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the live deployment (fatal)
        # 10 attempts, 10 s apart: normalised live == committed dist, commit == GITHUB_SHA,
        # version == package.json, digest == recomputed, p5 vendor marker, no module script,
        # og:image meta, og-image.png and apple-touch-icon.png byte-equal to site/.
        run: >-
          node scripts/verify-deploy.mjs --url "${{ steps.deployment.outputs.page_url }}"
          --commit "$GITHUB_SHA" --attempts 10 --delay 10
