# Publish OSCILLA to GitHub Pages. The site is dist/index.html, the same file that is committed
# and that CI gated on the pull request, with only its metadata region stamped with this commit
# (scripts/stamp-build.mjs); repository tooling is never served. The deployment is verified
# after deploy-pages and any mismatch fails the workflow (scripts/verify-deploy.mjs). Once the
# page is proven to be the committed dist, the public smoke (tests/browser/live-smoke.cjs, spec
# V3.1 §269-§270) runs against it in chromium, firefox and webkit; a failed check fails the
# workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time, and the smoke is part of the run: a newer deploy waits for it, so the smoke
# always checks the page its own run deployed and verified (a cancelled smoke would hide a
# broken page). The run is bounded by the jobs' timeout-minutes, so a stuck browser cannot hold
# the next deploy for longer than that.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    # The landing's milestone status is the one Majordomus derives (P015, oscilla-43 2026-11-10):
    # the pinned majordomus is installed exactly as ci.yml's knowledge job installs it (same
    # step, same pin, held equal by tests/unit/majordomus-pin-one-source.test.mjs), and
    # OSC_LAB_REQUIRE_MAJORDOMUS makes the landing and verify-deploy fail by name without it
    # rather than fall back to the committed src/data/roadmap.json. The job's budget is the
    # former 10 minutes plus the install's 5.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OSC_LAB_REQUIRE_MAJORDOMUS: '1'
      MJ_VERSION: 1.0.0
      MJ_TARGET: x86_64-unknown-linux-gnu
      MJ_SHA256: 0fc3f6ad9ef2c4f1b5ff8454f6d6373d1b9d1c4732822ca5d06c4ce6c65cdd6e
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history and tags: the stamp and verify-deploy read where this commit stands
      # relative to the tag of its version (ADR 0059), and a shallow clone cannot tell.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Majordomus ${{ env.MJ_VERSION }} (pinned version and digest)
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          a="majordomus-v${MJ_VERSION}-${MJ_TARGET}.tar.gz"
          # The public download URL first; where it fails (the pinned release's returned 504 for hours on
          # 2026-11-08 while the API served the same asset), the same asset of the same tag and
          # repository through the API, three bounded attempts. Either way the digest decides.
          if ! curl -fsSL --proto '=https' --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            -o "$RUNNER_TEMP/$a" \
            "https://github.com/korczis/prismatic-majordomus/releases/download/v${MJ_VERSION}/$a"; then
            echo "::warning::the release download URL failed; fetching $a through the GitHub API"
            for i in 1 2 3; do
              timeout 60 gh release download "v${MJ_VERSION}" -R korczis/prismatic-majordomus \
                -p "$a" -D "$RUNNER_TEMP" --clobber && break
              [ "$i" = 3 ] && exit 1
              sleep 5
            done
          fi
          echo "${MJ_SHA256}  $RUNNER_TEMP/$a" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mj" && tar -xzf "$RUNNER_TEMP/$a" -C "$RUNNER_TEMP/mj"
          echo "$RUNNER_TEMP/mj/majordomus-v${MJ_VERSION}-${MJ_TARGET}/bin" >> "$GITHUB_PATH"
      - name: The installed version is the pinned one
        run: test "$(majordomus version)" = "majordomus ${MJ_VERSION}"
      - name: Committed dist/index.html matches a clean rebuild
        run: npm run build:check
      - run: npm run verify-dist
      - name: Product version and its projections agree
        run: npm run version:check
      - name: Stage the single-file site, stamped with this commit
        run: |
          mkdir -p _site
          # Rewrites ONLY the metadata region (commit, channel production, sourceDate,
          # artifactSha256 of the committed dist, and the release state: tagged, after-tag
          # with its distance, or untagged); verify-deploy reverses it byte for byte. A commit
          # after its version's tag shows <version>+<distance>.g<short>, not the bare version.
          node scripts/stamp-build.mjs dist/index.html _site/index.html --commit "$GITHUB_SHA"
          # Crawler-only share assets: the page never loads them (project.single-file-deliverable).
          cp site/og-image.png site/apple-touch-icon.png _site/
          # The generated Czech landing at /lab/ (owner decision Q107): built from this commit,
          # self-contained, never loaded by the app (project.single-file-deliverable).
          node scripts/landing.mjs --out _site/lab --commit "$GITHUB_SHA" --require-majordomus
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the live deployment (fatal)
        timeout-minutes: 5
        # 10 attempts, 10 s apart: normalised live == committed dist, commit == GITHUB_SHA,
        # version == package.json, release state == git's, digest == recomputed, p5 vendor
        # marker, no module script,
        # og:image meta, og-image.png and apple-touch-icon.png byte-equal to site/, and
        # every lab/ file (index.html, charts, shots) byte-equal to a regeneration at this commit.
        run: >-
          node scripts/verify-deploy.mjs --url "${{ steps.deployment.outputs.page_url }}"
          --commit "$GITHUB_SHA" --attempts 10 --delay 10 --require-majordomus

  smoke:
    # The public smoke of the page deployed and verified above, one browser per job: Firefox
    # needs a PulseAudio null sink to run an AudioContext on the runner, and Chromium's realtime
    # clock stalls behind that sink (ci.yml `suites`), so the sink exists only in the Firefox
    # job. Only that job's browser is installed. The expected version and commit are the ones
    # release:publish verifies (package.json, the deployed commit); the smoke also checks that
    # the page shows the label its stamp's release state gives (verify-deploy checked that
    # state against git above).
    # Measured on ubuntu-latest (run 37511872556, the same steps against the public page): the
    # smoke itself 3.1 s chromium, 5.9 s firefox, 10.8 s webkit; whole jobs 33 s, 53 s, 79 s,
    # mostly the browser install (21 s, 30 s + 7 s sink, 57 s). The legs run in parallel, so
    # the smoke adds about 80 s to a deployment.
    # Installs go through .github/scripts/ci-install.sh like ci.yml's (project.ci-bounded): a
    # slow apt mirror is cut and retried there instead of running into the job's limit. Budgets
    # are per step, as in ci.yml (install 15, Firefox's sink 13, the smoke 5); the job's is
    # their sum, rounded up.
    name: Public smoke (${{ matrix.browser }})
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: .github/scripts/ci-install.sh browser ${{ matrix.browser }}
        timeout-minutes: 15
      - name: Audio sink for headless Firefox (no sound server on the runner)
        if: matrix.browser == 'firefox'
        timeout-minutes: 13
        run: |
          .github/scripts/ci-install.sh apt pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: Public smoke of the deployed page (fatal)
        timeout-minutes: 5
        run: >-
          npm run test:live -- --url "${{ needs.deploy.outputs.page_url }}"
          --expect-version "$(node -p "require('./package.json').version")"
          --expect-commit "$GITHUB_SHA" --browsers ${{ matrix.browser }}
