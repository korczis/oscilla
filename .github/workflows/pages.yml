# Publish OSCILLA to GitHub Pages. The site is exactly dist/index.html, the same file that is
# committed and that CI gated on the pull request; repository tooling is never served.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Committed dist/index.html matches a clean rebuild
        run: npm run build:check
      - run: npm run verify-dist
      - name: Stage the single-file site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          # Crawler-only share assets: the page never loads them (project.single-file-deliverable).
          cp site/og-image.png site/apple-touch-icon.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test the live sub-path
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          sleep 20
          curl -fsSL --retry 5 --retry-delay 10 -o live.html "$url"
          grep -q 'data-vendor="p5@' live.html
          ! grep -q 'type="module"' live.html
          cmp -s live.html dist/index.html || echo "::warning::live page differs from dist (CDN propagation?)"
          grep -q "<meta property=\"og:image\" content=\"${url}og-image.png\">" live.html
          curl -fsSL --retry 5 --retry-delay 10 -o og.png -w '%{content_type}\n' "${url}og-image.png" | grep -q '^image/png'
          cmp -s og.png site/og-image.png || echo "::warning::live preview differs from site/og-image.png"
