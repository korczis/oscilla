# Release gate for every pull request. Branch protection requires the `gate` job, so a PR
# with auto-merge enabled lands on main (and redeploys Pages) only after this passes.
#
# The suites of `npm run release-gate` run as parallel jobs and `gate` aggregates them: the
# serial gate measured 519 s (engine 167 s + browser 287 s + browser install 43 s), and the dsp,
# labs, sequencer and visual suites add about 100 s more; split, the wall time is the slowest
# job (about 4 min). Every job runs the same npm scripts as the local release-gate, the browser
# legs (leg-1, leg-2) the same suites dealt over runners (test:leg, tests/browser/lib/shards.cjs);
# matrix legs narrow the browsers with OSC_BROWSERS. A failed leg's summary names the suite;
# `gate` names the job.
#
# Playwright browsers are not cached: in the measured install step the apt dependencies took
# 28 s (not cacheable by a browser cache) and the downloads of all three browsers 13 s, about
# what restoring a 600 MB cache costs, so a cache would not measurably help.
#
# Budgets are per step: the browser install gets 15 minutes, Firefox's PulseAudio install 13,
# and the suite steps keep the budget their job used to have (5 minutes each for DSP, labs and
# sequencer, which share one job); the job timeout is the sum, rounded up. A slow
# apt mirror once took 827 s to install WebKit's dependencies (run 37532638670; 20-54 s usually),
# and the job's 15 minutes ran out 75 s into a healthy engine suite, which then looked like a
# hang in the check it had just started. Installs go through .github/scripts/ci-install.sh:
# apt and the browser download are each bounded and retried once (the apt retry against the next
# mirror), with the measurements in its header. A failed install fails its step, a stalled suite
# its own step, and the engine suite names a stalled check itself well before either.
#
# E026, path gating: the account runs about 20 jobs at a time and a full run of this workflow
# is 20 jobs, so every pull request used to cost a whole CI round. The `changes` job asks the
# BASE branch's .github/scripts/ci-changes.mjs whether the pull request changes anything the
# browser and visual legs could observe. Only when every changed path is a regular file under
# .ai/repo/project/, .ai/repo/reviews/, .ai/repo/releases/, .ai/repo/adrs/,
# .ai/repo/knowledge/ (E055), docs/ or a top-level *.md (and at least one path changed) in a
# pull request into main is the answer `runtime=false` (a train
# or stacked base runs everything: the head's `gate` would satisfy main's required check too),
# and then the browser legs (leg-1, leg-2) and the visual job are skipped;
# anything else, an empty diff, an error or a missing answer runs them (fail closed). unit, knowledge, fail-first and review-verdict always
# run: the plan, knowledge and build:check tests guard what a non-runtime change can break.
# `gate` accepts a skipped job only when it is one of those three and `changes` succeeded with
# `runtime=false`. ci.yml is started by pull_request and merge_group only (project.ci-bounded
# v2, `triggers`), so nothing on main is path-gated here; on merge_group the classifier judges
# the queued pull request by HEAD^1..HEAD, the queue's merge of it (ADR 0083), and it answers
# runtime for any other event.
# Tested by tests/unit/ci-changes.test.mjs.
name: CI

# pull_request and merge_group only (project.ci-bounded v2, `triggers`; ADR 0083): a pull
# request is judged on its own branch, then again in the merge queue on main plus the pull
# requests ahead of it, which is the tree that lands. The fail-first and review-verdict jobs
# judge a pull request in both: on merge_group the one the queue ref names
# (gh-readonly-queue/main/pr-<N>-<sha>). A manual run would have none to judge while its `gate`
# landed on the same commit as the required check, so it stays excluded.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

# `shell: bash` runs with -eo pipefail, so a suite piped through tee still fails its step.
defaults:
  run:
    shell: bash

# A newer push to a pull request cancels its older run; a merge-queue run is never cancelled (a
# cancelled group drops out of the queue), and every queue entry has its own ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # Full history and tags: tests/unit/about.test.mjs checks the About timeline's commit times
    # against git and every published v*.*.0 tag against its station, and fails rather than
    # skips under CI without them (a full checkout measured 4 s against 2 s shallow, in the
    # knowledge job).
    name: unit, build, artifact rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and freeze suites
        run: npm test
      - name: One product version (package.json) everywhere, no hard-coded copies
        run: npm run version:check
      - name: Committed dist/index.html matches a clean rebuild
        run: npm run build:check
      - name: Artifact rules (single file, no runtime fetch, licence notices, budget)
        run: npm run verify-dist
      # E009: the raw and gzip size of dist/index.html, the headroom to the budget and the
      # change from the merge base's build, in the step summary. It reports and never fails on
      # a size (verify-dist holds the budget); it reads both builds from git, and the full
      # history above holds the base branch. E022: it runs unless the run was cancelled, so a
      # pull request over the budget, failing on verify-dist, still gets its size summary.
      - name: Size of dist/index.html against the budget and the merge base (step summary)
        if: ${{ !cancelled() }}
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_ref }}
        timeout-minutes: 2
        run: |
          node scripts/size-report.mjs --base-branch "origin/${GITHUB_BASE_REF:-${QUEUE_BASE#refs/heads/}}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  changes:
    # E026: the program that classifies is the base branch's copy, extracted as one blob before
    # anything of the pull request runs (setup-node first, so it reads no file of the checkout).
    # A pull request that edits the allowlist is classified by the allowlist it found, and as
    # .github/ is runtime-relevant, that classification runs everything. A base without the
    # classifier (the pull request that introduces it) answers runtime=true with a warning and
    # runs no copy at all, so no pull request is ever skipped by a program it carries. The base
    # is named by its full ref, so a tag called origin/<base> cannot stand in for it (#255, R2).
    # Full history, so the merge base is in the clone. On merge_group the base is the queue's
    # base_ref and the classifier itself diffs HEAD^1..HEAD (ADR 0083): the command line is the
    # same on both events, so a base copy that knows only pull_request answers runtime=true.
    name: changes (does the pull request touch a runtime path)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed paths with the base branch's classifier
        id: classify
        timeout-minutes: 2
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_ref }}
        run: |
          name="${GITHUB_BASE_REF:-${QUEUE_BASE#refs/heads/}}"
          name_ok='^[A-Za-z0-9._/-]+$'
          [[ "$name" =~ $name_ok ]] || { echo "::error::ci-changes: no base branch"; exit 1; }
          base="refs/remotes/origin/$name"
          prog=.github/scripts/ci-changes.mjs
          judge="$RUNNER_TEMP/ci-changes.mjs"
          git show-ref --verify --quiet "$base"
          if git cat-file -e "$base:$prog" 2> /dev/null; then
            git cat-file blob "$base:$prog" > "$judge"
            echo "ci-changes: $prog of $base ($(git rev-parse --short=12 "$base")) classifies"
            node "$judge" --repo . --event "$GITHUB_EVENT_NAME" --head HEAD \
              --base-branch "$base" --output "$GITHUB_OUTPUT"
          else
            echo "::warning::ci-changes: $base has no $prog; runtime=true, everything runs"
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          fi

  leg-1:
    # ci-speed (2026-11-09): every browser suite of `npm run test:release` but the visual gate
    # (test:engine, dsp, labs, sequencer, measure, studio, synth, browser, census) runs in one of
    # these legs, per browser: tests/browser/lib/shards.cjs reads the suites from package.json
    # and deals them over LEGS[browser] legs by their measured seconds
    # (tests/browser/shard-weights.json). A suite declared `suite-pace: shared` runs two at a
    # time on the 4-vCPU runner (OSC_SUITE_JOBS); one declared `solo` (it judges the realtime
    # output or the audio clock against a deadline) runs alone, after them. Every suite runs
    # whatever the one before returned (lib/run-suites.cjs); the census is dealt over two
    # processes by --part. tests/unit/browser-shards.test.mjs holds every suite of every
    # browser to exactly one leg and these matrices to LEGS: two legs a browser, six jobs, one
    # round on the six hosted jobs the account keeps for OSCILLA (Q102). They replace six jobs a
    # browser (engine, suites, measure, studio, browser, census), whose work measured 58 job-min
    # chromium, 88 firefox, 97 webkit one by one (runs 42513898661, 42509049766, 42520947188,
    # 42522764794), each job adding its setup again. Firefox keeps the PulseAudio null sink its
    # AudioContext needs on the runner, while Chromium's realtime clock stalls behind that sink,
    # so each browser has its own legs.
    name: Browser leg 1 (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    runs-on: ubuntu-24.04
    # the sum of the step limits (15 + 13 + 70), rounded up (project.ci-bounded)
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      OSC_BROWSERS: ${{ matrix.browser }}
      OSC_LEG: 1
      OSC_SUITE_JOBS: 2
      # a suite's own bound in run-suites: two at a time slow each, and integration-map alone
      # took 735 s in WebKit, near the 20-minute default
      OSC_SUITE_MS: 1800000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: .github/scripts/ci-install.sh browser ${{ matrix.browser }}
        timeout-minutes: 15
      - name: Audio sink for headless Firefox (no sound server on the runner)
        if: matrix.browser == 'firefox'
        timeout-minutes: 13
        run: |
          .github/scripts/ci-install.sh apt pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: Leg 1 of the browser's release-gate suites, file:// and /oscilla/
        # a leg measures 29-52 min one by one by the weights (shards.cjs --plan); its shared
        # suites two at a time it should take less, and the bound leaves room for a slow runner
        run: mkdir -p logs && npm run test:leg 2>&1 | tee logs/leg-1-${{ matrix.browser }}.log
        timeout-minutes: 70
      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-leg-1-${{ matrix.browser }}
          path: logs/
          retention-days: 14

  leg-2:
    name: Browser leg 2 (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    runs-on: ubuntu-24.04
    # the sum of the step limits (15 + 13 + 70), rounded up (project.ci-bounded)
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      OSC_BROWSERS: ${{ matrix.browser }}
      OSC_LEG: 2
      OSC_SUITE_JOBS: 2
      # a suite's own bound in run-suites: two at a time slow each, and integration-map alone
      # took 735 s in WebKit, near the 20-minute default
      OSC_SUITE_MS: 1800000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: .github/scripts/ci-install.sh browser ${{ matrix.browser }}
        timeout-minutes: 15
      - name: Audio sink for headless Firefox (no sound server on the runner)
        if: matrix.browser == 'firefox'
        timeout-minutes: 13
        run: |
          .github/scripts/ci-install.sh apt pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: Leg 2 of the browser's release-gate suites, file:// and /oscilla/
        # a leg measures 29-52 min one by one by the weights (shards.cjs --plan); its shared
        # suites two at a time it should take less, and the bound leaves room for a slow runner
        run: mkdir -p logs && npm run test:leg 2>&1 | tee logs/leg-2-${{ matrix.browser }}.log
        timeout-minutes: 70
      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-leg-2-${{ matrix.browser }}
          path: logs/
          retention-days: 14

  visual:
    name: Visual regression gate
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The accepted linux-x64 values in tests/visual/baseline.json were measured in this image
    # (system-ui renders differently on a bare runner). Its tag must equal the lockfile's
    # Playwright version (checked below); bump both together and re-accept the baseline.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Container image matches the lockfile's Playwright
        run: |
          want="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          test "$want" = "1.63.0" || { echo "lockfile playwright $want, image v1.63.0"; exit 1; }
      - name: 1536x1024 --play scene, the MEASURE, STUDIO and SYN references against the accepted baselines
        run: npm run test:visual
        timeout-minutes: 8
      - name: Upload current, reference, diff and report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-gate
          path: |
            tests/visual/out-gate/
            tests/visual/out-measure/
            tests/visual/out-studio/
            tests/visual/out-synth/
          retention-days: 14

  knowledge:
    # The .ai/ layer, checked by the same `majordomus doctor` the pre-commit hook and
    # `npm run verify` run locally, at a pinned release: the archive is downloaded from the
    # release and checked against its SHA-256 here (the digest of the MJ_VERSION release's x86_64
    # Linux glibc archive in its SHA256SUMS and its record .ai/repo/releases/v<MJ_VERSION>.yaml in
    # korczis/prismatic-majordomus), so neither the installer script nor the latest release can
    # change what CI runs. Bump the version and the digest together, here only: the version is
    # written nowhere else in .github/ (tests/unit/majordomus-pin-one-source.test.mjs, R049).
    # The verdict is .github/doctor-verdict.jq (tested by tests/unit/ci-knowledge-job.test.mjs):
    # every doctor FAIL fails the job except the git-hook wiring entries of policy
    # `enforcement`, which describe a developer checkout's hooks that a CI runner does not
    # have; a line saying the policy lacks a required key fails at any level, and so does an
    # output without an OK layout line.
    # The download retries, so one transient asset error does not stall every merge. Full
    # history, because curated knowledge cites V1 commits and the ADR check reads every ref.
    name: .ai layer (majordomus doctor, the pinned release)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MJ_VERSION: 1.0.1
      MJ_TARGET: x86_64-unknown-linux-gnu
      MJ_SHA256: 524adfd3f2a3fdb3314f53f8c134e4050be5f9ebc31018b70fa9c7d5a940ae77
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Majordomus ${{ env.MJ_VERSION }} (pinned version and digest)
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          a="majordomus-v${MJ_VERSION}-${MJ_TARGET}.tar.gz"
          # The public download URL first; where it fails (the pinned release's returned 504 for hours on
          # 2026-11-08 while the API served the same asset), the same asset of the same tag and
          # repository through the API, three bounded attempts. Either way the digest decides.
          if ! curl -fsSL --proto '=https' --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            -o "$RUNNER_TEMP/$a" \
            "https://github.com/korczis/prismatic-majordomus/releases/download/v${MJ_VERSION}/$a"; then
            echo "::warning::the release download URL failed; fetching $a through the GitHub API"
            for i in 1 2 3; do
              timeout 60 gh release download "v${MJ_VERSION}" -R korczis/prismatic-majordomus \
                -p "$a" -D "$RUNNER_TEMP" --clobber && break
              [ "$i" = 3 ] && exit 1
              sleep 5
            done
          fi
          echo "${MJ_SHA256}  $RUNNER_TEMP/$a" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mj" && tar -xzf "$RUNNER_TEMP/$a" -C "$RUNNER_TEMP/mj"
          echo "$RUNNER_TEMP/mj/majordomus-v${MJ_VERSION}-${MJ_TARGET}/bin" >> "$GITHUB_PATH"
      - name: The installed version is the pinned one
        run: test "$(majordomus version)" = "majordomus ${MJ_VERSION}"
      - name: majordomus doctor (git-hook wiring excepted)
        run: |
          set +e; majordomus doctor --json > doctor.jsonl; code=$?; set -e
          jq -r 'select(.level == "FAIL" or .level == "WARN")
            | "\(.level) \(.category) \(.subject): \(.message)"' doctor.jsonl
          case "$code" in 0|10) ;; *) echo "::error::majordomus doctor exited $code"; exit 1 ;; esac
          jq -e -s -f .github/doctor-verdict.jq doctor.jsonl > /dev/null \
            || { echo "::error::majordomus doctor: a failure (listed above), or no OK layout"; exit 1; }

  fail-first:
    # project.fail-first: for a PR whose title starts with feat or fix, the unit test files it
    # adds or changes must fail on the merge base's tree and pass on the head's
    # (scripts/fail-first.mjs, tested by tests/unit/fail-first.test.mjs), unless the PR body
    # carries `fail-first: n/a <reason>`, which the step prints. Title and body are read from
    # the PR as it is now, not from the event, so re-running the job after editing the body is
    # enough. A train (head branch train/..., or a `train`/`Merge train` title) is judged by the
    # member table of its body; any other title passes with nothing to prove. The program that
    # judges is the base branch's copy (.github/scripts/base-rule.sh), not the one this pull
    # request carries.
    name: fail-first (feat/fix tests fail without the change)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The PR's added or changed unit tests fail on the merge base
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_ref }}
        run: |
          # In the merge queue the pull request is the one the queue ref names (pr-<N>-<sha>, the
          # <sha> being the entry's base, HEAD^1), HEAD must be the queue's merge commit onto that
          # base, and HEAD^2 the pull request's head (--check-head, after gh pr view; ADR 0083:
          # merge method MERGE); the assignment fails the step on the script's exit 2, which `eval "$(...)"`
          # would throw away.
          vars="$(.github/scripts/queued-pr.sh)"; eval "$vars"
          if [ -z "$PR" ]; then echo "::error::fail-first: no pull request to judge"; exit 1; fi
          n=0
          until gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,headRefName,headRefOid > "$RUNNER_TEMP/pr.json"; do
            n=$((n + 1)); [ "$n" -lt 3 ] || { echo "::error::could not read PR $PR"; exit 1; }
            sleep 10
          done
          .github/scripts/queued-pr.sh --check-head "$QUEUED_HEAD" "$RUNNER_TEMP/pr.json"
          [ -n "$HEAD_SHA" ] || HEAD_SHA="$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")"
          .github/scripts/base-rule.sh "origin/$BASE" scripts/fail-first.mjs \
            --pr-json "$RUNNER_TEMP/pr.json" --head "$HEAD_SHA" \
            --base-branch "origin/$BASE"

  review-verdict:
    # project.review-verdict: a PR that changes a guarded path (the audio, analysis, experiments
    # and studio modules, core/storage*, scripts/release-*, all of .github/, and the programs
    # and tests of the three process rules: GUARDED in scripts/review-verdict.mjs) needs
    # .ai/repo/reviews/<pr>.yaml: `verdict: merge`, the reviewer session, the content it
    # reviewed and no open P0 or P1 finding (scripts/review-verdict.mjs, tested by
    # tests/unit/review-verdict.test.mjs). `content` is a SHA-256 over the guarded paths the PR
    # changes against its merge base, so committing the verdict, a commit outside the guarded
    # paths and a merge of main that leaves those paths alone all keep it, and a change to one
    # of them does not. What is judged is HEAD of this checkout: the pull request as GitHub
    # merged it with the base branch for this run, so a base that changed one of the PR's
    # guarded files since the review is seen here. Any other PR passes without a verdict. The
    # script needs no dependency, so nothing is installed. The program that judges, and so the
    # guarded list, is the base branch's copy (.github/scripts/base-rule.sh): a pull request
    # that edits the list is judged by the list it found. A train (a train/... branch, a train
    # title, or a body with a `| member | what |` table) is also judged by its members' own
    # verdicts: each that exists says merge, or the train's verdict judges that member under
    # `members:` (#303 rode #367 at `changes`). Title, body and head branch are read from the PR
    # as it is now and handed over in PR_JSON, not as an argument, so the base branch's copy is
    # called with the same command line whichever arguments it knows.
    name: review-verdict (guarded paths need a recorded review)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: A guarded change carries a verdict for the content it changes
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_ref }}
          PR_JSON: ${{ runner.temp }}/pr.json
        run: |
          # In the merge queue the pull request is the one the queue ref names (pr-<N>-<sha>);
          # HEAD is the queue's merge of it onto HEAD^1 (main plus the pull requests ahead), so
          # the content judged is HEAD^1..HEAD, as a pull_request run judges its merge commit. That
          # is the whole pull request only for the queue's merge commit of its head (merge method
          # MERGE, grouping ALLGREEN): queued-pr.sh refuses a HEAD without two parents or whose
          # HEAD^1 is not the base the ref's <sha> names (DIFF_BASE is that sha), and --check-head
          # a HEAD^2 that is not the pull request's head. Assigned first, so exit 2 fails the step.
          vars="$(.github/scripts/queued-pr.sh)"; eval "$vars"
          if [ -z "$PR" ]; then echo "::error::review-verdict: no pull request to judge"; exit 1; fi
          n=0
          until gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,headRefName,headRefOid > "$PR_JSON"; do
            n=$((n + 1)); [ "$n" -lt 3 ] || { echo "::error::could not read PR $PR"; exit 1; }
            sleep 10
          done
          .github/scripts/queued-pr.sh --check-head "$QUEUED_HEAD" "$PR_JSON"
          .github/scripts/base-rule.sh "origin/$BASE" scripts/review-verdict.mjs \
            --pr "$PR" --head HEAD --base-branch "$DIFF_BASE"

  gate:
    # The required check. Every job it judges succeeded, or (E026) is one of the three path-gated
    # jobs and was skipped while `changes` succeeded with runtime=false. A skip for any other
    # reason, a cancelled or failed job, and a failed or silent `changes` fail it. It needs
    # flake-ledger too (gate-needs: every job), and the verdict drops that job's entry before
    # it judges anything: the ledger reports and never decides the gate, and its skip on a
    # first attempt is neither a path-gated skip nor tied to `changes`
    # (tests/unit/flake-ledger.test.mjs runs the verdict below with every result of it). It
    # runs the verdict and nothing else, because a step of this job that fails fails the check
    # whatever the verdict, and project.ci-bounded forbids continue-on-error.
    name: gate
    if: always()
    needs: [unit, knowledge, fail-first, review-verdict, changes, leg-1, leg-2, visual, flake-ledger]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every release-gate job passed, or was skipped for a non-runtime change
        env:
          RESULTS: ${{ toJSON(needs) }}
          VERDICT: >-
            (.changes.result == "success" and .changes.outputs.runtime == "false") as $nonruntime
            | to_entries
            | map(select(.key != "flake-ledger"))
            | all(.value.result == "success"
                or ($nonruntime and .value.result == "skipped"
                    and (.key as $k
                         | ["leg-1", "leg-2", "visual"]
                         | any(. == $k))))
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e "$VERDICT" > /dev/null \
            || { echo "::error::release gate failed: a required job did not succeed"; exit 1; }

  flake-ledger:
    # E010: on a re-run (github.run_attempt above 1), once every job the gate judges has
    # finished, passed or not, record the flake ledger: every job whose last earlier run in
    # this run failed and which passed on this attempt (scripts/flake-ledger.mjs, tested by
    # tests/unit/flake-ledger.test.mjs), in the step summary and the artifact
    # flake-ledger-<attempt>. It reads the attempts' jobs from the API (actions: read), each
    # request bounded and retried. Its own job, so a failure here is a red non-required check
    # and never the gate's; on a first attempt it is skipped.
    name: flake ledger (checks that passed only on a re-run)
    if: ${{ always() && fromJSON(github.run_attempt) > 1 }}
    needs: [unit, knowledge, fail-first, review-verdict, changes, leg-1, leg-2, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Flake ledger (checks that failed on an earlier attempt and passed now)
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/flake-ledger.mjs --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --out flake-ledger.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the flake ledger
        if: ${{ hashFiles('flake-ledger.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: flake-ledger-${{ github.run_attempt }}
          path: flake-ledger.json
          retention-days: 90
