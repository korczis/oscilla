# Release gate for every pull request. Branch protection requires the `gate` job, so a PR
# with auto-merge enabled lands on main (and redeploys Pages) only after this passes.
#
# The suites of `npm run release-gate` run as parallel jobs and `gate` aggregates them: the
# serial gate measured 519 s (engine 167 s + browser 287 s + browser install 43 s), and the dsp,
# labs, sequencer and visual suites add about 100 s more; split, the wall time is the slowest
# job (about 4 min). Every job runs the same npm scripts as the local release-gate; matrix legs
# narrow the browsers with OSC_BROWSERS. A failed job names the suite; `gate` names the job.
#
# Playwright browsers are not cached: in the measured install step the apt dependencies took
# 28 s (not cacheable by a browser cache) and the downloads of all three browsers 13 s, about
# what restoring a 600 MB cache costs, so a cache would not measurably help.
#
# Budgets are per step: the browser install gets 15 minutes, Firefox's PulseAudio install 13,
# and the suite steps keep the budget their job used to have (5 minutes each for DSP, labs and
# sequencer, which share one job); the job timeout is the sum, rounded up. A slow
# apt mirror once took 827 s to install WebKit's dependencies (run 37532638670; 20-54 s usually),
# and the job's 15 minutes ran out 75 s into a healthy engine suite, which then looked like a
# hang in the check it had just started. Installs go through .github/scripts/ci-install.sh:
# apt and the browser download are each bounded and retried once (the apt retry against the next
# mirror), with the measurements in its header. A failed install fails its step, a stalled suite
# its own step, and the engine suite names a stalled check itself well before either.
name: CI

# pull_request only (project.ci-bounded, `triggers`): the fail-first and review-verdict jobs
# judge a pull request, and a manual run on a PR's branch would have none to judge while its
# `gate` landed on the same commit as the required check.
on:
  pull_request:

permissions:
  contents: read

# `shell: bash` runs with -eo pipefail, so a suite piped through tee still fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Full history and tags: tests/unit/about.test.mjs checks the About timeline's commit times
    # against git and every published v*.*.0 tag against its station, and fails rather than
    # skips under CI without them (a full checkout measured 4 s against 2 s shallow, in the
    # knowledge job).
    name: unit, build, artifact rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and freeze suites
        run: npm test
      - name: One product version (package.json) everywhere, no hard-coded copies
        run: npm run version:check
      - name: Committed dist/index.html matches a clean rebuild
        run: npm run build:check
      - name: Artifact rules (single file, no runtime fetch, licence notices, budget)
        run: npm run verify-dist

  engine:
    name: V1 engine checks (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      OSC_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: .github/scripts/ci-install.sh browser ${{ matrix.browser }}
        timeout-minutes: 15
      - name: Audio sink for headless Firefox (no sound server on the runner)
        if: matrix.browser == 'firefox'
        timeout-minutes: 13
        run: |
          .github/scripts/ci-install.sh apt pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: V1 engine checks against the V2 engine
        run: mkdir -p logs && npm run test:engine 2>&1 | tee logs/engine-${{ matrix.browser }}.log
        timeout-minutes: 15
      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-engine-${{ matrix.browser }}
          path: logs/
          retention-days: 14

  suites:
    # Per browser: Firefox needs a PulseAudio null sink to run an AudioContext on the runner,
    # while Chromium's realtime clock stalls behind that sink, so each gets its own job.
    name: DSP, labs, sequencer (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      OSC_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser
        run: .github/scripts/ci-install.sh browser ${{ matrix.browser }}
        timeout-minutes: 15
      - name: Audio sink for headless Firefox (no sound server on the runner)
        if: matrix.browser == 'firefox'
        timeout-minutes: 13
        run: |
          .github/scripts/ci-install.sh apt pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: DSP modules
        shell: bash
        run: mkdir -p logs && npm run test:dsp 2>&1 | tee logs/dsp.log
        timeout-minutes: 5
      - name: Chart renderers and lab controllers
        shell: bash
        run: npm run test:labs 2>&1 | tee logs/labs.log
        timeout-minutes: 5
      - name: Pattern sequencer on real Web Audio
        shell: bash
        run: npm run test:sequencer 2>&1 | tee logs/sequencer.log
        timeout-minutes: 5
      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-suites-${{ matrix.browser }}
          path: logs/
          retention-days: 14

  measure:
    # V3: the measurement engine on real Web Audio (v3-measure.cjs) and the MEASURE /
    # EXPERIMENTS workspaces of dist (v3-ui.cjs), one browser per job like the browser gate.
    name: V3 measurement and UI (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      OSC_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: .github/scripts/ci-install.sh browser ${{ matrix.browser }}
        timeout-minutes: 15
      - name: Audio sink for headless Firefox (no sound server on the runner)
        if: matrix.browser == 'firefox'
        timeout-minutes: 13
        run: |
          .github/scripts/ci-install.sh apt pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: Measurement engine and MEASURE / EXPERIMENTS UI, file:// and /oscilla/
        run: mkdir -p logs && npm run test:measure 2>&1 | tee logs/measure-${{ matrix.browser }}.log
        timeout-minutes: 20
      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-measure-${{ matrix.browser }}
          path: logs/
          retention-days: 14

  studio:
    # V3.1: the STUDIO workspace, graph editor, timeline, transport and automation editors of dist
    # (v31-studio-graph.cjs, v31-studio-timeline.cjs), one browser per job like the measure gate.
    name: V3.1 Studio UI (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      OSC_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: .github/scripts/ci-install.sh browser ${{ matrix.browser }}
        timeout-minutes: 15
      - name: Audio sink for headless Firefox (no sound server on the runner)
        if: matrix.browser == 'firefox'
        timeout-minutes: 13
        run: |
          .github/scripts/ci-install.sh apt pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: STUDIO workspace, graph and timeline editors, file:// and /oscilla/
        run: mkdir -p logs && npm run test:studio 2>&1 | tee logs/studio-${{ matrix.browser }}.log
        timeout-minutes: 15
      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-studio-${{ matrix.browser }}
          path: logs/
          retention-days: 14

  browser:
    name: Browser gate (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      OSC_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: .github/scripts/ci-install.sh browser ${{ matrix.browser }}
        timeout-minutes: 15
      - name: Audio sink for headless Firefox (no sound server on the runner)
        if: matrix.browser == 'firefox'
        timeout-minutes: 13
        run: |
          .github/scripts/ci-install.sh apt pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: dist from file:// and the /oscilla/ sub-path; layout, touch targets, stop
        run: mkdir -p logs && npm run test:browser 2>&1 | tee logs/browser-${{ matrix.browser }}.log
        timeout-minutes: 15
      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-browser-${{ matrix.browser }}
          path: logs/
          retention-days: 14

  visual:
    name: Visual regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The accepted linux-x64 values in tests/visual/baseline.json were measured in this image
    # (system-ui renders differently on a bare runner). Its tag must equal the lockfile's
    # Playwright version (checked below); bump both together and re-accept the baseline.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Container image matches the lockfile's Playwright
        run: |
          want="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          test "$want" = "1.63.0" || { echo "lockfile playwright $want, image v1.63.0"; exit 1; }
      - name: 1536x1024 --play scene, the MEASURE and STUDIO references against the accepted baselines
        run: npm run test:visual
        timeout-minutes: 8
      - name: Upload current, reference, diff and report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-gate
          path: |
            tests/visual/out-gate/
            tests/visual/out-measure/
            tests/visual/out-studio/
          retention-days: 14

  knowledge:
    # The .ai/ layer, checked by the same `majordomus doctor` the pre-commit hook and
    # `npm run verify` run locally, at a pinned release: the archive is downloaded from the
    # release and checked against its SHA-256 here (the digest of v0.13.2's x86_64 Linux glibc
    # archive in https://majordomus.dev/releases/v0.13.2.json), so neither the installer script
    # nor the latest release can change what CI runs. Bump the version and the digest together.
    # The verdict is .github/doctor-verdict.jq (tested by tests/unit/ci-knowledge-job.test.mjs):
    # every doctor FAIL fails the job except the two git-hook wiring entries of policy
    # `enforcement` (doctor-on-commit, finish-on-push), which describe a developer checkout's
    # hooks that a CI runner does not have, and an output without an OK layout line fails.
    # The download retries, so one transient asset error does not stall every merge. Full
    # history, because curated knowledge cites V1 commits and the ADR check reads every ref.
    name: .ai layer (majordomus doctor 0.13.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MJ_VERSION: 0.13.2
      MJ_TARGET: x86_64-unknown-linux-gnu
      MJ_SHA256: 60280e182b2d581969bc603a5b1230d67932fa8e82f7a7e39a6c0dea741a1c3f
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Majordomus ${{ env.MJ_VERSION }} (pinned version and digest)
        timeout-minutes: 5
        run: |
          a="majordomus-v${MJ_VERSION}-${MJ_TARGET}.tar.gz"
          curl -fsSL --proto '=https' --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            -o "$RUNNER_TEMP/$a" \
            "https://github.com/korczis/prismatic-majordomus/releases/download/v${MJ_VERSION}/$a"
          echo "${MJ_SHA256}  $RUNNER_TEMP/$a" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mj" && tar -xzf "$RUNNER_TEMP/$a" -C "$RUNNER_TEMP/mj"
          echo "$RUNNER_TEMP/mj/majordomus-v${MJ_VERSION}-${MJ_TARGET}/bin" >> "$GITHUB_PATH"
      - name: The installed version is the pinned one
        run: test "$(majordomus version)" = "majordomus ${MJ_VERSION}"
      - name: majordomus doctor (git-hook wiring excepted)
        run: |
          set +e; majordomus doctor --json > doctor.jsonl; code=$?; set -e
          jq -r 'select(.level == "FAIL" or .level == "WARN")
            | "\(.level) \(.category) \(.subject): \(.message)"' doctor.jsonl
          case "$code" in 0|10) ;; *) echo "::error::majordomus doctor exited $code"; exit 1 ;; esac
          jq -e -s -f .github/doctor-verdict.jq doctor.jsonl > /dev/null \
            || { echo "::error::majordomus doctor: a failure (listed above), or no OK layout"; exit 1; }

  fail-first:
    # project.fail-first: for a PR whose title starts with feat or fix, the unit test files it
    # adds or changes must fail on the merge base's tree and pass on the head's
    # (scripts/fail-first.mjs, tested by tests/unit/fail-first.test.mjs), unless the PR body
    # carries `fail-first: n/a <reason>`, which the step prints. Title and body are read from
    # the PR as it is now, not from the event, so re-running the job after editing the body is
    # enough. Any other title passes with nothing to prove. The program that judges is the base
    # branch's copy (.github/scripts/base-rule.sh), not the one this pull request carries.
    name: fail-first (feat/fix tests fail without the change)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The PR's added or changed unit tests fail on the merge base
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$PR" ]; then echo "::error::fail-first: no pull request to judge"; exit 1; fi
          n=0
          until gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body > "$RUNNER_TEMP/pr.json"; do
            n=$((n + 1)); [ "$n" -lt 3 ] || { echo "::error::could not read PR $PR"; exit 1; }
            sleep 10
          done
          .github/scripts/base-rule.sh "origin/$GITHUB_BASE_REF" scripts/fail-first.mjs \
            --pr-json "$RUNNER_TEMP/pr.json" --head "$HEAD_SHA" \
            --base-branch "origin/$GITHUB_BASE_REF"

  review-verdict:
    # project.review-verdict: a PR that changes a guarded path (the audio, analysis, experiments
    # and studio modules, core/storage*, scripts/release-*, all of .github/, and the programs
    # and tests of the three process rules: GUARDED in scripts/review-verdict.mjs) needs
    # .ai/repo/reviews/<pr>.yaml: `verdict: merge`, the reviewer session, the content it
    # reviewed and no open P0 or P1 finding (scripts/review-verdict.mjs, tested by
    # tests/unit/review-verdict.test.mjs). `content` is a SHA-256 over the guarded paths the PR
    # changes against its merge base, so committing the verdict, a commit outside the guarded
    # paths and a merge of main that leaves those paths alone all keep it, and a change to one
    # of them does not. What is judged is HEAD of this checkout: the pull request as GitHub
    # merged it with the base branch for this run, so a base that changed one of the PR's
    # guarded files since the review is seen here. Any other PR passes without a verdict. The
    # script needs no dependency, so nothing is installed. The program that judges, and so the
    # guarded list, is the base branch's copy (.github/scripts/base-rule.sh): a pull request
    # that edits the list is judged by the list it found.
    name: review-verdict (guarded paths need a recorded review)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: A guarded change carries a verdict for the content it changes
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "::error::review-verdict: no pull request to judge"; exit 1; fi
          .github/scripts/base-rule.sh "origin/$GITHUB_BASE_REF" scripts/review-verdict.mjs \
            --pr "$PR" --head HEAD --base-branch "origin/$GITHUB_BASE_REF"

  gate:
    name: gate
    if: always()
    needs: [unit, knowledge, fail-first, review-verdict, engine, suites, measure, studio, browser, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every release-gate job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null \
            || { echo "::error::release gate failed: a required job did not succeed"; exit 1; }
