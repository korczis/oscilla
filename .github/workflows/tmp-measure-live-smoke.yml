# TEMPORARY (removed before merge): measures on a runner what the Pages `smoke` job costs, by
# running the same steps against the current public page.
name: tmp measure live smoke

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: tmp smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Audio sink for headless Firefox (no sound server on the runner)
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: Public smoke of the current page
        run: >-
          npm run test:live -- --url "https://korczis.github.io/oscilla/"
          --expect-version "$(node -p "require('./package.json').version")"
          --browsers ${{ matrix.browser }}
