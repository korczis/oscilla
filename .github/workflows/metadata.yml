# Pull-request metadata (R022, rule project.pr-names-its-plan): every pull request names an
# existing plan record in its title or branch, or waives with `plan: n/a <reason>`; its title
# is conventional; its body carries no closing keyword. The program that judges is the base
# branch's scripts/pr-metadata.mjs (.github/scripts/base-rule.sh), which also writes the
# pull request's plan records, milestone, level, verdict and fail-first state to the step
# summary: the metadata visible before anything projects it onto GitHub.
#
# The model is .ai/repo/ci/pr-meta.yaml (`judge:`), and tests/unit/pr-metadata.test.mjs fails
# when this file departs from it: the triggers, exactly the two read permissions, the job, its
# bound and the last command. It writes nothing, so its token reads only, and the newest run of
# a pull request cancels an older one. `edited` re-judges a changed title or body without
# re-running ci.yml. pull_request only (project.ci-bounded, `triggers`): a run without a pull
# request would have nothing to judge.
#
# Not part of the required `gate`: the owner adds `metadata` to branch protection after it has
# run green on three or more pull requests (owner decision C2). Nothing is installed: the
# program uses Node built-ins and git. Nothing of the pull request runs before the judge, and
# the judge is the base commit's copy, extracted before the checkout's files are read and
# started under `env -i` (rule `judge-first` of scripts/ci-workflow-rules.mjs, review of #255,
# R12, R17-R19).
name: metadata

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

concurrency:
  group: metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # The runner's node, before the checkout: setup-node reads no file of the pull request.
      - uses: actions/setup-node@v7
        timeout-minutes: 1
        with:
          node-version: 22
      # Full history: the base branch's records and program, and the merge base of the diff.
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          fetch-depth: 0
      # The judge, from the base commit, before anything of the pull request runs: the base's
      # base-rule.sh and scripts/ into $RUNNER_TEMP/judge, the commit in .base-commit, and the
      # node setup-node put on PATH (before the checkout, so it read no file of the pull
      # request) as an absolute path. What the job runs later cannot change what this step
      # recorded (#255, R12, R17-R19).
      - name: The judge, taken from the base commit
        id: judge
        timeout-minutes: 1
        run: |
          base="refs/remotes/origin/$GITHUB_BASE_REF"
          sha="$(git show-ref --verify --hash "$base")"
          judge="$RUNNER_TEMP/judge"
          mkdir -p "$judge" "$RUNNER_TEMP/judge-home"
          git archive "$sha" -- .github/scripts/base-rule.sh scripts | tar -x -C "$judge"
          echo "$sha" > "$judge/.base-commit"
          node="$(readlink -f "$(command -v node)")"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "path=$(dirname "$node"):/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_OUTPUT"
          echo "the judge: $base (${sha:0:12}), node $node"
      # Title, body and branch are read from the pull request as it is now (3 tries, 10 s
      # apart), not from the event, so a re-run after an edit judges the edit. The base is named
      # by its full ref, refs/remotes/origin/<base>: a tag named origin/<base>, which the full
      # history fetches, would otherwise answer for it (review of #255, R2). The judge is the
      # extracted copy, started under `env -i` with a fixed PATH and HOME (R12).
      - name: The pull request names its plan record (the base branch's program judges)
        timeout-minutes: 2
        shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "::error::pr-metadata: no pull request to judge"; exit 1; fi
          n=0
          until /usr/bin/env -i PATH="${{ steps.judge.outputs.path }}" \
            HOME="${{ runner.temp }}/judge-home" GH_TOKEN="$GH_TOKEN" \
            gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json title,body,headRefName,number > "${{ runner.temp }}/pr.json"; do
            n=$((n + 1)); [ "$n" -lt 3 ] || { echo "::error::could not read PR $PR"; exit 1; }
            sleep 10
          done
          /usr/bin/env -i PATH="${{ steps.judge.outputs.path }}" \
            HOME="${{ runner.temp }}/judge-home" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            /bin/bash "${{ runner.temp }}/judge/.github/scripts/base-rule.sh" \
            "refs/remotes/origin/$GITHUB_BASE_REF" scripts/pr-metadata.mjs \
            --pr-json "${{ runner.temp }}/pr.json" --head HEAD \
            --base "refs/remotes/origin/$GITHUB_BASE_REF" --check --summary "$GITHUB_STEP_SUMMARY"
